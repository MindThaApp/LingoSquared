  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Das Komparativadjektiv hat für den Vergleich eine feste Form, gefolgt von من: أقرب من heißt „näher als“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Der Komparativ steht zwischen den beiden verglichenen Dingen, und من („als“) steht vor dem zweiten.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das Arabische braucht kein Wort für „ist“: المقهى أصغر من السوق heißt wörtlich „das Café kleiner als der Markt“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson01.fill.005
