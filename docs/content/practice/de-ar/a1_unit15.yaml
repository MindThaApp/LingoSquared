    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Komparative sind kurze arabische Adjektive ohne eigenes Wort für „mehr“; من folgt darauf.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: Das Café ist kleiner als der Markt.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Der Komparativ bleibt in einer Form und wird von من („als“) gefolgt.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: Das Café ist näher als der Markt.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب heißt „näher“, vom Gedanken „nah“ abgeleitet, und wird von من gefolgt.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص heißt „billiger“; es folgt demselben Muster wie die anderen Komparative.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: والسوق verbindet و („und“) mit السوق („der Markt“) in einem geschriebenen Wort.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أرخص heißt „billiger“: الماء أرخص من القهوة bedeutet „Wasser ist billiger als Kaffee“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: „Billiger“ hat dasselbe Steigerungsmuster, gefolgt von من.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das sind vier Komparative: größer, kleiner, näher und billiger.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: Wasser ist billiger als Kaffee.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Der Komparativ steht vor dem zweiten Vergleichsglied mit من: billiger als Kaffee.'
    language_code: de
    direction: ltr
