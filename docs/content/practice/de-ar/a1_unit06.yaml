    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عندي drückt „ich habe“ in einem Wort aus; die Verwandtschaftswörter sind أب, أم, أخ und أخت.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.order.004
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي plus Nomen bedeutet „ich habe“: عندي أخت heißt „Ich habe eine Schwester“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.fill.005
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: fill_in_blank
  frame:
