  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أب heißt Vater und أم heißt Mutter; عندي ist ein einziges Wort und bedeutet „ich habe“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.listen.002
  lesson_content_key: ar.a1.unit06.lesson01.family_members
