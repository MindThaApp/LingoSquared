  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة bedeutet Familie; dasselbe Wort mit einer Possessivendung, عائلتك, folgt in der nächsten Lektion.
    language_code: de
    direction: ltr
