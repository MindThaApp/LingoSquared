    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أخت heißt Schwester; die männliche Entsprechung ist أخ.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.translate.006
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Diese Familienwörter sind Nomen; أب heißt Vater und أم heißt Mutter.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Ich habe eine Schwester.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das Arabische hat keinen unbestimmten Artikel: عندي أخت heißt wörtlich „ich habe Schwester“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.translate.008
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Ich habe einen Bruder.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أخ (Bruder) und أخت (Schwester) unterscheiden sich nur durch das End-ت.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson01.order.009
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item} وأم.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item} وأم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Die Konjunktion و („und“) wird mit dem folgenden Wort verbunden: وأم heißt „und Mutter“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.listen.001
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Die Endung ـك an عائلتك bedeutet „dein/deine“, also ist عائلتك „deine Familie“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.choose.002
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يا steht vor einem Namen, wenn man jemanden anruft oder anspricht, zum Beispiel يا يوسف.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.match.003
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Die Endung ـك bedeutet „dein/deine“: عائلتك ist „deine Familie“ und أختك ist „deine Schwester“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ fragt „Wer gehört zu deiner Familie?“; يا يوسف spricht Yusuf an.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسم bedeutet Name; ما اسم أختك؟ fragt „Wie heißt deine Schwester?“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و („und“) wird an das folgende Wort angeschlossen, deshalb schreibt man „und Mutter“ als وأم.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها besteht aus اسم plus ـها und bedeutet „ihr Name“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'Layla fragt Yusuf: Wie heißt deine Schwester?'
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك wird für einen männlichen und einen weiblichen Angesprochenen gleich geschrieben; hier wird Yusuf angesprochen.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: Sie heißt Nour.
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها besteht aus „Name“ plus ـها („ihr“); ein eigenes Wort für „ist“ ist nicht nötig.
    language_code: de
    direction: ltr
