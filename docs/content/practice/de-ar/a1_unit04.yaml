    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ordnungszahlen wie الخامس (der Fünfte) nehmen ال und sind hier männlich, weil sie sich auf يوم (Tag) beziehen, ein männliches Nomen.
    language_code: de
    direction: ltr
