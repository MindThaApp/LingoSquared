  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {item} من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Ordnungszahlen nehmen ال: الخامس ist der Fünfte und السادس der Sechste.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson02.fill.004
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
