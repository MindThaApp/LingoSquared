    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Wörter nach في verhalten sich wie jedes Nomen: في الدرس bedeutet „im Unterricht“, wobei ال den bestimmten Artikel anzeigt.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson02.translate.007
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Heute ist der fünfte Mai.
    language_code: de
    direction: ltr
  slots:
    a: *id009
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Der Fünfte heißt الخامس und der Sechste السادس; beide sind männlich, weil sie sich auf يوم (Tag) beziehen.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson02.translate.008
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Heute ist der sechste Juni.
    language_code: de
    direction: ltr
  slots:
    a: *id011
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Der Sechste heißt السادس; wie die anderen Ordnungszahlen wird er mit ال am Anfang gebildet.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson01.listen.007
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Monate haben eigene Namen, aber Tag und Monat werden durch من (von) verbunden: الخامس من مايو.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson02.choose.009
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في vor einem Datum bedeutet „an diesem Tag“, und ال kennzeichnet eine Ordnungszahl wie „der Fünfte“ oder „der Sechste“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson02.translate.010
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Der Unterricht ist am fünften Mai.
    language_code: de
    direction: ltr
  slots:
    f: *id008
    d: *id009
    m: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {f} {d} من {m}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Beim Datum des Unterrichts steht في (am) vor der Ordnungszahl: الدرس في الخامس من مايو.'
    language_code: de
    direction: ltr
