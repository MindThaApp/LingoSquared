  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Die Datumsfrage besteht aus ما (was) mit تاريخ (Datum) und اليوم (heute).
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
