templates:
- content_key: practice.de-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Im Arabischen wird der Besitz durch eine Endung ausgedrückt: اسم heißt Name, اسمي mein Name und اسمك dein Name.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson01.match.002
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Die Endung ـي bedeutet mein (اسمي) und ـك dein (اسمك); die geschriebene Form von dein ist für Mann und Frau gleich.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson01.fill.003
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ما bedeutet was, also heißt ما اسمك wörtlich: Was dein Name.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson01.translate.004
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا (ich) steht in einfachen Sätzen wie أنا سارة ohne ein Wort für bin.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson01.translate.005
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: Mein Name ist {item}.
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Namen werden so geschrieben, wie sie klingen: Das Arabische hat keine Großbuchstaben.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson02.choose.001
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ländernamen wie لبنان und مصر stehen ohne Artikel, aber الأردن, المغرب und العراق enthalten ال als Teil des Namens.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson02.match.002
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
