    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson02.order.003
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: word_order
  frame:
    text: أنا من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من bedeutet aus bzw. von, also sagt أنا من plus ein Ort, woher Sie kommen.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: fill_in_blank
  frame:
    text: من {item} أنت؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين ist das Fragewort wo; من أين أنت fragt, woher du kommst, einen Mann wie eine Frau.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson02.translate.005
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Das Wort أنت bedeutet du; ohne Vokalzeichen geschrieben ist es für Mann und Frau gleich.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: Ich komme aus {item}.
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das Arabische hat kein Wort für bin: أنا من plus ein Ort bedeutet schon Ich komme aus.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson03.listen.001
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eine Ja-/Nein-Frage beginnt mit هل, und die Antwort für ja ist نعم.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson03.order.002
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: word_order
  frame:
    text: سعدت {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'سعدت بلقائك ist die höfliche Abschlussformel, wörtlich: Ich habe mich über das Treffen gefreut.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson03.fill.003
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: fill_in_blank
  frame:
    text: هل أنت من مصر؟ {item}، أنا من مصر. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نعم heißt ja; in der Antwort wird kein Fragewort für Ja-/Nein-Fragen gebraucht.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson03.translate.004
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: translation
  frame:
    text: Es hat mich gefreut, dich kennenzulernen.
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Die geschriebene Endung ـك in بلقائك ist für Mann und Frau gleich.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson04.choose.001
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: دائما bedeutet immer und kann auf مرحبا بك folgen, um „jederzeit willkommen“ zu sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson04.fill.002
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: fill_in_blank
  frame:
    text: مرحبا بك {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Der Ausdruck مرحبا بك دائما bedeutet: Du bist immer willkommen.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit02.lesson04.translate.003
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سعدت ist ein Verb in der Vergangenheit mit der Endung ـت für ich; deshalb bedeutet es ich habe mich gefreut.
    language_code: de
    direction: ltr
