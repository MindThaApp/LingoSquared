    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Die Uhrzeit wird mit في الساعة plus einer femininen Ordnungszahl gebildet: الساعة الخامسة.'
    language_code: de
    direction: ltr
