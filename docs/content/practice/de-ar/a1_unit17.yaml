      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Nach في („in“) steht das Körperteil mit ال: في الرأس, في البطن.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson01.fill.004
