    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das و wird an das nächste Wort geschrieben: واستريحي heißt „und ruh dich aus“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.fill.008
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: عندي ألم. {item} مساعدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أحتاج heißt „ich brauche“; das Präfix أ kennzeichnet „ich“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.translate.009
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اشربي und استريحي sind Befehle an eine Frau und enden auf ـي.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.translate.010
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: Layla, trink Wasser. (an eine Frau gerichtet)
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Yusuf sagt Layla, sie soll trinken: اشربي ist der weibliche Befehl.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.translate.011
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: Ich habe Schmerzen. Ich brauche Hilfe. (kein eigenes Wort für „ich“)
    language_code: de
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Sowohl عندي als auch أحتاج enthalten „ich“ in ihrer Form, deshalb ist kein أنا nötig.
    language_code: de
    direction: ltr
