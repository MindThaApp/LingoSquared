    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اشربي und استريحي sind Befehle an eine Frau; أحتاج heißt „ich brauche“; المشكلة hat ال, also bedeutet es „das Problem“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.order.004
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
