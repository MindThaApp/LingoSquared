    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} يا ليلى؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المشكلة؟ heißt „Was ist das Problem?“; يا ليلى spricht sie an.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.order.005
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: عندي ألم. أحتاج {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم. أحتاج {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Auf أحتاج folgt direkt, was gebraucht wird: أحتاج مساعدة.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.order.006
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: يا ليلى {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Die Endung ـي kennzeichnet einen Befehl an eine Frau: اشربي ماء.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.fill.007
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
