    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'اشربي ist der weibliche Befehl: „Trink“, an eine Frau gerichtet.'
    language_code: de
    direction: ltr
