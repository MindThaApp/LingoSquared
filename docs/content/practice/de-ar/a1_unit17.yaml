  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Der Kopf heißt الرأس; der Satz sagt „Ich habe Schmerzen im Kopf“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
