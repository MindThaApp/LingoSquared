  feedback_frame:
    text: ألم heißt „Schmerz“; الرأس ist der Kopf und البطن der Bauch, beide mit ال.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson01.listen.002
