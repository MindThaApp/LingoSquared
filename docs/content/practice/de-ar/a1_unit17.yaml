  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم ist ein Nomen und bedeutet „Schmerz“; die beiden Körperteile sind Nomen mit ال.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: Ich habe Schmerzen im Kopf.
    language_code: de
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي („ich habe“) braucht kein Verb: عندي ألم heißt „Ich habe Schmerzen“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson01.translate.007
