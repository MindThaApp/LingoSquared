    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das Körperteil behält nach في das ال: في البطن.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit17.lesson02.choose.001
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحتاج heißt „ich brauche“ und مساعدة „Hilfe“; das Verb braucht kein eigenes Pronomen.
    language_code: de
    direction: ltr
