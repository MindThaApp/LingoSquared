templates:
- content_key: practice.ro-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu se folosește pentru prieteni, familie și persoane de aceeași vârstă; Lei, cu L mare, este forma de politețe pentru necunoscuți, persoane în vârstă și situații profesionale.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao se folosește atât ca salut, cât și ca rămas-bun, în timp ce buongiorno este un salut politicos de peste zi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? îl întreabă pe un prieten cum se simte; unui necunoscut i-ai spune Come sta?
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Multe adjective italiene în -ale corespund celor românești în -al: informale înseamnă informal, formale înseamnă formal.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso se folosește cu Lei, forma de politețe: arată respect față de persoanele pe care nu le cunoști bine.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: Salut, ce mai faci? (informal, unui prieten)
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai este forma pentru tu; forma de politețe Lei a aceleiași întrebări este Buongiorno, come sta?
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla este rămas-bunul formal; terminația -la se referă la Lei. Cu prietenii, italienii spun ciao.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera este salutul de seară; buonanotte se spune doar când cineva merge la culcare.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo înseamnă literal ne vedem; este modul obișnuit de a spune „ne vedem”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani înseamnă ne vedem mâine; a face parte din expresia fixă.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene răspunde la Come stai? și poate sta și singur, cu sensul de bine.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi este modul politicos de a atrage atenția unui necunoscut; este forma de politețe (Lei).
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto este de masculin; devine benvenuta când urezi bun venit unei femei.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo înseamnă literal mă numesc; numele vine pur și simplu la sfârșit.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti este forma informală (te); cu Lei, întrebarea devine Come si chiama?
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere este atât substantivul plăcere, cât și răspunsul pe care îl dai când cunoști pe cineva: încântat.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille înseamnă o mie, deci grazie mille este un „mulțumesc mult” călduros.
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: Mă numesc Elena.
    language_code: ro
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Italiana spune mi chiamo, adică „mă numesc”, la fel ca româna: construcția este reflexivă, iar numele vine la sfârșit.'
    language_code: ro
    direction: ltr
