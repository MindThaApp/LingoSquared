  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cu un posesiv, substantivele de familie la singular nu primesc articol: mio padre, mia madre.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit06.lesson01.listen.002
