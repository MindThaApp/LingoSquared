    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre și madre se termină amândouă în -e, dar au gen diferit, așa că învață fiecare cuvânt împreună cu genul lui; nonno și nonna se termină în -o și -a.
    language_code: ro
    direction: ltr
