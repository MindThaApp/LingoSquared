templates:
- content_key: practice.ro-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Naționalitățile se schimbă după vorbitor: americano pentru un bărbat, americana pentru o femeie; italiano și italiana funcționează la fel.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? îl întreabă pe un prieten de unde este; unui străin îi spui Di dov'è, Lei?
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Numele orașelor italiene diferă adesea de cele românești: Milano este Milano în italiană, dar în română îi spunem și Milan.'
    language_code: ro
    direction: ltr
