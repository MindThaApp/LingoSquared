  feedback_frame:
    text: 'Terminația verbului arată cine face acțiunea: parlo înseamnă vorbesc, parli înseamnă vorbești (informal), parla înseamnă vorbiți (formal) sau vorbește (el/ea).'
    language_code: ro
    direction: ltr
