templates:
- content_key: practice.ro-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ora se exprimă cu articolul feminin plural le, pentru că ore (orele) este feminin plural: sono le tre.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
