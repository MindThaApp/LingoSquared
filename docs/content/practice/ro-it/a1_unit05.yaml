    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ora unu este excepția: l''una este la singular, așa că se folosește è, nu sono.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
