  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: word_order
  frame:
    text: Je ne me {item} pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sens
  answer_derivation:
    kind: render_frame
    frame:
      text: Je ne me {item} pas bien.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 気分がよくありません。Se sentir は再帰動詞です(je me sens)。ne ... pas bien は、どこか調子が悪いことを軽く言う一般的な表現です。
    language_code: ja
    direction: ltr
