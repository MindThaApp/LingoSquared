templates:
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.choose.001
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faire les courses は食料品の買い物に行くという意味です。courses は複数形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.listen.002
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vendredi は金曜日のことです。曜日は男性名詞で、小文字で書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.match.003
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Libre と occupé は、空いている・忙しいを表す反対の意味の形容詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.order.004
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
  frame:
    text: Tu viens me {item} vers dix-huit heures ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu viens me {item} vers dix-huit heures ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Venir chercher quelqu'un は人を迎えに来るという意味です。chercher は不定詞のままです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.order.005
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
  frame:
    text: Ça te dit de {item} les courses ensemble ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça te dit de {item} les courses ensemble ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ça te dit de の後に不定詞を続けると、一緒に何かをしようという提案になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.fill.006
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Je suis {item} vendredi soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Occupé は男性形です。女性が言う場合は occupée と書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.fill.007
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Devant le marché, {item} soir ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vendredi soir は金曜の夜という意味です。曜日に冠詞や前置詞は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.translate.008
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: 土曜日は空いている？(くだけた言い方、tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu es {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu es libre ? は友達に都合をたずねる表現です。samedi の前に前置詞は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson01.translate.009
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Libre は男女同形です。occupé は男性形、occupée は女性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson02.choose.001
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ne は否定の前半部分で、後半の pas は動詞の後ろに来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson02.listen.002
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avec plaisir は、誘いを温かく受ける言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson02.match.003
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Devant は「〜の前に」という意味で、待ち合わせ場所を示すときによく使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson02.order.004
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: word_order
  frame:
    text: Avec {item} !
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Avec {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avec plaisir は「喜んで」という意味で、丁寧な承諾の返事です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson02.fill.005
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: fill_in_blank
  frame:
    text: Je {item} peux pas, je suis occupé. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je ne peux pas は否定文です。ne は動詞の前、pas は動詞の後ろに置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit11.lesson02.translate.006
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: translation
  frame:
    text: 市場の前で会いましょう。(on を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: On se retrouve {item} le marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Devant は「〜の前に」、on se retrouve は「待ち合わせる」という意味です。
    language_code: ja
    direction: ltr
