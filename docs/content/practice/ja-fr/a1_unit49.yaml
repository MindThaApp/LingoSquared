schema_version: '1.0'
pack_key: practice.ja-fr.a1.unit49
source_language: ja
target_language: fr
unit_content_key: fr.a1.unit49.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arriver
    - w_colère
    - w_content
    - w_fier
    - w_honnêtement
    - w_nerveux
    - w_nouveau
    - w_pense
    - w_pourquoi
    - w_remplace
    - w_sent
    - w_seras
    - w_service
    - w_seul
    - w_sûrement
    - w_triste
    - w_vas
    - w_vraiment
templates:
- content_key: practice.ja-fr.fr.a1.unit49.lesson01.choose.001
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_content
        - w_triste
        - w_colère
        - w_pourquoi
        - w_nerveux
        - w_service
        - w_sent
        - w_seul
        - w_nouveau
        - w_pense
        - w_honnêtement
        - w_vas
        - w_arriver
        - w_vraiment
        - w_seras
        - w_sûrement
        - w_fier
        - w_remplace
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。「うれしい、悲しい、怒っている」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson02.listen.001
  lesson_content_key: fr.a1.unit49.lesson02.pourquoi_es_tu_content
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。「どうしてうれしいの？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson03.translate.001
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。「何かについて緊張する」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson04.match.001
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: フランス語の単語とその意味を結び付けてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson05.choose.001
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。「気持ちについてのメッセージを読む」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson06.translate.001
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。「Camille が Mathieu を安心させる」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson01.order.002
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: word_order
  frame:
    text: Je suis {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_content
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 私はうれしいです。content は「うれしい、満足している(男性形)」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson01.fill.003
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: fill_in_blank
  frame:
    text: Je suis {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_triste
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_triste
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 私は悲しいです。triste は「悲しい」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson01.translate.004
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: translation
  frame:
    text: 私は怒っています。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colère
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 私は怒っています。colère は「怒り」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson03.order.002
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: word_order
  frame:
    text: Je suis {item} avant mon premier service.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nerveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} avant mon premier service.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 初めてのシフトの前で緊張しています。nerveux は「緊張している(男性形)」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: こんにちは、Mathieu。初めてのシフトについて、今どんな気持ちですか？Avant ton premier service(初めてのシフトの前)は、レッスン3で学んだ avant +名詞の型をもう一度使っています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mathieu はどんな気持ちですか？Se sentir(感じる、代名動詞)は、気持ちの状態を尋ねたり述べたりするときの基本的な言い方で、健康の単元にも出てきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: はい、私もそう思います。Je pense aussi は、相手の意見に同意するときの自然な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 正直なところ、少し緊張しています。Honnêtement(正直に)は、本音を打ち明ける言い方をやわらげます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 心配しないでください、きっとうまくできますよ！Tu vas y arriver(直訳は「あなたはそこに着くでしょう」)は励ましの決まった表現で、aller +不定詞で近接未来を作ります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: ありがとう、とても助かります。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ありがとう、とても助かります。Aide は aider(助ける)の il/elle の形で、m' は me の短縮形です。
    language_code: ja
    direction: ltr
