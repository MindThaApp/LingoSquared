templates:
- content_key: practice.ja-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: marché と prix は男性名詞(le marché、le prix)、boulangerie は女性名詞(la boulangerie)です。名詞は冠詞と一緒に覚えましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 市場で使う言葉には、量のあとに de を付けて使う食べ物の名詞が多くあります。un kilo de tomates、un litre de lait などです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 重さや量の単位のあとには、食べ物の前に de が付きます。un kilo de tomates、un litre de lait などです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
  frame:
    text: Les {item} sont chers aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: légumes と fruits は男性複数名詞なので、chers も男性複数形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: fill_in_blank
  frame:
    text: La {item} est fermée aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: boulangerie は女性名詞なので、fermée は -ée で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson01.translate.006
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: フランス語では、名詞を冠詞と一緒に覚えます。le marché、le prix、la boulangerie のようにです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: euro は複数形で -s が付きます(euros)が、この s は発音されないので、聞こえるのは数字だけです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: chers は cher の複数形です。形容詞は、les légumes のような複数名詞に合わせて -s が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais は何かを頼むときの丁寧な言い方です。un kilo de + 名詞で量を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien ? は1つのものの値段をたずねる表現です。le は名詞が男性であることを示します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Combien ça {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte ? は「いくらですか」という意味で、どんな1つの品物にも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 注文するとき、je veux はぶっきらぼうに聞こえますが、je voudrais はより丁寧です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: cher は名詞に合わせて形が変わります。cher(男性単数)、chers(男性複数)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}を1キロください。(丁寧な言い方)'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît は丁寧な「お願いします」です。友だちには s'il te plaît と言えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson02.translate.009
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: パンはいくらですか？
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien le pain ? は1つの品物の値段をたずねる表現で、答えはユーロの金額から始まります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson03.choose.001
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Voilà は、ものを手渡すときや指し示すときに言う言葉で、「はい、どうぞ」「ほら、これです」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson03.match.002
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id016
    second: *id016
    third: *id016
    fourth: *id016
    fifth: *id016
    sixth: *id016
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: fermée は la boulangerie を説明しているので女性形です。男性名詞なら fermé になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit04.lesson03.fill.003
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: fill_in_blank
  frame:
    text: On peut {item} du pain ici aussi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
