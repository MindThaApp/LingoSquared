  lesson_content_key: fr.a1.unit67.lesson01.aide_et_incendie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_incendie
        - w_secours
        - w_police
        - w_ambulance
        - w_pompiers
        - w_bibliothèque
        - w_dehors
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、助けと火事のレッスンで学ぶこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit67.lesson02.listen.001
