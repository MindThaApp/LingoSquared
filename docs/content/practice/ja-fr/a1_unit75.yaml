  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_commander
        - w_soupe
        - w_boire
        - w_menu
        - w_boissons
        - w_sandwich
        - w_cinéma
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。レッスン「何を召し上がりますか？」で学びます。'
    language_code: ja
    direction: ltr
