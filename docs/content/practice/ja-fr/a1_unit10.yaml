templates:
- content_key: practice.ja-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant は「~の前に」、d'abord は「まず」という意味で、順番の最初に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'habiller は再帰動詞です：je m'habille、tu t'habilles。je のときは s' が m' になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 日課を表す動詞には再帰動詞(se réveiller、s'habiller)が多くありますが、prendre や quitter など、そうでないものもあります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison は「家を出る」という意味で、je のときの動詞は quitte です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche は「シャワーを浴びる」の決まった言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: 朝食の前に服を着ます。
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m'habille では、母音の前なので再帰代名詞が m' になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard は「遅く」、puis は「それから」という意味で、日課の流れをつなぐときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois は23です。フランス語の時刻は24時間制でも言えるので、vingt-trois heures は午後11時です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer、dîner、coucher は不定詞です。je や nous のときは語尾が変わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre は je の形で、rentrer は「家に帰る」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: 土曜の夜は一緒に夕食を食べます。(nous を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons は nous の形で、ensemble は「一緒に」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: 午後11時(23:00)ごろに寝ます。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers はおおよその時刻を表し、vingt-trois heures は24時間制の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ? は、何をしているかをたずねるくだけた言い方で、quoi は動詞のあとで que の代わりに使われます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose は「休みます」という意味で、repose は se reposer の je の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais は aller の je の形で、au は à と le が合わさった形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer は再帰動詞なので、je のときは me を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 土曜日のワークショップの前は何をしているの？(くだけた言い方：Tu fais で始める)
    language_code: ja
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ? は、相手が何をしているかをたずねるくだけた言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 何時に家に帰るの？(くだけた言い方：Tu で始める)
    language_code: ja
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres は tu の形で、à quelle heure は時刻をたずねる表現です。
    language_code: ja
    direction: ltr
