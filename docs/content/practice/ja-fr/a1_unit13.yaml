templates:
- content_key: practice.ja-fr.fr.a1.unit13.lesson01.choose.001
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préférer、aimer、détester は、好き嫌いを表す主な動詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson01.listen.002
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Épices は複数形です。語末の -s は発音しないので、épice と同じ音に聞こえます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson01.order.004
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: word_order
  frame:
    text: J'aime {item} les plats salés que les plats sucrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: J'aime {item} les plats salés que les plats sucrés.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Aimer mieux は「〜のほうを好む」という意味で、que は好みの劣るほうを導きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson01.fill.006
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: fill_in_blank
  frame:
    text: Mathieu {item} les épices trop fortes. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Déteste は détester の主語 il に対応する形で、Mathieu に合っています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson01.translate.008
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: 私はチョコレートタルトのほうが好きです。
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} au chocolat.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au は à と le が合わさった形で、au chocolat はタルトの味を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson01.translate.009
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tarte、chocolat、épices、plats は、好みの課で出てきた食べ物です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson02.choose.001
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ou は「または」、アクセント付きの où は「どこ」を意味します。アクセントが違いを生みます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson02.listen.002
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pourrait は pouvoir の条件法で、丁寧に提案するときに使います:on pourrait。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson02.order.004
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: word_order
  frame:
    text: Tu aimes plutôt le sucré {item} le salé ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu aimes plutôt le sucré {item} le salé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ou は二つの選択肢をつなぎます:sucré ou salé は「甘いかしょっぱいか」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson02.fill.006
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: fill_in_blank
  frame:
    text: Ça ne me {item} pas. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ça ne me dérange pas は「気になりません」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson02.translate.007
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: translation
  frame:
    text: 何のほうが好きですか?(くだけた言い方、qu'est-ce que を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que tu {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu préfères は préférer の tu に対応する形です。vous préférez は丁寧な形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.choose.001
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée と salée の語末に -e があるのは、tarte と quiche が女性名詞だからです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.listen.002
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée と salée は女性形で、語末に発音しない -e が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.match.003
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sucrée と salée は、女性名詞の tarte と quiche を説明しています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.order.004
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: word_order
  frame:
    text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Salée は quiche に合わせた女性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.fill.005
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: fill_in_blank
  frame:
    text: Je préfère la tarte, plutôt {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sucrée は tarte に合わせた女性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.translate.006
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: 土曜日に何を作りますか?(on を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce qu'on {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: On prépare は、「私たちは作る」を話し言葉で言うときの普通の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit13.lesson03.translate.007
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: 私はタルトよりキッシュのほうが好きです。
    language_code: ja
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} à la tarte.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Préférer A à B は「BよりAを好む」という意味で、à la が二つをつなぎます。
    language_code: ja
    direction: ltr
