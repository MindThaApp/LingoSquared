  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arbre
    - w_banc
    - w_canard
    - w_canards
    - w_froide
    - w_laisse
    - w_nagent
    - w_verte
templates:
- content_key: practice.ja-fr.fr.a1.unit79.lesson02.choose.001
  lesson_content_key: fr.a1.unit79.lesson02.les_arbres_et_l
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_verte
        - w_arbre
        - w_canard
        - w_froide
        - w_canards
        - w_nagent
        - w_laisse
        - w_banc
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、木と草のレッスンに出てきたこの単元の単語です。'
    language_code: ja
    direction: ltr
