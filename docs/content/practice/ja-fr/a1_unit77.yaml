  lesson_content_key: fr.a1.unit77.lesson01.je_veux_aller_au
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_visiter
        - w_visite
        - w_fermer
        - w_guide
        - w_nécessaire
        - w_tableau
        - w_exposition
        - w_tableaux
        - w_concert
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「美術館に行きたい」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
