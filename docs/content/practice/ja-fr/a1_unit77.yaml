  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_concert
    - w_exposition
    - w_fermer
    - w_guide
    - w_nécessaire
    - w_tableau
    - w_tableaux
    - w_visite
