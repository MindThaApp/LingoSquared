templates:
- content_key: practice.ja-fr.fr.a1.unit14.lesson01.choose.001
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Meilleur は bon の不規則な比較級です。meilleur と言い、plus bon とは言いません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson01.listen.002
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Difficile と facile は、男性形と女性形が同じ形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson01.order.004
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: word_order
  frame:
    text: Moi, je trouve {item} aussi bon.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Moi, je trouve {item} aussi bon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'autre は「もう一方のもの」、aussi bon は「同じくらいおいしい」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson01.fill.006
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Cette recette est moins {item} que l'autre. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Difficile は女性形でも形が変わらないので、recette にも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson01.fill.007
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Ce gâteau est {item} que le premier. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Meilleur que は「…よりよい」という意味で、plus bon の代わりに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson01.translate.008
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: translation
  frame:
    text: このチーズはもう一方より高いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce fromage est plus cher que {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Que は比較の2つ目の対象を導きます。l'autre はもう一方のチーズを指します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson02.choose.001
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Irrégulier は、meilleur のように形が通常の型に従わないという意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson02.listen.002
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Adjectif と irrégulier はそれぞれ「形容詞」「不規則な」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson02.order.003
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: word_order
  frame:
    text: Comparons les prix avant {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comparons les prix avant {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avant de の後に動詞の不定詞が続くと、「…する前に」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson02.fill.004
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: fill_in_blank
  frame:
    text: La quiche est moins {item} que la tarte. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Chère は quiche に合わせて女性形の -e がつきます。男性名詞なら cher です:le fromage est moins cher。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson02.translate.005
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: translation
  frame:
    text: それはいちばん安いレシピです。
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est la recette la moins {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: La moins chère は、la moins に女性形の形容詞を続けた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.choose.001
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci は「こちらのもの」、celui-là は「あちらのもの」で、どちらも男性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.listen.002
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci と celui-là の違いは -ci と -là だけで、「ここ」と「あそこ」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.order.004
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: word_order
  frame:
    text: Lequel on {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lequel on {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Lequel on prend? はくだけた言い方です。lequel は「どちら」、on は「私たち」の意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.fill.006
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il y a deux {item} de fromage. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sortes は deux の後なので複数形で、後に de が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.fill.007
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il nous {item} plus d'argent pour le dessert. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il nous reste は「私たちには…が残っている」という意味で、ここでの reste は非人称です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.translate.008
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: じゃあ、それにしよう。教室にはそれがいちばんいい選択です。(on を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Alors on prend {item}, c'est la meilleure option pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Celui-là は「あちらのもの」の意味です。option が女性名詞なので meilleure は女性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit14.lesson03.translate.009
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: それは本当です。
    language_code: ja
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est vrai は同意するときによく使う表現です。
    language_code: ja
    direction: ltr
