templates:
- content_key: practice.ja-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0から16までは1語で表します。17から19は dix-sept のように、「10と7」という形で組み立てます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: つづりに注意しましょう。zéro にはアクサンがあり、trente-quatre のような複合数詞はハイフンでつなぎます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 70からは数え方が変わります。soixante-dix は「60と10」、quatre-vingts は「4つの20」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0から16までは1語ずつ覚え、10の位は vingt、trente、soixante などで表します。それ以外はこれらを組み合わせて作ります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson02.match.003
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Quatre-vingts は最後に s が付きますが、後ろに別の数が続くと s は落ちます。例:quatre-vingt-dix。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quel âge as-tu ? は年齢をたずねる表現です。フランス語では「何歳である」ではなく、「いくつの年を持っている」と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson03.order.002
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: J'ai {n} ans.
    language_code: fr
    direction: ltr
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: フランス語では年齢を「いくつの年を持っている」(j'ai ... ans)と言い、「~である」とは言いません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson03.fill.003
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: Quel âge {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quel âge as-tu ? はくだけた言い方です。初対面の人には quel âge avez-vous ? とたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 私は{n}歳です。
    language_code: ja
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: フランス語では年齢に avoir(持つ)を使います。j'ai vingt-huit ans は直訳すると「私は28の年を持っています」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 何歳ですか?(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quel âge as-tu ? は tu を使う表現で、友だち、家族、同年代の相手にだけ使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: おいくつですか？（敬称）
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quel âge avez-vous ? は vous を使う表現で、初対面の人や丁寧に話す場面で使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît はくだけた「お願いします」、s'il vous plaît は丁寧な言い方です。tu と vous の使い分けと同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson04.fill.002
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: fill_in_blank
  frame:
    text: Quel est ton {item} de téléphone ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ton はくだけた「あなたの」です。初対面の人には quel est votre numéro de téléphone ? とたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson05.listen.001
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Œufs は複数形です。複数形では œuf の f を発音しないので、単数形とは音が違います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson05.match.002
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: フランス語では量を表すときに de を使います。例:deux tasses de farine、une demi-tasse de sucre。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: word_order
  frame:
    text: J'ai besoin de {n} œufs.
    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + 名詞は「必要とする」という意味です。数は de と名詞の間に入ります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson05.translate.004
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これらの語の多くは、tasses de farine のように、量を表す語の後ろに de を付けて使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
  type: fill_in_blank
  frame:
    text: Tu {item} aussi besoin de sucre ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tu as はくだけた「あなたは持っている」です。丁寧な形は vous avez です。
    language_code: ja
    direction: ltr
