  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_payer
        - w_carte
        - w_espèces
        - w_paie
        - w_voulez
        - w_partage
        - w_séparément
        - w_monnaie
        - w_votre
        - w_addition
