        - w_cafés
        - w_total
        - w_payé
        - w_demande
        - w_tellement
        - w_aidé
        - w_gentil
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、カードか現金かのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson03.listen.001
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
