  feedback_frame:
    text: '{item} はこのユニットの単語で、おつりのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson05.match.001
  lesson_content_key: fr.a1.unit51.lesson05.lire_une_addition_de
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: フランス語の単語とその意味を結び付けてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson06.choose.001
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、Camille と Mathieu が会計を払うレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson02.translate.002
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、カードか現金かのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson02.order.003
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: word_order
  frame:
    text: Je peux {item} par carte ici ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_payer
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux {item} par carte ici ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ここでカードで払えますか。payer は「払う」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson02.fill.004
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: fill_in_blank
  frame:
    text: Vous voulez payer en espèces ou par {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 現金とカード、どちらでお支払いになりますか。Vous voulez ... ? は、知らない店員さんなどに使う丁寧な尋ね方で、友だちなら tu veux ... ? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson02.translate.005
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: translation
  frame:
    text: 現金で払います。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_espèces
  answer_derivation:
    kind: render_frame
    frame:
      text: Je paie en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 現金で払います。espèces は「現金」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson03.order.002
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_partage
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 割り勘にしましょうか。partage は「分ける、分け合う」という意味です(je、il/elle、または一般的な人を表す on に使います)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson03.fill.003
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: fill_in_blank
  frame:
    text: Je peux payer {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
    hint:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 別々に払ってもいいですか。Séparément(別々に)は payer のすぐ後ろに置きます。自分の分だけ支払いたいときの丁寧な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson04.order.002
  lesson_content_key: fr.a1.unit51.lesson04.la_monnaie
  type: word_order
  frame:
    text: Voici votre {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_monnaie
  answer_derivation:
    kind: render_frame
    frame:
      text: Voici votre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: お釣りです。monnaie は「お釣り(小銭)」、つまり細かいお金のことです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit51.lesson06.order.002
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_demande
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: お会計をお願いしましょうか。Demander(頼む、求める)は l'addition を直接目的語にとり、間に余分な語は入りません。
    language_code: ja
    direction: ltr
