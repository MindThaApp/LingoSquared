- content_key: practice.ja-fr.fr.a1.unit85.lesson04.match.001
  lesson_content_key: fr.a1.unit85.lesson04.le_programme_du_spectacle
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: フランス語の単語とその意味を結び付けてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
