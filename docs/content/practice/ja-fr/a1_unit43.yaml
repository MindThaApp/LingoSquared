    - w_part
    - w_pile
    - w_problème
    - w_quai
    - w_quarante
    - w_salle
    - w_simple
    - w_sortie
    - w_train
    - w_utilise
    - w_vouvoiement
templates:
- content_key: practice.ja-fr.fr.a1.unit43.lesson01.choose.001
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_billet
        - w_simple
        - w_guichet
        - w_utilise
        - w_général
        - w_vouvoiement
        - w_quai
        - w_part
        - w_train
        - w_arrive
        - w_attention
        - w_sortie
        - w_salle
        - w_départ
        - w_quarante
        - w_doit
        - w_panneau
        - w_problème
        - w_encore
        - w_déjà
        - w_pile
        - w_allez
        - w_monte
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、切符を買うレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson02.listen.001
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「列車は何時に出ますか?」のレッスンで学ぶ、このユニットの単語の一つです。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson03.translate.001
  lesson_content_key: fr.a1.unit43.lesson03.le_retard
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「遅延」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson04.match.001
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: フランス語の単語とその意味を結び付けてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
