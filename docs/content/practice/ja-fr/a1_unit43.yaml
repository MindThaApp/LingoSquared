- content_key: practice.ja-fr.fr.a1.unit43.lesson01.order.002
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: word_order
  frame:
    text: Je voudrais un {item} pour Lyon.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_billet
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item} pour Lyon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: リヨンまでの切符をお願いしたいのですが。billetは「切符」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson01.fill.003
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: fill_in_blank
  frame:
    text: Voulez-vous un aller {item} ou un aller-retour ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 片道切符になさいますか、それとも往復ですか。Voulez-vousはvouloirのvousを使った丁寧な形で、ここでは知らない駅員さんに対して使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson02.order.002
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: word_order
  frame:
    text: De quel {item} part le train pour Lyon ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_quai
  answer_derivation:
    kind: render_frame
    frame:
      text: De quel {item} part le train pour Lyon ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: リヨン行きの電車は何番ホームから出ますか。quaiは「ホーム」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson02.fill.003
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: fill_in_blank
  frame:
    text: Le train ne {item} pas à l'heure. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_part
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_part
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 電車は時間どおりに出発しません。partは「側」や「分」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson02.translate.004
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: translation
  frame:
    text: 電車は何時に到着しますか?
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_train
  answer_derivation:
    kind: render_frame
    frame:
      text: À quelle heure arrive le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 電車は何時に到着しますか。À quelle heure arrive ... ? で時刻をたずねます。arriverは規則的な-er動詞です:le train arrive。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson04.order.002
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: word_order
  frame:
    text: Où est la {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_sortie
  answer_derivation:
    kind: render_frame
    frame:
      text: Où est la {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 出口はどこですか。sortieは「出口」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit43.lesson04.fill.003
