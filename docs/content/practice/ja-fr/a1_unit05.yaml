templates:
- content_key: practice.ja-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: le poulet、le poisson、le riz、le vin は男性名詞で、la salade は女性名詞です。l'eau は母音の前なので冠詞の母音が省略されます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson01.listen.002
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café は飲み物の「コーヒー」も場所の「カフェ」も表します。どちらかは文脈で判断します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson01.match.003
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 容器を表す語の後ろでは、冠詞を付けずに de を使います。un verre de vin、un verre d'eau のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson01.translate.004
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: メニューにある食べ物と飲み物です。名詞は冠詞といっしょに覚えましょう。le vin、la salade。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.choose.001
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi ? は、ウェイターが「お決まりですか?」とたずねる表現です。avez choisi は過去の形で、直訳は「選びました」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.order.002
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Je voudrais un {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un は café、dessert、verre などの男性名詞の前に付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.order.003
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Qu'est-ce que vous avez comme {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que vous avez comme {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ここでの comme は「〜として」「〜に」の意味です。デザートには何がありますか、という使い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.fill.004
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: Vous {item} choisi ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vous avez choisi ? は、vous を使ったウェイターの丁寧な質問です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.fill.005
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: C'est {item} ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: c'est は特定のものを指さないので、délicieux は男性単数の形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.fill.006
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: '{item}, s''il vous plaît. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'addition は「お会計」をお願いするときの言い方です。l' は le や la が母音の前で短くなった冠詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.translate.007
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: コーヒーをお願いします。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais un café, s'il vous plaît は、丁寧に注文するときの基本の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson02.translate.008
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: とてもおいしい!
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est délicieux ! は、料理を作った人や料理そのものをほめる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson03.choose.001
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: rouge は男性名詞にも女性名詞にも同じ形を使います。un verre de vin rouge は「赤ワイン1杯」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson03.listen.002
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: cette は女性名詞の前で使います(cette salade)。男性名詞の前では ce を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson03.match.003
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id015
    second: *id015
    third: *id015
    fourth: *id015
    fifth: *id015
    sixth: *id015
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: délicieux と rouge は名詞を説明する語で、avez、choisi、donné は動詞の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson03.order.004
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: word_order
  frame:
    text: Je voudrais une {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais une {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Une は salade や boisson などの女性名詞の前に付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson03.translate.005
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: rouge、délicieux、そして動詞の形 avez、choisi、donné は、すべてカフェの場面に出てきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-fr.fr.a1.unit05.lesson03.translate.006
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: ワークショップのせいでお腹がすきました。
    language_code: ja
    direction: ltr
  slots:
    item: *id018
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier nous a {item} faim.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Donner faim は慣用表現で、直訳は「ワークショップが私たちに空腹を与えた」です。
    language_code: ja
    direction: ltr
