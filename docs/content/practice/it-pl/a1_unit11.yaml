templates:
- content_key: practice.it-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę è la forma «io» di chcieć e chcesz è la forma «tu», usata con amici e familiari.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson01.listen.002
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La desinenza -sz indica il «tu» informale: chcesz, możesz, masz (jesteś è l''eccezione, con la desinenza -ś).'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson01.match.003
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Chcieć e móc seguono lo stesso schema: -ę per «io» e -sz per «tu».'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson01.order.004
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: word_order
  frame:
    text: Dziś {item} iść do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dopo chcę o mogę il secondo verbo resta all'infinito.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson01.fill.005
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: fill_in_blank
  frame:
    text: Czy {item} iść razem do kina? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Una domanda a un amico usa la forma «tu» chcesz, con czy all'inizio della domanda.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson01.translate.006
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: Oggi voglio andare al cinema.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Chcę è seguito da un infinito, quindi iść resta nella forma del dizionario.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson01.translate.007
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Móc significa «essere in grado di» o «potere» e si usa come chcieć.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.choose.001
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chętnie e niestety sono avverbi, quindi non cambiano mai forma.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.listen.002
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Sobotę è la forma usata dopo w: i nomi femminili dei giorni cambiano -a in -ę, quindi sobota diventa sobotę.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.match.003
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przyjść significa «venire» e dopo mogę o możesz resta all'infinito.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.order.004
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz {item} w piątek?
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz {item} w piątek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Czy możesz più un infinito chiede con gentilezza a un amico se può fare qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.order.005
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz przyjść w {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz przyjść w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: I giorni maschili come piątek restano invariati dopo w, mentre i giorni femminili come sobota diventano sobotę.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.fill.006
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Niestety, nie {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nie mogę è il modo cortese per dire che non puoi venire.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.fill.007
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Tak, bardzo {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bardzo chętnie è un modo caloroso di accettare un invito.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.translate.008
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: Purtroppo non posso.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Niestety, nie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nie va prima del verbo per renderlo negativo.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit11.lesson02.translate.009
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
