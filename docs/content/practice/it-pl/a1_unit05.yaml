templates:
- content_key: practice.it-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le parole polacche della famiglia vengono in coppie maschile/femminile, come ojciec e matka o brat e siostra.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rodzice (genitori) è sempre plurale, quindi vuole moi e non mój o moja.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Le parole della famiglia si abbinano per genere: dziadek e babcia, wujek e ciotka, syn e córka.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój si usa con i sostantivi maschili come ojciec, brat e dziadek.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja si usa con i sostantivi femminili, in maggior parte terminanti in -a.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il possessivo concorda con il sostantivo: mój ojciec, ma moja matka.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Questa è mia madre.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja è il possessivo femminile; quello maschile è mój.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Questi sono i miei genitori.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice è plurale e indica persone, quindi il possessivo è moi; il verbo è są invece di jest.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć significa avere, e la persona che possiede determina la forma del verbo: mam, masz, ma.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć (avere) è la forma del dizionario; nelle frasi compare come mam, masz o ma.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Dopo mam, ciò che si possiede prende la forma dell''oggetto: brat diventa brata e siostra diventa siostrę.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La parola i collega due elementi, come in brata i siostrę, e non cambia mai forma.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: Ho un figlio e una figlia.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'I sostantivi femminili in -a cambiano in -ę come oggetto: córka diventa córkę.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il polacco usa on per «lui» e ona per «lei», e il verbo mieszka va bene per entrambi.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko significa «solo», mentre lub è la «o» che indica un'alternativa, come in brata lub siostrę.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dopo w, i nomi di città prendono una desinenza particolare, come in w Gdańsku e w Krakowie.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka è la forma di lui/lei del verbo, e mieszkam, dalla prima unità, è la forma di io.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: Lui abita a Danzica. (includi il pronome)
    language_code: it
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'La desinenza -u dopo w indica dove abita qualcuno: w Gdańsku.'
    language_code: it
    direction: ltr
