templates:
- content_key: practice.it-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In polacco non c'è alcuno schema che colleghi i numeri da uno a dieci, quindi ogni parola va imparata separatamente.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In polacco sz si pronuncia come sc in «scena» ma con suono più duro, simile a sc di «scivolo», e cz come c in «cena»... in modo più duro: sześć e cztery iniziano con questi suoni.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La ć finale di pięć, sześć, dziewięć e dziesięć è un suono dolce, simile a «ci»; il segno diacritico conta nella scrittura.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Pięć, sześć, dziewięć e dziesięć finiscono con la lettera ć, mentre siedem e osiem no: ogni ortografia richiede attenzione.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + numero + lat serve a dire l'età, come in Mam trzydzieści lat.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile chiede «quanto» o «quanti», e kosztuje è il verbo che lo accompagna quando si chiede un prezzo.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I numeri jedenaście, dwanaście e piętnaście finiscono in -naście, che indica i numeri da 11 a 19.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile significa «quanto» per i prezzi e «quanti» per le cose che si contano.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Numeri come pięć, dwanaście o trzydzieści sono seguiti da złotych, mentre dwa, trzy e cztery vogliono złote.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych è la forma usata dopo pięć, dwadzieścia, pięćdziesiąt e numeri simili; dwa, trzy e cztery vogliono złote.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Quanto costa questo?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? è la domanda standard sul prezzo, dove to significa «questo» o «ciò».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana è il «tuo/suo» formale per un uomo (pana numer), mentre twój è il «tuo» informale (twój numer).
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu significa letteralmente «numero del telefono», e la seconda parola è una forma modificata della parola per «telefono».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój è il «tuo» informale e pana il «suo» formale per un uomo; entrambi vanno bene davanti a numer telefonu.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat segue numeri come pięć, dwadzieścia o trzydzieści; lata segue dwa, trzy, cztery e i numeri composti che finiscono con essi, come in trzydzieści dwa lata.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Ho trentadue anni.
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Poiché il numero finisce in dwa, la parola per «anni» è lata e non lat.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Qual è il tuo numero di telefono? (informale; usa jest)
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój è il «tuo» informale; la versione formale per un uomo è Jaki jest pana numer telefonu?
    language_code: it
    direction: ltr
