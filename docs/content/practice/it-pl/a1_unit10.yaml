    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pracować significa «lavorare» e wracać significa «tornare»; le loro forme per «io» sono pracuję e wracam.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.listen.002
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obiad è il pasto principale della giornata, che si consuma verso mezzogiorno, quindi può corrispondere a «pranzo» o a «cena».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.match.003
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Wracam e pracuję sono verbi diversi dal suono simile, quindi fai attenzione alle vocali.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.order.004
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: word_order
  frame:
    text: Wracam do {item} wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dopo do il sostantivo va al genitivo, e dom diventa domu, proprio come bank diventa banku.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.fill.005
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: fill_in_blank
  frame:
