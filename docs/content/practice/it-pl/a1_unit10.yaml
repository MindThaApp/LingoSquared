    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po południu dice quando, e il verbo resta alla forma per «io».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.translate.006
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: translation
  frame:
    text: La sera torno a casa.
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La desinenza -u del genitivo ricompare in domu, come in banku e parku.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.translate.007
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dom significa «casa» (come abitazione o come focolare), a seconda del contesto.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson03.choose.001
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Też significa «anche» o «pure» e di solito segue la parola a cui si riferisce.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson03.order.002
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: word_order
  frame:
    text: Śpię {item}, o dziesiątej wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Śpię {item}, o dziesiątej wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Wcześnie significa «presto» ed è un avverbio, quindi non cambia mai.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson03.fill.003
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: fill_in_blank
  frame:
    text: Ja {item} jem śniadanie rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ja też significa «anch'io»; też di solito viene subito dopo il pronome a cui si riferisce.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson03.translate.004
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Śpię è la forma di spać per «io» e ha una vocale diversa rispetto all'infinito.
    language_code: it
    direction: ltr
