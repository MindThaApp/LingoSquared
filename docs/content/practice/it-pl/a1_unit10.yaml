templates:
- content_key: practice.it-pl.pl.a1.unit10.lesson01.choose.001
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ogni verbo ha una forma del dizionario (wstawać, jeść, pić) e una forma per «io» (wstaję, jem, piję).
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson01.listen.002
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La forma per «io» di solito termina in -ę o -m, come in wstaję, piję e jem.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson01.match.003
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'L''infinito e la forma per «io» sono parole diverse, quindi impara entrambe: jeść e jem.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson01.order.004
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: word_order
  frame:
    text: Rano {item} o siódmej.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Rano {item} o siódmej.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rano va per primo per dire quando, e o siódmej indica l'ora esatta.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson01.fill.005
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: fill_in_blank
  frame:
    text: Rano {item} śniadanie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jem è una forma irregolare di jeść per «io» e conviene impararla a memoria.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson01.translate.006
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: Faccio colazione.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jem {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Śniadanie è neutro, quindi la forma del complemento oggetto è uguale a quella di base.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson01.translate.007
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Piję e wstaję terminano entrambi in -ę, la tipica desinenza di «io» per verbi di questo tipo.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit10.lesson02.choose.001
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: multiple_choice
  frame:
