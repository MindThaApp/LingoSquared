- content_key: practice.it-pl.pl.a1.unit50.lesson01.order.003
  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: word_order
  frame:
    text: Chciałabym iść na koncert {item}, poproszę.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
