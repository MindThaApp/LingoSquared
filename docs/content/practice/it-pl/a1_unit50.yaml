    frame:
      text: Chciałabym iść na koncert {item}, poproszę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Vorrei andare al concerto del gruppo, per favore. zespołu significa del gruppo.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit50.lesson02.order.002
