    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Dopo kilo e pół kilo il nome prende un plurale in -ów: banan diventa bananów e pomidor diventa pomidorów.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson02.order.004
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: word_order
  frame:
    text: Poproszę kilo {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dopo una quantità come kilo il nome va al genitivo plurale, che per queste parole termina in -ów.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson02.fill.005
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
