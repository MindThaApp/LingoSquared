    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pół kilo significa mezzo chilo; kilo in sé non cambia.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson02.translate.006
