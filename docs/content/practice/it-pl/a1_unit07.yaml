templates:
- content_key: practice.it-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Con il verbo kosztować il polacco usa gli avverbi: kosztuje tanio (costa poco) e kosztuje drogo (costa tanto, è caro).'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula è femminile perché termina in -a; banan, pomidor, ogórek e ziemniak sono maschili.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje chiede il prezzo di una sola cosa, quindi il nome resta nella forma base del singolare.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il verbo concorda nel numero: kosztuje per una cosa, kosztują per più di una.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: Una banana costa poco. (usa il verbo «costare»)
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Il polacco dice che la banana costa «a buon mercato» con un avverbio, senza usare un aggettivo a parte.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować è la forma del dizionario; nelle frasi diventa kosztuje o kosztują.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson02.choose.001
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pół significa «metà» e va prima di kilo: pół kilo è mezzo chilo.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson02.listen.002
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poproszę è una richiesta educata che si usa quando si ordina o si compra qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit07.lesson02.match.003
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
