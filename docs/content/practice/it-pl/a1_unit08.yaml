    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hotel, bank e park sono tutti maschili.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson01.order.004
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: word_order
  frame:
    text: Gdzie jest {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest chiede dove si trova qualcosa, e il luogo resta nella forma base.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson01.fill.005
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: fill_in_blank
  frame:
    text: To jest {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: To jest introduce una cosa, e il nome che segue resta nella forma base.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson01.translate.006
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: Dov'è la farmacia?
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest più un luogo è la domanda universale per trovare qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson01.translate.007
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Poczta è la parola breve e di uso quotidiano per «ufficio postale».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.choose.001
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obok e naprzeciwko sono seguiti dal genitivo, ed è per questo che bank diventa banku.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.listen.002
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I nomi maschili come bank, hotel e park prendono -u dopo obok, naprzeciwko e blisko.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.order.003
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Apteka jest obok {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La desinenza del genitivo di questi nomi maschili è -u, come in banku, hotelu e parku.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.order.004
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Park jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Park jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Blisko, daleko e niedaleko sono avverbi, quindi restano invariati con qualsiasi nome.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.fill.005
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: fill_in_blank
  frame:
    text: Restauracja jest {item} hotelu. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Naprzeciwko vuole il genitivo, ed è per questo che hotel diventa hotelu.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.translate.006
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: La farmacia è accanto alla banca.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dopo obok il luogo prende la desinenza del genitivo, quindi bank diventa banku.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson02.translate.007
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Niedaleko è nie più daleko, letteralmente «non lontano», quindi significa «abbastanza vicino».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson03.choose.001
  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Przepraszam si usa sia per dire «scusi», prima di chiedere qualcosa a uno sconosciuto, sia per dire «mi dispiace».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson03.match.002
  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przepraszam apre una domanda cortese a uno sconosciuto, per esempio per chiedere dove si trova un luogo.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson03.translate.003
  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przepraszam vale sia per «scusi» sia per «mi dispiace», quindi è il contesto a stabilire il senso.
    language_code: it
    direction: ltr
