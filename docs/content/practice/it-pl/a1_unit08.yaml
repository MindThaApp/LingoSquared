templates:
- content_key: practice.it-pl.pl.a1.unit08.lesson01.choose.001
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In polacco i nomi dei luoghi si usano senza articolo, quindi bank può significare «una banca» o «la banca».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson01.listen.002
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poczta, apteka e restauracja terminano in -a e sono femminili; bank, hotel e park sono maschili.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit08.lesson01.match.003
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: matching_pairs
