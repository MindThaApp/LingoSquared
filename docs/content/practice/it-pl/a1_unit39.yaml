schema_version: '1.0'
pack_key: practice.it-pl.a1.unit39
source_language: it
target_language: pl
unit_content_key: pl.a1.unit39.nagle_wypadki
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Italian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alarmowy
    - w_bibliotece
    - w_chodź
    - w_dzieje
    - w_dzwonię
    - w_ewakuacyjne
    - w_idźcie
    - w_karetka
    - w_policja
    - w_pomoc
    - w_pomocy
    - w_potrzebny
    - w_potrzebuje
    - w_pożar
    - w_spokojnie
    - w_straż
    - w_uwaga
    - w_wyjścia
    - w_wyjście
    - w_zadzwoń
    - w_zewnątrz
templates:
- content_key: practice.it-pl.pl.a1.unit39.lesson01.choose.001
  lesson_content_key: pl.a1.unit39.lesson01.pomoc_i_pozar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_pomoc
        - w_pomocy
        - w_pożar
        - w_potrzebny
        - w_alarmowy
        - w_zadzwoń
        - w_wyjście
        - w_ewakuacyjne
        - w_dzwonię
        - w_policja
        - w_karetka
        - w_straż
        - w_uwaga
        - w_idźcie
        - w_wyjścia
        - w_spokojnie
        - w_chodź
        - w_bibliotece
        - w_potrzebuje
        - w_zewnątrz
        - w_dzieje
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su aiuto e incendio.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson02.listen.001
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul numero di emergenza e sull''uscita di emergenza.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson03.translate.001
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su polizia, ambulanza o vigili del fuoco.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson04.match.001
  lesson_content_key: pl.a1.unit39.lesson04.pozar_w_kawiarni_jezykowej
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Abbina ogni parola polacca al suo significato in italiano; le parole provengono dalle lezioni di questa unità.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson05.choose.001
  lesson_content_key: pl.a1.unit39.lesson05.czytanie_tekstu_o_pozarze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sulla lettura di un testo sull''incendio.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson06.translate.001
  lesson_content_key: pl.a1.unit39.lesson06.tomek_przychodzi
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione «Tomek arriva».'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson01.order.002
  lesson_content_key: pl.a1.unit39.lesson01.pomoc_i_pozar
  type: word_order
  frame:
    text: Ewo, potrzebuję {item}!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pomocy
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewo, potrzebuję {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa, ho bisogno di aiuto! pomocy significa «di aiuto».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson02.order.002
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: word_order
  frame:
    text: Zadzwoń pod numer {item}!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_alarmowy
  answer_derivation:
    kind: render_frame
    frame:
      text: Zadzwoń pod numer {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Chiama il numero di emergenza! alarmowy significa «di emergenza» (maschile).
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson02.fill.003
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: fill_in_blank
  frame:
    text: Gdzie jest {item} ewakuacyjne? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_wyjście
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_wyjście
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dov'è l'uscita di emergenza? wyjście significa «uscita».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson03.order.002
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: word_order
  frame:
    text: Policja, {item} czy straż pożarna?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_karetka
  answer_derivation:
    kind: render_frame
    frame:
      text: Policja, {item} czy straż pożarna?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Polizia, ambulanza o vigili del fuoco? Policja, karetka czy straż pożarna? è la domanda che senti quando chiami il 112, il numero di emergenza in Polonia e in tutta Europa. Karetka è l'ambulanza.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit39.lesson03.fill.003
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: fill_in_blank
  frame:
    text: Dzwonię po {item} pożarną. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_straż
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_straż
  answer_derivation:
