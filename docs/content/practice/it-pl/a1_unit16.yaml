    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mam più la forma di complemento indica ciò che hai.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.translate.007
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
