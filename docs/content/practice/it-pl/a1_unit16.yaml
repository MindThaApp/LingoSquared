    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Źle è un avverbio che significa «male» e non cambia mai; chory e chora cambiano secondo il genere.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.order.004
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: word_order
