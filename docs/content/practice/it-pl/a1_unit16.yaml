    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Mnie e cię sono forme complemento di ja e ty: fa male a me, fa male a te.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson01.order.004
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: word_order
  frame:
    text: Gardło {item} boli.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło {item} boli.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mnie significa «a me»; Gardło mnie boli dice letteralmente «la gola mi fa male».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson01.fill.005
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: fill_in_blank
  frame:
    text: Co cię {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Boli è la forma di lui, lei, esso; la parola interrogativa Co indica la cosa che fa male.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson01.translate.006
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: Mi fa male la gola. (inizia con la gola)
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło mnie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gardło è neutro e singolare, quindi il verbo è boli.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson01.translate.007
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: Che cosa ti fa male? (a un amico, ty)
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Co {item} boli?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cię è la forma breve complemento di ty.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.choose.001
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: multiple_choice
