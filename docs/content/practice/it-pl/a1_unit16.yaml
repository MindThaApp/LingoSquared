  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Czuję è la forma di io di czuć się e czujesz è la forma di tu; entrambe si usano con się.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.listen.002
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chory è maschile e chora è femminile, quindi la forma mostra chi è malato.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.match.003
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: matching_pairs
