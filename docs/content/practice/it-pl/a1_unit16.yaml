  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In polacco si dice che la testa fa male a me: la parte del corpo è il soggetto e mnie indica chi sente il dolore.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson01.match.003
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: matching_pairs
