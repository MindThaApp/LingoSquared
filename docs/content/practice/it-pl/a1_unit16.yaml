    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek è un uomo, quindi l'aggettivo è chory.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson03.choose.001
  lesson_content_key: pl.a1.unit16.lesson03.rozmowa_o_zdrowiu
