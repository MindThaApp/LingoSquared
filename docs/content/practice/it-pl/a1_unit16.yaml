    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La forma di complemento di gorączka termina in -ę, come kawa che diventa kawę.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.order.005
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: word_order
