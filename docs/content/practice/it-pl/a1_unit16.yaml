    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa è una donna, quindi l'aggettivo prende la desinenza femminile -a.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit16.lesson02.fill.006
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
