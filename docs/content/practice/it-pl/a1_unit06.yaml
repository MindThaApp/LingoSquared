templates:
- content_key: practice.it-pl.pl.a1.unit06.lesson01.choose.001
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ogni sostantivo polacco ha un genere: chleb e ser sono maschili, kawa, herbata e woda sono femminili, masło e mleko sono neutri.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson01.listen.002
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In polacco non esistono articoli come il, un o la, quindi chleb può significare pane, il pane o un pane.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson01.order.003
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: word_order
  frame:
    text: Proszę o {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dopo proszę o, i sostantivi femminili in -a cambiano in -ę (kawa, kawę), mentre i maschili e i neutri come chleb e mleko restano uguali.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson01.fill.004
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: fill_in_blank
  frame:
    text: Proszę o {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Proszę o seguito dalla forma dell'oggetto è il modo cortese per chiedere qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson01.translate.005
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: Mi porti dell'acqua, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Il sostantivo dopo proszę o è nella forma dell''oggetto: woda diventa wodę.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson01.translate.006
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Masło e mleko terminano in -o, una tipica desinenza neutra, mentre chleb e ser terminano in consonante e sono maschili.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson02.choose.001
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lubić è la forma del dizionario; lubię si usa per parlare di sé e lubi per parlare di un'altra persona.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson02.match.002
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Le desinenze verbali indicano la persona: -ę per io (lubię) e -i per lui o lei (lubi).'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson02.order.003
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: word_order
  frame:
    text: Lubię {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Dopo lubię ciò che ti piace prende la forma dell''oggetto: zupa diventa zupę, mentre sok, chleb e ser restano invariati.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson02.fill.004
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: fill_in_blank
  frame:
    text: On {item} zupę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lubi è la forma di terza persona singolare (lui o lei), quindi si può usare con il pronome on.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson02.translate.005
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: Mi piace la zuppa.
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: I nomi femminili in -a prendono -ę quando sono complemento oggetto, quindi zupa diventa zupę.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson02.translate.006
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La coppia lubię e lubi mostra lo schema: una desinenza diversa per ogni persona.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson03.listen.001
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Polecać funziona come lubić: polecam significa «io consiglio» e poleca significa «lui, lei o, con pan o pani, Lei consiglia».'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson03.match.002
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Co pan poleca? usa la forma di terza persona singolare poleca, perché pan e pani richiedono il verbo alla terza persona.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson03.order.003
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: word_order
  frame:
    text: Polecam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Polecam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Anche polecam vuole il nome nella forma dell'oggetto, proprio come lubię.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson03.fill.004
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: fill_in_blank
  frame:
    text: Już {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il cameriere parla alla prima persona, podaję, perché è lui che serve.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson03.translate.005
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: Che cosa mi consiglia? (a un uomo, forma di cortesia)
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Con pan o pani il verbo è poleca, la stessa forma di «lui» o «lei».
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit06.lesson03.translate.006
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Już può significare «già» oppure, come in Już podaję, «subito».
    language_code: it
    direction: ltr
