templates:
- content_key: practice.it-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le ore dell'orologio usano gli ordinali femminili (pierwsza, druga, trzecia) perché concordano con la parola sottintesa godzina.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Per dire l'ora il polacco usa pierwsza, druga, trzecia, non pierwszy, drugi, trzeci.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le ore sono numeri ordinali: pierwsza significa letteralmente «prima», quindi l''una è «la prima ora».'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La risposta a Która jest godzina? è semplicemente Jest + l'ora, con l'ordinale femminile.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? è il modo standard per chiedere l'ora; która è femminile perché godzina lo è.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: Sono le tre. (due parole)
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: L'ora dell'orologio è un ordinale femminile, quindi «le tre» si dice trzecia, non trzy.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano significa di mattina, wieczorem di sera e w nocy di notte.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In Ewa wstaje o siódmej rano prima viene l'ora e poi il momento della giornata.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.translate.003
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje e odjeżdża sono forme di terza persona singolare (lui/lei), che finiscono in -e o -a e non in -m.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.match.004
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rano (di mattina) e wieczorem (di sera) non richiedono preposizione, mentre mezzogiorno e notte sono w południe e w nocy.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.order.005
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Ewa wstaje o siódmej {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wstaje o siódmej {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa wstaje o siódmej rano mette prima l'ora e poi il momento della giornata.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.order.006
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Pociąg odjeżdża o czwartej po {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu significa di pomeriggio, mentre a mezzogiorno si dice w południe, con una desinenza diversa.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.fill.007
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: fill_in_blank
  frame:
    text: Ewa {item} o siódmej rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje è la forma di terza persona (lui/lei) del verbo, ed è per questo che va bene con Ewa.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: A che ora? (tre parole)
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie significa «a che ora» ed entrambe le parole prendono la desinenza usata dopo o.
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: Il treno parte alle quattro del pomeriggio.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Dopo o l''ora cambia desinenza: czwarta diventa o czwartej.'
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson03.order.001
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: word_order
  frame:
    text: Dobrze, {item} o czwartej po południu?
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może significa «magari» e ammorbidisce una proposta, come in «Magari alle quattro?»
    language_code: it
    direction: ltr
- content_key: practice.it-pl.pl.a1.unit04.lesson03.translate.002
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: translation
  frame:
    text: Va bene, magari alle quattro del pomeriggio?
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może trasforma una proposta in un suggerimento cortese, come in Może o czwartej?
    language_code: it
    direction: ltr
