  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zgubiony
        - w_zgubił
        - w_znaleziony
        - w_został
        - w_plecak
        - w_informacji
        - w_portfel
        - w_informacja
        - w_idziemy
        - w_szuka
        - w_zajrzyj
        - w_kurtki
        - w_dosyć
        - w_emocji
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, della lezione su ciò che è smarrito e ritrovato.'
    language_code: it
    direction: ltr
