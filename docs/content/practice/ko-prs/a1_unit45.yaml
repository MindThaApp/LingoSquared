- content_key: practice.ko-prs.prs.a1.unit45.lesson04.fill.001
  lesson_content_key: prs.a1.unit45.lesson04.hotel_checkin_dialogue
  type: translation
  frame:
    text: 아침 차가 포함되어 있어요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: prs
      part_of_speech: adjective
      agreement_tags:
        semantic: inclusion_word
  answer_derivation:
    kind: render_frame
    frame:
      text: چای صبح {item} است
      language_code: prs
      direction: rtl
  feedback_frame:
    text: '"아침 차가 포함되어 있어요."는 다리어로 چای صبح شامل است예요. (شامل은 ''포함된''이라는 뜻이에요.)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-prs.prs.a1.unit45.lesson03.order.001
  lesson_content_key: prs.a1.unit45.lesson03.room_number_and_nights
  type: word_order
  frame:
    text: دو شب {verb}
    language_code: prs
    direction: rtl
  slots:
    verb: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: دو شب {verb}
      language_code: prs
      direction: rtl
  feedback_frame:
    text: '어순: دو شب می‌مانم (저는 이틀 밤 묵어요).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-prs.prs.a1.unit45.lesson04.match.001
  lesson_content_key: prs.a1.unit45.lesson04.hotel_checkin_dialogue
  type: matching_pairs
  frame:
    text: '{a} — {b} — {c} — {d} — {e} — {f}'
    language_code: prs
    direction: rtl
  slots:
    a: *id003
    b: *id003
    c: *id003
    d: *id003
    e: *id003
    f: *id003
  slot_relations:
  - kind: distinct
    slots:
    - a
    - b
    - c
    - d
    - e
    - f
  answer_derivation:
    kind: matching_pairs
    slots:
    - a
    - b
    - c
    - d
    - e
    - f
  feedback_frame:
    text: 각 단어를 알맞은 한국어 뜻과 연결하세요.
    language_code: ko
    direction: ltr
