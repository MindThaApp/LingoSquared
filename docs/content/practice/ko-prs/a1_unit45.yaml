    language_code: prs
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) A1 서비스 대화(호텔, 가게, 병원 등)에 나오는 단어예요.'
