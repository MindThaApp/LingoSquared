schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit61
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit61.quartier
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_agréable
    - w_connaissent
    - w_connaît
    - w_connaître
    - w_longtemps
    - w_salue
    - w_saluer
    - w_supermarché
    - w_voisin
templates:
- content_key: practice.zh-fr.fr.a1.unit61.lesson01.choose.001
  lesson_content_key: fr.a1.unit61.lesson01.le_quartier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_agréable
        - w_supermarché
        - w_voisin
        - w_connaître
        - w_saluer
        - w_salue
        - w_longtemps
        - w_connaît
        - w_connaissent
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一,出自关于街区的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson02.listen.001
  lesson_content_key: fr.a1.unit61.lesson02.mon_voisin_et_ma
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一,出自关于我的男邻居和女邻居的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson03.translate.001
  lesson_content_key: fr.a1.unit61.lesson03.sympa_et_saluer
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一,出自关于友善和打招呼的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson04.match.001
  lesson_content_key: fr.a1.unit61.lesson04.camille_rencontre_pierre
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson05.choose.001
  lesson_content_key: fr.a1.unit61.lesson05.qui_est_qui_dans
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“街区里的人”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson01.translate.002
  lesson_content_key: fr.a1.unit61.lesson01.le_quartier
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一,出自关于街区的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson01.order.003
  lesson_content_key: fr.a1.unit61.lesson01.le_quartier
  type: word_order
  frame:
    text: J'habite dans un quartier {item} à Lyon.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_agréable
  answer_derivation:
    kind: render_frame
    frame:
      text: J'habite dans un quartier {item} à Lyon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我住在里昂一个宜人的街区。agréable 的意思是“宜人的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson01.fill.004
  lesson_content_key: fr.a1.unit61.lesson01.le_quartier
  type: fill_in_blank
  frame:
    text: Le {item} est près d'ici. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_supermarché
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_supermarché
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 超市就在附近。supermarché 的意思是“超市”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson02.order.002
  lesson_content_key: fr.a1.unit61.lesson02.mon_voisin_et_ma
  type: word_order
  frame:
    text: Mon {item} s'appelle Pierre.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_voisin
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} s'appelle Pierre.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我的邻居叫皮埃尔。voisin 的意思是“邻居(男)”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson03.order.002
  lesson_content_key: fr.a1.unit61.lesson03.sympa_et_saluer
  type: word_order
  frame:
    text: Pierre est sympa et il aime me {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_saluer
  answer_derivation:
    kind: render_frame
    frame:
      text: Pierre est sympa et il aime me {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 皮埃尔很友好,他喜欢跟我打招呼。saluer 的意思是“打招呼”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson03.fill.003
  lesson_content_key: fr.a1.unit61.lesson03.sympa_et_saluer
  type: fill_in_blank
  frame:
    text: Je {item} Pierre tous les jours. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_salue
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_salue
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我每天都跟皮埃尔打招呼。salue 的意思是“打招呼”(第三人称单数)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit61.lesson05.order.002
  lesson_content_key: fr.a1.unit61.lesson05.qui_est_qui_dans
  type: word_order
  frame:
    text: Pierre et Sophie {item} bien Mathieu.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_connaissent
  answer_derivation:
    kind: render_frame
    frame:
      text: Pierre et Sophie {item} bien Mathieu.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 皮埃尔和苏菲很了解马蒂厄。connaissent 的意思是“他们认识、了解”。
    language_code: zh
    direction: ltr
