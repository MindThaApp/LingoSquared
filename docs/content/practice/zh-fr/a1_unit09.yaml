templates:
- content_key: practice.zh-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche 和 à droite 表示在左边、右边或向左、向右；名词 gauche 和 droite 是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Au carrefour 中，à 和 le 合成了 au：在十字路口。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson01.match.003
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tout droit 中的 droit 表示“笔直”，gauche 和 droite 则是左和右。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson01.order.004
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 向左或向右转要用 à，而不是 en，如 à gauche、à droite。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: fill_in_blank
  frame:
    text: Tournez à gauche au {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au 是 à 和 le 的缩合形式，所以 au carrefour 表示“在十字路口”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson01.translate.006
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: translation
  frame:
    text: 那家店在街角，右手边。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La boutique est au {item} de la rue, à droite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au coin de la rue 的意思是“在街角”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson02.choose.001
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tournez 和 continuez 是 vous 的命令式，用于面对陌生人或多个人时。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson02.listen.002
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jusqu'au 意为“一直到……”，后接阳性名词，如 jusqu'au carrefour。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson02.order.003
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: word_order
  frame:
    text: Continuez tout droit {item} carrefour.
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Continuez tout droit {item} carrefour.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Jusqu'au 由 jusqu'à 加 le 构成，用在阳性地点名词之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson02.fill.004
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: fill_in_blank
  frame:
    text: Excusez-moi, pour {item} à la boutique, s'il vous plaît ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pour aller à 是询问怎么去某地的标准说法；s'il vous plaît 表示礼貌。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson02.translate.005
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tournez 和 continuez 是 vous 的命令式，用于面对陌生人或多个人时。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.choose.001
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Exactement 表示要求更精确：elle est où exactement 的意思是“它究竟在哪里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.listen.002
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ensuite 表示“然后”“接着”，用来连接指路的各个步骤。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.match.003
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: tu 的动词形式 tournes、continues 和 traverses 都以 -es 结尾，对应路线的每一步。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.order.004
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: word_order
  frame:
    text: Ensuite, tu continues tout droit et tu {item} la rue.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, tu continues tout droit et tu {item} la rue.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu traverses 使用与 tu 搭配的 -es 词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.fill.005
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: fill_in_blank
  frame:
    text: Elle est où {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Exactement 为表示“在哪里”的问句增加精确性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.fill.006
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: fill_in_blank
  frame:
    text: Tu {item} une boutique pour acheter des ustensiles de cuisine ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Connais 是 connaître 的 tu 形式，用于表示认识某个地方或某个人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit09.lesson03.translate.007
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: translation
  frame:
    text: 你在十字路口向左转。（非正式，tu）
    language_code: zh
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à gauche au carrefour.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu tournes 使用与 tu 搭配的 -es 词尾。
    language_code: zh
    direction: ltr
