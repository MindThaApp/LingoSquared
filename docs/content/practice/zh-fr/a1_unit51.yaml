    - w_payé
    - w_principaux
    - w_séparément
    - w_tellement
    - w_total
    - w_votre
    - w_voulez
templates:
- content_key: practice.zh-fr.fr.a1.unit51.lesson02.choose.001
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_payer
        - w_carte
        - w_espèces
        - w_paie
        - w_voulez
        - w_partage
        - w_séparément
        - w_monnaie
        - w_votre
        - w_addition
        - w_principaux
        - w_cafés
        - w_total
        - w_payé
        - w_demande
        - w_tellement
        - w_aidé
        - w_gentil
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“刷卡还是付现金？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson03.listen.001
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
