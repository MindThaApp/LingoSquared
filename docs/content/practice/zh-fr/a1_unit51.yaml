    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“分摊账单”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson04.translate.001
  lesson_content_key: fr.a1.unit51.lesson04.la_monnaie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，来自关于找零的一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson05.match.001
  lesson_content_key: fr.a1.unit51.lesson05.lire_une_addition_de
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson06.choose.001
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
