  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“刷卡还是付现金？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson02.order.003
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: word_order
  frame:
    text: Je peux {item} par carte ici ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_payer
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux {item} par carte ici ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我可以在这里刷卡付款吗？payer 的意思是付款。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson02.fill.004
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: fill_in_blank
  frame:
    text: Vous voulez payer en espèces ou par {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 您想付现金还是刷卡？Vous voulez ... ? 是正式的问法，不认识的收银员会这样问；朋友之间会说 tu veux ... ?。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson02.translate.005
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: translation
  frame:
    text: 我付现金。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_espèces
  answer_derivation:
    kind: render_frame
    frame:
      text: Je paie en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我付现金。espèces 的意思是现金。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson03.order.002
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_partage
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我们AA制吧？partage 的意思是分摊、分享（用于我、他/她，或泛指的 on）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson03.fill.003
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: fill_in_blank
  frame:
    text: Je peux payer {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
    hint:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我可以分开付款吗？Séparément（分开地）紧跟在 payer 后面；这是礼貌地要求各付各的的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson04.order.002
  lesson_content_key: fr.a1.unit51.lesson04.la_monnaie
  type: word_order
  frame:
    text: Voici votre {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_monnaie
  answer_derivation:
    kind: render_frame
    frame:
      text: Voici votre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 这是您的找零。monnaie 的意思是找零（硬币）、零钱。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit51.lesson06.order.002
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_demande
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我们要结账吗？Demander（要求）后面直接接 l'addition 作宾语，中间不加其他词。
    language_code: zh
    direction: ltr
