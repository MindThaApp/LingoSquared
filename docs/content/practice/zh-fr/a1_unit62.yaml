schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit62
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit62.poste
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_achète
    - w_arrivent
    - w_colis
    - w_désirez
    - w_employé
    - w_lettre
    - w_met
    - w_mettre
    - w_timbre
    - w_écrire
templates:
- content_key: practice.zh-fr.fr.a1.unit62.lesson01.choose.001
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_lettre
        - w_colis
        - w_timbre
        - w_écrire
        - w_arrivent
        - w_mettre
        - w_met
        - w_employé
        - w_désirez
        - w_achète
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于信和包裹的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson02.listen.001
  lesson_content_key: fr.a1.unit62.lesson02.le_timbre_l_adresse
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于邮票、地址和书写的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson03.translate.001
  lesson_content_key: fr.a1.unit62.lesson03.arriver_et_mettre_du
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于到达和花费时间的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson04.match.001
  lesson_content_key: fr.a1.unit62.lesson04.a_la_poste
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson05.choose.001
  lesson_content_key: fr.a1.unit62.lesson05.camille_envoie_un_colis
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词语之一，出自“卡米耶寄包裹”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson01.translate.002
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于信和包裹的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson01.order.003
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: word_order
  frame:
    text: J'ai une {item} pour mon grand-père.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_lettre
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai une {item} pour mon grand-père.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我有一封给爷爷的信。lettre 的意思是信。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson01.fill.004
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: fill_in_blank
  frame:
    text: J'envoie un {item} à Marseille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colis
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colis
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我给马赛寄一个包裹。colis 的意思是包裹。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson02.order.002
  lesson_content_key: fr.a1.unit62.lesson02.le_timbre_l_adresse
  type: word_order
  frame:
    text: J'achète un {item} pour la lettre.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_timbre
  answer_derivation:
    kind: render_frame
    frame:
      text: J'achète un {item} pour la lettre.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我给这封信买一张邮票。timbre 的意思是邮票。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit62.lesson03.order.002
  lesson_content_key: fr.a1.unit62.lesson03.arriver_et_mettre_du
  type: word_order
  frame:
    text: La lettre {item} trois jours.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_met
  answer_derivation:
    kind: render_frame
    frame:
      text: La lettre {item} trois jours.
      language_code: fr
      direction: ltr
  feedback_frame:
