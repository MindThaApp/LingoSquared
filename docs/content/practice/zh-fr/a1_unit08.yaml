templates:
- content_key: practice.zh-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在法语中，lundi、samedi 和 dimanche 不大写；星期名称前加 le 表示每周都如此：le samedi。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson01.listen.002
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Demain 和 hier 分别是表示“明天”和“昨天”的副词，二者都不需要介词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson01.match.003
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 法语的星期名称是阳性词，用小写字母书写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson01.order.004
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: word_order
  frame:
    text: La pharmacie ouvre {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La pharmacie ouvre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Demain 的意思是“明天”，放在动词之后，不需要介词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson01.fill.005
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: fill_in_blank
  frame:
    text: La boulangerie est fermée le {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le dimanche 表示“每个星期日”，指有规律的习惯。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson01.translate.007
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: translation
  frame:
    text: 工作坊在星期六举行。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'atelier a lieu le samedi 的意思是工作坊每周六举行。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Premier 是只用于第一天的序数词；其他日期都用基数词：le premier mars，le quinze mars。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars 是一个月份；法语的月份和星期一样，首字母不大写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson02.order.003
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: word_order
  frame:
    text: Nous sommes le quinze {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous sommes le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 日期遵循 le + 数字 + 月份 的结构：le quinze mars。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson02.fill.004
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: fill_in_blank
  frame:
    text: L'atelier se {item} le vingt-deux mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se termine 是代词式动词形式，意思是“结束”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson02.translate.005
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: 今天是几号？
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} aujourd'hui ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle est la date aujourd'hui 是询问日历日期的标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson02.translate.006
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: 今天是三月十五日。（以 c'est 开头）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 法语的日期使用普通基数词，所以十五号就是 quinze。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson03.choose.001
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quand 表示“什么时候”；donc 用来引出根据刚才所说得出的结论。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson03.listen.002
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Séance 指一场活动或一次时段，例如工作坊的一次活动或一场电影放映。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson03.match.003
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Séance、idée 和 occasion 是阴性名词；temps 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson03.order.004
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: word_order
  frame:
    text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 在 avoir le temps de 之后，动词用原形：préparer。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson03.fill.005
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: fill_in_blank
  frame:
    text: C'est {item}, la dernière séance de l'atelier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'est quand ... ? 是询问某事何时发生的随意说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit08.lesson03.translate.006
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: translation
  frame:
    text: 好主意！
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonne {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Idée 是阴性名词，所以形容词用 bonne，而不是 bon。
    language_code: zh
    direction: ltr
