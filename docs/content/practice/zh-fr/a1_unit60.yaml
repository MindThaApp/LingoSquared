    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson01.order.002
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: word_order
  frame:
    text: Je {item} l'appartement.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_range
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} l'appartement.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我在整理公寓。range 的意思是“整理”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson01.fill.003
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: fill_in_blank
  frame:
    text: Nous {item} le désordre et Camille passe l'aspirateur dans le salon. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rangeons
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rangeons
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我们在收拾乱七八糟的东西，Camille在给客厅吸尘。rangeons 的意思是“我们整理”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson02.order.002
  lesson_content_key: fr.a1.unit60.lesson02.le_desordre_et_l
