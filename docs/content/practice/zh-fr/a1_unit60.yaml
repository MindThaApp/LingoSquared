schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit60
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit60.menage
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aide
    - w_désordre
    - w_fini
    - w_lessive
    - w_ménage
    - w_passer
    - w_range
    - w_rangeons
    - w_ranger
    - w_ranges
    - w_vaisselle
    - w_volontiers
templates:
- content_key: practice.zh-fr.fr.a1.unit60.lesson01.choose.001
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ranger
        - w_range
        - w_ranges
        - w_rangeons
        - w_désordre
        - w_passer
        - w_vaisselle
        - w_ménage
        - w_aide
        - w_lessive
        - w_fini
        - w_volontiers
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“整理收拾”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson02.listen.001
  lesson_content_key: fr.a1.unit60.lesson02.le_desordre_et_l
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“凌乱与吸尘”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson03.translate.001
  lesson_content_key: fr.a1.unit60.lesson03.tu_peux_aider
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“你能帮忙吗？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson04.match.001
  lesson_content_key: fr.a1.unit60.lesson04.camille_aide_mathieu_dimanche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson05.choose.001
  lesson_content_key: fr.a1.unit60.lesson05.qui_fait_quoi_a
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“谁在做哪些家务？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit60.lesson06.translate.001
  lesson_content_key: fr.a1.unit60.lesson06.l_appartement_est_fini
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
