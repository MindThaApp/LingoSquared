- content_key: practice.zh-fr.fr.a1.unit60.lesson03.order.002
  lesson_content_key: fr.a1.unit60.lesson03.tu_peux_aider
  type: word_order
  frame:
    text: Tu peux m'aider à faire la {item} ?
