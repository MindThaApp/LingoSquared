- content_key: practice.zh-fr.fr.a1.unit56.lesson03.order.002
  lesson_content_key: fr.a1.unit56.lesson03.acheter_un_billet
  type: word_order
  frame:
    text: Quel {item} de transport je prends pour aller au centre-ville ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_moyen
