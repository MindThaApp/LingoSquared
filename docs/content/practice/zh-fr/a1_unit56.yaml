        - w_utilises
        - w_mots
        - w_transports
        - w_inconnu
        - w_achats
        - w_moyen
        - w_surtout
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于火车、自行车、汽车和步行的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit56.lesson02.listen.001
