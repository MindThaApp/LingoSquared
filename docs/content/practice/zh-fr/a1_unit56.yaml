  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vélo
        - w_voyage
        - w_voiture
        - w_marcher
        - w_marche
        - w_voyager
        - w_leçons
