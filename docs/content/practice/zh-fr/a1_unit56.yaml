    kind: render_frame
    frame:
      text: Quel {item} de transport je prends pour aller au centre-ville ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我去市中心该坐什么交通工具？moyen 的意思是方式，手段。
    language_code: zh
    direction: ltr
