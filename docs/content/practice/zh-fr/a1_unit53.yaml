  lesson_content_key: fr.a1.unit53.lesson02.decrire_les_cheveux
  type: fill_in_blank
  frame:
    text: Thomas a les cheveux {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_courts
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_courts
  answer_derivation:
