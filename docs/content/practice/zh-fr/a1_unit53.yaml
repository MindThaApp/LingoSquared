- content_key: practice.zh-fr.fr.a1.unit53.lesson06.order.002
  lesson_content_key: fr.a1.unit53.lesson06.mathieu_reconnait_nina
  type: word_order
  frame:
    text: Ravie de te {item} aussi !
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rencontrer
