schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit53
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit53.apparence
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_bleus
    - w_blonds
    - w_bruns
    - w_cheveux
    - w_courts
    - w_différents
    - w_gris
    - w_générale
    - w_impression
    - w_jeune
    - w_langues
    - w_longs
    - w_modèle
    - w_noirs
    - w_nouvelle
    - w_personne
    - w_pluriel
    - w_possédé
    - w_précis
    - w_ravi
    - w_reconnaître
    - w_rencontrer
    - w_ressemblent
    - w_verts
    - w_vient
    - w_vieux
    - w_yeux
templates:
- content_key: practice.zh-fr.fr.a1.unit53.lesson01.choose.001
  lesson_content_key: fr.a1.unit53.lesson01.grand_petit_vieux_et
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vieux
        - w_jeune
        - w_précis
        - w_impression
        - w_générale
        - w_cheveux
        - w_courts
        - w_noirs
        - w_blonds
        - w_bruns
        - w_gris
        - w_longs
        - w_pluriel
        - w_yeux
        - w_possédé
        - w_personne
        - w_bleus
        - w_verts
        - w_nouvelle
        - w_vient
        - w_langues
        - w_reconnaître
        - w_ressemblent
        - w_différents
        - w_modèle
        - w_ravi
        - w_rencontrer
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“高、矮、年长、年轻”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson02.listen.001
  lesson_content_key: fr.a1.unit53.lesson02.decrire_les_cheveux
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“描述头发”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson03.translate.001
  lesson_content_key: fr.a1.unit53.lesson03.les_yeux_et_comment
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“眼睛与某人长什么样？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson04.match.001
  lesson_content_key: fr.a1.unit53.lesson04.camille_decrit_nina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson05.choose.001
  lesson_content_key: fr.a1.unit53.lesson05.comparer_thomas_et_lea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“比较托马和蕾雅”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson06.translate.001
  lesson_content_key: fr.a1.unit53.lesson06.mathieu_reconnait_nina
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“马蒂厄认出妮娜”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson01.order.002
  lesson_content_key: fr.a1.unit53.lesson01.grand_petit_vieux_et
  type: word_order
  frame:
    text: Mon grand-père est {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_vieux
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon grand-père est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 爷爷年纪大了。vieux 的意思是“老的”（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson01.fill.003
  lesson_content_key: fr.a1.unit53.lesson01.grand_petit_vieux_et
  type: fill_in_blank
  frame:
    text: Mathieu est {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_jeune
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_jeune
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 马蒂厄很年轻。jeune 的意思是“年轻的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit53.lesson02.order.002
  lesson_content_key: fr.a1.unit53.lesson02.decrire_les_cheveux
  type: word_order
  frame:
    text: Mathieu a les {item} courts et noirs.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_cheveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Mathieu a les {item} courts et noirs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 马蒂厄有黑色短发。cheveux 的意思是“头发”。
    language_code: zh
    direction: ltr
