schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit50
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit50.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appeler
    - w_appelles
    - w_composé
    - w_compte
    - w_dire
    - w_dois
    - w_entendre
    - w_fière
    - w_parlez
    - w_pensais
    - w_pensé
    - w_rappelle
    - w_sms
    - w_truc
    - w_vite
    - w_évidemment
templates:
- content_key: practice.zh-fr.fr.a1.unit50.lesson01.choose.001
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_appeler
        - w_dois
        - w_parlez
        - w_vite
        - w_sms
        - w_rappelle
        - w_dire
        - w_truc
        - w_évidemment
        - w_appelles
        - w_pensais
        - w_composé
        - w_pensé
        - w_entendre
        - w_fière
        - w_compte
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“我会给你打电话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson02.listen.001
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“请问您是哪位？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson03.translate.001
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“你能再说一遍吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson04.match.001
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson05.choose.001
  lesson_content_key: fr.a1.unit50.lesson05.lire_une_conversation_par
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“阅读短信对话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson06.translate.001
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“下班后的一通电话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson01.order.002
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: word_order
  frame:
    text: Je {item} t'appeler.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_dois
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} t'appeler.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我得给你打电话。dois 表示“必须”；是 tu 对应的非正式说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson02.order.002
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: word_order
  frame:
    text: Vous {item} avec Camille.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_parlez
  answer_derivation:
    kind: render_frame
    frame:
      text: Vous {item} avec Camille.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 您正在和 Camille 通话。Vous parlez avec + 名字 是与 c'est + 名字 相对应的正式说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson03.order.002
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: word_order
  frame:
    text: Ne parle pas si {item}, s'il te plaît.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vite
  answer_derivation:
    kind: render_frame
    frame:
      text: Ne parle pas si {item}, s'il te plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 请不要说得这么快。Ne parle pas si vite 是否定句：ne ... pas 把 parle 夹在中间，si 的意思是“这么”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson04.order.002
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: word_order
  frame:
    text: Je te {item} plus tard.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rappelle
  answer_derivation:
    kind: render_frame
    frame:
      text: Je te {item} plus tard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我稍后给你回电话。Rappeler（回电话）中的 re- 已经带有“回”的意思；plus tard 的意思是“稍后”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson06.order.002
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: word_order
  frame:
    text: Ça s'est très bien passé, mieux que je {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pensais
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça s'est très bien passé, mieux que je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 进行得非常顺利，比我想的还要好。Ça s'est très bien passé 和 je pensais 在这里都是固定说法；je pensais 是 penser（想）的未完成过去时。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit50.lesson06.fill.003
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: fill_in_blank
  frame:
    text: Merci beaucoup, ça {item} beaucoup pour moi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 谢谢你，这对我来说很重要。这里 compter 的意思是“重要、有分量”：ça compte pour moi（这对我很重要）；pour moi 表示对谁来说重要。
    language_code: zh
    direction: ltr
