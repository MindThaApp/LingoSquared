schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit54
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit54.animaux
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_adore
    - w_aimons
    - w_ajoute
    - w_animal
    - w_animaux
    - w_aucun
    - w_brun
    - w_chat
    - w_chats
    - w_chien
    - w_chiens
    - w_compagnie
    - w_deviennent
    - w_donne
    - w_donner
    - w_manger
    - w_oiseau
    - w_oiseaux
    - w_poil
    - w_poissons
    - w_promènes
    - w_seulement
    - w_tous
    - w_voyelle
templates:
- content_key: practice.zh-fr.fr.a1.unit54.lesson01.choose.001
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_animal
        - w_compagnie
        - w_chien
        - w_chat
        - w_oiseau
        - w_deviennent
        - w_voyelle
        - w_tous
        - w_promènes
        - w_donner
        - w_manger
        - w_donne
        - w_ajoute
        - w_chiens
        - w_chats
        - w_animaux
        - w_adore
        - w_poissons
        - w_oiseaux
        - w_poil
        - w_brun
        - w_seulement
        - w_aucun
        - w_aimons
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于狗、猫、鱼和鸟的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson02.listen.001
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于照顾宠物的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson03.translate.001
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于喜爱动物的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson04.match.001
  lesson_content_key: fr.a1.unit54.lesson04.mathieu_pose_des_questions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson05.choose.001
  lesson_content_key: fr.a1.unit54.lesson05.mathieu_lea_et_thomas
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于马蒂厄、莉娅和托马谈动物的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson06.translate.001
  lesson_content_key: fr.a1.unit54.lesson06.l_oiseau_de_nina
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于尼娜的鸟的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson01.order.002
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: word_order
  frame:
    text: Un chien est un {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_animal
  answer_derivation:
    kind: render_frame
    frame:
      text: Un chien est un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 狗是一种动物。animal 的意思是动物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson01.fill.003
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: fill_in_blank
  frame:
    text: Un chien est aussi un animal de {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compagnie
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compagnie
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 狗也是宠物。compagnie 的意思是陪伴。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson01.translate.004
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: translation
  frame:
    text: 卡米耶有一条狗。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chien
  answer_derivation:
    kind: render_frame
    frame:
      text: Camille a un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 卡米耶有一条狗。chien 的意思是狗。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson02.order.002
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: word_order
  frame:
    text: Je promène le chien {item} les jours.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_tous
  answer_derivation:
    kind: render_frame
    frame:
      text: Je promène le chien {item} les jours.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我每天遛狗。tous 的意思是每；所有的（阳性复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson02.fill.003
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: fill_in_blank
  frame:
    text: Tu le {item} tous les jours ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_promènes
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_promènes
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你每天遛它吗？promènes 的意思是散步，遛（你，非正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson02.translate.004
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: translation
  frame:
    text: 我每天喂猫。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_manger
  answer_derivation:
    kind: render_frame
    frame:
      text: Je donne à {item} au chat tous les jours.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我每天喂猫。manger 的意思是吃。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson03.order.002
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: word_order
  frame:
    text: Mathieu adore les {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chiens
  answer_derivation:
    kind: render_frame
    frame:
      text: Mathieu adore les {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 马蒂厄喜欢狗。chiens 的意思是狗（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson03.fill.003
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: fill_in_blank
  frame:
    text: Léa adore les {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chats
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chats
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 莉娅喜欢猫。chats 的意思是猫（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson03.translate.004
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: translation
  frame:
    text: 我喜欢动物。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_animaux
  answer_derivation:
    kind: render_frame
    frame:
      text: J'adore les {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我喜欢动物。Adorer（非常喜欢）后面直接接名词，表示泛指的喜好时要用 les：J'adore les animaux。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson04.order.002
  lesson_content_key: fr.a1.unit54.lesson04.mathieu_pose_des_questions
  type: word_order
  frame:
    text: Il a le {item} brun et il est petit.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_poil
  answer_derivation:
    kind: render_frame
    frame:
      text: Il a le {item} brun et il est petit.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 他的毛是棕色的，个子小小的。这里复用了外貌单元中的发色和身材词汇，只是现在用来描述动物的毛，而不是人的头发。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit54.lesson06.order.002
  lesson_content_key: fr.a1.unit54.lesson06.l_oiseau_de_nina
  type: word_order
  frame:
    text: C'est super, nous {item} tous les trois les animaux !
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_aimons
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est super, nous {item} tous les trois les animaux !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 太好了，我们三个人都喜欢动物！这句话呼应了本单元三位人物各自与动物有关的内容。
    language_code: zh
    direction: ltr
