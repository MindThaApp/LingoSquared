templates:
- content_key: practice.zh-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet、le poisson、le riz 和 le vin 是阳性，而 la salade 是阴性；l'eau 的冠词在元音 eau 前省音。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson01.listen.002
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café 既指饮品，也指场所；要根据语境判断是哪一个。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson01.match.003
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 在容器名词之后，法语只用 de，不加冠词：un verre de vin，un verre d'eau。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson01.translate.004
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些是菜单上的食物和饮品；记名词时要连冠词一起记：le vin，la salade。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.choose.001
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi? 是服务员询问您是否已决定点什么的说法；avez choisi 是过去时形式，字面意思是“已经选了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.order.002
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Je voudrais un {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un 用在阳性名词之前，例如 café、dessert 和 verre。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.order.003
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Qu'est-ce que vous avez comme {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que vous avez comme {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 这里的 Comme 意思是“作为”或“用作”：你们有什么甜点？
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.fill.004
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: Vous {item} choisi ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vous avez choisi? 是服务员使用 vous 的礼貌问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.fill.005
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: C'est {item} ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Délicieux 是阳性单数，因为 c'est 指的是不特指的事物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.fill.006
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: '{item}, s''il vous plaît. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'addition 是要求买单的说法；其中的 l' 是冠词 le/la 在元音前的缩写形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.translate.007
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: 我想要一杯咖啡，谢谢。（正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais un café, s'il vous plaît 是标准的礼貌点单说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson02.translate.008
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: 太好吃了！
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est délicieux! 是对厨师或食物的称赞。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson03.choose.001
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rouge 的阳性和阴性形式相同：un verre de vin rouge，一杯红酒。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson03.listen.002
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cette 用在阴性名词之前（cette salade）；对应的阳性形式是 ce。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson03.match.003
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id015
    second: *id015
    third: *id015
    fourth: *id015
    fifth: *id015
    sixth: *id015
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Délicieux 和 rouge 用来描述名词；avez、choisi 和 donné 是过去时或现在时的动词形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson03.order.004
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: word_order
  frame:
    text: Je voudrais une {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais une {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Une 用在阴性名词之前，例如 salade 和 boisson。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson03.translate.005
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rouge、délicieux 以及动词形式 avez、choisi 和 donné 都出现在咖啡馆的场景中。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit05.lesson03.translate.006
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: 工作坊让我们饿了。
    language_code: zh
    direction: ltr
  slots:
    item: *id018
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier nous a {item} faim.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Donner faim 是习惯用语，字面意思是“工作坊给了我们饥饿”。
    language_code: zh
    direction: ltr
