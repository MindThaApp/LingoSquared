schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit49
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit49.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arriver
    - w_colère
    - w_content
    - w_fier
    - w_honnêtement
    - w_nerveux
    - w_nouveau
    - w_pense
    - w_pourquoi
    - w_remplace
    - w_sent
    - w_seras
    - w_service
    - w_seul
    - w_sûrement
    - w_triste
    - w_vas
    - w_vraiment
templates:
- content_key: practice.zh-fr.fr.a1.unit49.lesson01.choose.001
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_content
        - w_triste
        - w_colère
        - w_pourquoi
        - w_nerveux
        - w_service
        - w_sent
        - w_seul
        - w_nouveau
        - w_pense
        - w_honnêtement
        - w_vas
        - w_arriver
        - w_vraiment
        - w_seras
        - w_sûrement
        - w_fier
        - w_remplace
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“开心、难过还是生气？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson02.listen.001
  lesson_content_key: fr.a1.unit49.lesson02.pourquoi_es_tu_content
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“你为什么开心？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson03.translate.001
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“对某事感到紧张”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson04.match.001
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson05.choose.001
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“阅读关于心情的消息”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson06.translate.001
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“Camille 安慰 Mathieu”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson01.order.002
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: word_order
  frame:
    text: Je suis {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_content
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我很开心。content 的意思是开心、高兴（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson01.fill.003
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: fill_in_blank
  frame:
    text: Je suis {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_triste
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_triste
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我很难过。triste 的意思是难过。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson01.translate.004
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: translation
  frame:
    text: 我很生气。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colère
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我很生气。colère 的意思是愤怒。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson03.order.002
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: word_order
  frame:
    text: Je suis {item} avant mon premier service.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nerveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} avant mon premier service.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我对我第一次上班很紧张。nerveux 的意思是紧张的（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你好 Mathieu，你对第一次上班感觉怎么样？Avant ton premier service（在你第一次上班之前）用的是第3课学过的 avant + 名词 结构。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mathieu 感觉怎么样？Se sentir（感觉，代词式动词）是询问或描述情绪状态的标准说法；它也出现在健康单元中。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 是的，我也这么认为。Je pense aussi 是表示赞同他人看法的自然说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 老实说，我有点紧张。Honnêtement（老实说）让这种坦白显得委婉。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 别担心，你一定能做好！Tu vas y arriver（字面意思是“你会到达那里”）是一个鼓励人的固定表达；aller + 动词原形 构成近将来时。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: 谢谢，这真的帮了我大忙。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 谢谢，这真的帮了我大忙。Aide 是 aider（帮助）的 il/elle 形式；m' 代表 me。
    language_code: zh
    direction: ltr
