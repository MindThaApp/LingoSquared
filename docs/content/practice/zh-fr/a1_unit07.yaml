templates:
- content_key: practice.zh-fr.fr.a1.unit07.lesson01.choose.001
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La gare、la pharmacie、la banque 和 la poste 都是阴性名词，所以用 la；l'école 因为以元音开头，所以用 l'。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson01.listen.002
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La poste 是邮局；和 gare、pharmacie、banque 一样，它是阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson01.order.003
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: word_order
  frame:
    text: La {item} est grande.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} est grande.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 这些名词是阴性，所以冠词用 la，形容词 grande 也带阴性的 -e。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson01.fill.004
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: fill_in_blank
  frame:
    text: La {item} est fermée le dimanche. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée 以 -e 结尾，因为 banque 是阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson01.translate.005
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: translation
  frame:
    text: 火车站很大。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} est grande.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: La gare est grande：gare 是阴性名词，所以 la 和 grande 都要与它保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson02.choose.001
  lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Où 用来问“在哪里”；en face de 和 à côté de 是表示位置的短语，后面的名词前需要 de。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson02.listen.002
  lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Loin d'ici 的意思是“离这里远”；près d'ici 则相反。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson02.order.003
  lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
  type: word_order
  frame:
    text: La pharmacie est à {item} de la banque.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La pharmacie est à {item} de la banque.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: À côté de 的意思是“在……旁边”；de 把它与后面的名词连接起来。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson02.fill.004
  lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
  type: fill_in_blank
  frame:
    text: La banque est en {item} de la gare. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En face de 的意思是“在……对面”，名词前需要 de。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson02.translate.005
  lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
  type: translation
  frame:
    text: 邮局离这里很远。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: La poste est {item} d'ici.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Loin d'ici 的意思是“离这里远”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson03.choose.001
  lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Excusez-moi 是在提问前礼貌地引起陌生人注意的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson03.listen.002
  lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Excusez-moi 是动词 excuser 的 vous 形式，所以用于对陌生人说话。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson03.match.003
  lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: La gare、la pharmacie、la banque 和 la poste 都是阴性名词；excusez-moi 可用来向陌生人开启任何提问。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson03.fill.004
  lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
  type: fill_in_blank
  frame:
    text: Cinq {item} à pied. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cinq minutes à pied 的意思是“步行五分钟”；cinq 之后 minutes 用复数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit07.lesson03.translate.005
  lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
  type: translation
  frame:
    text: 步行五分钟。
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Cinq minutes à {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: À pied 的意思是“步行”，所以 cinq minutes à pied 就是五分钟的步行路程。
    language_code: zh
    direction: ltr
