  lesson_content_key: fr.a1.unit77.lesson01.je_veux_aller_au
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_visiter
        - w_visite
        - w_fermer
        - w_guide
        - w_nécessaire
        - w_tableau
        - w_exposition
        - w_tableaux
        - w_concert
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,来自“我想去博物馆”一课。'
    language_code: zh
    direction: ltr
