    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_rhume
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_rhume
  answer_derivation:
