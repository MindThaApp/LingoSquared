  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“卡米耶关心马蒂厄”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson01.order.002
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: word_order
  frame:
    text: Je ne me {item} pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sens
  answer_derivation:
    kind: render_frame
    frame:
      text: Je ne me {item} pas bien.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我觉得不舒服。Se sentir 是反身动词（je me sens）；ne ... pas bien 是表示状态不对劲的一般、温和的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson01.fill.003
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: fill_in_blank
  frame:
    text: Je suis {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_malade
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_malade
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我生病了。malade 的意思是生病的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson01.translate.004
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: translation
  frame:
    text: 我头痛。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_tête
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai mal à la {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我头疼。tête 的意思是头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson02.order.002
  lesson_content_key: fr.a1.unit44.lesson02.qu_est_ce_qui
  type: word_order
  frame:
    text: J'ai mal à la {item}.
    language_code: fr
