- content_key: practice.zh-fr.fr.a1.unit44.lesson04.order.002
  lesson_content_key: fr.a1.unit44.lesson04.a_la_pharmacie
  type: word_order
  frame:
    text: Je peux vous {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_aider
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux vous {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我能帮您什么吗？Je peux vous aider ? 是正式场合服务人员的标准问候语；vous 是敬称。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson04.fill.003
  lesson_content_key: fr.a1.unit44.lesson04.a_la_pharmacie
  type: fill_in_blank
  frame:
    text: Avez-vous {item} chose contre le mal de tête ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_quelque
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_quelque
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 您有治头疼的药吗？Quelque chose contre + 症状 是询问药物的自然说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson04.translate.004
  lesson_content_key: fr.a1.unit44.lesson04.a_la_pharmacie
  type: translation
  frame:
    text: 我吃一片药。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_comprimé
  answer_derivation:
    kind: render_frame
    frame:
      text: Je prends un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我吃一片药。comprimé 的意思是药片。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson06.order.002
  lesson_content_key: fr.a1.unit44.lesson06.camille_prend_des_nouvelles
  type: word_order
  frame:
    text: Tu as {item} un comprimé ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pris
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} un comprimé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 你吃药片了吗？Pris 是 prendre 的过去分词，与 avoir 的 as 连用：tu as pris。
    language_code: zh
    direction: ltr
