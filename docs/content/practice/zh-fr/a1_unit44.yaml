schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit44
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit44.sante
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aider
    - w_bois
    - w_comprimé
    - w_conseil
    - w_disent
    - w_fièvre
    - w_fois
    - w_gorge
    - w_jours
    - w_maintenant
    - w_malade
    - w_médecin
    - w_prenez
    - w_pris
    - w_quelque
    - w_reposer
    - w_rhume
    - w_rétablissement
    - w_sens
    - w_toujours
    - w_tête
    - w_ventre
    - w_vouvoie
templates:
- content_key: practice.zh-fr.fr.a1.unit44.lesson01.choose.001
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sens
        - w_malade
        - w_tête
        - w_ventre
        - w_gorge
        - w_fièvre
        - w_rhume
        - w_disent
        - w_aider
        - w_quelque
        - w_comprimé
        - w_prenez
        - w_fois
        - w_vouvoie
        - w_conseil
        - w_bois
        - w_toujours
        - w_jours
        - w_médecin
        - w_pris
        - w_reposer
        - w_maintenant
        - w_rétablissement
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“我不舒服”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson02.listen.001
  lesson_content_key: fr.a1.unit44.lesson02.qu_est_ce_qui
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“哪里不舒服？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson03.translate.001
  lesson_content_key: fr.a1.unit44.lesson03.fievre_et_rhume
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“发烧和感冒”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson04.match.001
  lesson_content_key: fr.a1.unit44.lesson04.a_la_pharmacie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit44.lesson05.choose.001
  lesson_content_key: fr.a1.unit44.lesson05.lire_une_note_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
