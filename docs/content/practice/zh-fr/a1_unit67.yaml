    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自关于紧急电话号码和紧急出口的课程。'
    language_code: zh
    direction: ltr
