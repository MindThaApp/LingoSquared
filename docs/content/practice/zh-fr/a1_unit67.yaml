schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit67
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit67.urgences
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ambulance
    - w_bibliothèque
    - w_dehors
    - w_incendie
    - w_police
    - w_pompiers
    - w_secours
templates:
- content_key: practice.zh-fr.fr.a1.unit67.lesson01.choose.001
  lesson_content_key: fr.a1.unit67.lesson01.aide_et_incendie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_incendie
        - w_secours
        - w_police
        - w_ambulance
        - w_pompiers
        - w_bibliothèque
        - w_dehors
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自关于求助和火灾的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit67.lesson02.listen.001
  lesson_content_key: fr.a1.unit67.lesson02.le_numero_d_urgence
  type: listen_select
