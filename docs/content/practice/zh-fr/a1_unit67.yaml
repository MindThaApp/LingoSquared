    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit67.lesson05.match.001
  lesson_content_key: fr.a1.unit67.lesson05.lire_un_texte_sur
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
