schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit47
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit47.meteo
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_chaud
    - w_ensoleillé
    - w_faisons
    - w_film
    - w_froid
    - w_journée
    - w_météo
    - w_nuageux
    - w_pleut
    - w_promenade
    - w_toute
    - w_tranquillement
templates:
- content_key: practice.zh-fr.fr.a1.unit47.lesson01.choose.001
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ensoleillé
        - w_pleut
        - w_nuageux
        - w_froid
        - w_chaud
        - w_météo
        - w_toute
        - w_journée
        - w_promenade
        - w_faisons
        - w_tranquillement
        - w_film
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“天气怎么样?”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson02.listen.001
