    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson06.order.002
  lesson_content_key: fr.a1.unit47.lesson06.faire_des_projets_pour
  type: word_order
  frame:
    text: Parfait, alors on regarde un {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_film
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, alors on regarde un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 太好了,那我们看电影吧。Regarder(看)自然地与 un film(一部电影)搭配。
    language_code: zh
    direction: ltr
