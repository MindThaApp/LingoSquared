  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“天气预报”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson04.match.001
  lesson_content_key: fr.a1.unit47.lesson04.faire_des_projets_selon
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson06.choose.001
  lesson_content_key: fr.a1.unit47.lesson06.faire_des_projets_pour
