  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“制定周末计划”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson01.translate.002
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“天气怎么样?”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson01.order.003
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: word_order
  frame:
    text: Le temps est {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_ensoleillé
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 天气晴朗。Le temps est + 形容词是常用句型;形容词与阳性名词 temps 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson01.fill.004
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: fill_in_blank
  frame:
    text: S'il {item}, on reste à l'intérieur. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 如果下雨,我们就待在室内。S'il pleut(如果下雨):si + il 变成 s'il;然后用 on reste à l'intérieur 说明要做的事。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson01.translate.005
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: translation
  frame:
    text: 天空多云。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nuageux
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 天空多云。与 ensoleillé 一样,都使用 le temps est + 形容词的句型。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson02.order.002
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: word_order
  frame:
    text: Il fait {item} aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_froid
  answer_derivation:
    kind: render_frame
    frame:
      text: Il fait {item} aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 今天很冷。Aujourd'hui(今天)指明天气的时间;il fait froid 用的是 faire,而不是 être。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson02.fill.003
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: fill_in_blank
  frame:
    text: Il fait {item} aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 今天很暖和。在日常谈论天气时,Il fait chaud 既可表示“暖和”,也可表示“炎热”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson03.order.002
  lesson_content_key: fr.a1.unit47.lesson03.la_meteo
  type: word_order
  frame:
    text: Quelle est la {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_météo
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 天气预报怎么说?météo 的意思是天气预报。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit47.lesson04.order.002
  lesson_content_key: fr.a1.unit47.lesson04.faire_des_projets_selon
