templates:
- content_key: practice.zh-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marché 和 prix 是阳性（le marché、le prix），而 boulangerie 是阴性（la boulangerie）；学每个名词时要连同冠词一起记。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 许多市场用词是食品名词，在数量后面加 de 使用：un kilo de tomates、un litre de lait。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 重量和容量单位后面，在食品前要加 de：un kilo de tomates、un litre de lait。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
  frame:
    text: Les {item} sont chers aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Chers 是阳性复数，因为 légumes 和 fruits 都是阳性复数名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: fill_in_blank
  frame:
    text: La {item} est fermée aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée 以 -ée 结尾，因为 boulangerie 是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson01.translate.006
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 法语的每个名词都要连同冠词一起学：le marché、le prix、la boulangerie。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Euro 的复数加 -s（euros），但这个 s 不发音，所以听到的是数字，而不是词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chers 是 cher 的复数形式；形容词加 -s，以与 les légumes 这样的复数名词一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais 是礼貌地提出请求的说法；un kilo de + 名词表示数量。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien? 用来问某一件东西的价格；le 表明这个名词是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Combien ça {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte? 用来问某物多少钱，适用于任何一件东西。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je voudrais 比 je veux 更礼貌；点东西时说 je veux 会显得生硬。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cher 要与名词一致：cher（阳性单数）、chers（阳性复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: 请给我一公斤{item}。（正式）
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît 是礼貌的“请”；对朋友可以说 s'il te plaît。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson02.translate.009
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: 面包多少钱？
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien le pain? 用来问一件商品的价格；回答一开头是以欧元计的金额。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson03.choose.001
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 递东西给别人或指给别人看时说 Voilà：给你、在这儿。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson03.match.002
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id016
    second: *id016
    third: *id016
    fourth: *id016
    fifth: *id016
    sixth: *id016
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fermée 是阴性，因为它描述的是 la boulangerie；如果是阳性名词，则用 fermé。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit04.lesson03.fill.003
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: fill_in_blank
  frame:
    text: On peut {item} du pain ici aussi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 peut（可以）之后，下一个动词保持原形：on peut acheter。
    language_code: zh
    direction: ltr
