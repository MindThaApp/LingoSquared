schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit57
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit57.technologie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appelle
    - w_appli
    - w_cherches
    - w_envoie
    - w_envoies
    - w_internet
    - w_lit
    - w_message
    - w_nommer
    - w_ordinateur
    - w_soleil
    - w_utiliser
templates:
- content_key: practice.zh-fr.fr.a1.unit57.lesson01.choose.001
  lesson_content_key: fr.a1.unit57.lesson01.telephone_ordinateur_et_internet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_utiliser
        - w_ordinateur
        - w_internet
        - w_appli
        - w_message
        - w_envoies
        - w_envoie
        - w_lit
        - w_cherches
        - w_soleil
        - w_nommer
        - w_appelle
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于手机、电脑和互联网的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson02.listen.001
  lesson_content_key: fr.a1.unit57.lesson02.l_appli_et_envoyer
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于应用程序和发送消息的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson03.translate.001
  lesson_content_key: fr.a1.unit57.lesson03.chercher_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于查找信息的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson04.match.001
  lesson_content_key: fr.a1.unit57.lesson04.camille_envoie_un_message
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson05.choose.001
  lesson_content_key: fr.a1.unit57.lesson05.qui_utilise_quoi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“谁使用什么”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson01.translate.002
  lesson_content_key: fr.a1.unit57.lesson01.telephone_ordinateur_et_internet
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于手机、电脑和互联网的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson01.order.003
  lesson_content_key: fr.a1.unit57.lesson01.telephone_ordinateur_et_internet
  type: word_order
  frame:
    text: Camille utilise un {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_ordinateur
  answer_derivation:
    kind: render_frame
    frame:
      text: Camille utilise un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Camille 使用电脑。ordinateur 的意思是“电脑”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson01.fill.004
  lesson_content_key: fr.a1.unit57.lesson01.telephone_ordinateur_et_internet
  type: fill_in_blank
  frame:
    text: Tu as {item} à la maison ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_internet
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_internet
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你家里有网络吗？internet 的意思是“互联网”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson02.order.002
  lesson_content_key: fr.a1.unit57.lesson02.l_appli_et_envoyer
  type: word_order
  frame:
    text: J'ai une {item} pour la météo.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_appli
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai une {item} pour la météo.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我有一个看天气预报的应用。appli 的意思是“应用”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson02.fill.003
  lesson_content_key: fr.a1.unit57.lesson02.l_appli_et_envoyer
  type: fill_in_blank
  frame:
    text: J'envoie un {item} par l'appli. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_message
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_message
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我会通过应用发送一条消息。message 的意思是“消息”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson02.translate.004
  lesson_content_key: fr.a1.unit57.lesson02.l_appli_et_envoyer
  type: translation
  frame:
    text: Camille通过应用程序发一条消息。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_envoie
  answer_derivation:
    kind: render_frame
    frame:
      text: Camille {item} un message par l'appli.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Camille 通过应用发送一条消息。这里再次用到 envoyer（发送），该词已在交流单元中学过。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit57.lesson04.order.002
  lesson_content_key: fr.a1.unit57.lesson04.camille_envoie_un_message
  type: word_order
  frame:
    text: Samedi, il y a du {item} !
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_soleil
  answer_derivation:
    kind: render_frame
    frame:
      text: Samedi, il y a du {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 周六是晴天！Il y a du soleil 用来描述晴天，天气单元中已学过。
    language_code: zh
    direction: ltr
