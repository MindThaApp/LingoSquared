schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit43
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit43.voyage
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_allez
    - w_arrive
    - w_attention
    - w_billet
    - w_doit
    - w_déjà
    - w_départ
    - w_encore
    - w_guichet
    - w_général
    - w_monte
    - w_panneau
    - w_part
    - w_pile
    - w_problème
    - w_quai
    - w_quarante
    - w_salle
    - w_simple
    - w_sortie
    - w_train
    - w_utilise
    - w_vouvoiement
templates:
- content_key: practice.zh-fr.fr.a1.unit43.lesson01.choose.001
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_billet
        - w_simple
        - w_guichet
        - w_utilise
        - w_général
        - w_vouvoiement
        - w_quai
        - w_part
        - w_train
        - w_arrive
        - w_attention
        - w_sortie
        - w_salle
        - w_départ
        - w_quarante
        - w_doit
        - w_panneau
        - w_problème
        - w_encore
        - w_déjà
        - w_pile
        - w_allez
        - w_monte
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自买票那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson02.listen.001
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“火车几点出发？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson03.translate.001
  lesson_content_key: fr.a1.unit43.lesson03.le_retard
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“延误”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson04.match.001
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson05.choose.001
  lesson_content_key: fr.a1.unit43.lesson05.lire_un_billet_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“看火车票”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson06.translate.001
  lesson_content_key: fr.a1.unit43.lesson06.camille_et_mathieu_en
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，来自“Camille 和 Mathieu 旅行”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson01.order.002
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: word_order
  frame:
    text: Je voudrais un {item} pour Lyon.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_billet
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item} pour Lyon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 我想要一张去里昂的票。billet 的意思是车票。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson01.fill.003
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: fill_in_blank
  frame:
    text: Voulez-vous un aller {item} ou un aller-retour ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 您要单程票还是往返票？Voulez-vous 是 vouloir 的正式 vous 形式，这里用于不熟悉的车站工作人员。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson02.order.002
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: word_order
  frame:
    text: De quel {item} part le train pour Lyon ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_quai
  answer_derivation:
    kind: render_frame
    frame:
      text: De quel {item} part le train pour Lyon ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 去里昂的火车从哪个站台发车？quai 的意思是站台。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson02.fill.003
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: fill_in_blank
  frame:
    text: Le train ne {item} pas à l'heure. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_part
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_part
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 火车没有准点出发。part 的意思是一边；一份（如“在你这一边”）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson02.translate.004
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: translation
  frame:
    text: 火车几点到达？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_train
  answer_derivation:
    kind: render_frame
    frame:
      text: À quelle heure arrive le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 火车几点到达？À quelle heure arrive ... ? 用来询问时间；arriver 是规则的 -er 动词：le train arrive。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson04.order.002
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: word_order
  frame:
    text: Où est la {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_sortie
  answer_derivation:
    kind: render_frame
    frame:
      text: Où est la {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 出口在哪里？sortie 的意思是出口。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit43.lesson04.fill.003
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: fill_in_blank
  frame:
    text: Où est la {item} d'attente ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_salle
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_salle
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 候车室在哪里？salle 的意思是房间、厅。
    language_code: zh
    direction: ltr
