  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_chaude
    - w_dunes
    - w_mer
    - w_parasol
    - w_parasols
    - w_sable
    - w_vague
    - w_zoo
templates:
- content_key: practice.zh-fr.fr.a1.unit81.lesson01.choose.001
  lesson_content_key: fr.a1.unit81.lesson01.on_va_a_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_mer
        - w_sable
        - w_vague
        - w_parasol
        - w_dunes
        - w_parasols
        - w_chaude
        - w_zoo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“我们去海滩好吗？”这一课。'
    language_code: zh
    direction: ltr
