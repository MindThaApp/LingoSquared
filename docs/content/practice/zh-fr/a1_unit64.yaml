schema_version: '1.0'
pack_key: practice.zh-fr.a1.unit64
source_language: zh
target_language: fr
unit_content_key: fr.a1.unit64.personnalite
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_calme
    - w_connaissez
    - w_curieux
    - w_différent
    - w_drôle
    - w_gentille
    - w_notre
    - w_parler
    - w_patient
    - w_raconte
    - w_timide
templates:
- content_key: practice.zh-fr.fr.a1.unit64.lesson01.choose.001
  lesson_content_key: fr.a1.unit64.lesson01.gentil_et_drole
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_gentille
        - w_drôle
        - w_calme
        - w_patient
        - w_curieux
        - w_parler
        - w_timide
        - w_connaissez
        - w_raconte
        - w_différent
        - w_notre
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“亲切与风趣”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson02.listen.001
  lesson_content_key: fr.a1.unit64.lesson02.calme_et_patient
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“平和与耐心”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson03.translate.001
  lesson_content_key: fr.a1.unit64.lesson03.curieux_et_timide
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“好奇与害羞”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson04.match.001
  lesson_content_key: fr.a1.unit64.lesson04.nina_pose_des_questions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个法语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson05.choose.001
  lesson_content_key: fr.a1.unit64.lesson05.nina_entend_parler_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Nina 听大家的介绍”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson06.translate.001
  lesson_content_key: fr.a1.unit64.lesson06.nina_se_decrit
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Nina 介绍自己”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson01.order.002
  lesson_content_key: fr.a1.unit64.lesson01.gentil_et_drole
  type: word_order
  frame:
    text: Camille est {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_gentille
  answer_derivation:
    kind: render_frame
    frame:
      text: Camille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 卡米尔很善良。gentille 的意思是“善良的”（阴性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson01.fill.003
  lesson_content_key: fr.a1.unit64.lesson01.gentil_et_drole
  type: fill_in_blank
  frame:
    text: Thomas est {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_drôle
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_drôle
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 托马很有趣。drôle 的意思是“有趣的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit64.lesson02.order.002
