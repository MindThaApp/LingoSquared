templates:
- content_key: practice.zh-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 零到十六是单个的单词；十七到十九由几部分构成，比如 dix-sept，即十加七。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 注意拼写：zéro 带重音符号，像 trente-quatre 这样的合成数字要用连字符连接。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 从七十起，数数的方式改变了：soixante-dix 是六十加十，quatre-vingts 是四个二十。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 零到十六是各自独立的单词，然后 vingt、trente 和 soixante 表示整十数；其余的数由它们组合而成。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson02.match.003
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Quatre-vingts 末尾带 s，但后面接其他数字时 s 会去掉：quatre-vingt-dix。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quel âge as-tu? 用来问别人的年龄：法语说“你有几年”，而不是“你是几岁”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson03.order.002
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: J'ai {n} ans.
    language_code: fr
    direction: ltr
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 法语说“我有几年”（j'ai ... ans），而不是“我是几岁”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson03.fill.003
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: Quel âge {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quel âge as-tu? 是非正式的问法；对陌生人要问 quel âge avez-vous ?
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 我{n}岁。
    language_code: zh
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 法语用 avoir（有）表示年龄：j'ai vingt-huit ans，字面意思是“我有二十八年”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 你多大了？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quel âge as-tu? 用 tu：只用于朋友、家人和同辈。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 您多大年纪？
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quel âge avez-vous? 用 vous：用于陌生人和礼貌的场合。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît 是非正式的“请”，s'il vous plaît 是正式的“请”；这一规律与 tu 和 vous 相对应。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson04.fill.002
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: fill_in_blank
  frame:
    text: Quel est ton {item} de téléphone ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ton 是非正式的“你的”；对陌生人要问 quel est votre numéro de téléphone ?
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson05.listen.001
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Œufs 是复数：复数中 œuf 的 f 不发音，所以 œufs 的读音与单数不同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson05.match.002
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 法语表示数量要用 de：deux tasses de farine，une demi-tasse de sucre。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: word_order
  frame:
    text: J'ai besoin de {n} œufs.
    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + 名词表示“需要”；数字位于 de 和名词之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson05.translate.004
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些词中有许多在表示数量时与 de 连用，比如 tasses de farine。
    language_code: zh
    direction: ltr
- content_key: practice.zh-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
  type: fill_in_blank
  frame:
    text: Tu {item} aussi besoin de sucre ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tu as 是非正式的“你有”；正式的说法是 vous avez。
    language_code: zh
    direction: ltr
