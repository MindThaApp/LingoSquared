  lesson_content_key: hi.a1.unit64.lesson01.chalo_bazar_chalen
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: &id001
      language_code: hi
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_भीड़, w_स्टॉल, w_दिखता, w_ताज़ी, w_सेब, w_किलो, w_टमाटर, w_थैला, w_फलों, w_भरा]
