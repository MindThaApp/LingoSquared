schema_version: "1.0"
pack_key: practice.en-hi.a2.unit20
source_language: en
target_language: hi
unit_content_key: hi.a2.unit20.panjikaran
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-hi A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (course en-hi-a2; tags hi_a2_u20*, single-member w_<token> anchors).
    Every slot draws only on words this unit introduces; earlier words appear only as literal frame text.
    Translation prompts that need a gendered or honorific form say so in brackets. Grammar in play:
    अपना/अपनी/अपने (one's own) and the ergative ने with भरा/बदला; लाना takes no ने, so the bring-frame is क्या
    आप ... लाए. Reviewer: confirm the spelling लाए (not लाये) and that 'मैंने फ़ॉर्म भरा' needs no extra word.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_पता, w_नया, w_नई, w_अपना, w_अपनी, w_बदलना, w_आधार, w_कार्ड, w_केंद्र, w_जाना, w_दस्तावेज़, w_फ़ॉर्म, w_भरना, w_लाना, w_भरा, w_लाया, w_बदला, w_लाए, w_क्लर्क, w_रोड, w_आपको, w_आपका]
slot_presets:
