  l1b: &l1b {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_पता, w_नया, w_नई, w_बदलना, w_आधार, w_कार्ड, w_केंद्र]}}
  badal: &badal {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_बदलना}}
  naya: &naya {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_नया}}
  apna: &apna {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_अपना}}
  nai: &nai {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_नई}}
  kendra: &kendra {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_केंद्र}}
  l2a: &l2a {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_दस्तावेज़, w_फ़ॉर्म, w_भरना, w_लाना, w_भरा, w_लाया, w_बदला]}}
  l2b: &l2b {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_दस्तावेज़, w_फ़ॉर्म, w_भरना, w_लाना, w_लाया]}}
  bhara: &bhara {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_भरा}}
  laae: &laae {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_लाए}}
  badla: &badla {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_बदला}}
  dast: &dast {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_दस्तावेज़}}
  l3a: &l3a {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_क्लर्क, w_रोड, w_आपको, w_आपका]}}
  aapka: &aapka {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_आपका}}
  aapko: &aapko {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_आपको}}
templates:
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.choose.001
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "पता is address; नया and नई are new for a masculine and a feminine noun, and अपना/अपनी is one's own.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.listen.002
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "आधार कार्ड is the Aadhaar card and केंद्र is a centre; आधार केंद्र is where the card is handled.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.match.003
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *l1a, second: *l1a, third: *l1a, fourth: *l1a, fifth: *l1a, sixth: *l1a}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Adjectives like नया change with the noun: नया for masculine, नई for feminine; अपना follows the same pattern.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.order.004
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: word_order
    frame: {text: "मुझे अपना पता {item} है।", language_code: hi, direction: ltr}
    slots: {item: *badal}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे अपना पता {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "बदलना is the verb to change; मुझे ... है with an infinitive says what you need to do.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.order.005
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: word_order
    frame: {text: "यह मेरा {item} पता है।", language_code: hi, direction: ltr}
    slots: {item: *naya}
    answer_derivation: {kind: render_frame, frame: {text: "यह मेरा {item} पता है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "पता is masculine, so the adjective is नया, matching मेरा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.order.006
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: word_order
    frame: {text: "मुझे आधार {item} जाना है।", language_code: hi, direction: ltr}
    slots: {item: *kendra}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे आधार {item} जाना है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आधार केंद्र is the Aadhaar centre; मुझे ... जाना है says where you need to go.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.fill.007
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: fill_in_blank
    frame: {text: "मुझे {item} पता बदलना है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *apna, hint: *apna}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "अपना means one's own and agrees with the masculine पता.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.fill.008
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: fill_in_blank
    frame: {text: "टोपी {item} है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *nai, hint: *nai}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "टोपी is feminine, so the adjective takes the -ई ending.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.translate.009
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "कार्ड is an English loanword; पता and केंद्र are everyday Hindi words.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.translate.010
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: translation
    frame: {text: "I need to change my address.", language_code: en, direction: ltr}
    slots: {item: *badal}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे अपना पता {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The need is expressed with मुझे and an infinitive, not with a verb meaning want.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson01.translate.011
    lesson_content_key: hi.a2.unit20.lesson01.naya_pata
    type: translation
    frame: {text: "This is my new address.", language_code: en, direction: ltr}
    slots: {item: *naya}
    answer_derivation: {kind: render_frame, frame: {text: "यह मेरा {item} पता है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The adjective comes before the noun and agrees with it.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.choose.001
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "भरा and बदला are past forms that agree with a masculine singular object; भरना and लाना are the infinitives.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.listen.002
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "दस्तावेज़ means document and फ़ॉर्म means form; both are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.match.003
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *l2a, second: *l2a, third: *l2a, fourth: *l2a, fifth: *l2a, sixth: *l2a}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The infinitive ends in -ना; the past form with a masculine object ends in -आ.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.order.004
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: word_order
    frame: {text: "मैंने फ़ॉर्म {item}।", language_code: hi, direction: ltr}
    slots: {item: *bhara}
    answer_derivation: {kind: render_frame, frame: {text: "मैंने फ़ॉर्म {item}।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "After ने the verb agrees with the object, फ़ॉर्म, not with the speaker.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.order.005
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: word_order
    frame: {text: "क्या आप आधार कार्ड {item}?", language_code: hi, direction: ltr}
    slots: {item: *laae}
    answer_derivation: {kind: render_frame, frame: {text: "क्या आप आधार कार्ड {item}?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "लाना never takes ने, so the verb agrees with आप here.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.fill.006
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: fill_in_blank
    frame: {text: "मैंने अपना पता {item}। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *badla, hint: *badla}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The object पता is masculine singular, so the past form ends in -आ.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.fill.007
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: fill_in_blank
    frame: {text: "मुझे {item} चाहिए। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *dast, hint: *dast}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "चाहिए follows the thing needed, which stays in its plain form.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.translate.008
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Past forms in -आ go with a masculine singular object; the infinitive ends in -ना.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.translate.009
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: translation
    frame: {text: "I filled in the form.", language_code: en, direction: ltr}
    slots: {item: *bhara}
    answer_derivation: {kind: render_frame, frame: {text: "मैंने फ़ॉर्म {item}।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "ने marks the doer of a completed action with a transitive verb.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson02.translate.010
    lesson_content_key: hi.a2.unit20.lesson02.dastavez_aur_form
    type: translation
    frame: {text: "Did you bring the Aadhaar card? (formal)", language_code: en, direction: ltr}
    slots: {item: *laae}
    answer_derivation: {kind: render_frame, frame: {text: "क्या आप आधार कार्ड {item}?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आप takes the plural-style form लाए even for one person.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson03.choose.001
    lesson_content_key: hi.a2.unit20.lesson03.arjun_aadhaar_kendra_mein
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "आपको and आपका are the formal to-you and your forms; the clerk speaks to Arjun with आप.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson03.listen.002
    lesson_content_key: hi.a2.unit20.lesson03.arjun_aadhaar_kendra_mein
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "क्लर्क is an English loanword for the person behind the counter.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson03.order.003
    lesson_content_key: hi.a2.unit20.lesson03.arjun_aadhaar_kendra_mein
    type: word_order
    frame: {text: "मैंने {item} पता बदला।", language_code: hi, direction: ltr}
    slots: {item: *aapka}
    answer_derivation: {kind: render_frame, frame: {text: "मैंने {item} पता बदला।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आपका is masculine to agree with पता.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson03.fill.004
    lesson_content_key: hi.a2.unit20.lesson03.arjun_aadhaar_kendra_mein
    type: fill_in_blank
    frame: {text: "{item} क्या चाहिए? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *aapko, hint: *aapko}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "आपको is the formal way to say to you in चाहिए sentences.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson03.translate.005
    lesson_content_key: hi.a2.unit20.lesson03.arjun_aadhaar_kendra_mein
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "आपका changes with the noun it describes, while आपको does not.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit20.lesson03.translate.006
    lesson_content_key: hi.a2.unit20.lesson03.arjun_aadhaar_kendra_mein
    type: translation
    frame: {text: "What do you need? (formal)", language_code: en, direction: ltr}
    slots: {item: *aapko}
    answer_derivation: {kind: render_frame, frame: {text: "{item} क्या चाहिए?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The need is expressed with आपको, the formal to-you form.", language_code: en, direction: ltr}
