schema_version: "1.0"
pack_key: practice.en-hi.a2.unit21
source_language: en
target_language: hi
unit_content_key: hi.a2.unit21.raay
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-hi A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (course en-hi-a2; tags hi_a2_u21*, single-member w_<token> anchors).
    Every slot draws only on words this unit introduces; earlier words appear only as literal frame text.
    Translation prompts that need a gendered or honorific form say so in brackets. Opinion verbs: लगना agrees
    with the thing judged (अच्छी लगती, fem. film) while मुझे लगता है कि stays fixed. Reviewer: confirm 'How do
    you like this film? (informal)' for तुम्हें यह फ़िल्म कैसी लगती है।
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_फ़िल्म, w_यह, w_कैसी, w_लगना, w_लगती, w_अच्छी, w_कहानी, w_मज़ेदार, w_पसंद, w_क्योंकि, w_बहुत, w_लगता, w_कि, w_बुरी, w_किताब, w_किताबें, w_नहीं, w_हैं]
