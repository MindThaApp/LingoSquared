    slots: {item: *l3a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "नहीं is the negative and usually comes right before है or हैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.order.003
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: word_order
    frame: {text: "मुझे {item} पसंद हैं।", language_code: hi, direction: ltr}
    slots: {item: *kitaabe}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे {item} पसंद हैं।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The plural किताबें takes हैं, not है.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.order.004
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: word_order
    frame: {text: "मुझे कॉफ़ी पसंद {item} है।", language_code: hi, direction: ltr}
    slots: {item: *nahin}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे कॉफ़ी पसंद {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "नहीं comes before है in a negative sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.fill.005
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: fill_in_blank
    frame: {text: "मुझे {item} पसंद हैं। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *kitaabe, hint: *kitaabe}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The plural of किताब is किताबें.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.fill.006
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: fill_in_blank
    frame: {text: "मुझे किताबें पसंद {item}। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *hain, hint: *hain}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The plural subject किताबें needs हैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.translate.007
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: translation
