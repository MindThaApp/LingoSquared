  m21: &m21 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_फ़िल्म, w_कैसी, w_लगना, w_लगती, w_कहानी, w_मज़ेदार, w_पसंद, w_क्योंकि, w_बहुत, w_बुरी, w_किताब, w_किताबें]}}
