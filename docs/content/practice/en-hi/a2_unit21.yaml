templates:
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.choose.001
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "लगती is the feminine form of seems, matching the feminine फ़िल्म; कैसी is the feminine how.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.listen.002
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "अच्छी and मज़ेदार both describe a film or story; अच्छी ends in -ई because फ़िल्म and कहानी are feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.match.003
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *l1a, second: *l1a, third: *l1a, fourth: *l1a, fifth: *l1a, sixth: *l1a}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "लगना is the infinitive of seems; the form changes with the thing being judged.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.order.004
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: word_order
    frame: {text: "मुझे यह फ़िल्म {item} लगती है।", language_code: hi, direction: ltr}
    slots: {item: *achhi}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे यह फ़िल्म {item} लगती है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The adjective and लगती both agree with the feminine फ़िल्म.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.order.005
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: word_order
    frame: {text: "यह फ़िल्म {item} है।", language_code: hi, direction: ltr}
    slots: {item: *mazedar}
    answer_derivation: {kind: render_frame, frame: {text: "यह फ़िल्म {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "मज़ेदार does not change with gender, so it is the same for फ़िल्म and फ़िल्में.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.order.006
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: word_order
    frame: {text: "तुम्हें यह फ़िल्म {item} लगती है?", language_code: hi, direction: ltr}
    slots: {item: *kaisi}
    answer_derivation: {kind: render_frame, frame: {text: "तुम्हें यह फ़िल्म {item} लगती है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "कैसी asks how something seems and agrees with the feminine फ़िल्म.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.fill.007
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: fill_in_blank
    frame: {text: "मुझे यह फ़िल्म अच्छी {item} है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *lagti, hint: *lagti}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Opinions use मुझे with a verb that agrees with the thing judged.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.fill.008
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: fill_in_blank
    frame: {text: "{item} अच्छी है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *kahani, hint: *kahani}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "कहानी is feminine, which is why the adjective ends in -ई.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.translate.009
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "फ़िल्म and कहानी are both feminine nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.translate.010
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: translation
    frame: {text: "How do you like this film? (informal)", language_code: en, direction: ltr}
    slots: {item: *kaisi}
    answer_derivation: {kind: render_frame, frame: {text: "तुम्हें यह फ़िल्म {item} लगती है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "तुम्हें marks the person whose opinion is asked.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson01.translate.011
    lesson_content_key: hi.a2.unit21.lesson01.mujhe_lagta_hai
    type: translation
    frame: {text: "The story is good.", language_code: en, direction: ltr}
    slots: {item: *kahani}
    answer_derivation: {kind: render_frame, frame: {text: "{item} अच्छी है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The adjective follows the noun and agrees with it.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.choose.001
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "क्योंकि introduces a reason, while कि introduces what you think.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.listen.002
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "बहुत means very and comes before the adjective.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.match.003
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *m21, second: *m21, third: *m21, fourth: *m21, fifth: *m21, sixth: *m21}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words about films and opinions; लगना is the infinitive of seems and लगती is its feminine form.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.order.004
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: word_order
    frame: {text: "मुझे यह फ़िल्म पसंद है {item} कहानी अच्छी है।", language_code: hi, direction: ltr}
    slots: {item: *kyonki}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे यह फ़िल्म पसंद है {item} कहानी अच्छी है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "क्योंकि is placed before the reason.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.order.005
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: word_order
    frame: {text: "कहानी {item} अच्छी है।", language_code: hi, direction: ltr}
    slots: {item: *bahut}
    answer_derivation: {kind: render_frame, frame: {text: "कहानी {item} अच्छी है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "बहुत comes right before the adjective it strengthens.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.order.006
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: word_order
    frame: {text: "यह फ़िल्म {item} है।", language_code: hi, direction: ltr}
    slots: {item: *buri}
    answer_derivation: {kind: render_frame, frame: {text: "यह फ़िल्म {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "बुरी is the feminine form of bad, matching फ़िल्म.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.order.007
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: word_order
    frame: {text: "मुझे लगता है {item} यह फ़िल्म अच्छी है।", language_code: hi, direction: ltr}
    slots: {item: *ki}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे लगता है {item} यह फ़िल्म अच्छी है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "कि joins the opinion to what is thought, like that in English.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.fill.008
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: fill_in_blank
    frame: {text: "मुझे यह फ़िल्म {item} है क्योंकि कहानी अच्छी है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *pasand, hint: *pasand}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "पसंद है is the usual way to say I like it.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.fill.009
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: fill_in_blank
    frame: {text: "मुझे {item} है कि यह फ़िल्म अच्छी है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *lagta, hint: *lagta}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Before कि the verb stays लगता whatever the gender of the film.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.translate.010
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "क्योंकि and कि are different words: because and that.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.translate.011
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: translation
    frame: {text: "I like this film because the story is good.", language_code: en, direction: ltr}
    slots: {item: *kyonki}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे यह फ़िल्म पसंद है {item} कहानी अच्छी है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The reason follows क्योंकि as a full clause.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson02.translate.012
    lesson_content_key: hi.a2.unit21.lesson02.kyonki
    type: translation
    frame: {text: "This film is bad.", language_code: en, direction: ltr}
    slots: {item: *buri}
    answer_derivation: {kind: render_frame, frame: {text: "यह फ़िल्म {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Feminine nouns take adjectives ending in -ई.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.choose.001
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "किताब is a book and किताबें is books; हैं goes with a plural subject.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit21.lesson03.listen.002
    lesson_content_key: hi.a2.unit21.lesson03.priya_arjun_film_par_raay
    type: listen_select
