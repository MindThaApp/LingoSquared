schema_version: '1.0'
pack_key: practice.en-hi.a1.unit45
source_language: en
target_language: hi
unit_content_key: hi.a1.unit45.emergencies
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-hi backfill lexemes (tags hi_a1_u45 / w_<token>). 15 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_इमरजेंसी, w_एग्ज़िट, w_एम्बुलेंस, w_घबराओ, w_जाइए, w_तरफ़, w_दीजिए, w_ध्यान, w_पता, w_पुलिस, w_फ़ायर, w_ब्रिगेड, w_लगी, w_लाइब्रेरी, w_हुआ]
templates:
- content_key: practice.en-hi.hi.a1.unit45.lesson01.choose.001
  lesson_content_key: hi.a1.unit45.lesson01.madad_aur_ag
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: &id001
      language_code: hi
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_लगी, w_इमरजेंसी, w_एग्ज़िट, w_पुलिस, w_एम्बुलेंस, w_फ़ायर, w_ब्रिगेड, w_ध्यान, w_दीजिए, w_तरफ़, w_जाइए, w_घबराओ, w_लाइब्रेरी, w_हुआ, w_पता]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on help and fire.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson02.listen.001
  lesson_content_key: hi.a1.unit45.lesson02.imarjensee_nanbar_aur_imarjensee
  type: listen_select
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the emergency number and the emergency exit.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson03.translate.001
  lesson_content_key: hi.a1.unit45.lesson03.pulis_embulens_ya_fayar
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on police, ambulance, or fire brigade.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson04.match.001
  lesson_content_key: hi.a1.unit45.lesson04.laingvej_kaife_men_ag
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: hi, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Hindi word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson05.choose.001
  lesson_content_key: hi.a1.unit45.lesson05.ag_ke_bare_men
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a text about the fire.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson06.translate.001
  lesson_content_key: hi.a1.unit45.lesson06.vikram_ata_hai
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on vikram arrives.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson01.order.002
  lesson_content_key: hi.a1.unit45.lesson01.madad_aur_ag
  type: word_order
  frame: {text: 'आग {item} है!', language_code: hi, direction: ltr}
  slots:
    item:
      language_code: hi
      part_of_speech: verb
      agreement_tags: {semantic: w_लगी}
  answer_derivation:
    kind: render_frame
    frame: {text: 'आग {item} है!', language_code: hi, direction: ltr}
  feedback_frame: {text: 'There''s a fire! लगी means has broken out; has started (fem. subject, as with a fire).', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson02.order.002
  lesson_content_key: hi.a1.unit45.lesson02.imarjensee_nanbar_aur_imarjensee
  type: word_order
  frame: {text: 'इमरजेंसी {item} कहाँ है?', language_code: hi, direction: ltr}
  slots:
    item:
      language_code: hi
      part_of_speech: noun
      agreement_tags: {semantic: w_एग्ज़िट}
  answer_derivation:
    kind: render_frame
    frame: {text: 'इमरजेंसी {item} कहाँ है?', language_code: hi, direction: ltr}
  feedback_frame: {text: 'Where is the emergency exit? एग्ज़िट means exit.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit45.lesson03.order.002
  lesson_content_key: hi.a1.unit45.lesson03.pulis_embulens_ya_fayar
  type: word_order
  frame: {text: 'पुलिस, {item} या फ़ायर ब्रिगेड?', language_code: hi, direction: ltr}
  slots:
    item:
      language_code: hi
      part_of_speech: noun
      agreement_tags: {semantic: w_एम्बुलेंस}
  answer_derivation:
    kind: render_frame
    frame: {text: 'पुलिस, {item} या फ़ायर ब्रिगेड?', language_code: hi, direction: ltr}
  feedback_frame: {text: 'Police, ambulance, or fire brigade? In India, dial 112 for any emergency; the operator then connects you to the police, an ambulance or the fire brigade.', language_code: en, direction: ltr}
