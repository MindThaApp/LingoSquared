schema_version: "1.0"
pack_key: practice.en-hi.a1.unit06
source_language: en
target_language: hi
unit_content_key: hi.a1.unit06.food
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-hi, job B) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (tags hi_a1_u06*, w_<token> anchors). Frames use one curated w_ list only where every member is natural; chahiye frames never take a gendered verb. Feedback lines carry a usage or grammar point, never the task or the answer. Reviewer: check gender/honorific agreement in every frame and that the Devanagari spellings match the realization.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_खाना, w_चाय, w_कॉफ़ी, w_पानी, w_जूस, w_रोटी, w_चावल, w_सब्ज़ी, w_दाल, w_कप, w_गिलास, w_प्लेट, w_खाते, w_या, w_कृपया, w_कुछ, w_बस, w_चाहिए]
slot_presets:
  food1: &food1 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_खाना, w_चाय, w_कॉफ़ी, w_पानी, w_जूस]}}
  food2: &food2 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_रोटी, w_चावल, w_सब्ज़ी, w_दाल, w_कप, w_गिलास, w_प्लेट]}}
  l3: &l3 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_खाते, w_या, w_कृपया, w_कुछ, w_बस]}}
  mix: &mix {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_रोटी, w_चावल, w_सब्ज़ी, w_दाल, w_कप, w_गिलास, w_चाय, w_पानी, w_जूस]}}
  words: &words {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_खाना, w_चाय, w_कॉफ़ी, w_पानी, w_जूस, w_रोटी, w_चावल, w_दाल, w_गिलास, w_प्लेट]}}
  plate: &plate {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_रोटी, w_चावल, w_सब्ज़ी, w_दाल]}}
  tasty: &tasty {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_सब्ज़ी, w_दाल, w_रोटी, w_चावल]}}
  chahiye: &chahiye {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_चाहिए}}
  bas: &bas {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_बस}}
  kripya: &kripya {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_कृपया}}
  ya: &ya {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_या}}
  khate: &khate {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_खाते}}
  glass: &glass {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_गिलास}}
  chai: &chai {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_चाय}}
  daal: &daal {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_दाल}}
templates:
  - content_key: practice.en-hi.hi.a1.unit06.lesson01.choose.001
    lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *food1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "खाना is a masculine noun meaning food or a meal; चाय and कॉफ़ी are feminine, while पानी and जूस are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson01.listen.002
    lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *food1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hindi nouns carry gender even for drinks: पानी and जूस are masculine, चाय and कॉफ़ी feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson01.fill.003
    lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
    type: fill_in_blank
    frame: {text: "आपको क्या {item}? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *chahiye, hint: *chahiye}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "चाहिए does not change with the speaker's gender (unlike चाहता and चाहती), and it is not followed by है.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson01.translate.004
    lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
    type: translation
    frame: {text: "What would you like? (informal)", language_code: en, direction: ltr}
    slots: {item: *chahiye}
    answer_derivation: {kind: render_frame, frame: {text: "तुम्हें क्या {item}?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "With आप the same question is आपको क्या चाहिए?; only the word for you changes.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson01.translate.005
    lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
    type: translation
    frame: {text: "I would like tea, thank you.", language_code: en, direction: ltr}
    slots: {item: *chai}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे {item} चाहिए, शुक्रिया।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "मुझे ... चाहिए literally means to me ... is needed, so the thing wanted comes between the two words.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson01.translate.006
    lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hindi has no words for a or the, so खाना can mean food, a meal or the meal depending on the situation.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.choose.001
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *food2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "रोटी, दाल and सब्ज़ी are feminine nouns, while चावल (rice) is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.match.002
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Hindi puts the container first and drops the word of: एक गिलास पानी is literally one glass water.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.order.003
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: word_order
    frame: {text: "मुझे एक प्लेट {item} चाहिए।", language_code: hi, direction: ltr}
    slots: {item: *plate}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे एक प्लेट {item} चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Hindi has no word for of in a plate of rice: the container comes before the food.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.order.004
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: word_order
    frame: {text: "यह {item} बहुत स्वादिष्ट है।", language_code: hi, direction: ltr}
    slots: {item: *tasty}
    answer_derivation: {kind: render_frame, frame: {text: "यह {item} बहुत स्वादिष्ट है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "स्वादिष्ट does not change for masculine or feminine nouns, unlike अच्छा and अच्छी.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.fill.005
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: fill_in_blank
    frame: {text: "नहीं, {item}, शुक्रिया। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *bas, hint: *bas}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "बस at the end of an offer politely says that is enough.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.fill.006
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: fill_in_blank
    frame: {text: "मुझे कॉफ़ी चाहिए, {item}। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *kripya, hint: *kripya}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "कृपया is the polite word please and can sit at the end of the request.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.translate.007
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: translation
    frame: {text: "I would like a glass of water.", language_code: en, direction: ltr}
    slots: {item: *glass}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे एक {item} पानी चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "A measure word such as गिलास comes directly before the thing measured, with no word for of.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson02.translate.008
    lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
    type: translation
    frame: {text: "This dal is very tasty.", language_code: en, direction: ltr}
    slots: {item: *daal}
    answer_derivation: {kind: render_frame, frame: {text: "यह {item} बहुत स्वादिष्ट है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "दाल is feminine, but स्वादिष्ट stays the same for feminine and masculine nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson03.choose.001
    lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "या joins two choices, as in तुम्हें चाय चाहिए या कॉफ़ी?, and खाते हैं after चलो makes a suggestion.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson03.fill.002
    lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
    type: fill_in_blank
    frame: {text: "तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *ya, hint: *ya}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "In a question या offers a choice between two things, much like or in English.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit06.lesson03.translate.003
    lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
    type: translation
    frame: {text: "Let's eat something!", language_code: en, direction: ltr}
    slots: {item: *khate}
    answer_derivation: {kind: render_frame, frame: {text: "चलो, कुछ {item} हैं!", language_code: hi, direction: ltr}}
    feedback_frame: {text: "चलो plus a plural -ते verb with हैं is the usual way to make a suggestion.", language_code: en, direction: ltr}
