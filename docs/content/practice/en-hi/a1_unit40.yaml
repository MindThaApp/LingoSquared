schema_version: '1.0'
pack_key: practice.en-hi.a1.unit40
source_language: en
target_language: hi
unit_content_key: hi.a1.unit40.post
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-hi backfill lexemes (tags hi_a1_u40 / w_<token>). 10 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_क्लर्क, w_खरीदती, w_चिट्ठी, w_डाक, w_पहुँचना, w_पहुँचने, w_पहुँचेगा, w_पार्सल, w_लिखता, w_लिखना]
templates:
- content_key: practice.en-hi.hi.a1.unit40.lesson01.choose.001
  lesson_content_key: hi.a1.unit40.lesson01.chitthee_aur_parsal
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: &id001
      language_code: hi
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_चिट्ठी, w_पार्सल, w_डाक, w_लिखना, w_लिखता, w_पहुँचना, w_पहुँचेगा, w_पहुँचने, w_क्लर्क, w_खरीदती]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the letter and the package.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit40.lesson02.listen.001
  lesson_content_key: hi.a1.unit40.lesson02.dak_tikat_pata_aur
  type: listen_select
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the stamp, the address, and writing.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit40.lesson03.translate.001
  lesson_content_key: hi.a1.unit40.lesson03.pahunchna_aur_lagna
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on arriving and taking time.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit40.lesson04.match.001
  lesson_content_key: hi.a1.unit40.lesson04.dakghar_men
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: hi, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Hindi word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
