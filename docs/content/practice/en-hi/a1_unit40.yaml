  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on priya sends a package.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit40.lesson01.translate.002
  lesson_content_key: hi.a1.unit40.lesson01.chitthee_aur_parsal
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the letter and the package.', language_code: en, direction: ltr}
