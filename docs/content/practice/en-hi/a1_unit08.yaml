schema_version: "1.0"
pack_key: practice.en-hi.a1.unit08
source_language: en
target_language: hi
unit_content_key: hi.a1.unit08.places
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-hi, job B) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (tags hi_a1_u08*, w_<token> anchors). Location frames are 'X Y ke paas/saamne/peeche hai' with fixed nouns; all place nouns here are masculine. Feedback lines carry a usage or grammar point, never the task or the answer. Reviewer: check gender/honorific agreement in every frame and that the Devanagari spellings match the realization.
    Opus pass 2026-10-24: three feedback lines corrected (के position with पास/सामने/पीछे, दूर takes से, verb-last overclaim).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_घर, w_स्कूल, w_अस्पताल, w_बैंक, w_पार्क, w_स्टेशन, w_यहाँ, w_वहाँ, w_पास, w_दूर, w_सामने, w_पीछे, w_डाकघर, w_थोड़ा, w_तो, w_सही]
slot_presets:
  places: &places {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_घर, w_स्कूल, w_अस्पताल, w_बैंक, w_पार्क, w_स्टेशन]}}
  placesyv: &placesyv {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_घर, w_स्कूल, w_अस्पताल, w_बैंक, w_पार्क, w_स्टेशन, w_यहाँ, w_वहाँ]}}
  inpl: &inpl {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_घर, w_स्कूल, w_अस्पताल, w_बैंक, w_पार्क]}}
  yv: &yv {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_यहाँ, w_वहाँ]}}
  yahan: &yahan {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_यहाँ}}
  wahan: &wahan {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_वहाँ}}
  rel: &rel {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_पास, w_दूर, w_सामने, w_पीछे]}}
  relmix: &relmix {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_पास, w_दूर, w_सामने, w_पीछे, w_यहाँ, w_वहाँ]}}
  rel3: &rel3 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_पास, w_सामने, w_पीछे]}}
  door: &door {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_दूर}}
  peeche: &peeche {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_पीछे}}
  saamne: &saamne {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_सामने}}
  paas: &paas {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_पास}}
  l3: &l3 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_डाकघर, w_थोड़ा, w_तो, w_सही]}}
  dak: &dak {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_डाकघर}}
  thoda: &thoda {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_थोड़ा}}
  sahi: &sahi {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_सही}}
  l1words: &l1words {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_घर, w_स्कूल, w_अस्पताल, w_बैंक, w_पार्क, w_स्टेशन]}}
templates:
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.choose.001
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *places}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "All of these place words are masculine, so any verb or adjective agreeing with them takes the -ा form.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.listen.002
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *placesyv}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "यहाँ and वहाँ are adverbs, so they never change for gender or number.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.order.003
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: word_order
    frame: {text: "मैं {item} में हूँ।", language_code: hi, direction: ltr}
    slots: {item: *inpl}
    answer_derivation: {kind: render_frame, frame: {text: "मैं {item} में हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "में after a place means in, and हूँ goes with मैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.order.004
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: word_order
    frame: {text: "बैंक {item} है।", language_code: hi, direction: ltr}
    slots: {item: *yv}
    answer_derivation: {kind: render_frame, frame: {text: "बैंक {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The verb है normally comes last, after the place word: बैंक वहाँ है is literally bank there is.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.fill.005
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: fill_in_blank
    frame: {text: "स्कूल {item} है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *yahan, hint: *yahan}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "यहाँ is here, near the speaker, and वहाँ is there, away from the speaker.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.translate.006
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: translation
    frame: {text: "The bank is there.", language_code: en, direction: ltr}
    slots: {item: *wahan}
    answer_derivation: {kind: render_frame, frame: {text: "बैंक {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Hindi has no article, so बैंक can mean a bank or the bank.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson01.translate.007
    lesson_content_key: hi.a1.unit08.lesson01.jagahen
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hindi uses many English loanwords for places, such as स्कूल, बैंक, पार्क and स्टेशन.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.choose.001
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *rel}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "पास, सामने and पीछे take के after the reference place: बैंक के पास, near the bank.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.match.002
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *relmix, second: *relmix, third: *relmix, fourth: *relmix, fifth: *relmix, sixth: *relmix}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Hindi place words come in opposite pairs: यहाँ and वहाँ, पास and दूर, सामने and पीछे.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.order.003
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: word_order
    frame: {text: "स्कूल बैंक के {item} है।", language_code: hi, direction: ltr}
    slots: {item: *rel3}
    answer_derivation: {kind: render_frame, frame: {text: "स्कूल बैंक के {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "के links the reference place to पास, सामने or पीछे, much like of in in front of.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.fill.004
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: fill_in_blank
    frame: {text: "पार्क स्कूल के {item} है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *peeche, hint: *peeche}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "पीछे and सामने are opposites, so the same two places can be described from either side.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.fill.005
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: fill_in_blank
    frame: {text: "स्टेशन {item} है? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *door, hint: *door}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "दूर can stand alone (स्टेशन दूर है), and with a reference place it takes से, not के: बैंक से दूर.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.translate.006
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: translation
    frame: {text: "The school is in front of the park.", language_code: en, direction: ltr}
    slots: {item: *saamne}
    answer_derivation: {kind: render_frame, frame: {text: "स्कूल पार्क के {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "के after the reference place links it to सामने, in front of.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson02.translate.007
    lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
    type: translation
    frame: {text: "The bank is near the school.", language_code: en, direction: ltr}
    slots: {item: *paas}
    answer_derivation: {kind: render_frame, frame: {text: "बैंक स्कूल के {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "This पास means near; in मेरे पास it means I have, one word with two uses.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson03.listen.001
    lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "तो in हाँ, तो ... shows a conclusion, and थोड़ा means a little.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson03.order.002
    lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
    type: word_order
    frame: {text: "यह {item} बैंक के पास है।", language_code: hi, direction: ltr}
    slots: {item: *dak}
    answer_derivation: {kind: render_frame, frame: {text: "यह {item} बैंक के पास है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "डाकघर is a compound of डाक (mail) and घर (house), literally the mail house.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson03.fill.003
    lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
    type: fill_in_blank
    frame: {text: "हाँ, {item} दूर है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *thoda, hint: *thoda}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "थोड़ा before an adjective or adverb softens it, like a little in English.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit08.lesson03.translate.004
    lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
    type: translation
    frame: {text: "Yes, the post office is near the bank.", language_code: en, direction: ltr}
    slots: {item: *dak}
    answer_derivation: {kind: render_frame, frame: {text: "हाँ, {item} बैंक के पास है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The reference place बैंक comes first, then के पास, then है.", language_code: en, direction: ltr}
