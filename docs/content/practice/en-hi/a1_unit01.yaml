schema_version: "1.0"
pack_key: practice.en-hi.a1.unit01
source_language: en
target_language: hi
unit_content_key: hi.a1.unit01.greetings
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-hi) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (per-unit tags hi_a1_u01*, single-member w_<token> anchors;
    Devanagari tags). Recognition, matching and bare-word pools are curated w_ lists of this
    unit's own tokens with no near-synonym glosses. Gendered kaisa/kaisi frames name the gender
    of the person asked; formal aap and informal tum are always named in English prompts. Feedback lines carry a usage or grammar point, never the task or the answer. Reviewer: check gender/honorific agreement in every frame and that the Devanagari spellings match the realization.
    Opus pass 2026-10-24: no template changes; listen_select kept although the realization notes say audio-less, because hi TTS is Google-configured (re-check if TTS is ever disabled for hi).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_आप, w_तुम, w_मैं, w_ठीक, w_हो, w_हूँ, w_शुक्रिया, w_और, w_अलविदा, w_रात्रि, w_फिर, w_दिन, w_अच्छा, w_आपका, w_मिलेंगे, w_नाम, w_कहाँ, w_भारत, w_योग, w_खुशी, w_हाँ, w_नहीं, w_लेकिन, w_अभी, w_बार, w_कैसे, w_कैसी, w_प्रिया, w_अर्जुन, w_अमेरिका]
slot_presets:
  rec1: &rec1 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_आप, w_तुम, w_मैं, w_ठीक, w_हो, w_हूँ, w_शुक्रिया, w_और]}}
  rec2: &rec2 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_अलविदा, w_रात्रि, w_फिर, w_दिन, w_अच्छा, w_आपका, w_मिलेंगे]}}
  rec3: &rec3 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_नाम, w_कहाँ, w_भारत, w_योग, w_खुशी, w_हाँ, w_नहीं, w_लेकिन, w_अभी, w_बार]}}
  mix: &mix {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_आप, w_तुम, w_नाम, w_कहाँ, w_भारत, w_दिन, w_खुशी, w_योग, w_रात्रि, w_ठीक]}}
  words: &words {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_आप, w_तुम, w_नाम, w_कहाँ, w_दिन, w_रात्रि, w_खुशी, w_योग, w_शुक्रिया, w_हाँ, w_नहीं]}}
  kaisa: &kaisa {language_code: hi, part_of_speech: [adjective], agreement_tags: {semantic: [w_कैसे, w_कैसी]}}
  kaise: &kaise {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: w_कैसे}}
  kaisi: &kaisi {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: w_कैसी}}
  theek: &theek {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: w_ठीक}}
  din: &din {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_दिन}}
  khushi: &khushi {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_खुशी}}
  kahan: &kahan {language_code: hi, part_of_speech: adverb, agreement_tags: {semantic: w_कहाँ}}
  name: &name {language_code: hi, part_of_speech: proper_noun, agreement_tags: {semantic: [w_प्रिया, w_अर्जुन]}}
  place: &place {language_code: hi, part_of_speech: proper_noun, agreement_tags: {semantic: [w_भारत, w_अमेरिका]}}
  bharat: &bharat {language_code: hi, part_of_speech: proper_noun, agreement_tags: {semantic: w_भारत}}
templates:
  - content_key: practice.en-hi.hi.a1.unit01.lesson01.choose.001
    lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *rec1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hindi has two words for you: आप is formal and respectful, while तुम is informal and used with friends and people your own age or younger.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson01.fill.002
    lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
    type: fill_in_blank
    frame: {text: "मैं {item} हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *theek, hint: *theek}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The verb be changes with the subject: हूँ goes with मैं, हो with तुम and हैं with आप.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson01.order.003
    lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
    type: word_order
    frame: {text: "आप {item} हैं?", language_code: hi, direction: ltr}
    slots: {item: *kaisa}
    answer_derivation: {kind: render_frame, frame: {text: "आप {item} हैं?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The question word agrees with the person asked: कैसे for a man and कैसी for a woman, while आप always takes हैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson01.translate.004
    lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
    type: translation
    frame: {text: "How are you? (informal, asking a man)", language_code: en, direction: ltr}
    slots: {item: *kaise}
    answer_derivation: {kind: render_frame, frame: {text: "तुम {item} हो?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "With तुम the verb is हो; asking a woman changes कैसे to कैसी: तुम कैसी हो?", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson01.translate.005
    lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
    type: translation
    frame: {text: "How are you? (formal, asking a woman)", language_code: en, direction: ltr}
    slots: {item: *kaisi}
    answer_derivation: {kind: render_frame, frame: {text: "आप {item} हैं?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Formal आप takes the plural-looking हैं even for one person, and कैसी is the feminine form of how.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson02.listen.001
    lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *rec2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "अलविदा is a farewell; in everyday speech नमस्ते works both as hello and as goodbye.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson02.order.002
    lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
    type: word_order
    frame: {text: "आपका {item} अच्छा रहे।", language_code: hi, direction: ltr}
    slots: {item: *din}
    answer_derivation: {kind: render_frame, frame: {text: "आपका {item} अच्छा रहे।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "रहे makes this a wish (may it stay good), and आपका shows it is said with formal आप; with तुम it would be तुम्हारा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson02.match.003
    lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Hindi has no word for a or the: नाम can mean name, a name or the name depending on the sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.choose.001
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *rec3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hindi questions keep statement word order: the question word कहाँ takes the place of the answer (आप कहाँ से हैं? and मैं भारत से हूँ).", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.order.002
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: word_order
    frame: {text: "मेरा नाम {name} है।", language_code: hi, direction: ltr}
    slots: {name: *name}
    answer_derivation: {kind: render_frame, frame: {text: "मेरा नाम {name} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Hindi puts the verb last, so मेरा नाम ... है is literally My name ... is.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.order.003
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: word_order
    frame: {text: "मैं {place} से हूँ।", language_code: hi, direction: ltr}
    slots: {place: *place}
    answer_derivation: {kind: render_frame, frame: {text: "मैं {place} से हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "से comes after the place and means from; it is a postposition, not a preposition.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.fill.004
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: fill_in_blank
    frame: {text: "आपसे मिलकर {item} हुई। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *khushi, hint: *khushi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "This is the formal Nice to meet you, literally happiness happened on meeting you; the informal version is तुमसे मिलकर अच्छा लगा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.translate.005
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: translation
    frame: {text: "My name is {name}.", language_code: en, direction: ltr, slot_rendering: {name: english_gloss}}
    slots: {name: *name}
    answer_derivation: {kind: render_frame, frame: {text: "मेरा नाम {name} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "नाम is a masculine noun, so everyone, men and women alike, says मेरा नाम.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.translate.006
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: translation
    frame: {text: "I am from {place}.", language_code: en, direction: ltr, slot_rendering: {place: english_gloss}}
    slots: {place: *place}
    answer_derivation: {kind: render_frame, frame: {text: "मैं {place} से हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "A woman says मैं भारत से हूँ too: the verb हूँ does not change for the speaker's gender.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.translate.007
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: translation
    frame: {text: "Where are you from? (informal)", language_code: en, direction: ltr}
    slots: {item: *kahan}
    answer_derivation: {kind: render_frame, frame: {text: "तुम {item} से हो?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "To ask the same question formally, use आप with हैं: आप कहाँ से हैं?", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit01.lesson03.translate.008
    lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hindi nouns are masculine or feminine: दिन, नाम and योग are masculine, खुशी is feminine.", language_code: en, direction: ltr}
