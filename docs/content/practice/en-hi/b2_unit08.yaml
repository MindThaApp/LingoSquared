templates:
- content_key: practice.en-hi.hi.b2.unit08.lesson01.choose.001
  lesson_content_key: hi.b2.unit08.lesson01.srot
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: &id001
      language_code: hi
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_सेवा, w_तेज, w_दावा, w_किराया, w_बढ़ा, w_स्रोत, w_निष्कर्ष, w_बताती, w_अधिक, w_कीमत, w_असहमत, w_मतभेद, w_ठोस, w_आँकड़े, w_दिए, w_प्रमाणित, w_साक्ष्य, w_कारण, w_विश्वसनीय, w_सस्ती, w_मानती, w_बढ़ने, w_गति, w_किराए]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on attributing claims.', language_code: en, direction: ltr}
