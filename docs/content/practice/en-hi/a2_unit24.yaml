  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-hi A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (course en-hi-a2; tags hi_a2_u24*, single-member w_<token> anchors).
    Every slot draws only on words this unit introduces; earlier words appear only as literal frame text.
    Translation prompts that need a gendered or honorific form say so in brackets. Lesson 1 has only four
    lexemes, so its recognition pool is exactly four and the unit-wide matching pool is used for lesson 1
    matching. Reviewer: confirm 'यह कल ठीक होगा' for It will be fixed tomorrow (कल यह ठीक होगा is also
    natural) and that पंखे की मरम्मत कल होगी is the usual notice wording.
