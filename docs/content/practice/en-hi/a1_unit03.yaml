schema_version: "1.0"
pack_key: practice.en-hi.a1.unit03
source_language: en
target_language: hi
unit_content_key: hi.a1.unit03.dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-hi) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (tags hi_a1_u03*, w_<token> anchors). Weekday/month slots in
    sentence frames use all seven weekdays / twelve months, which are natural in each frame. Feedback lines carry a usage or grammar point, never the task or the answer. Reviewer: check gender/honorific agreement in every frame and that the Devanagari spellings match the realization.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_सोमवार, w_मंगलवार, w_बुधवार, w_गुरुवार, w_शुक्रवार, w_शनिवार, w_रविवार, w_जनवरी, w_फ़रवरी, w_मार्च, w_अप्रैल, w_मई, w_जून, w_जुलाई, w_अगस्त, w_सितंबर, w_अक्टूबर, w_नवंबर, w_दिसंबर, w_आज, w_कब, w_अगली, w_जन्मदिन, w_तारीख़, w_क्लास, w_बात, w_कौन]
slot_presets:
  days: &days {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: [w_सोमवार, w_मंगलवार, w_बुधवार, w_गुरुवार, w_शुक्रवार, w_शनिवार, w_रविवार]}}
  months: &months {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: [w_जनवरी, w_फ़रवरी, w_मार्च, w_अप्रैल, w_मई, w_जून, w_जुलाई, w_अगस्त, w_सितंबर, w_अक्टूबर, w_नवंबर, w_दिसंबर]}}
  daylisten: &daylisten {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: [w_सोमवार, w_मंगलवार, w_बुधवार, w_गुरुवार, w_शुक्रवार, w_शनिवार, w_रविवार, w_जनवरी, w_फ़रवरी, w_मार्च, w_अप्रैल, w_मई, w_जून, w_जुलाई, w_अगस्त, w_सितंबर, w_अक्टूबर, w_नवंबर, w_दिसंबर]}}
  l3words: &l3words {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_आज, w_कब, w_अगली, w_जन्मदिन, w_तारीख़, w_क्लास]}}
  mix: &mix {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_आज, w_क्लास, w_तारीख़, w_कब, w_जन्मदिन, w_सोमवार, w_जनवरी, w_दिसंबर]}}
  tarikh: &tarikh {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_तारीख़}}
  kab: &kab {language_code: hi, part_of_speech: adverb, agreement_tags: {semantic: w_कब}}
  baat: &baat {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_बात}}
  kaun: &kaun {language_code: hi, part_of_speech: pronoun, agreement_tags: {semantic: w_कौन}}
  words: &words {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_सोमवार, w_मंगलवार, w_बुधवार, w_गुरुवार, w_शुक्रवार, w_शनिवार, w_रविवार, w_जनवरी, w_फ़रवरी, w_मार्च, w_अप्रैल, w_मई, w_जून, w_जुलाई, w_अगस्त, w_सितंबर, w_अक्टूबर, w_नवंबर, w_दिसंबर, w_आज, w_तारीख़, w_जन्मदिन, w_क्लास]}}
templates:
  - content_key: practice.en-hi.hi.a1.unit03.lesson01.choose.001
    lesson_content_key: hi.a1.unit03.lesson01.days_of_week
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *days}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hindi weekdays end in -वार (day of the week), so सोमवार, मंगलवार and रविवार all share the same ending.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson02.listen.001
    lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *daylisten}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Month names are borrowed from English, which is why जनवरी, मार्च and दिसंबर are easy to recognise.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson03.choose.001
    lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "अगली means next and agrees with a feminine noun: अगली क्लास is the next class, while a masculine noun would take अगला.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson03.match.002
    lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Many Hindi words for time are nouns without an article: आज (today), क्लास (class) and जन्मदिन (birthday) are used on their own.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson01.order.002
    lesson_content_key: hi.a1.unit03.lesson01.days_of_week
    type: word_order
    frame: {text: "आज {item} है।", language_code: hi, direction: ltr}
    slots: {item: *days}
    answer_derivation: {kind: render_frame, frame: {text: "आज {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The weekday is the subject of the sentence, so आज सोमवार है literally means Today Monday is.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson01.order.003
    lesson_content_key: hi.a1.unit03.lesson01.days_of_week
    type: word_order
    frame: {text: "योग क्लास {item} को है।", language_code: hi, direction: ltr}
    slots: {item: *days}
    answer_derivation: {kind: render_frame, frame: {text: "योग क्लास {item} को है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "को after a weekday means on: सोमवार को is on Monday.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson02.fill.002
    lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
    type: fill_in_blank
    frame: {text: "आज कितनी {item} है? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *tarikh, hint: *tarikh}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "कितनी agrees with the feminine noun तारीख़, so it ends in -ी.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson02.order.003
    lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
    type: word_order
    frame: {text: "मेरा जन्मदिन {item} में है।", language_code: hi, direction: ltr}
    slots: {item: *months}
    answer_derivation: {kind: render_frame, frame: {text: "मेरा जन्मदिन {item} में है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "में after a month means in: जनवरी में is in January.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson03.fill.003
    lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
    type: fill_in_blank
    frame: {text: "अगली क्लास {item} है? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *kab, hint: *kab}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "कब means when and sits where the answer would go: अगली क्लास मंगलवार को है.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson03.fill.004
    lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
    type: fill_in_blank
    frame: {text: "कोई {item} नहीं! ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *baat, hint: *baat}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "कोई बात नहीं is the everyday reply to thanks or an apology, like no problem.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson01.translate.004
    lesson_content_key: hi.a1.unit03.lesson01.days_of_week
    type: translation
    frame: {text: "What day is it today?", language_code: en, direction: ltr}
    slots: {item: *kaun}
    answer_derivation: {kind: render_frame, frame: {text: "आज {item} सा दिन है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "कौन सा means which one; in आज कौन सा दिन है? it asks which day of the week it is.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson02.translate.004
    lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
    type: translation
    frame: {text: "My birthday is in {month}.", language_code: en, direction: ltr, slot_rendering: {month: english_gloss}}
    slots: {month: *months}
    answer_derivation: {kind: render_frame, frame: {text: "मेरा जन्मदिन {month} में है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Months take में (in), but weekdays take को (on).", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson01.translate.005
    lesson_content_key: hi.a1.unit03.lesson01.days_of_week
    type: translation
    frame: {text: "Yoga class is on {day}.", language_code: en, direction: ltr, slot_rendering: {day: english_gloss}}
    slots: {day: *days}
    answer_derivation: {kind: render_frame, frame: {text: "योग क्लास {day} को है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Weekdays are masculine nouns, and को marks the day on which something happens.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson03.translate.005
    lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
    type: translation
    frame: {text: "When is your birthday? (informal)", language_code: en, direction: ltr}
    slots: {item: *kab}
    answer_derivation: {kind: render_frame, frame: {text: "तुम्हारा जन्मदिन {item} है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "With formal आप you would say आपका जन्मदिन कब है?", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit03.lesson02.translate.005
    lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Weekday and month names are written without capital letters in Devanagari, because the script has no upper case.", language_code: en, direction: ltr}
