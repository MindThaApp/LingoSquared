schema_version: "1.0"
pack_key: practice.en-hi.a1.unit10
source_language: en
target_language: hi
unit_content_key: hi.a1.unit10.routines
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-hi, job B) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (tags hi_a1_u10*, w_<token> anchors). Habitual -ta/-ti verbs: every prompt that needs a gendered form says (said by a man) or (said by a woman); tum questions say whether the person asked is a man or a woman. Feedback lines carry a usage or grammar point, never the task or the answer. Reviewer: check gender/honorific agreement in every frame and that the Devanagari spellings match the realization.
    Opus pass 2026-10-24: रोज़ prompts reordered to Every day ... to steer word order; come-back prompt drops the hour (शाम छह बजे vs शाम को छह बजे both natural). NATIVE FLAG: रोज़ is movable (मैं काम पर रोज़ जाती हूँ is also correct) in fixed-sentence translations.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_उठता, w_उठती, w_जाता, w_जाती, w_करता, w_नाश्ता, w_रोज़, w_काम, w_वह, w_वे, w_उठते, w_सोते, w_सोता, w_सोती, w_वापस, w_आता, w_खाता, w_खाती, w_आती, w_आते]
slot_presets:
  l1: &l1 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_उठता, w_उठती, w_जाता, w_जाती, w_करता, w_नाश्ता, w_रोज़, w_काम]}}
  l1b: &l1b {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_रोज़, w_नाश्ता, w_काम, w_वह, w_वे]}}
  uth: &uth {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_उठता, w_उठती]}}
  jaa: &jaa {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_जाता, w_जाती]}}
  karta: &karta {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_करता}}
  jati: &jati {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_जाती}}
  sone: &sone {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_उठते, w_सोते]}}
  l2: &l2 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_सोता, w_सोती, w_उठते, w_सोते]}}
  sotee: &sotee {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_सोती}}
  uthti: &uthti {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_उठती}}
  sote: &sote {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_सोते}}
  l3: &l3 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_वापस, w_आता, w_खाता, w_खाती, w_आती, w_आते]}}
  aata: &aata {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_आता}}
  khati: &khati {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_खाती}}
  verbs: &verbs {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_उठता, w_उठती, w_सोता, w_सोती, w_आता, w_आती]}}
  words3: &words3 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_रोज़, w_नाश्ता, w_काम, w_वापस, w_वे]}}
templates:
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.choose.001
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Habitual verbs end in -ता for a man and -ती for a woman: मैं उठता हूँ, मैं उठती हूँ.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.listen.002
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "वह means he or she, and the verb ending tells you which; वे is they.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.order.003
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: word_order
    frame: {text: "मैं रोज़ सात बजे {item} हूँ।", language_code: hi, direction: ltr}
    slots: {item: *uth}
    answer_derivation: {kind: render_frame, frame: {text: "मैं रोज़ सात बजे {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The verb ending follows the speaker's gender: उठता for a man and उठती for a woman, and हूँ goes with मैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.order.004
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: word_order
    frame: {text: "मैं रोज़ काम पर {item} हूँ।", language_code: hi, direction: ltr}
    slots: {item: *jaa}
    answer_derivation: {kind: render_frame, frame: {text: "मैं रोज़ काम पर {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "काम पर जाना, to go to work, needs पर, but the verb ending still follows the speaker's gender.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.fill.005
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: fill_in_blank
    frame: {text: "मैं रोज़ नाश्ता {item} हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *karta, hint: *karta}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Many Hindi actions are noun plus करना: नाश्ता करना is to have breakfast.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.translate.006
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: translation
    frame: {text: "Every day I go to work. (said by a woman)", language_code: en, direction: ltr}
    slots: {item: *jati}
    answer_derivation: {kind: render_frame, frame: {text: "मैं रोज़ काम पर {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "A woman uses the -ती ending: जाती हूँ; a man would say जाता हूँ.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson01.translate.007
    lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
    type: translation
    frame: {text: "Every day I have breakfast. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *karta}
    answer_derivation: {kind: render_frame, frame: {text: "मैं रोज़ नाश्ता {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Hindi says नाश्ता करना, literally to do breakfast, where English says to have breakfast.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson02.choose.001
    lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "With तुम the verb ends in -ते for a man and -ती for a woman, and takes हो: तुम उठते हो, तुम उठती हो.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson02.match.002
    lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *verbs, second: *verbs, third: *verbs, fourth: *verbs, fifth: *verbs, sixth: *verbs}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Each habitual verb has a masculine -ता and a feminine -ती form, and the form follows the speaker.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson02.order.003
    lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
    type: word_order
    frame: {text: "तुम कब {item} हो?", language_code: hi, direction: ltr}
    slots: {item: *sone}
    answer_derivation: {kind: render_frame, frame: {text: "तुम कब {item} हो?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "With तुम the verb is -ते हो when asking a man, and the ending follows the person addressed.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson02.fill.004
    lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
    type: fill_in_blank
    frame: {text: "मैं रात को ग्यारह बजे {item} हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *sotee, hint: *sotee}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The speaker is a woman here, so the verb takes -ती; the ending follows the one who sleeps.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson02.translate.005
    lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
    type: translation
    frame: {text: "When do you sleep? (informal, asking a man)", language_code: en, direction: ltr}
    slots: {item: *sote}
    answer_derivation: {kind: render_frame, frame: {text: "तुम कब {item} हो?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "With तुम the ending follows the person asked, not the one asking: सोते for a man, सोती for a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson02.translate.006
    lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
    type: translation
    frame: {text: "When do you get up? (informal, asking a woman)", language_code: en, direction: ltr}
    slots: {item: *uthti}
    answer_derivation: {kind: render_frame, frame: {text: "तुम कब {item} हो?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Asking a woman, the verb ends in -ती: तुम उठती हो.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson03.choose.001
    lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "आते in तुम कब वापस आते हो? is the -ते form used with तुम when asking a man.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson03.fill.002
    lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
    type: fill_in_blank
    frame: {text: "मैं शाम को छह बजे वापस {item} हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *aata, hint: *aata}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "आता is the masculine form, so a man is speaking; a woman would say आती.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson03.translate.003
    lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
    type: translation
    frame: {text: "I come back in the evening. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *aata}
    answer_derivation: {kind: render_frame, frame: {text: "मैं शाम को वापस {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "को after शाम means in the evening, and वापस आना is to come back.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson03.translate.004
    lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
    type: translation
    frame: {text: "I eat dinner. (said by a woman)", language_code: en, direction: ltr}
    slots: {item: *khati}
    answer_derivation: {kind: render_frame, frame: {text: "मैं रात का खाना {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "रात का खाना, literally the meal of the night, means dinner; the -ती ending shows a woman is speaking.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit10.lesson03.translate.005
    lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "वापस means back and combines with verbs such as आना: वापस आता हूँ, I come back.", language_code: en, direction: ltr}
