schema_version: "1.0"
pack_key: practice.en-hi.a2.unit25
source_language: en
target_language: hi
unit_content_key: hi.a2.unit25.interview
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-hi A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (course en-hi-a2; tags hi_a2_u25*, single-member w_<token> anchors).
    Every slot draws only on words this unit introduces; earlier words appear only as literal frame text.
    Translation prompts that need a gendered or honorific form say so in brackets. Lesson 3 (the interview
    dialogue) introduces no new word, so it cannot anchor a lexeme; its sentences are practised through lesson
    2 templates. सकता is practised in its masculine form only, hence 'said by a man' in the translation.
    Reviewer: confirm 'आपको कितने साल का अनुभव है?' and 'मैं सोमवार को शुरू कर सकता हूँ'.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_साल, w_अनुभव, w_नौकरी, w_इंटरव्यू, w_मैनेजर, w_कितने, w_का, w_सोमवार, w_शुरू, w_सकता, w_कर, w_हूँ, w_को]
slot_presets:
