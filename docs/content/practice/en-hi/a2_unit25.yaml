    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "सकता means can and follows the stem of the main verb, here कर.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.listen.002
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
