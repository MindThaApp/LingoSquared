    frame: {text: "मैं {item} को शुरू कर सकता हूँ।", language_code: hi, direction: ltr}
    slots: {item: *somvar}
    answer_derivation: {kind: render_frame, frame: {text: "मैं {item} को शुरू कर सकता हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "को after a weekday means on.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.order.004
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: word_order
    frame: {text: "मैं सोमवार को शुरू कर {item} हूँ।", language_code: hi, direction: ltr}
    slots: {item: *sakta}
    answer_derivation: {kind: render_frame, frame: {text: "मैं सोमवार को शुरू कर {item} हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "सकता follows the verb stem, not the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.order.005
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: word_order
    frame: {text: "मैं सोमवार {item} शुरू कर सकता हूँ।", language_code: hi, direction: ltr}
    slots: {item: *ko}
    answer_derivation: {kind: render_frame, frame: {text: "मैं सोमवार {item} शुरू कर सकता हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "को marks the day when something happens.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.fill.006
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: fill_in_blank
    frame: {text: "मैं सोमवार को शुरू कर {item} हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *sakta, hint: *sakta}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A man says सकता; a woman would say सकती.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.fill.007
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: fill_in_blank
    frame: {text: "मैं सोमवार को {item} कर सकता हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *shuru, hint: *shuru}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "शुरू करना is to begin.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.translate.008
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "सकता is masculine; the feminine is सकती.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.translate.009
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: translation
    frame: {text: "I can start on Monday. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *somvar}
    answer_derivation: {kind: render_frame, frame: {text: "मैं {item} को शुरू कर सकता हूँ।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "सकता agrees with the speaker.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.order.010
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: word_order
    frame: {text: "मुझे कब {item} करना है?", language_code: hi, direction: ltr}
    slots: {item: *shuru}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे कब {item} करना है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "शुरू करना is to start; कब asks when.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.fill.011
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: fill_in_blank
    frame: {text: "आपको कितने साल का {item} है? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *anubhav, hint: *anubhav}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "अनुभव is masculine singular.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.translate.012
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
    type: translation
    frame: {text: "When do I need to start?", language_code: en, direction: ltr}
    slots: {item: *shuru}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे कब {item} करना है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The need to do something is expressed with मुझे and an infinitive plus है.", language_code: en, direction: ltr}
