  l1b: &l1b {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_साल, w_अनुभव, w_नौकरी, w_इंटरव्यू, w_मैनेजर]}}
  m25: &m25 {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_साल, w_अनुभव, w_नौकरी, w_इंटरव्यू, w_मैनेजर, w_कितने, w_सोमवार, w_शुरू, w_सकता, w_कर]}}
  kitne: &kitne {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_कितने}}
  anubhav: &anubhav {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_अनुभव}}
  naukri: &naukri {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_नौकरी}}
  interview: &interview {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_इंटरव्यू}}
  manager: &manager {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_मैनेजर}}
  saal: &saal {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_साल}}
  hun: &hun {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_हूँ}}
  l2a: &l2a {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_सोमवार, w_शुरू, w_सकता, w_कर, w_को]}}
  somvar: &somvar {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_सोमवार}}
  sakta: &sakta {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_सकता}}
  ko: &ko {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_को}}
  shuru: &shuru {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_शुरू}}
templates:
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.choose.001
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "साल means year and also stands for years after a number; कितने asks how many with a masculine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.listen.002
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "इंटरव्यू and मैनेजर are English loanwords; अनुभव and नौकरी are Hindi.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.match.003
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *m25, second: *m25, third: *m25, fourth: *m25, fifth: *m25, sixth: *m25}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words for work and experience, plus the verb forms for being able to start.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.order.004
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: word_order
    frame: {text: "आपको {item} साल का अनुभव है?", language_code: hi, direction: ltr}
    slots: {item: *kitne}
    answer_derivation: {kind: render_frame, frame: {text: "आपको {item} साल का अनुभव है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "कितने comes before the noun and asks about quantity.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.order.005
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: word_order
    frame: {text: "मुझे तीन साल का {item} है।", language_code: hi, direction: ltr}
    slots: {item: *anubhav}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे तीन साल का {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "का links साल to अनुभव.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.order.006
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: word_order
    frame: {text: "मुझे एक {item} चाहिए।", language_code: hi, direction: ltr}
    slots: {item: *naukri}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे एक {item} चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "नौकरी is feminine, but चाहिए does not change.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.order.007
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: word_order
    frame: {text: "आज मेरा {item} है।", language_code: hi, direction: ltr}
    slots: {item: *interview}
    answer_derivation: {kind: render_frame, frame: {text: "आज मेरा {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "इंटरव्यू is masculine, so it takes मेरा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.fill.008
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: fill_in_blank
    frame: {text: "{item} अच्छा है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *manager, hint: *manager}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "मैनेजर is masculine here, so it takes अच्छा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.fill.009
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: fill_in_blank
    frame: {text: "मुझे तीन {item} का अनुभव है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *saal, hint: *saal}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "साल stays singular after a number in this phrase.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.fill.010
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: fill_in_blank
    frame: {text: "मैं ठीक {item}। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *hun, hint: *hun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "हूँ is the form of be that goes with मैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.translate.011
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "अनुभव means experience in the sense of work experience.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.translate.012
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: translation
    frame: {text: "I have three years of experience.", language_code: en, direction: ltr}
    slots: {item: *anubhav}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे तीन साल का {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Having experience is expressed as experience is to me.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.translate.013
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: translation
    frame: {text: "I need a job.", language_code: en, direction: ltr}
    slots: {item: *naukri}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे एक {item} चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Need uses मुझे and चाहिए.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson01.translate.014
    lesson_content_key: hi.a2.unit25.lesson01.kitne_saal_ka_anubhav
    type: translation
    frame: {text: "How many years of experience do you have? (formal)", language_code: en, direction: ltr}
    slots: {item: *kitne}
    answer_derivation: {kind: render_frame, frame: {text: "आपको {item} साल का अनुभव है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आपको is the formal to-you form.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit25.lesson02.choose.001
    lesson_content_key: hi.a2.unit25.lesson02.mein_somvar_ko_shuru_kar_sakta_hoon
