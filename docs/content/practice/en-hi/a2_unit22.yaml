    scripts/backfill_lexemes_en_hi.py (course en-hi-a2; tags hi_a2_u22*, single-member w_<token> anchors).
    Every slot draws only on words this unit introduces; earlier words appear only as literal frame text.
    Translation prompts that need a gendered or honorific form say so in brackets. Past forms with ने agree
    with the object: खोला (खाता, masc. sg.) and भरे (दो फ़ॉर्म, masc. pl.). Reviewer: confirm 'पहचान पत्र' as
    the natural term for an ID card in a bank and the word order of 'मैंने दो फ़ॉर्म भरे'.
