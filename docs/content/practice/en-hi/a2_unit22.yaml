    feedback_frame: {text: "The infinitive खोलना gives the past form खोला for a masculine singular object.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit22.lesson01.order.004
    lesson_content_key: hi.a2.unit22.lesson01.mujhe_khaata_kholna_hai
