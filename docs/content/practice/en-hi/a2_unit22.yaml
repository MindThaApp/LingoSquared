    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "बैंक is the English loanword; खाता is the account you open there.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit22.lesson01.match.003
    lesson_content_key: hi.a2.unit22.lesson01.mujhe_khaata_kholna_hai
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
