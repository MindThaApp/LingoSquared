    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "खाता is an account and खोलना is to open; चाहिए follows the thing you need.", language_code: en, direction: ltr}
