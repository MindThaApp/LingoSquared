    frame: {text: "मुझे अपना {item} खोलना है।", language_code: hi, direction: ltr}
    slots: {item: *khata}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे अपना {item} खोलना है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "खाता is masculine, which is why अपना is used.", language_code: en, direction: ltr}
