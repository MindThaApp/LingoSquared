schema_version: '1.0'
pack_key: practice.en-hi.a1.unit51
source_language: en
target_language: hi
unit_content_key: hi.a1.unit51.laundrette
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-hi backfill lexemes (tags hi_a1_u51 / w_<token>). 16 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_आना, w_इस्तेमाल, w_कपड़े, w_चलना, w_डिग्री, w_ड्रायर, w_तैयार, w_धोना, w_प्रोग्राम, w_भारी, w_मिनट, w_यूपीआई, w_लेने, w_लॉन्ड्री, w_सकती, w_होंगे]
templates:
- content_key: practice.en-hi.hi.a1.unit51.lesson01.choose.001
  lesson_content_key: hi.a1.unit51.lesson01.mujhe_apne_kapre_dhone
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: &id001
      language_code: hi
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_लॉन्ड्री, w_धोना, w_कपड़े, w_प्रोग्राम, w_तैयार, w_होंगे, w_लेने, w_आना, w_सकती, w_डिग्री, w_ड्रायर, w_इस्तेमाल, w_मिनट, w_यूपीआई, w_चलना, w_भारी]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to wash my clothes.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit51.lesson02.listen.001
  lesson_content_key: hi.a1.unit51.lesson02.ek_vosh_ke_kitne
  type: listen_select
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how much does a wash cost?.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit51.lesson03.translate.001
  lesson_content_key: hi.a1.unit51.lesson03.kapre_kab_tak_taiyar
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on when is the laundry ready?.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit51.lesson04.match.001
  lesson_content_key: hi.a1.unit51.lesson04.londree_men
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: hi, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Hindi word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit51.lesson05.choose.001
  lesson_content_key: hi.a1.unit51.lesson05.retlist_parhna
  type: multiple_choice
  frame: {text: '{item}', language_code: hi, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading the price list.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit51.lesson06.translate.001
  lesson_content_key: hi.a1.unit51.lesson06.priya_londree_men
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on priya at the launderette.', language_code: en, direction: ltr}
- content_key: practice.en-hi.hi.a1.unit51.lesson03.order.002
  lesson_content_key: hi.a1.unit51.lesson03.kapre_kab_tak_taiyar
  type: word_order
  frame: {text: 'कपड़े कब तक {item} होंगे?', language_code: hi, direction: ltr}
  slots:
    item:
      language_code: hi
      part_of_speech: adjective
      agreement_tags: {semantic: w_तैयार}
  answer_derivation:
    kind: render_frame
    frame: {text: 'कपड़े कब तक {item} होंगे?', language_code: hi, direction: ltr}
  feedback_frame: {text: 'When is the laundry ready? तैयार means ready.', language_code: en, direction: ltr}
