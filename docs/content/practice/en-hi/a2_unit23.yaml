schema_version: "1.0"
pack_key: practice.en-hi.a2.unit23
source_language: en
target_language: hi
unit_content_key: hi.a2.unit23.doctor
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-hi A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (course en-hi-a2; tags hi_a2_u23*, single-member w_<token> anchors).
    Every slot draws only on words this unit introduces; earlier words appear only as literal frame text.
    Translation prompts that need a gendered or honorific form say so in brackets. से carries three senses in
    the course (from, with, since); in this unit it is glossed for since/for a length of time, so it is kept
    out of the bare-word translation pool and appears only in a fixed frame. Reviewer: confirm 'मुझे तीन दिन
    से बुखार है' and 'आपको कब से बुखार है' as the natural since-phrases.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_दर्द, w_बुखार, w_सिर, w_तीन, w_दिन, w_कब, w_से, w_दवा, w_आराम, w_करना, w_तुम्हें, w_डॉक्टर, w_समस्या, w_भी, w_किया, w_ठीक]
