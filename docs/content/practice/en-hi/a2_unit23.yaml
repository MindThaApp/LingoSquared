templates:
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.choose.001
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "सिर दर्द is a headache; दर्द is pain and बुखार is fever.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.listen.002
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "तीन दिन means three days; the noun दिन stays singular after a number.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.match.003
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *l1b, second: *l1b, third: *l1b, fourth: *l1b, fifth: *l1b, sixth: *l1b}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "से after a period of time means since or for; कब से asks since when.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.order.004
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: word_order
    frame: {text: "मुझे {item} दर्द है।", language_code: hi, direction: ltr}
    slots: {item: *sir}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे {item} दर्द है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Aches are expressed as मुझे with the body part before दर्द.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.order.005
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: word_order
    frame: {text: "मुझे तीन दिन {item} बुखार है।", language_code: hi, direction: ltr}
    slots: {item: *se}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे तीन दिन {item} बुखार है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "से after a time expression means for or since.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.order.006
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: word_order
    frame: {text: "आपको {item} से बुखार है?", language_code: hi, direction: ltr}
    slots: {item: *kab}
    answer_derivation: {kind: render_frame, frame: {text: "आपको {item} से बुखार है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "कब से asks since when and lets the sentence use है, not था.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.order.007
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: word_order
    frame: {text: "मुझे {item} दिन से बुखार है।", language_code: hi, direction: ltr}
    slots: {item: *teen}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे {item} दिन से बुखार है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The number comes before दिन.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.fill.008
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: fill_in_blank
    frame: {text: "मुझे तीन {item} से बुखार है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *din, hint: *din}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "दिन is the word for day and is singular after तीन here.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.fill.009
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: fill_in_blank
    frame: {text: "मुझे {item} है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *bukhar, hint: *bukhar}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Illnesses use मुझे ... है, as in English I have.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.translate.010
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "दर्द is a general word for pain and combines with body parts.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.translate.011
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: translation
    frame: {text: "I have had a fever for three days.", language_code: en, direction: ltr}
    slots: {item: *se}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे तीन दिन {item} बुखार है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Hindi uses the present है with से for a state that is still going on.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson01.translate.012
    lesson_content_key: hi.a2.unit23.lesson01.kab_se
    type: translation
    frame: {text: "Since when have you had a fever? (formal)", language_code: en, direction: ltr}
    slots: {item: *kab}
    answer_derivation: {kind: render_frame, frame: {text: "आपको {item} से बुखार है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आपको is the formal to-you form used in these questions.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.choose.001
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "तुम्हें is the informal to-you form, while आपको is the formal one.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.listen.002
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "आराम is rest, and आराम करना is to rest.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.order.003
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: word_order
    frame: {text: "आपको {item} करना चाहिए।", language_code: hi, direction: ltr}
    slots: {item: *aaram}
    answer_derivation: {kind: render_frame, frame: {text: "आपको {item} करना चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "चाहिए after an infinitive means should.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.order.004
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: word_order
    frame: {text: "आपको आराम {item} चाहिए।", language_code: hi, direction: ltr}
    slots: {item: *karna}
    answer_derivation: {kind: render_frame, frame: {text: "आपको आराम {item} चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The infinitive करना comes before चाहिए.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.order.005
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: word_order
    frame: {text: "मुझे {item} चाहिए।", language_code: hi, direction: ltr}
    slots: {item: *dawa}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे {item} चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "दवा is feminine, but चाहिए stays the same.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.fill.006
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: fill_in_blank
    frame: {text: "{item} आराम चाहिए। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *tumhen, hint: *tumhen}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "तुम्हें is the informal to-you form.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.fill.007
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: fill_in_blank
    frame: {text: "मुझे {item} चाहिए। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *dawa, hint: *dawa}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Things you need are named before चाहिए.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.translate.008
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "करना is a very common verb; आराम करना is a fixed phrase for resting.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.translate.009
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: translation
    frame: {text: "You should rest. (formal)", language_code: en, direction: ltr}
    slots: {item: *aaram}
    answer_derivation: {kind: render_frame, frame: {text: "आपको {item} करना चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आपको plus an infinitive and चाहिए gives advice.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.translate.010
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: translation
    frame: {text: "I need medicine.", language_code: en, direction: ltr}
    slots: {item: *dawa}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे {item} चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Need uses मुझे and चाहिए.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson02.translate.011
    lesson_content_key: hi.a2.unit23.lesson02.aapko_aaram_karna_chahiye
    type: translation
    frame: {text: "You need rest. (informal)", language_code: en, direction: ltr}
    slots: {item: *tumhen}
    answer_derivation: {kind: render_frame, frame: {text: "{item} आराम चाहिए।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "The informal to-you form is तुम्हें.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.choose.001
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "भी means also and किया is the past of करना used for a masculine object.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.listen.002
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "ठीक means fine or okay; डॉक्टर is an English loanword.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.order.003
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: word_order
    frame: {text: "क्या {item} है?", language_code: hi, direction: ltr}
    slots: {item: *samasya}
    answer_derivation: {kind: render_frame, frame: {text: "क्या {item} है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "क्या ... है? asks what the problem is.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.order.004
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: word_order
    frame: {text: "मुझे सिर दर्द {item} है।", language_code: hi, direction: ltr}
    slots: {item: *bhi}
    answer_derivation: {kind: render_frame, frame: {text: "मुझे सिर दर्द {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "भी comes right after the thing it adds to.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.order.005
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: word_order
    frame: {text: "अर्जुन ने आराम {item}।", language_code: hi, direction: ltr}
    slots: {item: *kiya}
    answer_derivation: {kind: render_frame, frame: {text: "अर्जुन ने आराम {item}।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "आराम करना forms its past with ने and किया.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.fill.006
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: fill_in_blank
    frame: {text: "अब अर्जुन {item} है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *theek, hint: *theek}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "ठीक है can mean he is fine or well.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.fill.007
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: fill_in_blank
    frame: {text: "मैं {item} हूँ। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *doctor, hint: *doctor}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Professions are named after मैं, with हूँ at the end.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.translate.008
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l3a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "समस्या is a problem and is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a2.unit23.lesson03.translate.009
    lesson_content_key: hi.a2.unit23.lesson03.arjun_doctor_ke_paas
    type: translation
    frame: {text: "What is the problem?", language_code: en, direction: ltr}
    slots: {item: *samasya}
