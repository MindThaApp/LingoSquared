schema_version: "1.0"
pack_key: practice.en-hi.a1.unit05
source_language: en
target_language: hi
unit_content_key: hi.a1.unit05.family
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-hi) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_hi.py (tags hi_a1_u05*, w_<token> anchors). Possessive and verb
    agreement was checked by hand: bhai/bada/chhota are masculine (mera), bahan/badi/chhoti feminine (meri);
    elders take mere ... hain (respect), so pita is tested only with that frame. Feedback lines carry a usage or grammar point, never the task or the answer. Reviewer: check gender/honorific agreement in every frame and that the Devanagari spellings match the realization.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_परिवार, w_पिता, w_माँ, w_भाई, w_बहन, w_माता-पिता, w_दादा, w_दादी, w_नाना, w_नानी, w_दिल्ली, w_मुंबई, w_बड़ा, w_बड़ी, w_छोटा, w_छोटी, w_रहते]
slot_presets:
  close: &close {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_परिवार, w_पिता, w_माँ, w_भाई, w_बहन, w_माता-पिता]}}
  ext: &ext {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_दादा, w_दादी, w_नाना, w_नानी, w_दिल्ली, w_मुंबई]}}
  size: &size {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: [w_बड़ा, w_बड़ी, w_छोटा, w_छोटी]}}
  mix: &mix {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_परिवार, w_पिता, w_माँ, w_भाई, w_बहन, w_दादा, w_दादी, w_नाना, w_नानी, w_दिल्ली]}}
  words: &words {language_code: hi, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_परिवार, w_पिता, w_माँ, w_भाई, w_बहन, w_माता-पिता, w_दादा, w_दादी, w_नाना, w_नानी, w_बड़ा, w_बड़ी, w_छोटा, w_छोटी]}}
  bhai: &bhai {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_भाई}}
  behen: &behen {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_बहन}}
  pita: &pita {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_पिता}}
  parivar: &parivar {language_code: hi, part_of_speech: noun, agreement_tags: {semantic: w_परिवार}}
  city: &city {language_code: hi, part_of_speech: proper_noun, agreement_tags: {semantic: [w_दिल्ली, w_मुंबई]}}
  mszie: &mszie {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: [w_बड़ा, w_छोटा]}}
  chhoti: &chhoti {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: w_छोटी}}
  bada: &bada {language_code: hi, part_of_speech: adjective, agreement_tags: {semantic: w_बड़ा}}
  rahte: &rahte {language_code: hi, part_of_speech: verb, agreement_tags: {semantic: w_रहते}}
templates:
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.choose.001
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *close}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "माता-पिता (parents) is a compound of माँ (mother) and पिता (father); many Hindi family words are compounds like this.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson02.listen.001
    lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
    type: listen_select
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *ext}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hindi distinguishes paternal grandparents (दादा, दादी) from maternal grandparents (नाना, नानी); English has no such split.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson03.choose.001
    lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
    type: multiple_choice
    frame: {text: "{item}", language_code: hi, direction: ltr}
    slots: {item: *size}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "बड़ा and छोटा go with masculine nouns and बड़ी and छोटी with feminine nouns, and each also describes age: older or younger.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson02.match.002
    lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: hi, direction: ltr}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Hindi family words are masculine or feminine in pairs: भाई and बहन, दादा and दादी, नाना and नानी.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.order.002
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: word_order
    frame: {text: "यह मेरा {item} है।", language_code: hi, direction: ltr}
    slots: {item: *bhai}
    answer_derivation: {kind: render_frame, frame: {text: "यह मेरा {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "भाई is masculine, so it takes मेरा; a feminine word like बहन takes मेरी.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.order.003
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: word_order
    frame: {text: "यह मेरी {item} है।", language_code: hi, direction: ltr}
    slots: {item: *behen}
    answer_derivation: {kind: render_frame, frame: {text: "यह मेरी {item} है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "बहन is feminine, so the possessive is मेरी, not मेरा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.order.004
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: word_order
    frame: {text: "यह मेरे {item} हैं।", language_code: hi, direction: ltr}
    slots: {item: *pita}
    answer_derivation: {kind: render_frame, frame: {text: "यह मेरे {item} हैं।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Out of respect for an elder, मेरा becomes मेरे and है becomes हैं, even for one person.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson02.order.003
    lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
    type: word_order
    frame: {text: "मेरे माता-पिता {city} में रहते हैं।", language_code: hi, direction: ltr}
    slots: {city: *city}
    answer_derivation: {kind: render_frame, frame: {text: "मेरे माता-पिता {city} में रहते हैं।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "में after a city means in, and the verb with a respectful plural subject is रहते हैं.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson03.order.002
    lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
    type: word_order
    frame: {text: "मेरा एक {item} भाई भी है।", language_code: hi, direction: ltr}
    slots: {item: *mszie}
    answer_derivation: {kind: render_frame, frame: {text: "मेरा एक {item} भाई भी है।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "बड़ा and छोटा agree with the masculine noun भाई, and एक here means a rather than one.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.fill.005
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: fill_in_blank
    frame: {text: "तुम्हारा {item} कहाँ रहता है? ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *parivar, hint: *parivar}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "परिवार is treated as singular and masculine, so the verb is रहता है.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson02.fill.004
    lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
    type: fill_in_blank
    frame: {text: "मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *rahte, hint: *rahte}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "With grandparents, who are respected and plural, the verb is रहते हैं rather than रहता है.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson03.fill.003
    lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
    type: fill_in_blank
    frame: {text: "मेरी भी एक {item} बहन है। ({hint})", language_code: hi, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *chhoti, hint: *chhoti}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "छोटी is the feminine form because बहन is feminine; for a brother it would be छोटा.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson02.translate.005
    lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
    type: translation
    frame: {text: "My parents live in {city}.", language_code: en, direction: ltr, slot_rendering: {city: english_gloss}}
    slots: {city: *city}
    answer_derivation: {kind: render_frame, frame: {text: "मेरे माता-पिता {city} में रहते हैं।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Parents are respected elders, so मेरे and the plural verb रहते हैं are used.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.translate.006
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: translation
    frame: {text: "Where does your family live? (informal)", language_code: en, direction: ltr}
    slots: {item: *parivar}
    answer_derivation: {kind: render_frame, frame: {text: "तुम्हारा {item} कहाँ रहता है?", language_code: hi, direction: ltr}}
    feedback_frame: {text: "With formal आप you would say आपका परिवार कहाँ रहता है?", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.translate.007
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: translation
    frame: {text: "This is my father. (said with respect)", language_code: en, direction: ltr}
    slots: {item: *pita}
    answer_derivation: {kind: render_frame, frame: {text: "यह मेरे {item} हैं।", language_code: hi, direction: ltr}}
    feedback_frame: {text: "Respect shows twice: मेरे instead of मेरा and हैं instead of है.", language_code: en, direction: ltr}
  - content_key: practice.en-hi.hi.a1.unit05.lesson01.translate.008
    lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hindi has two words for grandfather and two for grandmother, depending on whether they are on the father's or mother's side.", language_code: en, direction: ltr}
