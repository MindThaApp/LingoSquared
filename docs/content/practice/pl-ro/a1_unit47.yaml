    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów tej lekcji, z części „Mihai pomaga jej przypomnieć”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit47.lesson01.translate.002
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: translation
  frame:
