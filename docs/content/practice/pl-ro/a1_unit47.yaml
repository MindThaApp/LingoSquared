schema_version: '1.0'
pack_key: practice.pl-ro.a1.unit47
source_language: pl
target_language: ro
unit_content_key: ro.a1.unit47.programare
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Polish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amintești
    - w_calculator
    - w_confirmare
    - w_confirmat
    - w_convine
    - w_disponibil
    - w_plăcut
    - w_programare
    - w_programarea
templates:
- content_key: practice.pl-ro.ro.a1.unit47.lesson01.choose.001
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_programarea
        - w_programare
        - w_disponibil
        - w_convine
        - w_calculator
        - w_confirmat
        - w_confirmare
        - w_amintești
        - w_plăcut
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z lekcji o umawianiu się na wizytę.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit47.lesson02.listen.001
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek z tej lekcji, z tematu wolnego terminu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit47.lesson03.translate.001
  lesson_content_key: ro.a1.unit47.lesson03.pentru_ce_este_programarea
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej jednostki, z lekcji „W jakiej sprawie jest wizyta?”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit47.lesson05.match.001
  lesson_content_key: ro.a1.unit47.lesson05.citim_o_confirmare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Dopasuj każde rumuńskie słowo do jego polskiego znaczenia; słowa pochodzą z lekcji tego działu.
    language_code: pl
    direction: ltr
