    frame:
      text: Mihai merge cu {item} la serviciu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mihai jeździ do pracy rowerem. bicicleta znaczy „rower”.
    language_code: pl
    direction: ltr
