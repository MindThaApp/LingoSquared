    frame:
      text: Ce mijloc de {item} să iau până în centru?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Jakim środkiem transportu powinienem dojechać do centrum? transport znaczy „transport”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit34.lesson03.order.002
  lesson_content_key: ro.a1.unit34.lesson03.cumpararea_unui_bilet
  type: word_order
  frame:
