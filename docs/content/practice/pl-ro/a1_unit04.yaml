  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cât este ora? pyta o godzinę; odpowiedź to Este ora + liczba.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit04.lesson01.match.003
