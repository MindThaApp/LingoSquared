    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Muszę do ciebie zadzwonić. sun znaczy „dzwonię”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Z kim rozmawiam? Cu cine vorbesc? (dosł. „z kim rozmawiam?”) to standardowe pytanie do nieznanego rozmówcy przez telefon.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Możesz to powtórzyć? Poți să ... („Możesz ...?”) plus repeți („powtarzasz”) plus asta („to”).
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nie mów tak szybko, proszę. Nu vorbi („nie mów”) to nu + forma tu; atât de repede znaczy „tak szybko”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: Słabo cię słyszę.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nie słyszę cię dobrze. Nu te aud bine: aud to „słyszę”, te („cię”) stoi przed czasownikiem, a bine znaczy „dobrze”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Wyślę ci wiadomość. Îți („tobie”) to zaimek w celowniku stojący przed czasownikiem: Îți trimit un mesaj.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Oddzwonię później. Înapoi („z powrotem”) stoi po czasowniku: te sun înapoi to „oddzwonię do ciebie”, a mai târziu znaczy „później”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Poszło naprawdę dobrze, lepiej, niż myślałem. A mers to czas przeszły od a merge („iść”, tu „wypaść”); credeam znaczy „myślałem” (przeszła forma od a crede).
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dziękuję, to dla mnie bardzo dużo znaczy. Înseamnă to forma 3. os. lp od a însemna („znaczyć”); pentru mine („dla mnie”) mówi, dla kogo to ważne.
    language_code: pl
    direction: ltr
