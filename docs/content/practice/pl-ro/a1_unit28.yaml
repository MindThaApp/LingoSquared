    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej jednostki, z lekcji „Z kim rozmawiam?”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson03.translate.001
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej jednostki, z lekcji „Możesz to powtórzyć?”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Dopasuj każde rumuńskie słowo do jego polskiego znaczenia; słowa pochodzą z lekcji tego działu.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
