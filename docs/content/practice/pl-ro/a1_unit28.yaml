    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej jednostki, z lekcji o czytaniu wiadomości tekstowych.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej jednostki, z lekcji o rozmowie telefonicznej po zmianie.'
