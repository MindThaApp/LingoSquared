  feedback_frame:
    text: 'Meu i mea oznaczają „mój/moja”: meu łączy się z rzeczownikami rodzaju męskiego i nijakiego (tatăl meu), a mea z żeńskimi (mama mea).'
    language_code: pl
    direction: ltr
