    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi to męska forma liczby dwa, a două to forma żeńska i nijaka; pozostałe liczby się nie zmieniają.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
