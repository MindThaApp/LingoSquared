    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Od zera do dziesięciu to podstawowe cegiełki: liczby od 11 do 19 tworzy się przez dodanie -sprezece (unsprezece, doisprezece), a dziesiątki przez dodanie -zeci.'
    language_code: pl
    direction: ltr
