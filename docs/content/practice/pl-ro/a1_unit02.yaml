    kind: slot_text
    slot: item
  feedback_frame:
    text: Przed rzeczownikiem jeden i dwa zmieniają się zależnie od rodzaju (un lub o, doi lub două); gdy po prostu liczysz, mówisz unu, doi.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson02.choose.001
