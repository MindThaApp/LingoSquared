    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Od dwóch do dziewiętnastu nie ma de: am nouăsprezece ani. Od dwudziestu wzwyż się pojawia: am treizeci de ani.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: Mam trzydzieści lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Od dwudziestu wzwyż po liczbie przed rzeczownikiem występuje de: treizeci de ani.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai to forma tu czasownika mieć, a aveți to forma dumneavoastră: Câți ani ai? lub Câți ani aveți?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De pojawia się po liczbach od dwudziestu wzwyż: treizeci de ani, ale nouăsprezece ani.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Ile masz lat? (nieformalnie, do przyjaciela)
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Câți ani ai? dosłownie pyta, ile lat masz: rumuński używa czasownika mieć, a nie być, gdy mowa o wieku.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Ile Pan/Pani ma lat? (formalnie, do osoby, do której zwracasz się przez dumneavoastră)
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți to grzecznościowa forma czasownika mieć, używana z dumneavoastră.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul jest rodzaju nijakiego, a rzeczownik nijaki w liczbie pojedynczej przyjmuje męską formę tău; wersja grzecznościowa to Care este numărul dumneavoastră de telefon?
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
