templates:
- content_key: practice.pl-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Dwa ma dwie formy: doi z rzeczownikami rodzaju męskiego i două z rzeczownikami rodzaju żeńskiego i nijakiego.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ro.ro.a1.unit02.lesson01.listen.002
