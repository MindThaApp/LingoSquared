      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten به -n ختم می‌شود چون Morgen و Tag و Abend مذکرند؛ Nacht مؤنث است و Gute Nacht می‌گیرد.
    language_code: fa
    direction: rtl
