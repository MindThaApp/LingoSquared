  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: همهٔ اسم‌ها در آلمانی با حرف بزرگ شروع می‌شوند، پس Morgen و Tag و Abend و Nacht با حرف بزرگ نوشته می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson03.translate.005
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
