templates:
- content_key: practice.fa-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen صبح‌ها، Guten Tag در طول روز و Guten Abend از عصر به بعد گفته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss خداحافظی دوستانه است؛ Auf Wiedersehen خداحافظی مؤدبانه برای غریبه‌ها و موقعیت‌های رسمی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'آلمانی دو کلمه برای «شما/تو» دارد: Sie رسمی است (غریبه‌ها، مسئولان) و du غیررسمی (دوستان، خانواده، بچه‌ها).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte هم «لطفاً» معنی می‌دهد و هم «خواهش می‌کنم»، و Entschuldigung برای جلب توجه کسی یا عذرخواهی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? شکل رسمی «حال شما چطور است؟» است؛ با دوست می‌پرسید Wie geht's?
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: word_order
  frame:
    text: Bis {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis یعنی «تا»، پس Bis bald مثل «به زودی می‌بینمت» و Bis später مثل «بعداً می‌بینمت» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson01.order.002
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: word_order
  frame:
