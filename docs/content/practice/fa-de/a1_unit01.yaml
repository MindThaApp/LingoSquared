    slot: item
  feedback_frame:
    text: شکل غیررسمی اینجا dir است که با حرف کوچک نوشته می‌شود؛ سؤال رسمی Und Ihnen? است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson04.fill.003
