  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sie و du شکل فاعلی «شما/تو» هستند؛ Ihnen و dir شکل‌هایی هستند که یعنی «به شما/به تو».
    language_code: fa
    direction: rtl
