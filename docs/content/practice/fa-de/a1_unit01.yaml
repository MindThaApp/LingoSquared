    slot: item
  feedback_frame:
    text: Gern geschehen جواب استاندارد به danke است، تقریباً به معنی «با کمال میل انجام شد».
    language_code: fa
    direction: rtl
- content_key: practice.fa-de.de.a1.unit01.lesson01.translate.003
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
