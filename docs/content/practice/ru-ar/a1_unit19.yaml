    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بيتك — это بيت («дом») плюс ـك («твой»); عندك значит «у тебя есть».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson01.order.004
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item} واحدة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item} واحدة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Числительное «один» стоит после существительного и согласуется с ним: غرفة واحدة — женский род.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson01.order.005
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في بيتي стоит в начале предложения и значит «в моём доме»; то, что находится в доме, идёт следом.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson01.fill.006
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: fill_in_blank
  frame:
    text: في {item} غرفة واحدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Окончание ـي у слова بيت означает «мой».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson01.translate.007
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Это четыре существительных о жилье: дом, комната, кухня и стол.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson01.translate.008
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: В моём доме одна комната.
    language_code: ru
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في {a} {b} واحدة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В арабском нет глагола «есть»: في بيتي غرفة буквально значит «в моём доме комната».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.choose.001
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'طاولة — это стол; ال в слове الغرفة делает его определённым: «комната».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.listen.002
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندك значит «у тебя есть»; слово образовано от عند и окончания ـك.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.order.003
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: عندي طاولة في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي طاولة في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في الغرفة значит «в комнате»; ال указывает на определённую комнату.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.order.004
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: أين {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Окончание ـك означает «твой», поэтому أين بيتك؟ значит «где твой дом?»
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.order.005
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: هل {item} طاولة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} طاولة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هل превращает предложение в вопрос «да или нет»: هل عندك طاولة؟ значит «у тебя есть стол?»'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.fill.006
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: fill_in_blank
  frame:
    text: في بيتي غرفة واحدة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'و пишется слитно со следующим словом: ومطبخ значит «и кухня».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.translate.007
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: К слову بيت добавляются окончания ـي («мой») и ـك («твой»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.translate.008
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: У меня в комнате есть стол.
    language_code: ru
    direction: ltr
  slots:
    a: *id012
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: В сочетании في الغرفة после في сохраняется ال.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.translate.009
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: У тебя есть стол?
    language_code: ru
    direction: ltr
  slots:
    a: *id009
    b: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل стоит в начале вопроса, а порядок слов остаётся прежним.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit19.lesson02.translate.010
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: Где твой дом, Юсуф?
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Лейла спрашивает Юсуфа, используя окончание ـك — «твой».
    language_code: ru
    direction: ltr
