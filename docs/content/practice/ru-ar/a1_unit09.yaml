templates:
- content_key: practice.ru-ar.ar.a1.unit09.lesson01.choose.001
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مكان — общее слово «место»; مكتبة — «библиотека», а مقهى — «кафе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit09.lesson01.listen.002
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: listen_select
  frame:
