templates:
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.choose.001
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ألم — «боль»; الرأس — «голова», а البطن — «живот», оба с ال.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.listen.002
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندي ألم في الرأس — «У меня болит голова»; часть тела стоит с ال.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.order.003
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: word_order
  frame:
    text: عندي ألم في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'После في («в») часть тела стоит с ال: في الرأس, في البطن.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.fill.004
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: fill_in_blank
  frame:
    text: عندي ألم في {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Голова — الرأس; во фразе говорится «У меня болит голова».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم — существительное со значением «боль», а обе части тела — существительные с ال.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: У меня болит голова.
    language_code: ru
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي («у меня есть») не требует глагола: عندي ألم — «у меня боль».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson01.translate.007
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: У меня болит живот.
    language_code: ru
    direction: ltr
  slots:
    a: *id004
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Часть тела сохраняет ال после في: في البطن.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.choose.001
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحتاج — «мне нужно», مساعدة — «помощь»; у глагола нет отдельного местоимения.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.listen.002
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'اشربي — команда в женском роде: «пей», обращение к женщине.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.match.003
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اشربي и استريحي — команды, обращённые к женщине; أحتاج — «мне нужно»; у المشكلة есть ال, поэтому оно значит «проблема» с определённостью.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.order.004
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: ما {item} يا ليلى؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} يا ليلى؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المشكلة؟ — «В чём проблема?»; يا ليلى — обращение к ней.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.order.005
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: عندي ألم. أحتاج {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم. أحتاج {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'После أحتاج сразу идёт то, что нужно: أحتاج مساعدة.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.order.006
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: يا ليلى {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Окончание ـي указывает на команду, обращённую к женщине: اشربي ماء.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.fill.007
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: اشربي ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Буква و пишется слитно со следующим словом: واستريحي значит «и отдохни».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.fill.008
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: عندي ألم. {item} مساعدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أحتاج — «мне нужно»; приставка أ указывает на «я».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.translate.009
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اشربي и استريحي — команды, обращённые к женщине, с окончанием ـي.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.translate.010
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: Лейла, выпей воды. (женщине)
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Юсуф советует Лейле выпить воды: اشربي — команда в женском роде.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit17.lesson02.translate.011
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: У меня боль. Мне нужна помощь. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: И в عندي, и в أحتاج «я» заложено в самой форме, поэтому أنا не нужно.
    language_code: ru
    direction: ltr
