schema_version: '1.0'
pack_key: practice.ru-ar.a1.unit15
source_language: ru
target_language: ar
unit_content_key: ar.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أكبر
    - w_أصغر
    - w_أقرب
    - w_أرخص
    - w_والسوق
slot_presets:
  l1: &id001
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
  comp4: &id002
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
      - w_أرخص
  l2: &id005
    language_code: ar
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - w_أرخص
      - w_والسوق
      - w_أكبر
      - w_أقرب
  akbar:
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أكبر
  asghar: &id003
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أصغر
  aqrab: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أقرب
  arkhas: &id006
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أرخص
  walsuq: &id007
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_والسوق
templates:
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر, أصغر и أقرب — сравнительные формы; после каждой стоит من («чем»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'У сравнительного прилагательного одна неизменяемая форма, после неё стоит من: أقرب من — «ближе, чем».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Сравнительная форма стоит между двумя сравниваемыми предметами, а перед вторым ставится من («чем»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В арабском не нужен глагол-связка «есть»: المقهى أصغر من السوق буквально — «кафе меньше, чем рынок».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.fill.005
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: fill_in_blank
  frame:
    text: المقهى {item} من السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أصغر — «меньше»; по той же модели образуется أكبر — «больше».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.translate.006
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сравнительные формы в арабском — короткие прилагательные без отдельного слова «более»; после них идёт من.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: Кафе меньше, чем рынок.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Сравнительная форма остаётся неизменной, и после неё стоит من («чем»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: Кафе ближе, чем рынок.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب — «ближе», от значения «близкий»; после него идёт من.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص — «дешевле»; оно образовано по той же модели, что и другие сравнительные формы.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В слове والسوق و («и») пишется слитно с السوق («рынок»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أرخص — «дешевле»: الماء أرخص من القهوة значит «вода дешевле, чем кофе».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Дешевле» образуется по той же модели сравнительной формы, после которой идёт من.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Это четыре сравнительные формы: «больше», «меньше», «ближе» и «дешевле».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: Вода дешевле, чем кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Перед вторым предметом сравнения стоит من: «дешевле, чем кофе».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit15.lesson02.translate.007
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: Кафе ближе, чем рынок, а рынок больше, чем кафе.
    language_code: ru
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Союз و («и») пишется слитно со следующим словом: والسوق.'
    language_code: ru
    direction: ltr
