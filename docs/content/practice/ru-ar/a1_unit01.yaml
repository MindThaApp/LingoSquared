templates:
- content_key: practice.ru-ar.ar.a1.unit01.lesson01.choose.001
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Арабский пишется справа налево, а буквы ر и ا никогда не соединяются со следующей за ними буквой.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson01.match.002
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: مرحبا начинается с буквы م справа, потому что арабский читается справа налево.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson01.translate.003
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Краткие гласные в арабском письме обычно не пишутся; читатель восстанавливает их по слову.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson02.listen.001
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Арабские приветствия зависят от времени суток: صباح الخير утром, مساء الخير — начиная с середины дня.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson02.match.002
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عفوا — стандартный ответ на شكرا, а مع السلامة — повседневное «до свидания».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson02.order.003
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: word_order
  frame:
    text: شكرا، مع {item}!
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}!
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مع السلامة буквально значит «с безопасностью»; ال — это определённый артикль, который пишется слитно с существительным.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson02.translate.004
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: translation
  frame:
    text: Спасибо, до свидания.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Определённый артикль ال присоединяется к началу существительного: سلامة («безопасность») превращается в السلامة.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson03.choose.001
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Многие приветствия идут парами: приветствие и привычный ответ на него, например صباح الخير и صباح النور.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson03.order.002
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: word_order
  frame:
    text: أهلا وسهلا! أهلا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أهلا وسهلا! أهلا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بك значит «тебе»; на письме форма одинакова для мужчины и женщины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson03.fill.003
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: fill_in_blank
  frame:
    text: تصبح على {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تصبح على خير буквально желает, чтобы ты проснулся к благу; так говорят, расставаясь на ночь.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson03.translate.004
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ال в словах النور и اللقاء — арабский определённый артикль, который пишется слитно с существительным.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson03.translate.005
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: Спокойной ночи! (мужчине)
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: تصبح على {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Обращаясь к женщине, глагол принимает окончание ـين: تصبحين على خير.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson04.choose.001
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ممتاز — форма мужского рода; женщина говорит ممتازة.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson04.match.002
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الحمد لله буквально значит «хвала Богу» и очень часто используется как ответ на «как дела?».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson04.order.003
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: word_order
  frame:
    text: بخير، {item} لله.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: بخير، {item} لله.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: После الحمد идёт لله — слитная форма предлога ل («для») и слова الله («Бог»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson04.fill.004
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: fill_in_blank
  frame:
    text: كيف {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: حال значит «состояние», а окончание ـك — «твой», так что вопрос буквально звучит как «каково твоё состояние».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson04.translate.005
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وأنت — это و («и»), написанное слитно с أنت («ты»): «и ты».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit01.lesson04.translate.006
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: Как дела? (мужчине)
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: كيف {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Написанное слово حالك одинаково для мужчины и женщины; в речи различается только краткая гласная в конце.
    language_code: ru
    direction: ltr
