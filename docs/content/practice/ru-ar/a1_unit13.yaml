templates:
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.choose.001
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ذهبت — «я ходил(а)», а اشتريت — «я купил(а)»; оба глагола стоят в прошедшем времени, в 1-м лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.listen.002
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أمس означает «вчера»; с ним используются глаголы прошедшего времени.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.match.003
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Окончание прошедшего времени -ت обозначает «я» (ذهبت, اشتريت, شربت); فعلت — «ты сделал(а)» из вопроса урока.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.order.004
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: word_order
  frame:
    text: ذهبت إلى السوق {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ذهبت إلى السوق {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أمس («вчера») обычно стоит в конце предложения: Я вчера ходил(а) на рынок.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.fill.005
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: fill_in_blank
  frame:
    text: ذهبت إلى السوق ثم اشتريت {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفاحا — «яблоки» как то, что купили, поэтому слово оканчивается на алиф.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.translate.006
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ذهبت — «я ходил(а)»; اشتريت — «я купил(а)»; تفاحا — «яблоки» как то, что купили.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.translate.007
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: Я вчера ходил(а) на рынок. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} إلى السوق {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Окончание прошедшего времени -ت уже означает «я», поэтому местоимение не нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson01.translate.008
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: Я купил(а) яблоки. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    a: *id006
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'То, что купили, получает окончание с алифом: تفاحا.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.choose.001
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: فعلت — «ты сделал(а)», как в вопросе ماذا فعلت أمس؟ — «Что ты делал(а) вчера?»
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.listen.002
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: شربت — «я выпил(а)»; сравни ذهبت, которое оканчивается на то же -ت.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.match.003
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Одно и то же окончание -ت обозначает прошедшее время в ذهبت, اشتريت и شربت; فعلت («ты сделал(а)») встречается в вопросе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.order.004
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: word_order
  frame:
    text: ماذا {item} أمس؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} أمس؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ماذا плюс глагол в прошедшем времени спрашивает «что ты сделал(а)»; أمس относит действие ко «вчера».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.fill.005
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: fill_in_blank
  frame:
    text: ذهبت إلى السوق. اشتريت تفاحا. {item} قهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شربت — «я выпил(а)»; окончание прошедшего времени -ت означает «я».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.fill.006
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: fill_in_blank
  frame:
    text: ماذا {item} أمس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: فعلت — прошедшее время от «делать»; вопрос спрашивает, что ты делал(а) вчера.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.translate.007
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: فعلت («ты сделал(а)») и شربت («я выпил(а)») — глаголы прошедшего времени с окончанием -ت.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.translate.008
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: 'Юсуф спрашивает Лейлу: Что ты делала вчера?'
    language_code: ru
    direction: ltr
  slots:
    a: *id008
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت — форма «ты» в прошедшем времени; на письме она одинакова для мужчины и для женщины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit13.lesson02.translate.009
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: Я выпил(а) кофе. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} قهوة'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В прошедшем времени «я» выражается окончанием -ت: شربت — «я выпил(а)».'
    language_code: ru
    direction: ltr
