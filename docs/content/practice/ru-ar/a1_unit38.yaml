- content_key: practice.ru-ar.ar.a1.unit38.lesson03.order.002
  lesson_content_key: ar.a1.unit38.lesson03.wrdy_wbnfsjy
  type: word_order
  frame:
    text: كلمة اللون {item}، فنقول أريد اللون الوردي.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكرة
  answer_derivation:
    kind: render_frame
    frame:
      text: كلمة اللون {item}، فنقول أريد اللون الوردي.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Слово «цвет» мужского рода, поэтому и название цвета после него тоже мужского рода: «Я хочу розовый». أريد (urīd) значит «я хочу» или «мне бы хотелось». Сравни: الورود وردية («розы розовые») — множественное число неодушевлённых предметов берёт прилагательное в женском роде единственного числа.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit38.lesson03.fill.003
  lesson_content_key: ar.a1.unit38.lesson03.wrdy_wbnfsjy
  type: fill_in_blank
  frame:
    text: أريد اللون {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_الوردي
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_الوردي
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я хочу розовый. الوردي означает «розовый» (м. р.).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit38.lesson05.order.002
