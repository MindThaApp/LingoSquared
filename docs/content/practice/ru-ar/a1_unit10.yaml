    - verb
    - particle
    agreement_tags:
      semantic:
      - w_يسار
      - w_الأمام
      - w_اليمين
      - w_امش
      - w_ثم
  dirs: &id003
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_الأمام
      - w_اليمين
      - w_اليسار
  sides: &id006
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_اليمين
      - w_اليسار
  amam: &id004
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_الأمام
  yamin: &id005
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_اليمين
  yasar: &id009
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_اليسار
  imshi: &id008
    language_code: ar
    part_of_speech: verb
    agreement_tags:
      semantic: w_امش
  thumma: &id007
    language_code: ar
    part_of_speech: particle
