templates:
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يمين — существительное «право», а اليسار — «лево» с присоединённым ال; артикль ال делает слово определённым: «левая сторона».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.listen.002
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام означает «перёд», а إلى الأمام — «прямо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
    text: امش إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'إلى («к», «в сторону») ставится перед направлением, которое берёт ال: الأمام, اليمين или اليسار.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.fill.004
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: امش إلى {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: إلى الأمام — обычный способ сказать «прямо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.translate.005
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يمين — «право» (направление), противоположность يسار.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.translate.006
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: Иди прямо. (мужчине)
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: امش — команда, обращённая к мужчине; إلى الأمام означает «вперёд».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson01.translate.007
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: Иди направо. (мужчине)
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Направление после إلى берёт ال: اليمين — «право».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit10.lesson02.choose.001
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
