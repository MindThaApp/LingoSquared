  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: امش — команда «иди», обращённая к мужчине; ثم означает «потом».
    language_code: ru
    direction: ltr
