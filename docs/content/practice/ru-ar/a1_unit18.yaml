templates:
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.choose.001
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مهندس — это инженер (мужской род); для женского рода добавляется ة.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.listen.002
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أعمل في مكتب значит «я работаю в офисе»; أعمل — глагол в первом лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.match.003
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عمل — существительное «работа», а أعمل — глагол «я работаю»; أكتب и أقرأ тоже глаголы в первом лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.order.004
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: word_order
  frame:
    text: أنا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В арабском нет слова для «есть/являюсь»: أنا مهندس буквально «я инженер».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.order.005
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: word_order
  frame:
    text: أعمل في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: После في («в») стоит название места; مكتب — это офис.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.fill.006
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: fill_in_blank
  frame:
    text: أعمل في {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أعمل في مكتب значит «я работаю в офисе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.fill.007
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: fill_in_blank
  frame:
    text: ما {item} يا يوسف؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Окончание ـك означает «твой»: عملك — «твоя работа».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.translate.008
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В слове عملك есть окончание ـك («твой»); أعمل — глагол в первом лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.translate.009
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: Я инженер. (говорит мужчина)
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Мужчина говорит مهندس; глагол «являюсь» не нужен.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson01.translate.010
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: Я работаю в офисе. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعمل уже значит «я работаю», поэтому أنا не нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.choose.001
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكتب — «я пишу», а أقرأ — «я читаю»; оба глагола стоят в первом лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.listen.002
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В слове العمل есть ال, поэтому это «работа» с определённостью; في العمل значит «на работе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.order.003
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أنا {item} في العمل.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} في العمل.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Местоимение أنا («я») с этими глаголами необязательно: они и так значат «я пишу» и «я читаю».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.order.004
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أكتب وأقرأ في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب وأقرأ في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في العمل значит «на работе»; ال — часть слова العمل.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.fill.005
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: fill_in_blank
  frame:
    text: أكتب {item} في العمل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Буква و присоединяется к глаголу: وأقرأ значит «и я читаю».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.translate.006
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أكتب и أقرأ — глаголы в первом лице; العمل — «работа» с ال.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.translate.007
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: Я пишу на работе. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في вместе с العمل значит «на работе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit18.lesson02.translate.008
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: Я читаю на работе. (отдельного слова «я» нет)
    language_code: ru
    direction: ltr
  slots:
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أقرأ في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Сначала идёт глагол, потом في и место.
    language_code: ru
    direction: ltr
