templates:
- content_key: practice.ru-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Каждое числительное читается справа налево; ثلاثة начинается с буквы ث — это межзубный звук «th».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ثلاثة («три») и ثمانية («восемь») начинаются с ث — межзубного звука «th»; отличить эти слова помогает остальная часть слова.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Слово ثلاثة («три») оканчивается на ة — это окончание есть и у многих других арабских существительных.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В арабском есть особое окончание двойственного числа ـان для обозначения двух предметов; само слово «два» — اثنان.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Числительные от трёх до десяти при счёте оканчиваются на ة, например ثلاثة и خمسة.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'سبعة («семь») и تسعة («девять») оканчиваются на одни и те же буквы عة, поэтому слушай первый звук: «с» или «т».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: word_order
  frame:
    text: رقمي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'رقمي означает «мой номер»: رقم — «номер», а окончание ـي — «мой».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: fill_in_blank
  frame:
    text: ثمانية، تسعة، {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عشرة — «десять»; как и все числительные от трёх до десяти, оно оканчивается на ة.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson02.translate.004
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ستة («шесть») и سبعة («семь») начинаются с буквы س; отличить их помогают конечные буквы.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson03.choose.001
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كم спрашивает «сколько», а هذا указывает на то, что находится рядом с тобой.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson03.match.002
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بخمسة и بعشرة начинаются с ب — здесь она означает «за» или «по цене».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson03.fill.003
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم هذا спрашивает о цене одного предмета; هذا («этот», «это») — форма мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson03.translate.004
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وهذا — это و («и»), соединённое с هذا («это»): «а это».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson03.translate.005
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: Сколько это стоит?
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В этом вопросе в арабском нет глагола-связки: كم هذا буквально значит «сколько это».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit03.lesson03.translate.006
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: Это стоит пять.
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Предлог ب пишется слитно с числительным: ب + خمسة даёт بخمسة.'
    language_code: ru
    direction: ltr
