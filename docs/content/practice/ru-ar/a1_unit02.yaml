templates:
- content_key: practice.ru-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В арабском принадлежность выражается окончанием: اسم — «имя», اسمي — «моё имя», اسمك — «твоё имя».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson01.match.002
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Окончание ـي значит «мой» (اسمي), а ـك — «твой» (اسمك); на письме «твой» одинаково для мужчины и женщины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson01.fill.003
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما значит «что», поэтому ما اسمك буквально значит «что твоё имя».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson01.translate.004
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'أنا («я») употребляется в простых предложениях вроде أنا سارة без глагола «быть» — как и в русском: «Я Сара».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson01.translate.005
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: Меня зовут {item}.
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Имена пишутся так, как звучат: в арабском нет заглавных букв.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson02.choose.001
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Названия стран вроде لبنان и مصر употребляются без артикля, а в названиях الأردن, المغرب и العراق ال входит в состав названия.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson02.match.002
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Артикль ال входит в состав названий الأردن, المغرب и العراق.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson02.order.003
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: word_order
  frame:
    text: أنا من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من значит «из», поэтому أنا من плюс место говорит, откуда ты.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: fill_in_blank
  frame:
    text: من {item} أنت؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين — вопросительное слово «где»; من أين أنت спрашивает, откуда ты, и мужчину, и женщину.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson02.translate.005
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Слово أنت значит «ты»; без огласовок оно пишется одинаково для мужчины и женщины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: Я из {item}.
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В арабском нет слова для «являюсь»: أنا من плюс место уже значит «я из».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson03.listen.001
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Вопрос, на который отвечают «да» или «нет», начинается с هل, а ответ «да» — نعم.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson03.order.002
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: word_order
  frame:
    text: سعدت {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: سعدت بلقائك — вежливая заключительная фраза, буквально «я был рад встрече с тобой».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson03.fill.003
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: fill_in_blank
  frame:
    text: هل أنت من مصر؟ {item}، أنا من مصر. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نعم — «да»; в ответе вопросительное слово не нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson03.translate.004
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: translation
  frame:
    text: Мне было приятно с тобой познакомиться.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Окончание ـك в بلقائك на письме одинаково для мужчины и женщины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson04.choose.001
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'دائما значит «всегда» и может стоять после مرحبا بك: «добро пожаловать в любое время».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson04.fill.002
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: fill_in_blank
  frame:
    text: مرحبا بك {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Фраза مرحبا بك دائما значит «тебе всегда рады».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit02.lesson04.translate.003
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سعدت — глагол прошедшего времени с окончанием ـت для «я», поэтому значит «я был рад».
    language_code: ru
    direction: ltr
