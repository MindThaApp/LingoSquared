templates:
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.choose.001
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'أستيقظ, أدرس и أنام — глаголы настоящего времени в 1-м лице: я просыпаюсь, я учусь, я сплю.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.listen.002
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'كل يوم означает «каждый день»: كل («каждый») + يوم («день»).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.match.003
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: كل يوم означает «каждый день»; ماذا — вопросительное слово «что».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.match.004
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Часы обозначаются порядковыми числительными женского рода, согласованными с الساعة: السابعة — «седьмая».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.order.005
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أنا {item} كل يوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} كل يوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Глаголы урока стоят в 1-м лице: أستيقظ, أدرس и أنام; أنا («я») можно не говорить.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.order.006
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أستيقظ في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Час ставится после الساعة и стоит в женском роде: الساعة السابعة.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.fill.007
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: fill_in_blank
  frame:
    text: أدرس في الساعة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: التاسعة — «девятая», в женском роде, как и الساعة.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.translate.008
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Это глаголы и порядковые числительные женского рода для часов; все глаголы стоят в 1-м лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.translate.009
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Я просыпаюсь в семь часов. (отдельного слова для «я» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Час выражается порядковым числительным женского рода, потому что الساعة — женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.translate.010
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Я учусь в девять часов. (отдельного слова для «я» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Глаголам в 1-м лице местоимение не нужно: одно أدرس уже значит «я учусь».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson01.translate.011
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Я сплю в десять часов. (отдельного слова для «я» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: أنام في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: العاشرة — «десятая», и оно оканчивается на ة, как и другие часы в женском роде.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson02.listen.001
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماذا — вопросительное слово «что»; ماذا تفعل؟ значит «что ты делаешь?».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson02.choose.002
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفعل — форма «ты» мужского рода от глагола «делать»; ماذا تفعل كل يوم؟ — вопрос мужчине, что он делает каждый день.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson02.order.003
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: word_order
  frame:
    text: ماذا {item} كل يوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} كل يوم؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Глагол стоит сразу после ماذا: ماذا تفعل؟ — «что ты делаешь?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson02.fill.004
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: fill_in_blank
  frame:
    text: ماذا تفعل كل {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'كل يوم означает «каждый день»: يوم («день») стоит после كل («каждый»).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson02.translate.005
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تفعل — форма «ты» мужского рода: «ты делаешь». ماذا — «что».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit11.lesson02.translate.006
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: Что ты делаешь каждый день? (мужчине)
    language_code: ru
    direction: ltr
  slots:
    a: *id013
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b} كل يوم'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Сначала идёт вопросительное слово, потом глагол: ماذا تفعل.'
    language_code: ru
    direction: ltr
