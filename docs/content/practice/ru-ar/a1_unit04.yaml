templates:
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.choose.001
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اليوم буквально означает «день» с артиклем ال в начале; так по-арабски говорят «сегодня».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.match.002
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: matching_pairs
