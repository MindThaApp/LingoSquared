    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Названия месяцев مايو и يونيو соответствуют международным названиям «май» и «июнь».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.order.003
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: word_order
  frame:
    text: اليوم الخامس من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم الخامس من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: В арабских датах сначала называется день, затем من («из») и месяц.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.fill.004
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: fill_in_blank
  frame:
    text: ما {item} اليوم؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟ — обычный способ спросить, какое сегодня число.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.translate.005
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Названия месяцев пишутся одним словом: مايو — «май», يونيو — «июнь».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.translate.006
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: Какое сегодня число?
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: В вопросе о дате используются ما («что», «какой»), تاريخ («дата») и اليوم («сегодня»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Порядковые числительные вроде الخامس («пятый») принимают ال и здесь стоят в мужском роде, потому что относятся к يوم («день») — существительному мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.match.002
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: في означает «в» или «на» и пишется отдельным словом, в отличие от ب, которая присоединяется к следующему слову.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.order.003
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: اليوم {item} من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {item} من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Порядковые числительные принимают ال: الخامس — «пятый», السادس — «шестой».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.fill.004
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: fill_in_blank
  frame:
    text: اليوم الخامس من {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Месяц стоит после من, поэтому اليوم الخامس من يونيو означает «сегодня пятое июня».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.order.005
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: الدرس {item} الخامس من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {item} الخامس من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في перед датой означает «в этот день»: في الخامس من مايو.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.translate.006
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Слова после في ведут себя как любое существительное: في الدرس означает «на уроке», а ال делает слово определённым.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.translate.007
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Сегодня пятое мая.
    language_code: ru
    direction: ltr
  slots:
    a: *id009
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: «Пятый» — это الخامس, а «шестой» — السادس; оба слова мужского рода, потому что относятся к يوم («день»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.translate.008
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Сегодня шестое июня.
    language_code: ru
    direction: ltr
  slots:
    a: *id011
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: «Шестой» — السادس; оно образуется, как и другие порядковые числительные, с ال в начале.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson01.listen.007
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'У месяцев есть собственные названия, а день и месяц соединяются словом من («из»): الخامس من مايو.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.choose.009
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في перед датой означает «в этот день», а ال отмечает порядковое числительное: «пятый» или «шестой».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit04.lesson02.translate.010
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Урок пятого мая.
    language_code: ru
    direction: ltr
  slots:
    f: *id008
    d: *id009
    m: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {f} {d} من {m}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В дате урока перед порядковым числительным стоит في («в, на»): الدرس في الخامس من مايو.'
    language_code: ru
    direction: ltr
