schema_version: '1.0'
pack_key: practice.ru-ar.a1.unit35
source_language: ru
target_language: ar
unit_content_key: ar.a1.unit35.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أيام
    - w_البريد
    - w_الطابع
    - w_الطرد
    - w_تشتري
    - w_تصل
    - w_تكتب
    - w_جدها
    - w_جدي
    - w_طابعا
    - w_طردا
    - w_فنقول
    - w_لجدها
    - w_لجدي
    - w_للرسالة
    - w_مؤنثة
    - w_مذكر
    - w_نمشي
    - w_وأكتب
    - w_والرسالة
    - w_وجدتها
    - w_وجدتي
    - w_وطردا
    - w_يستغرق
    - w_يصل
    - w_يكتب
templates:
- content_key: practice.ru-ar.ar.a1.unit35.lesson01.choose.001
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: &id001
      language_code: ar
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_لجدي
        - w_الطرد
        - w_طردا
        - w_وطردا
        - w_جدي
        - w_وجدتي
        - w_الطابع
        - w_طابعا
        - w_للرسالة
        - w_يكتب
        - w_وأكتب
        - w_يصل
        - w_مذكر
        - w_فنقول
        - w_والرسالة
        - w_مؤنثة
        - w_تصل
        - w_يستغرق
        - w_أيام
        - w_لجدها
        - w_وجدتها
        - w_تشتري
        - w_البريد
        - w_تكتب
        - w_جدها
        - w_نمشي
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о письме и посылке.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson02.listen.001
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о марке, адресе и письме.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson03.translate.001
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о прибытии и времени в пути.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson05.match.001
  lesson_content_key: ar.a1.unit35.lesson05.lyla_trsl_trda
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое арабское слово с его русским значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson06.choose.001
