  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о письме и посылке.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson01.order.003
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: word_order
  frame:
    text: عندي رسالة {item}.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_لجدي
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي رسالة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: У меня письмо для дедушки. لجدي значит «для моего дедушки».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson01.fill.004
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
