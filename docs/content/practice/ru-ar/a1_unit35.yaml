    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الطرد
    hint:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الطرد
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я пишу адрес на посылке. الطرد значит «посылка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson01.translate.005
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: translation
  frame:
    text: Я отправляю посылку в Бейрут.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_طردا
  answer_derivation:
    kind: render_frame
    frame:
      text: أرسل {item} إلى بيروت.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Я отправляю посылку в Бейрут. طردا значит «посылка» (то, что отправляют).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson02.order.002
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: word_order
  frame:
    text: أشتري {item} للرسالة.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_طابعا
  answer_derivation:
    kind: render_frame
    frame:
      text: أشتري {item} للرسالة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Я покупаю марку для письма. طابعا значит «марка» (то, что покупают).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson02.fill.003
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: fill_in_blank
  frame:
    text: أشتري طابعا {item} العنوان على الطرد. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_وأكتب
    hint:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_وأكتب
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
