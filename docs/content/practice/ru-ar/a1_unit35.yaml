    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson03.order.002
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: word_order
  frame:
    text: الطرد {item} غدا.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_يصل
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد {item} غدا.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Посылка приходит завтра. يصل значит «он приходит; оно прибывает» (м. р.).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Слово «посылка» в арабском мужского рода, поэтому говорим يصل (yaṣil). Слово «письмо» женского рода, поэтому говорим تصل (taṣil). Глагол в настоящем времени начинается с ي при подлежащем мужского рода и с ت при подлежащем женского рода: الطرد يصل (aṭ-ṭard yaṣil) и الرسالة تصل.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson03.translate.004
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: Посылка придёт завтра, а письмо идёт три дня.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Посылка приходит завтра, а письмо идёт три дня. والرسالة значит «а письмо» / «и письмо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit35.lesson05.order.002
  lesson_content_key: ar.a1.unit35.lesson05.lyla_trsl_trda
  type: word_order
  frame:
    text: ليلى ترسل طردا إلى جدها {item}.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_وجدتها
  answer_derivation:
    kind: render_frame
    frame:
      text: ليلى ترسل طردا إلى جدها {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Лейла отправляет посылку дедушке и бабушке. وجدتها значит «и её бабушка».
    language_code: ru
    direction: ltr
