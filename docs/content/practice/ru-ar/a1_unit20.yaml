    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هيا приглашает сделать что-то вместе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.translate.007
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
