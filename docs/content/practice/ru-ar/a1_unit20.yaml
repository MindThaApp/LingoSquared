      direction: rtl
  feedback_frame:
    text: 'После هيا («давайте») идёт глагол в форме «мы»: نشرب — «мы пьём».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.order.004
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: word_order
  frame:
    text: الجو {item} اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم.
