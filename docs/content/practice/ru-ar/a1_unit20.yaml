templates:
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.choose.001
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو — это погода; مشمس значит «солнечный», а بارد — «холодный».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.listen.002
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو مشمس اليوم значит «сегодня солнечно»; مشمس описывает الجو.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.match.003
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الجو («погода») — существительное; مشمس, بارد и حار — прилагательные, которые её описывают.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.order.004
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: word_order
  frame:
    text: الجو {item} اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Прилагательное стоит сразу после الجو, без слова «есть»: الجو بارد значит «холодно».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.fill.005
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: fill_in_blank
  frame:
    text: الجو {item} اليوم. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بارد значит «холодный» и стоит в мужском роде, потому что согласуется с الجو.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.fill.006
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: fill_in_blank
  frame:
    text: كيف {item} اليوم؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كيف الجو اليوم؟ значит «какая сегодня погода?»
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.translate.007
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У الجو есть ال, и оно значит «погода»; остальные два слова её описывают.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.translate.008
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: translation
  frame:
    text: Сегодня солнечно.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Прилагательное стоит после существительного: الجو مشمس.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson01.translate.009
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: translation
  frame:
    text: Сегодня холодно.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بارد — это «холодный», и слово «есть» (глагол-связка) не нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.choose.001
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: حار — «жаркий»; это слово описывает الجو, которое мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.listen.002
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: listen_select
  frame:
