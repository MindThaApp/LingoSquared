  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هيا — частица со значением «давайте», نشرب — глагол в форме «мы», حار — прилагательное.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.translate.008
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: translation
  frame:
