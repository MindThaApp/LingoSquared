      direction: rtl
  feedback_frame:
    text: حار — «жаркий»; это слово стоит после существительного, которое оно описывает.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.fill.005
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: fill_in_blank
  frame:
