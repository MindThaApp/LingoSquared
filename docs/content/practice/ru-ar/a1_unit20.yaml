    slot: item
  feedback_frame:
    text: هيا نشرب ماء — «давай выпьем воды»; نشرب — форма «мы» глагола «пить».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit20.lesson02.order.003
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: word_order
  frame:
    text: هيا {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: هيا {item} ماء.
