      direction: rtl
  feedback_frame:
    text: كم المبلغ؟ — вопрос «сколько составляет сумма?»
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit24.lesson02.order.004
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: word_order
  frame:
    text: هل {item} الدفع بالبطاقة؟
    language_code: ar
    direction: rtl
  slots:
