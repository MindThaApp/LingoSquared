      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أستطيع — «я могу»; отдельное слово для «я» не нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit24.lesson02.translate.007
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У المبلغ и الدفع есть ال, это существительные; أستطيع — «я могу».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit24.lesson02.translate.008
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: translation
  frame:
    text: Сколько составляет сумма?
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'В арабском нет слова «есть/составляет»: كم المبلغ؟ буквально «сколько сумма?»'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit24.lesson02.translate.009
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: translation
  frame:
    text: Можно заплатить картой? (отдельного слова для «я» нет)
    language_code: ru
    direction: ltr
  slots:
    a: *id010
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: هل أستطيع {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Модель такая: هل + «я могу» + существительное «оплата».'
    language_code: ru
    direction: ltr
