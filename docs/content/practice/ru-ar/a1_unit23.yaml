    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أعد и تكلم — просьбы, обращённые к мужчине; أسمعك — «я тебя слышу»; ببطء — наречие.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit23.lesson01.order.004
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: word_order
  frame:
    text: لا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا перед глаголом отрицает его: لا أسمعك — «я тебя не слышу».'
    language_code: ru
    direction: ltr
