templates:
- content_key: practice.ru-ar.ar.a1.unit23.lesson01.choose.001
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أعد — повелительная форма для мужчины, «повтори»; تكلم — «говори».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit23.lesson01.listen.002
