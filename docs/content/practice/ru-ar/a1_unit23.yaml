    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: لا أسمعك — «я тебя не слышу»; в أسمعك уже заключено «тебя».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ar.ar.a1.unit23.lesson01.match.003
