    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ملابس — «одежда», قميص — «рубашка», أزرق — «синий» (мужской род).
    language_code: ru
    direction: ltr
