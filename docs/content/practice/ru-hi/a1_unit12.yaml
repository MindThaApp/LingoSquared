templates:
- content_key: practice.ru-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'था и थी заменяют है в прошедшем времени и согласуются с подлежащим: दिन अच्छा था, फ़िल्म अच्छी थी.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा согласуется с существительным мужского рода दिन; с существительным женского рода будет कैसी.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी стоит в женском роде, потому что दुकान женского рода, и थी согласуется с ним.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी — прошедшее время глагола «быть» в женском роде, оно согласуется с существительным женского рода फ़िल्म.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Фильм был хороший.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म женского рода, поэтому и прилагательное, и прошедшее время глагола «быть» стоят в женском роде.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Чайная лавка была очень хорошей.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की связывает चाय с существительным женского рода दुकान, а अच्छी и थी согласуются с ним.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Формы прошедшего времени глаголов जाना и मिलना оканчиваются на -आ у мужчины и на -ई у женщины: गया или गई, मिला или मिली.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से здесь означает «с»: प्रिया से मिला — «встретился с Прией», а окончание зависит от говорящего.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Окончание -ई показывает, что говорящий — женщина.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прошедшее время от मिलना согласуется с говорящим, поэтому женщина говорит मिली.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Я пошла домой. (говорит женщина)
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Женщина говорит गई, а мужчина сказал бы गया.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Я встретилась с Прией. (говорит женщина)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से после имени того, с кем встретились, означает «с»; окончание глагола зависит от говорящего.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Прошедшее время глагола согласуется с тем, кто действует: мужчина говорит मिला, а женщина — मिली.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले употребляется с हम, तुम и वे: हम मिले — «мы встретились».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: С हम форма прошедшего времени оканчивается на -ए, как и во множественном числе мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: Мы встретились.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: С हम используется форма множественного числа मिले, кто бы ни был в группе.
    language_code: ru
    direction: ltr
