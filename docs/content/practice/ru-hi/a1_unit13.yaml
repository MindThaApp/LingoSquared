templates:
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पसंद है буквально значит «приятно, нравится»: मुझे चाय पसंद है — «мне нравится чай»; здесь используется मुझे, а не मैं.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'है ставится при одном предмете, а हैं — при нескольких: किताब पसंद है, किताबें पसंद हैं.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: В хинди нет артиклей, а то, что нравится, стоит между मुझे и पसंद.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Здесь глагол — हैं, потому что किताबें стоит во множественном числе: पसंद है превращается в पसंद हैं.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद — не глагол в хинди, а слово, которое употребляется с है, поэтому предложение строится как «мне чай нравится».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Если нравится что-то во множественном числе, после पसंद ставится हैं.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Мне нравится музыка.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Тот, кому нравится, стоит на месте मुझे, а музыка — это то, что нравится.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Мне нравятся книги.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें стоит во множественном числе, поэтому глагол — हैं, а не है.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Единственное число किताब и множественное किताबें различаются только окончанием -ें, которое у этого существительного женского рода показывает множественное число.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल значит и «спорт», и «игра», а ज़्यादा значит «больше»: मुझे चाय ज़्यादा पसंद है — «мне чай нравится больше».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह («этот») стоит прямо перед существительным, на которое указывает, как в यह खेल.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा стоит перед पसंद и показывает, что из двух вещей нравится больше.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Мне нравится этот вид спорта.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है согласуется с тем, что нравится (один вид спорта), а не с тем, кому нравится.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Мне больше нравится чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Буквально на хинди говорится «чай мне приятнее», а ज़्यादा стоит прямо перед पसंद.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल («спорт» или «игра») — существительное мужского рода, а ज़्यादा («больше») никогда не изменяется.
    language_code: ru
    direction: ltr
