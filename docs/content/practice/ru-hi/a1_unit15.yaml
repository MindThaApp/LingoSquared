templates:
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.choose.001
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाना — начальная форма глагола «идти, ехать», а मुझे ... जाना है значит «мне нужно идти / ехать».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.listen.002
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: टिकट, ट्रेन и प्लेटफ़ॉर्म — английские слова, которые используются в повседневном хинди.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.order.003
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे स्टेशन {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे स्टेशन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... जाना है выражает необходимость и, как и चाहिए, не меняется в зависимости от рода говорящего.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.order.004
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे दिल्ली का {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे दिल्ली का {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: का связывает दिल्ली с существительным мужского рода टिकट, как в «билет Дели».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.order.005
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: यह दिल्ली की {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह दिल्ली की {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की стоит в женском роде, потому что ट्रेन женского рода, поэтому в этом предложении используется की, а не का.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.fill.006
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: fill_in_blank
  frame:
    text: मेरा {item} कहाँ है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मेरा в мужском роде, потому что टिकट мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.fill.007
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: fill_in_blank
  frame:
    text: मुझे स्टेशन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Начальная форма जाना («идти, ехать») вместе с है говорит о том, что что-то нужно сделать.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.translate.008
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: translation
  frame:
    text: Мне нужно на вокзал.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे स्टेशन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Буквально на хинди говорится «мне идти есть», поэтому род говорящего никогда не меняет глагол.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.translate.009
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: translation
  frame:
    text: Мне нужен билет до Дели. (отдельного слова для «один» нет)
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे दिल्ली का {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: На хинди говорят «билет Дели», где का согласуется с существительным мужского рода टिकट.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson01.translate.010
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: translation
  frame:
    text: Это поезд на Дели.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह दिल्ली की {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की согласуется с ट्रेन — существительным женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson02.choose.001
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: प्लेटफ़ॉर्म — английское слово «платформа», используемое в хинди; оно мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson02.order.002
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: word_order
  frame:
    text: ट्रेन {item} नंबर तीन से जाती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ट्रेन {item} नंबर तीन से जाती है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नंबर стоит после प्लेटफ़ॉर्म, а से указывает место, откуда отправляется поезд.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson02.fill.003
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: fill_in_blank
  frame:
    text: यह {item} बड़ा है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прилагательное — बड़ा, потому что प्लेटफ़ॉर्म мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson02.translate.004
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: translation
  frame:
    text: Поезд отправляется с платформы номер три.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ट्रेन {item} नंबर तीन से जाती है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से указывает место, откуда отправляется поезд, а जाती согласуется с ट्रेन женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson03.listen.001
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'हमें — форма от हम, соответствующая मुझे: मुझे значит «мне», а हमें — «нам».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson03.order.002
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: word_order
  frame:
    text: प्रिया, {item} स्टेशन जाना है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, {item} स्टेशन जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Начало с имени — это обращение к человеку; затем हमें говорит, что идти нужно им обоим.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson03.fill.003
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: fill_in_blank
  frame:
    text: प्रिया, {item} स्टेशन जाना है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: हमें играет ту же роль, что и मुझे, когда речь о нескольких людях.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit15.lesson03.translate.004
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: translation
  frame:
    text: Рия, нам нужно на вокзал.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, {item} स्टेशन जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हमें работает как मुझे, поэтому जाना है остаётся без изменений.
    language_code: ru
    direction: ltr
