templates:
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.choose.001
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'जाओ, मुड़ो и गिनो — это неформальные команды: они оканчиваются на -ो и употребляются с तुम.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.listen.002
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाएँ и दाएँ — наречия направления, поэтому они не меняются по роду и числу.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.match.003
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Направление в хинди указывают наречием и глаголом: सीधे जाओ буквально «прямо иди», а बाएँ मुड़ो — «налево поверни».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.order.004
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: यहाँ से {item} जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से после यहाँ означает «от, из»: यहाँ से — «отсюда».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.order.005
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: फिर {item} मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'В хинди направление стоит перед глаголом: बाएँ मुड़ो буквально «налево поверни».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.fill.006
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: fill_in_blank
  frame:
    text: यहाँ से सीधे {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाओ — неформальная форма команды от जाना; в вежливой речи окончание было бы другим.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.translate.007
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: Иди отсюда прямо. (неформально)
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: जाओ — команда уровня तुम; глагол стоит в конце, после направления.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson01.translate.008
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: Потом поверни направо. (неформально)
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुड़ो — неформальная форма команды от मुड़ना, «поворачивать».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson02.choose.001
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तक означает «до», как в предложении बैंक तक सीधे जाओ — «иди прямо до банка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson02.order.002
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: बैंक {item} सीधे जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} सीधे जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तक показывает конечную точку движения и стоит сразу после названия места.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson02.order.003
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले и फिर означают «сначала» и «потом», поэтому порядок шагов совпадает с порядком слов.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson02.fill.004
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: fill_in_blank
  frame:
    text: स्कूल कैसे {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाऊँ — форма «мне пойти?» от जाना, поэтому स्कूल कैसे जाऊँ? значит «как мне добраться до школы?».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson02.translate.005
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: Как мне пройти к банку?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक कैसे {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'जाऊँ употребляется, когда просят совета о собственном действии: как мне идти?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson02.translate.006
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: Отсюда сначала иди прямо, потом поверни налево. (неформально)
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले — «сначала», फिर — «потом»; обе команды оканчиваются на -ो, потому что используются с तुम.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson03.choose.001
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पर после названия места означает «на, у»: नुक्कड़ पर — «на углу».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson03.order.002
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: word_order
  frame:
    text: फिर बैंक के {item} पर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के связывает बैंक с углом, а पर указывает, что поворот происходит на этом углу.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit09.lesson03.translate.003
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: translation
  frame:
    text: Потом поверни налево на углу у банка. (неформально)
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: В хинди сначала называют ориентир (बैंक के नुक्कड़ पर), затем направление, затем глагол.
    language_code: ru
    direction: ltr
