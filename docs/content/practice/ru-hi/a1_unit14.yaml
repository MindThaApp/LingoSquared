  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: लंबा и लंबी — мужская и женская формы одного прилагательного, как बड़ा и बड़ी.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit14.lesson01.listen.002
