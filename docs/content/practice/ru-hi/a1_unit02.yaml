templates:
- content_key: practice.ru-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Числительные в хинди неправильные, их нужно учить по одному: например, छह — это шесть, а सात — семь.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Числительные в хинди от одиннадцати до девяноста девяти образуются неправильно, поэтому каждое из них, например पंद्रह (пятнадцать) или पचास (пятьдесят), нужно учить отдельно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Существительные хинди, такие как नंबर, फ़ोन и कीमत, употребляются без артиклей, а цена это или какая-то конкретная цена, понятно из контекста.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी означает «его/её/этого» и согласуется с существительным женского рода कीमत, поэтому оканчивается на -ी, а не на -ा.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'В хинди число стоит перед тем, что считают, а глагол है остаётся в конце: इसकी कीमत पचास रुपये है.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Сколько это стоит?
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'В вопросе хинди сохраняет порядок слов повествовательного предложения: इसकी कीमत पचास रुपये है — это ответ на вопрос इसकी कीमत क्या है?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Притяжательные слова согласуются с предметом обладания: в आपका फ़ोन नंबर стоит форма мужского рода आपका, а в आपकी उम्र — форма женского рода आपकी.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Возраст называют числом साल (лет) с है; буквально: «Мой возраст — тридцать лет».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका — вежливое «ваш»; здесь оно мужского рода, потому что नंबर мужского рода. С тем, кому говорят «ты», сказали бы तुम्हारा.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (год) после числительного не меняется во множественном числе: तीस साल — тридцать лет.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Мне {n} лет.
    language_code: ru
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र — существительное женского рода, поэтому притяжательное слово будет मेरी, а не मेरा.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Какой у вас номер телефона?
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Номер телефона в хинди читают по одной цифре, например छह दो आठ तीन पाँच.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: После числа больше одного деньги считают с формой множественного числа रुपये; форма единственного числа — रुपया.
    language_code: ru
    direction: ltr
