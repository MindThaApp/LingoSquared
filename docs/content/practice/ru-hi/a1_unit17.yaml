templates:
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक — учитель-мужчина, шिक्षिका — учительница; इंजीनियर используется для обоих полов.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У некоторых хинди-названий профессий есть отдельная женская форма, как в паре शिक्षक и शिक्षिका, а у заимствований вроде इंजीनियर её нет.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Слово «учитель» меняется в зависимости от пола говорящего: शिक्षक для мужчины, शिक्षिका для женщины.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया — женщина, поэтому она शिक्षिका.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शिक्षिका образует женский род с помощью -इका — это модель, которая встречается в нескольких словах, заимствованных из санскрита.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.fill.006
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: अर्जुन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इंजीनियर — одно и то же слово и для мужчины, и для женщины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Я учитель. (говорит женщина)
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Женщина говорит шिक्षिका, а мужчина сказал бы शिक्षक.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Я учитель. (говорит мужчина)
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Мужчина говорит शिक्षक, а женщина сказала бы शिक्षिका.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson01.translate.009
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Я инженер.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर не меняется по роду, а слова, соответствующего артиклю, в хинди нет.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दफ़्तर — существительное мужского рода со значением «офис», а में после него значит «в офисе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में после названия места значит «в», а место стоит перед глаголом.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson02.fill.003
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: fill_in_blank
  frame:
    text: अर्जुन {item} में काम करता है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: काम करना значит «работать», а после места работы ставится में.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson02.translate.004
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Я работаю в офисе. (говорит мужчина)
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: В хинди нет артикля, а место стоит перед काम करता हूँ.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson02.translate.005
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Арджун работает в офисе.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: С именем глагол оканчивается на है, а не на हूँ, а -ता показывает, что Арджун — мужчина.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते в предложении तुम रोज़ दफ़्तर जाते हो — это форма на -ते, которая употребляется с तुम, когда обращаются к мужчине.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: С तुम глагол оканчивается на -ते, и за ним следует हो, когда обращаются к мужчине.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson03.fill.003
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: fill_in_blank
  frame:
    text: तुम रोज़ दफ़्तर {item} हो? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вопрос с ответом «да/нет» может начинаться с необязательного क्या, но достаточно одной повышающейся интонации.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit17.lesson03.translate.004
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: translation
  frame:
    text: Ты каждый день ходишь в офис. (неформально, обращаясь к мужчине)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: С तुम глагол оканчивается на -ते, и за ним следует हो — это форма для мужчины.
    language_code: ru
    direction: ltr
