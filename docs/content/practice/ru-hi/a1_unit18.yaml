- content_key: practice.ru-hi.hi.a1.unit18.lesson01.choose.001
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमरा — одна комната, а कमरे — несколько комнат; बाथरूम и बेडरूम — заимствования из английского, а रसोई — хинди-слово для кухни.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit18.lesson01.listen.002
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Существительное мужского рода на -ा во множественном числе получает окончание -े: कमरा, कमरे.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit18.lesson01.order.003
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: word_order
  frame:
