    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: घर में एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'एक — это число «один», и оно же заменяет неопределённый артикль других языков; в русском его обычно просто нет: घर में एक रसोई है.'
    language_code: ru
    direction: ltr
