templates:
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.choose.001
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Все эти слова, обозначающие места, мужского рода, поэтому согласуемые с ними глаголы и прилагательные принимают форму на -ा.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.listen.002
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: यहाँ и वहाँ — наречия, поэтому они никогда не изменяются по роду и числу.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.order.003
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: मैं {item} में हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में после названия места означает «в», а हूँ употребляется с मैं.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.order.004
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: बैंक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Глагол है обычно стоит в конце, после слова места: बैंक वहाँ है — буквально «банк там есть».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.fill.005
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: fill_in_blank
  frame:
    text: स्कूल {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: यहाँ — «здесь», близко к говорящему, а वहाँ — «там», вдали от говорящего.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.translate.006
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: Банк там.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: В хинди нет артиклей, поэтому बैंक может означать и «банк», и «этот банк».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson01.translate.007
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В хинди для названий мест много заимствований из английского, например स्कूल, बैंक, पार्क и स्टेशन.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.choose.001
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'После पास, सामने и पीछे ставится के, а перед ним — место отсчёта: बैंक के पास — «рядом с банком».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.match.002
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Слова места в хинди образуют пары противоположностей: यहाँ и वहाँ, पास и दूर, सामने и पीछे.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.order.003
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: word_order
  frame:
    text: स्कूल बैंक के {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल बैंक के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'के связывает место отсчёта со словами पास, सामने или पीछे; в русском эту роль играют предлог и падеж: «напротив парка».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.fill.004
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: पार्क स्कूल के {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पीछे и सामने — противоположности, поэтому одни и те же два места можно описать с любой стороны.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.fill.005
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: स्टेशन {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'दूर может стоять один (स्टेशन दूर है), а с местом отсчёта требует से, а не के: बैंक से दूर.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.translate.006
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: Школа напротив парка.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल पार्क के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के после места отсчёта связывает его со словом सामने — «напротив».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson02.translate.007
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: Банк рядом со школой.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक स्कूल के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Здесь पास значит «рядом»; в मेरे पास оно значит «у меня есть» — одно слово с двумя употреблениями.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson03.listen.001
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तो в конструкции हाँ, तो ... вводит вывод, а थोड़ा означает «немного».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson03.order.002
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: word_order
  frame:
    text: यह {item} बैंक के पास है।
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: डाकघर — сложное слово из डाक («почта») и घर («дом»), буквально «почтовый дом».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson03.fill.003
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: fill_in_blank
  frame:
    text: हाँ, {item} दूर है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थोड़ा перед прилагательным или наречием смягчает его, как русское «немного».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit08.lesson03.translate.004
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: translation
  frame:
    text: Да, почта рядом с банком.
    language_code: ru
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: हाँ, {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Сначала идёт место отсчёта बैंक, затем के पास, затем है.
    language_code: ru
    direction: ltr
