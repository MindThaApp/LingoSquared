templates:
- content_key: practice.ru-hi.hi.a1.unit06.lesson01.choose.001
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खाना — существительное мужского рода со значением «еда» или «трапеза»; चाय и कॉफ़ी — женского рода, а पानी и जूस — мужского.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson01.listen.002
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В хинди у существительных есть род, даже у напитков: पानी и जूस — мужского рода, चाय и कॉफ़ी — женского.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson01.fill.003
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: fill_in_blank
  frame:
    text: आपको क्या {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: चाहिए не меняется в зависимости от пола говорящего (в отличие от चाहता и चाहती), и после него не ставится है.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson01.translate.004
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: Что ты хочешь? (неформально)
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें क्या {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: С आप тот же вопрос звучит आपको क्या चाहिए?; меняется только слово «ты/вы».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson01.translate.005
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: Я хочу чай, спасибо.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए, शुक्रिया।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए буквально значит «мне ... нужно», поэтому желаемое стоит между этими двумя словами.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson01.translate.006
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В хинди нет артиклей, поэтому खाना может значить «еда» или «трапеза» в зависимости от ситуации.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.choose.001
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रोटी, दाल и सब्ज़ी — существительные женского рода, а चावल (рис) — мужского.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.match.002
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'В хинди сначала идёт ёмкость, а слова «из» нет: एक गिलास पानी буквально «один стакан вода».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.order.003
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: मुझे एक प्लेट {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक प्लेट {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'В хинди нет слова «из» в выражении «порция риса»: сначала идёт ёмкость, затем еда.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.order.004
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: यह {item} बहुत स्वादिष्ट है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: स्वादिष्ट не меняется для мужского и женского рода, в отличие от अच्छा и अच्छी.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.fill.005
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: नहीं, {item}, शुक्रिया। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'नहीं, बस вежливо отказывает от добавки еды или напитка: нет, достаточно.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.fill.006
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: मुझे कॉफ़ी चाहिए, {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया — вежливое слово «пожалуйста», оно может стоять в конце просьбы.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.translate.007
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: Я хочу стакан воды.
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक {item} पानी चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Слово меры, такое как गिलास, стоит прямо перед измеряемым, слова «из» нет.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson02.translate.008
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: Этот дал очень вкусный.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दाल женского рода, но स्वादिष्ट одинаково для женского и мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson03.choose.001
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: या соединяет два варианта, как в तुम्हें चाय चाहिए या कॉफ़ी?, а खाते हैं после चलो выражает предложение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson03.fill.002
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: fill_in_blank
  frame:
    text: तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В вопросе या предлагает выбор из двух вещей, как русское «или».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit06.lesson03.translate.003
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: translation
  frame:
    text: Давай что-нибудь поедим!
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «चलो» плюс глагол во множественном числе на -ते с हैं — обычный способ сделать предложение «давай…».
    language_code: ru
    direction: ltr
