templates:
- content_key: practice.ru-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В хинди два слова для «ты/вы»: आप — вежливое и уважительное, а तुम — неформальное, его используют с друзьями и с людьми своего возраста или младше.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Глагол «быть» меняется в зависимости от подлежащего: हूँ идёт с मैं, हो — с तुम, а हैं — с आप.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Вопросительное слово согласуется с тем, кого спрашивают: कैसे — для мужчины, а कैसी — для женщины, при этом आप всегда сочетается с हैं.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Как ты? (неформально, вопрос мужчине)
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'С तुम глагол имеет форму हो; если ты спрашиваешь женщину, कैसे меняется на कैसी: तुम कैसी हो?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Как у вас дела? (вежливо, вопрос к женщине)
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Вежливое आप требует формы हैं, похожей на множественное число, даже когда речь об одном человеке; कैसी — женский род слова «какой/как».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा — это прощание; в повседневной речи नमस्ते подходит и как приветствие, и как прощание.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे превращает фразу в пожелание («пусть остаётся хорошим»), а आपका показывает, что это сказано на вежливое आप; с तुम было бы तुम्हारा.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'В хинди нет артиклей: नाम может значить «имя» или «название» — смысл зависит от предложения.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В хинди вопрос сохраняет порядок слов утверждения: вопросительное слово कहाँ стоит на месте ответа (आप कहाँ से हैं? и मैं भारत से हूँ).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: В хинди глагол стоит в конце, поэтому मेरा नाम ... है буквально значит «Моё имя ... есть».
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से стоит после названия места и значит «из»; это послелог, а не предлог.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Это вежливое «Приятно познакомиться», буквально «радость случилась при встрече с вами»; неформальный вариант — तुमसे मिलकर अच्छा लगा.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम — существительное мужского рода, поэтому все, и мужчины, и женщины, говорят मेरा नाम.
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Женщина тоже говорит मैं भारत से हूँ: глагол हूँ не меняется в зависимости от пола говорящего.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Откуда ты?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Чтобы задать тот же вопрос вежливо, используй आप с हैं: आप कहाँ से हैं?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Существительные в хинди бывают мужского и женского рода: दिन, नाम и योग — мужского, खुशी — женского.'
    language_code: ru
    direction: ltr
