schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit34
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit34.neighbourhood
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_давно
    - w_дружелюбный
    - w_здоровается
    - w_здороваться
    - w_здороваюсь
    - w_знает
    - w_знать
    - w_знают
    - w_район
    - w_сосед
    - w_соседа
    - w_супермаркет
    - w_хорошем
templates:
- content_key: practice.ko-ru.ru.a1.unit34.lesson01.choose.001
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_район
        - w_хорошем
        - w_супермаркет
        - w_сосед
        - w_соседа
        - w_знать
        - w_дружелюбный
        - w_здороваться
        - w_здороваюсь
        - w_давно
        - w_здоровается
        - w_знает
        - w_знают
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 동네에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson02.listen.001
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 남녀 이웃에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson03.translate.001
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 친절함과 인사에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson04.match.001
  lesson_content_key: ru.a1.unit34.lesson04.nastya_znakomitsya_s_pavlom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson05.choose.001
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 동네에 누가 있는지에 관한 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson01.translate.002
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 동네에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson01.order.003
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: word_order
  frame:
    text: Мой {item} рядом с супермаркетом.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_район
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой {item} рядом с супермаркетом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 우리 동네는 슈퍼마켓 근처에 있어요. район은 '동네'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson01.fill.004
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: fill_in_blank
  frame:
    text: Я живу в {item} районе в Казани. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 카잔의 좋은 동네에 살아요. хорошем은 '좋은'이라는 뜻이에요(남성형, '~에'를 뜻하는 말 뒤).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson02.order.002
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: word_order
  frame:
    text: Павел {item} Димы.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_сосед
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел {item} Димы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 파벨은 디마의 (남성) 이웃이에요. сосед는 '이웃'(남성)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson02.fill.003
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: fill_in_blank
  frame:
    text: Моего {item} зовут Павел. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_соседа
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_соседа
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 제 이웃은 이름이 파벨이에요. соседа는 '이웃'(남성, 대격)이라는 뜻이에요. '제 이웃을 ~라고 부른다'와 같은 표현에서 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson03.order.002
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: word_order
  frame:
    text: Павел очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_дружелюбный
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 파벨은 매우 친절해요. дружелюбный는 '친절한'(남성형)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson03.fill.003
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: fill_in_blank
  frame:
    text: Павел дружелюбный, и он любит со мной {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_здороваться
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_здороваться
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 파벨은 친절해서 저에게 인사하기를 좋아해요. здороваться는 '인사하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson03.translate.004
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: 저는 매일 파벨에게 인사해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_здороваюсь
  answer_derivation:
    kind: render_frame
    frame:
      text: Я каждый день {item} с Павлом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 매일 파벨에게 인사해요. здороваюсь는 '저는 인사해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit34.lesson05.order.002
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: word_order
  frame:
    text: Павел и Анна хорошо {item} Диму.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_знают
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел и Анна хорошо {item} Диму.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 파벨과 안나는 디마를 잘 알아요. знают는 '그들은 알아요'라는 뜻이에요.
    language_code: ko
    direction: ltr
