    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько стоит?는 물건 하나의 가격을 물어요. молоко는 단수 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'сто 뒤에는, 5 이상의 모든 숫자 뒤와 마찬가지로, 명사가 복수 생격이에요: рублей.'
    language_code: ko
    direction: ltr
