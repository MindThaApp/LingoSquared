    text: Полкило는 반 킬로를 뜻하며, 한 단어로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson01.translate.005
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: 우유는 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Стоит는 물건이 하나인 молоко에 맞춘 형태이고, 물건이 여러 개이면 러시아어는 стоят을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: 빵은 100루블이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сто 앞에는 "한"에 해당하는 단어가 필요 없고, 뒤의 명사는 рублей예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дайте는 "주세요"를 뜻하는 정중한 вы 명령형이고, ты에는 дай를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.order.002
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: word_order
  frame:
    text: Дайте {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Килограмм과 полкило는 둘 다 물건의 양을 나타내며 дайте 바로 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.fill.003
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте одну {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: дайте 뒤에서 여성 명사 штука는 요청하는 대상을 나타내는 형태인 штуку가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.fill.004
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте пять {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'пять 이상의 숫자 뒤에서 명사는 복수 생격이에요: пять штук.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.translate.005
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: 반 킬로 주세요. (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дайте полкило, пожалуйста은 판매원에게 반 킬로를 달라고 할 때 쓰는 정중한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.translate.006
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: 다섯 개 주세요. (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Штука는 숫자 5 뒤에서 штук로 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson02.translate.007
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Штука는 물건을 하나하나 세고, килограмм과 полкило는 무게로 세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson03.listen.001
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Помидоры, огурцы, апельсины는 복수형이고, картофель와 капуста는 각각 감자와 양배추를 뜻하는 단수형 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...?는 어떤 명사와도 쓸 수 있고, 판매원에게 물건이 있는지 물을 때 흔히 쓰는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: кило 같은 양을 나타내는 말 뒤에서 물건은 복수 생격이 되므로 яблоки는 яблок가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: 토마토 1킬로그램 주세요. (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: килограмм 뒤에서 물건은 복수 생격이 되므로 помидоры는 помидоров가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: 양배추 있어요? (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Капуста는 러시아어에서 단수이고, 관사에 해당하는 단어를 붙이지 않아요.
    language_code: ko
    direction: ltr
