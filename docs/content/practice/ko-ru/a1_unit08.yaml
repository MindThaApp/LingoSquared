- content_key: practice.ko-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто와 двести는 100과 200이고, 그 뒤의 명사는 복수 생격이에요: сто рублей, двести рублей.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit08.lesson01.order.002
