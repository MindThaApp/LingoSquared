  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_пользоваться
        - w_пользуюсь
        - w_телефоном
        - w_компьютер
        - w_пользуется
        - w_компьютером
        - w_интернет
        - w_приложение
        - w_прогноза
        - w_погоды
        - w_отправлю
        - w_отправлять
        - w_отправляет
        - w_читает
        - w_искать
        - w_ищу
        - w_ищет
        - w_поищу
        - w_солнечно
        - w_вижу
        - w_уже
        - w_знаешь
        - w_назвать
        - w_звонит
        - w_каждое
        - w_пользуешься
        - w_побегаю
        - w_поиграю
        - w_поплаваю
        - w_приду
        - w_парк
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 휴대폰, 컴퓨터, 인터넷 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson02.listen.001
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 앱과 메시지 보내기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson03.translate.001
  lesson_content_key: ru.a1.unit30.lesson03.ishchem_chto_to
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 무언가를 찾아보는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson04.match.001
  lesson_content_key: ru.a1.unit30.lesson04.nastya_otpravlyaet_soobshchenie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson05.choose.001
  lesson_content_key: ru.a1.unit30.lesson05.kto_chem_polzuetsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''누가 무엇을 쓸까요?'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson06.translate.001
  lesson_content_key: ru.a1.unit30.lesson06.do_subboty_v_parke
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, ''토요일에 공원에서 봐요!'' 수업에 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson01.order.002
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: word_order
  frame:
    text: Я {item} телефоном.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пользуюсь
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} телефоном.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 휴대폰을 사용해요. пользуюсь는 '사용해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson01.fill.003
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: fill_in_blank
  frame:
    text: Я каждый день пользуюсь {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_телефоном
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_телефоном
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '저는 매일 휴대폰을 사용해요. Каждый день(매일)가 다시 쓰였어요: Я каждый день пользуюсь телефоном. пользоваться 뒤에는 사용하는 대상이 조격으로 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson01.translate.004
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: translation
  frame:
    text: 나스탸는 컴퓨터를 사용해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пользуется
  answer_derivation:
    kind: render_frame
    frame:
      text: Настя {item} компьютером.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 나스탸는 컴퓨터를 사용해요. пользуется는 '(그/그녀가) 사용해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson02.order.002
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
