    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_солнечно
  answer_derivation:
    kind: render_frame
    frame:
      text: В субботу {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '토요일에는 해가 쨍쨍해요! Солнечно는 날씨를 나타내는 말이에요. ''be''에 해당하는 동사는 필요 없어요: В субботу солнечно.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson05.order.002
