    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_каждое
  answer_derivation:
    kind: render_frame
    frame:
      text: Игорь {item} утро ищет прогноз погоды.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 이고르는 매일 아침 일기예보를 찾아봐요. каждое는 '매~'라는 뜻이에요(중성형).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit30.lesson06.order.002
  lesson_content_key: ru.a1.unit30.lesson06.do_subboty_v_parke
  type: word_order
  frame:
