schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit30
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit30.technology
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вижу
    - w_звонит
    - w_знаешь
    - w_интернет
    - w_искать
    - w_ищет
    - w_ищу
    - w_каждое
    - w_компьютер
    - w_компьютером
    - w_назвать
    - w_отправлю
    - w_отправляет
    - w_отправлять
    - w_парк
    - w_побегаю
    - w_погоды
    - w_поиграю
    - w_поищу
    - w_пользоваться
    - w_пользуется
    - w_пользуешься
    - w_пользуюсь
    - w_поплаваю
    - w_приду
    - w_приложение
    - w_прогноза
    - w_солнечно
    - w_телефоном
    - w_уже
    - w_читает
