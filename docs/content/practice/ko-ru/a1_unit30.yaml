    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_поплаваю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я лучше {item}, но тоже приду в парк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 차라리 수영할래요, 하지만 공원에도 갈 거예요. Я лучше поплаваю는 '저는 차라리 수영할래요'라는 뜻이에요. 동사 앞의 Лучше는 선호를 나타내요.
