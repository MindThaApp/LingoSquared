  feedback_frame:
    text: Тот와 этот는 남성형이라서 дом과 어울려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit15.lesson02.translate.009
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: '{item}'
