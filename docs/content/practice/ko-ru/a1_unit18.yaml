    - fifth
    - sixth
  feedback_frame:
    text: 방과 가구는 러시아어에서 관사 없이 명사만으로 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson01.order.003
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: word_order
  frame:
