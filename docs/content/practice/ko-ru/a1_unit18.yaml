- content_key: practice.ko-ru.ru.a1.unit18.lesson01.choose.001
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
