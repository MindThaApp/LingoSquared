    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На에 전치격 어미 -е가 붙으면 사물이 있는 장소를 나타내요. на кухне은 "부엌에"예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson01.fill.004
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: fill_in_blank
  frame:
    text: Это моя {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартира는 여성 명사이므로 моя를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson01.fill.005
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: fill_in_blank
  frame:
    text: В {item} кровать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: в 뒤에서는 명사에 전치격 어미 -е가 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson01.translate.006
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: 이건 우리 집(아파트)이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Моя는 여성 명사 квартира와 맞아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson01.translate.007
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: 부엌에 탁자가 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} есть стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '"~이 있다"는 есть예요. 러시아어는 장소를 먼저 말하고 새로운 대상을 뒤에 둬요. кухня에는 в가 아니라 на를 써서 на кухне이라고 해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson02.choose.001
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Гостиная와 ванная는 명사처럼 쓰는 여성 형용사라서 -ая로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson02.order.002
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: word_order
  frame:
    text: Диван в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиная는 в 뒤에서 гостиной이 되어 "거실에"라는 뜻이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson02.fill.003
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: fill_in_blank
  frame:
    text: Это {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ванная는 명사처럼 쓰는 여성 형용사라서 기본형은 -ая로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson02.translate.004
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: 소파는 거실에 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: В와 гостиной가 합쳐져 "거실에"라는 뜻이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson02.translate.005
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: 여기는 욕실이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это는 사물을 소개할 때 써요. Это ванная.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson03.choose.001
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Живу는 жить("살다")의 я 형태이고, живёшь는 ты 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson03.order.002
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: word_order
  frame:
    text: Я {item} в квартире.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живу는 жить의 я("나") 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson03.fill.003
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: fill_in_blank
  frame:
    text: Сколько комнат в {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: в 뒤에서 квартира는 квартире가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson03.translate.004
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: 어디에 살아? (친근한 말투)
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Где ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ты는 친근한 말투의 질문임을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson03.translate.005
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: 아파트에 살아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я живу는 жить의 "나" 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit18.lesson03.translate.006
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: 방이 두 개 있어요.
    language_code: ko
    direction: ltr
  slots:
    a: *id013
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: две("둘") 뒤에서 명사는 комнаты 형태가 돼요.
    language_code: ko
    direction: ltr
