templates:
- content_key: practice.ko-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 키릴 문자는 라틴 문자와 비슷해 보여도 소리가 다른 경우가 많아요. р은 R, в는 V, у는 "우", й는 짧은 "이" 소리예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 헷갈리기 쉬운 키릴 문자가 있어요. р은 P처럼 보이지만 R 소리이고, е는 E처럼 보이지만 단어 첫머리에서는 "예"로 발음해요. здравствуйте에는 둘 다 들어 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 러시아어는 키릴 문자로 써요. 처음 배우는 단어 здравствуйте에는 з, д, р, а, в, с, т, у, й, е가 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: 안녕하세요! (격식, 한 단어)
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте는 낯선 사람이나 여러 사람에게 하는 격식 있는 인사예요. 첫 번째 в는 소리 나지 않아서 "즈드라스트부이테"처럼 들려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 러시아어 인사말은 시간대에 따라 달라져요. доброе утро(아침), добрый день(낮), добрый вечер(저녁)예요. Утро는 중성이고 день과 вечер는 남성이라서 형용사 어미가 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Привет는 친구와 가족에게 쓰는 편한 인사예요. 낯선 사람에게는 здравствуйте나 시간대별 인사말을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Добрый는 день, вечер처럼 남성 명사와 함께 쓰고, 중성 명사 утро에는 доброе를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
    text: Доброе {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Утро는 중성 명사라서 인사말에 добрый가 아니라 доброе를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 러시아어에는 영어의 관사 같은 말이 없어요. 그래서 한 단어로 답할 때는 утро나 завтра처럼 단어만 쓰면 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Привет는 편한 인사이고, здравствуйте는 낯선 사람에게 쓰는 격식 있는 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как дела?는 친구(ты) 사이에서 흔히 쓰는 일상적인 질문이에요. Как поживаете?는 вы 형태로 끝나서 더 격식 있게 들려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Пока는 편한 작별 인사이고, до свидания는 중립적이거나 격식 있는 작별 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дела?는 직역하면 "일이 어떻게 되어 가요?"라는 뜻이에요. Привет 다음에 친구 사이에서 편하게 묻는 질문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поживаете는 -ете로 끝나는 вы 형태라서 격식 있는 здравствуйте와 어울려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.fill.005
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: Хорошо, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хорошо, спасибо는 Как дела?에 하는 기본적인 대답이고, "잘 지내요"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До는 "~까지"라는 뜻이라서 До завтра!는 "내일 봐요"라는 일상적인 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.translate.007
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: 좋아요, 고마워요.
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хорошо, спасибо는 Как дела?에 하는 공손한 기본 대답이고, ты와 вы 모두에게 쓸 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit01.lesson03.translate.008
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: 내일 봐요.
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: До {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До завтра!는 "~까지"를 뜻하는 до와 "내일"을 뜻하는 завтра를 쓴 표현이에요.
    language_code: ko
    direction: ltr
