    - w_езжу
    - w_живёт
    - w_иду
    - w_идут
    - w_машина
    - w_недалеко
    - w_незнакомым
    - w_обычно
    - w_поедем
    - w_поеду
    - w_поезде
    - w_пойду
    - w_покупаю
    - w_предложном
    - w_предпочитает
    - w_предпочитаю
    - w_работу
    - w_транспорт
    - w_ходит
    - w_ходить
    - w_центр
    - w_человеком
