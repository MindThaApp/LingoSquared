    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit29.lesson05.choose.001
  lesson_content_key: ru.a1.unit29.lesson05.kto_kak_ezdit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
