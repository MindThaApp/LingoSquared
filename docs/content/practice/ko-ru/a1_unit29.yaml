    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '사람마다 다르게 이동한다는 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit29.lesson03.translate.001
  lesson_content_key: ru.a1.unit29.lesson03.pokupaem_bilet
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 표 사기 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
