        - w_машина
        - w_ходить
        - w_ходит
        - w_ездить
        - w_езжу
        - w_ездишь
        - w_транспорт
        - w_предложном
        - w_покупаю
        - w_вокзале
        - w_незнакомым
        - w_человеком
        - w_центр
        - w_добираешься
        - w_обычно
