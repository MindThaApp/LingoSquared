templates:
- content_key: practice.ko-ru.ru.a1.unit12.lesson01.choose.001
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давай는 친구 사이(ты)에서 함께 할 일을 제안하는 말이에요. вы에게는 давайте라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson01.order.002
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: word_order
  frame:
    text: Давай пойдём в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кино는 어미가 절대 바뀌지 않아서 в 뒤에서도 кино 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson01.fill.003
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: fill_in_blank
  frame:
    text: Давай {item} в кино. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давай와 пойдём을 함께 쓰면 "같이 가자"라는 제안이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson01.translate.004
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: 내일 영화 보러 가자. (친한 사이)
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай {item} в кино завтра.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай пойдём은 ты를 쓰는 친근한 초대로, "같이 가자"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson01.translate.005
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: 토요일에 영화 보러 가자. (친한 사이)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в кино в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 요일에 "~에"라고 말할 때 러시아어는 в + 대격을 써요. суббота는 субботу가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson01.translate.006
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кино는 형태가 바뀌지 않고, давай는 친한 사이에서 쓰는 "~하자"예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson02.choose.001
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Согласен은 말하는 사람이 남자라서 자음으로 끝나요. 여자는 согласна라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson02.fill.002
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: К {item}, я не могу. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: К сожалению는 "아쉽지만"에 해당하는 표준적인 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson02.fill.003
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: Во сколько мы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Встретимся는 "우리" 형태라서 мы와 함께 써요: мы встретимся.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson02.order.004
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: word_order
  frame:
    text: К сожалению, я не {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: К сожалению, я не {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не는 동사를 부정하고, могу는 я에 쓰는 형태로 "할 수 있다"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson02.translate.005
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: 좋아요, 동의해요. (남자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Согласен은 남성형이에요. 여자는 согласна라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson02.translate.006
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: 몇 시에 만날까요?
    language_code: ko
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во сколько는 직역하면 "얼마에"를 묻는 말로, "몇 시에"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson03.listen.001
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 러시아 이름에는 Настя, Дима처럼 짧고 친근한 형태가 있어서 친구 사이에서 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson03.order.002
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: word_order
  frame:
    text: Давай в семь часов, у {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У는 "~ 곁에, ~ 앞에"라는 뜻이고 생격을 취해요. кинотеатр는 кинотеатра가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson03.fill.003
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: fill_in_blank
  frame:
    text: Отлично, до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До는 "~까지"라는 뜻이고 생격을 취해요. 그래서 суббота는 субботы가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson03.translate.004
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: 좋아요, 토요일에 봐요.
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Отлично, до {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До субботы는 직역하면 "토요일까지"이고, 그때 보자는 친근한 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson03.translate.005
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: 7시에 영화관 앞에서 보자. (친한 사이)
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай в семь часов는 시간을 제안하고, у кинотеатра는 장소를 더해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit12.lesson03.translate.006
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отлично는 "훌륭해요"라는 뜻의 부사라서 성이나 수에 따라 바뀌지 않아요.
    language_code: ko
    direction: ltr
