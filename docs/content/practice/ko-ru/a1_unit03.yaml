templates:
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '러시아어 명사는 숫자 뒤에서 형태가 바뀌어요: один рубль, два рубля, пять рублей.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 2, 3, 4 뒤에서는 명사가 특별한 형태가 되고(два брата, три рубля), 5부터는 복수 생격형을 써요(пять рублей).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 2~4 뒤에서는 명사가 한 방식으로 바뀌고(брат → брата), 5 이상 뒤에서는 다른 방식으로 바뀌어요(книга → книг).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два, три, четыре는 모두 같은 명사 형태 брата를 취하므로 어느 것이든 여기에 들어갈 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'пять와 그보다 큰 모든 숫자 뒤에서는 명사가 복수 생격형이에요: рубль가 아니라 рублей.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: 저는 형제가 둘 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата는 직역하면 "나에게 형제 둘이 있다"예요. брата는 2, 3, 4 뒤에 쓰는 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 먼저 세는 말(один, два, три, четыре, пять)을 익히세요. 그 뒤의 명사는 один рубль, два рубля, пять рублей처럼 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '5부터 10까지의 숫자 뒤에는 모두 복수 생격 명사가 와요: пять книг, девять книг, десять книг.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 5~10 뒤에서는 명사가 복수 생격형이 되어서 книга가 книг로 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 러시아어에서는 나이를 мне(직역하면 "나에게")로 말하고, 5 이상 뒤에서는 명사가 лет이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 5 이상의 숫자 뒤에서 나이를 말할 때는 복수 생격형 лет를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: 저는 열 살이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 나이는 мне("나에게") + 숫자 + лет로 나타내요. 동사는 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: 연세가 어떻게 되세요?
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет?는 존댓말 вам(직역하면 "당신에게")을 써요. "당신에게 몇 년이에요?"라고 묻는 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 러시아어는 물건 하나에는 Сколько стоит?, 여러 개에는 Сколько стоят?라고 해요. 동사가 사는 물건에 맞춰져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит?는 어디에나 쓸 수 있는 "얼마예요?" 질문이에요. стоит는 물건 하나일 때의 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки는 복수이므로 동사는 стоят예요. 물건 하나(хлеб)라면 стоит가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: 빵은 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб는 물건 하나이므로 동사는 стоит예요. 복수 яблоки와 함께라면 стоят가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: 3루블이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: три 뒤에서는 명사가 2~4 형태 рубля가 되며, 5 이상 뒤의 рублей와 달라요.
    language_code: ko
    direction: ltr
