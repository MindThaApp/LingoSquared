  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу는 "저는 원하지 않아요"라는 뜻이에요. не는 동사 바로 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
