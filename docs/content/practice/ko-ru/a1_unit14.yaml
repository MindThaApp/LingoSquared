    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе는 친한 사이에 쓰는 ты의 형태로 "너에게"라는 뜻이고, 높임말인 вы의 형태는 вам이에요.
    language_code: ko
    direction: ltr
