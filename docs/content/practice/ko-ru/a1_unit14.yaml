    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: 네, 저는 커피를 좋아해요. 너는요? (친한 사이)
