  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе?는 친한 사이에 쓰는 ты로 질문을 상대에게 되돌려요.
    language_code: ko
    direction: ltr
