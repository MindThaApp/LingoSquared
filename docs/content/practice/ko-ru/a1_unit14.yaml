  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу는 "저는 원해요"라는 뜻의 я хочу를 부정해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson02.order.003
