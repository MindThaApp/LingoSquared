templates:
- content_key: practice.ko-ru.ru.a1.unit14.lesson01.choose.001
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Нравится는 좋아함을 나타내는 동사예요. Мне нравится кофе는 글자 그대로 "커피가 나에게 마음에 든다"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне нравится кофе에서 좋아하는 대상이 문법상 주어이고, мне는 그것을 좋아하는 사람이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 좋아한다고 말할 때는 "나에게"라는 뜻의 мне와 함께 нравится를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: 저는 커피를 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 러시아어는 "나는 커피를 좋아한다"가 아니라 "나에게 커피가 마음에 든다"라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: 저는 차를 좋아하지 않아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 좋아하지 않는다고 말하려면 нравится 앞에 не를 놓아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
