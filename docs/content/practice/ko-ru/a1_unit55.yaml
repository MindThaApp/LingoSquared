schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit55
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit55.zoo
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_билета
    - w_вольера
    - w_животные
    - w_жираф
    - w_зоопарке
    - w_катере
    - w_кормление
    - w_лев
    - w_львов
    - w_маленькая
    - w_обезьяна
    - w_покатаемся
    - w_прогулки
    - w_слон
    - w_тяжёлый
templates:
- content_key: practice.ko-ru.ru.a1.unit55.lesson01.choose.001
  lesson_content_key: ru.a1.unit55.lesson01.poydyom_v_zoopark
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_животные
        - w_лев
        - w_слон
        - w_тяжёлый
        - w_обезьяна
        - w_маленькая
        - w_жираф
        - w_кормление
        - w_львов
        - w_билета
        - w_вольера
        - w_катере
        - w_прогулки
        - w_зоопарке
        - w_покатаемся
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. ''동물원에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit55.lesson02.listen.001
  lesson_content_key: ru.a1.unit55.lesson02.lev_i_slon
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 사자와 코끼리 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit55.lesson03.translate.001
  lesson_content_key: ru.a1.unit55.lesson03.obezyana_i_zhiraf
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 원숭이와 기린 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit55.lesson04.match.001
  lesson_content_key: ru.a1.unit55.lesson04.tablichka_v_zooparke
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
