    text: 네, 밴드 콘서트 티켓 한 장 주세요. группу — 밴드(на 뒤에 오는 목적격 형태).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson06.order.002
  lesson_content_key: ru.a1.unit51.lesson06.dima_nina_i_nastya
  type: word_order
  frame:
    text: Концерт был {item}.
    language_code: ru
    direction: ltr
