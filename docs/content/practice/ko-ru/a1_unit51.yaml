schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit51
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit51.concert
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_большая
    - w_группа
    - w_группу
    - w_группы
    - w_длится
    - w_длиться
    - w_довольна
    - w_место
    - w_начало
    - w_потрясающий
    - w_публика
    - w_странники
    - w_сцена
    - w_хорошее
templates:
- content_key: practice.ko-ru.ru.a1.unit51.lesson01.choose.001
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_группа
        - w_группы
        - w_место
        - w_хорошее
        - w_длиться
        - w_длится
        - w_группу
        - w_сцена
        - w_большая
        - w_публика
        - w_довольна
        - w_странники
        - w_начало
        - w_потрясающий
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (수업: 콘서트에 가고 싶어요)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson02.listen.001
  lesson_content_key: ru.a1.unit51.lesson02.ya_khochu_kupit_bilet
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 표를 사고 싶어요 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson03.translate.001
  lesson_content_key: ru.a1.unit51.lesson03.vo_skolko_nachinaetsya_kontsert
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (수업: 콘서트는 몇 시에 시작해요?)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson04.match.001
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson05.choose.001
  lesson_content_key: ru.a1.unit51.lesson05.chitaem_programmu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 프로그램 읽기 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson06.translate.001
  lesson_content_key: ru.a1.unit51.lesson06.dima_nina_i_nastya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 콘서트에 간 디마, 니나, 나스탸 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson01.order.002
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: word_order
  frame:
    text: Я хочу пойти на концерт {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группы
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу пойти на концерт {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 밴드 콘서트에 가고 싶어요. группы — 밴드의.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson02.order.002
  lesson_content_key: ru.a1.unit51.lesson02.ya_khochu_kupit_bilet
  type: word_order
  frame:
    text: У меня хорошее {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_место
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня хорошее {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 좋은 자리가 있어요. место — 자리, 장소.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson03.order.002
  lesson_content_key: ru.a1.unit51.lesson03.vo_skolko_nachinaetsya_kontsert
  type: word_order
  frame:
    text: Концерт {item} два часа.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_длится
  answer_derivation:
    kind: render_frame
    frame:
      text: Концерт {item} два часа.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 콘서트는 두 시간 동안 해요. длится — 계속되다, 지속되다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit51.lesson04.order.002
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: word_order
  frame:
    text: Да, мне нужен билет на {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группу
