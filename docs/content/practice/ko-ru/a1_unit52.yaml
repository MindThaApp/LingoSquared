  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 공원에 다녀온 뒤의 디마, 니나, 나스탸 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit52.lesson02.order.002
  lesson_content_key: ru.a1.unit52.lesson02.derevya_i_trava
  type: word_order
  frame:
