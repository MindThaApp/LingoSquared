    frame:
      text: Я вижу большое {item} и зелёную траву.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 큰 나무와 푸른 풀이 보여요. дерево — 나무.
    language_code: ko
    direction: ltr
