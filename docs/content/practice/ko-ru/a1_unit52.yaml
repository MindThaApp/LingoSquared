    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit52.lesson06.translate.001
  lesson_content_key: ru.a1.unit52.lesson06.dima_nina_i_nastya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
