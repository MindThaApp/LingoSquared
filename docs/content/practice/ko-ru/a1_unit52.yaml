schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit52
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit52.park
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_воде
    - w_дерево
    - w_зелёная
    - w_пикник
    - w_плавают
    - w_поводке
    - w_прогулка
    - w_рынке
    - w_скамейка
    - w_собаки
    - w_солнечный
    - w_сядем
    - w_табличка
    - w_трава
    - w_устроим
    - w_утка
    - w_утки
    - w_фрукты
    - w_холодная
templates:
- content_key: practice.ko-ru.ru.a1.unit52.lesson01.choose.001
  lesson_content_key: ru.a1.unit52.lesson01.poydyom_v_park
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_прогулка
        - w_дерево
        - w_трава
        - w_зелёная
        - w_утка
        - w_воде
        - w_холодная
        - w_утки
        - w_плавают
        - w_табличка
        - w_солнечный
        - w_собаки
        - w_поводке
        - w_устроим
        - w_пикник
        - w_фрукты
        - w_сядем
        - w_скамейка
        - w_рынке
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''공원에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit52.lesson02.listen.001
  lesson_content_key: ru.a1.unit52.lesson02.derevya_i_trava
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''나무와 풀'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit52.lesson03.translate.001
