schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit43
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit43.accommodation
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_администратор
    - w_бронь
    - w_были
    - w_включён
    - w_вкусный
    - w_выезд
    - w_двенадцать
    - w_забронирован
    - w_забронировать
    - w_завтрак
    - w_заселиться
    - w_заселяемся
    - w_карточке
    - w_ключ
    - w_красивый
    - w_начинается
    - w_ночей
    - w_ночь
    - w_одна
    - w_одну
    - w_пароль
    - w_прекрасные
    - w_прошли
    - w_следующий
    - w_цену
templates:
- content_key: practice.ko-ru.ru.a1.unit43.lesson01.choose.001
  lesson_content_key: ru.a1.unit43.lesson01.zabronirovat_nomer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_забронировать
        - w_заселиться
        - w_заселяемся
        - w_забронирован
        - w_завтрак
        - w_начинается
        - w_включён
        - w_цену
        - w_ключ
        - w_пароль
        - w_карточке
        - w_администратор
        - w_бронь
        - w_ночей
        - w_одну
        - w_ночь
        - w_двенадцать
        - w_одна
        - w_выезд
        - w_прошли
        - w_красивый
        - w_вкусный
        - w_следующий
        - w_были
        - w_прекрасные
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 객실 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit43.lesson02.listen.001
  lesson_content_key: ru.a1.unit43.lesson02.zavtrak_vklyuchyon_v_tsenu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} : 아침 식사가 포함되어 있나요? 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit43.lesson03.translate.001
  lesson_content_key: ru.a1.unit43.lesson03.klyuch_i_parol_ot
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 열쇠와 와이파이 비밀번호 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit43.lesson04.match.001
  lesson_content_key: ru.a1.unit43.lesson04.zaselenie_u_stoyki
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit43.lesson05.choose.001
  lesson_content_key: ru.a1.unit43.lesson05.chitaem_podtverzhdenie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 확인서 읽기 수업에 나와요.'
    language_code: ko
    direction: ltr
