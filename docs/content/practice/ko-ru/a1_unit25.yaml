- content_key: practice.ko-ru.ru.a1.unit25.lesson02.listen.001
  lesson_content_key: ru.a1.unit25.lesson02.muzyka_risovanie_i_igry
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, 음악, 그림, 게임을 다룬 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson03.translate.001
  lesson_content_key: ru.a1.unit25.lesson03.chto_ty_delaesh_v
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''여가 시간에 뭐 해요?'' 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson04.match.001
  lesson_content_key: ru.a1.unit25.lesson04.nastya_i_dima_govoryat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson05.choose.001
  lesson_content_key: ru.a1.unit25.lesson05.dima_i_nastya_sravnivayut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 디마와 나스탸가 취미를 비교하는 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson06.translate.001
  lesson_content_key: ru.a1.unit25.lesson06.planiruem_vykhodnye_vmeste
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, 주말 계획을 함께 세우는 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson01.order.002
  lesson_content_key: ru.a1.unit25.lesson01.chitat_zanimatsya_sportom_i
  type: word_order
  frame:
    text: Я люблю {item} книгу.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_читать
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю {item} книгу.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 책 읽는 걸 좋아해요. читать는 '읽다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson01.fill.003
  lesson_content_key: ru.a1.unit25.lesson01.chitat_zanimatsya_sportom_i
  type: fill_in_blank
  frame:
    text: Я занимаюсь {item} по субботам. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортом
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортом
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 토요일마다 운동해요. спортом은 '스포츠'라는 뜻이에요(조격이며, '운동하다'라는 동사 뒤에 써요).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson01.translate.004
  lesson_content_key: ru.a1.unit25.lesson01.chitat_zanimatsya_sportom_i
  type: translation
  frame:
    text: 저는 친구들을 위해 요리하는 것을 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_готовить
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю {item} для друзей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 친구들을 위해 요리하는 걸 좋아해요. готовить는 '준비하다, 요리하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson02.order.002
  lesson_content_key: ru.a1.unit25.lesson02.muzyka_risovanie_i_igry
  type: word_order
  frame:
    text: Я люблю {item} музыку.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_слушать
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю {item} музыку.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 음악 듣는 걸 좋아해요. слушать는 '듣다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson02.fill.003
  lesson_content_key: ru.a1.unit25.lesson02.muzyka_risovanie_i_igry
  type: fill_in_blank
  frame:
    text: Я люблю читать и часто слушаю {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_музыку
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_музыку
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '저는 책 읽는 걸 좋아하고 음악도 자주 들어요. 앞에서 배운 취미 동사 두 개를 и(그리고)로 이어요: люблю читать и часто слушаю музыку.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson02.translate.004
  lesson_content_key: ru.a1.unit25.lesson02.muzyka_risovanie_i_igry
  type: translation
  frame:
    text: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_играть
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю {item} в игры с друзьями.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 친구들과 게임하는 걸 좋아해요. играть는 '놀다, 하다(게임·연주 등)'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson03.order.002
  lesson_content_key: ru.a1.unit25.lesson03.chto_ty_delaesh_v
  type: word_order
  frame:
    text: Я {item} занимаюсь спортом по субботам.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_всегда
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} занимаюсь спортом по субботам.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 토요일마다 항상 운동해요. всегда는 '항상'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson03.fill.003
  lesson_content_key: ru.a1.unit25.lesson03.chto_ty_delaesh_v
  type: fill_in_blank
  frame:
    text: Я {item} рисую. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_иногда
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_иногда
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 가끔 그림을 그려요. иногда는 '가끔'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson03.translate.004
  lesson_content_key: ru.a1.unit25.lesson03.chto_ty_delaesh_v
  type: translation
  frame:
    text: 저는 게임을 전혀 안 해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_никогда
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} не играю в игры.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 게임을 전혀 하지 않아요. никогда는 '전혀 ~않다, 한 번도 ~않다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson04.order.002
  lesson_content_key: ru.a1.unit25.lesson04.nastya_i_dima_govoryat
  type: word_order
  frame:
    text: Я люблю читать и часто {item} музыку.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_слушаю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю читать и часто {item} музыку.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '저는 책 읽는 걸 좋아하고 음악도 자주 들어요. 앞에서 배운 취미 동사 두 개를 и(그리고)로 이어요: люблю читать и часто слушаю музыку.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit25.lesson04.fill.003
  lesson_content_key: ru.a1.unit25.lesson04.nastya_i_dima_govoryat
  type: fill_in_blank
  frame:
    text: Ты тоже {item} в игры? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_играешь
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_играешь
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '너도 게임해? 짧은 예/아니요 질문이에요. 러시아어는 어순을 그대로 두고 억양만 올려요: Ты тоже играешь в игры?'
    language_code: ko
    direction: ltr
