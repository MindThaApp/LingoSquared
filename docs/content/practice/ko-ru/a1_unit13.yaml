templates:
- content_key: practice.ko-ru.ru.a1.unit13.lesson01.choose.001
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 러시아어 과거형은 성별에 따라 달라져요. 남자나 남성 주어에는 был, 여자나 여성 주어에는 была를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson01.order.002
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: word_order
  frame:
    text: Вчера она {item} дома.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Она는 여성이라서 과거 동사는 была예요. 남자가 я와 함께 말하면 был를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson01.fill.003
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 남자는 я был, 여자는 я была라고 말해요. 동사는 화자에 맞춰 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson01.fill.004
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера она была {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Дома는 "집에"라는 뜻이고 형태가 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson01.translate.005
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: 어제 저는 집에 있었어요. (남자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 러시아어 과거형은 인칭에 따라 변하지 않고, 동사의 형태가 화자의 성별을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson01.translate.006
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: 어제 그녀는 집에 있었어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Была는 быть(있다, ~이다)의 여성 과거형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson02.choose.001
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '과거형 동사는 남성 주어에는 -л, 여성 주어에는 -ла로 끝나요: ходил, ходила.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson02.match.002
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ходил, смотрел, был는 모두 -л로 끝나고, 여성형은 -ла로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson02.order.003
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: word_order
  frame:
    text: Вчера я {item} в кино.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил은 남성 과거형이라서 이 문장은 남자가 말한 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson02.fill.004
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: fill_in_blank
  frame:
    text: Она {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Она는 여성이라서 과거 동사가 -ла로 끝나요: смотрела.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson02.translate.005
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: 어제 저는 영화관에 갔어요. (남자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил은 ходить의 남성 과거형이고, 여자는 ходила라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson02.translate.006
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: 저는 영화를 봤어요. (여자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} фильм.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Смотрела는 여성 과거형이에요. фильм은 무생물 남성 명사라서 형태가 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson03.choose.001
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: делать의 과거형은 남자는 делал, 여자는 делала예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson03.order.002
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: word_order
  frame:
    text: Что ты {item} вчера?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал?는 ты로 부르는 남자에게 하는 질문이에요. 여자에게는 делала라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson03.fill.003
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я смотрел {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хороший는 фильм에 맞춰 남성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson03.fill.004
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отдыхала는 отдыхать(쉬다)의 여성 과거형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson03.translate.005
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: 어제 뭐 했어요? (친한 사이, 남자에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал вчера?는 ты를 쓰므로 친구에게 하는 말이고, 상대가 남자라서 동사도 남성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit13.lesson03.translate.006
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: 저는 쉬었어요. (여자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отдыхала는 화자가 여자라서 -ла로 끝나요.
    language_code: ko
    direction: ltr
