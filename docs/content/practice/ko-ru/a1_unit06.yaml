templates:
- content_key: practice.ko-ru.ru.a1.unit06.lesson01.choose.001
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мой는 남성 명사(мой отец)와, моя는 여성 명사(моя мать)와 함께 쓰므로, 가족을 나타내는 단어에 따라 소유 표현이 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson01.match.002
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: У меня есть는 직역하면 "나에게 있다"인데, 러시아어에서 "저는 ...이 있어요"를 말하는 방식이에요. мой와 моя는 둘 다 "나의"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мать는 여성 명사라서 моя와 함께 쓰고, 남성 명사 отец는 мой와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня есть 뒤에 명사를 붙이면 "~이(가) 있어요"라는 뜻의 기본 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: 이분은 제 아버지예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отец는 남성명사라서 소유형용사가 мой예요. 여성명사 мать에는 моя를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 러시아어의 가족 명사에는 문법적 성이 있어요. мать와 сестра는 여성이고, отец는 남성이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дедушка는 -а로 끝나서 여성처럼 보이지만 남성명사라서 мой를 써요. мой дедушка라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это моя {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Бабушка, жена, дочь는 모두 여성명사라서 각각 моя를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson02.order.003
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это мой {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это мой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дедушка, муж, сын은 모두 남성명사라서 각각 мой를 써요. дедушка가 -а로 끝나도 마찬가지예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: fill_in_blank
  frame:
    text: У меня есть сын и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 접속사 и는 сын и дочь(아들과 딸)처럼 두 명사를 이어 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson02.translate.005
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: 자녀가 있으세요? (격식체)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дети는 항상 복수형이에요. У вас есть ...?는 상대방에게 무엇이 있는지 정중하게 묻는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 러시아어에는 친척마다 각각 다른 단어가 있고, 관사는 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Эта는 여성형 "이"라서 девочка와 함께 써요. 남성형은 этот예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Эта는 여성명사 девочка에 맞춘 형태이고, Кто это?에서는 성과 상관없는 это를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
    text: Кто это на {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Фото는 어미가 변하지 않아서 На фото에서도 фото 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: 사진 속의 이 사람은 누구예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кто это?는 누구인지 묻는 말이고, На фото는 "사진에서"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: 그런데 이 여자아이는 누구예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 질문 맨 앞의 А는 방금 한 말과 질문을 이어 주며, "그런데", "그러면" 정도의 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: 제 이름은 올가예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут 뒤에 이름을 붙이는 것이 러시아 사람들이 자기소개를 하는 방법이에요.
    language_code: ko
    direction: ltr
