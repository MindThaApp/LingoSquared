schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit53
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit53.gym
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_абонемент
    - w_беговая
    - w_гантели
    - w_гантелями
    - w_десяти
    - w_дорожка
    - w_дорожке
    - w_занятие
    - w_инструктор
    - w_конечно
    - w_пляж
    - w_поднимаю
    - w_разовый
    - w_расписание
    - w_спортзал
    - w_хожу
    - w_хотим
    - w_человека
templates:
- content_key: practice.ko-ru.ru.a1.unit53.lesson01.choose.001
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спортзал
        - w_хожу
        - w_абонемент
        - w_беговая
        - w_дорожка
        - w_дорожке
        - w_гантели
        - w_поднимаю
        - w_гантелями
        - w_занятие
        - w_инструктор
        - w_расписание
        - w_десяти
        - w_разовый
        - w_хотим
        - w_конечно
        - w_человека
        - w_пляж
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''헬스장에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson02.listen.001
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''헬스장의 운동 기구'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson03.translate.001
  lesson_content_key: ru.a1.unit53.lesson03.zanyatie_yogoy
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''요가 수업'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson04.match.001
  lesson_content_key: ru.a1.unit53.lesson04.raspisanie_na_stoyke_registratsii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson05.choose.001
  lesson_content_key: ru.a1.unit53.lesson05.na_stoyke_registratsii_sportzala
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''체육관 안내 데스크에서'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson06.translate.001
  lesson_content_key: ru.a1.unit53.lesson06.dima_i_nina_posle
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. ''헬스장을 다녀온 디마와 니나'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson01.order.002
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: word_order
  frame:
    text: Рынок был хороший, а теперь я хочу пойти в {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортзал
  answer_derivation:
    kind: render_frame
    frame:
      text: Рынок был хороший, а теперь я хочу пойти в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 시장은 좋았고, 이제 헬스장에 가고 싶어요. спортзал은 '헬스장'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson01.fill.003
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: fill_in_blank
  frame:
    text: Я {item} в спортзал. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_хожу
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_хожу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 헬스장에 다녀요. хожу는 '(걸어서 규칙적으로) 간다'는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson01.translate.004
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: translation
  frame:
    text: 저는 헬스장 회원권이 있어요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_абонемент
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} в спортзал.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 헬스장 회원권이 있어요. абонемент는 '회원권, 정기권'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson02.order.002
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: word_order
  frame:
    text: Я бегаю на беговой {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_дорожке
  answer_derivation:
    kind: render_frame
    frame:
      text: Я бегаю на беговой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 러닝머신에서 달려요. дорожке는 '길, 트랙'이라는 뜻이고, '~에서'를 뜻하는 말 뒤에 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson02.fill.003
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: fill_in_blank
  frame:
    text: Я поднимаю {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гантели
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гантели
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 덤벨을 들어요. гантели는 '덤벨'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson02.translate.004
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: translation
  frame:
    text: 저는 러닝머신과 덤벨로 운동해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гантелями
  answer_derivation:
    kind: render_frame
    frame:
      text: Я занимаюсь на беговой дорожке и с {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 러닝머신과 덤벨로 운동해요. гантелями는 '덤벨'이라는 뜻이고, '~와 함께'를 뜻하는 말 뒤에 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson03.order.002
  lesson_content_key: ru.a1.unit53.lesson03.zanyatie_yogoy
  type: word_order
  frame:
    text: Во сколько начинается {item} йогой?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_занятие
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько начинается {item} йогой?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 요가 수업은 몇 시에 시작해요? занятие는 '수업'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson04.order.002
  lesson_content_key: ru.a1.unit53.lesson04.raspisanie_na_stoyke_registratsii
  type: word_order
  frame:
    text: Я читаю {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_расписание
  answer_derivation:
    kind: render_frame
    frame:
      text: Я читаю {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 시간표를 읽어요. расписание는 '시간표'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit53.lesson06.order.002
  lesson_content_key: ru.a1.unit53.lesson06.dima_i_nina_posle
  type: word_order
  frame:
    text: Я люблю ходить на {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_пляж
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю ходить на {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 해변에 가는 것을 좋아해요. пляж는 '해변'이라는 뜻이에요.
    language_code: ko
    direction: ltr
