    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 장소를 나타내는 на("~에") 뒤에서는 улица가 улице로 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson01.translate.004
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: 약국은 어디에 있어요?
    language_code: ko
    direction: ltr
  slots:
