    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Банк와 ресторан은 '뱅크', '레스토랑'과 소리가 비슷해서 알아보기 쉬워요. аптека는 '약국'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson02.order.004
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
