templates:
- content_key: practice.ko-ru.ru.a1.unit09.lesson01.choose.001
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Где는 "어디", находится는 "위치해 있다"라는 뜻이에요. 함께 쓰면 장소의 위치를 묻는 말이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson01.order.002
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: word_order
  frame:
    text: Где {item} магазин?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Где {item} магазин?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Находится는 3인칭 단수 동사형이라서 магазин 같은 단수 명사와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson01.fill.003
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
