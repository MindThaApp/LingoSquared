    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Где는 "어디", улица는 "거리, 길"이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson02.choose.001
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Банк, вокзал, ресторан은 남성 명사이고, аптека, гостиница, библиотека는 여성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson02.listen.002
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 장소 이름들은 명사예요. Где находится банк?처럼 명사 앞에 관사 같은 단어를 따로 붙일 필요가 없어요.
    language_code: ko
    direction: ltr
