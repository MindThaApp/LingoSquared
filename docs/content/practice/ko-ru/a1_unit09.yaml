  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиница는 '호텔'을 뜻하는 여성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.choose.001
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Вашей와 моей는 ваш와 мой의 여성형이고, на 뒤에서 쓰여요: на вашей улице, на моей улице.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.order.002
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: word_order
  frame:
    text: Что есть на {item} улице?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вашей는 여성 명사 улице에 맞춘 형태예요. 존칭 вы로 묻는 정중한 질문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.fill.003
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: На {item} улице есть банк. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Моей는 моя가 на 뒤에서 취하는 형태예요. улица가 여성 명사이고 전치격이기 때문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.fill.004
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: Спасибо {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо большое는 '정말 고맙습니다'라고 따뜻하게 감사를 전하는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.translate.005
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 당신의 거리에는 무엇이 있나요? (존칭)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что есть на вашей улице?는 거리에 무엇이 있는지 묻는 말이에요. вы 형태인 вашей를 써서 공손해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 정말 고맙습니다.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Большое는 중성 명사 спасибо에 맞춰서 -ое로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit09.lesson03.translate.007
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 우리 동네 거리에는 은행이 하나 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть는 소유를 말할 때 쓰고, 거리에 무언가가 있다고 할 때는 На моей улице есть를 써요.
    language_code: ko
    direction: ltr
