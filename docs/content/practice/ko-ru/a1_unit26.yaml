  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_высокий
        - w_невысокий
        - w_старый
        - w_молодой
        - w_прилагательное
        - w_меняется
        - w_роду
