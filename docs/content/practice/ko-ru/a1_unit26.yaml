    - w_волосы
    - w_выглядит
    - w_выглядишь
    - w_выглядят
    - w_высокий
    - w_выше
    - w_глаза
    - w_голубые
    - w_девушка
    - w_дедушки
    - w_длиннее
    - w_длинные
    - w_зелёные
    - w_имя
    - w_карие
    - w_каштановые
    - w_короткие
    - w_меняется
    - w_молодой
    - w_невысокий
    - w_новая
    - w_падеже
    - w_познакомиться
    - w_придёт
    - w_прилагательное
    - w_родительном
    - w_родительный
    - w_роду
    - w_светлые
    - w_седые
    - w_смотри
    - w_старый
    - w_узнаю
    - w_чёрные
    - w_языковое
