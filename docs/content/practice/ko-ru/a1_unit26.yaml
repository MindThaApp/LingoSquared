        - w_короткие
        - w_чёрные
        - w_светлые
        - w_каштановые
        - w_седые
        - w_дедушки
        - w_длинные
        - w_имя
        - w_родительном
        - w_падеже
        - w_глаза
        - w_карие
        - w_голубые
        - w_зелёные
        - w_выглядит
        - w_языковое
