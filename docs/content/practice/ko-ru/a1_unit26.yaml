        - w_выглядишь
        - w_родительный
        - w_длиннее
        - w_смотри
        - w_познакомиться
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 키가 크다, 작다, 나이가 많다, 젊다를 배우는 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson02.listen.001
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 머리카락 묘사 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson03.translate.001
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 눈과 ''어떻게 생겼어요?''를 배우는 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson04.match.001
  lesson_content_key: ru.a1.unit26.lesson04.nastya_opisyvaet_ninu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson05.choose.001
  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 이고르와 레나 비교하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson06.translate.001
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 디마가 니나를 알아보기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson01.order.002
  lesson_content_key: ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i
  type: word_order
  frame:
    text: Лена высокая, а Игорь {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_невысокий
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена высокая, а Игорь {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '레나는 키가 크고 이고르는 키가 작아요. 두 문장을 а(반면, 그리고)로 나란히 놓아요: Лена высокая, а Игорь невысокий.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson02.order.002
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: word_order
  frame:
    text: У Димы короткие чёрные {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_волосы
  answer_derivation:
    kind: render_frame
    frame:
      text: У Димы короткие чёрные {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 디마는 짧은 검은 머리예요. волосы는 '머리카락'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson02.fill.003
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: fill_in_blank
  frame:
    text: У Игоря {item} волосы. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_короткие
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_короткие
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이고르는 머리가 짧아요. короткие는 '짧은'(복수)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson02.translate.004
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: translation
  frame:
    text: 나스탸는 금발이에요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_светлые
  answer_derivation:
    kind: render_frame
    frame:
      text: У Насти {item} волосы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 나스탸는 금발이에요. светлые는 '밝은, 금발의'(복수)라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson03.order.002
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: word_order
  frame:
    text: У Димы карие {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_глаза
  answer_derivation:
    kind: render_frame
    frame:
      text: У Димы карие {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 디마는 갈색 눈이에요. глаза는 '눈'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson03.fill.003
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: fill_in_blank
  frame:
    text: У Игоря {item} глаза. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_карие
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_карие
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이고르는 갈색 눈이에요. карие는 '갈색의'(복수, 눈동자에 쓰는 말)라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson03.translate.004
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: translation
  frame:
    text: 나스탸는 파란 눈이에요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_голубые
  answer_derivation:
    kind: render_frame
    frame:
      text: У Насти {item} глаза.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 나스탸는 파란 눈이에요. голубые는 '하늘색의'(복수)라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson05.order.002
  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: word_order
  frame:
    text: У Лены волосы {item}, чем у Игоря.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_длиннее
  answer_derivation:
    kind: render_frame
    frame:
      text: У Лены волосы {item}, чем у Игоря.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '레나는 이고르보다 머리가 더 길어요. У Лены волосы длиннее, чем у Игоря: длиннее는 형태가 변하지 않고, чем(~보다)이 두 번째 부분을 시작해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit26.lesson06.order.002
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
  type: word_order
  frame:
    text: Мне тоже приятно {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_познакомиться
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне тоже приятно {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저도 만나서 반가워요! 대화를 마무리해요. 디마가 나스탸의 앞선 설명 덕분에 니나를 잘 알아봤어요.
    language_code: ko
    direction: ltr
