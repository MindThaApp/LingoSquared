  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_букет
    - w_классное
    - w_книжный
    - w_красивыми
    - w_красная
    - w_лента
    - w_лентой
    - w_роз
    - w_роза
    - w_розу
    - w_розы
    - w_тюльпан
    - w_цветок
    - w_цветы
