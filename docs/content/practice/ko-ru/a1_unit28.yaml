schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit28
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit28.sport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_бег
    - w_бегает
    - w_бегаешь
    - w_бегать
    - w_бегаю
    - w_будем
    - w_вообще
    - w_вчетвером
    - w_глагол
    - w_говорят
    - w_двигаться
    - w_домом
    - w_другу
    - w_займёмся
    - w_занимаешься
    - w_йога
    - w_йогой
    - w_конкретный
    - w_людям
    - w_называет
    - w_неделе
    - w_парке
    - w_плавает
    - w_плавание
    - w_плаванием
    - w_плавать
    - w_поиграл
    - w_почти
    - w_раз
    - w_раза
    - w_рядом
    - w_спокойно
    - w_спорт
    - w_там
    - w_футбол
templates:
- content_key: practice.ko-ru.ru.a1.unit28.lesson01.choose.001
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спорт
        - w_футбол
        - w_йога
        - w_йогой
        - w_бег
        - w_плавание
        - w_плаванием
        - w_занимаешься
        - w_раз
        - w_раза
        - w_говорят
        - w_вообще
        - w_называет
        - w_конкретный
        - w_плавать
        - w_бегаешь
        - w_бегаю
        - w_парке
        - w_рядом
        - w_домом
        - w_бегать
        - w_глагол
        - w_бегает
        - w_там
        - w_спокойно
        - w_двигаться
        - w_плавает
        - w_почти
        - w_займёмся
        - w_другу
        - w_людям
        - w_поиграл
        - w_неделе
        - w_вчетвером
        - w_будем
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 축구, 요가, 달리기, 수영을 다루는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson02.listen.001
  lesson_content_key: ru.a1.unit28.lesson02.kak_chasto_ty_zanimaeshsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) ''얼마나 자주 운동해요?'' 수업에서 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson03.translate.001
  lesson_content_key: ru.a1.unit28.lesson03.zanimatsya_sportom_i_lyubit
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 운동하기와 좋아하는 운동을 다루는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson04.match.001
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson05.choose.001
  lesson_content_key: ru.a1.unit28.lesson05.nastya_i_lena_o
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 나스탸와 레나가 운동에 대해 이야기하는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson06.translate.001
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) ''같이 운동할까요?'' 수업에서 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson01.order.002
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: word_order
  frame:
    text: Футбол это {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спорт
  answer_derivation:
    kind: render_frame
    frame:
      text: Футбол это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 축구는 스포츠예요. спорт는 '스포츠'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson01.fill.003
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: fill_in_blank
  frame:
    text: Дима играет в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_футбол
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_футбол
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 디마는 축구를 해요. футбол은 '축구'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson01.translate.004
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: translation
  frame:
    text: 나스탸는 요가를 해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_йогой
  answer_derivation:
    kind: render_frame
    frame:
      text: Настя занимается {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 나스탸는 요가를 해요. йогой는 '요가'라는 뜻이에요('~을 하다'라는 동사 뒤에 쓰는 형태예요).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson02.order.002
  lesson_content_key: ru.a1.unit28.lesson02.kak_chasto_ty_zanimaeshsya
  type: word_order
  frame:
    text: Я занимаюсь йогой два {item} в неделю.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_раза
  answer_derivation:
    kind: render_frame
    frame:
      text: Я занимаюсь йогой два {item} в неделю.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 일주일에 두 번 요가를 해요. раза는 '번, 회'라는 뜻이고, 2~4 뒤에 쓰는 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson03.order.002
  lesson_content_key: ru.a1.unit28.lesson03.zanimatsya_sportom_i_lyubit
  type: word_order
  frame:
    text: Лена любит {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_плавать
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена любит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 레나는 수영을 좋아해요. плавать는 '수영하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson04.order.002
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: word_order
  frame:
    text: Ты часто {item}, Игорь?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_бегаешь
  answer_derivation:
    kind: render_frame
    frame:
      text: Ты часто {item}, Игорь?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 이고르, 너는 자주 달려? бегаешь는 '너는 달린다'라는 뜻이에요(반말).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson04.fill.003
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: fill_in_blank
  frame:
    text: Да, я {item} два раза в неделю. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_бегаю
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_бегаю
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 응, 나는 일주일에 두 번 달려. бегаю는 '나는 달린다, 조깅한다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson04.translate.004
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: translation
  frame:
    text: 우리 집 가까이에 있는 공원에서요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_парке
  answer_derivation:
    kind: render_frame
    frame:
      text: В {item}, рядом с моим домом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 우리 집 가까이에 있는 공원에서요. парке는 '공원'이라는 뜻이에요('~에서'를 뜻하는 단어 뒤에 쓰는 형태예요).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson05.order.002
  lesson_content_key: ru.a1.unit28.lesson05.nastya_i_lena_o
  type: word_order
  frame:
    text: Лена часто {item}, почти каждую неделю.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_плавает
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена часто {item}, почти каждую неделю.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 레나는 거의 매주 자주 수영해요. плавает는 '수영한다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson06.order.002
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: word_order
  frame:
    text: Давай вместе {item} спортом?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_займёмся
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай вместе {item} спортом?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 우리 같이 운동할까요? займёмся는 '우리 ~을 시작하자, 우리 ~을 하게 될 것이다'라는 뜻이에요(어떤 활동을 하다).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson06.fill.003
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: fill_in_blank
  frame:
    text: Давай говорят {item}, а давайте говорят нескольким людям или на Вы. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_другу
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_другу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давай는 친구 한 명(반말 ты)에게, давайте는 여러 사람이나 존댓말 Вы에게 써요. 앞 단원에서 계획을 제안할 때 쓴 표현과 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit28.lesson06.translate.004
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: translation
  frame:
    text: 저는 차라리 축구를 하고 싶어요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_поиграл
  answer_derivation:
    kind: render_frame
    frame:
      text: Я бы лучше {item} в футбол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 차라리 축구를 하고 싶어요. поиграл은 '잠시 놀았다, 했다'라는 뜻이에요(남성형).
    language_code: ko
    direction: ltr
