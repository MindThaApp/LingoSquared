schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit40
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit40.emergencies
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_библиотеке
    - w_внимание
    - w_выход
    - w_выходу
    - w_запасной
    - w_запасному
    - w_звоню
    - w_иди
    - w_номер
    - w_номеру
    - w_пожар
    - w_пожарные
    - w_пожарным
    - w_позвони
    - w_полиция
    - w_помощь
    - w_скорая
    - w_скорую
    - w_случилось
    - w_экстренному
    - w_экстренный
templates:
- content_key: practice.ko-ru.ru.a1.unit40.lesson01.choose.001
  lesson_content_key: ru.a1.unit40.lesson01.pomoshch_i_pozhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_помощь
        - w_пожар
        - w_экстренный
        - w_номер
        - w_позвони
        - w_экстренному
        - w_номеру
        - w_запасной
        - w_выход
        - w_полиция
        - w_звоню
        - w_скорая
        - w_скорую
        - w_пожарные
        - w_пожарным
        - w_внимание
        - w_запасному
        - w_выходу
        - w_иди
        - w_библиотеке
        - w_случилось
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 도움과 화재 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson02.listen.001
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 긴급 전화번호와 비상구 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson03.translate.001
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 경찰, 구급차, 소방대 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson04.match.001
  lesson_content_key: ru.a1.unit40.lesson04.pozhar_v_yazykovom_kafe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson05.choose.001
  lesson_content_key: ru.a1.unit40.lesson05.chitaem_tekst_o_pozhare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (화재에 관한 글 읽기 수업에 나와요)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson06.translate.001
  lesson_content_key: ru.a1.unit40.lesson06.igor_prikhodit
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. ''이고르의 도착'' 레슨에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson01.order.002
  lesson_content_key: ru.a1.unit40.lesson01.pomoshch_i_pozhar
  type: word_order
  frame:
    text: Мне нужна {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_помощь
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне нужна {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '도움이 필요해요. помощь: ''도움''이라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson02.order.002
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: word_order
  frame:
    text: Позвони по {item} номеру!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_экстренному
  answer_derivation:
    kind: render_frame
    frame:
      text: Позвони по {item} номеру!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '긴급 전화번호로 전화하세요! экстренному: ''긴급의''라는 뜻이고 남성 여격이에요. ''긴급 전화번호로 전화하세요''처럼 쓰여요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson02.fill.003
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: fill_in_blank
  frame:
    text: Где {item} выход? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_запасной
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_запасной
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '비상구는 어디예요? запасной: ''비상의''라는 뜻이고 남성형이에요. ''비상구''처럼 쓰여요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson03.order.002
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: word_order
  frame:
    text: Я {item} в полицию.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_звоню
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в полицию.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '저는 경찰에 전화해요. звоню: ''(전화를) 건다''는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson03.fill.003
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: fill_in_blank
  frame:
    text: Полиция, {item} помощь или пожарные? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_скорая
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_скорая
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 경찰, 구급차, 소방대? 긴급 전화번호 112 하나로 경찰, 구급차, 소방서에 연결돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit40.lesson03.translate.004
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: translation
  frame:
    text: 저는 구급차를 불러요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_скорую
  answer_derivation:
    kind: render_frame
    frame:
      text: Я звоню в {item} помощь.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '저는 구급차를 불러요. скорую: ''빠른''이라는 뜻이고 여성 대격이에요. ''구급차를 부르다''처럼 쓰여요.'
    language_code: ko
    direction: ltr
