- content_key: practice.ko-ru.ru.a1.unit42.lesson01.order.003
  lesson_content_key: ru.a1.unit42.lesson01.zapisatsya
  type: word_order
  frame:
    text: На что {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_запись
  answer_derivation:
    kind: render_frame
    frame:
      text: На что {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 무슨 예약이에요? запись는 '예약, 신청'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit42.lesson01.fill.004
  lesson_content_key: ru.a1.unit42.lesson01.zapisatsya
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_записаться
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_записаться
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 예약하고 싶어요. записаться는 '예약하다, 등록하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit42.lesson02.order.003
  lesson_content_key: ru.a1.unit42.lesson02.vremya_svobodno
  type: word_order
  frame:
