    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_свободно
  answer_derivation:
    kind: render_frame
    frame:
      text: В среду в десять часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 수요일 10시는 비어 있어요. свободно는 '비어 있다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit42.lesson02.fill.004
  lesson_content_key: ru.a1.unit42.lesson02.vremya_svobodno
  type: fill_in_blank
  frame:
    text: Мне это {item}. ({hint})
    language_code: ru
