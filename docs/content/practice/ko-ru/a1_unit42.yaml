    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit42.lesson05.order.002
  lesson_content_key: ru.a1.unit42.lesson05.chitaem_podtverzhdenie
  type: word_order
  frame:
    text: Да, запись {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_подтверждена
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, запись {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 네, 예약이 확정되었어요. подтверждена는 '확정된'(여성형)이라는 뜻이에요.
    language_code: ko
    direction: ltr
