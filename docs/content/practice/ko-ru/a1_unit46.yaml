    - w_монетами
    - w_несу
    - w_одежду
    - w_пойти
    - w_постирать
    - w_прачечная
    - w_прачечную
    - w_среды
    - w_стирка
    - w_стирки
    - w_сушилка
    - w_сушилкой
    - w_тридцать
    - w_тяжёлая
    - w_шестьдесят
