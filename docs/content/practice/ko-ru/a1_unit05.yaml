templates:
- content_key: practice.ko-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час?는 직역하면 "어느 시간"을 묻는 말이고, Сейчас는 "지금"이라는 뜻이에요. 이 둘은 시간을 묻고 답하는 기본 짝이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 숫자에 따라 뒤에 오는 명사의 형태가 달라져요. 1 뒤에는 час, 2~4 뒤에는 часа, 5 이상 뒤에는 часов를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 2, 3, 4 뒤에서 명사는 два часа, три часа처럼 часа 형태가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '5부터는 명사가 복수 생격 часов가 돼요: пять часов, десять часов.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: 몇 시예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час?는 직역하면 "어느 시간"이라는 뜻이고, 시간을 묻는 기본 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '러시아어는 의문사를 먼저 말하고 그다음에 동사를 두는 의문문을 자주 써요: Когда отходит поезд?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром, днём, вечером, ночью는 -ом, -ём, -ью로 끝나는 부사이고, 전치사 없이 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '러시아어에서 하루의 시간대는 부사로 나타내요: утром, днём, вечером, ночью.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 시각 뒤에서 дня는 오후, утра는 오전, вечера는 저녁을 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу?는 지금이 몇 시인지가 아니라, 어떤 일이 몇 시에 일어나는지 묻는 질문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: утром, вечером 같은 시간 표현은 전치사 없이 혼자 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: 저녁 7시에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '시각 뒤에 오는 시간대 단어는 생격이 돼요: семь часов вечера.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста는 모르는 사람에게 질문을 공손하게 시작하는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите는 "말해 주세요"라는 뜻의 공손한 вы 명령형이고, пожалуйста는 부탁을 부드럽게 해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит는 동사의 он/она/оно 형태라서 단수 поезд와 호응해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 시각 뒤의 утра는 오전을 뜻해서 восемь часов утра는 아침 8시예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: 기차는 언제 떠나요?
    language_code: ko
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда는 '언제'를 묻는 말이고, 동사 отходит는 단수 поезд에 맞춰 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: 오후 2시에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 오후 시각에는 дня를 쓰고, 아침과 저녁에는 각각 утра와 вечера를 써요.
    language_code: ko
    direction: ltr
