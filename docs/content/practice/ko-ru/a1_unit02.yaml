templates:
- content_key: practice.ko-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 러시아어에는 "당신/너"를 뜻하는 말이 두 가지 있어요. ты는 친구, 가족, 아이, 또래에게 쓰고, вы는 모르는 사람, 존중해야 할 사람, 또는 여러 사람에게 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как вас зovут?
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут는 직역하면 "사람들이 나를 ~라고 부른다"는 뜻이에요. 그래서 뒤에 오는 이름은 기본 형태 그대로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Зовут는 질문과 대답 모두에 나와요: Как вас зовут?와 Меня зовут Виктор.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: 저는 {name}라고 해요.
    language_code: ko
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 러시아 사람들은 Меня зовут 뒤에 이름을 붙여 자기소개를 해요. Ирина Петровна처럼 부칭을 함께 말하면 더 격식 있는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: 성함이 어떻게 되세요? (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вас는 이 질문에 쓰인 вы의 격식 있는 형태예요. 친구에게는 Как тебя зовут?라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Откуда вы?는 어디 출신인지 묻는 말이고, 대답은 из 뒤에 장소를 붙여요: Я из Канады, Я из Москвы.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Можно на ты?는 вы에서 ты로 바꾸자고 공손하게 청하는 말이에요. 관례상 나이가 많거나 지위가 높은 사람이 먼저 제안해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ты는 잘 아는 사람에게, вы는 격식을 차려야 하는 상대에게 써요. 그래서 모든 대화에서 둘 중 하나를 골라야 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Из 뒤에는 생격이 와요. 그래서 Канада는 Канады, Москва는 Москвы가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давайте перейдём на ты는 격식을 내려놓자는 제안이지만, давайте를 써서 제안 자체는 공손하게 표현해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меня는 я의 목적격 형태예요. 그래서 이름을 말할 때 Меня зовут이라고 하고, 직역하면 "사람들이 나를 ~라고 부른다"는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: 어디에서 오셨어요? (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Откуда는 "어디에서"라는 뜻이에요. 격식 있는 질문에는 вы를 쓰고, 대답에는 из 뒤에 장소를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Очень приятно는 직역하면 "매우 기쁘다"는 뜻이고, 상대의 이름을 들은 뒤에 하는 표준적인 대답이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: давайте 뒤에 동사의 우리 형태를 붙이면 공손한 제안이 돼요. Давайте познакомимся는 "서로 인사해요"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давайте познакомимся는 вы로 부르는 상대에게 자기소개를 시작할 때 쓰는 공손한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: 만나서 반갑습니다.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Очень приятно는 상대를 직접 부르는 말이 아니라서 ты와 вы 모두에게 쓸 수 있어요.
    language_code: ko
    direction: ltr
