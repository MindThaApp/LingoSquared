    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Рад와 устал은 남성형이고, рада와 устала는 여성형이에요.
    language_code: ko
    direction: ltr
