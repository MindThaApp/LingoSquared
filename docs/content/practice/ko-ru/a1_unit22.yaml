    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 말하는 사람이 여자라서 Рада는 -а로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson01.fill.003
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: fill_in_blank
  frame:
    text: Мне {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мне грустно는 '나에게'를 뜻하는 мне를 쓰고 주어가 없어요. 한국어의 '나는 슬프다'보다 '나에게 슬픔이 느껴진다'에 가까워요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson01.translate.004
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: 기뻐요. (남자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 남자는 어미 없이 рад라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson01.translate.005
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: 기뻐요. (여자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 여자는 -а를 붙여 рада라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson01.translate.006
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: 슬퍼요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне грустно는 슬프다고 말할 때 가장 흔히 쓰는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson02.choose.001
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 남자는 устал, 여자는 устала라고 말해요. потому что는 '왜냐하면'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson02.order.002
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: word_order
  frame:
    text: Я {item}, потому что много работы.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}, потому что много работы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 여자가 말할 때 Устала는 -а로 끝나요. потому что는 이유를 이끌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson02.fill.003
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: fill_in_blank
  frame:
    text: Я {item}, потому что много работы. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 남자는 어미 없이 устал이라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson02.translate.004
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: translation
  frame:
    text: 피곤해요. (남자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Устал은 устать의 남성 과거형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson02.translate.005
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: translation
  frame:
    text: 일이 많아서 피곤해요. (여자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    a: *id006
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {a}, потому что много {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Много 뒤에는 работы 형태가 와서 '많은 일'이라는 뜻이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.choose.001
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как ты себя чувствуешь?는 기분이 어떤지 묻는 말이에요. себя는 '자기 자신'을 뜻하는 재귀대명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.order.002
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: word_order
  frame:
    text: Как ты {item} чувствуешь?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {item} чувствуешь?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Себя는 재귀대명사로, 누구에게나 형태가 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.fill.003
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: fill_in_blank
  frame:
    text: Как ты себя {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Чувствуешь는 чувствовать의 친근한 ты 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.fill.004
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: fill_in_blank
  frame:
    text: Я рад, потому что завтра {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Выходной는 쉬는 날이라는 뜻이에요. '내일'을 뜻하는 завтра가 그 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.translate.005
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
    text: 기분이 어때? (친한 사이)
    language_code: ko
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как ты себя чувствуешь?는 친근하게 기분을 묻는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.translate.006
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
    text: 내일은 쉬는 날이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Завтра {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '러시아어에는 ''~이다''에 해당하는 말이 필요 없어요: Завтра выходной.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson03.match.007
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
