templates:
- content_key: practice.ko-ru.ru.a1.unit22.lesson01.choose.001
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 남자는 рад, 여자는 рада라고 말해요. грустно는 주어가 없는 표현이라 мне와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit22.lesson01.order.002
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: word_order
  frame:
