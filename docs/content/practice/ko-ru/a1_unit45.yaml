schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit45
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit45.hairdresser
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вовремя
    - w_семьсот
    - w_классная
    - w_коротко
    - w_короче
    - w_можете
    - w_мытьё
    - w_насколько
    - w_недели
    - w_парикмахер
    - w_парикмахера
    - w_парикмахеру
    - w_плачу
    - w_подстричь
    - w_покороче
    - w_прейскурант
    - w_присаживайтесь
    - w_приходите
    - w_причёска
    - w_проблем
    - w_следующей
    - w_слишком
    - w_стрижка
    - w_хотите
templates:
- content_key: practice.ko-ru.ru.a1.unit45.lesson01.choose.001
  lesson_content_key: ru.a1.unit45.lesson01.moi_volosy_slishkom_dlinnye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_слишком
        - w_парикмахер
        - w_парикмахеру
        - w_подстричь
        - w_можете
        - w_короче
        - w_покороче
        - w_насколько
        - w_коротко
        - w_хотите
        - w_вовремя
        - w_приходите
        - w_причёска
        - w_проблем
        - w_присаживайтесь
        - w_прейскурант
        - w_стрижка
        - w_семьсот
        - w_мытьё
        - w_плачу
        - w_классная
        - w_парикмахера
        - w_следующей
        - w_недели
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 머리가 너무 길어요 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit45.lesson02.listen.001
  lesson_content_key: ru.a1.unit45.lesson02.vy_mozhete_podstrich_mne
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (''머리 좀 잘라 주실 수 있어요?'' 수업)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit45.lesson03.translate.001
  lesson_content_key: ru.a1.unit45.lesson03.zapisatsya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit45.lesson04.match.001
  lesson_content_key: ru.a1.unit45.lesson04.u_parikmakhera
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit45.lesson05.choose.001
  lesson_content_key: ru.a1.unit45.lesson05.chitaem_preyskurant
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. ''가격표 읽기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit45.lesson06.translate.001
  lesson_content_key: ru.a1.unit45.lesson06.nastya_vidit_novuyu_prichyosku
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
