templates:
- content_key: practice.ko-ru.ru.a1.unit16.lesson01.choose.001
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У меня болит 뒤에 신체 부위를 붙이면 그 부위가 아프다는 뜻이에요. 아픈 부위가 болит의 주어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson01.order.002
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: word_order
  frame:
    text: У меня болит {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 신체 부위가 여성형이든 남성형이든 중성형이든 болит는 형태가 바뀌지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson01.fill.003
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: fill_in_blank
  frame:
    text: У меня болит {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 러시아어는 "머리가 아파요"를 "나에게 머리가 아프다"처럼 말해요. "나는 두통이 있다"라고 하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson01.translate.004
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: 배가 아파요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот는 남성 명사지만 болит는 바뀌지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: 목이 아파요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня에 болит를 붙이는 것이 증상을 말하는 일상적인 방법이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.choose.001
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мне плохо는 "몸이 안 좋아요"라는 일반적인 표현이고, мне는 "나에게"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.order.002
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: word_order
  frame:
    text: Мне {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо는 "나는" 대신 "나에게"를 써서 몸 상태를 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.fill.003
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: fill_in_blank
  frame:
    text: У меня {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня температура는 "열이 있어요"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.translate.004
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: 감기에 걸렸어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня 뒤에 명사를 붙여 У меня простуда.처럼 병을 말할 수도 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.translate.005
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: 몸이 안 좋아요. (두 단어)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо는 특정한 통증이 아니라 전반적인 몸 상태를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.translate.006
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Температура는 문맥에 따라 "온도"나 "열"을 뜻할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson02.match.007
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Болит는 "아프다"라는 뜻의 동사이고, голова, живот, горло 같은 신체 부위는 아픈 대상이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson03.choose.001
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Много воды에서 воды는 много 뒤에 오는 вода의 형태로, "많은 물"이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson03.order.002
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: word_order
  frame:
    text: Вам нужно {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам нужно 뒤에 동사원형을 붙이면 "~해야 해요"라는 뜻이에요. вам은 격식을 갖춘 "당신에게"예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson03.fill.003
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Да, и {item} температура. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ещё는 앞에서 말한 것에 무언가를 더할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson03.fill.004
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Вам {item} отдыхать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вам нужно 뒤에 동사원형을 붙인 "~하셔야 해요"는 의사가 하는 정중한 조언이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson03.translate.005
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: 쉬셔야 해요. (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам {item} отдыхать.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам은 격식을 갖춘 "당신"으로, 의사가 환자에게 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit16.lesson03.translate.006
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: 물을 많이 드셔야 해요. (격식)
    language_code: ko
    direction: ltr
  slots:
    a: *id016
    b: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно пить {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: много 뒤에서 명사는 воды 형태가 되어 "많은 물"을 뜻해요.
    language_code: ko
    direction: ltr
