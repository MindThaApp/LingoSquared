schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit32
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit32.birthday
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вечеринка
    - w_восемнадцатого
    - w_мило
    - w_начнём
    - w_отметим
    - w_отмечаем
    - w_отмечать
    - w_подарок
    - w_поздравляю
    - w_пригласишь
    - w_приглашает
    - w_приглашать
    - w_приглашаю
    - w_приглашают
    - w_приглашу
    - w_придёшь
    - w_рады
    - w_рождения
    - w_удовольствием
    - w_устраиваем
templates:
- content_key: practice.ko-ru.ru.a1.unit32.lesson01.choose.001
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_рождения
        - w_восемнадцатого
        - w_отмечать
        - w_отмечаем
        - w_вечеринка
        - w_приглашать
        - w_приглашаю
        - w_приглашают
        - w_придёшь
        - w_удовольствием
        - w_отметим
        - w_устраиваем
        - w_пригласишь
        - w_приглашу
        - w_приглашает
        - w_рады
        - w_поздравляю
        - w_подарок
        - w_мило
        - w_начнём
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 생일 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson02.listen.001
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 축하와 파티 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson03.translate.001
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 파티에 초대하기 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson04.match.001
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson05.choose.001
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 파티 준비에서 누가 무엇을 하는지 배우는 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson06.translate.001
  lesson_content_key: ru.a1.unit32.lesson06.vecherinka_v_yazykovom_kafe
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. 언어 카페 파티 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 제 생일은 4월 18일이에요. рождения는 '출생'이라는 뜻이에요(생일이라는 말 속의 생격).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson01.fill.003
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: fill_in_blank
  frame:
    text: День рождения Лены в субботу, {item} апреля. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '레나의 생일은 4월 18일 토요일이에요. Лены는 Лена의 생격으로 소유를 나타내요: день рождения Лены. ''~의''에 해당하는 별도의 단어는 없어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson02.order.002
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: word_order
  frame:
    text: Мы {item} день рождения Лены.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отмечаем
  answer_derivation:
    kind: render_frame
    frame:
      text: Мы {item} день рождения Лены.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 우리는 레나의 생일을 축하해요. отмечаем은 '우리가 기념하다, 축하하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson03.order.002
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: word_order
  frame:
    text: Я {item} тебя.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашаю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} тебя.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 당신을 초대해요. приглашаю는 '내가 초대하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson03.fill.003
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: fill_in_blank
  frame:
    text: Ты {item} на вечеринку? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_придёшь
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_придёшь
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 파티에 올 거예요? придёшь는 '(네가) 올 것이다'라는 뜻이에요(친한 사이에 쓰는 말).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson03.translate.004
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: 네, 기꺼이 갈게요!
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_удовольствием
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, я с {item} приду!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 네, 기꺼이 갈게요! удовольствием는 '기쁨'이라는 뜻이고, '기꺼이'라는 표현에서 '함께'를 뜻하는 말 뒤에 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson04.order.002
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: word_order
  frame:
    text: Да, давайте {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отметим
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, давайте {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 네, 같이 축하해요! отметим은 '축하하자; 우리가 축하할 것이다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson04.fill.003
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: fill_in_blank
  frame:
    text: Да, я {item} Настю. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашу
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 네, 나스탸를 초대할게요. приглашу는 '내가 초대할 것이다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson05.order.002
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: word_order
  frame:
    text: Дима {item} Игоря и Настю на вечеринку.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашает
  answer_derivation:
    kind: render_frame
    frame:
      text: Дима {item} Игоря и Настю на вечеринку.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 디마는 이고르와 나스탸를 파티에 초대해요. приглашает는 '(그/그녀가) 초대하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit32.lesson05.fill.003
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: fill_in_blank
  frame:
    text: Все {item} за Лену. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_рады
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_рады
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 모두가 레나를 위해 기뻐해요. рады는 '기쁘다'라는 뜻이에요(복수).
    language_code: ko
    direction: ltr
