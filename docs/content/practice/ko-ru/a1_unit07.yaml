templates:
- content_key: practice.ko-ru.ru.a1.unit07.lesson01.choose.001
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Официант는 남자 웨이터이고 официантка는 여자 웨이트리스예요. 여성형은 -ка를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson01.order.002
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: word_order
  frame:
    text: Этот {item} свободен?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Этот {item} свободен?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Этот는 남성형 "이"라서 столик, стол 같은 남성 명사와 함께 써요. свободен도 남성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson01.fill.003
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: fill_in_blank
  frame:
    text: Да, {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Садитесь는 -тесь로 끝나는 공손한 вы 명령형이고, 직원이 손님에게 말할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson01.match.004
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Свободен은 столик과 성이 일치하는 남성 형용사예요. Этот столик свободен?은 이 테이블이 비어 있는지 묻는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson01.translate.005
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: 메뉴판 여기 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вот {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меню는 어미가 변하지 않고, Вот은 "여기 있어요"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson01.translate.006
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: 무엇을 주문하시겠어요? (격식)
    language_code: ko
    direction: ltr
  slots:
    aux: *id005
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Что {aux} {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете заказывать?는 вы 형태 будете와 동사원형으로 손님에게 무엇을 주문할지 묻는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson02.choose.001
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Я хочу 뒤에 명사를 쓰면 "~을 원해요"라는 뜻이 돼요. 러시아어에는 관사가 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson02.order.002
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу는 "원해요"라는 뜻이고, 그 뒤에서 чай, кофе, борщ, салат는 형태가 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson02.fill.003
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: fill_in_blank
  frame:
    text: Я хочу борщ и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '단어 и는 주문에서 두 가지를 이어 줘요: борщ и салат.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson02.match.004
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id010
    second: *id010
    third: *id010
    fourth: *id010
    fifth: *id010
    sixth: *id010
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Кофе는 어미가 변하지 않는 남성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson02.translate.005
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: 차를 원해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу는 직접적인 표현이라서, 식당에서는 пожалуйста를 붙여 부드럽게 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: 보르시와 샐러드를 원해요.
    language_code: ko
    direction: ltr
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат는 대화 속 주문이에요. 러시아어에는 관사가 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мороженое는 сладкое처럼 형용사에서 만들어진 중성 명사라서 -ое로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson03.order.002
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: На сладкое принесите {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое принесите {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое는 "디저트로"라는 뜻이고, принесите는 "가져다주세요"라는 뜻의 공손한 вы 명령형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson03.order.003
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: Что будете {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Что будете {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете пить?는 웨이터의 질문이에요. будете에 동사원형을 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson03.fill.004
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: fill_in_blank
  frame:
    text: На сладкое {item} мороженое, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Принесите는 "가져다주세요"라는 뜻의 공손한 вы 명령형이고, ты에게는 принеси라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson03.translate.005
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: 디저트로 아이스크림을 가져다주세요. (격식)
    language_code: ko
    direction: ltr
  slots:
    a: *id016
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое {a} {b}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое принесите мороженое는 웨이터에게 디저트를 주문할 때 쓰는 자연스러운 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit07.lesson03.translate.006
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сладкое는 "디저트"라는 뜻의 명사로 쓰이는 형용사예요.
    language_code: ko
    direction: ltr
