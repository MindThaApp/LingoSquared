schema_version: '1.0'
pack_key: practice.ko-ru.a1.unit35
source_language: ko
target_language: ru
unit_content_key: ru.a1.unit35.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_адрес
    - w_бабушке
    - w_дедушке
    - w_домой
    - w_идти
    - w_марка
    - w_отправляю
    - w_писать
    - w_письмо
    - w_пишет
    - w_пишу
    - w_покупает
    - w_посылка
    - w_почте
    - w_прийти
    - w_сотрудник
templates:
- content_key: practice.ko-ru.ru.a1.unit35.lesson01.choose.001
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_письмо
        - w_посылка
        - w_отправляю
        - w_дедушке
        - w_бабушке
        - w_марка
        - w_адрес
        - w_писать
        - w_пишу
        - w_прийти
        - w_идти
        - w_сотрудник
        - w_покупает
        - w_почте
        - w_пишет
        - w_домой
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 편지와 소포 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson02.listen.001
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 우표와 주소와 쓰기 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson03.translate.001
  lesson_content_key: ru.a1.unit35.lesson03.priyti_i_idti
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 도착하다와 시간이 걸리다 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson04.match.001
  lesson_content_key: ru.a1.unit35.lesson04.na_pochte
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 러시아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson05.choose.001
  lesson_content_key: ru.a1.unit35.lesson05.nastya_otpravlyaet_posylku
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어로, 나스탸가 소포를 보내는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson06.translate.001
  lesson_content_key: ru.a1.unit35.lesson06.domoy
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어예요: {item} (''집으로 돌아가요'' 수업에 나왔어요.)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson01.order.002
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: word_order
  frame:
    text: У меня есть {item} для дедушки.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_письмо
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня есть {item} для дедушки.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 할아버지께 드릴 편지가 있어요. письмо는 편지, 이메일이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson01.fill.003
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: fill_in_blank
  frame:
    text: Я {item} посылку в Самару. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отправляю
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отправляю
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 사마라로 소포를 보내요. отправляю는 '보내요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson01.translate.004
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: translation
  frame:
    text: 저는 사마라에 있는 할아버지와 할머니께 편지와 소포를 보내요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_дедушке
  answer_derivation:
    kind: render_frame
    frame:
      text: Я отправляю письмо и посылку в Самару, {item} и бабушке.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 사마라에 있는 할아버지와 할머니께 편지와 소포를 보내요. дедушке는 '할아버지'라는 뜻이에요(여격, '할아버지께'처럼 쓰여요).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson02.order.002
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: word_order
  frame:
    text: Я пишу {item} на посылке.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_адрес
  answer_derivation:
    kind: render_frame
    frame:
      text: Я пишу {item} на посылке.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 저는 소포에 주소를 써요. адрес는 '주소'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ru.ru.a1.unit35.lesson02.fill.003
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: fill_in_blank
  frame:
    text: Я покупаю марку и {item} адрес на посылке. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пишу
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пишу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 우표를 사고 소포에 주소를 써요. пишу는 '써요'라는 뜻이에요.
    language_code: ko
    direction: ltr
