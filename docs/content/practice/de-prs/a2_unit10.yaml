    kind: render_frame
    frame:
      text: '{opinion_phrase}'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: Eine Meinung beginnt mit به نظر من und nennt ihren Grund mit چون; das Verb steht am Ende.
    language_code: de
    direction: ltr
- content_key: practice.de-prs.prs.a2.unit10.lesson04.name_translate.002
