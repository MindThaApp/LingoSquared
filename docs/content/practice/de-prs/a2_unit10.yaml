schema_version: '1.0'
pack_key: practice.de-prs.a2.unit10
source_language: de
target_language: prs
unit_content_key: prs.a2.unit10.opinions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-prs by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to German). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - noun
  - proper_noun
  - phrase
  agreement_tags:
    semantic:
    - opinion_word
    - person_name
    - family_message_word
    - opinion_phrase
    - message_word
    - en_prs_a2_unit10_lesson02_words
    - en_prs_a2_unit10_lesson03_words
slot_presets:
  opinion_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: opinion_word
  person_name: &id003
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  family_message_word:
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: family_message_word
  opinion_phrase:
    language_code: prs
    part_of_speech: phrase
    agreement_tags:
      semantic: opinion_phrase
  clean_phrase: &id002
    language_code: prs
    part_of_speech: phrase
    agreement_tags:
      semantic:
      - en_prs_a2_unit10_lesson02_words
      - en_prs_a2_unit10_lesson03_words
  message_or_opinion_word: &id005
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - message_word
      - opinion_word
  unit_noun: &id004
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - opinion_word
      - family_message_word
templates:
- content_key: practice.de-prs.prs.a2.unit10.lesson01.opinion_gloss.001
  lesson_content_key: prs.a2.unit10.lesson01.opinions_vocabulary
  type: multiple_choice
  frame:
    text: '{opinion_word}'
    language_code: prs
    direction: rtl
  slots:
    opinion_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: opinion_word
  feedback_frame:
    text: '{opinion_word} wird verwendet, wenn man über Meinungen spricht.'
    language_code: de
    direction: ltr
- content_key: practice.de-prs.prs.a2.unit10.lesson01.opinion_translate.003
  lesson_content_key: prs.a2.unit10.lesson01.opinions_vocabulary
  type: translation
  frame:
    text: '{opinion_word}'
    language_code: de
    direction: ltr
    slot_rendering:
      opinion_word: english_gloss
  slots:
    opinion_word: *id001
  answer_derivation:
    kind: slot_text
    slot: opinion_word
  feedback_frame:
    text: '{opinion_word} ist das dari Wort dafür.'
    language_code: de
    direction: ltr
- content_key: practice.de-prs.prs.a2.unit10.lesson01.opinion_order.005
  lesson_content_key: prs.a2.unit10.lesson02.giving_an_opinion
  type: word_order
  frame:
    text: '{opinion_phrase}'
    language_code: prs
    direction: rtl
  slots:
    opinion_phrase: *id002
