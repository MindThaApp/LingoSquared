templates:
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.choose.001
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أب یعنی پدر و أم یعنی مادر؛ عندي یک کلمه است و یعنی «دارم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.listen.002
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة یعنی خانواده؛ همین کلمه با پسوند مالکیت، عائلتك، در درس بعد می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.match.003
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عندي مفهوم «دارم» را در یک کلمه می‌رساند؛ کلمه‌های خویشاوندی أب، أم، أخ و أخت هستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.order.004
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي به‌اضافه‌ی یک اسم یعنی «دارم»: عندي أخت یعنی من یک خواهر دارم.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.fill.005
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: fill_in_blank
  frame:
    text: عندي {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أخت یعنی خواهر؛ مذکرِ آن أخ است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.translate.006
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: این کلمه‌های خانوادگی اسم هستند؛ أب یعنی پدر و أم یعنی مادر.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: من یک خواهر دارم.
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'در عربی برای «یک» کلمه‌ای نداریم: عندي أخت یعنی همان «من خواهر دارم»، بدون هیچ کلمهٔ اضافه.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.translate.008
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: من یک برادر دارم.
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أخ (برادر) و أخت (خواهر) فقط در ت آخر فرق دارند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson01.order.009
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item} وأم.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item} وأم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'حرف ربط و (و) به کلمهٔ بعدی می‌چسبد: وأم یعنی «و مادر».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.listen.001
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: پسوند ـك در عائلتك یعنی «ـت / تان»، پس عائلتك یعنی «خانوادهٔ شما».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.choose.002
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: وقتی کسی را صدا می‌زنید یا خطاب می‌کنید، يا قبل از اسم می‌آید، مثل يا يوسف.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.match.003
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'پسوند ـك یعنی «ـت / تان»: عائلتك یعنی «خانوادهٔ شما» و أختك یعنی «خواهر شما».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ می‌پرسد «چه کسی در خانوادهٔ شماست؟»؛ يا يوسف یعنی خطاب به یوسف.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسم یعنی «نام»؛ ما اسم أختك؟ می‌پرسد «اسم خواهرتان چیست؟»
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و (و) به کلمهٔ بعدی چسبیده نوشته می‌شود، پس «و مادر» می‌شود وأم.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها از اسم به‌اضافهٔ ـها ساخته شده و یعنی «اسمش» (اسم او، برای زن).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'لیلا از یوسف می‌پرسد: اسم خواهرت چیه؟'
    language_code: fa
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك برای مخاطب مرد و زن یکسان نوشته می‌شود؛ اینجا مخاطب یوسف است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: اسمش نور است.
    language_code: fa
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها یعنی اسم به‌اضافهٔ ـها (او)، پس به کلمهٔ جداگانه‌ای برای «است» نیازی نیست.
    language_code: fa
    direction: rtl
