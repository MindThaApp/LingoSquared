templates:
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.choose.001
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الساعة از ال (حرف تعریف) و ساعة (ساعت) ساخته شده است؛ هم به معنی «ساعت» (یک ساعت) است و هم «زمانِ ساعت».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.match.002
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'عددهای ساعت مؤنث‌اند تا با الساعة هماهنگ شوند: الثالثة و الخامسة به ة ختم می‌شوند، برخلاف عددهای ترتیبی مذکر که برای تاریخ به کار می‌روند.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.order.003
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عدد ساعت درست بعد از الساعة می‌آید و با آن هماهنگ است، پس هر دو مؤنث‌اند: الساعة الثالثة.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.fill.004
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم الساعة؟ در اصل یعنی «ساعت چقدر است؟» و روش معمول پرسیدن ساعت است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.translate.005
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: صباحا یعنی «صبح» و بعد از ساعت می‌آید؛ برای عصر و شب در این درس از مساء استفاده می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.translate.006
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: ساعت سه است.
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عدد ترتیبیِ ساعت، الثالثة، مؤنث است تا با الساعة هماهنگ باشد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.translate.007
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: ساعت پنج صبح است.
    language_code: fa
    direction: rtl
  slots:
    a: *id006
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'زمانِ روز آخر جمله می‌آید: الساعة الخامسة صباحا.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.order.008
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة الخامسة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة الخامسة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: صباحا (صبح) را بعد از ساعت اضافه کنید، یا مساء را برای بعدازظهر و شب.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson02.listen.001
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: listen_select
