    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'ومتى از و («و») و متى («کی») ساخته شده است: «و کی؟». گوینده با آن سراغ سؤال دوم می‌رود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson02.order.003
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: word_order
  frame:
    text: الدرس في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة قبل از یک عدد، زمان یک رویداد را می‌گوید: ساعت سه.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson02.fill.004
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: fill_in_blank
  frame:
    text: كم الساعة؟ الساعة الثالثة. {item} الدرس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و در ومتى سؤال را به حرف قبلی وصل می‌کند، مثل «و» در «و کی؟».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson02.translate.005
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متى یعنی «کی؟» و ومتى یعنی «و کی؟»؛ فقط دومی ادامه‌ی سؤال قبلی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson02.translate.006
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: درس ساعت پنج است.
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة به‌اضافه‌ی عدد ساعت یعنی «در آن ساعت»: الدرس في الساعة الخامسة.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson01.listen.009
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: پایان مشترک ة نشان می‌دهد الثالثة و الخامسة عددهای ترتیبی مؤنث‌اند.
    language_code: fa
    direction: rtl
