  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: متى کلمه‌ی پرسشی «کی» است و درباره‌ی زمان می‌پرسد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit05.lesson02.match.002
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
