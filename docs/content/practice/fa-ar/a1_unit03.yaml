    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'حرف اضافهٔ «ب» به عدد چسبیده نوشته می‌شود: ب + خمسة می‌شود «بخمسة».'
    language_code: fa
    direction: rtl
