    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '«رقمي» یعنی شمارهٔ من: «رقم» یعنی شماره و پایانهٔ «ـي» یعنی «من/م».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
