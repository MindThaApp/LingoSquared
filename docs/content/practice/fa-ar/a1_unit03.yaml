  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: این چنده؟
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'در عربی در این جمله فعل «است» نمی‌آید: «كم هذا» تحت‌اللفظی یعنی «چقدر این».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson03.translate.006
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
