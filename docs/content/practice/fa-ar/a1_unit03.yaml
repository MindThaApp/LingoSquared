  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «كم هذا» قیمت یک چیز را می‌پرسد؛ «هذا» (این) شکل مذکر است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson03.translate.004
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
