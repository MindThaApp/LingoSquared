templates:
- content_key: practice.fa-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هر کلمهٔ عدد از راست به چپ خوانده می‌شود؛ «ثلاثة» با «ث» شروع می‌شود که شبیه «س» در فارسی تلفظ می‌شود (مثل «th» در «think» انگلیسی).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: «ثلاثة» (سه) و «ثمانية» (هشت) هر دو با «ث» شروع می‌شوند؛ بقیهٔ کلمه آن‌ها را از هم جدا می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: کلمهٔ «ثلاثة» (سه) به «ة» ختم می‌شود، همان پایانه‌ای که در بسیاری از اسم‌های عربی دیگر هم هست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عربی برای «دو تا» از چیزی پایانهٔ مثنی «ـان» دارد؛ «اثنان» خودِ کلمهٔ «دو» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اعداد سه تا ده هنگام شمردن به «ة» ختم می‌شوند، مثل «ثلاثة» و «خمسة».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«سبعة» (هفت) و «تسعة» (نه) به یک حرف‌ها (عة) ختم می‌شوند، پس به صدای اول گوش بدهید: «س» یا «ت».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
