templates:
- content_key: practice.ro-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب este verbul „îmi place”; după el urmează direct lucrul care îți place.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit14.lesson01.listen.002
