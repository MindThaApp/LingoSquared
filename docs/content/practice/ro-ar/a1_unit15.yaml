    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Adjectivul la comparativ are o singură formă pentru comparație, urmată de من: أقرب من înseamnă „mai aproape decât”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Comparativul se așază între cele două lucruri comparate, iar من (decât) stă înaintea celui de-al doilea.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'În arabă nu este nevoie de un cuvânt pentru „este”: المقهى أصغر من السوق înseamnă literal „cafeneaua mai mică decât piața”.'
    language_code: ro
    direction: ltr
