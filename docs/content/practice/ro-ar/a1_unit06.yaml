    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي urmat de un substantiv înseamnă „am”: عندي أخت înseamnă „am o soră”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson01.fill.005
