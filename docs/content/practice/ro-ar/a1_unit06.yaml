    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يا se pune înaintea unui nume când chemi sau te adresezi cuiva, ca în يا يوسف.
    language_code: ro
    direction: ltr
