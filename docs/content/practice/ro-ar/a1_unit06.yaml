  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aceste cuvinte despre familie sunt substantive; أب înseamnă tată, iar أم înseamnă mamă.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Am o soră.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Araba nu are articol nehotărât: عندي أخت înseamnă pur și simplu „am soră”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson01.translate.008
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
