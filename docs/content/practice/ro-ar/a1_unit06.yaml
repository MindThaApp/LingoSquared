    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Terminația ـك înseamnă „tău/ta”: عائلتك înseamnă „familia ta”, iar أختك înseamnă „sora ta”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ întreabă cine face parte din familia ta; يا يوسف i se adresează lui Yusuf.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسم înseamnă nume; ما اسم أختك؟ înseamnă „Cum o cheamă pe sora ta?”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و („și”) se scrie lipit de cuvântul următor, deci „și mamă” este وأم.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها este اسم plus ـها, ceea ce înseamnă „numele ei”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'Layla îl întreabă pe Yusuf: Cum o cheamă pe sora ta?'
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك se scrie la fel pentru un interlocutor bărbat sau femeie; aici i se adresează lui Yusuf.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: Numele ei este Nour.
    language_code: ro
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها înseamnă „numele” plus ـها („ei”), deci nu este nevoie de un cuvânt separat pentru „este”.
    language_code: ro
    direction: ltr
