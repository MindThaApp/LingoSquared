    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي („care”) stă înaintea unui substantiv singular; الثاني („al doilea”) stă după substantivul pe care îl descrie.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit16.lesson01.order.004
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد {item} إلى القاهرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Lucrul dorit urmează după أريد, iar إلى („spre, până la”) introduce destinația.
    language_code: ro
    direction: ltr
