    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit16.lesson01.translate.008
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Vreau un bilet până la Cairo, vă rog. (nu există un cuvânt separat pentru „eu”)
    language_code: ro
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: O cerere de bilet este أريد plus biletul plus إلى și destinația.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit16.lesson01.translate.009
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Vreau un bilet. Trenul pleacă la ora cinci. (nu există un cuvânt separat pentru „eu”)
    language_code: ro
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Ora se exprimă cu في الساعة plus un numeral ordinal feminin: الساعة الخامسة.'
    language_code: ro
    direction: ltr
