    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تذكرة înseamnă „bilet”; أريد („vreau”) nu are nevoie de un cuvânt separat pentru „eu”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit16.lesson01.translate.007
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
