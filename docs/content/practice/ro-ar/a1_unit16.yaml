    kind: render_frame
    frame:
      text: أريد تذكرة إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Destinația urmează direct după إلى; ال din القاهرة face parte din numele orașului.
    language_code: ro
    direction: ltr
