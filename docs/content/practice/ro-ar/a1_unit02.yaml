templates:
- content_key: practice.ro-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Araba marchează posesia printr-o terminație: اسم este „nume”, اسمي este „numele meu”, iar اسمك este „numele tău”.'
    language_code: ro
    direction: ltr
