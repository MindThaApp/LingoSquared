    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Terminația ـي înseamnă „meu” (اسمي), iar ـك înseamnă „tău” (اسمك); forma scrisă pentru „tău” este aceeași pentru un bărbat și pentru o femeie.
    language_code: ro
    direction: ltr
