  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد قميصا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد قميصا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Adjectivul stă după substantiv și se acordă cu el: قميصا أزرق.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit21.lesson01.fill.005
  lesson_content_key: ar.a1.unit21.lesson01.item_color
