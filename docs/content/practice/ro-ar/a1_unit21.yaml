templates:
- content_key: practice.ro-ar.ar.a1.unit21.lesson01.choose.001
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ملابس înseamnă „haine”, قميص înseamnă „cămașă”, iar أزرق înseamnă „albastru” (masculin).
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit21.lesson01.listen.002
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد قميصا أزرق înseamnă „Vreau o cămașă albastră”; قميص primește terminația ـا ca lucru dorit.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ar.ar.a1.unit21.lesson01.order.003
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد {item} أزرق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} أزرق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'După أريد, lucrul dorit are tanwin la final: قميصا, iar culoarea urmează după substantiv.'
    language_code: ro
    direction: ltr
