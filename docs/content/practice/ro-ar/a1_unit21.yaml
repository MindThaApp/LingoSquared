    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قميصا este forma folosită pentru lucrul dorit după أريد.
    language_code: ro
    direction: ltr
