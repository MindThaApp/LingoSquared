  lesson_content_key: pl.a1.unit50.lesson05.czytanie_repertuaru
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ لهستانی را به معنی فارسی‌اش وصل کنید؛ کلمه‌ها از درس‌های همین بخش هستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit50.lesson06.choose.001
  lesson_content_key: pl.a1.unit50.lesson06.marek_nina_i_ewa
