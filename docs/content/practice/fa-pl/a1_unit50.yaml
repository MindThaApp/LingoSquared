  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Farsi (Iran)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_miejsce
    - w_początek
    - w_publiczność
    - w_scena
    - w_trwa
    - w_trwać
    - w_wspaniały
    - w_wędrowcy
    - w_zadowolona
    - w_zespołu
    - w_zespół
templates:
- content_key: practice.fa-pl.pl.a1.unit50.lesson01.choose.001
  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zespół
        - w_zespołu
        - w_miejsce
        - w_trwać
        - w_trwa
        - w_scena
        - w_publiczność
        - w_zadowolona
        - w_wędrowcy
        - w_początek
        - w_wspaniały
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «می‌خوام برم کنسرت».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit50.lesson02.listen.001
  lesson_content_key: pl.a1.unit50.lesson02.chce_kupic_bilet
