    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «کنسرت ساعت چند شروع می‌شه؟».'
    language_code: fa
    direction: rtl
