    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu یعنی بعدازظهر، اما ظهر w południe است که پایانهٔ متفاوتی دارد.
    language_code: fa
    direction: rtl
