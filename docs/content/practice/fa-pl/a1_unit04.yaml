  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano یعنی صبح، wieczorem یعنی عصر و w nocy یعنی شب.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson02.listen.002
