  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie یعنی در چه ساعتی، و هر دو واژه پایانه‌ای می‌گیرند که بعد از o می‌آید.
    language_code: fa
    direction: rtl
