templates:
- content_key: practice.fa-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ساعت‌ها در لهستانی عدد ترتیبی مؤنث هستند (pierwsza، druga، trzecia)، چون با واژهٔ نگفتهٔ godzina هماهنگ می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: برای گفتن ساعت، در لهستانی pierwsza، druga، trzecia می‌گویند، نه pierwszy، drugi، trzeci.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ساعت‌ها عدد ترتیبی هستند: pierwsza تحت‌اللفظی یعنی «اول»، پس ساعت یک یعنی «ساعتِ اول».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: جواب Która jest godzina? فقط Jest + ساعت است، با عدد ترتیبی مؤنث.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? روش معمول پرسیدن ساعت است؛ که چون godzina مؤنث است، która هم مؤنث است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: ساعت سه است. (دو کلمه)
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ساعت عدد ترتیبی مؤنث است، پس ساعت سه trzecia می‌شود، نه trzy.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
