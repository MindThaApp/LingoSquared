templates:
- content_key: practice.fa-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'لهستانی دو شکل «شما/تو» دارد: ty برای دوستان و خانواده، و pan (برای مرد) یا pani (برای زن) برای غریبه‌ها و برای نشان دادن احترام.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'با pan یا pani فعل ma است، انگار می‌پرسید «آقا/خانم چطورند؟»؛ با ty فعل masz می‌شود: Jak się masz?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'pan و pani جای هم نمی‌نشینند: pan برای خطاب به مرد است و pani برای زن، و ty برای کسانی است که خوب می‌شناسید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? می‌پرسد حال کسی چطور است؛ pan یا pani وسط جمله می‌آید و فعل همان ma می‌ماند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: حالت چطوره؟ (به یک دوست، خودمانی)
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: با دوست، سؤال با masz تمام می‌شود؛ شکل رسمی از ma همراه با pan یا pani استفاده می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry سلام تمام روز تا شب است، dobry wieczór شب‌ها گفته می‌شود، و dobranoc فقط موقع خداحافظی برای رفتن به خواب گفته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć کلمه‌ی خودمانی هم برای سلام و هم برای خداحافظی است، پس به ty مربوط می‌شود، نه به pan یا pani.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia خداحافظی معمولی است؛ do zobaczenia «به امید دیدار» صمیمی‌تری است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór شب‌ها به کار می‌رود؛ در طول روز dzień dobry می‌گویید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć هم برای سلام و هم برای خداحافظی به کار می‌رود، اما فقط با کسانی که با ty خطابشان می‌کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: روز خوبی داشته باشید!
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia یک آرزو است، برای همین کلمه‌ی «روز» پایانش را به dnia تغییر می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'لهستانی معمولاً ضمیر را حذف می‌کند، چون پایان فعل شخص را نشان می‌دهد: jestem یعنی «هستم» و jesteś یعنی «هستی».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + نام کشور می‌گوید اهل کجا هستید، و mieszkam w + نام شهر می‌گوید کجا زندگی می‌کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'پایان فعل شخص را نشان می‌دهد: -m برای «من» (jestem, mieszkam) و -sz یا -ś برای «تو» ی خودمانی (masz, jesteś).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'بعد از z (به معنی «از»)، نام کشور پایان دیگری می‌گیرد: Kanady.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'سؤال رسمی درباره‌ی یک مرد از شکل سوم‌شخص مفرد فعل استفاده می‌کند: Czy pan mówi po polsku?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: اهل کجایی؟ (به یک دوست، خودمانی)
    language_code: fa
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd یعنی «از کجا»؛ با دوست فعل jesteś است، ولی شکل رسمی Skąd pan jest? می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: از آشنایی با شما خوشحالم.
    language_code: fa
    direction: rtl
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło تحت‌اللفظی یعنی «برای من خیلی خوشایند است» و جواب معمول موقع آشنایی با کسی است.
    language_code: fa
    direction: rtl
