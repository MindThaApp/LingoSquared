  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_szczęśliwy
        - w_smutny
        - w_nowe
        - w_deszcz
        - w_zdenerwowany
        - w_pierwszą
        - w_zmianą
        - w_martw
        - w_czuje
        - w_samodzielną
        - w_pracę
        - w_myślę
        - w_szczerze
        - w_mówiąc
        - w_poradzisz
        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این درس است، از بخش «خوشحال، غمگین یا عصبانی؟».'
    language_code: fa
    direction: rtl
