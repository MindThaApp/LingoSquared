    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame:
    text: Dlaczego jesteś {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_szczęśliwy
  answer_derivation:
    kind: render_frame
    frame:
      text: Dlaczego jesteś {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: چرا خوشحال هستید؟ Dlaczego (چرا) واژه پرسشی استاندارد برای پرسیدن دلیل است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'من عصبانی نیستم، غمگینم. Nie درست قبل از فعل می‌آید: Nie jestem zły. جمله دوم بعد احساس واقعی را می‌گوید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame:
    text: Jestem szczęśliwy, bo mam {item} mieszkanie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nowe
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem szczęśliwy, bo mam {item} mieszkanie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'من خوشحالم چون آپارتمان جدید دارم. Bo (چون) دلیل را معرفی می‌کند؛ بعد از mam (دارم) اسم در حالت مفعولی است: nowe mieszkanie.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: من غمگینم چون باران می‌آید. Pada deszcz (باران می‌آید، تحت‌اللفظی «باران می‌افتد») عبارت رایج برای هوا است که اینجا به‌عنوان دلیل آمده.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame:
    text: Jestem {item} przed pierwszą zmianą.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_zdenerwowany
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem {item} przed pierwszą zmianą.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: من قبل از اولین شیفتم مضطربم. zdenerwowany یعنی مضطرب (مذکر).
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سلام مارک، قبل از اولین شیفتت چه حسی داری؟ Przed pierwszą zmianą (درباره اولین شیفتت) همان الگوی przed + حالت ابزاری درس ۳ است. Czujesz się شکل ty است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: نگران نباش.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: نگران نباش. Nie martw się (تحت‌اللفظی «خودت را نگران نکن») عبارت دلداری رایج است؛ się ضمیر بازتابی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'مارک چه حسی دارد؟ Czuć się (احساس داشتن، بازتابی) روش استاندارد پرسیدن یا توصیف حالت احساسی است: Jak czuje się Marek?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: آره، من هم همین‌طور فکر می‌کنم. Ja też tak myślę (تحت‌اللفظی «من هم این‌طور فکر می‌کنم») روش طبیعی موافقت است؛ ja اینجا برای تأکید آمده.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: راستش کمی مضطربم. Szczerze mówiąc (راستش، تحت‌اللفظی «صادقانه گفتن») اعتراف را نرم‌تر می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نگران نباش، خوب از پسش برمی‌آیی! Dobrze sobie poradzisz (تحت‌اللفظی «خوب از پسش برمی‌آیی») عبارت ثابت دلگرم‌کننده است؛ poradzisz آینده ty از poradzić sobie است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: ممنون، واقعاً کمک می‌کند.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: مرسی، واقعاً کمک می‌کنه. Pomaga شکل «او» (on/ona/ono) از فعل pomagać (کمک کردن) است؛ dzięki شکل غیررسمی «مرسی» است.
    language_code: fa
    direction: rtl
