- content_key: practice.fa-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'من با چه کسی صحبت می‌کنم؟ Z kim rozmawiam? (تحت‌اللفظی: «با چه کسی دارم صحبت می‌کنم؟») عبارت استاندارد برای تماس‌گیرنده‌ای ناشناس است؛ kim حالت ابزاری بعد از z است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: می‌تونید این رو تکرار کنید؟ Możesz (می‌تونی، از móc) + مصدر powtórzyć (تکرار کردن) + to (این).
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لطفاً این‌قدر تند حرف نزنید. Nie mów امر منفی است (حرف نزن)؛ tak szybko یعنی «این‌قدر تند».
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: صدات رو خوب نمی‌شنوم.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: صدای شما رو خوب نمی‌شنوم. Nie słyszę cię dobrze مشکل شنیدن را بیان می‌کند؛ cię حالت مفعولی ty است و dobrze یعنی «خوب».
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'اولین شیفتت چطور بود؟ Jak ci poszła ...? (تحت‌اللفظی: «... برای تو چطور رفت؟») درباره چیزی می‌پرسد که قبلاً اتفاق افتاده. ci حالت مفعول غیرمستقیم ty است و poszła با اسم مؤنث zmiana هماهنگ شده است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اولین شیفتش واقعاً خوب پیش رفت. Jego (مال او) هیچ‌وقت تغییر نمی‌کند و قبل از اسم می‌آید: jego pierwsza zmiana؛ مؤنث بودن اسم روی آن اثری ندارد.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: واقعاً خوب پیش رفت، بهتر از چیزی که فکر می‌کردم.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: واقعاً خوب پیش رفت، بهتر از چیزی که فکر می‌کردم. Poszło گذشته‌ی iść با پایان -o است («آن»؛ اینجا به معنی «پیش رفتن، از آب درآمدن»)؛ myślałem گذشته‌ی myśleć (فکر کردن) با پایان مخصوص گوینده‌ی مرد است.
    language_code: fa
    direction: rtl
