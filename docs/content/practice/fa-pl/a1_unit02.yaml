templates:
- content_key: practice.fa-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در زبان لهستانی الگویی که اعداد یک تا ده را به هم وصل کند وجود ندارد، برای همین باید هر کلمه را جداگانه یاد گرفت.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در لهستانی sz مثل «ش» و cz مثل «چ» خوانده می‌شود، برای همین sześć و cztery با این صداها شروع می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ć آخر کلمه‌های pięć، sześć، dziewięć و dziesięć صدایی نرم و شبیه «چ» است؛ علامت روی حرف در املا مهم است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
