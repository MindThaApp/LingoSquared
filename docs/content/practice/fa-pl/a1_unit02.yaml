      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: lat بعد از اعدادی مثل pięć، dwadzieścia یا trzydzieści می‌آید؛ lata بعد از dwa، trzy، cztery و اعداد مرکبی که به آن‌ها ختم می‌شوند، مثل trzydzieści dwa lata.
    language_code: fa
    direction: rtl
