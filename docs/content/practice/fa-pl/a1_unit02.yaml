    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + عدد + lat یعنی سن را می‌گویید، مثل Mam trzydzieści lat.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile یعنی «چقدر» یا «چند تا»، و kosztuje فعلی است که موقع پرسیدن قیمت همراه آن می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اعداد jedenaście، dwanaście و piętnaście به -naście ختم می‌شوند و همین نشان می‌دهد که از ۱۱ تا ۱۹ هستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile برای قیمت یعنی «چقدر» و برای چیزهای قابل شمارش یعنی «چند تا».
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: بعد از اعدادی مثل pięć، dwanaście یا trzydzieści کلمهٔ złotych می‌آید، ولی بعد از dwa، trzy و cztery کلمهٔ złote.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: złotych شکلی است که بعد از pięć، dwadzieścia، pięćdziesiąt و اعداد مشابه می‌آید؛ بعد از dwa، trzy و cztery شکل złote به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: این چقدر است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? جملهٔ استاندارد برای پرسیدن قیمت است که در آن to یعنی «این» یا «آن».
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: pana شکل رسمیِ «شما» برای یک آقاست (pana numer)، و twój شکل صمیمی است (twój numer).
    language_code: fa
    direction: rtl
