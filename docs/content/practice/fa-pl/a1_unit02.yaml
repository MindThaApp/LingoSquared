  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: pięć، sześć، dziewięć و dziesięć به حرف ć ختم می‌شوند، ولی siedem و osiem نه؛ پس املای هر کدام را باید با دقت یاد گرفت.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
