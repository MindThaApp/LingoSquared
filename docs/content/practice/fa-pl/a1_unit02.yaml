  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: numer telefonu یعنی «شمارهٔ تلفن»، و کلمهٔ دوم شکل تغییریافتهٔ کلمهٔ «تلفن» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: twój شکل صمیمیِ «شما» و pana شکل رسمی برای یک آقاست؛ هر دو می‌توانند قبل از numer telefonu بیایند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
