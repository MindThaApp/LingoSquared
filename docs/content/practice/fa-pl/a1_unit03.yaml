templates:
- content_key: practice.fa-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در لهستانی اسم روزهای هفته و ماه‌ها با حرف کوچک شروع می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Środa، sobota و niedziela به -a ختم می‌شوند، ولی چهار روز دیگر به یک حرف بی‌صدا؛ این تفاوت پایان در عبارت w + روز اهمیت دارد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dziś یعنی امروز، و tygodnia شکل تغییریافته‌ی کلمه‌ی «هفته» است، مثل dzień tygodnia.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: با w (در)، poniedziałek و czwartek و piątek شکلشان را نگه می‌دارند، ولی wtorek برای راحت‌تر تلفظ شدن می‌شود we wtorek.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina یعنی «می‌روم سینما»، و w + روز هفته یعنی «در آن روز».
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia یعنی روز هفته، و کلمه‌ی دوم پایانش را به tygodnia تغییر می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اسم ماه‌ها در لهستانی حرف بزرگ لازم ندارند و پیشوند یا حرف تعریفی هم ندارند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در تاریخ گفتاری، اول روز می‌آید که به -ego ختم می‌شود، بعد ماه با شکل تاریخی‌اش که معمولاً به -a ختم می‌شود (dziesiątego maja)، ولی برای فوریه lutego است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ماه‌ها در لهستانی با حرف کوچک نوشته می‌شوند، و urodziny (تولد) همیشه جمع است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بعضی ماه‌ها به -eń ختم می‌شوند (styczeń، kwiecień، sierpień، wrzesień)؛ این به شناختنشان کمک می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.order.005
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: word_order
  frame:
    text: Spotkanie jest piętnastego {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: در تاریخ، روز به -ego ختم می‌شود و ماه -a می‌گیرد، به‌جز lutego برای فوریه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.fill.006
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: fill_in_blank
  frame:
    text: Kiedy są twoje {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Urodziny در لهستانی جمع است، برای همین فعل są (هستند) می‌آید، نه jest.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson02.translate.007
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: جلسه کِی است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Kiedy jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kiedy یعنی «کی»، و اسم مفرد مثل spotkanie با jest می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson03.choose.001
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Panu و ci هر دو یعنی «به شما/به تو»؛ panu رسمی و برای یک آقاست و ci دوستانه است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson03.translate.002
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Możemy شکل «ما»ی فعل «توانستن» است، مثل Kiedy możemy się znowu spotkać?
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson03.order.003
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: word_order
  frame:
    text: Czy piątek {item} odpowiada?
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy piątek {item} odpowiada?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Odpowiada کسی را که از او پرسیده می‌شود در حالت داتیو می‌گیرد: panu (رسمی، برای یک آقا) یا ci (دوستانه).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-pl.pl.a1.unit03.lesson03.fill.004
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: fill_in_blank
  frame:
    text: Kiedy możemy się znowu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از możemy، فعل دوم به شکل پایه‌اش می‌ماند: spotkać.'
    language_code: fa
    direction: rtl
