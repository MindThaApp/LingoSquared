  feedback_frame:
    text: Un'acqua آپوستروف را نگه می‌دارد چون acqua مؤنث است و با مصوت شروع می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson03.listen.004
