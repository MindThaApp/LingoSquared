  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per favore یعنی «لطفاً» و در آخر درخواست می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: یک قهوه و یک کروسان می‌خواهم، لطفاً.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un با اسم‌های مذکر مثل caffè و cornetto می‌آید؛ per favore درخواست را ختم می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: چه می‌خواهین؟ (رسمی، Lei)
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera شکل رسمی Lei است که خدمت‌کار به کار می‌برد، نه شکل غیررسمی tu.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson03.choose.001
