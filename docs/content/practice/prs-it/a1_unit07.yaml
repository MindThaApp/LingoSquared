  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Per favore عبارت مؤدبانه‌ای است که به هر سفارش اضافه می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson01.order.003
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: word_order
  frame:
    text: Vorrei un caffè e un {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vorrei یعنی «می‌خواهم» و راه مؤدبانهٔ سفارش دادن است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson01.fill.004
  lesson_content_key: it.a1.unit07.lesson01.al_bar
