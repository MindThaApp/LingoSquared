    slot: item
  feedback_frame:
    text: Basta così عبارت ثابتی است به معنای «همین کافی است، دیگر نه».
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
