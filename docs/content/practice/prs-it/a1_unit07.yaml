- content_key: practice.prs-it.it.a1.unit07.lesson03.translate.008
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: یک ساندویچ و یک آب، لطفاً.
    language_code: prs
