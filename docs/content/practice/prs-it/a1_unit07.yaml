    slot: item
  feedback_frame:
    text: Basta یعنی «کافی است»؛ basta così به خدمت‌کار می‌گوید که بس است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit07.lesson02.translate.002
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
