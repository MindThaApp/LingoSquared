    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al chilo یعنی کیلویی؛ راه معمول قیمت‌گذاری میوه و سبزی.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.fill.006
