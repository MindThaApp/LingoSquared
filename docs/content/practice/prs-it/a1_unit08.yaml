    slot: item
  feedback_frame:
    text: Lo prendo یعنی «می‌گیرمش»؛ lo به یک چیز مذکر برمی‌گردد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
