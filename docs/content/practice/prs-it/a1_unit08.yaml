  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele، banane، pomodori و patate اینجا جمع اند، چون خریدار آن‌ها را کیلویی می‌خرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson03.choose.002
