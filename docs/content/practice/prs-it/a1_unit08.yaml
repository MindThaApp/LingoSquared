    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele، banane و patate جمع مؤنث اند و le می‌گیرند؛ pomodori جمع مذکر است و i می‌گیرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano le {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Le با اسم‌های جمع مؤنث می‌آید و costano فعل جمع است، چون قیمت چند چیز پرسیده می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano i {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano i {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pomodori جمع مذکر است، پس i می‌گیرد، نه le.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.fill.005
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
