    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo شکل «من» فعل prendere (گرفتن) است و برای قبول کردن قیمت به کار می‌رود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson03.translate.006
