templates:
- content_key: practice.prs-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele جمع mela است: اسم‌های مؤنث که به -a ختم می‌شوند، جمعشان را با -e می‌سازند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.listen.002
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
