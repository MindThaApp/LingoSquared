  feedback_frame:
    text: Va bene راه خیلی معمول گفتن «خوب است» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson03.fill.004
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: fill_in_blank
  frame:
    text: Va bene, {item} prendo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
