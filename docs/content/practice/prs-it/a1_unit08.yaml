  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo یعنی «آن را» و پیش از فعل می‌آید: lo prendo.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
