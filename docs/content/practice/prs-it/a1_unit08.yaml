  type: translation
  frame:
    text: خوب است، می‌گیرمش.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo راه معیاری تمام کردن یک خرید است.
    language_code: prs
    direction: rtl
