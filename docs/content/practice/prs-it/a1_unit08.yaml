- content_key: practice.prs-it.it.a1.unit08.lesson01.translate.007
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: سیب‌ها چند است؟
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto {item} le mele?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'اسم‌های جمع با costano می‌آیند: quanto costano le mele.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: کیلویی سه یورو است.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'بعد از عدد، euro در ایتالیایی تغییر نمی‌کند: tre euro.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: لطفاً یک کیلو سیب می‌خواهم.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di مقدار را به چیز وصل می‌کند: un chilo di mele.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit08.lesson01.translate.010
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
