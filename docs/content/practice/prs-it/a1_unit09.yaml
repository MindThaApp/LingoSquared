    - fifth
    - sixth
  feedback_frame:
    text: Vicino یعنی نزدیک؛ qui vicino یعنی نزدیک اینجا.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: معذرت، دواخانه کجاست؟ (رسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi شکل امری رسمی است و برای شخص ناآشنا مناسب است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il یا la با جنسیت اسم تغییر می‌کند، اما پیش از حرف صدادار l'' می‌آید: l''ufficio.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è می‌پرسد یا می‌گوید که چیزی هست؛ ce n'è با «یکی‌اش» جواب می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ce n'è una یعنی «یکی هست»؛ ne به معنی «از آن‌ها» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
