templates:
- content_key: practice.prs-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia، la banca و la stazione مؤنث استند؛ l'ufficio postale مذکر است و حرف تعریفش کوتاه شده است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via می‌تواند معنی سرک یا جاده را بدهد و در نام‌هایی مثل Via Roma می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la با یک اسم مؤنث می‌پرسد که یک جا کجاست؛ scusi شکل رسمی «معذرت» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
  frame:
    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino یعنی نزدیک، همین‌جا نزدیک.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson01.match.005
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: matching_pairs
