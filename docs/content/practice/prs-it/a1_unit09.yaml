    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alla پیش از اسم مؤنث، a و la را یکجا می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson02.translate.007
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: نزدیک اینجا بانک هست؟
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'è una {item} qui vicino?
      language_code: it
      direction: ltr
  feedback_frame:
    text: در C'è una banca qui vicino? از una کار گرفته شده، چون banca مؤنث است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson02.translate.008
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: بلی، یکی نزدیک اینجا هست.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una یعنی «یکی‌اش هست».
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit09.lesson02.translate.009
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: پهلوی ایستگاه است.
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} alla stazione.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Accanto alla stazione یعنی «پهلوی ایستگاه».
    language_code: prs
    direction: rtl
