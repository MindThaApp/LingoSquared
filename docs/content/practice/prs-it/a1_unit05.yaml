    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mezzo یعنی نیم و quarto یعنی ربع؛ اول ساعت می‌آید، بعد e یا meno.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson02.translate.006
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: ساعت چهار ربع کم است.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le quattro meno un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Meno از ساعت بعدی کم می‌کند: le quattro meno un quarto یعنی 3:45.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson02.translate.007
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: ساعت سه و نیم است.
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: E mezzo، یعنی «و نیم»، راه معمول گفتن نیم‌ساعت بعد از ساعت است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson03.choose.001
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Alle یعنی «در ساعت» (جمع مؤنث) و برای وقت ساعت به کار می‌رود: alle tre، یعنی ساعت سه.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson03.listen.002
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ora یعنی ساعت یا وقت؛ ore جمع آن است، به همین دلیل پرسش Che ore sono? است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson03.order.003
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: word_order
  frame:
    text: A che {item} ci vediamo?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: A che {item} ci vediamo?
      language_code: it
      direction: ltr
  feedback_frame:
    text: A che ora می‌پرسد که در چه وقت؛ ora اینجا مفرد است، چون یک لحظه را می‌پرسد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson03.fill.004
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: fill_in_blank
  frame:
    text: Ci vediamo {item} tre e mezzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alle با همهٔ ساعت‌ها به کار می‌رود، جز ساعت یک که می‌گویی all'una.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson03.translate.005
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: ساعت سه و نیم همدیگر را می‌بینیم.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo {item} tre e mezzo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle به‌علاوهٔ یک وقت، راه معمول برای تعیین وقت ملاقات است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson03.translate.006
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mattina یعنی صبح و sera یعنی شب؛ در ایتالیایی پیش از آن‌ها di می‌آید: di mattina، di sera.'
    language_code: prs
    direction: rtl
