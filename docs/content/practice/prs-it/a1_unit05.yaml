  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'E un quarto پانزده دقیقه اضافه می‌کند: le tre e un quarto یعنی 3:15.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson02.fill.004
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
