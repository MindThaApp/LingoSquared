templates:
- content_key: practice.prs-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'برای گفتن ساعت، le (جمع مؤنث) به کار می‌رود، چون ore (ساعت‌ها) جمع مؤنث است: sono le tre.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ساعت یک استثنا است: l''una مفرد است، پس با è می‌آید، نه با sono.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: word_order
  frame:
    text: Che {item} sono?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} sono?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che ore sono? در اصل می‌پرسد «ساعت‌ها چند استند»، به همین دلیل جواب با sono le شروع می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson01.fill.004
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: fill_in_blank
  frame:
    text: Sono {item} tre. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le با ore هماهنگ است که در جمله نمی‌آید: sono le tre یعنی ساعت سه است.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson01.translate.005
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: translation
  frame:
    text: ساعت {n} است.
    language_code: prs
    direction: rtl
    slot_rendering:
      n: english_gloss
  slots:
    n: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le {n}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono le برای همهٔ ساعت‌ها به کار می‌رود، جز ساعت یک که l'una است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson02.choose.001
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'E دقیقه‌ها را اضافه می‌کند و meno کم می‌کند: le tre e mezzo یعنی 3:30 و le quattro meno un quarto یعنی 3:45.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson02.listen.002
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mezzo دو z دارد؛ صدا را کمی درازتر ادا کن.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit05.lesson02.order.003
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: word_order
