    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'آخر کلمه جنسیت را نشان می‌دهد: -o برای مرد (americano)، -a برای زن (americana).'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'در ایتالوی ملیت‌ها و زبان‌ها با حرف بزرگ نوشته نمی‌شوند: italiano، inglese.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: تو از کجا می‌آیی؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di dove sei? سوال tu است؛ شکل مؤدبانهٔ Lei این است: Di dov''è, Lei?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'آخر فعل نشان می‌دهد کی کار را می‌کند: parlo یعنی من حرف می‌زنم، parli یعنی تو (غیررسمی) حرف می‌زنی، parla یعنی شما (رسمی) یا او حرف می‌زند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Parli و parla شبیه هم شنیده می‌شوند: آخرین مصوت نشان می‌دهد tu (-i) است یا Lei (-a).'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'بعد از parlare معمولاً زبان حرف تعریف نمی‌خواهد: parlo inglese، parlo italiano.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? می‌پرسد چند وقت است که می‌خوانید؛ ایتالوی با da (برای/از) زمان حال را به کار می‌برد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: انگلیسی حرف می‌زنی؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Parli شکل tu است؛ برای شخص ناآشنا شکل Lei را می‌گویید: Parla inglese?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai و fa هر دو شکل‌های fare استند: fai برای tu، fa برای Lei یا او.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ingegnere روی هجای ماقبل آخر تکیه دارد: in-ge-GNE-re.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? در اصل می‌پرسد چه کار می‌کنی؛ شکل مؤدبانه‌اش Che lavoro fa, Lei? است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai شکل tu فعل fare است؛ با Lei به fa تبدیل می‌شود.
    language_code: prs
    direction: rtl
