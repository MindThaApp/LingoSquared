templates:
- content_key: practice.prs-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ملیت‌ها با گوینده تغییر می‌کنند: americano برای مرد، americana برای زن؛ italiano و italiana هم همین‌طور.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? را از دوست می‌پرسید که از کجاست؛ به شخص ناآشنا می‌گویید Di dov'è, Lei?
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'نام شهرها در ایتالوی اغلب فرق دارد: Milano همان میلان است.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit02.lesson01.match.004
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: matching_pairs
