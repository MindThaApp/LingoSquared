      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figli جمع figlio است و هم پسران و هم دختران را در بر می‌گیرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson03.translate.005
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
