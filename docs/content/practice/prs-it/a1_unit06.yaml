templates:
- content_key: practice.prs-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'با صفت ملکی، اسم‌های مفرد خانواده حرف تعریف نمی‌گیرند: mio padre, mia madre.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre و madre هر دو به -e ختم می‌شوند اما جنسیت شان فرق دارد، پس هر کدام را با جنسیت اش یاد بگیرین؛ nonno و nonna به -o و -a ختم می‌شوند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo و mio مذکر استند، پس با اسم مذکر می‌آیند: questo è mio padre.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa و mia مؤنث استند و با madre هماهنگ می‌شوند: این مادر من است.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: این مادر من است.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: questa و mia را با اسم مؤنث به کار ببرید و questo و mio را با اسم مذکر.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Madre و padre، fratello و sorella، nonno و nonna جوره‌های مذکر و مؤنث کلمه‌های خانواده استند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli جمع fratello است و می‌تواند به معنای برادر و خواهر (هم‌شیرها) هم باشد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito و moglie یعنی شوهر و زن؛ moglie به -e ختم می‌شود اما مؤنث است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Un با اسم مذکر می‌آید و una با اسم مؤنث: un fratello, una sorella.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
