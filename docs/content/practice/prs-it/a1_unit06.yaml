    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'جمع sorella می‌شود sorelle: ختم -a به -e تبدیل می‌شود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: یک برادر و یک خواهر دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho یعنی «دارم»؛ پیش از اسم مذکر un و پیش از اسم مؤنث una را به کار ببرید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: برادر یا خواهر داری؟ (غیررسمی، tu)
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai شکل غیررسمی tu برای «داشتن» است، پس این سوال برای دوست یا همکار است.
    language_code: prs
    direction: rtl
