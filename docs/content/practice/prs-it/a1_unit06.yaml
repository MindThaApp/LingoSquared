  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figlio و figlia یعنی پسر و دختر؛ maschio و femmina یک پسر و یک دختر را در بین فرزندان تان توصیف می‌کنند.
    language_code: prs
    direction: rtl
