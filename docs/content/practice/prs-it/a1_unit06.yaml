    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'کلمه‌های خانواده جوره‌های مذکر و مؤنث دارند: marito و moglie، figlio و figlia.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson03.choose.002
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli در حالت کلی یعنی فرزندان؛ figlio و figlia یعنی پسر و دختر.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Maschio و femmina برای پسر و دختر در خانواده به کار می‌روند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit06.lesson03.fill.004
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
