  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille یعنی هزار، پس grazie mille تشکر گرم و یعنی «خیلی تشکر».
    language_code: prs
    direction: rtl
