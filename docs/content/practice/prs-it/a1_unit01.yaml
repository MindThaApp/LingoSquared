    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere هم اسم «لذت» است و هم جوابی که وقت آشنایی می‌تین: خوشحال شدم.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
