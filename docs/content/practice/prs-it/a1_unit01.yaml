  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: نامم Elena است.
    language_code: prs
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: ایتالیایی می‌گوید mi chiamo، یعنی «خود را صدا می‌کنم»، در حالی که در دری می‌گوییم «نامم ... است».
    language_code: prs
    direction: rtl
