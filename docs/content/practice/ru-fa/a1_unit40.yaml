- content_key: practice.ru-fa.fa.a1.unit40.lesson01.match.003
  lesson_content_key: fa.a1.unit40.lesson01.new_lost_items_one
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}'
    language_code: fa
    direction: rtl
  slots:
    first: &id001
      language_code: fa
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic:
        - lost_item_word
        - lost_found_verb_word
        - notice_status_word
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
    seventh: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  feedback_frame:
    text: Потерянные вещи, глаголы «потерять» и «найти» и слова о состоянии вещи в объявлении из этого урока.
    language_code: ru
    direction: ltr
