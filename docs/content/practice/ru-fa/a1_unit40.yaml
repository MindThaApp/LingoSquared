schema_version: '1.0'
pack_key: practice.ru-fa.a1.unit40
source_language: ru
target_language: fa
unit_content_key: fa.a1.unit40.lost_items
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fa by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - lost_item_word
    - lost_found_verb_word
    - notice_status_word
    - courtesy_title_word
    - person_name
    - reviewed_phrase
    - en_fa_a1_unit40_lesson04_words
templates:
- content_key: practice.ru-fa.fa.a1.unit40.lesson01.choose.001
  lesson_content_key: fa.a1.unit40.lesson01.new_lost_items_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic:
        - lost_item_word
        - lost_found_verb_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из темы «бюро находок» в этом уроке.'
    language_code: ru
    direction: ltr
