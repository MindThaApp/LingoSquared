    - phrase
    agreement_tags:
      semantic:
      - advice_word
      - advice_phrase
templates:
- content_key: practice.ru-fa.fa.a1.unit17.lesson01.symptom_choice.001
  lesson_content_key: fa.a1.unit17.lesson01.basic_symptoms
  type: multiple_choice
  frame:
    text: '{symptom_word}'
    language_code: fa
    direction: rtl
  slots:
    symptom_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: symptom_word
  feedback_frame:
    text: '{symptom_word} описывает, как себя чувствует человек.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fa.fa.a1.unit17.lesson01.symptom_have_order.002
  lesson_content_key: fa.a1.unit17.lesson01.basic_symptoms
  type: word_order
  frame:
    text: '{symptom_noun_word} دارم'
    language_code: fa
    direction: rtl
  slots:
    symptom_noun_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{symptom_noun_word} دارم'
      language_code: fa
      direction: rtl
  feedback_frame:
    text: دارم означает «у меня есть», как в سردرد دارم (у меня болит голова).
    language_code: ru
    direction: ltr
