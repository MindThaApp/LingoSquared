    - noun
    - verb
    - phrase
    agreement_tags:
      semantic: help_word
  help_phrase: &id004
    language_code: fa
    part_of_speech: phrase
    agreement_tags:
      semantic: help_word
  advice_word: &id006
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: advice_word
  advice_phrase: &id007
    language_code: fa
    part_of_speech: phrase
