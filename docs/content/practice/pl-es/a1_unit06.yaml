  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café, menú i sándwich mają akcent pisany; wskazuje on sylabę akcentowaną.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un stoi przy rzeczownikach rodzaju męskiego (un café); rzeczowniki rodzaju żeńskiego mają una (una ensalada).
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: Chcę {item}, poproszę.
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Inny częsty sposób zamawiania to para mí + danie: para mí, un café.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
