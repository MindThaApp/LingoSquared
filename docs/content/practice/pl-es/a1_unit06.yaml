    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Czy możemy zobaczyć menu? ¿Podemos + bezokolicznik? to uprzejmy sposób proszenia o coś.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: Smacznego!
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho mówi się osobom, które zaraz zaczną jeść, nawet obcym przy sąsiednim stoliku.
    language_code: pl
    direction: ltr
