    slot: item
  feedback_frame:
    text: 'Agua jest rodzaju żeńskiego, ale w liczbie pojedynczej występuje z el, bo zaczyna się od akcentowanego a: el agua fría.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit06.lesson01.listen.002
