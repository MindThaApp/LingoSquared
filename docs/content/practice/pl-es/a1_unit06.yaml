    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Czasownik querer zmienia temat: quiero, quieres, quiere, ale queremos.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit06.lesson03.order.001
