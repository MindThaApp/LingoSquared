  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Vives cerca de tus {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cerca de znaczy „blisko”; tus to liczba mnoga od tu, czyli „twój”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit03.lesson05.fill.001
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
