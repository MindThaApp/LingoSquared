    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Somos cinco dosłownie znaczy „jesteśmy pięcioma”: jest nas pięcioro.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit03.lesson04.order.003
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: word_order
