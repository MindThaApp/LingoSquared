    slot: item
  feedback_frame:
    text: Vive znaczy „on/ona mieszka”, a viven „oni mieszkają”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit03.lesson06.listen.001
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
