  frame:
    text: Mi hermana {item} se llama Sofía. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Menor stoi po rzeczowniku i nie zmienia się w zależności od rodzaju: mi hermano menor, mi hermana menor.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit03.lesson05.choose.002
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
