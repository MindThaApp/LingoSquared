  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Banco znaczy też ławka; w tej lekcji to bank przy ulicy.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson01.order.003
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: word_order
  frame:
    text: La {item} está cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} está cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Gdy mówisz, gdzie coś jest, używaj estar: la farmacia está cerca.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson01.translate.004
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: translation
  frame:
    text: '{item} jest obok targu.'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está al lado del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'De + el łączy się w del: al lado del mercado, obok targu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson02.fill.001
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: fill_in_blank
  frame:
    text: La farmacia está {item} del mercado. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Enfrente de, al lado de, lejos de i cerca de wymagają de przed nazwą miejsca.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson02.order.002
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: word_order
  frame:
    text: El parque está {item} del mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El parque está {item} del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Park jest daleko od targu. Przeciwieństwo to cerca de, blisko.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson02.translate.003
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: translation
  frame:
    text: Biblioteka jest między bankiem a parkiem.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La biblioteca está {item} el banco y el parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Entre łączy dwa miejsca spójnikiem y i nie ma po sobie de.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson04.fill.001
  lesson_content_key: es.a1.unit08.lesson04.preguntar_si_esta_lejos
  type: fill_in_blank
  frame:
    text: Sí, está {item} lejos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bastante znaczy „dość”: bastante lejos, dość daleko; bastante cerca, dość blisko.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson05.match.001
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En este barrio hay muchos lugares útiles: hay wprowadza to, co znajduje się w danym miejscu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson05.translate.002
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Útil w liczbie mnogiej ma formę útiles, bo kończy się na spółgłoskę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson06.choose.001
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Donde bez akcentu łączy dwie myśli; ¿dónde? z akcentem zadaje pytanie.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit08.lesson06.translate.002
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: translation
  frame:
    text: To obok targu, gdzie kupiliśmy jajka.
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Está al lado del mercado donde {item} los huevos.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Compramos znaczy zarówno „kupujemy”, jak i „kupiliśmy”; czas wynika z kontekstu.
    language_code: pl
    direction: ltr
