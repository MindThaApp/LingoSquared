templates:
- content_key: practice.pl-es.es.a1.unit10.lesson01.choose.001
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tiempo znaczy zarówno „pogoda”, jak i „czas”: ¿Qué tiempo hace? pyta o pogodę.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson01.listen.002
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lluvia to rzeczownik „deszcz”; llueve to czasownik „pada”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson02.order.001
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: En julio hace {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Pogodę po hiszpańsku opisuje się czasownikiem hacer z rzeczownikiem: hace calor, dosłownie „robi gorąco”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson02.translate.002
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: translation
  frame:
    text: W grudniu jest zimno.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: En diciembre hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Frío po hace to rzeczownik; „bardzo zimno” to hace mucho frío, a nie muy frío.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson02.fill.003
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: fill_in_blank
  frame:
    text: Hoy {item} y hace frío. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Llover nie potrzebuje podmiotu: llueve znaczy po prostu „pada”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson02.order.004
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: Hoy está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Dziś jest pochmurno. Nublado to przymiotnik, więc łączy się z está, a nie z hace.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson04.fill.001
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: fill_in_blank
  frame:
    text: Necesitamos agua {item} hace calor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Porque, jedno słowo bez akcentu, znaczy „ponieważ”; ¿por qué?, dwa słowa z akcentem, pyta „dlaczego”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson04.translate.002
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: translation
  frame:
    text: W lipcu jest zbyt gorąco.
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item} calor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Demasiado znaczy „zbyt dużo” i stoi przed rzeczownikiem: demasiado calor.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson05.match.001
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Es importante + bezokolicznik wyraża radę: es importante llevar agua.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson05.translate.002
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Hiszpańskie słowa o pogodzie: sol, lluvia, viento i nube to rzeczowniki; nublado to przymiotnik.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson06.choose.001
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Prefiero pochodzi od preferir; e zmienia się w ie: prefiero, prefieres.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson06.translate.002
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: translation
  frame:
    text: Masz rację. (nieformalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Tienes {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Po hiszpańsku „mieć rację” wyraża się czasownikiem tener: tener razón.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit10.lesson06.order.003
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: word_order
  frame:
    text: Hay una {item} cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay una {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: W pobliżu jest sklep. Tienda jest rodzaju żeńskiego, więc występuje z una.
    language_code: pl
    direction: ltr
