  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_barco
    - w_dieciséis
    - w_elefante
    - w_entradas
    - w_jirafa
    - w_leones
    - w_león
    - w_mono
    - w_pesado
