  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_león
        - w_elefante
        - w_pesado
        - w_mono
        - w_jirafa
        - w_leones
        - w_entradas
        - w_dieciséis
        - w_barco
