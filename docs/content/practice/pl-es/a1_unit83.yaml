  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_función
        - w_popular
        - w_telón
        - w_actores
        - w_obra
        - w_descanso
        - w_butacas
        - w_butaca
        - w_satisfecho
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z lekcji „Idziemy dziś do teatru?”.'
    language_code: pl
    direction: ltr
