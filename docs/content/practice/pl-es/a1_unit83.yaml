  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actores
    - w_butaca
    - w_butacas
    - w_descanso
    - w_función
    - w_obra
    - w_popular
    - w_satisfecho
    - w_telón
templates:
