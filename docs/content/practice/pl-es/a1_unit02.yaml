templates:
- content_key: practice.pl-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno skraca się do un przed rzeczownikiem rodzaju męskiego (un huevo), a przed żeńskim zmienia się w una (una taza).
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
