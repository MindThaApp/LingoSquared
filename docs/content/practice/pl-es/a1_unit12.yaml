templates:
- content_key: practice.pl-es.es.a1.unit12.lesson01.choose.001
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Przymiotniki opisujące uczucia kończą się na -o dla mężczyzny i na -a dla kobiety: nervioso, nerviosa.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson01.listen.002
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ostatnia samogłoska pokazuje, czy mówi mężczyzna (-o), czy kobieta (-a).
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson01.match.003
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Contento znaczy „zadowolony” lub „zadowolony z czegoś”; używa się go z czasownikiem estar.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson01.order.004
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Mateo está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Mateo está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Uczucia wyrażamy z estar, bo się zmieniają: Mateo está nervioso hoy.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson01.order.005
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Elena está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Elena está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Elena jest kobietą, więc przymiotnik kończy się na -a: Elena está cansada.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson03.order.001
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: word_order
  frame:
    text: Me {item} un poco nervioso.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Me {item} un poco nervioso.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Czuję się trochę zdenerwowany/zdenerwowana. Sentirse występuje z me, te, se: me siento, te sientes.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson03.translate.002
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: translation
  frame:
    text: Jak się czujesz? (nieformalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo te {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: W formie z usted pytanie brzmi ¿Cómo se siente?
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson04.fill.001
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: fill_in_blank
  frame:
    text: No te {item}, podemos empezar de nuevo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No te preocupes to stały zwrot, którym mówimy przyjacielowi „nie martw się”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson04.translate.002
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: translation
  frame:
    text: Coś się przypala!
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Algo se {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Po hiszpańsku to, co dzieje się teraz, wyrażamy czasem teraźniejszym prostym: algo se quema.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson04.order.003
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: word_order
  frame:
    text: Podemos {item} de nuevo.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Podemos {item} de nuevo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Możemy zacząć od nowa. De nuevo znaczy „od nowa”, tak samo jak otra vez.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson05.choose.001
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tekst przebiega w czasie: antes (przedtem), durante (w trakcie), al final (na końcu), ahora (teraz).'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson05.translate.002
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Gdy w grupie jest mężczyzna, przymiotnik przyjmuje końcówkę -os: nerviosos, contentos.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson06.order.001
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: word_order
  frame:
    text: Lo logramos {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lo logramos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Zrobiliśmy to razem. Lograr znaczy „zdołać coś zrobić” lub „osiągnąć coś”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson06.listen.002
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Ay, no! to naturalna reakcja, gdy coś idzie nie tak.
    language_code: pl
    direction: ltr
- content_key: practice.pl-es.es.a1.unit12.lesson05.match.003
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Estaban i están to formy czasownika estar: byli, są.'
    language_code: pl
    direction: ltr
