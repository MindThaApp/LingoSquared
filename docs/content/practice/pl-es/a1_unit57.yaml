  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aprende
    - w_aprender
    - w_aprendes
    - w_aprendo
    - w_ciencias
    - w_estudia
    - w_estudiar
    - w_estudias
    - w_estudio
    - w_formación
    - w_gustaría
    - w_nuevas
    - w_practicamos
    - w_próximo
    - w_sabes
    - w_salud
    - w_seguir
    - w_superior
    - w_universidad
templates:
- content_key: practice.pl-es.es.a1.unit57.lesson01.choose.001
  lesson_content_key: es.a1.unit57.lesson01.estudiar_y_una_formacion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_estudiar
        - w_estudia
        - w_formación
        - w_estudias
        - w_estudio
        - w_seguir
        - w_aprender
        - w_nuevas
        - w_aprendo
        - w_universidad
        - w_superior
        - w_aprendes
        - w_aprende
        - w_ciencias
        - w_salud
        - w_gustaría
        - w_sabes
        - w_practicamos
        - w_próximo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej jednostki, z lekcji o studiowaniu i programie nauki.'
    language_code: pl
    direction: ltr
