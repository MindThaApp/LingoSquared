templates:
- content_key: practice.fr-de.de.a1.unit02.lesson01.choose.001
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ich ne prend une majuscule qu’en début de phrase ; au milieu d’une phrase, il s’écrit en minuscule, contrairement à « Je » qui reste en minuscule en français aussi, mais en allemand les autres pronoms de politesse comme Sie gardent la majuscule.
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit02.lesson02.listen.001
