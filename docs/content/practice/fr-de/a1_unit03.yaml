    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wenn ich fragen darf est une formule de politesse qui adoucit la question, littéralement « si je peux demander ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit03.lesson04.order.001
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
    text: Ich bin {age} Jahre alt.
    language_code: de
    direction: ltr
  slots:
    age: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich bin {age} Jahre alt.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'En allemand, on exprime l''âge avec sein : Ich bin zwanzig Jahre alt, littéralement « je suis vingt ans vieux ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit03.lesson04.order.002
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
