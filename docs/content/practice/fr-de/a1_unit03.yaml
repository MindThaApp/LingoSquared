templates:
- content_key: practice.fr-de.de.a1.unit03.lesson01.choose.001
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eins devient ein devant un nom (ein Jahr), mais la forme utilisée pour compter est eins.
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit03.lesson02.listen.001
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Seize et dix-sept perdent des lettres par rapport aux nombres de base : sechzehn, siebzehn.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit03.lesson03.choose.001
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
