    frame:
      text: Wie alt {item} Sie?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Sind est la forme de sein qui va avec Sie ; la question est donc Wie alt sind Sie ?
    language_code: fr
    direction: ltr
