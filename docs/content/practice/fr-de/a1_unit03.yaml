    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Au-delà de vingt, on place les unités en premier : einundzwanzig signifie littéralement « un et vingt ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit03.lesson05.listen.001
  lesson_content_key: de.a1.unit03.lesson05.im_gespraech_ueber_das_alter
