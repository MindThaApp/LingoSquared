    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten se termine par -n parce que Morgen, Tag et Abend sont masculins ; le féminin Nacht donne Gute Nacht.
    language_code: fr
    direction: ltr
