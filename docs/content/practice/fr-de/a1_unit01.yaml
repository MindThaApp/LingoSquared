templates:
- content_key: practice.fr-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen s’emploie le matin, Guten Tag pendant la journée et Guten Abend à partir du soir.
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss est l’au revoir décontracté ; Auf Wiedersehen est l’au revoir poli, pour les inconnus et les situations formelles.
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L’allemand a deux mots pour « tu / vous » : Sie est la forme de politesse (inconnus, administrations), du est la forme familière (amis, famille, enfants).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte couvre à la fois « s’il vous plaît » et « de rien », et Entschuldigung sert à attirer l’attention de quelqu’un ou à dire pardon.
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? est le « comment allez-vous ? » de politesse ; avec un ami, on demande Wie geht's?
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: word_order
  frame:
    text: Bis {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis signifie « jusqu’à », donc Bis bald équivaut à « à bientôt » et Bis später à « à plus tard ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-de.de.a1.unit01.lesson01.order.002
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
