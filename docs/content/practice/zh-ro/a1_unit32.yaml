    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson02.listen.001
  lesson_content_key: ro.a1.unit32.lesson02.ingrijirea_unui_animal_de
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于照顾宠物的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson03.translate.001
  lesson_content_key: ro.a1.unit32.lesson03.a_iubi_animalele
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于喜爱动物的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson04.match.001
  lesson_content_key: ro.a1.unit32.lesson04.mihai_o_intreaba_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson05.choose.001
  lesson_content_key: ro.a1.unit32.lesson05.mihai_elena_si_andrei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语,出自“Mihai、Elena 和 Andrei 谈动物”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson06.translate.001
  lesson_content_key: ro.a1.unit32.lesson06.nina_si_pasarea_ei
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于尼娜的鸟的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson01.order.002
  lesson_content_key: ro.a1.unit32.lesson01.caine_pisica_peste_si
  type: word_order
  frame:
    text: Un câine este un {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_animal
  answer_derivation:
    kind: render_frame
    frame:
      text: Un câine este un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 狗是一种动物。animal 的意思是动物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson01.fill.003
  lesson_content_key: ro.a1.unit32.lesson01.caine_pisica_peste_si
  type: fill_in_blank
  frame:
    text: Un câine este și un animal de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_companie
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_companie
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 狗也是宠物。companie 的意思是“陪伴”(在 animal de companie 中指宠物)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson01.translate.004
  lesson_content_key: ro.a1.unit32.lesson01.caine_pisica_peste_si
  type: translation
  frame:
    text: Ana 有一只狗。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_câine
  answer_derivation:
    kind: render_frame
    frame:
      text: Ana are un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ana 有一只狗。câine 的意思是狗。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson02.order.002
  lesson_content_key: ro.a1.unit32.lesson02.ingrijirea_unui_animal_de
  type: word_order
  frame:
    text: Scot câinele la {item} în fiecare zi.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_plimbare
  answer_derivation:
    kind: render_frame
    frame:
      text: Scot câinele la {item} în fiecare zi.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我每天遛狗。plimbare 的意思是散步;兜风。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson02.fill.003
  lesson_content_key: ro.a1.unit32.lesson02.ingrijirea_unui_animal_de
  type: fill_in_blank
  frame:
    text: Îl {item} la plimbare în fiecare zi? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_scoți
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_scoți
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你每天都带它出去散步吗?scoți 的意思是“你带出去”(非正式)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson02.translate.004
  lesson_content_key: ro.a1.unit32.lesson02.ingrijirea_unui_animal_de
  type: translation
  frame:
    text: 我每天给他喂食。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_dau
  answer_derivation:
    kind: render_frame
    frame:
      text: Îi {item} de mâncare în fiecare zi.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我每天给他喂食。dau 的意思是“我给”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson03.order.002
  lesson_content_key: ro.a1.unit32.lesson03.a_iubi_animalele
  type: word_order
  frame:
    text: Mihai {item} câinii.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_iubește
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai {item} câinii.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mihai 爱狗。iubește 的意思是“他爱”或“她爱”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson03.fill.003
  lesson_content_key: ro.a1.unit32.lesson03.a_iubi_animalele
  type: fill_in_blank
  frame:
    text: Elena iubește {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_pisicile
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_pisicile
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Elena 爱猫。pisicile 的意思是“那些猫”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson03.translate.004
  lesson_content_key: ro.a1.unit32.lesson03.a_iubi_animalele
  type: translation
  frame:
    text: 爷爷爱鸟。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_păsările
  answer_derivation:
    kind: render_frame
    frame:
      text: Bunicul iubește {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 爷爷爱鸟。păsările 的意思是“那些鸟”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson04.order.002
  lesson_content_key: ro.a1.unit32.lesson04.mihai_o_intreaba_pe
  type: word_order
  frame:
    text: Are {item} maro și este mic.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_blană
  answer_derivation:
    kind: render_frame
    frame:
      text: Are {item} maro și este mic.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 他的毛是棕色的，个子小小的。这里复用了外貌单元中的发色和身材词汇，只是现在用来描述动物的毛，而不是人的头发。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit32.lesson06.order.002
  lesson_content_key: ro.a1.unit32.lesson06.nina_si_pasarea_ei
  type: word_order
  frame:
    text: Ce {item} că toți trei iubim animalele!
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_frumos
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} că toți trei iubim animalele!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 太好了，我们三个人都喜欢动物！这句话呼应了本单元三位人物各自与动物有关的内容。
    language_code: zh
    direction: ltr
