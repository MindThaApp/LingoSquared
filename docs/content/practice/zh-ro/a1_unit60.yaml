  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_barca
    - w_bilete
    - w_elefantul
    - w_girafa
    - w_hrănirea
    - w_leilor
    - w_leul
    - w_maimuța
    - w_multe
    - w_zoo
    - w_țarcul
templates:
- content_key: practice.zh-ro.ro.a1.unit60.lesson01.choose.001
  lesson_content_key: ro.a1.unit60.lesson01.hai_sa_mergem_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_multe
        - w_leul
        - w_elefantul
        - w_maimuța
        - w_girafa
        - w_zoo
        - w_hrănirea
        - w_leilor
        - w_bilete
        - w_țarcul
        - w_barca
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的单词，出自“我们去动物园好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit60.lesson02.listen.001
