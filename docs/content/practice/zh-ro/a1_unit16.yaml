  answer_derivation:
    kind: render_frame
    frame:
      text: Mă {item} capul.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă doare capul 字面意思是“头让我疼”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.order.004
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: word_order
  frame:
    text: Mă doare {item}.
    language_code: ro
    direction: ltr
