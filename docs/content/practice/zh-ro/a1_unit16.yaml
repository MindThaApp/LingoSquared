templates:
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.choose.001
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Capul 和 stomacul 是 cap 和 stomac 加上冠词 -ul；doare 的意思是“疼”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.listen.002
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
