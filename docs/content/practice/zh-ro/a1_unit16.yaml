    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mă doare 加上身体部位，就表示那个部位疼。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.order.003
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
