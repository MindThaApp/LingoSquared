  answer_derivation:
    kind: render_frame
    frame:
      text: Mă doare {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Stomacul 是 stomac 加上冠词 -ul。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.fill.005
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: fill_in_blank
  frame:
    text: Mă doare {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Capul 是 cap 加 -ul，所以这个句子说的是“这个头”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.translate.006
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: translation
  frame:
    text: 我头疼。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă doare {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 罗马尼亚语说的是“头让我疼”，而不是“我的头疼”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.translate.007
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: translation
  frame:
    text: 我胃疼。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă doare {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Doare 形式不变，因为疼的东西是单数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson01.translate.008
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: translation
  frame:
    text: 您是头疼还是胃疼？（敬称，对称呼 dumneavoastră 的人说）
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vă doare capul sau {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă 是“您”的 dumneavoastră 形式；对朋友则说 Te doare。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.choose.001
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Simt 的意思是“我感觉”，如 Mă simt bine；sunt 的意思是“我是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.listen.002
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nevoie 出现在 Am nevoie de un doctor 中，意思是“我需要医生”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.match.003
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 这些词分别表示身体部位、一种状态和一位帮助人的人；doare 是其中唯一的动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.order.004
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: word_order
  frame:
    text: Nu mă {item} bine.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu mă {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă simt 是反身动词，所以 mă 要放在动词前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.order.005
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: word_order
  frame:
    text: Nu mă simt bine. Sunt {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu mă simt bine. Sunt {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bolnav 是阳性形式，男性说话时使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.fill.006
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: fill_in_blank
  frame:
    text: Am {item} de un doctor. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Am nevoie de 的意思是“我需要”，后面要接 de。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.fill.007
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: fill_in_blank
  frame:
    text: Am nevoie de un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Doctor 前面用 un：un doctor。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.translate.008
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: translation
  frame:
    text: 我觉得不舒服。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu mă {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Nu 放在 mă simt 前面构成否定。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.translate.009
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: translation
  frame:
    text: 我生病了。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bolnav 是男性说话者用的形式；女性要说 Sunt bolnavă。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson02.translate.010
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: translation
  frame:
    text: 我需要医生。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am nevoie de un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am nevoie de 是表达“我需要”的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson03.choose.001
  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Odihnă 的意思是“休息”，multă 的意思是“很多”，与阴性名词一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson03.order.002
  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
  type: word_order
  frame:
    text: Odihnă și {item} apă!
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Odihnă și {item} apă!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Apă 是阴性名词，所以“很多”要用 multă。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson03.fill.003
  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
  type: fill_in_blank
  frame:
    text: Aveți nevoie de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aveți nevoie de 是敬称的“您需要”；odihnă 接在 de 后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson03.translate.004
  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
  type: translation
  frame:
    text: 您需要休息。（敬称，对称呼 dumneavoastră 的人说）
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți nevoie de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți 是“有”的 dumneavoastră 形式；对朋友则说 Ai。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit16.lesson03.translate.005
  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
  type: translation
  frame:
    text: 休息，多喝水！
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Odihnă și {item} apă!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Multă 与阴性名词 apă 一致。
    language_code: zh
    direction: ltr
