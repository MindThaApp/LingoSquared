schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit42
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit42.personalitate
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amabil
    - w_amuzant
    - w_asistentă
    - w_calm
    - w_cunoașteți
    - w_curios
    - w_diferiți
    - w_noastră
    - w_povestește
    - w_răbdător
    - w_timid
    - w_venit
    - w_întreabă
templates:
- content_key: practice.zh-ro.ro.a1.unit42.lesson01.choose.001
  lesson_content_key: ro.a1.unit42.lesson01.amabil_si_amuzant
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_amabil
        - w_amuzant
        - w_calm
        - w_răbdător
        - w_curios
        - w_timid
        - w_cunoașteți
        - w_asistentă
        - w_întreabă
        - w_povestește
        - w_diferiți
        - w_venit
        - w_noastră
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“亲切与风趣”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson02.listen.001
  lesson_content_key: ro.a1.unit42.lesson02.calm_si_rabdator
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“平和与耐心”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson03.translate.001
  lesson_content_key: ro.a1.unit42.lesson03.curios_si_timid
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“好奇与害羞”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson04.match.001
  lesson_content_key: ro.a1.unit42.lesson04.nina_intreaba_la_cafeneaua
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson05.choose.001
  lesson_content_key: ro.a1.unit42.lesson05.nina_afla_despre_toti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Nina 听大家的介绍”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson06.translate.001
  lesson_content_key: ro.a1.unit42.lesson06.nina_se_descrie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Nina 介绍自己”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson01.order.002
  lesson_content_key: ro.a1.unit42.lesson01.amabil_si_amuzant
  type: word_order
  frame:
    text: Andrei este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_amuzant
  answer_derivation:
    kind: render_frame
    frame:
      text: Andrei este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Andrei 很风趣。amuzant 的意思是“风趣的”（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson02.order.002
  lesson_content_key: ro.a1.unit42.lesson02.calm_si_rabdator
  type: word_order
  frame:
    text: Mihai este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_calm
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mihai 很平静。calm 的意思是“平静的”；“冷静下来”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson05.order.002
  lesson_content_key: ro.a1.unit42.lesson05.nina_afla_despre_toti
  type: word_order
  frame:
    text: Toți cei de la cafeneaua lingvistică sunt {item} și e frumos.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_diferiți
  answer_derivation:
    kind: render_frame
    frame:
      text: Toți cei de la cafeneaua lingvistică sunt {item} și e frumos.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 语言咖啡馆里每个人都不一样，这很好。diferiți 的意思是“不同的”（阳性复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit42.lesson06.order.002
  lesson_content_key: ro.a1.unit42.lesson06.nina_se_descrie
  type: word_order
  frame:
    text: Bun {item} la cafeneaua noastră lingvistică!
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_venit
  answer_derivation:
    kind: render_frame
    frame:
      text: Bun {item} la cafeneaua noastră lingvistică!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 欢迎来到我们的语言咖啡馆！venit 的意思是“来”（过去分词）。
    language_code: zh
    direction: ltr
