- content_key: practice.zh-ro.ro.a1.unit27.lesson01.order.002
  lesson_content_key: ro.a1.unit27.lesson01.fericit_trist_sau_suparat
  type: word_order
  frame:
    text: De ce ești {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_fericit
  answer_derivation:
    kind: render_frame
    frame:
      text: De ce ești {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 你为什么高兴？De ce（为什么）是询问原因的标准问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson01.fill.003
  lesson_content_key: ro.a1.unit27.lesson01.fericit_trist_sau_suparat
  type: fill_in_blank
  frame:
    text: Nu sunt supărat, sunt {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_trist
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_trist
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我不生气，我很难过。动词前的 Nu 表示否定：Nu sunt supărat。第二个分句再说出真正的感受。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson02.order.002
  lesson_content_key: ro.a1.unit27.lesson02.de_ce_esti_fericit
