        - w_griji
        - w_simte
        - w_puțin
        - w_singur
        - w_serviciu
        - w_cred
        - w_rezolvă
        - w_simți
        - w_sincer
        - w_descurci
        - w_chiar
        - w_ajută
        - w_fii
        - w_foarte
        - w_mândru
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“开心、难过还是生气？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson02.listen.001
