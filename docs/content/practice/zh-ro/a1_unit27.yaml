- content_key: practice.zh-ro.ro.a1.unit27.lesson02.fill.003
  lesson_content_key: ro.a1.unit27.lesson02.de_ce_esti_fericit
  type: fill_in_blank
  frame:
    text: Sunt fericit pentru că am un apartament {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nou
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nou
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我很高兴，因为我有了一套新公寓。Pentru că（因为）引出原因从句；语序保持正常：am un apartament nou。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson03.order.002
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: word_order
  frame:
    text: Sunt {item} pentru prima mea tură.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_emoționat
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item} pentru prima mea tură.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我为我的第一个班次感到紧张。emoționat 表示紧张；激动（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson03.fill.003
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: fill_in_blank
  frame:
    text: Salut, Mihai, cum te simți înainte de {item} ta tură? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_prima
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_prima
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你好，米哈伊，你对第一个班次感觉怎么样？Cum te simți 用了自反代词 te（“你自己”）；在 prima ta tură 中，所有格 ta 与阴性名词 tură 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson03.translate.004
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: translation
  frame:
    text: 别担心。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_face
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-ți {item} griji.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 别担心。Nu-ți face griji（字面意思是“不要为你自己制造忧虑”）是标准的固定安慰语。对不熟悉的人要说：Nu vă faceți griji。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson04.order.002
  lesson_content_key: ro.a1.unit27.lesson04.intrebari_despre_sentimente
  type: word_order
  frame:
    text: Cum se {item} Mihai?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_simte
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum se {item} Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 米哈伊感觉怎么样？A se simți（感觉）是自反动词：mă simt（我）、te simți（你）、se simte（他/她）。这是询问或描述感受的标准方式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson05.order.002
  lesson_content_key: ro.a1.unit27.lesson05.citim_un_mesaj_despre
  type: word_order
  frame:
    text: Sunt {item} emoționat, sincer să fiu.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_puțin
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item} emoționat, sincer să fiu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 说实话，我有点紧张。Sincer să fiu（说实话）让这种坦白显得委婉。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson05.fill.003
  lesson_content_key: ro.a1.unit27.lesson05.citim_un_mesaj_despre
