  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fericit
        - w_trist
        - w_supărat
        - w_ești
        - w_nou
        - w_emoționat
        - w_prima
        - w_tură
