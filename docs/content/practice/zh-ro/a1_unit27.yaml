    slot: item
  feedback_frame:
    text: 是的，我也这么想。Și eu cred asta（字面意思是“我也这样认为”）是表示赞同别人看法的自然说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit27.lesson06.order.002
