  feedback_frame:
    text: 你好，米哈伊，你对第一个班次感觉怎么样？Cum te simți 用了自反代词 te（“你自己”）；在 prima ta tură 中，所有格 ta 与阴性名词 tură 保持一致。
    language_code: zh
    direction: ltr
