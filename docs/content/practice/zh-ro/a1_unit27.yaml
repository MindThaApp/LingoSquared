- content_key: practice.zh-ro.ro.a1.unit27.lesson06.translate.004
  lesson_content_key: ro.a1.unit27.lesson06.ana_il_linisteste_pe
  type: translation
  frame:
    text: 别担心，你一定能做好的！
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_descurci
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-ți face griji, o să te {item} bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 别担心，你一定能做好的！O să te descurci bine（字面意思是“你会应付得很好”）是鼓励人的固定表达；o să + 动词构成将来时。
    language_code: zh
    direction: ltr
