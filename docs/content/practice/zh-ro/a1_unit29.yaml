review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajutat
    - w_azi
    - w_cafele
    - w_cardul
    - w_cerem
    - w_doriți
    - w_drăguț
    - w_feluri
    - w_idee
    - w_nota
    - w_numerar
    - w_partea
    - w_plătesc
    - w_plătește
    - w_plăti
    - w_plătit
    - w_plătiți
    - w_poftiți
    - w_principale
    - w_rest
    - w_restul
    - w_separat
    - w_total
    - w_împărțim
templates:
- content_key: practice.zh-ro.ro.a1.unit29.lesson01.choose.001
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_plăti
        - w_cardul
        - w_numerar
        - w_plătesc
        - w_doriți
        - w_plătiți
        - w_nota
        - w_împărțim
        - w_separat
        - w_restul
        - w_poftiți
        - w_rest
        - w_feluri
        - w_principale
        - w_cafele
        - w_plătit
        - w_cerem
        - w_idee
        - w_azi
        - w_ajutat
        - w_drăguț
        - w_partea
        - w_plătește
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“总共多少钱？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson02.listen.001
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“刷卡还是付现金？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson03.translate.001
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“分摊账单”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson04.match.001
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson05.choose.001
  lesson_content_key: ro.a1.unit29.lesson05.citim_nota_de_plata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“看懂餐厅账单”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson06.translate.001
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，来自“Ana 和 Mihai 付账”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson01.order.002
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: word_order
  frame:
    text: Cât costă în {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă în {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 一共多少钱？În total（一共）表示你问的是合计的总价，而不是单件的价格；Cât costă? 问的是“多少钱”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson02.order.002
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: word_order
  frame:
    text: Pot {item} cu cardul aici?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plăti
  answer_derivation:
    kind: render_frame
    frame:
      text: Pot {item} cu cardul aici?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我可以在这里刷卡吗？plăti 的意思是“付款”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson02.fill.003
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: fill_in_blank
  frame:
    text: Doriți să plătiți în numerar sau cu {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 您想付现金还是刷卡？Doriți să plătiți ...? 是正式的 dumneavoastră 形式，陌生的收银员会这样说；对朋友则说 Vrei să plătești ...?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson02.translate.004
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: translation
  frame:
    text: 我付现金。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_numerar
  answer_derivation:
    kind: render_frame
    frame:
      text: Plătesc în {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我付现金。numerar 的意思是“现金”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson03.order.002
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: word_order
  frame:
    text: Hai să împărțim {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_nota
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să împărțim {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我们把账单分开付好吗？nota 的意思是“账单”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson03.fill.003
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: fill_in_blank
  frame:
    text: Pot plăti {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我可以分开付款吗？Separat（分开地）放在 a plăti 之后；每个人各付各的时，通常这样请求：Pot plăti separat?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson04.order.002
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: word_order
  frame:
    text: Nu am nevoie de {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_rest
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu am nevoie de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我不需要找零。A avea nevoie de（需要）后面要接 de：Nu am nevoie de rest.
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson06.order.002
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: word_order
  frame:
    text: Hai să {item} nota?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_cerem
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să {item} nota?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我们叫服务员结账好吗？A cere（要求）以 nota 作直接宾语；Hai să cerem nota? 是提议一起去要账单。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit29.lesson06.fill.003
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: fill_in_blank
  frame:
    text: Mihai {item} nota. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mihai 付账。Plătește 是 a plăti（付款）的他/她形式。
    language_code: zh
    direction: ltr
