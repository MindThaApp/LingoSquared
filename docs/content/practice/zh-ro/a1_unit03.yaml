templates:
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.choose.001
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 罗马尼亚语的星期和月份用小写字母书写:luni、vineri,而不是 Luni、Vineri。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.listen.002
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sâmbătă 是星期六,duminică 是星期日;每个星期名称都是一个单词,而且都不用大写字母。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.match.003
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Luni 到 sâmbătă 是一周七天中的六天;duminică(星期日)补全一周。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.translate.004
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Astăzi 的意思是今天,mâine 的意思是明天;ieri 的意思是昨天。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.order.005
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: word_order
  frame:
    text: Ce {item} este astăzi?
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce zi este astăzi? 询问星期几;回答时用 Astăzi este + 星期:Astăzi este vineri。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.translate.006
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: 今天是星期五。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 罗马尼亚语的星期名称以小写字母开头:vineri,而不是 Vineri。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson01.fill.007
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: fill_in_blank
  frame:
    text: Zilele nu se scriu cu {item} mare. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Literă mare 的意思是大写字母;罗马尼亚语的星期和月份用小写字母书写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.choose.001
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 有些月份名称看起来很眼熟,但要用小写字母书写:aprilie、iulie。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.match.002
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 罗马尼亚语的月份名称从不用大写字母:ianuarie、februarie、martie。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.translate.003
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 有几个月份(februarie、septembrie)看起来很眼熟,但不用大写字母。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.order.004
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: word_order
  frame:
    text: Astăzi este trei {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este trei {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 日期是数字 + 月份:trei aprilie。每月一日用 întâi,不用 unu。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.translate.005
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: 今天是八月一日。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este întâi {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 每月一日说 întâi,不说 unu:întâi august;从二日起用普通数字。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.fill.006
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: fill_in_blank
  frame:
    text: La {item} ani! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La mulți ani! 字面意思是“多年”;用来祝人生日快乐或新年快乐。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson02.translate.007
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: 今天是几号？
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce dată este astăzi? 询问日期;Ce zi este astăzi? 询问星期几。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson03.order.001
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: word_order
  frame:
    text: Mihai, {item} este întâlnirea?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai, {item} este întâlnirea?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Când? 询问时间;回答时说出星期和日期,不需要表示“在”的词:vineri, întâi august。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson03.translate.002
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: translation
  frame:
    text: 会议是什么时候?
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Când este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 星期和日期前不需要表示“在”的词:Întâlnirea este vineri, întâi august。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit03.lesson03.choose.003
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lunile 的意思是各个月份:luni 是 lună 的复数,再加上冠词 -le;luni 单独使用时也表示星期一。
    language_code: zh
    direction: ltr
