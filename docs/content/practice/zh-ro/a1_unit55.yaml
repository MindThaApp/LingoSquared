    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“我想买一张票”那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit55.lesson04.translate.001
