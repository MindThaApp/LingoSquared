  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_concert
    - w_concertul
    - w_expoziția
    - w_expoziție
    - w_ghid
    - w_sala
    - w_tabloul
    - w_tablouri
    - w_vizita
    - w_vizitez
templates:
- content_key: practice.zh-ro.ro.a1.unit55.lesson01.choose.001
  lesson_content_key: ro.a1.unit55.lesson01.vreau_sa_merg_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vizita
        - w_vizitez
        - w_expoziția
        - w_expoziție
        - w_ghid
        - w_sala
        - w_tabloul
        - w_tablouri
        - w_concertul
        - w_concert
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“我想去博物馆”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit55.lesson02.listen.001
