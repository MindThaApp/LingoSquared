- content_key: practice.zh-ro.ro.a1.unit55.lesson01.order.003
  lesson_content_key: ro.a1.unit55.lesson01.vreau_sa_merg_la
  type: word_order
  frame:
    text: Vreau să {item} muzeul.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vizitez
  answer_derivation:
