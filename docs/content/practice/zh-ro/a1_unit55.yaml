    frame:
      text: Vreau să {item} muzeul.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我想参观博物馆。vizitez 的意思是“我参观”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit55.lesson02.order.002
  lesson_content_key: ro.a1.unit55.lesson02.vreau_sa_cumpar_un
  type: word_order
  frame:
    text: Aș vrea un bilet pentru {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_expoziție
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș vrea un bilet pentru {item}, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
