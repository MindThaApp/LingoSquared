templates:
- content_key: practice.zh-ro.ro.a1.unit09.lesson01.choose.001
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mergeți 是对用 dumneavoastră 称呼的人使用的命令形式；对朋友则说 mergi：Mergi înainte.
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.listen.001
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La dreapta 和 la stânga 是两个转弯方向；aici 和 acolo 表示“这里”和“那里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson03.choose.001
  lesson_content_key: ro.a1.unit09.lesson03.pe_strada
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apoi 意为“然后”，用来连接路线的各个步骤，常接在 mergeți înainte 之类的命令之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.match.002
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mergeți 和 ajung 是动词；înainte、aici、acolo 和 apoi 是副词，形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson01.order.002
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: word_order
  frame:
    text: Mergeți {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mergeți înainte 是对用 dumneavoastră 称呼的人使用的礼貌指示。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson01.order.003
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: word_order
  frame:
    text: Cum pot să {item} la gară?
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum pot să {item} la gară?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 在 pot 之后，罗马尼亚语要加 să 和动词：Cum pot să ajung la gară?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.order.003
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: word_order
  frame:
    text: Gara este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Gara este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Acolo 意为“那里”，aici 意为“这里”；动词 este 保持不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.fill.004
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: fill_in_blank
  frame:
    text: Mergeți la {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La stânga 意为“向左”；stânga 和 dreapta 本身已带有定冠词词尾 -a。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.fill.005
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: fill_in_blank
  frame:
    text: Magazinul este {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aici 指你所在的地方；acolo 指离你较远的地方。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson03.order.002
  lesson_content_key: ro.a1.unit09.lesson03.pe_strada
  type: word_order
  frame:
    text: Mergeți înainte, {item} la dreapta.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți înainte, {item} la dreapta.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Apoi 连接路线的各个步骤：先直走，然后向右。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.translate.006
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dreapta 和 stânga 用在 la 之后：la dreapta, la stânga.
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson01.translate.004
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: translation
  frame:
    text: 一直往前走。（礼貌说法，对用 dumneavoastră 称呼的人）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mergeți 是对 dumneavoastră 使用的命令形式；înainte 意为“向前”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson01.translate.005
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: translation
  frame:
    text: 我怎么去火车站？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum pot să {item} la gară?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum pot să ajung... 是问路的标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson02.translate.007
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: translation
  frame:
    text: 向左走。（礼貌说法，对用 dumneavoastră 称呼的人）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La stânga 是“向左”；la dreapta 是“向右”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit09.lesson03.translate.003
  lesson_content_key: ro.a1.unit09.lesson03.pe_strada
  type: translation
  frame:
    text: 一直往前走，然后向右。（礼貌说法）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți înainte, {item} la dreapta.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Apoi 意为“然后”，连接路线的两个步骤。
    language_code: zh
    direction: ltr
