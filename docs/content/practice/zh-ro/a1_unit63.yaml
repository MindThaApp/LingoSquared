schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit63
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit63.teatru
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actorii
    - w_buni
    - w_cortina
    - w_călătoria
    - w_grozavi
    - w_locuri
    - w_mulțumit
    - w_pauză
    - w_piesa
    - w_popular
    - w_teatrul
templates:
- content_key: practice.zh-ro.ro.a1.unit63.lesson01.choose.001
  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatrul
        - w_popular
        - w_cortina
        - w_actorii
        - w_buni
        - w_piesa
        - w_călătoria
        - w_pauză
        - w_locuri
        - w_mulțumit
        - w_grozavi
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们今天去剧院好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit63.lesson02.listen.001
  lesson_content_key: ro.a1.unit63.lesson02.scena_si_cortina
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“舞台和幕布”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit63.lesson03.translate.001
  lesson_content_key: ro.a1.unit63.lesson03.actorii_si_casa_de
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“演员和售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit63.lesson04.match.001
  lesson_content_key: ro.a1.unit63.lesson04.programul_spectacolului
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit63.lesson05.choose.001
  lesson_content_key: ro.a1.unit63.lesson05.la_casa_de_bilete
