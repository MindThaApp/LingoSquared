    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“在剧院售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit63.lesson06.translate.001
  lesson_content_key: ro.a1.unit63.lesson06.nina_aude_despre_teatru
  type: translation
  frame:
