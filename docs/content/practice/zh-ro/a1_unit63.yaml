  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: word_order
  frame:
    text: Spectacolul este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popular
