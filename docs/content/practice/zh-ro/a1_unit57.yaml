schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit57
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit57.parc
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_apa
    - w_așezăm
    - w_copac
    - w_copacul
    - w_iarba
    - w_iarbă
    - w_lesă
    - w_panoul
    - w_picnic
    - w_plimbarea
    - w_rața
    - w_rațele
    - w_rece
templates:
- content_key: practice.zh-ro.ro.a1.unit57.lesson01.choose.001
  lesson_content_key: ro.a1.unit57.lesson01.mergem_la_parc
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_plimbarea
        - w_copacul
        - w_iarba
        - w_copac
        - w_iarbă
        - w_rața
        - w_apa
        - w_rece
        - w_rațele
        - w_panoul
        - w_lesă
        - w_picnic
        - w_așezăm
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们去公园好吗？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit57.lesson02.listen.001
  lesson_content_key: ro.a1.unit57.lesson02.copacii_si_iarba
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“树和草地”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit57.lesson03.translate.001
  lesson_content_key: ro.a1.unit57.lesson03.ratele_de_langa_apa
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“水边的鸭子”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit57.lesson04.match.001
  lesson_content_key: ro.a1.unit57.lesson04.panoul_de_la_intrare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
