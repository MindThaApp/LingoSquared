- content_key: practice.zh-ro.ro.a1.unit57.lesson02.order.002
  lesson_content_key: ro.a1.unit57.lesson02.copacii_si_iarba
  type: word_order
  frame:
    text: Văd un {item} mare și iarbă verde.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_copac
