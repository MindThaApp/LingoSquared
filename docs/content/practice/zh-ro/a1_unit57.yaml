    text: '{item} 是本单元的词汇，出自“公园里的野餐”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit57.lesson01.translate.002
  lesson_content_key: ro.a1.unit57.lesson01.mergem_la_parc
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
