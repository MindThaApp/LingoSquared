    frame:
      text: Văd un {item} mare și iarbă verde.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我看见一棵大树和绿色的草。copac 的意思是树。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit57.lesson03.order.002
  lesson_content_key: ro.a1.unit57.lesson03.ratele_de_langa_apa
