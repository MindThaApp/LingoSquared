tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cumpăra
    - w_film
    - w_filmul
    - w_matineu
    - w_muzeu
    - w_muzeul
    - w_popcorn
    - w_popcornul
    - w_spectacol
    - w_spectacolul
    - w_uit
    - w_uita
    - w_vedeți
templates:
- content_key: practice.zh-ro.ro.a1.unit54.lesson01.choose.001
  lesson_content_key: ro.a1.unit54.lesson01.vreau_sa_ma_uit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_filmul
        - w_uita
        - w_uit
        - w_film
        - w_cumpăra
        - w_vedeți
        - w_spectacolul
        - w_spectacol
        - w_popcornul
        - w_popcorn
        - w_matineu
        - w_muzeul
        - w_muzeu
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“我想看电影”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit54.lesson02.listen.001
