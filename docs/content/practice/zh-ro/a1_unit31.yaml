  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“眼睛与某人长什么样？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit31.lesson04.match.001
  lesson_content_key: ro.a1.unit31.lesson04.ana_o_descrie_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
