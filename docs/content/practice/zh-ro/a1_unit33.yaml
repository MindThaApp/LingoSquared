schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit33
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit33.sport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aleargă
    - w_alerg
    - w_alerga
    - w_alergare
    - w_alergi
    - w_ambele
    - w_anume
    - w_conjugă
    - w_corecte
    - w_exact
    - w_facem
    - w_fotbal
    - w_fotbalul
    - w_iubi
    - w_liniștit
    - w_miște
    - w_ori
    - w_practici
    - w_propune
    - w_sportul
    - w_spune
    - w_yoga
    - w_înoată
    - w_înot
    - w_înotul
    - w_știi
templates:
- content_key: practice.zh-ro.ro.a1.unit33.lesson01.choose.001
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sportul
        - w_fotbalul
        - w_yoga
        - w_fotbal
        - w_alergare
        - w_înot
        - w_aleargă
        - w_înoată
        - w_practici
        - w_alerg
        - w_ori
        - w_știi
        - w_spune
        - w_exact
        - w_anume
        - w_ambele
        - w_corecte
        - w_iubi
        - w_înotul
        - w_alergi
        - w_alerga
        - w_conjugă
        - w_miște
        - w_liniștit
        - w_facem
        - w_propune
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于足球、瑜伽、跑步和游泳的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson02.listen.001
  lesson_content_key: ro.a1.unit33.lesson02.cat_de_des_faci
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“你多久运动一次？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson03.translate.001
  lesson_content_key: ro.a1.unit33.lesson03.sportul_si_iubirea_de
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于运动和热爱某项运动的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson04.match.001
  lesson_content_key: ro.a1.unit33.lesson04.mihai_il_intreaba_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson05.choose.001
  lesson_content_key: ro.a1.unit33.lesson05.ana_si_elena_despre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自 Ana 和 Elena 谈运动的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson06.translate.001
  lesson_content_key: ro.a1.unit33.lesson06.hai_sa_facem_sport
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“一起运动好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson01.order.002
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: word_order
  frame:
    text: Ana face {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_yoga
  answer_derivation:
    kind: render_frame
    frame:
      text: Ana face {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ana 做瑜伽。yoga 的意思是瑜伽。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson01.fill.003
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: fill_in_blank
  frame:
    text: Mihai joacă {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_fotbal
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_fotbal
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mihai 踢足球。fotbal 的意思是足球。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson01.translate.004
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: translation
  frame:
    text: Elena 经常游泳，几乎每周都去。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înoată
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} des, aproape în fiecare săptămână.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Elena 经常游泳，几乎每周都游。înoată 的意思是游泳（他/她/它/他们）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson02.order.002
  lesson_content_key: ro.a1.unit33.lesson02.cat_de_des_faci
  type: word_order
  frame:
    text: Fac yoga de două {item} pe săptămână.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_ori
  answer_derivation:
    kind: render_frame
    frame:
      text: Fac yoga de două {item} pe săptămână.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我每周做两次瑜伽。ori 的意思是次。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson03.order.002
  lesson_content_key: ro.a1.unit33.lesson03.sportul_si_iubirea_de
  type: word_order
  frame:
    text: Elena iubește {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_înotul
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena iubește {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Elena 热爱游泳。înotul 的意思是游泳这项运动。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit33.lesson06.order.002
  lesson_content_key: ro.a1.unit33.lesson06.hai_sa_facem_sport
  type: word_order
  frame:
    text: Hai să {item} sport împreună!
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_facem
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să {item} sport împreună!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我们一起锻炼好吗？facem 的意思是我们做；我们进行。
    language_code: zh
    direction: ltr
