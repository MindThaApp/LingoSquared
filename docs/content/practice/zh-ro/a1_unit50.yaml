schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit50
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit50.frizerie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aceeași
    - w_coafura
    - w_coafură
    - w_frizer
    - w_frizerul
    - w_lista
    - w_listă
    - w_loc
    - w_nicio
    - w_prea
    - w_prețuri
    - w_problemă
    - w_puteți
    - w_scurtă
    - w_spălat
    - w_sta
    - w_stă
    - w_tocmai
    - w_tunde
    - w_tundeți
    - w_tuns
    - w_tunsoare
    - w_tunsoarea
    - w_veniți
templates:
- content_key: practice.zh-ro.ro.a1.unit50.lesson01.choose.001
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_prea
        - w_frizerul
        - w_frizer
        - w_tunde
        - w_puteți
        - w_tundeți
        - w_veniți
        - w_aceeași
        - w_coafură
        - w_scurtă
        - w_nicio
        - w_problemă
        - w_loc
        - w_lista
        - w_prețuri
        - w_tunsoarea
        - w_tunsoare
        - w_listă
        - w_spălat
        - w_tuns
        - w_coafura
        - w_sta
        - w_stă
        - w_tocmai
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我的头发太长了”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit50.lesson02.listen.001
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“你能给我剪头发吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit50.lesson03.translate.001
  lesson_content_key: ro.a1.unit50.lesson03.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“预约”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit50.lesson04.match.001
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit50.lesson05.choose.001
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自“看价目表”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit50.lesson06.translate.001
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的单词之一，出自“Ana看到新发型”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit50.lesson01.order.002
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: word_order
  frame:
    text: Părul meu este {item} lung.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_prea
  answer_derivation:
    kind: render_frame
    frame:
      text: Părul meu este {item} lung.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我的头发太长了。prea 的意思是“太”。
    language_code: zh
    direction: ltr
