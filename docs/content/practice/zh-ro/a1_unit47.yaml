- content_key: practice.zh-ro.ro.a1.unit47.lesson01.order.003
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: word_order
  frame:
    text: Pentru ce este {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_programarea
  answer_derivation:
    kind: render_frame
    frame:
      text: Pentru ce este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 预约是为了什么？programarea 的意思是“这次预约”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson01.fill.004
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: fill_in_blank
  frame:
    text: Aș vrea să fac o {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_programare
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_programare
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我想预约。programare 的意思是“预约”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson02.order.002
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: word_order
  frame:
    text: Miercuri la ora zece este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_disponibil
  answer_derivation:
    kind: render_frame
    frame:
      text: Miercuri la ora zece este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 星期三十点有空。disponibil 的意思是“有空的；可用的”（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson02.fill.003
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: fill_in_blank
  frame:
    text: Îmi {item} bine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_convine
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_convine
