schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit47
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit47.programare
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amintești
    - w_calculator
    - w_confirmare
    - w_confirmat
    - w_convine
    - w_disponibil
    - w_plăcut
    - w_programare
    - w_programarea
templates:
- content_key: practice.zh-ro.ro.a1.unit47.lesson01.choose.001
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_programarea
        - w_programare
        - w_disponibil
        - w_convine
        - w_calculator
        - w_confirmat
        - w_confirmare
        - w_amintești
        - w_plăcut
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“预约”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson02.listen.001
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词语，出自“某个时间有空”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson03.translate.001
  lesson_content_key: ro.a1.unit47.lesson03.pentru_ce_este_programarea
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词语之一，出自“预约是为了什么？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson05.match.001
  lesson_content_key: ro.a1.unit47.lesson05.citim_o_confirmare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson06.choose.001
  lesson_content_key: ro.a1.unit47.lesson06.mihai_o_ajuta_sa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“Mihai 帮她提醒”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit47.lesson01.translate.002
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“预约”一课。'
