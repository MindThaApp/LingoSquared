templates:
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.choose.001
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aș dori 的意思是“我想要”，是礼貌地请求某物的说法；用于所有饮品时都保持不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.listen.002
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apă、cafea、ceai、suc 和 lapte 是最基本的饮品；sete（渴）与 mi-e 连用，构成 Mi-e sete。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.match.003
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cafea 和 apă 是阴性，用 o（o cafea）；ceai 和 suc 是中性，用 un（un ceai）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.translate.004
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori 的意思是“我想要”；后面接饮品，要一杯或一份时，在饮品前加 o 或 un。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cafea 是阴性，所以用 o：o cafea。一杯茶是 un ceai。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
  frame:
    text: Aș dori un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ceai 用 un，不用 o：un ceai。对比 o cafea。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: 我想要一杯咖啡。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori 很礼貌，对 tu 和 dumneavoastră 都适用；cafea 搭配 o。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: 我渴了。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mi-e sete 字面意思是“口渴对我来说存在”；Mi-e foame 的用法相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Foame 的意思是“饥饿”；说 Mi-e foame 表示“我饿了”，和 Mi-e sete 的用法一样。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare 泛指食物；pâine、carne、pui 和 fructe 是具体的食物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.match.003
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe 是复数，泛指水果；pâine、carne 和 mâncare 是单数阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare 是“食物”的通称，carne 的意思是“肉”；pui 是鸡肉，fructe 是水果。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 这里“面包”前不需要 o 或 un：Aș dori pâine și pui，就像 Aș dori apă。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mi-e foame（我饿了）是固定短语：感受的词放在 mi-e 之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pui 的意思是鸡肉，是菜单上或商店里常用的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: 我想要一杯茶，麻烦您。（正式，对用 dumneavoastră 称呼的人）
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog 是对 dumneavoastră 使用的礼貌的“请”；对朋友则说 te rog。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: 我想要水果。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe 是复数，所以前面不用 o 或 un。
    language_code: zh
    direction: ltr
