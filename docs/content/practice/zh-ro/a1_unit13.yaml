  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cafeaua、ceaiul 和 pâinea 是定指形式；词尾 -a 或 -ul 起冠词的作用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.order.003
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
