      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ceaiul 是 ceai 加上冠词 -ul，表示特指的那杯茶。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.translate.006
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: 我喜欢茶。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place 的意思相当于“对我来说是讨人喜欢的”，所以被喜欢的东西放在后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.translate.007
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: 我不喜欢咖啡。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Nu-mi 是 nu 加上缩短的 îmi，用连字符连接：对我来说不讨喜。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.translate.008
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: 我喜欢{item}。
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 你喜欢的东西是 place 的主语：Îmi place cafeaua，Îmi place ceaiul，Îmi place pâinea。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.choose.001
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Prefer 的意思是“我更喜欢”，sau 用来连接两个选择。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.listen.002
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sau 的意思是“或者”，例如 cafea sau ceai。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.order.003
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Prefer {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer 是“我更喜欢”；你偏爱的东西跟在后面，并带冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.order.004
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Cafea {item} ceai?
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau 用来在两样东西之间提供选择。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.fill.005
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: fill_in_blank
  frame:
    text: Cafea {item} ceai? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sau 的意思是“或者”，形式永远不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.translate.006
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: 您喜欢咖啡吗？（正式，用于称呼 dumneavoastră 的人）
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Vă place {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă place 是对 dumneavoastră 说的问句；对朋友则说 Îți place。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.translate.007
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: 我更喜欢咖啡。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer 不需要单独的“我”字；词尾已表明人称。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson02.translate.008
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: 咖啡还是茶？
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau 把两个选项连接成一个简短的问句。
    language_code: zh
    direction: ltr
