  feedback_frame:
    text: 罗马尼亚语把冠词放在词尾：cafea 变成 cafeaua，ceai 变成 ceaiul。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.listen.002
