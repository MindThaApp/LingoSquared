  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place 加上带冠词的名词，表示你喜欢那样东西。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.order.004
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: word_order
  frame:
    text: Nu-mi place {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Nu-mi place 是否定形式；名词仍保留冠词：pâinea。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit13.lesson01.fill.005
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: fill_in_blank
  frame:
    text: Îmi place {item}. ({hint})
    language_code: ro
    direction: ltr
