templates:
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.choose.001
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trenul 和 peronul 是 tren 和 peron 在词尾加上冠词 -ul。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.listen.002
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pleacă 是“出发、开”的动词，在 La ce oră pleacă trenul? 中和 trenul 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.order.003
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: word_order
  frame:
    text: La ce oră {item} trenul?
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce oră {item} trenul?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Pleacă 适用于他、她或它，所以可以和 trenul 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.order.004
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: word_order
  frame:
    text: Trenul este la {item} trei.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Trenul este la {item} trei.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Peronul 是 peron 加冠词，意思是“那个站台”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.fill.005
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: fill_in_blank
  frame:
    text: Trenul {item} la ora nouă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pleacă 是第三人称形式：他（她、它）出发。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.translate.006
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: translation
  frame:
    text: 火车几点开？
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce oră pleacă {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Trenul 是 tren 加 -ul，表示“这趟火车”；ora nouă 表示钟点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.translate.007
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: translation
  frame:
    text: 火车九点开。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Trenul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La ora nouă 表示钟点；他、她、它用的动词形式相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson01.translate.008
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
  type: translation
  frame:
    text: 火车在三号站台。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Trenul este la {item} trei.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Peronul trei 意思是三号站台，冠词加在名词上。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.choose.001
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bilet 的意思是票，București 是首都。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.listen.002
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bilet 是中性名词：单数是 un bilet，复数是 două bilete。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.match.003
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tren、peron、bilet 和 drum 是名词；pleacă 是动词；București 是专有名称。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.order.004
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: word_order
  frame:
    text: Am un {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bilet 是中性名词，中性名词单数用 un。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.fill.005
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: fill_in_blank
  frame:
    text: Aș dori un {item} la București, vă rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori un bilet 是礼貌的请求；vă rog 与 dumneavoastră 相配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.translate.006
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: translation
  frame:
    text: 我想要一张去布加勒斯特的票，麻烦您。（正式，对称“您”dumneavoastră 的人说）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un {item} la București, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori 加 un 和一个名词，构成礼貌的请求。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.translate.007
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: translation
  frame:
    text: 去布加勒斯特的票多少钱？
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} la București?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă 问的是一样东西的价格，所以动词用单数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson02.translate.008
  lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些词都是旅行中会用到的事物、动作或地点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson03.choose.001
  lesson_content_key: ro.a1.unit15.lesson03.la_gara
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Drum bun 是祝人旅途愉快。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson03.order.002
  lesson_content_key: ro.a1.unit15.lesson03.la_gara
  type: word_order
  frame:
    text: Drum {item}, Mihai!
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Drum {item}, Mihai!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Drum 是中性名词，单数时形容词用阳性形式 bun。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson03.fill.003
  lesson_content_key: ro.a1.unit15.lesson03.la_gara
  type: fill_in_blank
  frame:
    text: Drum {item}, Mihai! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在这句告别祝愿中，Bun 放在名词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit15.lesson03.translate.004
  lesson_content_key: ro.a1.unit15.lesson03.la_gara
  type: translation
  frame:
    text: 米哈伊，一路平安！
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Drum {item}, Mihai!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Drum bun 是对即将出发的人说的固定祝愿。
    language_code: zh
    direction: ltr
