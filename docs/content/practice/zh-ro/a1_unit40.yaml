- content_key: practice.zh-ro.ro.a1.unit40.lesson01.choose.001
  lesson_content_key: ro.a1.unit40.lesson01.scrisoarea_si_coletul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_scrisoarea
        - w_scrisoare
        - w_coletul
        - w_colet
        - w_bunica
        - w_timbrul
        - w_timbru
        - w_adresa
        - w_scrie
        - w_ajunge
        - w_bunici
        - w_dura
        - w_durează
        - w_zile
        - w_angajatul
        - w_grozav
        - w_cumpără
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于信和包裹的课。'
    language_code: zh
    direction: ltr
