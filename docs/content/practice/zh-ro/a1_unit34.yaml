schema_version: '1.0'
pack_key: practice.zh-ro.a1.unit34
source_language: zh
target_language: ro
unit_content_key: ro.a1.unit34.transport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajungi
    - w_bicicleta
    - w_centru
    - w_conduc
    - w_conduce
    - w_călătoresc
    - w_călătorește
    - w_călătorești
    - w_călători
    - w_forma
    - w_ghișeu
    - w_iau
    - w_jos
    - w_locuiește
    - w_mașina
    - w_mergi
    - w_mijloc
    - w_necunoscut
    - w_obicei
    - w_politețe
    - w_preferă
    - w_serviciul
    - w_transport
    - w_învățat
templates:
- content_key: practice.zh-ro.ro.a1.unit34.lesson01.choose.001
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bicicleta
        - w_călătorește
        - w_mașina
        - w_jos
        - w_conduce
        - w_călători
        - w_serviciul
        - w_călătoresc
        - w_călătorești
        - w_învățat
        - w_transport
        - w_ghișeu
        - w_necunoscut
        - w_forma
        - w_politețe
        - w_mijloc
        - w_iau
        - w_centru
        - w_ajungi
        - w_obicei
        - w_mergi
        - w_preferă
        - w_locuiește
        - w_conduc
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于火车、自行车、汽车和步行的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson02.listen.001
  lesson_content_key: ro.a1.unit34.lesson02.fiecare_calatoreste_altfel
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“每个人的出行方式都不同”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson03.translate.001
  lesson_content_key: ro.a1.unit34.lesson03.cumpararea_unui_bilet
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自买票那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson04.match.001
  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson05.choose.001
  lesson_content_key: ro.a1.unit34.lesson05.cine_cum_calatoreste
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“谁怎么出行？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson06.translate.001
  lesson_content_key: ro.a1.unit34.lesson06.hai_sa_mergem_impreuna
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“我们一起骑自行车好吗?”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson01.order.002
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: word_order
  frame:
    text: Mihai merge cu {item} la serviciu.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_bicicleta
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai merge cu {item} la serviciu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mihai骑自行车去上班。bicicleta 的意思是自行车。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson01.fill.003
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: fill_in_blank
  frame:
    text: Ana {item} cu trenul. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_călătorește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_călătorește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ana坐火车出行。călătorește 的意思是“他或她出行”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson01.translate.004
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: translation
  frame:
    text: Andrei 开车。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_mașina
  answer_derivation:
    kind: render_frame
    frame:
      text: Andrei conduce {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Andrei开车。mașina 的意思是汽车。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson02.order.002
  lesson_content_key: ro.a1.unit34.lesson02.fiecare_calatoreste_altfel
  type: word_order
  frame:
    text: Ce mijloc de {item} să iau până în centru?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_transport
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mijloc de {item} să iau până în centru?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我去市中心该坐什么交通工具？transport 的意思是交通。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson03.order.002
  lesson_content_key: ro.a1.unit34.lesson03.cumpararea_unui_bilet
  type: word_order
  frame:
    text: Ce {item} de transport să iau până în centru?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_mijloc
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} de transport să iau până în centru?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我去市中心该坐什么交通工具？mijloc 的意思是“手段、工具”（如“交通工具”的“工具”）；也指中间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson04.order.002
  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: word_order
  frame:
    text: Cum {item} la serviciu, Mihai?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_ajungi
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum {item} la serviciu, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mihai，你怎么去上班？ajungi 的意思是“你到达；你到得了”（非正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson04.fill.003
  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: fill_in_blank
  frame:
    text: De {item} merg cu bicicleta, nu e departe. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_obicei
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_obicei
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我通常骑自行车，不远。obicei 的意思是习惯。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson05.order.002
  lesson_content_key: ro.a1.unit34.lesson05.cine_cum_calatoreste
  type: word_order
  frame:
    text: Elena {item} aproape și merge pe jos la serviciu.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_locuiește
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} aproape și merge pe jos la serviciu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Elena住得近，步行去上班。locuiește 的意思是“他/她住”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit34.lesson06.order.002
  lesson_content_key: ro.a1.unit34.lesson06.hai_sa_mergem_impreuna
  type: word_order
  frame:
    text: Prefer să {item} mașina.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_conduc
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer să {item} mașina.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我更想开车。conduc 的意思是“我开车”。
    language_code: zh
    direction: ltr
