templates:
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Meu 和 mea 都表示“我的”：meu 用于阳性和中性名词（tatăl meu），mea 用于阴性名词（mama mea）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți 表示“父母”，是复数；两位父母是 mamă 和 tată。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă 和 tată 是不带冠词的名词；mama 和 tatăl 则在词尾加上了定冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 罗马尼亚语把定冠词放在名词末尾：mamă 变成 mama，tată 变成 tatăl。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 物主词要与名词的性一致：mama mea（阴性），但 tatăl meu（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl 是阳性，所以用 meu；mama 是阴性，所以用 mea。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: 我的母亲。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 罗马尼亚语的物主词放在名词后面：是 mama mea，不是 mea mama。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 罗马尼亚语的复数会改变词尾：frate 变成 frați，soră 变成 surori，copil 变成 copii。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu 是“儿子”，fiică 是“女儿”；已婚的男人是 căsătorit。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Frate、fiu 和 copil 是阳性，搭配 un；soră 和 fiică 是阴性，搭配 o。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.translate.004
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frați 是 frate 的复数，surori 是 soră 的复数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.order.005
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: word_order
  frame:
    text: Ai {item}?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați? 是对朋友的问法；对 dumneavoastră 则说 Aveți frați？
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.fill.006
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: fill_in_blank
  frame:
    text: Am un {item} și o soră. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un 用于阳性名词（un frate），o 用于阴性名词（o soră）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.translate.007
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: 我有一个女儿。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică 是阴性，所以用 o；“一个儿子”是 un fiu。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: 你有几个孩子？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți 是“多少”的阳性复数形式，与 copii（copil 的复数）搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: 你有兄弟吗，Mihai？（正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți 是“有”的礼貌形式；对朋友则会问 Ai frați?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate 是阳性，o soră 是阴性；这个句子是对 Aveți frați? 的回答。
    language_code: zh
    direction: ltr
