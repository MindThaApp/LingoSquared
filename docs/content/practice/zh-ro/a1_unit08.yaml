templates:
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.choose.001
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Gară 是火车站，magazin 是商店，bancă 是银行；aproape 和 departe 表示远近。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.listen.002
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aproape 表示近，departe 表示远；两者都用来说明事物所在的位置。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.match.009
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Bancă、poștă 和 bibliotecă 以 -ă 结尾，是阴性名词；magazin、spital 和 autobuz 没有这样的结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.translate.004
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gară、magazin 和 bancă 是不带冠词的名词；加上冠词后变成 gara、magazinul 和 banca。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.order.005
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: word_order
  frame:
    text: Da, magazinul este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aproape 表示近；Este aproape? 是询问某处是否很近。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.fill.006
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: fill_in_blank
  frame:
    text: Unde este {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 冠词放在词尾：bancă 变成 banca，所以 Unde este banca? 的意思是“银行在哪里？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.translate.007
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: 火车站在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Gară 在词尾加上冠词后变成 gara。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson01.translate.008
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: 商店很近。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Magazinul 是 magazin 加上冠词 -ul；aproape 是副词，形式永远不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.choose.001
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lângă、vizavi 和 între 放在所指的地点之前：lângă bibliotecă，vizavi de magazin。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.listen.002
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poștă 是邮局，bibliotecă 是图书馆；stație 是车站，autobuz 是公共汽车。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.translate.003
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spital 和 bibliotecă 是名词；lângă、vizavi 和 între 是表示位置的词，没有词尾变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.order.004
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Spitalul este {item} de magazin.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vizavi 后面总是跟 de：vizavi de magazin 的意思是“在商店对面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.order.005
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Stația de autobuz este {item} bibliotecă.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Stația de autobuz este {item} bibliotecă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lângă 表示“在……旁边”，后面直接跟名词：lângă bibliotecă。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.fill.006
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: fill_in_blank
  frame:
    text: Stația de {item} este lângă bibliotecă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Stația de autobuz 是公交站：冠词加在 stație 上，而不是 autobuz 上。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.translate.007
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: 医院在商店对面。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Spital 加上 -ul 变成 spitalul；vizavi 后面在第二个地点之前需要 de。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit08.lesson02.translate.008
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: 邮局在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Poștă 加上冠词后变成 poșta；疑问词 unde 保持不变。
    language_code: zh
    direction: ltr
