  frame:
    text: Mihai {item} la birou. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lucrează 是“工作”的“他/她”形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.translate.006
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: translation
  frame:
    text: 米哈伊是工程师。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 表示职业时，前面不需要任何冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.translate.007
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: translation
  frame:
    text: 米哈伊在办公室工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai {item} la birou.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lucrează 用于“他”或“她”,所以适用于米哈伊。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.translate.008
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: translation
  frame:
    text: 他在办公室工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrează la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 动词形式已经表明主语时，罗马尼亚语常常省略“他”或“她”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.choose.001
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Profesoară 是阴性形式；lucrați 是敬称的“您工作”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.listen.002
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lucrați 是 dumneavoastră 的形式，用于对需要尊称的人说话。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.match.003
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 这些词表示职业、工作地点和“工作”的动词；lucrează 和 lucrați 因人称不同而不同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.order.004
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: word_order
  frame:
    text: Sunt {item}. Lucrez la școală.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item}. Lucrez la școală.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Profesoară 以 -ă 结尾，因为说话人是女性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.order.005
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: word_order
  frame:
    text: Lucrez la {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Școală 是阴性；lucrez la școală 的意思是“我在学校工作”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.fill.006
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: fill_in_blank
  frame:
    text: Unde {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lucrați 是敬称的疑问形式：您在哪里工作？
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.translate.007
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: translation
  frame:
    text: 您在哪里工作？（正式，对用 dumneavoastră 称呼的人）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lucrați 与 dumneavoastră 搭配；对朋友则说 lucrezi。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.translate.008
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: translation
  frame:
    text: 我是老师。（女性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Profesoară 是阴性的职业名称；前面不需要加冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson02.translate.009
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: translation
  frame:
    text: 我在一所学校工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lucrez 是“我”的形式，la 的意思是“在”。
    language_code: zh
    direction: ltr
