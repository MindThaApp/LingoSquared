    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Inginer 是阳性，birou 是中性；单数时两者都用 un:un inginer, un birou。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.order.003
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: word_order
  frame:
    text: Mihai este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 表示职业时，罗马尼亚语不用冠词：Mihai este inginer。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.order.004
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: word_order
  frame:
    text: Lucrează la {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrează la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La 表示“在”,这里 birou 跟在它后面，不加冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.fill.005
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
