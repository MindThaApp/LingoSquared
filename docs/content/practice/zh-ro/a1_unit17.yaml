templates:
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.choose.001
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lucrează 可用于“他”或“她”;Mihai lucrează la birou。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit17.lesson01.listen.002
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
