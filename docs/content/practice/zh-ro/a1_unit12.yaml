- content_key: practice.zh-ro.ro.a1.unit12.lesson01.choose.001
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Am fost 由 am 和 fost（“是／去过”）组成；表示“他”或“她”时，同样的 fost 搭配 a：a fost。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.listen.001
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
