  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Am mâncat 和 am băut 的构成方式相同：am 加上一个以 -t 结尾的过去分词形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson03.listen.001
  lesson_content_key: ro.a1.unit12.lesson03.cum_a_fost_duminica
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在 Cum a fost duminică? 中，助动词 a 放在 fost 前面，表示“（它）曾是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson01.order.002
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: word_order
  frame:
    text: Ieri am {item} la parc.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ieri am {item} la parc.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am fost la parc 的意思是“我去了公园”或“我在公园待过”；ieri 把句子放到过去。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.order.002
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: word_order
  frame:
    text: Am {item} pâine și am băut ceai.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} pâine și am băut ceai.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: mănânc 的过去时是 am mâncat：am 加过去分词，过去分词形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.order.003
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: word_order
  frame:
    text: Am mâncat pâine și am {item} ceai.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Am mâncat pâine și am {item} ceai.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am băut 是 beau 的过去时；每个动词在句中都要重复使用 am。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson03.order.002
  lesson_content_key: ro.a1.unit12.lesson03.cum_a_fost_duminica
  type: word_order
  frame:
    text: Cum {item} fost duminică?
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum {item} fost duminică?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: A fost 表示“它曾是”；当主语是“他”“她”或“它”时，助动词 a 取代 am。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson01.fill.003
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: fill_in_blank
  frame:
    text: Am {item} la cinema. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fost 是“是”的过去分词形式；am fost la cinema（我去过电影院）是表达“我去了电影院”的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.fill.004
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: fill_in_blank
  frame:
    text: Am {item} pâine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncat 是放在 am 后面表示“我吃了”的过去分词形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.fill.005
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: fill_in_blank
  frame:
    text: Am {item} ceai. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Băut 是放在 am 后面表示“我喝了”的过去分词形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.translate.006
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 罗马尼亚语的 fost、mâncat、băut 等过去分词以 -t 结尾，与表示“我”的 am 搭配使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson01.translate.004
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: translation
  frame:
    text: 昨天我去了公园。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ieri am {item} la parc.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ieri 表示过去；am fost la parc，字面意思是“我去过公园”，是表达“我去了公园”的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.translate.007
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: translation
  frame:
    text: 我吃了面包。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} pâine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am mâncat pâine 用 am 构成“我”的过去时。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson02.translate.008
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: translation
  frame:
    text: 我喝了茶。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ceai.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am băut ceai：am 加 beau 的过去分词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit12.lesson03.translate.003
  lesson_content_key: ro.a1.unit12.lesson03.cum_a_fost_duminica
  type: translation
  frame:
    text: 周日过得怎么样？
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum {item} fost duminică?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum a fost duminică? 用 a（“它曾是”），因为主语是星期天。
    language_code: zh
    direction: ltr
