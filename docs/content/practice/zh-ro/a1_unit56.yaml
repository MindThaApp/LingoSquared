    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“我想买一张票”那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson03.translate.001
  lesson_content_key: ro.a1.unit56.lesson03.la_ce_ora_incepe
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“音乐会几点开始？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson04.match.001
  lesson_content_key: ro.a1.unit56.lesson04.la_casa_de_bilete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个罗马尼亚语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson05.choose.001
  lesson_content_key: ro.a1.unit56.lesson05.citirea_programului
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自阅读节目单的课文。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson06.translate.001
  lesson_content_key: ro.a1.unit56.lesson06.mihai_nina_si_ana
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词语，出自“Mihai、Nina和Ana在音乐会上”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson01.order.002
  lesson_content_key: ro.a1.unit56.lesson01.vreau_sa_merg_la
  type: word_order
  frame:
    text: Aș vrea să merg la concertul {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_trupei
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș vrea să merg la concertul {item}, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 我想去听乐队的音乐会，麻烦您。trupei 的意思是“乐队的”（如“乐队的音乐会”）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson03.order.002
  lesson_content_key: ro.a1.unit56.lesson03.la_ce_ora_incepe
  type: word_order
  frame:
    text: Concertul durează două {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_ore
  answer_derivation:
    kind: render_frame
    frame:
      text: Concertul durează două {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 音乐会持续两个小时。ore 的意思是“小时”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson04.order.002
  lesson_content_key: ro.a1.unit56.lesson04.la_casa_de_bilete
  type: word_order
  frame:
    text: Da, aș vrea un bilet pentru {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_trupă
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, aș vrea un bilet pentru {item}, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 是的，我想要一张乐队的票，麻烦您。trupă 的意思是“乐队”。
    language_code: zh
    direction: ltr
