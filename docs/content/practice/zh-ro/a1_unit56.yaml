  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_locul
    - w_ore
    - w_parcul
    - w_publicul
    - w_scena
    - w_trupa
    - w_trupei
    - w_trupă
templates:
- content_key: practice.zh-ro.ro.a1.unit56.lesson01.choose.001
  lesson_content_key: ro.a1.unit56.lesson01.vreau_sa_merg_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_trupa
        - w_trupei
        - w_locul
        - w_ore
        - w_trupă
        - w_scena
        - w_publicul
        - w_parcul
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我想去听音乐会”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit56.lesson02.listen.001
  lesson_content_key: ro.a1.unit56.lesson02.vreau_sa_cumpar_un
  type: listen_select
