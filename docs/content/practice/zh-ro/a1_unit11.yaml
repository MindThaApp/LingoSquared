- content_key: practice.zh-ro.ro.a1.unit11.lesson01.translate.005
  lesson_content_key: ro.a1.unit11.lesson01.mergem_la_cinema
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mergem 是 merg（我去）的“我们”形式；sigur 单独就是一个完整的回答：Sigur!
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit11.lesson01.translate.006
  lesson_content_key: ro.a1.unit11.lesson01.mergem_la_cinema
  type: translation
  frame:
    text: 我们周六去公园好吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergem la {item} sâmbătă?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 同一个词 mergem 既表示“我们去”，也表示“我们去……好吗”；区别在于问号。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit11.lesson01.translate.007
  lesson_content_key: ro.a1.unit11.lesson01.mergem_la_cinema
  type: translation
  frame:
    text: Ana，我们去看电影好吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ana, {item} la cinema?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mergem la cinema? 用“我们”形式提出一起做的计划。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit11.lesson02.translate.004
  lesson_content_key: ro.a1.unit11.lesson02.nu_pot_atunci
  type: translation
  frame:
    text: 周六我不行，那周日呢？
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu pot sâmbătă, {item} duminică?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Atunci duminică? 是建议另一天的简短说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit11.lesson03.translate.004
  lesson_content_key: ro.a1.unit11.lesson03.planul_de_duminica
  type: translation
  frame:
    text: 我们周日去公园好吗？好，当然！
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergem la parc duminică? Da, {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Da, sigur! 表示坚定地接受计划。
    language_code: zh
    direction: ltr
