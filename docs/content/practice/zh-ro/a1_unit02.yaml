templates:
- content_key: practice.zh-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: “二”有两种形式：doi 用于阳性名词，două 用于阴性和中性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson01.listen.002
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 零到十是基础：十几在个位数后加 -sprezece（unsprezece、doisprezece），整十数加 -zeci。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson01.match.003
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi 是“二”的阳性形式，două 是阴性和中性形式；其他数字不变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在名词前，“一”和“二”会随性变化（un 或 o，doi 或 două）；单纯数数时说 unu、doi。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson02.choose.001
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 十几由个位数加 -sprezece 构成：doisprezece 就是二加十。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson02.listen.002
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 整十数以 -zeci 结尾：douăzeci、treizeci、patruzeci，一直到 nouăzeci。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson02.match.003
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 整十数由个位数加 -zeci 构成：trei 变成 treizeci，patru 变成 patruzeci。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson02.translate.004
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sută 的意思是“一百”；“一百”是 o sută，用阴性的 o。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 从二到十九不加 de：am nouăsprezece ani。从二十起要加：am treizeci de ani。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: 我三十岁。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 二十及以上的数字，名词前要加 de：treizeci de ani。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ai 是“有”的 tu 形式，aveți 是 dumneavoastră 形式：Câți ani ai? 或 Câți ani aveți？
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 二十及以上的数字后面要加 De：treizeci de ani，但是 nouăsprezece ani。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: 你多大了？（非正式，对朋友）
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți ani ai? 字面意思是问你“有”多少年：罗马尼亚语表示年龄用“有”，不用“是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: 您多大年纪？（正式，对用 dumneavoastră 称呼的人）
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți 是“有”的礼貌形式，与 dumneavoastră 搭配使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul 是中性名词，中性单数名词用阳性形式 tău；礼貌的说法是 Care este numărul dumneavoastră de telefon?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 罗马尼亚语说“我有三十年”：am treizeci de ani，而不是“我是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ro.ro.a1.unit02.lesson03.match.008
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ani 是 an 的复数；问句 Câți ani ai? 询问的是年数。
    language_code: zh
    direction: ltr
