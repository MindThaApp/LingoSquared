    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nie martw się, dasz radę! Tu vas y arriver (dosłownie „dojdziesz tam”) to zachęcające stałe wyrażenie; aller + bezokolicznik tworzy czas bliskiej przyszłości.
    language_code: pl
    direction: ltr
