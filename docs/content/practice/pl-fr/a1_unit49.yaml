  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć, Mathieu, jak się czujesz przed swoją pierwszą zmianą? Avant ton premier service (przed twoją pierwszą zmianą) powtarza wzór avant + rzeczownik z lekcji 3.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Jak czuje się Mathieu? Se sentir (czuć się, czasownik zwrotny) to standardowy sposób, by pytać o stan emocjonalny lub go opisać; pojawia się też w jednostce o zdrowiu.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit49.lesson05.order.002
