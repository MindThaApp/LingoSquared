    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Dzięki, to naprawdę pomaga. Aide to forma il/elle czasownika aider (pomagać); m' to skrócone me.
    language_code: pl
    direction: ltr
