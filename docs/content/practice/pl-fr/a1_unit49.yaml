  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_content
        - w_triste
        - w_colère
        - w_pourquoi
        - w_nerveux
        - w_service
        - w_sent
        - w_seul
        - w_nouveau
        - w_pense
        - w_honnêtement
        - w_vas
        - w_arriver
        - w_vraiment
        - w_seras
        - w_sûrement
        - w_fier
        - w_remplace
