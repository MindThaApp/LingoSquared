    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'atelier a lieu le samedi znaczy, że warsztaty odbywają się w soboty.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier to liczebnik porządkowy używany tylko dla pierwszego dnia miesiąca; w pozostałych datach używa się liczebników głównych: le premier mars, le quinze mars.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
