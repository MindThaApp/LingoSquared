    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars to nazwa miesiąca; francuskie miesiące, tak jak dni, pisze się małą literą.
    language_code: pl
    direction: ltr
