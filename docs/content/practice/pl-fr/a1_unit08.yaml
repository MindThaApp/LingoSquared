- content_key: practice.pl-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lundi, samedi i dimanche po francusku pisze się małą literą, a le przed nazwą dnia oznacza „co tydzień”: le samedi.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit08.lesson01.listen.002
