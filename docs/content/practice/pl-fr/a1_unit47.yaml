      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Jeśli pada, zostajemy w środku. S''il pleut (jeśli pada): si + il zamienia się w s''il; potem on reste à l''intérieur mówi, co robicie.'
    language_code: pl
    direction: ltr
