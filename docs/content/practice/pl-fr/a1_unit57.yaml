  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appelle
    - w_appli
    - w_cherches
    - w_envoie
    - w_envoies
    - w_internet
    - w_lit
    - w_message
    - w_nommer
    - w_ordinateur
    - w_soleil
    - w_utiliser
templates:
