    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz i le vin są rodzaju męskiego, a la salade – żeńskiego; w l'eau rodzajnik traci samogłoskę przed eau.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit05.lesson01.listen.002
