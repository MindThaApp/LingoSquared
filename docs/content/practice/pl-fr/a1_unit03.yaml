templates:
- content_key: practice.pl-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frères et sœurs razem oznacza rodzeństwo: po francusku nie ma jednego codziennego słowa na braci i siostry.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Frère i frères brzmią tak samo, podobnie sœur i sœurs, więc liczbę pojedynczą lub mnogą pokazuje tylko rodzajnik albo kontekst.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Francuskie nazwy członków rodziny łatwo dobrać w pary, gdy znasz rodzaj: mère i père, tante i oncle, cousine i cousin.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frère i sœur przyjmują w liczbie mnogiej końcówkę -s (frères, sœurs), więc liczbie mnogiej w polskim zdaniu odpowiada liczba mnoga po francusku.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ma stoi przy rzeczownikach rodzaju żeńskiego (ma mère), mon przy rzeczownikach rodzaju męskiego (mon père), a mes przy wszystkich w liczbie mnogiej (mes parents).
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ma stoi przy rzeczowniku rodzaju żeńskiego w liczbie pojedynczej; przymiotnik petite też przyjmuje żeńskie -e.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Famille jest rodzaju żeńskiego, więc wymaga ma; przy rzeczowniku rodzaju męskiego użyłbyś mon.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: Moja rodzina jest mała.
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Petite jest w rodzaju żeńskim, bo famille jest rodzaju żeńskiego; przy rzeczowniku rodzaju męskiego użyjesz petit.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cousin jest rodzaju męskiego, a cousine żeńskiego: końcówka -e oznacza kuzynkę i sprawia, że końcowe n jest słyszalne.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Mon stoi przed rzeczownikami rodzaju męskiego w liczbie pojedynczej: mon père, mon oncle.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Francuskie końcówki czasu teraźniejszego w habite/habites/habitent brzmią tak samo, więc o tym, kogo dotyczy zdanie, mówi zaimek.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: J’habite avec mes {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes to liczba mnoga od „mój”, zarówno dla rzeczowników rodzaju męskiego, jak i żeńskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson04.fill.003
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Tu habites {item} de tes parents ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Près de znaczy blisko: près de tes parents, près d’ici.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson04.translate.004
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Końcówka czasownika zależy od podmiotu: habite przy il/elle, habitent przy ils/elles, habites przy tu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson04.translate.005
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: Mieszkam z dziadkami.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes to liczba mnoga od „mój”, więc mes grands-parents znaczy „moi dziadkowie”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson05.fill.001
  lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Ma petite sœur {item} Camille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'S’appelle to forma il/elle od s’appeler: ma sœur s’appelle..., je m’appelle...'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson06.listen.001
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque semaine znaczy co tydzień: chaque nigdy się nie zmienia, a po nim stoi rzeczownik w liczbie pojedynczej.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit03.lesson06.match.002
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id018
    second: *id018
    third: *id018
    fourth: *id018
    fifth: *id018
    sixth: *id018
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mais to spójnik przeciwstawny (ale), a plus tworzy porównanie, jak w Ma famille est plus petite.
    language_code: pl
    direction: ltr
