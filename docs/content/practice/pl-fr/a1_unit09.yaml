    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Au carrefour to połączenie à i le w au: na skrzyżowaniu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson01.match.003
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
