    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pour aller à to standardowy sposób zapytania, jak dojść w dane miejsce; s'il vous plaît dodaje grzeczności.
    language_code: pl
    direction: ltr
