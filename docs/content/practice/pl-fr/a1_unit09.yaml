    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Droit w tout droit znaczy „prosto”, a gauche i droite to lewa i prawa strona.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson01.order.004
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: W à gauche i à droite używa się przyimka à, a nie en, gdy mowa o skręcie w lewo lub w prawo.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: fill_in_blank
  frame:
    text: Tournez à gauche au {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au to połączenie à i le, więc au carrefour znaczy „na skrzyżowaniu”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson01.translate.006
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: translation
  frame:
    text: Sklep jest na rogu ulicy, po prawej stronie.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La boutique est au {item} de la rue, à droite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au coin de la rue znaczy „na rogu ulicy”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson02.choose.001
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tournez i continuez to formy rozkazujące w 2. osobie liczby mnogiej (vous), używane wobec nieznajomych lub kilku osób.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson02.listen.002
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
