  answer_derivation:
    kind: render_frame
    frame:
      text: Continuez tout droit {item} carrefour.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Jusqu'au to jusqu'à + le, używane przed miejscem rodzaju męskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson02.fill.004
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: fill_in_blank
  frame:
