templates:
- content_key: practice.pl-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche i à droite znaczą „po lewej/w lewo” i „po prawej/w prawo”; rzeczowniki gauche i droite są rodzaju żeńskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: listen_select
