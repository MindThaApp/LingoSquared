    slot: item
  feedback_frame:
    text: Jusqu'au znaczy „aż do” (przed rzeczownikiem rodzaju męskiego), np. jusqu'au carrefour.
    language_code: pl
    direction: ltr
- content_key: practice.pl-fr.fr.a1.unit09.lesson02.order.003
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: word_order
