schema_version: '1.0'
pack_key: practice.zh-it.a1.unit53
source_language: zh
target_language: it
unit_content_key: it.a1.unit53.personalita
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_benvenuta
    - w_calmo
    - w_chiede
    - w_conoscete
    - w_curioso
    - w_divertente
    - w_infermiera
    - w_nostro
    - w_paziente
    - w_racconta
    - w_stesso
    - w_tanto
    - w_timido
    - w_trovo
    - w_vedi
templates:
- content_key: practice.zh-it.it.a1.unit53.lesson01.choose.001
  lesson_content_key: it.a1.unit53.lesson01.gentile_e_divertente
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_divertente
        - w_calmo
        - w_paziente
        - w_curioso
        - w_trovo
        - w_vedi
        - w_timido
        - w_conoscete
        - w_tanto
        - w_infermiera
        - w_chiede
        - w_racconta
        - w_stesso
        - w_benvenuta
        - w_nostro
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“亲切与风趣”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson02.listen.001
  lesson_content_key: it.a1.unit53.lesson02.calmo_e_paziente
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“平和与耐心”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson03.translate.001
  lesson_content_key: it.a1.unit53.lesson03.curioso_e_timido
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“好奇与害羞”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson04.match.001
  lesson_content_key: it.a1.unit53.lesson04.nina_chiede_al_caffe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个意大利语单词与它的中文意思配对；这些单词出自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson05.choose.001
  lesson_content_key: it.a1.unit53.lesson05.nina_sente_parlare_di
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Nina 听大家的介绍”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson06.translate.001
  lesson_content_key: it.a1.unit53.lesson06.nina_si_descrive
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Nina 介绍自己”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson01.order.002
  lesson_content_key: it.a1.unit53.lesson01.gentile_e_divertente
  type: word_order
  frame:
    text: Luca è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_divertente
  answer_derivation:
    kind: render_frame
    frame:
      text: Luca è {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Luca 很有趣。divertente 的意思是“有趣的；好玩的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson02.order.002
  lesson_content_key: it.a1.unit53.lesson02.calmo_e_paziente
  type: word_order
  frame:
    text: Marco è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_calmo
  answer_derivation:
    kind: render_frame
    frame:
      text: Marco è {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Marco 很冷静。calmo 的意思是“冷静的”（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson02.fill.003
  lesson_content_key: it.a1.unit53.lesson02.calmo_e_paziente
  type: fill_in_blank
  frame:
    text: Giulia è {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_paziente
    hint:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_paziente
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Giulia 很有耐心。paziente 的意思是“有耐心的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit53.lesson06.order.002
  lesson_content_key: it.a1.unit53.lesson06.nina_si_descrive
  type: word_order
  frame:
    text: Benvenuta al {item} caffè linguistico!
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nostro
  answer_derivation:
    kind: render_frame
    frame:
      text: Benvenuta al {item} caffè linguistico!
      language_code: it
      direction: ltr
  feedback_frame:
    text: 欢迎来到我们的语言咖啡馆！nostro 的意思是“我们的”。
    language_code: zh
    direction: ltr
