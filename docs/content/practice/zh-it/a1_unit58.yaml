schema_version: '1.0'
pack_key: practice.zh-it.a1.unit58
source_language: zh
target_language: it
unit_content_key: it.a1.unit58.appuntamento
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appuntamento
    - w_conferma
    - w_confermato
    - w_disponibile
    - w_fissare
    - w_informatica
    - w_maggio
    - w_ricordare
    - w_tredici
templates:
- content_key: practice.zh-it.it.a1.unit58.lesson01.choose.001
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fissare
        - w_appuntamento
        - w_disponibile
        - w_informatica
        - w_confermato
        - w_conferma
        - w_tredici
        - w_maggio
        - w_ricordare
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“预约”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson02.listen.001
  lesson_content_key: it.a1.unit58.lesson02.un_orario_e_disponibile
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词语，出自“某个时间有空”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson03.translate.001
  lesson_content_key: it.a1.unit58.lesson03.per_che_cosa_e
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词语之一，出自“预约是为了什么？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson05.match.001
  lesson_content_key: it.a1.unit58.lesson05.leggere_una_conferma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个意大利语单词与它的中文意思配对；这些单词出自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson06.choose.001
  lesson_content_key: it.a1.unit58.lesson06.marco_aiuta_nina_a
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“马可帮她提醒”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson01.translate.002
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“预约”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson01.order.003
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: word_order
  frame:
    text: Vorrei {item} un appuntamento.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_fissare
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei {item} un appuntamento.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 我想预约一下。fissare 的意思是确定；约定(预约)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson01.fill.004
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: fill_in_blank
  frame:
    text: Oggi alle dieci Nina ha un {item} per assistenza informatica. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_appuntamento
    hint:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_appuntamento
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 尼娜今天十点有一个电脑帮助的预约。appuntamento 的意思是预约。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson02.order.002
  lesson_content_key: it.a1.unit58.lesson02.un_orario_e_disponibile
  type: word_order
  frame:
    text: Mercoledì alle dieci è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_disponibile
  answer_derivation:
    kind: render_frame
    frame:
      text: Mercoledì alle dieci è {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 星期三十点有空。disponibile 的意思是有空的、可用的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson03.order.002
  lesson_content_key: it.a1.unit58.lesson03.per_che_cosa_e
  type: word_order
  frame:
    text: Per assistenza {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_informatica
  answer_derivation:
    kind: render_frame
    frame:
      text: Per assistenza {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 请帮我解决电脑问题。informatica 的意思是电脑的；信息技术的(阴性)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit58.lesson05.order.002
  lesson_content_key: it.a1.unit58.lesson05.leggere_una_conferma
  type: word_order
  frame:
    text: L'appuntamento è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_confermato
  answer_derivation:
    kind: render_frame
    frame:
      text: L'appuntamento è {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 预约已确认。confermato 的意思是已确认的(阳性)。
    language_code: zh
    direction: ltr
