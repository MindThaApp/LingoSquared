  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_romanzo
        - w_titolo
        - w_scrittore
        - w_famoso
        - w_libri
        - w_nuovi
        - w_segnalibro
        - w_negozio
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“小说与书名”一课。'
    language_code: zh
    direction: ltr
