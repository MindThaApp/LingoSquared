templates:
- content_key: practice.zh-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 国籍词会随说话人的性别变化：男性用 americano，女性用 americana；italiano 和 italiana 也是同样的规律。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? 用来问朋友来自哪里；对陌生人则说 Di dov'è, Lei?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 意大利的城市名称常常与中文名称不同：Milano 就是米兰。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson01.match.004
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 词尾表示性别：男性用 -o（americano），女性用 -a（americana）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 意大利语中国籍和语言的名称不大写：italiano，inglese。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: 你来自哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? 是 tu 的问法；礼貌的 Lei 形式是 Di dov'è, Lei?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 动词词尾表示动作的执行者：parlo 是“我说”，parli 是“你说”（非正式），parla 是“您说”（正式）或“他／她说”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parli 和 parla 听起来很像：最后一个元音能告诉你是 tu（-i）还是 Lei（-a）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 在 parlare 之后，语言名称通常不需要冠词：parlo inglese，parlo italiano。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? 询问你学了多长时间；意大利语在表示“已经多久”时，用现在时加 da。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: 你会说英语吗？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Parli 是 tu 的形式；对陌生人要用 Lei 的形式：Parla inglese?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fai 和 fa 都是 fare 的变位形式：fai 对应 tu，fa 对应 Lei 或他／她。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ingegnere 的重音在倒数第二个音节：in-ge-GNE-re。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? 字面意思是问你做什么工作；礼貌的说法是 Che lavoro fa, Lei?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai 是 fare 的 tu 形式；用于 Lei 时变成 fa。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.match.005
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Che 是个用法灵活的词：在 Che lavoro fai? 中意思是“什么”，在 Che bello! 中则表示“多么……”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.translate.006
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per 的意思是“为了”：per lavoro 是“为了工作”，per due anni 是“为期两年”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit02.lesson03.translate.007
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: 我来这里是为了工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono qui per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 意大利语在这里的 per 后面不用冠词：per lavoro，为了工作。
    language_code: zh
    direction: ltr
