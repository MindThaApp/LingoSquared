templates:
- content_key: practice.zh-it.it.a1.unit03.lesson01.choose.001
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno 是数数时用的数字；用在阳性名词前缩略为 un，用在阴性名词前变为 una。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson01.listen.002
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sette 和 otto 都有双写的 t；发音时要稍微拉长一点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson01.order.003
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: word_order
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 意大利语用 avere（有）表示年龄：ho cinque anni 字面意思是“我有五年”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson01.fill.004
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: fill_in_blank
  frame:
    text: Quanti anni {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hai 是 avere 的 tu 变位形式；对 Lei 则问 Quanti anni ha?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson01.match.005
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 零到十是最基本的构件；十几和几十以后会由它们构成。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson01.translate.006
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: translation
  frame:
    text: 我{age}岁。
    language_code: zh
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 表示年龄绝不能用 sono：要说 Ho dieci anni，而不是 Sono dieci anni。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson02.choose.001
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ne 表示“其中的”或“它们中的”：Ne vorrei tre 的意思是“我想要其中的三个”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson02.listen.002
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Caffè 的重音在最后一个音节，用重音符号标出。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson02.order.003
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: word_order
  frame:
    text: Quanto costa un {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Costa 是单数，所以用于一件东西：Quanto costa un cornetto? 若是几件东西，则说 costano。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson02.fill.004
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: fill_in_blank
  frame:
    text: Ne {item} tre, grazie. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vorrei 是礼貌地点餐或请求某物的说法，比“我要”语气更委婉。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson02.translate.005
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cinquanta 是五十；意大利语从四十起，整十的数字都以 -anta 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson02.translate.006
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: 一个{item}多少钱？
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quanto costa? 不需要表示“做”的助词：quanto（多少）加 costa（值、花费）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson03.choose.001
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tuo 和 mio会随性变化；这里都是阳性，因为 numero 是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson03.order.002
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: word_order
  frame:
    text: Qual è il tuo numero di {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Qual 是 quale 的缩写；在 essere 的变位形式前要去掉末尾的 e。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson03.fill.003
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: fill_in_blank
  frame:
    text: Qual è il {item} numero di telefono? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il tuo numero 问的是对方的号码；il mio numero 回答的是你自己的号码。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson03.match.004
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il 是阳性单数的定冠词；numero 和 telefono 都是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson03.translate.005
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Perfetto 要与所描述的名词保持一致：搭配阴性名词时变为 perfetta。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit03.lesson03.translate.006
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: 你的电话号码是多少？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tuo 是非正式的“你的”；对 Lei 则要说 il Suo numero。
    language_code: zh
    direction: ltr
