templates:
- content_key: practice.zh-it.it.a1.unit15.lesson01.choose.001
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Più 表示“更多”；dei 和 delle 是 di 加定冠词的复数形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson01.listen.002
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dei 与阳性复数名词搭配，delle 与阴性复数名词搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson01.order.003
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: Voglio {item} caffè, meno tè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Voglio {item} caffè, meno tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più 表示“更多”，meno 表示“更少”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson01.order.004
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: I pomodori costano meno {item} mele.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mele 是阴性复数，所以 di 加 le 变成 delle。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson01.fill.005
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: fill_in_blank
  frame:
    text: Le mele costano più {item} pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pomodori 是阳性复数，所以 di 加 i 变成 dei。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson01.translate.006
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: 苹果比西红柿贵。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele costano più {item} pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dei 是 di 加 i，要与被比较的对象 pomodori 一致，而不是与 mele 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson01.translate.007
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: 西红柿比苹果便宜。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno delle 表示“比……更少”，后面接阴性复数名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson03.choose.001
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quale 表示“哪个”，用来请你在几个选项中做选择。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson02.order.001
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: word_order
  frame:
    text: Ciao, {item} preferisci, le mele o i pomodori?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quale preferisci? 用来问你更喜欢两样东西中的哪一个。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson02.fill.002
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: fill_in_blank
  frame:
    text: Ciao, {item} preferisci, il caffè o il tè? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quale 表示“哪个”，在这个问句中位于动词之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson02.translate.003
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: translation
  frame:
    text: 嗨，你更喜欢哪个，苹果还是西红柿？（非正式，tu）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci 是非正式的 tu 形式，所以这个问句是问朋友的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson03.choose.002
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone 是 buono 的阴性复数形式，与 mele 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson03.listen.003
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone 以 -e 结尾，因为它修饰的是阴性复数名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson03.order.004
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: word_order
  frame:
    text: Sì, le mele sono {item} come i pomodori.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono buone 是复数，所以 buono 随阴性复数 mele 变成 buone。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson03.fill.005
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: fill_in_blank
  frame:
    text: Le mele sono {item} come i pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Come 连接两个相同的事物：buone come 表示“和……一样好”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit15.lesson03.translate.006
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: translation
  frame:
    text: 苹果和西红柿一样好吃。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Buone 与 mele 一致；come 在这个比较中表示“如同”。
    language_code: zh
    direction: ltr
