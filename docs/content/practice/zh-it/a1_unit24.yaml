  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: translation
  frame:
    text: 我用卡付款。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Pago con la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 意大利语说 con la carta，字面意思是“带着卡”，而且要加冠词。
    language_code: zh
    direction: ltr
