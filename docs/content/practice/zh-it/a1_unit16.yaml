templates:
- content_key: practice.zh-it.it.a1.unit16.lesson01.choose.001
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La testa、la pancia 和 la gola 都是阴性名词,所以都用 la。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson01.listen.002
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: listen_select
