    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mi fa male la testa 的意思是“我头疼”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson01.order.003
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: word_order
  frame:
    text: Mi fa male la {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi fa male la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi fa male 加上 la 和一个身体部位,表示那个部位疼。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson01.fill.004
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: fill_in_blank
  frame:
    text: Mi fa {item} la testa. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mi fa male 字面意思是“让我难受”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson01.translate.005
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: translation
  frame:
    text: 我头疼。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi fa male la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 身体部位放在 mi fa male 之后,并且用 la。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson01.translate.006
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: translation
  frame:
    text: 我喉咙痛。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi fa male la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Gola 是阴性名词,所以用 la。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson02.choose.001
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ho la febbre 和 ho la tosse 都用 ho(我有)加 la。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson02.order.002
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: word_order
  frame:
    text: Ho la {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho la febbre 的意思是“我发烧”;ho la tosse 的意思是“我咳嗽”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson02.fill.003
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: fill_in_blank
  frame:
    text: Oggi non mi {item} bene. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mi sento 是第一人称形式:我感觉。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson02.translate.004
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: translation
  frame:
    text: 我发烧。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 意大利语说 ho la febbre,症状名词前要加 la;汉语则直接说“发烧”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson02.translate.005
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: translation
  frame:
    text: 我今天不舒服。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi non mi {item} bene.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Non mi sento bene 的意思是“我不舒服”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.choose.001
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dottore 指男医生,dottoressa 指女医生。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.listen.002
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Devo 的意思是“我必须”,后面接动词不定式,例如 andare。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.order.003
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: word_order
  frame:
    text: Devo {item} dal dottore.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo {item} dal dottore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Devo 加动词不定式,表示“我得做某事”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.fill.004
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: fill_in_blank
  frame:
    text: Prendi questa medicina e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Riposa 是非正式命令式:休息。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.translate.005
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: 我得去看医生。(男性说)
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo andare dal {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dal 是 da 加 il:用于去某人那里,所以 dal dottore 的意思是“去医生那里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.translate.006
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: 吃这个药,好好休息。(非正式,对说 tu 的人)
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Prendi questa {item} e riposa.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendi 和 riposa 是非正式命令式,用于称呼 tu 的人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit16.lesson03.match.007
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
