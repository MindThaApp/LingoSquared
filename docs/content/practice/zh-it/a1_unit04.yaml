templates:
- content_key: practice.zh-it.it.a1.unit04.lesson01.choose.001
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 意大利语的星期名称用小写字母书写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson01.listen.002
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Martedì 和 mercoledì 的最后一个音节带有书写重音符号，该音节要重读。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson01.order.003
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che giorno è oggi? 问的是星期几；问日期要说 Che data è oggi?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson01.fill.004
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: fill_in_blank
  frame:
    text: Che giorno è {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi 是“今天”，domani 是“明天”，两者可以用同样的问句来问。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson01.match.005
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 星期一到星期五都以 -dì 结尾，来自 dies（日）；sabato 和 domenica 则不是。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson01.translate.006
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: translation
  frame:
    text: 今天是{day}。
    language_code: zh
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è {day}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 这样使用星期名称时，意大利语不加冠词：说 Oggi è lunedì，而不是 Oggi è il lunedì。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson02.choose.001
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 意大利语的月份名称不大写：gennaio, febbraio, marzo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson02.listen.002
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Febbraio 中有双写的 b；注意听那个拉长的辅音。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson02.order.003
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Data 是“日期”；Che data è oggi? 问的是几月几号，而不是星期几。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson02.fill.004
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: fill_in_blank
  frame:
    text: Oggi è il {item} marzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 日期用 il 加基数词：il quindici marzo，即3月15日。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson02.translate.005
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gennaio, febbraio, marzo 和 aprile 按一年中月份的先后顺序排列，和汉语的1月、2月、3月、4月一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson02.translate.006
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: 今天是{month}5日。
    language_code: zh
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è il cinque {month}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 意大利语先说日，再说月：il cinque gennaio，字面意思是“五 一月”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson03.choose.001
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivo 是“我到达”，arrivi 是“你到达”（非正式）；词尾 -i 表示 tu（你）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson03.order.002
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: word_order
  frame:
    text: Quando arrivi a {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Quando arrivi a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Roma 是罗马；意大利城市的名称常与汉语译名不同，a 是与城市搭配表示“到”和“在”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson03.fill.003
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: fill_in_blank
  frame:
    text: Quando {item} a Roma? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quando arrivi? 是问朋友什么时候到；礼貌的说法是 Quando arriva?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson03.match.004
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dopodomani 由 dopo（之后）和 domani（明天）构成，意思是“后天”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson03.translate.005
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Arrivo 是“我到达”，arrivi 是“你到达”；只有最后的元音发生变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit04.lesson03.translate.006
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: 我星期四下午到。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 星期名称前，意大利语不需要表示“在”的词：arrivo giovedì，我星期四到。
    language_code: zh
    direction: ltr
