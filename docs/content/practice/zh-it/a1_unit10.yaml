templates:
- content_key: practice.zh-it.it.a1.unit10.lesson01.choose.001
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vada 和 giri 是敬语命令式，用于对陌生人说话。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson01.listen.002
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sempre dritto 的意思是“一直往前”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson01.order.003
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: word_order
  frame:
    text: Vada sempre dritto, poi giri a {item} all'incrocio.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a {item} all'incrocio.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A destra 和 a sinistra 是两个转弯方向。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson01.fill.004
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: fill_in_blank
  frame:
    text: Scusi, come arrivo al {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al museo 中的 al 是 a + il 的缩合形式，用于阳性的地点名词前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.match.001
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Destra 是“右”，sinistra 是“左”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson01.translate.005
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: 请问，去博物馆怎么走？（敬称）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, come arrivo al {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi 是对陌生人使用的敬称说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson01.translate.006
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: 一直往前走，然后在十字路口向右拐。（敬称）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a destra {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: All'incrocio 的意思是“在十字路口”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.choose.002
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: A piedi 的意思是“步行”，字面意思是“用脚”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.listen.003
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Solo 的意思是“只”，放在数量之前：solo cinque minuti。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.fill.004
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: fill_in_blank
  frame:
    text: Sono {item} cinque minuti a piedi. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Solo 放在 cinque minuti 之前，表示“只要五分钟”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.order.005
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: word_order
  frame:
    text: È {item} da qui?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Lontano da qui 的意思是“离这里远”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.translate.006
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: 离这里远吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: È lontano da qui? 是询问距离的日常说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.translate.007
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: 不远，走路只要五分钟。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: No, sono {item} cinque minuti a piedi.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 这里用 Sono cinque minuti，是因为 minuti 是复数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.translate.008
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: 非常感谢，您真好。（敬称）
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Grazie mille, {item} gentile.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Molto gentile 是正式场合表示感谢的礼貌说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson03.choose.001
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Continui、vada 和 giri 都是敬语命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson03.order.002
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: word_order
  frame:
    text: Poi {item} sempre dritto.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Poi {item} sempre dritto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Continui 是敬语命令式，意思是“继续”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson03.translate.003
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: translation
  frame:
    text: 然后请继续一直往前走。（敬称）
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Poi {item} sempre dritto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Continui 是 continuare 的 Lei 命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit10.lesson02.translate.009
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Destra 和 sinistra 是“右”和“左”；lontano 是“远”。
    language_code: zh
    direction: ltr
