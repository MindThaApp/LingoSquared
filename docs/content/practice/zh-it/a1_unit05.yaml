templates:
- content_key: practice.zh-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 表示时间时要用阴性复数 le，因为 ore（小时）是阴性复数：sono le tre。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 一点是个例外：l'una 是单数，所以用 è，而不是 sono。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: word_order
  frame:
    text: Che {item} sono?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} sono?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che ore sono? 字面意思是“现在是几个小时？”，所以回答以 sono le 开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson01.fill.004
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: fill_in_blank
  frame:
    text: Sono {item} tre. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: le 与省略的 ore 保持一致：sono le tre 表示现在三点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson01.translate.005
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: translation
  frame:
    text: 现在{n}点。
    language_code: zh
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le {n}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 除了一点（l'una）以外，其他整点都用 sono le。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.choose.001
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: e 表示加上分钟，meno 表示减去分钟：le tre e mezzo 是 3:30，le quattro meno un quarto 是 3:45。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.listen.002
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mezzo 有双 z，发音要稍微拖长一点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.order.003
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: word_order
  frame:
    text: Sono le tre e un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: E un quarto 表示加十五分钟：le tre e un quarto 是 3:15。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.fill.004
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: fill_in_blank
  frame:
    text: Sono le tre e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mezzo 的意思是一半，所以 e mezzo 表示加三十分钟。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.match.005
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mezzo 是一半，quarto 是一刻；先说钟点，再说 e 或 meno。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.translate.006
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: 现在是差一刻4点。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le quattro meno un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno 表示从下一个整点往回减：le quattro meno un quarto 是 3:45。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson02.translate.007
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: 现在是3点半。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: E mezzo（加一半）是表示几点半的日常说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson03.choose.001
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alle 表示“在……”（阴性复数），用于钟点：alle tre，在三点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson03.listen.002
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ora 是“小时”或“时间”；ore 是它的复数，所以问句是 Che ore sono?
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson03.order.003
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: word_order
  frame:
    text: A che {item} ci vediamo?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: A che {item} ci vediamo?
      language_code: it
      direction: ltr
  feedback_frame:
    text: A che ora 问的是“在几点”；这里 ora 用单数，因为问的是某一个时刻。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson03.fill.004
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: fill_in_blank
  frame:
    text: Ci vediamo {item} tre e mezzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 除了一点要说 all'una 以外，其他整点都用 alle。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson03.translate.005
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: 我们3点半见。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo {item} tre e mezzo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle 加上时间，是约定见面的标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit05.lesson03.translate.006
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mattina 和 sera 是早上和晚上；意大利语在它们前面加 di：di mattina，di sera。
    language_code: zh
    direction: ltr
