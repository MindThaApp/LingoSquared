templates:
- content_key: practice.zh-it.it.a1.unit12.lesson01.choose.001
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Stasera 的意思是“今晚”，来自 questa sera。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson01.listen.002
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andiamo 是 andare 的“我们”形式，用于提议：我们走吧。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson01.order.003
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: word_order
  frame:
    text: Andiamo al {item} stasera?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Andiamo al {item} stasera?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Al 是 a 加 il：al cinema 的意思是“去电影院”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson01.fill.004
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: fill_in_blank
  frame:
    text: Andiamo al cinema {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Stasera（今晚）也用于告别语 a stasera：今晚见。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson01.fill.005
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: fill_in_blank
  frame:
    text: Va bene, {item}! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Andiamo 可用来回应提议：我们走吧。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson01.translate.006
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: translation
  frame:
    text: 我们今晚去看电影好吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Andiamo al {item} stasera?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Andiamo 用上扬的语调就是在提议。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson01.translate.007
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: translation
  frame:
    text: 好的，我们走吧！
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, andiamo! 表示接受提议。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson02.choose.001
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Davanti al cinema 的意思是“在电影院前面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.listen.001
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Allora 可以表示“那么”或“于是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson02.order.002
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: word_order
  frame:
    text: Ci vediamo alle otto, {item} al cinema.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo alle otto, {item} al cinema.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Davanti al 加地点，表示“在……前面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson02.fill.003
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: fill_in_blank
  frame:
    text: Perfetto, a stasera {item}! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A stasera allora 的意思是“那么，今晚见”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson02.translate.004
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: translation
  frame:
    text: 我们八点在电影院门口见面吧。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo alle otto, {item} al cinema.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle 加时间，用来约定见面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.choose.002
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Se 的意思是“如果”，non 的意思是“不”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.fill.003
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: fill_in_blank
  frame:
    text: Allora, {item} stasera non va bene, andiamo domani. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se 引出条件：如果今晚不行。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.fill.004
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: fill_in_blank
  frame:
    text: Se stasera {item} va bene, andiamo domani. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Non 放在动词前面，构成否定。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.translate.005
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: translation
  frame:
    text: 如果今晚不行，我们明天去。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Se stasera {item} va bene, andiamo domani.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Non va bene 的意思是“不行”，字面意思是“不好”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.match.006
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Se 是“如果”，non 是“不”，allora 是“那么”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit12.lesson03.translate.007
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se、non 和 allora 是制定计划时常用的小词。
    language_code: zh
    direction: ltr
