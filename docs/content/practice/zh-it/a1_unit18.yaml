    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camera da letto 的意思是卧室。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson01.order.003
  lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
  type: word_order
  frame:
    text: Questa è la mia {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è la mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Questa 和 mia 是阴性，要和阴性的房间名词保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson01.fill.004
  lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
  type: fill_in_blank
  frame:
    text: Ci sono quattro {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Stanze 是 stanza 的复数，所以跟在 quattro 后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson01.translate.005
  lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
  type: translation
  frame:
    text: 这是我的厨房。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è la mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Cucina 是阴性，所以要用 questa 和 mia。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson02.choose.001
  lesson_content_key: it.a1.unit18.lesson02.i_mobili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nel 搭配阳性名词，nella 搭配阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson02.order.002
  lesson_content_key: it.a1.unit18.lesson02.i_mobili
  type: word_order
  frame:
    text: Il {item} è in cucina.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Il {item} è in cucina.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Il tavolo 是阳性，in cucina 不用冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson02.fill.003
  lesson_content_key: it.a1.unit18.lesson02.i_mobili
  type: fill_in_blank
  frame:
    text: Il divano è {item} soggiorno. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nel 是 in 加 il，因为 soggiorno 是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson02.translate.004
  lesson_content_key: it.a1.unit18.lesson02.i_mobili
  type: translation
  frame:
    text: 床在卧室里。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Il letto è {item} camera da letto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Nella 是 in 加 la，因为 camera 是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson02.translate.005
  lesson_content_key: it.a1.unit18.lesson02.i_mobili
  type: translation
  frame:
    text: 椅子在桌子旁边。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} è vicino al tavolo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sedia 是阴性，用 la。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson03.choose.001
  lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dietro、sopra 和 sotto 用来说明东西在哪里。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson03.listen.002
  lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sopra 的意思是上面，sotto 的意思是下面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson03.order.003
  lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
  type: word_order
  frame:
    text: Il divano è {item} il tavolo.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Il divano è {item} il tavolo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dietro 可以直接放在名词前面：dietro il tavolo，意思是“在桌子后面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson03.fill.004
  lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
  type: fill_in_blank
  frame:
    text: La sedia è {item} il tavolo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sotto il tavolo 的意思是“在桌子下面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson03.translate.005
  lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
  type: translation
  frame:
    text: 床靠近窗户。
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Il letto è vicino alla {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Alla 是 a 加 la，因为 finestra 是阴性。
    language_code: zh
    direction: ltr
