templates:
- content_key: practice.zh-it.it.a1.unit18.lesson01.choose.001
  lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il soggiorno 和 il bagno 是阳性；la cucina 是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit18.lesson01.listen.002
  lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
