templates:
- content_key: practice.zh-it.it.a1.unit07.lesson01.choose.001
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cosa desidera? 是咖啡吧工作人员询问您想要什么的正式说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson01.listen.002
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Per favore 是每次点餐都要加上的礼貌用语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson01.order.003
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: word_order
  frame:
    text: Vorrei un caffè e un {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vorrei 的意思是“我想要”,是礼貌的点餐说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson01.fill.004
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: fill_in_blank
  frame:
    text: Vorrei un caffè, per {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per favore 的意思是“请”,放在请求的末尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: 麻烦您，我想要一杯咖啡和一个羊角面包。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un 用于 caffè 和 cornetto 这样的阳性名词；per favore 用来结束请求。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: 您想要什么？(正式，Lei)
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera 是服务员使用的正式 Lei 形式，不是非正式的 tu 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Basta così 是固定短语，意思是“这样就够了，不用再要了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Così 的意思是“这样”,在 basta così 中用来结束点餐。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson02.fill.001
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
  type: fill_in_blank
  frame:
    text: Grazie, {item} così. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Basta 的意思是“够了”;basta così 是告诉服务员不用再加了。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson02.translate.002
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
  type: translation
  frame:
    text: 这样就够了，谢谢。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} così, grazie.'
      language_code: it
      direction: ltr
  feedback_frame:
    text: Basta così, grazie 是礼貌地结束点餐的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.choose.003
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Un'acqua 保留撇号，因为 acqua 是阴性且以元音开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.listen.004
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il menù 和 il conto 是阳性，所以用 il。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.fill.005
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: fill_in_blank
  frame:
    text: Il {item}, per favore. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il conto, per favore 是要求买单的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.order.006
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: word_order
  frame:
    text: Un panino e {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Un panino e {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un'acqua 是阴性形式：una 在元音前变成 un'。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.match.007
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il panino 和 il conto 是阳性；l'acqua 是阴性，并且省略了元音。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.translate.008
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: 麻烦您，一个三明治和一瓶水。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Un panino e {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Acqua 是阴性名词，所以“一瓶水”是 una acqua，省音后写作 un'acqua。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.translate.009
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: 请买单。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Il {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Il conto 是用餐结束时你要求的账单。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit07.lesson03.translate.010
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 意大利语的名词都带冠词：il panino、l'acqua、il menù、il conto。
    language_code: zh
    direction: ltr
