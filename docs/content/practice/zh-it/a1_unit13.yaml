templates:
- content_key: practice.zh-it.it.a1.unit13.lesson01.choose.001
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andato 和 andata 分别是“去”的阳性和阴性过去形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.listen.002
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 女性用 andata，男性用 andato。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.order.003
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
  frame:
    text: Sono {item} al cinema ieri.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 与 sono 连用时，过去分词要与说话者一致：男性用 andato，女性用 andata。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.fill.004
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: fill_in_blank
  frame:
    text: Ho {item} un bel film! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Visto 与 ho 连用：ho visto，意为“我看了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.fill.005
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: fill_in_blank
  frame:
    text: Ho visto un {item} film! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bel 是 bello 放在阳性名词前的短形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.order.006
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
  frame:
    text: Ho visto un bel {item}!
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho visto un bel {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Film 是阳性名词，所以搭配 un 和 bel。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.translate.007
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 我昨天去看电影了。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 男性说 sono andato，女性说 sono andata。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.translate.008
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 我昨天去了电影院。（女性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Andare 用 sono，词尾要与说话人的性别一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson01.translate.009
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 我看了一部好看的电影！
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho visto un bel {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vedere 用 ho：ho visto，意思是“我看了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.match.001
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 很多过去时形式用 ho 加过去分词：ho visto、ho mangiato、ho fatto；andare 则用 sono。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.choose.002
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pranzo 的意思是午饭，搭配 a 使用：a pranzo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.listen.003
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ho mangiato 的意思是“我吃了”；hai fatto 的意思是“你做了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.fill.004
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: fill_in_blank
  frame:
    text: Ho {item} un panino a pranzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mangiato 是用在 ho 后面的过去分词形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.fill.005
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: fill_in_blank
  frame:
    text: Ho mangiato un panino a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A pranzo 的意思是“午饭时”“在午餐时间”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.order.006
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: word_order
  frame:
    text: Cosa hai {item} ieri?
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa hai {item} ieri?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai fatto 的意思是“你做了”或“你做出了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.translate.007
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: 我午饭吃了一个三明治。
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho mangiato un panino a {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A pranzo 的意思是“午饭时”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.translate.008
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: 你昨天做了什么？（非正式，tu）
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa hai {item} ieri?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai fatto 是非正式的 tu 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit13.lesson02.translate.009
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ieri 是“昨天”，stamattina 是“今天早上”。
    language_code: zh
    direction: ltr
