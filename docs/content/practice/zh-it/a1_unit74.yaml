- content_key: practice.zh-it.it.a1.unit74.lesson04.match.001
  lesson_content_key: it.a1.unit74.lesson04.il_programma_dello_spettacolo
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个意大利语单词与它的中文意思配对；这些单词出自本单元的课程。
    language_code: zh
    direction: ltr
