  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_sipario
  answer_derivation:
    kind: render_frame
    frame:
      text: Il {item} è rosso.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 幕布是红色的。sipario 的意思是“幕布”（舞台幕布）。
    language_code: zh
    direction: ltr
