- content_key: practice.zh-it.it.a1.unit74.lesson01.order.002
  lesson_content_key: it.a1.unit74.lesson01.andiamo_a_teatro_oggi
  type: word_order
  frame:
    text: Lo spettacolo è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popolare
  answer_derivation:
    kind: render_frame
    frame:
      text: Lo spettacolo è {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 这场演出很受欢迎。popolare 的意思是“受欢迎的”。
    language_code: zh
    direction: ltr
