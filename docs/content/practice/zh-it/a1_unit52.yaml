  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appetito
    - w_assaggi
    - w_assaggia
    - w_assaggiare
    - w_buonissima
    - w_cena
    - w_cipolla
    - w_cucinano
    - w_entra
    - w_frigge
    - w_friggere
    - w_friggi
    - w_friggo
    - w_padella
    - w_pomodoro
    - w_prepara
    - w_preparare
    - w_prepari
    - w_prepariamo
    - w_preparo
    - w_pronta
    - w_tagliamo
    - w_tagliare
    - w_taglio
templates:
- content_key: practice.zh-it.it.a1.unit52.lesson01.choose.001
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_cipolla
        - w_pomodoro
        - w_tagliare
        - w_taglio
        - w_cena
        - w_padella
        - w_friggere
        - w_friggi
        - w_friggo
        - w_preparare
        - w_preparo
        - w_assaggiare
        - w_assaggia
        - w_entra
        - w_tagliamo
        - w_assaggi
        - w_cucinano
        - w_frigge
        - w_prepara
        - w_pronta
        - w_prepari
        - w_prepariamo
        - w_buonissima
        - w_appetito
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于洋葱、番茄和切菜的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit52.lesson02.listen.001
  lesson_content_key: it.a1.unit52.lesson02.la_padella_e_friggere
