- content_key: practice.zh-it.it.a1.unit52.lesson01.order.002
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: word_order
  frame:
    text: Ho una {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_cipolla
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 我有一个洋葱。cipolla 的意思是洋葱。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit52.lesson01.fill.003
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: fill_in_blank
  frame:
    text: Ho una cipolla e un {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_pomodoro
    hint:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_pomodoro
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我有一个洋葱和一个西红柿。pomodoro 的意思是西红柿。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit52.lesson01.translate.004
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: translation
  frame:
    text: 好的，我来切洋葱，你来炒西红柿。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_taglio
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, io {item} la cipolla e tu friggi il pomodoro.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 好的，我来切洋葱，你来炒西红柿。taglio 的意思是“我切”。
    language_code: zh
    direction: ltr
