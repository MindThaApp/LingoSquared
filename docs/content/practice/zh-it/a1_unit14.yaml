templates:
- content_key: practice.zh-it.it.a1.unit14.lesson01.choose.001
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco 是 preferire 的“我”的形式，preferisci 是非正式的“你”的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson01.listen.002
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco 和 preferisci 只有最后一个元音不同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson01.order.003
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: word_order
  frame:
    text: Preferisci il caffè o il {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tè 带有重音符号，以区别于 te（你）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson01.fill.004
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: fill_in_blank
  frame:
    text: Io {item} il caffè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferisco 以 -o 结尾，因为主语是“我”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson01.translate.005
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: 你更喜欢咖啡还是茶？（非正式，tu）
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci 是这个动词非正式的 tu 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson03.translate.001
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: 我也更喜欢咖啡！
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Anch'io {item} il caffè!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Anch'io 的意思是“我也是”，preferisco 是“我”的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson03.match.002
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tè 是茶；te 是用在介词后面的代词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson03.choose.003
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Piace 用在 mi piace 中，意思是“我喜欢”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson02.listen.001
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mi piace molto 的意思是“我非常喜欢”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson02.order.002
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: word_order
  frame:
    text: Mi {item} molto il cornetto.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piace 要与被喜欢的事物保持一致，这里是单数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson02.fill.003
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: fill_in_blank
  frame:
    text: E a {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A te 的意思是“对你来说”，是以非正式的方式反过来问对方同样的问题。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson02.translate.004
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: 我很喜欢羊角面包。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi piace molto 的意思是“我非常喜欢”，字面意思是“它对我来说非常讨喜”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson02.translate.005
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: 你呢？（非正式，在说完自己喜欢某样东西后反问对方）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: E a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 在 a 这样的介词后面，tu 变成 te：a te，意思是“对你来说”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson03.fill.004
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: fill_in_blank
  frame:
    text: A {item} no, preferisco il tè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A me 的意思是“对我来说”；在介词后面，io 变成 me。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson03.translate.005
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: 我不是，我更喜欢茶。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} no, preferisco il tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A me no 的意思是“我不是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit14.lesson01.translate.006
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferire 是“更喜欢”；preferisco 是“我更喜欢”。
    language_code: zh
    direction: ltr
