templates:
- content_key: practice.zh-it.it.a1.unit23.lesson01.choose.001
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pronto 是意大利语中接电话时说的话。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.listen.002
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chi 的意思是“谁”，用在 chi parla? 中。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.order.003
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: word_order
  frame:
    text: Pronto, {item} parla?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto, chi parla? 是标准的电话开场白。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.order.004
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: word_order
  frame:
    text: Ti mando un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti mando un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un messaggio 是阳性名词，所以用 un。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.fill.005
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: fill_in_blank
  frame:
    text: Ti {item} un messaggio. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mando 是 mandare 的第一人称单数形式：我发送。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.translate.006
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: 喂，请问哪位？
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto 用于接电话，chi 的意思是“谁”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.translate.007
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: 我给你发一条消息。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti {item} un messaggio.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ti 的意思是“给你”，放在动词前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson01.translate.008
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 作为问候语，pronto 只在电话里使用；在其他场合它的意思是“准备好了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson02.choose.001
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Puoi 是 potere 的非正式 tu 形式：你可以。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson02.order.002
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Sam, puoi {item}, per favore?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, puoi {item}, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi 加动词原形，可以请别人做某事。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson02.order.003
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Parla più {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più piano 的意思是“更慢地”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson02.fill.004
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: fill_in_blank
  frame:
    text: Sam, {item} ripetere, per favore? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Puoi 以 -i 结尾，因为它是 tu 的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson02.translate.005
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: Sam，你能重复一遍吗？（非正式，tu）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, {item} ripetere, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi 是非正式形式，用于朋友之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit23.lesson02.translate.006
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: 请说慢一点。（非正式，tu）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piano 可以表示“慢的”或“慢慢地”。
    language_code: zh
    direction: ltr
