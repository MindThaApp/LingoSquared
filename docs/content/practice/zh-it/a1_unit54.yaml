  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自粉色和紫色那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit54.lesson05.match.001
  lesson_content_key: it.a1.unit54.lesson05.nina_e_giulia_comprano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个意大利语单词与它的中文意思配对；这些单词出自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit54.lesson06.choose.001
  lesson_content_key: it.a1.unit54.lesson06.tulipani_per_il_caffe
