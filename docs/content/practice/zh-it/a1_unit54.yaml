    - w_belli
    - w_bellissimi
    - w_bianco
    - w_colore
    - w_comprano
    - w_fiori
    - w_giallo
    - w_mercato
    - w_rendono
    - w_rosa
    - w_rosso
    - w_scegli
    - w_tulipani
    - w_viola
    - w_vorrebbe
    - w_vuoi
templates:
- content_key: practice.zh-it.it.a1.unit54.lesson01.choose.001
  lesson_content_key: it.a1.unit54.lesson01.rosso_e_giallo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tulipani
        - w_rosso
        - w_giallo
        - w_bianco
        - w_arancione
        - w_colore
        - w_rosa
        - w_scegli
        - w_vuoi
        - w_viola
        - w_mercato
        - w_fiori
        - w_vorrebbe
        - w_comprano
        - w_bellissimi
        - w_belli
        - w_rendono
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自红色和黄色那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-it.it.a1.unit54.lesson02.listen.001
  lesson_content_key: it.a1.unit54.lesson02.bianco_e_arancione
