schema_version: '1.0'
pack_key: practice.prs-en.a1.unit60
source_language: prs
target_language: en
unit_content_key: en.a1.unit60.invitations
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored against docs/content/PRACTICE_PACK_RECIPE.md for prs-en unit60 (invitations). backfill_lexemes_prs_en.py
    carries no agreement_tags.semantic for this direction (every lexeme has agreement_tags: {}), so per-lesson/union
    semantic tagging (recipe §3.1/§8.1) is not available; slots are constrained by language_code + the
    full part_of_speech set only, matching the established prs-en pattern (docs/content/practice/prs-en/a1_unit48.yaml).
    word_order and fill_in_blank were deliberately NOT authored: without a semantic tag to pin a single-member
    anchor, fill_in_blank would course-wide hard-fail the compiler''s single-candidate check, and an untagged
    word_order slot pools every A1 content word at course/Endless-Practice scope (recipe §1.1/§3.1c),
    which is unsafe for any frame with literal text. matching_pairs is pooled across the WHOLE unit''s
    lexemes (untagged) to clear the 6-pair floor; every template is anchored via lesson_content_key to
    one lesson so the checkpoint''s per-lesson stratification still sees every lesson that has lexemes.
    Capacity measured with §0/§9''s f".{level}.{unit}." filter: 5 distinct tokens across 2 lesson(s) with
    lexemes. THIN UNIT: only 5 distinct unit lexemes (< the 6-token matching_pairs floor), so no matching_pairs
    template could be authored and the structured tier has zero templates for this unit -- flagged for
    the coordinator, not padded with untaught vocabulary. Register: colloquial Dari per docs/content/DARI_REGISTER_REPAIR.md
    and docs/content/CLAUDE.md (2pl -ین, no Iranian -ید).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
templates:
- content_key: practice.prs-en.en.a1.unit60.lesson01.choose.001
  lesson_content_key: en.a1.unit60.lesson01.invitation_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنین.
    language_code: prs
