schema_version: '1.0'
pack_key: practice.prs-en.b2.unit06
source_language: prs
target_language: en
unit_content_key: en.b2.unit06.abstraction
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 2 fixes -- tagged 12 item slots to the unit tag; translation limited to nouns+adjectives+adverbs (removes arguing leak, am/protected verb glosses). NATIVE FLAGS: am=استم, protected=محافظت شود, shared=شریک ساخت. BACKFILL GLOSS FLAGS: arguing gloss contains English; am=استم (should be استم only as first-person copula, ambiguous); protected=محافظت شود (should be محافظت شد/شده); shared=شریک ساخت; shaped=شکل‌گرفته. Prior note: Generated for the prs-en X->en direction (Dari L1, tested content is English). Follows the established prs-en Endless-Practice pattern (a1_unit45.yaml): bare-{item} frames with untagged slots (language_code: en + part_of_speech in [noun, verb, adjective, adverb, preposition, phrase], no semantic tag) so every slot draws on the WHOLE unit lexeme pool at both unit and course scope, which is safe per PRACTICE_PACK_RECIPE.md SS3.1(c) because none of these frames carry literal English content text besides the {item} placeholder (or plain separators/dashes for matching_pairs). 4 templates per lesson x 4 lessons = 16 templates: multiple_choice + listen_select (recognition), matching_pairs x6 (structured), translation bare-word (production). listen_select is safe here because target_language=en has TTS configured. Measured capacity: 43 unit lexemes, 39 after excluding proper_noun/pronoun/particle/symbol, 39 distinct glosses -- comfortably clears the >=12 floor in every tier and the >=3 MC / >=6 matching_pairs floors. Excluded proper_noun (self-gloss risk, SS6.1), pronoun/particle (function words with no standalone meaning) from all slots. No word_order/fill_in_blank authored: no unit lexeme carries a semantic tag narrow enough to safely anchor a literal-text frame at COURSE scope (SS1.1), and matching_pairs alone clears the structured-tier floor. Feedback strings reused verbatim from the Dari-register exemplar a1_unit45.yaml.


    2026-07-26 wave-3: re-anchored all 4 match.003 matching_pairs (lesson01-04) from bare part_of_speech-only constraints to the commit-05af7ace generated per-lesson semantic tags (prs_en_b2_unit06_lessonNN_words), declared in tag_schema.agreement_tags.semantic, narrowing the content-POS filter per lesson where it improved theming. pool_check.py confirms every pool clears the 6-pair floor with 6-13 distinct unit tokens/glosses and 0 course-scope extras (tags are unit-scoped by construction), eliminating the prior Endless-Practice off-theme pull. No other classes touched.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b2_unit06_lesson01_words
    - prs_en_b2_unit06_lesson02_words
    - prs_en_b2_unit06_lesson03_words
    - prs_en_b2_unit06_lesson04_words
    - prs_en_b2_unit06_words
