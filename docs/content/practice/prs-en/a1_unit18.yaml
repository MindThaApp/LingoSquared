schema_version: "1.0"
pack_key: practice.prs-en.a1.unit18
source_language: prs
target_language: en
unit_content_key: en.a1.unit18.past_events
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the prs-en practice-pool-sync lane extending
    coverage to units 15-20, mirroring the sibling fa-en/a1_unit18.yaml
    pack's structure (16 templates). Reuses the already-established
    narrower past_verb_intransitive tag (went/ate/worked, 3 members)
    separate from the 5-member past_verb (went/saw/ate/visited/worked)
    for the "I {item} yesterday." frame -- "saw"/"visited" are
    transitive and would leave that frame feeling incomplete ("I saw
    yesterday."/"I visited yesterday."), so the full 5-member set is
    used only for bare-word recognition (multiple_choice/listen_select/
    matching_pairs), never embedded in a sentence. All POS/semantic-tag
    classification was already present in scripts/
    _en_target_lexeme_common.py before this pass -- only scripts/
    backfill_lexemes_prs_en.py's own Dari gloss dict needed extending
    (went/saw/ate/visited/worked/did/yesterday/together/watched/
    writer's/writer/s/was/week), cross-checked against docs/content/
    overlays/prs-en/a1_unit18.yaml's own real Dari phrasing (e.g.
    visited="به دیدن رفت", per that overlay's own review note which
    corrected an earlier unnatural gloss/feedback for this exact verb).
    Verified with scripts/_practice_slot_check.py that every slot has
    >=1 real candidate lexeme and every multiple_choice/listen_select
    slot has >=4 distinct candidate values (past_verb has 5). The
    underlying en realization unit18 is UNREVIEWED (Codex was usage-
    limited at authoring time); the prs-en overlay is already reviewed
    -- the realization needs the standard fresh-context review before
    import.
tag_schema:
  part_of_speech: [verb]
  agreement_tags:
    semantic: [past_verb, past_verb_intransitive]
slot_presets:
  past_verb: &past_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: past_verb}}
  past_verb_intransitive: &past_verb_intransitive {language_code: en, part_of_speech: verb, agreement_tags: {semantic: past_verb_intransitive}}
templates:
  - content_key: practice.prs-en.en.a1.unit18.lesson01.verb_meaning.001
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} فعل گذشتهٔ همی درس است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit18.lesson01.verb_listen.002
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} فعلی است که شنیدین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit18.lesson01.verb_pair.003
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: matching_pairs
    frame: {text: "{first_verb} — {second_verb}", language_code: en, direction: ltr}
    slots: {first_verb: *past_verb, second_verb: *past_verb}
    slot_relations: [{kind: distinct, slots: [first_verb, second_verb]}]
    answer_derivation: {kind: matching_pairs, slots: [first_verb, second_verb]}
    feedback_frame: {text: "دو فعل گذشته را به معنای دری آن‌ها وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit18.lesson01.verb_translate.004
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این فعل دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit18.lesson02.yesterday_order.001
    lesson_content_key: en.a1.unit18.lesson02.talking_about_yesterday
    type: word_order
    frame: {text: "I {item} yesterday", language_code: en, direction: ltr}
    slots: {item: *past_verb_intransitive}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} yesterday", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} اتفاقی است که دیروز رخ داد.", language_code: prs, direction: rtl}
