  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_a1_unit46_words
    - prs_en_a1_unit46_lesson04_words
    - prs_en_a1_unit46_lesson01_words
    - prs_en_a1_unit46_lesson02_words
    - prs_en_a1_unit46_lesson03_words
slot_presets:
