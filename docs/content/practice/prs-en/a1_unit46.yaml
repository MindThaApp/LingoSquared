schema_version: '1.0'
pack_key: practice.prs-en.a1.unit46
source_language: prs
target_language: en
unit_content_key: en.a1.unit46.lost_items
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 9 fixes -- bare-word pools (all parts of speech incl. pronouns/prepositions
    with gloss like تو/شما استی, from-آن, English-bearing back) re-tagged to per-lesson content words (noun/verb/adjective),
    matching feedback converted to Dari. NATIVE FLAGS: you''re/its glosses use informal تو. BACKFILL GLOSS FLAGS: you''re=تو/شما استی, its=از آن, where''s=کجاست
    (pronoun) -> informal تو and odd function-word glosses; back=باز (در come back: باز آمدن) contains English; main=عمده/اساسی
    and item=چیز؛ وسیله slash glosses; holding=گرفته استه ok. Prior note: Authored 2026-07-12 as an additive Endless Practice
    coverage backfill for prs-en A1 unit 46. Uses the established broad bare-word recognition, matching_pairs, and translation
    shapes only; no new frame-specific grammar assumptions. Polish 2026-07-24 (tier-thinness + POS-only matching wave) --
    expanded both matching_pairs templates from 4 to 6 pairs (defect 1.19 floor) and added one lesson-anchored template per
    tier (choose/match/translate) with content-word part_of_speech pools [noun, verb, adjective] so every tier has >=3 live
    templates and non-lesson01 lessons are represented in the checkpoint lesson round-robin. matching_pairs slots left WITHOUT
    an agreement_tags.semantic union deliberately -- backfill_lexemes_prs_en.py carries 0 semantically tagged lexeme(s) for
    this unit, so no unit-native semantic union can cover 6 distinct tokens; adding tags to the backfill scripts is out of
    scope for pack-only edits (recipe SS6.3 honest-thin escape). RE-ANCHOR (2026-07-26, polish wave 3) -- commit 05af7ace
    closed the blocker above -- prs-en now carries a generated unit-wide tag (prs_en_a1_unit46_words, first-introduction-only)
    covering 26 distinct content tokens/glosses at unit scope, plus per-lesson tags. Added an agreement_tags.semantic value
    of prs_en_a1_unit46_words to every slot of match.002 and volume_match.003 (lesson01''s own tag is only 4 tokens, below
    floor, so both stay on the unit-wide union). lesson04.match.004 got the narrower `prs_en_a1_unit46_lesson04_words` instead
    -- the lesson tag alone already yields 15 distinct tokens/glosses, clearing the floor without borrowing the unit-wide
    set, so it now themes tighter to the lost_and_found_notice lesson than its siblings. POS lists left as-is (the tag only
    ever lands on noun/verb/adjective/adverb/phrase, so it narrows to content words on its own). Course-scope extras now 0
    for all three. No exact-duplicate glosses in either pool (pool_check.py).'
