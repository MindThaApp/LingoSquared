source_language: prs
target_language: en
unit_content_key: en.b1.unit04.debate
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: "Review 2026-10-19 (prs-en practice pass): 12 fixes -- choose/listen/translate slots were untagged (course scope 558) -> unit-wide tag (lessons 1-2) / lesson tags (3-4); translate pos narrowed per lesson (l1-2 noun/adj/adv; l3 verb+adverb drops each=هر (در each other); l4 adj/adv/verb drops lot). NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: each=هر (در each other) and lot=خیلی (در a lot) Latin leak (still in lesson01/02 translate, no lever); seeing/working/miss/it's/than Latin; going=می‌خواهد (آیندهٔ نزدیک) -> misleading (going to); focus=تمرکز کدن typo -> تمرکز کردن; of=ازِ/متعلق به; miss=گم کردن (در can't miss it) wrong sense. Prior note: Grammar-unit recipe (PRACTICE_PACK_RECIPE.md sec8.1) applied, mirroring the fa-en sibling pack's structure (docs/content/practice/fa-en/b1_unit04_*.yaml) since the target (en) and runtime mechanics are identical. UNLIKE fa-en, backfill_lexemes_prs_en.py carries NO semantic tags at all for this unit's lexemes (verified via the sec0 capacity dump) -- every content-word lexeme's agreement_tags is empty. So every slot here deliberately omits agreement_tags.semantic (sec3.1c untagged slot) and constrains only language_code=en + part_of_speech in [adjective, adverb, noun, phrase, verb] (excluding pronoun/particle/preposition/proper_noun/symbol). This pools the WHOLE unit's content words for every slot regardless of which lesson a template is anchored to -- exactly the sec8.1-sanctioned pattern ('Union the unit's lesson tags... it is only the SLOT that widens'); since no lesson-level tag exists to narrow further, the union is total. Safe at checkpoint scope because generate_checkpoint() only ever loads this unit's own lexemes regardless of which lesson introduced them, and the checkpoint never fires before all 4 lessons are complete. 15 templates: per lesson (x4) multiple_choice + listen_select + bare-word translation (12 total: 8 recognition, 4 production), plus 3 matching_pairs (6 pairs each, unit-wide pool) anchored to the reading lesson (full content POS), the dialogue lesson (full content POS), and the grammar lesson (verb/adjective/adverb/phrase only, mirroring fa-en's match_verbal). Deliberately skipped word_order and fill_in_blank: with no semantic tags at all there is no single-member anchor available to build a course-scope-safe hero-sentence frame, and crafting one per unit across this batch was judged too defect-prone for this pass; matching_pairs carries the structured tier instead (no frame-literal-text risk, so no course-scope grammaticality check needed). Flagging this gap (plus the missing prs-en semantic-tag backfill) to the coordinator. Read every gloss in this unit's pool per sec0.1: all distinct-token counts matched distinct-gloss counts (no accidental gloss collisions), and no sense-mismatched gloss was found against what this unit's lessons actually teach. Feedback strings written in colloquial Dari per DARI_REGISTER_REPAIR.md: کلمه not واژه، جواب not پاسخ، استه not است، -ین 2pl endings not -ید (کنین/شنیدین, never Iranian کنید/شنیدید). RE-CHECKED 2026-07-24 (POS-only matching polish): the lexeme backfill now carries sparse semantic tags on this unit, but the tag-covered content tokens are only better (condition_adjective), prefer (preference_verb/preference_verb_full), is (identity, grammar-y gloss) = 3 distinct (Leila is proper_noun, it's is pronoun), so no semantic union can reach the 6-distinct-token matching_pairs floor at unit scope; match_all.001, match_dialogue.001 and match_verbal.001 deliberately stay POS-only (a wrong union is worse than the status quo). Revisit once a fuller semantic-tag backfill lands for b1.unit04. UPDATE 2026-07-26 (wave-3 union re-pass): commit 05af7ace landed generated per-unit/per-lesson tags. match_all.001 (lesson03, reading_two_opinions) -> semantic: prs_en_b1_unit04_lesson03_words (11 distinct tok/gloss: focus, respect, thinks, can, easily, disagrees, believes, going, likes, seeing, each). match_dialogue.001 (lesson04, the_remote_work_dialogue) -> semantic: prs_en_b1_unit04_lesson04_words (12 distinct tok/gloss: think, important, conversations, fair, point, saves, lot, still, prefer, makes, sense, different). match_verbal.001 (lesson02, verb/adjective/adverb/phrase only) -> its own lesson tag only clears 4 within that POS (working, is, better, miss), so it falls back to the unit-wide semantic: prs_en_b1_unit04_words (26 distinct tok/gloss within the same POS filter). Read every gloss in all three pools: person-conjugation pairs (believe/believes, disagree/disagrees) are distinct text, judged acceptable per recipe sec6.3's singular/plural-pair allowance; no confusable or duplicate-meaning pair found. The prior blocker is resolved."
