schema_version: "1.0"
pack_key: practice.prs-en.a1.unit21
source_language: prs
target_language: en
unit_content_key: en.a1.unit21.travel
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 0 fixes -- no edits needed. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: leaves/arrives glosses contain Latin leave/arrive (not in any pool); train=ریل is acceptable but could be ریل/قطار. Prior note: Authored 2026-07-06 by the Claude session extending prs-en''s practice pool to units 21-26 (A1: travel/health/work/housing, A2: bureaucracy/ opinions), alongside two parallel workers covering units 09-14 and 15-20 (no file overlap -- this pack only touches unit21). Uses the already-built fa-en/a1_unit21.yaml pack (same shared English realization, same travel_noun tag defined in scripts/ _en_target_lexeme_common.py: ticket/platform/train/departure/arrival, 5 members, recognition-only -- these nouns don''t collocate uniformly in a shared sentence frame, "I need a ticket"/"I need a train" work but "I need a platform"/"departure"/"arrival" don''t) as the structural reference, with Dari (not Farsi) feedback text and glosses -- Dari phrasing verified against docs/content/overlays/ prs-en/a1_unit21.yaml''s own real text (تکت/سکو/ریل/حرکت/رسیدن), using the informal Afghan Dari register (کنین/استین/می‌شه) already established in prs-en''s own unit01-20 packs, not a find-replace of the fa-en pack''s Farsi. No new EN_POS/agreement_tags entries were needed (already present from the nl-en/fa-en lanes'' own unit21 work); only scripts/backfill_lexemes_prs_en.py''s Dari gloss dict and UNIT_FILES tuple were extended. Anchoring check (same discipline as the fa-en/nl-en sibling packs): verified via a direct iter_specs() dump, grouped by lesson_content_key, against every lesson in this unit''s own realization file: all four of unit21''s lessons introduce at least one new lexeme, so all four are safe anchors. Every slot''s real candidate count was verified with scripts/_practice_slot_check.py (extended in this same change to cover prs-en units 21-26) and compile_content.py practice-validate. Needs the standard fresh-context review before import. matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16): the matching_pairs template widened from 2 to 5 slots (the full course-wide travel_noun pool: ticket/platform/train/departure/ arrival), per the pre-computed retrofit table. POLISH WAVE 2 (2026-07-24, dispatched TIER-SHORT structured): structured tier raised 1 -> 3 via lesson02.order.003 and lesson04.order.003, two word_order frames on the narrower transport_noun tag. travel_noun itself cannot host a literal frame (this note''s own original finding: its 5 members don''t collocate uniformly) and unit21''s only other tagged token is train (transport_noun/vehicle_noun), so transport_noun is the one course-scope-safe widening available: its course-wide pool is exactly bike/bus/car/train (verified via iter_specs), and every member is grammatical and idiomatic in both "I go to Boston by {item}" and "We can take the {item} to Boston"; no frame word is a slot candidate (defect 1.14 clean, checked at course scope). Unit scope each slot holds 1 candidate (train) -- word_order carries no candidate floor, and both templates are live at checkpoint. tag_schema/slot_presets extended with transport_noun accordingly. match.003''s 5-pair FLOOR line was NOT dispatched to this wave and is left as-is: no semantic union can reach 6 (travel_noun has 5 members, and the only other tagged unit token is train, already in the pool) -- lifting it needs a backfill tag, off-limits here.'
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [travel_noun, transport_noun]
slot_presets:
  travel_noun: &travel_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: travel_noun}}
  transport_noun: &transport_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: transport_noun}}
templates:
  - content_key: practice.prs-en.en.a1.unit21.lesson01.choose.001
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit21.lesson01.listen.002
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit21.lesson01.match.003
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *travel_noun, second: *travel_noun, third: *travel_noun, fourth: *travel_noun, fifth: *travel_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "هر واژهٔ سفر را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit21.lesson01.translate.004
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این واژهٔ دری {item} است.", language_code: prs, direction: rtl}
