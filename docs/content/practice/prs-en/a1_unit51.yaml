schema_version: '1.0'
pack_key: practice.prs-en.a1.unit51
source_language: prs
target_language: en
unit_content_key: en.a1.unit51.pharmacy
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored against docs/content/PRACTICE_PACK_RECIPE.md for prs-en unit51 (pharmacy). backfill_lexemes_prs_en.py
    carries no agreement_tags.semantic for this direction (every lexeme has agreement_tags: {}), so per-lesson/union
    semantic tagging (recipe §3.1/§8.1) is not available; slots are constrained by language_code + the
    full part_of_speech set only, matching the established prs-en pattern (docs/content/practice/prs-en/a1_unit48.yaml).
    word_order and fill_in_blank were deliberately NOT authored: without a semantic tag to pin a single-member
    anchor, fill_in_blank would course-wide hard-fail the compiler''s single-candidate check, and an untagged
    word_order slot pools every A1 content word at course/Endless-Practice scope (recipe §1.1/§3.1c),
    which is unsafe for any frame with literal text. matching_pairs is pooled across the WHOLE unit''s
    lexemes (untagged) to clear the 6-pair floor; every template is anchored via lesson_content_key to
    one lesson so the checkpoint''s per-lesson stratification still sees every lesson that has lexemes.
    Capacity measured with §0/§9''s f".{level}.{unit}." filter: 14 distinct tokens across 4 lesson(s)
    with lexemes. Register: colloquial Dari per docs/content/DARI_REGISTER_REPAIR.md and docs/content/CLAUDE.md
    (2pl -ین, no Iranian -ید).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
