schema_version: "1.0"
pack_key: practice.prs-en.a1.unit07
source_language: prs
target_language: en
unit_content_key: en.a1.unit07.food
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (prs-en practice pass, rest): 3 fixes -- id_like_order.003, can_i_have_order.004
    and order_non_sandwich.005 frames used "a {food_item}" which is ungrammatical or marginal for
    uncountable bread/water (and soup): frames now bare mass noun (I'd like {food_item}, please. / Can I
    have {food_item}, please? / I'd like {food_item} and a sandwich, please.) and the first two pools
    moved to food_item_non_sandwich so sandwich cannot render without its article. Trade-off: no tag
    separates the countable foods, so the article a is no longer practised in these three word_order
    items. NATIVE FLAGS: cafe=کیفی (is this the Afghan word for cafe?); great=خوب استه; شوروا for soup
    is fine. BACKFILL GLOSS FLAGS: that's=دا ... استه (دا is Pashto-like, suggest این ... استه),
    proposed override in worker log. Prior notes follow.

    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). The food_item tag (7 members) already
    exists in scripts/_en_target_lexeme_common.py -- only Dari glosses
    were added to scripts/backfill_lexemes_prs_en.py (soup uses "شوروا",
    the real Afghan Dari term, distinct from Farsi's "سوپ"). Mirrors
    the sibling fa-en/a1_unit07.yaml pack's reasoning: this unit's
    ordering/menu/dialogue content is mostly fixed phrases and specific
    prices, not further slot-fillable vocabulary, so every lesson reuses
    food_item for bare-word recognition rather than forcing an unsafe
    frame. Verified with scripts/_practice_slot_check.py that every
    slot has >=1 candidate and every multiple_choice/matching_pairs
    slot has >=3 distinct candidate values.

    Fresh-context review, 2026-07-06 (separate session, zero access to
    the authoring reasoning above): confirmed all 4 lesson_content_key
    values match real en.a1.unit07.food lessons. Re-scanned for
    Pashto-only letters/vocabulary -- none found ("شوروا" confirmed
    genuine Dari, not Pashto or Farsi "سوپ"). Deliberately checked for
    the exact self-reference bug class the nl-en lane's own unit07 found
    ("I'd like a {item} and a sandwich" drawing "sandwich" into its own
    slot) -- this pack's "I'd like a {food_item}, please." frame has no
    fixed second item, so no such risk exists here. Hand-rendered all 7
    food_item fillers against every frame -- all grammatical. Upgraded
    to reviewed: genuinely clean.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    food_pair widened from 2 to 7 slots (the full course-wide food_item
    noun pool), per the pre-computed retrofit table.

    Depth pass, 2026-07-07 (templates-per-unit density audit: prs-en
    unit07 had 7 templates, with lesson02/lesson03/lesson04 each carrying
    only 1). Added 7 new templates, all real vocabulary. lesson02
    (ordering_phrases) gained id_like_order and can_i_have_order
    (word_order, "I'd like a {item}, please."/"Can I have a {item},
    please?" -- both real taught frames from this lesson's own content,
    hand-verified grammatical for all 7 food_item members, matching this
    pack's own prior fresh-context review note that the "I'd like a
    {food_item}, please." frame has no fixed second item and so carries
    no self-reference risk). lesson03 (reading_a_menu) gained food_listen
    (listen_select) and food_translate (translation) on food_item,
    reusing the same tag+type combinations lesson01 already established
    for bare-word recognition, anchored to this lesson's own real menu
    text instead (same reuse-across-lessons-within-one-pack precedent
    this file's own lesson02/order_listen already set against lesson01's
    food_listen). lesson04 (cafe_dialogue) gained food_gloss
    (multiple_choice) and food_listen (listen_select) on food_item (same
    reuse pattern), plus order_non_sandwich (word_order, "I'd like a
    {item} and a sandwich, please.") using the food_item_non_sandwich tag
    -- this narrower 6-member tag (excludes "sandwich" itself) already
    existed in scripts/_en_target_lexeme_common.py, purpose-built and
    documented there for exactly this self-reference risk (this unit's own
    real dialogue line is "Hi, I'd like a coffee and a sandwich, please.")
    but was never actually used by any template in this pack until now --
    only this pack's own tag_schema/slot_presets needed the new
    food_item_non_sandwich alias, no new classifier entries. Verified with
    scripts/_practice_slot_check.py (food_item: 7 distinct A1 candidates,
    food_item_non_sandwich: 6, both above the relevant floors) and
    compile_content.py practice-validate, 0 errors/0 warnings. No
    fill_in_blank templates added (food_item's full 7-member pool is
    genuinely ambiguous in any bare frame without a disambiguating
    anchor, so none were attempted) -- scripts/_fill_in_blank_ambiguity_
    check.py has nothing new to flag in this pack. Still carries this
    pack's own fresh-context review status from before this pass -- a
    fresh re-review of specifically these 7 new templates has not
    happened yet.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [food_item, food_item_non_sandwich]
slot_presets:
  food_item: &food_item {language_code: en, part_of_speech: noun, agreement_tags: {semantic: food_item}}
  food_item_non_sandwich: &food_item_non_sandwich {language_code: en, part_of_speech: noun, agreement_tags: {semantic: food_item_non_sandwich}}
templates:
  - content_key: practice.prs-en.en.a1.unit07.lesson01.food_gloss.001
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: multiple_choice
    frame: {text: "{food_item}", language_code: en, direction: ltr}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "معنای دری {food_item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit07.lesson01.food_listen.002
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: listen_select
    frame: {text: "{food_item}", language_code: en, direction: ltr}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "واژه‌ای که شنیدین {food_item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit07.lesson01.food_pair.003
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: matching_pairs
    frame: {text: "{food_one} — {food_two}", language_code: en, direction: ltr}
    slots: {food_one: *food_item, food_two: *food_item, food_three: *food_item, food_four: *food_item, food_five: *food_item, food_six: *food_item, food_seven: *food_item}
    slot_relations: [{kind: distinct, slots: [food_one, food_two, food_three, food_four, food_five, food_six, food_seven]}]
    answer_derivation: {kind: matching_pairs, slots: [food_one, food_two, food_three, food_four, food_five, food_six, food_seven]}
    feedback_frame: {text: "هر واژهٔ خوراکه را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit07.lesson01.food_translate.004
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: translation
    frame: {text: "{food_item}", language_code: prs, direction: rtl, slot_rendering: {food_item: english_gloss}}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_text, slot: food_item}
    feedback_frame: {text: "{food_item} معادل انگلیسی این خوراکهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit07.lesson02.order_listen.002
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: listen_select
    frame: {text: "{food_item}", language_code: en, direction: ltr}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "واژه‌ای که شنیدین {food_item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit07.lesson02.id_like_order.003
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: word_order
    frame: {text: "I'd like {food_item}, please.", language_code: en, direction: ltr}
    slots: {food_item: *food_item_non_sandwich}
    answer_derivation: {kind: render_frame, frame: {text: "I'd like {food_item}, please.", language_code: en, direction: ltr}}
    feedback_frame: {text: "{food_item} خوراکه‌ای است که سفارش داده می‌شود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit07.lesson02.can_i_have_order.004
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: word_order
    frame: {text: "Can I have {food_item}, please?", language_code: en, direction: ltr}
    slots: {food_item: *food_item_non_sandwich}
    answer_derivation: {kind: render_frame, frame: {text: "Can I have {food_item}, please?", language_code: en, direction: ltr}}
    feedback_frame: {text: "{food_item} خوراکه‌ای است که سفارش داده می‌شود.", language_code: prs, direction: rtl}
