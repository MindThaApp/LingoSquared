schema_version: "1.0"
pack_key: practice.prs-en.a2.unit29
source_language: prs
target_language: en
unit_content_key: en.a2.unit29.maintenance
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-07, closing a real visible gap: units 25-28 (the
    four earlier A2 units in this same en-target realization) already had
    fa-en/nl-en/prs-en practice packs, but unit29 (reporting a leaking
    kitchen sink to a building manager) had none in any direction. This
    is prs-en's pack, part of the same three-direction pass as fa-en's
    and nl-en's own a2_unit29.yaml -- authored independently, its own
    Dari text is not translated from the fa-en pack's Farsi text (only
    the shared English target-language tag/POS classification, defined
    once in scripts/_en_target_lexeme_common.py, is genuinely identical
    across the three, per established convention).

    One new tag: "maintenance_noun" (sink, plumber, repair -- 3 members,
    added to scripts/_en_target_lexeme_common.py this pass). Each is a
    genuinely standalone single-token noun with its own independent
    meaning, unlike "building manager" -- a true two-word compound whose
    components ("building"/"manager") are deliberately left OUT of every
    semantic tag (same discipline as unit22's "sore"/"throat", components
    of "sore throat", staying untagged with zero practice templates).
    Real A2-scoped candidate count: exactly 3 (sink/plumber/repair are
    exclusive to this unit -- no other A2 unit reintroduces them), which
    meets but does not exceed the >=3 floor for multiple_choice/
    listen_select -- verified by hand against the A2-only-scoped
    iter_specs() output, not the pooled-with-A1 count
    scripts/_practice_slot_check.py itself computes (that script still
    pools A1+A2 together; the documented gap from unit28's pack notes).
    Deliberately NOT used in any shared generative frame ("I need a
    {item}" reads naturally for plumber/repair but oddly for the fixture
    noun sink), same "don't force it" reasoning as health_followup_noun/
    bureaucracy_noun. Dari glosses for this new tag are genuinely
    distinct Afghan Dari vocabulary, not a find-replace of the fa-en
    script's Farsi (repair=ترمیم not تعمیر, report=خبر دادن not گزارش
    دادن, someone=یک کس not یک نفر -- cross-checked against, but not
    copy-pasted from, the actual prs-en overlay's own real text).

    Reused, with real A2-scoped candidate-count math done by hand (not
    trusted to the pooled-with-A1 check): (1) "bureaucracy_noun"
    (appointment/document/form/confirmation, defined unit25, same A2
    course) -- real A2-scoped count is 4 (all introduced by unit25 alone,
    unaffected by unit29), safely above the floor, so used for both
    multiple_choice and listen_select here, matching unit25-28's own
    reuse discipline. (2) "possessive" (my/your/his/her, defined unit06)
    -- lesson02's own reading text reintroduces "my" ("...with my kitchen
    sink") and lesson03/04 reintroduce "your" ("Your report...", "Here's
    your repair number") -- both generalize with zero grammar loss ("I'd
    like to report a problem with your kitchen sink" / "My report of a
    leaking kitchen sink has been received" are both real, grammatical,
    plausible sentences, e.g. a manager relaying a tenant's problem). BUT
    the real A2-scoped candidate pool is only 2 (my, your -- his/her have
    never been reintroduced in any A2 unit through unit29), so kept to
    word_order/translation only, never multiple_choice/listen_select --
    same fix already applied to unit28's own possessive reuse. (3)
    "room_noun" (bedroom/kitchen/bathroom/garden, defined unit24, an A1
    tag) -- lesson01's own "reused_home_words" card explicitly recaps
    kitchen/apartment/bathroom as this unit's own introduced_tokens. Only
    kitchen and bathroom actually carry the room_noun tag ("apartment" is
    the whole home, not a room, and was never given a semantic tag by
    the shared module) -- real A2-scoped count for room_noun via this
    unit's recap is exactly 2, below the multiple_choice/listen_select
    floor, so restricted to translation only (no floor requirement for
    that type). No new tag was invented for "apartment" alone (a single
    untagged noun with no in-unit synonym would be scope creep beyond
    what this unit's real vocabulary supports).

    A combined 7-member matching_pairs pool ("maintenance_noun" UNION
    "bureaucracy_noun", via a slot_preset with a 2-item semantic list --
    same technique this unit's sibling packs use) sits within
    AUTHORING_GUIDE.md #16's 6-12 target without padding: 3 (this unit's
    own maintenance nouns) + 4 (unit25's already-taught bureaucracy
    nouns, genuine review-pool reuse, explicitly endorsed by #16).

    ZERO fill_in_blank templates, matching this realization's own
    authoring note (unit29's realization file states zero fill_in_blank
    exercises) and every earlier A2 pack in this direction: the unit's
    single-token vocabulary is either a true two-word compound (building
    manager) that can't reduce to one blankable slot, or a tag too small
    (room_noun=2, possessive=2) to trust for an unforgiving single-slot
    fill_in_blank with no other disambiguating context. Ran
    scripts/_fill_in_blank_ambiguity_check.py after writing this pack;
    trivially 0 AMBIGUOUS/0 REVIEW since there are no fill_in_blank
    templates to flag.

    15 templates: 4 lesson01 (maintenance_noun choose/listen/translate +
    room_noun translate, recapping kitchen/apartment/bathroom), 3
    lesson02 (maintenance_noun choose + a possessive word_order against
    lesson02's own re-taught "my" + maintenance_noun listen), 4 lesson03
    (maintenance_noun choose + a second, differently-framed possessive
    word_order against lesson03's own re-taught "your"/"report"/"has"/
    "been"/"received" + possessive translate (bare) + maintenance_noun
    listen), 4 lesson04 (the 7-pair maintenance_noun+bureaucracy_noun
    matching_pairs + bureaucracy_noun listen + bureaucracy_noun translate
    (bare) + maintenance_noun translate (bare)). An honest,
    real-vocabulary-supported count for this unit's actual depth -- a bit
    below unit28's 16 since unit29 has slightly less single-token
    generative material (more of its new vocabulary is multi-word
    compounds/fixed phrases), not padded to hit a round number.

    Verified with scripts/_practice_slot_check.py (glob-discovered
    automatically for prs-en) and compile_content.py practice-validate, 0
    errors/0 warnings -- see the commit message for the exact run output.
    Still needs the standard fresh-context review before import.

    UNIT-SCOPE DEAD-TEMPLATE REPAIR (2026-07-24): scripts/_practice_unit_scope_check.py
    (which scopes candidates to THIS unit's own lesson_ids, matching
    generate_checkpoint() exactly) found the "real A2-scoped candidate-count
    math" above still wasn't the load-bearing scope: 'bureaucracy_noun'
    (defined unit25) and 'possessive' (defined unit06/reintroduced unit25)
    are course-wide reuse tags whose REAL members were introduced by
    EARLIER units -- unit29 itself introduces ZERO lexemes carrying either
    tag, so every slot built on them has 0 unit-scoped candidates and
    silently never generates at the checkpoint (recipe DO-NOT #2), even
    though they are perfectly valid for Endless Practice. Fixed by
    RE-ANCHORING to tags unit29 genuinely introduces itself
    (maintenance_noun, room_noun) plus one clean single-member addition,
    never by inventing a backfill tag:
    (1) lesson02.possessive_order.002 (word_order testing "my") ->
    REPLACED, renamed lesson02.room_order.002, re-anchored to room_noun
    (kitchen/bathroom, unit29-native via lesson01's own recap), frame
    "There's a leak in the {item}" (grammatical for both candidates;
    verified no self-reference; room_noun's A2-course-wide pool is the
    same 2 members, so no course-scope widening risk). (2)
    lesson03.possessive_order.002 (word_order testing "your") -> REPLACED,
    renamed lesson03.room_order.002, same room_noun re-anchor with a
    DIFFERENT frame ("Please check the {item} today") so it isn't a
    literal duplicate of lesson02's new template. (3)
    lesson03.possessive_translate_bare.003 -> REPLACED, renamed
    lesson03.maintenance_translate_bare.003, bare-word translation over
    maintenance_noun (sink/plumber/repair -- thematically apt, lesson03 is
    "reading_a_repair_notice"). (4) lesson04.match.001 (7-pair
    matching_pairs, unit-scoped pool only 3 since bureaucracy_noun
    contributed 0) -> reduced to the standard 6 pairs, all from unit29's
    own tags with zero padding: maintenance_noun x3 (sink/plumber/repair) +
    room_noun x2 (kitchen/bathroom) + a new single-member 'day_part_in'
    slot x1 ("morning", introduced by lesson02's own reading text, already
    carries this tag in the shared EN classification -- no backfill change
    needed) = exactly 6 distinct unit-scoped tokens, a deterministic
    bijection. (5) lesson04.bureaucracy_listen.002 -> REPLACED, renamed
    lesson04.maintenance_listen.002, re-anchored to a new
    'maintenance_room_union' preset (union of maintenance_noun + room_noun,
    5 distinct unit-scoped candidates, well above the >=3 floor). (6)
    lesson04.bureaucracy_translate_bare.003 -> REPLACED, renamed
    lesson04.maintenance_translate_bare.003, same maintenance_room_union
    re-anchor (translation has no floor, but the union gives good variety).
    'bureaucracy_noun', 'possessive' and 'maintenance_bureaucracy_combined'
    are no longer referenced anywhere in this pack and were dropped from
    tag_schema/slot_presets.
    Before: 6 DEAD template-slots (6 templates) per _practice_unit_scope_check.py.
    After: 0 DEAD, 0 below-floor for this file. practice-validate: 0 errors.
    check_dari_register.py: 0 new findings (new/changed Dari feedback text
    reuses already-vetted words/phrases verbatim from elsewhere in this
    file -- همی جمله, واژه, است -- no Iranian-register or Tehrani-contraction
    markers introduced). No backfill/realization/overlay file touched.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [maintenance_noun, room_noun, day_part_in]
slot_presets:
  maintenance_noun: &maintenance_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: maintenance_noun}}
  room_noun: &room_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: room_noun}}
  maintenance_room_union: &maintenance_room_union {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [maintenance_noun, room_noun]}}
  day_part: &day_part {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part_in}}
templates:
  - content_key: practice.prs-en.en.a2.unit29.lesson01.choose.001
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit29.lesson01.listen.002
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit29.lesson01.translate.003
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی واژه {item} است.", language_code: prs, direction: rtl}
