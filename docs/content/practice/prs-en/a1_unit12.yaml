schema_version: "1.0"
pack_key: practice.prs-en.a1.unit12
source_language: prs
target_language: en
unit_content_key: en.a1.unit12.clothing
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (prs-en practice pass): 5 fixes -- kept لباس in frames/feedback (a worker swap to literary جامه was reverted by the coordinator for consistency with the reviewed a1_unit12 overlay, which uses لباس 23x); matching feedback 'two words' for 5 slots. NATIVE FLAGS: لباس vs Afghan کالا for clothes, course-wide call.
    BACKFILL GLOSS FLAGS: dress=لباس زنانهٔ یک‌تکه uses Iranian-flagged لباس -> suggest پیراهن زنانه / فراک; i'll=من ... خواهم (مخفف I will). Prior note:
    Authored 2026-07-06 extending prs-en's Endless Practice pool from
    units 01-08 to also cover units 09-14. A number-agreement trap
    avoided (same bug class as unit09's hospital self-reference): the
    obvious 5-member 'clothing_item' tag includes 'pants'/'shoes'
    (always plural in English), which would make 'Do you have this
    {item} in a medium?' ungrammatical ('this pants'/'this shoes'). A
    narrower 'clothing_singular' tag (shirt/jacket/dress only, 3
    members) is used for that specific frame instead; 'clothing_item'
    stays safe everywhere else (bare-word recognition). All four tags
    (clothing_item, clothing_singular, clothing_size, clothing_color)
    already existed in scripts/_en_target_lexeme_common.py from the
    nl-en/fa-en lanes' own unit12 work; no EN_POS/agreement-tag
    additions were needed (verified by diffing every introduced_token
    against EN_POS directly against the real en realization file). Only
    Dari glosses for the new tokens were added to scripts/
    backfill_lexemes_prs_en.py, hand-derived from docs/content/overlays/
    prs-en/a1_unit12.yaml's own real Dari phrasing (pants=پطلون,
    shoes=بوت, jacket=جاکت, medium=منجم -- genuinely distinct Afghan
    Dari usage from the fa-en script's Farsi equivalents, not a
    find-replace). NOTE: the underlying en realization unit12 itself is
    UNREVIEWED (same as unit11, Codex was usage-limited at authoring
    time). Verified with scripts/_practice_slot_check.py that every
    slot has >=1 real candidate lexeme and every multiple_choice/
    listen_select slot has >=3 distinct candidate values
    (clothing_item=5, clothing_singular=3, clothing_size=3,
    clothing_color=2 -- clothing_color is only used in fill_in_blank/
    translation, never multiple_choice/listen_select, so its 2-member
    count is fine). Confirmed 0 errors/0 warnings from compile_content.py
    practice-validate. Left unreviewed pending a separate fresh-context
    review pass, per standing project policy.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    clothing_pair widened from 2 to 5 slots (the full course-wide
    clothing_item noun pool), per the pre-computed retrofit table.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [clothing_item, clothing_singular, clothing_size, clothing_color]
slot_presets:
  clothing_item: &clothing_item {language_code: en, part_of_speech: noun, agreement_tags: {semantic: clothing_item}}
  clothing_singular: &clothing_singular {language_code: en, part_of_speech: noun, agreement_tags: {semantic: clothing_singular}}
  clothing_size: &clothing_size {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: clothing_size}}
  clothing_color: &clothing_color {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: clothing_color}}
templates:
  - content_key: practice.prs-en.en.a1.unit12.lesson01.clothing_meaning.001
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson01.clothing_listen.002
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson01.clothing_pair.003
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: matching_pairs
    frame: {text: "هر واژهٔ لباس را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
    slots: {first_item: *clothing_item, second_item: *clothing_item, third_item: *clothing_item, fourth_item: *clothing_item, fifth_item: *clothing_item}
    slot_relations: [{kind: distinct, slots: [first_item, second_item, third_item, fourth_item, fifth_item]}]
    answer_derivation: {kind: matching_pairs, slots: [first_item, second_item, third_item, fourth_item, fifth_item]}
    feedback_frame: {text: "واژه‌های لباس را به معنی دری درست وصل کردین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson01.clothing_translate.004
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی لباس {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson02.size_order.001
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: word_order
    frame: {text: "Do you have this in a {item}", language_code: en, direction: ltr}
    slots: {item: *clothing_size}
    answer_derivation: {kind: render_frame, frame: {text: "Do you have this in a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} سایزی است که پرسیده می‌شه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson02.size_translate.003
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *clothing_size}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی سایز {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson02.clothing_listen.004
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژهٔ لباس‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson03.label_size_order.001
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: word_order
    frame: {text: "The shirt is a {item}", language_code: en, direction: ltr}
    slots: {item: *clothing_size}
    answer_derivation: {kind: render_frame, frame: {text: "The shirt is a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} سایز روی همی لیبل است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson03.color_translate.003
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *clothing_color}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی رنگ {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson03.clothing_meaning.004
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} لباس‌ای است که روی همی لیبل است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson04.clothing_listen.001
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژهٔ لباس‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson04.item_size_order.002
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: word_order
    frame: {text: "Do you have this {item} in a medium", language_code: en, direction: ltr}
    slots: {item: *clothing_singular}
    answer_derivation: {kind: render_frame, frame: {text: "Do you have this {item} in a medium", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} لباس‌ای است که پرسیده می‌شه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit12.lesson04.clothing_translate.004
