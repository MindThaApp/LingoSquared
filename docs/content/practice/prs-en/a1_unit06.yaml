schema_version: "1.0"
pack_key: practice.prs-en.a1.unit06
source_language: prs
target_language: en
unit_content_key: en.a1.unit06.family
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (prs-en practice pass): 0 fixes -- no change needed (pools tag-pinned, frames grammatical). NATIVE FLAGS: regional kin terms بی‌بی/بابه/کاکا/ماما/عمه؛ خاله worth native confirmation.
    BACKFILL GLOSS FLAGS: his/her share base gloss مالِ او (only gender note differs; word_order hint distinguishes via parenthesis). Prior note:
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). family_singular/family_collective/
    extended_family/possessive tags already exist in scripts/
    _en_target_lexeme_common.py (nl-en's own unit06 work) -- only Dari
    glosses were added to scripts/backfill_lexemes_prs_en.py, using
    real Afghan Dari extended-family terms (بی‌بی/بابه for grandmother/
    grandfather, distinct from Farsi's مادربزرگ/پدربزرگ). The
    possessive tag (my/your/his/her, 4 members) is used in a "This is
    {item} sister." frame, mirroring the sibling fa-en pack's same
    verified-safe reasoning. family_collective (parents/siblings, 2
    members) is kept out of multiple_choice/matching_pairs, used only
    in translation. Verified with scripts/_practice_slot_check.py that
    every slot has >=1 candidate and every multiple_choice/
    matching_pairs slot has >=3 distinct candidate values.

    Fresh-context review, 2026-07-06 (separate session, zero access to
    the authoring reasoning above): confirmed all 4 lesson_content_key
    values match real en.a1.unit06.family lessons. Re-scanned this pack,
    the sibling overlay, and backfill_lexemes_prs_en.py for Pashto-only
    letters/vocabulary -- none found; بی‌بی/بابه confirmed as genuine
    Dari (not Pashto) grandparent terms. Hand-rendered every possible
    sentence: "This is {item} sister." holds for all 4 possessive
    candidates (my/your/his/her); the 4x4 family_singular and 5x5
    extended_family matching_pairs grids contain no self-reference (no
    fixed anchor word repeated inside a slot's own candidate set). No
    agreement errors. Upgraded to reviewed: genuinely clean.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    family_pair widened from 2 to 4 slots (the full course-wide
    family_singular noun pool: mother/father/brother/sister), per the
    pre-computed retrofit table.

    Polish wave 2 (2026-07-24): structured tier was 2 live templates (<3
    floor, scripts/_practice_unit_scope_check.py). Added lesson02
    family_match.004 -- matching_pairs, 6 slots over the semantic union
    family_singular+extended_family+family_collective (11 distinct unit
    tokens, every Dari gloss read and distinct, no confusables) -- and
    lesson04 photo_order.003 -- word_order "This is my {item}" over
    family_singular+extended_family (9 members, all singular, all
    grammatical in the frame; course scope adds ZERO extra members for
    this union in backfill_lexemes_prs_en, verified with the polish
    pool_check harness, and none of the frame's literal words is a
    candidate, so no defect-1.14 self-reference). Structured now 4 live.
    family_pair.003's pre-existing 4-pair FLOOR finding was not in this
    pass's dispatch scope and is deliberately left as-is. These two
    additions are NOT covered by the 2026-07-06 fresh-context review
    above.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [family_singular, family_collective, extended_family, possessive]
slot_presets:
  family_singular: &family_singular {language_code: en, part_of_speech: noun, agreement_tags: {semantic: family_singular}}
  family_collective: &family_collective {language_code: en, part_of_speech: noun, agreement_tags: {semantic: family_collective}}
  extended_family: &extended_family {language_code: en, part_of_speech: noun, agreement_tags: {semantic: extended_family}}
  possessive: &possessive {language_code: en, part_of_speech: pronoun, agreement_tags: {semantic: possessive}}
  family_all: &family_all {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [family_singular, extended_family, family_collective]}}
  family_person: &family_person {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [family_singular, extended_family]}}
templates:
  - content_key: practice.prs-en.en.a1.unit06.lesson01.family_gloss.001
    lesson_content_key: en.a1.unit06.lesson01.immediate_family
    type: multiple_choice
    frame: {text: "{family_singular}", language_code: en, direction: ltr}
    slots: {family_singular: *family_singular}
    answer_derivation: {kind: slot_gloss, slot: family_singular}
    feedback_frame: {text: "معنای دری {family_singular} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson01.family_listen.002
    lesson_content_key: en.a1.unit06.lesson01.immediate_family
    type: listen_select
    frame: {text: "{family_singular}", language_code: en, direction: ltr}
    slots: {family_singular: *family_singular}
    answer_derivation: {kind: slot_gloss, slot: family_singular}
    feedback_frame: {text: "واژه‌ای که شنیدین {family_singular} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson01.family_pair.003
    lesson_content_key: en.a1.unit06.lesson01.immediate_family
    type: matching_pairs
    frame: {text: "{family_one} — {family_two}", language_code: en, direction: ltr}
    slots: {family_one: *family_singular, family_two: *family_singular, family_three: *family_singular, family_four: *family_singular}
    slot_relations: [{kind: distinct, slots: [family_one, family_two, family_three, family_four]}]
    answer_derivation: {kind: matching_pairs, slots: [family_one, family_two, family_three, family_four]}
    feedback_frame: {text: "هر واژهٔ فامیل را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson01.family_collective_translate.004
    lesson_content_key: en.a1.unit06.lesson01.immediate_family
    type: translation
    frame: {text: "{family_collective}", language_code: prs, direction: rtl, slot_rendering: {family_collective: english_gloss}}
    slots: {family_collective: *family_collective}
    answer_derivation: {kind: slot_text, slot: family_collective}
    feedback_frame: {text: "{family_collective} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson02.extended_gloss.001
    lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
    type: multiple_choice
    frame: {text: "{extended_family}", language_code: en, direction: ltr}
    slots: {extended_family: *extended_family}
    answer_derivation: {kind: slot_gloss, slot: extended_family}
    feedback_frame: {text: "معنای دری {extended_family} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson02.extended_listen.002
    lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
    type: listen_select
    frame: {text: "{extended_family}", language_code: en, direction: ltr}
    slots: {extended_family: *extended_family}
    answer_derivation: {kind: slot_gloss, slot: extended_family}
    feedback_frame: {text: "واژه‌ای که شنیدین {extended_family} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson02.possessive_order.003
    lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
    type: word_order
    frame: {text: "This is {item} sister", language_code: en, direction: ltr}
    slots: {item: *possessive}
    answer_derivation: {kind: render_frame, frame: {text: "This is {item} sister", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} ضمیر ملکی این جمله را کامل می‌کنه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson02.family_match.004
    lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
    type: matching_pairs
    frame: {text: "{family_one} — {family_two}", language_code: en, direction: ltr}
    slots: {family_one: *family_all, family_two: *family_all, family_three: *family_all, family_four: *family_all, family_five: *family_all, family_six: *family_all}
    slot_relations: [{kind: distinct, slots: [family_one, family_two, family_three, family_four, family_five, family_six]}]
    answer_derivation: {kind: matching_pairs, slots: [family_one, family_two, family_three, family_four, family_five, family_six]}
    feedback_frame: {text: "هر واژهٔ فامیل را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson03.family_translate.001
    lesson_content_key: en.a1.unit06.lesson03.describing_family
    type: translation
    frame: {text: "{family_singular}", language_code: prs, direction: rtl, slot_rendering: {family_singular: english_gloss}}
    slots: {family_singular: *family_singular}
    answer_derivation: {kind: slot_text, slot: family_singular}
    feedback_frame: {text: "{family_singular} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson04.family_listen.001
    lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
    type: listen_select
    frame: {text: "{family_singular}", language_code: en, direction: ltr}
    slots: {family_singular: *family_singular}
    answer_derivation: {kind: slot_gloss, slot: family_singular}
    feedback_frame: {text: "واژه‌ای که در این گفتگو شنیدین {family_singular} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson04.extended_translate.002
    lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
    type: translation
    frame: {text: "{extended_family}", language_code: prs, direction: rtl, slot_rendering: {extended_family: english_gloss}}
    slots: {extended_family: *extended_family}
    answer_derivation: {kind: slot_text, slot: extended_family}
    feedback_frame: {text: "{extended_family} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit06.lesson04.photo_order.003
    lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
    type: word_order
    frame: {text: "This is my {item}", language_code: en, direction: ltr}
    slots: {item: *family_person}
    answer_derivation: {kind: render_frame, frame: {text: "This is my {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} عضو فامیل است که در همی جمله معرفی می‌شه.", language_code: prs, direction: rtl}
