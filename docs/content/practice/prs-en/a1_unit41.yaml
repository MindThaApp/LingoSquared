review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (prs-en practice pass, rest): 0 fixes -- all 9 templates checked (3-member cooking_verb and single-member
    chop/boil pools, frames grammatical, answers determined, Dari instructions Afghan). NATIVE FLAGS: the prompt ''به انگلیسی
    چی می‌شه: {item}؟'' (shared across prs-en packs) is colloquial Iranian-leaning; suggest ''به انگلیسی چی گفته می‌شود''.
    BACKFILL GLOSS FLAGS: none. Prior note: Authored 2026-07-11 by the prs-en depth-extension worker, same pass as unit30-40.
    Two tags: 3-member ''cooking_verb'' (chop/boil/taste), bare-word recognition only -- kept at 3 members (the mc/ listen_select
    floor), so matching_pairs is deliberately NOT used here. "cook" is deliberately excluded from this tag: it already has
    a NOUN classification (unit23''s occupation_noun, "I''m a cook"), and this unit reintroduces it as a VERB ("I like to
    cook dinner") -- same homograph-avoidance discipline as the shared module''s existing "close"/"cold"/"report" entries,
    documented at both the EN_POS comment site and here. Single-member ''chop_word'' (chop only) for the generative "Can you
    {item} the onions for me?" frame -- "chop" is the only cooking_verb member that fits that fixed idiom. EN_POS/en_agreement_tags
    added to scripts/_en_target_lexeme_common.py as part of this pass. Anchoring check: lesson01 introduces new lexemes, safe
    as an anchor. Every slot''s real candidate count verified with scripts/_practice_slot_check.py. Needs the standard fresh-context
    review before import.

    Fresh-context review, 2026-07-11 (separate worker, zero access to the authoring reasoning above): compile_content.py practice-validate
    (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot >=1 candidate; every multiple_choice/listen_select/matching_pairs
    slot enough distinct values), and backfill_lexemes_prs_en.py --dry-run all clean. Verified every tag member is a real
    introduced_token in this unit''s en realization or earlier; every lesson_content_key anchor exists and introduces >=1
    new lexeme; word_order uses render_frame (string answer, grade() canonicalizes both shapes); matching_pairs correct_response
    = {token: gloss} across all distinct slots. Dari feedback text spot-checked as genuine Afghan register (کنین/شنیدین/می‌ته/کدن,
    صنف/مضمون/موتر/بس/ بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted (not a defect): scripts/_en_target_lexeme_common.py
    now carries three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers); no prs-en generative frame is widened ungrammatically
    -- the one cross-block union effect (celebration_noun gains ''cake'' from a sibling block) is harmless, since ''cake''
    is genuinely taught in en unit37 and has a Dari gloss, so it is only ever a valid recognition candidate. Upgraded to reviewed:
    genuinely clean.


    POLISH 2026-07-24 (tier-thinness wave 2, reverting to unreviewed): recognition was 2 live, structured 2, production 1.
    Added lesson02.listen.001 (sentence-frame listen_select "First, {item} the onions" over cooking_verb -- course pool is
    exactly chop/boil/taste, all grammatical in the frame, no frame word collides with any candidate, options are Dari glosses
    so defect-1.22-safe), lesson03.order.001 word_order "You need to {item} the pasta first" anchored on the pre-existing
    single-member lexeme tag volume_fa_en_a1_unit41_item_04_single (= boil; declared here in tag_schema, the tag itself already
    lives on the lexeme -- no backfill change), lesson04.translate.001 (fixed Dari prompt, answer render_frame "Can you {item}
    the onions for me" over single-member chop_word, recipe 6.6b), and lesson02.translate.001 (bare-word Dari-metalanguage
    variant over cooking_verb). Tiers now 3/3/3 live at unit scope.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - cooking_verb
    - chop_word
    - volume_prs_en_a1_unit41_item_03_single
    - volume_fa_en_a1_unit41_item_04_single
slot_presets:
  cooking_verb: &id001
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: cooking_verb
  chop_word: &id002
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: chop_word
