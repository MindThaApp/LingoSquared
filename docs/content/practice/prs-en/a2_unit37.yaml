      part_of_speech: *id001
      agreement_tags:
        semantic: prs_en_a2_unit37_words
    third:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: prs_en_a2_unit37_words
    fourth:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: prs_en_a2_unit37_words
    fifth:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: prs_en_a2_unit37_words
    sixth:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: prs_en_a2_unit37_words
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمه را به معنی دری خودش وصل کنین.
    language_code: prs
    direction: rtl
