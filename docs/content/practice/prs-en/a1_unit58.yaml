schema_version: '1.0'
pack_key: practice.prs-en.a1.unit58
source_language: prs
target_language: en
unit_content_key: en.a1.unit58.museum
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored against docs/content/PRACTICE_PACK_RECIPE.md for prs-en unit58 (museum). backfill_lexemes_prs_en.py
    carries no agreement_tags.semantic for this direction (every lexeme has agreement_tags: {}), so per-lesson/union
    semantic tagging (recipe §3.1/§8.1) is not available; slots are constrained by language_code + the
    full part_of_speech set only, matching the established prs-en pattern (docs/content/practice/prs-en/a1_unit48.yaml).
    word_order and fill_in_blank were deliberately NOT authored: without a semantic tag to pin a single-member
    anchor, fill_in_blank would course-wide hard-fail the compiler''s single-candidate check, and an untagged
    word_order slot pools every A1 content word at course/Endless-Practice scope (recipe §1.1/§3.1c),
    which is unsafe for any frame with literal text. matching_pairs was originally pooled across the
    WHOLE unit''s lexemes (untagged); every template remains anchored via lesson_content_key to one
    lesson so the checkpoint''s per-lesson stratification still sees every lesson that has lexemes.
    Capacity measured with §0/§9''s f".{level}.{unit}." filter: 12 distinct tokens across 4 lesson(s)
    with lexemes. Register: colloquial Dari per docs/content/DARI_REGISTER_REPAIR.md and docs/content/CLAUDE.md
    (2pl -ین, no Iranian -ید). Wave-3 (2026-07-26): commit 05af7ace added generated agreement_tags.semantic to backfill_lexemes_prs_en.py (prs_en_<unit>_words / prs_en_<unit>_lessonNN_words), resolving the blocker above for matching_pairs. Re-anchored all 4 POS-only matching_pairs slot bodies from the bare part_of_speech union to language_code + [noun, verb, adjective, adverb] + agreement_tags.semantic: prs_en_a1_unit58_words (all 4 lessons; no single lesson clears the floor alone), preferring a lesson-scoped tag where that lesson alone clears the 6-pair floor and falling back to the unit-wide tag otherwise; declared the referenced tags in tag_schema.agreement_tags.semantic. pool_check.py confirms every re-anchored slot has >=6 distinct unit tokens/glosses with zero course-scope extras (tags are unit-scoped by construction). Templates and slot counts unchanged (all were already 6 slots).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_a1_unit58_words
