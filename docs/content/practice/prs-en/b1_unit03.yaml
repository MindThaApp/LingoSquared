schema_version: '1.0'
pack_key: practice.prs-en.b1.unit03
source_language: prs
target_language: en
unit_content_key: en.b1.unit03.hypotheticals
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Grammar-unit recipe (PRACTICE_PACK_RECIPE.md sec8.1) applied, mirroring the fa-en sibling pack's structure (docs/content/practice/fa-en/b1_unit03_*.yaml) since the target (en) and runtime mechanics are identical. UNLIKE fa-en, backfill_lexemes_prs_en.py carries NO semantic tags at all for this unit's lexemes (verified via the sec0 capacity dump) -- every content-word lexeme's agreement_tags is empty. So every slot here deliberately omits agreement_tags.semantic (sec3.1c untagged slot) and constrains only language_code=en + part_of_speech in [adjective, adverb, noun, phrase, verb] (excluding pronoun/particle/preposition/proper_noun/symbol). This pools the WHOLE unit's content words for every slot regardless of which lesson a template is anchored to -- exactly the sec8.1-sanctioned pattern ('Union the unit's lesson tags... it is only the SLOT that widens'); since no lesson-level tag exists to narrow further, the union is total. Safe at checkpoint scope because generate_checkpoint() only ever loads this unit's own lexemes regardless of which lesson introduced them, and the checkpoint never fires before all 4 lessons are complete. 15 templates: per lesson (x4) multiple_choice + listen_select + bare-word translation (12 total: 8 recognition, 4 production), plus 3 matching_pairs (6 pairs each, unit-wide pool) anchored to the reading lesson (full content POS), the dialogue lesson (full content POS), and the grammar lesson (verb/adjective/adverb/phrase only, mirroring fa-en's match_verbal). Deliberately skipped word_order and fill_in_blank: with no semantic tags at all there is no single-member anchor available to build a course-scope-safe hero-sentence frame, and crafting one per unit across this batch was judged too defect-prone for this pass; matching_pairs carries the structured tier instead (no frame-literal-text risk, so no course-scope grammaticality check needed). Flagging this gap (plus the missing prs-en semantic-tag backfill) to the coordinator. Read every gloss in this unit's pool per sec0.1: all distinct-token counts matched distinct-gloss counts (no accidental gloss collisions), and no sense-mismatched gloss was found against what this unit's lessons actually teach. Feedback strings written in colloquial Dari per DARI_REGISTER_REPAIR.md: کلمه not واژه، جواب not پاسخ، استه not است، -ین 2pl endings not -ید (کنین/شنیدین, never Iranian کنید/شنیدید).
    UPDATE 2026-07-24 (POS-only matching polish): the lexeme backfill has since gained sparse semantic tags for this unit, so match_all.001 and match_dialogue.001 now constrain on the semantic union [hobby_noun, education_noun, dialogue_word, time_period, politeness, wellbeing_answer, farewell] (7 distinct unit tokens / 7 distinct glosses: painting, class, new, day, nice, bad, see) to keep Endless-Practice course-scope pairs themed instead of pulling the whole B1 level. match_verbal.001 stays deliberately POS-only: within its verb/adjective/adverb/phrase POS set the unit's tag-covered tokens are only new, see, nice, bad, much (5 < 6), so no semantic union can clear the matching_pairs floor without nouns, and duplicating the same noun-inclusive union a third time would make it a clone of match_all/match_dialogue. Recognition/production slots remain deliberately untagged.
    UPDATE 2026-07-26 (wave-3 union re-pass): commit 05af7ace landed a generated unit-wide tag, prs_en_b1_unit03_words, which was NOT available at the 2026-07-24 check (that pass only measured the older sparse hand tags). Within match_verbal.001's verb/adjective/adverb/phrase POS filter this generated tag covers 24 distinct tok/gloss, well clear of the floor, so match_verbal.001 (the only template in this file's wave-3 dispatch; match_all.001/match_dialogue.001 already carry hand unions from the prior pass and were left untouched) is re-anchored to semantic: prs_en_b1_unit03_words, POS unchanged. Read every gloss in the pool: 3 of the 24 (will, doesn't, didn't) carry a parenthetical grammar-note gloss rather than a lexical translation -- the same systematic negative-auxiliary/tense-marker convention used across this corpus (b1.unit01's don't/did/do is the sibling case), not isolable from the other 21 legitimate verbs via any POS or tag lever available, and accepted rather than mis-narrowing "verbal" down to non-verb POS. The prior blocker (course-scope pull) is resolved for match_verbal.001.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - hobby_noun
    - education_noun
    - dialogue_word
    - time_period
    - politeness
    - wellbeing_answer
    - farewell
    - prs_en_b1_unit03_words
