schema_version: '1.0'
pack_key: practice.prs-en.a2.unit30
source_language: prs
target_language: en
unit_content_key: en.a2.unit30.job_interview
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. Unit lexeme pool measured
    with the f".a2.unit30." filter (backfill_lexemes_prs_en.py): 43 unit lexemes across 4 lesson(s) with
    lexemes; 41 of them survive the content-word filter (part_of_speech not in [''particle'', ''preposition'',
    ''pronoun'', ''proper_noun'', ''symbol''], and excluding function/auxiliary tokens whose english_gloss
    is a parenthetical grammar note rather than a clean translation: [''a'', ''an'', ''and'', ''by'',
    ''did'', ''do'', ''does'', "don''t", ''has'', ''have'', ''if'', ''not'', ''on'', ''or'', ''that'',
    ''the'', ''this'', ''to''] where present) with 41 distinct english_gloss values. No agreement_tags.semantic
    exist on this direction''s lexemes for this unit (all None at classification time), so every slot
    is intentionally UNTAGGED (agreement_tags omitted) and constrained only by language_code+part_of_speech
    -- per recipe SS3.1(c) this is a legal constraint, and because generate_checkpoint() restricts _material()
    to this unit''s own lesson ids before any slot filter runs, the untagged pool is unit-scoped at checkpoint
    time (equivalent to unioning every lesson''s tokens) even though it widens to the whole A2 course
    at Endless-Practice scope. word_order and fill_in_blank were deliberately NOT authored: without a
    semantic tag there is no way to pin a single-member anchor or to hand-verify (recipe SS1.1/SS9 step
    5) that every course-wide candidate of an untagged slot stays grammatical inside a literal sentence
    frame, and getting that wrong is the recipe''s #1 flagged defect class. matching_pairs (no framing-grammaticality
    requirement, only a >=6-distinct-token floor) was used for the structured tier instead, anchored to
    the richest lesson(s). Recommend a follow-up backfill pass adding semantic tags to this unit so word_order/fill_in_blank
    can be added safely. POLISH WAVE 2 (2026-07-24, POS-ONLY-MATCHING flag): re-audited all three
    match.001 templates for a semantic-union replacement (recipe SS6.3) against the current
    backfill_lexemes_prs_en.py iter_specs() -- this unit''s only tagged lexemes are scattered
    single-member cross-course tags (number/hour_number "two", weekday "monday", identity "i''m",
    age_phrase "years", clothing_size "small", dialogue_word "work"); no coherent interview-themed
    tag exists, and unioning those 6 unrelated single-member tags would pull whole off-theme
    course-scope pools (all weekdays, all numbers...) into an interview unit -- worse than the
    status quo. matching_pairs slots stay deliberately POS-only until a backfill pass tags this
    unit''s 37 untagged interview lexemes.

    POLISH WAVE 3 (2026-07-26, blocker resolved): commit 05af7ace added generated per-unit/per-lesson
    semantic tags (prs_en_a2_unit30_words / prs_en_a2_unit30_lessonNN_words, unit-scoped by construction),
    exactly the backfill pass the wave-2 note above was waiting on. Re-anchored each of the three
    matching_pairs to its OWN lesson tag rather than the unit-wide tag -- each lesson clears the 6-pair
    floor alone, and this also makes the three pools genuinely distinct (previously all three were
    POS-only and drew the identical whole-unit content-word pool): lesson02.match.001 ->
    prs_en_a2_unit30_lesson02_words (12 tokens: two/years/social/media/marketing/strengths/being/
    organized/available/start/next/monday, all distinct glosses); lesson03.match.001 ->
    prs_en_a2_unit30_lesson03_words (16 tokens: resume/deadline/bright/looking/coordinator/
    requirements/strong/writing/skills/immediately/interview/meet/deadlines/work/well/team, all
    distinct glosses -- deadline/deadlines reads as an acceptable singular/plural discrimination, not
    a paraphrase); lesson04.match.001 -> prs_en_a2_unit30_lesson04_words (8 tokens: coming/managed/
    small/great/questions/role/typical/looks, all distinct glosses). part_of_speech [adjective, adverb,
    noun, verb] kept unchanged on all three (redundant with the lesson tag now but harmless). The
    off-theme course-scope pull this pack''s original note flagged is resolved.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
