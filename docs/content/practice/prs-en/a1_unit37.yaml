    slots:
    - first
    - second
    - third
    - fourth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
  feedback_frame:
    text: هر واژهٔ جشن را به معنی دری خودش وصل کنین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit37.lesson01.translate.004
  lesson_content_key: en.a1.unit37.lesson01.celebration_vocabulary
  type: translation
  frame:
