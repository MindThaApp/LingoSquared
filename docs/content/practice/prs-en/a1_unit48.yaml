schema_version: '1.0'
pack_key: practice.prs-en.a1.unit48
source_language: prs
target_language: en
unit_content_key: en.a1.unit48.library
review:
  status: unreviewed
  fresh_context: 'false'
  notes: Authored 2026-07-12 as an additive Endless Practice coverage backfill for prs-en A1 unit 48. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.
    Polish 2026-07-24 (tier-thinness + POS-only matching wave) -- expanded both matching_pairs templates from 4 to
    6 pairs (defect 1.19 floor) and added one lesson-anchored template per tier (choose/match/translate) with
    content-word part_of_speech pools [noun, verb, adjective] so every tier has >=3 live templates and non-lesson01
    lessons are represented in the checkpoint lesson round-robin. matching_pairs slots left WITHOUT an
    agreement_tags.semantic union deliberately -- backfill_lexemes_prs_en.py carries 1 semantically tagged
    lexeme(s) for this unit, so no unit-native semantic union can cover 6 distinct tokens; adding tags to the
    backfill scripts is out of scope for pack-only edits (recipe SS6.3 honest-thin escape).
    Polish wave 3, 2026-07-26 (commit 05af7ace generated tags) -- the honest-leave blocker above is now resolved --
    backfill_lexemes_prs_en.py now emits prs_en_a1_unit48_words (26 tok) and per-lesson
    prs_en_a1_unit48_lessonNN_words. Re-anchored lesson01.match.002 and its volume_match.001 twin from
    POS-only to semantic prs_en_a1_unit48_words with part_of_speech narrowed to [noun, adjective] (10 tok,
    all distinct glosses) -- excluding verb avoids a duplicate-gloss collision (borrow/borrowing both gloss
    قرض گرفتن at unit scope). Re-anchored lesson04.match.004 to its own lesson tag
    prs_en_a1_unit48_lesson04_words (20 tok, clears the floor alone, no gloss collisions), keeping its
    existing [noun, verb, adjective] filter. All three now unit-scoped by construction (zero course-scope
    off-theme pull); verified with pool_check.py.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_a1_unit48_lesson04_words
    - prs_en_a1_unit48_words
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
