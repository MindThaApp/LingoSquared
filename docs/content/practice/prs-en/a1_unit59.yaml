unit_content_key: en.a1.unit59.banking_basics
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-22 (prs-en practice pass, rest): 3 fixes -- the three matching_pairs feedback frames were English ('Match each word with its meaning.') on an RTL Dari course -> Dari (without a pair count). Pools already unit-tagged (8 tokens, distinct glosses), no change. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: balance=مانده (overlay teaches بیلانس حساب; override proposed in log); accepted=قبول می‌شه, entered=داخل کرد (پین را), pin=پین (کود رمز) are explanatory glosses, acceptable.
    Prior notes: Authored against docs/content/PRACTICE_PACK_RECIPE.md for prs-en unit59 (banking_basics). backfill_lexemes_prs_en.py carries no agreement_tags.semantic for this direction (every lexeme has agreement_tags: {}), so per-lesson/union semantic tagging (recipe §3.1/§8.1) is not available; slots are constrained by language_code + the full part_of_speech set only, matching the established prs-en pattern (docs/content/practice/prs-en/a1_unit48.yaml). word_order and fill_in_blank were deliberately NOT authored: without a semantic tag to pin a single-member anchor, fill_in_blank would course-wide hard-fail the compiler's single-candidate check, and an untagged word_order slot pools every A1 content word at course/Endless-Practice scope (recipe §1.1/§3.1c), which is unsafe for any frame with literal text. matching_pairs was originally pooled across the WHOLE unit's lexemes (untagged); every template remains anchored via lesson_content_key to one lesson so the checkpoint's per-lesson stratification still sees every lesson that has lexemes. Capacity measured with §0/§9's f".{level}.{unit}." filter: 10 distinct tokens across 3 lesson(s) with lexemes. Thin unit: only 10 distinct unit lexemes, below the recipe's ~12-item-per-tier volume bar; recognition/production capacity is honest but low. Register: colloquial Dari per docs/content/DARI_REGISTER_REPAIR.md and docs/content/CLAUDE.md (2pl -ین, no Iranian -ید). Wave-3 (2026-07-26): commit 05af7ace added generated agreement_tags.semantic to backfill_lexemes_prs_en.py (prs_en_<unit>_words / prs_en_<unit>_lessonNN_words), resolving the blocker above for matching_pairs. Re-anchored all 3 POS-only matching_pairs slot bodies from the bare part_of_speech union to language_code + [noun, verb, adjective, adverb] + agreement_tags.semantic: prs_en_a1_unit59_words (all 3 templates; no single lesson clears the floor alone), preferring a lesson-scoped tag where that lesson alone clears the 6-pair floor and falling back to the unit-wide tag otherwise; declared the referenced tags in tag_schema.agreement_tags.semantic. pool_check.py confirms every re-anchored slot has >=6 distinct unit tokens/glosses with zero course-scope extras (tags are unit-scoped by construction). Templates and slot counts unchanged (all were already 6 slots).
