unit_content_key: en.a1.unit39.neighborhood
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-11 by the prs-en depth-extension worker, same pass
    as unit30-38. Single tag: 3-member 'neighborhood_adj' (quiet/noisy/
    friendly -- "friendly" already classified since unit32, reused
    additively), verified all three fit "My neighbors are very
    {item}." Kept at 3 members (the mc/listen_select floor), so
    matching_pairs is deliberately NOT used here. EN_POS/
    en_agreement_tags added to scripts/_en_target_lexeme_common.py as
    part of this pass. Anchoring check: lesson01 introduces new
    lexemes, safe as an anchor. Every slot's real candidate count
    verified with scripts/_practice_slot_check.py. Needs the standard
    fresh-context review before import.

    Fresh-context review, 2026-07-11 (separate worker, zero access to
    the authoring reasoning above): compile_content.py practice-validate
    (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot
    >=1 candidate; every multiple_choice/listen_select/matching_pairs
    slot enough distinct values), and backfill_lexemes_prs_en.py
    --dry-run all clean. Verified every tag member is a real
    introduced_token in this unit's en realization or earlier; every
    lesson_content_key anchor exists and introduces >=1 new lexeme;
    word_order uses render_frame (string answer, grade() canonicalizes
    both shapes); matching_pairs correct_response = {token: gloss}
    across all distinct slots. Dari feedback text spot-checked as
    genuine Afghan register (کنین/شنیدین/می‌ته/کدن, صنف/مضمون/موتر/بس/
    بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted
    (not a defect): scripts/_en_target_lexeme_common.py now carries
    three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers);
    no prs-en generative frame is widened ungrammatically -- the one
    cross-block union effect (celebration_noun gains 'cake' from a
    sibling block) is harmless, since 'cake' is genuinely taught in en
    unit37 and has a Dari gloss, so it is only ever a valid recognition
    candidate. Upgraded to reviewed: genuinely clean.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [neighborhood_adj]
slot_presets:
  neighborhood_adj: &neighborhood_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: neighborhood_adj}}
templates:
  - content_key: practice.prs-en.en.a1.unit39.lesson01.choose.001
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *neighborhood_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit39.lesson01.listen.002
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *neighborhood_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit39.lesson01.translate.003
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *neighborhood_adj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی صفت {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit39.lesson01.order.004
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: word_order
    frame: {text: "My neighbors are very {item}", language_code: en, direction: ltr}
    slots: {item: *neighborhood_adj}
    answer_derivation: {kind: render_frame, frame: {text: "My neighbors are very {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} صفتی است که ذکر شد.", language_code: prs, direction: rtl}