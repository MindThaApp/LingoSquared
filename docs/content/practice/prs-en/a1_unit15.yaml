- content_key: practice.prs-en.en.a1.unit15.lesson01.payment_pair.003
  lesson_content_key: en.a1.unit15.lesson01.payment_words
  type: matching_pairs
  frame:
    text: '{first_word} — {second_word}'
    language_code: en
    direction: ltr
  slots:
    first_word: *id001
    second_word: *id001
    third_word: *id001
    fourth_word: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first_word
    - second_word
    - third_word
    - fourth_word
  answer_derivation:
    kind: matching_pairs
    slots:
    - first_word
    - second_word
    - third_word
    - fourth_word
  feedback_frame:
    text: دو واژهٔ پرداخت را به معنای دری آن‌ها وصل کنین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit15.lesson01.payment_translate.004
