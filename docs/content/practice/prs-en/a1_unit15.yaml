schema_version: '1.0'
pack_key: practice.prs-en.a1.unit15
source_language: prs
target_language: en
unit_content_key: en.a1.unit15.money
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-06 by the prs-en practice-pool-sync lane extending coverage to units 15-20, mirroring the sibling
    fa-en/a1_unit15.yaml pack''s structure (16 templates) -- same English realization, same tag choices (payment_method 4
    members: cash/card/credit/debit; a narrower card_type 2-member tag for credit/debit specifically, since "Do you take {item}
    cards?" is only grammatical with credit/debit, not cash/card; and the already-established 21-member number_no_hundred
    tag from unit03, reused here for the receipt/ dialogue total-amount frames). All POS/semantic-tag classification for this
    unit''s vocabulary was already present in scripts/_en_target_lexeme_common.py before this pass (added earlier this session
    alongside the fa-en/nl-en work) -- only scripts/backfill_lexemes_prs_en.py''s own Dari gloss dict needed extending (cash/card/credit/debit/total/cards/pay/tax/1/10/by),
    cross- checked against docs/content/overlays/prs-en/a1_unit15.yaml''s own real Dari phrasing (e.g. cash="پیسهٔ نقد", credit
    card="کارت اعتباری", debit card="کارت بانکی") rather than copied from the fa-en script''s Farsi. Verified with scripts/_practice_slot_check.py
    that every slot has >=1 real candidate lexeme and every multiple_choice/ listen_select slot has >=4 distinct candidate
    values. The underlying en realization unit15 and the prs-en overlay: overlay status is "reviewed"; the realization itself
    is UNREVIEWED (Codex was usage- limited at authoring time) -- needs the standard fresh-context review before import.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16): the matching_pairs template widened from 2 to 4
    slots (the full course-wide payment_method noun pool: cash/card/credit/debit), per the pre-computed retrofit table.'
tag_schema:
  part_of_speech:
  - noun
  agreement_tags:
    semantic:
    - payment_method
    - card_type
    - number_no_hundred
slot_presets:
  payment_method: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: payment_method
  card_type: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: card_type
  number_no_hundred: &id003
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: number_no_hundred
templates:
- content_key: practice.prs-en.en.a1.unit15.lesson01.payment_meaning.001
  lesson_content_key: en.a1.unit15.lesson01.payment_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های پرداخت این درس است.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit15.lesson01.payment_listen.002
