schema_version: "1.0"
pack_key: practice.prs-en.a2.unit26
source_language: prs
target_language: en
unit_content_key: en.a2.unit26.opinions
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending prs-en's practice
    pool to units 21-26 -- this is the second and final A2 unit for this
    direction so far (giving opinions with reasons: a dog park scenario),
    completing prs-en's practice-pool coverage through unit26. Uses
    fa-en's a2_unit26.yaml as the structural reference: the shared
    4-member 'dogpark_noun' tag (dog/park/playground/space) is used ONLY
    for bare-word recognition -- most of this unit's content is
    multi-word discourse-connector phrases ("I think", "in my opinion",
    "on the other hand") that don't reduce to a safe single-token slot,
    same discipline as unit25. No new EN_POS/agreement_tags entries were
    needed; only scripts/backfill_lexemes_prs_en.py's Dari gloss dict and
    UNIT_FILES tuple were extended (سگ/پارک/زمین بازی/فضا, cross-checked
    against docs/content/overlays/prs-en/a2_unit26.yaml's own real text).

    HOMOGRAPH LIMITATION DELIBERATELY RESPECTED, not worked around: this
    unit's lesson03 reintroduces "close" as an ADJECTIVE ("very close to
    the playground"), but scripts/_en_target_lexeme_common.py's EN_POS
    already classifies "close" as a VERB (unit05's "the store closes"
    sense) and its own inline comment explicitly instructs future
    authors not to force a second, conflicting entry onto that bare
    token. Grepped every practice pack across en-fa/en-nl/en-prs/fa-en/
    nl-en/prs-en for any existing use of "close" as a slot value before
    writing this pack's templates -- none found, so no live template
    depends on either sense being changed. No template in this pack (or
    anywhere in this batch) uses "close" as a fillable slot; the
    dogpark_noun tag itself never included it.

    Anchoring check (same discipline as every other pack in this batch):
    verified via iter_specs() that every one of this unit's four lessons
    introduces at least one new lexeme; dogpark_noun's own members
    (dog/space introduced lesson02, playground lesson03) mean this
    pack's templates start at lesson02, not lesson01 (lesson01,
    "opinion_phrases", introduces no dogpark_noun vocabulary at all --
    same anchoring discipline as fa-en's own unit26 pack).

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover prs-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    the matching_pairs template widened from 2 to 4 slots (the full
    course-wide dogpark_noun pool: dog/park/playground/space), per the
    pre-computed retrofit table.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [dogpark_noun]
slot_presets:
  dogpark_noun: &dogpark_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: dogpark_noun}}
templates:
  - content_key: practice.prs-en.en.a2.unit26.lesson02.choose.001
    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson02.listen.002
    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson03.match.001
    lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *dogpark_noun, second: *dogpark_noun, third: *dogpark_noun, fourth: *dogpark_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson03.translate.002
    lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی واژه {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson04.listen.001
    lesson_content_key: en.a2.unit26.lesson04.opinion_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که در همی گفتگو شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson04.translate.002
    lesson_content_key: en.a2.unit26.lesson04.opinion_dialogue
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی واژه {item} است.", language_code: prs, direction: rtl}
