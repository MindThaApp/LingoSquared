    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
    type: word_order
    frame: {text: "Everyone loves the {item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Everyone loves the {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} واژه‌ای است که در همی درس آمده.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson03.match.001
    lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *unit_noun, second: *unit_noun, third: *unit_noun, fourth: *unit_noun, fifth: *unit_noun, sixth: *unit_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
