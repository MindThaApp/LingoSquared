schema_version: "1.0"
pack_key: practice.prs-en.a2.unit26
source_language: prs
target_language: en
unit_content_key: en.a2.unit26.opinions
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending prs-en's practice
    pool to units 21-26 -- this is the second and final A2 unit for this
    direction so far (giving opinions with reasons: a dog park scenario),
    completing prs-en's practice-pool coverage through unit26. Uses
    fa-en's a2_unit26.yaml as the structural reference: the shared
    4-member 'dogpark_noun' tag (dog/park/playground/space) is used ONLY
    for bare-word recognition -- most of this unit's content is
    multi-word discourse-connector phrases ("I think", "in my opinion",
    "on the other hand") that don't reduce to a safe single-token slot,
    same discipline as unit25. No new EN_POS/agreement_tags entries were
    needed; only scripts/backfill_lexemes_prs_en.py's Dari gloss dict and
    UNIT_FILES tuple were extended (سگ/پارک/زمین بازی/فضا, cross-checked
    against docs/content/overlays/prs-en/a2_unit26.yaml's own real text).

    HOMOGRAPH LIMITATION DELIBERATELY RESPECTED, not worked around: this
    unit's lesson03 reintroduces "close" as an ADJECTIVE ("very close to
    the playground"), but scripts/_en_target_lexeme_common.py's EN_POS
    already classifies "close" as a VERB (unit05's "the store closes"
    sense) and its own inline comment explicitly instructs future
    authors not to force a second, conflicting entry onto that bare
    token. Grepped every practice pack across en-fa/en-nl/en-prs/fa-en/
    nl-en/prs-en for any existing use of "close" as a slot value before
    writing this pack's templates -- none found, so no live template
    depends on either sense being changed. No template in this pack (or
    anywhere in this batch) uses "close" as a fillable slot; the
    dogpark_noun tag itself never included it.

    Anchoring check (same discipline as every other pack in this batch):
    verified via iter_specs() that every one of this unit's four lessons
    introduces at least one new lexeme; dogpark_noun's own members
    (dog/space introduced lesson02, playground lesson03) mean this
    pack's templates start at lesson02, not lesson01 (lesson01,
    "opinion_phrases", introduces no dogpark_noun vocabulary at all --
    same anchoring discipline as fa-en's own unit26 pack).

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover prs-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    the matching_pairs template widened from 2 to 4 slots (the full
    course-wide dogpark_noun pool: dog/park/playground/space), per the
    pre-computed retrofit table.

    Depth pass (2026-07-06, templates-per-unit audit): unit26 was the
    thinnest pack in prs-en (6 templates vs the pack's 10-16 average),
    entirely because dogpark_noun stays deliberately bare-recognition-
    only (its 4 members still don't collocate in one shared frame,
    same reasoning as above) and lesson01 had zero templates at all
    (dogpark_noun's own members aren't introduced until lesson02/03).
    7 new templates fill lesson01 and reinforce lesson04, all reusing
    already-established course-wide tags rather than inventing new
    vocabulary or new semantic categories (both shared files --
    scripts/_en_target_lexeme_common.py and
    backfill_lexemes_prs_en.py -- are untouched by this pass, since
    they're shared with the parallel nl-en/fa-en workers doing the
    identical task on their own files):
    (1) lesson01 teaches "in my opinion" verbatim, and lesson03's real
    reading text opens "In my opinion, the new dog park is a good
    idea." -- the already-established 4-member 'possessive' tag
    (my/your/his/her, defined for unit06's family lessons, reused
    identically here) generalizes that exact real sentence with zero
    grammar loss ("In your/his/her opinion, the dog park is a good
    idea." all hold), giving a word_order + fill_in_blank pair anchored
    to lesson01, plus a bare listen_select recognition item (no shared
    frame needed for bare recognition, same as dogpark_noun's own
    pattern).
    (2) lesson01's "I think" is real content for the already-
    established 'identity' tag (defined for unit01/02, reused as bare-
    word recognition variety the same way unit11/unit17 already reuse
    'weekday' in unrelated later units) -- a multiple_choice + a
    listen_select, bare-word only, no frame risk.
    (3) lesson04's real dialogue line "Yes, I think that would be
    better." is real content for the already-established 'politeness'
    tag (thanks/thank/nice/welcome/yes/no, defined for unit01) -- a
    multiple_choice + a listen_select, again bare-word only (this
    pack's local politeness preset broadens the part_of_speech list to
    [noun, verb, adjective, particle] instead of unit01's noun-only
    version, since politeness members actually span all four POS
    course-wide and bare-word recognition doesn't depend on POS
    uniformity -- verified 6 distinct candidates, well above the
    multiple_choice/listen_select floor).
    6 -> 13 templates. Re-verified with scripts/_practice_slot_check.py
    and compile_content.py practice-validate, 0 errors/0 warnings.
    Still needs the standard fresh-context review before import.

    A2-scoping correctness fix (2026-07-07): scripts/_practice_slot_check.py
    pools ALL specs from iter_specs() (both A1 and A2) together when
    counting a tag's real distinct-candidate count, but
    backend/app/practice/service.py's _material() actually scopes both
    PracticeTemplate and Lexeme queries by course_id, and 'A1'/'A2' are
    separate Course rows -- a real A2 enrollee only ever sees A2-scoped
    lexemes. A standalone A2-only-scoped check (filtering iter_specs() to
    level=='a2') found two real violations in this file, invalidating the
    pooled-with-A1 "verified 6 distinct candidates" politeness note
    above: (1) lesson01.possessive_listen.003 -- 'possessive' (my/your/
    his/her, 4 members pooled with A1) has only 2 REAL A2-scoped
    candidates (my/your -- his/her never reintroduced in any A2 unit
    25-28). Fixed by converting to type: translation (bare single-word
    production, slot_text derivation instead of slot_gloss -- no
    minimum-candidate floor), renamed possessive_translate_bare.003 -- a
    genuinely new exercise, not a duplicate of the existing
    possessive_order.001 (full-sentence word_order). (2)
    lesson04.politeness_choose.003 AND lesson04.politeness_listen.004 --
    'politeness' (thanks/thank/nice/welcome/yes/no, 6 members pooled with
    A1) has only 2 REAL A2-scoped candidates (yes from this unit, no from
    unit27's real banking dialogue -- both still within the same A2
    course). BOTH templates were broken (each needs >=3), and converting
    both to translation would have produced two duplicate bare-word
    production templates against the identical 2-candidate pool -- no
    honest additional candidate exists, so politeness_choose.003 was
    converted to type: translation (renamed politeness_translate_bare.003)
    and politeness_listen.004 was removed outright rather than kept as
    dead duplicate content. No candidates invented, no A1 vocabulary
    pooled in as if A2-scoped.

    Depth pass (2026-07-07, prs-en/fa-en unit25-26 parity audit): fa-en's
    a2_unit26.yaml sibling (18 templates) has 7 template shapes this pack
    lacked. Re-examined fa-en's own anchoring reasoning first (its
    "Depth pass" note explicitly justifies putting dogpark_noun
    recognition drills on lesson01 too, even though lesson01 itself
    introduces no dogpark_noun member, on the grounds that lesson01
    ["opinion_phrases"] is still a legitimate lesson checkpoint --
    introduces its own 4 real lexemes [opinion/other/hand/agree] -- and
    scripts/compile_content.py's practice-validate only requires
    lesson_content_key to reference a real lesson, not that the
    anchored tag's own members be taught there; this project's existing
    bureaucracy_noun templates already spread across all 4 of unit25's
    lessons on the same reasoning). This supersedes this pack's own
    earlier note above (which read fa-en's lesson01 exclusion as the
    stricter rule and skipped it here) -- fa-en's actual shipped file
    does include lesson01 dogpark_noun items, and the reasoning for
    doing so is sound and already established project-wide, so this
    pass now matches it: (1) lesson01 dogpark_choose/dogpark_listen/
    dogpark_translate (bare recognition, tag-prefixed since lesson01
    already carries possessive_order/identity_choose templates), (2)
    lesson02.translate (lesson02 previously had only choose+listen for
    this tag), (3) lesson03.choose/lesson03.listen (lesson03 previously
    had only matching_pairs+translate), (4) lesson04.choose (lesson04
    previously had only listen+translate). Confirmed via a direct
    iter_specs() read of backfill_lexemes_prs_en.py (level=='a2' filter)
    that dogpark_noun's 4 members (dog/park/playground/space) are real,
    already-backfilled A2-scoped lexemes with 4 distinct Dari glosses --
    same count fa-en's identical English realization gives that
    direction, well above the >=3 floor. 11 -> 18 templates, matching
    fa-en's depth exactly. Every new frame/feedback_frame reuses this
    pack's own existing bare-recognition boilerplate patterns verbatim
    (not fa-en's Farsi) -- no new Dari text was actually needed. Re-
    verified with scripts/_practice_slot_check.py (prs-en: OK) and
    compile_content.py practice-validate, 0 errors/0 warnings. Still
    needs the standard fresh-context review before import.

    UNIT-SCOPE DEAD/FLOOR FIX (2026-07-24, reauth batch, reverting to
    unreviewed): scripts/_practice_unit_scope_check.py flagged this pack
    with 5 DEAD + 1 below-floor. Root cause, confirmed via iter_specs()
    filtered to '.a2.unit26.': `possessive` (my/your/his/her, defined for
    unit06) and `identity`/`politeness` (defined for unit01) are reused
    course-wide tags -- NONE of their members are actually introduced by
    ANY lesson of unit26 itself. This is defect DO-NOT #2 exactly:
    "bare-word recognition variety" reuse works fine in Endless Practice
    (course-scoped) but generate_checkpoint() only ever loads unit26's
    own lexemes, so lesson01.possessive_order.001,
    lesson01.possessive_translate_bare.003, lesson01.identity_choose.004,
    lesson01.identity_listen.005, and lesson04.politeness_translate_bare.003
    all had ZERO unit-scoped candidates and could never generate at
    checkpoint time.
    Fix, per template:
    - possessive_order.001 (word_order, "In {item} opinion, the dog park
      is a good idea") and possessive_translate_bare.003: DROPPED, not
      re-anchored. This frame's whole point is a possessive-pronoun slot,
      and unit26 introduces no possessive pronoun at all -- there is no
      unit-native substitute that keeps the frame grammatical, and
      inventing one would require a new backfill semantic tag (out of
      PACK-ONLY scope). LOGGED for the coordinator.
    - identity_choose.004 / identity_listen.005 (both MC/listen_select,
      bare `{item}` frame -- no course-scope grammaticality risk):
      RE-ANCHORED (renamed vocab_choose.004 / vocab_listen.005) to a bare
      `part_of_speech: noun` pool (no semantic tag, SS3.1(c)/SS8.1).
      Verified via iter_specs(): unit26's own nouns, unit-wide, are 9
      distinct with 9 distinct glosses (opinion/hand/dog/park/idea/dogs/
      space/playground/point) -- well above the 3-answer floor, and a
      real superset of dogpark_noun's 4, so this also newly hosts
      opinion/hand/idea/dogs/point for recognition, not previously
      hostable by ANY template in this pack. Not a duplicate of the
      existing dogpark_choose.006/dogpark_listen.007 (those stay narrower
      on dogpark_noun; these are the wider unit-vocabulary variant).
    - politeness_translate_bare.003 (translation, bare-word, safe with a
      broad pool per SS6.6(a)): RE-ANCHORED (renamed
      vocab_translate_bare.003) to the same bare-noun pool -- adds
      production-tier coverage for opinion/hand/idea/dogs/point, distinct
      from the existing lesson04 translate.002 (which stays narrowly on
      dogpark_noun).
    - lesson03.match.001 (matching_pairs, FLOOR: only 4 slots declared on
      dogpark_noun's real 4-member unit-scoped pool, below the 6-pair
      floor): WIDENED to the same bare-noun pool, 6 of the 9 available
      distinct nouns -- matching_pairs carries no frame-grammaticality
      requirement (SS6.3), so this widening is safe.
    - ADDED one new template, lesson02.dogpark_order.004 (word_order,
      "Everyone loves the {item}.", still on the real dogpark_noun tag,
      NOT the wide bare-noun pool -- word_order needs course-scope
      grammaticality, SS1.1/SS6.4) to replace the structured-tier slot
      lost when possessive_order.001 was dropped. Verified dogpark_noun
      is NOT reused anywhere else in the A2 course (4 course-wide ==
      4 unit-wide, unique to unit26), so "Everyone loves the {item}."
      only ever needs to hold for dog/park/playground/space -- checked,
      all four are grammatical and sensible. No self-reference (literal
      words "Everyone"/"loves"/"the" are not pool candidates).
    tag_schema trimmed to [dogpark_noun] (possessive/identity/politeness
    are no longer referenced by any slot in this file) and the now-unused
    possessive/identity/politeness slot_presets removed.
    Re-verified with scripts/_practice_unit_scope_check.py (0 DEAD, 0
    below-floor for this pack) and compile_content.py practice-validate.
    Reverted status to unreviewed/fresh_context: false -- needs a fresh
    review pass given the substantive change.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [dogpark_noun]
slot_presets:
  dogpark_noun: &dogpark_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: dogpark_noun}}
  unit_noun: &unit_noun {language_code: en, part_of_speech: noun}
templates:
  - content_key: practice.prs-en.en.a2.unit26.lesson01.vocab_choose.004
    lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson01.vocab_listen.005
    lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit26.lesson02.choose.001
