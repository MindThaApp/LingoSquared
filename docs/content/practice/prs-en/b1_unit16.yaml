schema_version: '1.0'
pack_key: practice.prs-en.b1.unit16
source_language: prs
target_language: en
unit_content_key: en.b1.unit16.advice
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 4 fixes + 8 coordinator fixes (multiple_choice/listen_select/matching slots narrowed from the whole B1 pool to prs_en_b1_unit16_words) -- 4 translation templates narrowed (verbs dropped; pool limited to the unit''s own tagged lexemes lessons 01+02+04) so no gloss containing English leaks the answer and inflected-form/near-synonym glosses cannot make the prompt underdetermined. Dari frames and feedback strings checked (Afghan Dari, polite -ین, no Iranian forms, no informal): no defects; templates are bare-word so there are no literal English frames. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: other=دیگه (در on the other hand) has English (leak) and is in lesson03; prioritize=اولویت بتن (garbled) -> اولویت دادن; asking=خواستن (شکل ing فعل ask) wrong sense and English -> پرسیدن؛ goes/leading/asking glosses contain English. Prior note: Generated for the prs-en X->en direction (Dari L1, tested content is English). Follows the established prs-en Endless-Practice pattern (a1_unit45.yaml): bare-{item} frames with untagged slots (language_code: en + part_of_speech in [noun, verb, adjective, adverb, preposition, phrase], no semantic tag) so every slot draws on the WHOLE unit lexeme pool at both unit and course scope, which is safe per PRACTICE_PACK_RECIPE.md SS3.1(c) because none of these frames carry literal English content text besides the {item} placeholder (or plain separators/dashes for matching_pairs). 4 templates per lesson x 4 lessons = 16 templates: multiple_choice + listen_select (recognition), matching_pairs x6 (structured), translation bare-word (production). listen_select is safe here because target_language=en has TTS configured. Measured capacity: 28 unit lexemes, 27 after excluding proper_noun/pronoun/particle/symbol, 27 distinct glosses -- comfortably clears the >=12 floor in every tier and the >=3 MC / >=6 matching_pairs floors. Excluded proper_noun (self-gloss risk, SS6.1), pronoun/particle (function words with no standalone meaning) from all slots. No word_order/fill_in_blank authored: no unit lexeme carries a semantic tag narrow enough to safely anchor a literal-text frame at COURSE scope (SS1.1), and matching_pairs alone clears the structured-tier floor. Feedback strings reused verbatim from the Dari-register exemplar a1_unit45.yaml.

    WAVE 3 (2026-07-26): generated per-unit/per-lesson semantic tags (backfill commit 05af7ace) now exist for this unit, closing the gap flagged above for the 4 matching_pairs templates (recognition/production templates untouched). lesson01 -> prs_en_b1_unit16_lesson01_words (6 tok/6 gloss, exactly the floor), lesson02 -> prs_en_b1_unit16_lesson02_words (10/10), lesson03 -> prs_en_b1_unit16_lesson03_words (6/6, exactly the floor). lesson04 alone is only 4 tok (below floor), so it unions lesson03+lesson04 tags (10 tok/10 gloss, no confusable glosses on inspection) rather than the full unit-wide tag. Dropped ''preposition'' from the part_of_speech filter on all 4 (the generated tag never carries preposition members).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b1_unit16_words
    - prs_en_b1_unit16_lesson01_words
    - prs_en_b1_unit16_lesson02_words
    - prs_en_b1_unit16_lesson03_words
    - prs_en_b1_unit16_lesson04_words
