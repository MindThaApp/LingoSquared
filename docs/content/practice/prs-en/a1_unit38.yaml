schema_version: '1.0'
pack_key: practice.prs-en.a1.unit38
source_language: prs
target_language: en
unit_content_key: en.a1.unit38.household
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-11 by the prs-en depth-extension worker, same pass as unit30-37. Two tags: 4-member ''chore_noun''
    (chore/dishes/ laundry/trash), bare-word recognition only. Single-member ''trash_word'' (trash only) for the generative
    "Can you take out the {item}?" frame -- "trash" is the only chore_noun member that fits that fixed idiom, same single-member
    precedent as unit37''s party_word. EN_POS/en_agreement_tags added to scripts/_en_target_lexeme_common.py as part of this
    pass. Anchoring check: lesson01 introduces new lexemes, safe as an anchor. Every slot''s real candidate count verified
    with scripts/_practice_slot_check.py. Needs the standard fresh-context review before import.

    Fresh-context review, 2026-07-11 (separate worker, zero access to the authoring reasoning above): compile_content.py practice-validate
    (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot >=1 candidate; every multiple_choice/listen_select/matching_pairs
    slot enough distinct values), and backfill_lexemes_prs_en.py --dry-run all clean. Verified every tag member is a real
    introduced_token in this unit''s en realization or earlier; every lesson_content_key anchor exists and introduces >=1
    new lexeme; word_order uses render_frame (string answer, grade() canonicalizes both shapes); matching_pairs correct_response
    = {token: gloss} across all distinct slots. Dari feedback text spot-checked as genuine Afghan register (کنین/شنیدین/می‌ته/کدن,
    صنف/مضمون/موتر/بس/ بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted (not a defect): scripts/_en_target_lexeme_common.py
    now carries three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers); no prs-en generative frame is widened ungrammatically
    -- the one cross-block union effect (celebration_noun gains ''cake'' from a sibling block) is harmless, since ''cake''
    is genuinely taught in en unit37 and has a Dari gloss, so it is only ever a valid recognition candidate. Upgraded to reviewed:
    genuinely clean.


    POLISH 2026-07-24 (tier-thinness wave 2, reverting to unreviewed): recognition was 2 live and production 1 live. Added
    lesson02.listen.001 (sentence-frame listen_select "The {item} can wait until tomorrow" over chore_noun -- all 4 course-scope
    members are grammatical in the frame, no frame word collides with any candidate, options are Dari glosses so defect-1.22-safe),
    lesson03.translate.001 (Dari prompt renders the gloss, answer render_frame "Can you take out the {item}" over single-member
    trash_word), and lesson04.translate.001 (bare-word Dari-metalanguage variant over chore_noun, differs from translate.004
    in frame text). All slots reuse tags already declared in tag_schema. Tiers now 3 recognition / 3 structured / 3 production
    live at unit scope.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - chore_noun
    - trash_word
    - volume_prs_en_a1_unit38_item_09_single
slot_presets:
  chore_noun: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: chore_noun
  trash_word: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: trash_word
templates:
- content_key: practice.prs-en.en.a1.unit38.lesson01.choose.001
  lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی دری {item} را انتخاب کنین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit38.lesson01.listen.002
  lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: واژه‌ای که شنیدین {item} بود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit38.lesson01.match.003
  lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second}'
    language_code: en
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
  feedback_frame:
    text: هر کار خانه را به معنی دری خودش وصل کنین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit38.lesson01.translate.004
  lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: معادل انگلیسی همی کار خانه {item} است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.a1.unit38.lesson01.order.005
