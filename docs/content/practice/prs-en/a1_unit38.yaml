schema_version: "1.0"
pack_key: practice.prs-en.a1.unit38
source_language: prs
target_language: en
unit_content_key: en.a1.unit38.household
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11 by the prs-en depth-extension worker, same pass
    as unit30-37. Two tags: 4-member 'chore_noun' (chore/dishes/
    laundry/trash), bare-word recognition only. Single-member
    'trash_word' (trash only) for the generative "Can you take out the
    {item}?" frame -- "trash" is the only chore_noun member that fits
    that fixed idiom, same single-member precedent as unit37's
    party_word. EN_POS/en_agreement_tags added to
    scripts/_en_target_lexeme_common.py as part of this pass. Anchoring
    check: lesson01 introduces new lexemes, safe as an anchor. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py. Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [chore_noun, trash_word]
slot_presets:
  chore_noun: &chore_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: chore_noun}}
  trash_word: &trash_word {language_code: en, part_of_speech: noun, agreement_tags: {semantic: trash_word}}
templates:
  - content_key: practice.prs-en.en.a1.unit38.lesson01.choose.001
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit38.lesson01.listen.002
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit38.lesson01.match.003
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *chore_noun, second: *chore_noun, third: *chore_noun, fourth: *chore_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر کار خانه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit38.lesson01.translate.004
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی کار خانه {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit38.lesson01.order.005
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: word_order
    frame: {text: "Can you take out the {item}", language_code: en, direction: ltr}
    slots: {item: *trash_word}
    answer_derivation: {kind: render_frame, frame: {text: "Can you take out the {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} چیزی است که باید بیرون کدن.", language_code: prs, direction: rtl}