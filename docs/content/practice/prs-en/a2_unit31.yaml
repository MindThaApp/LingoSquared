  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_a2_unit31_words
    - prs_en_a2_unit31_lesson02_words
    - prs_en_a2_unit31_lesson03_words
    - prs_en_a2_unit31_lesson01_words
