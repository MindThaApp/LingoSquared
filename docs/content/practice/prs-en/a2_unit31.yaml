schema_version: '1.0'
pack_key: practice.prs-en.a2.unit31
source_language: prs
target_language: en
unit_content_key: en.a2.unit31.travel_disruption
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-22 (prs-en practice pass, rest): 12 fixes -- all 12 choose/listen/translate slots were untagged (A2 course-wide adjective/adverb/noun/verb pool); pinned to prs_en_a2_unit31_lesson01_words (5), lesson02 (6), lesson03 (6) and, for lesson04 whose own tag has only 3 words, the unit tag prs_en_a2_unit31_words (20). tag_schema declares lesson01_words. NATIVE FLAGS: train=ریل vs overlay قطار. BACKFILL GLOSS FLAGS: train=ریل (overlay قطار), way=طرف (wrong sense, overlay راه), leaves=حرکت می‌کنه (فعل، سوم‌شخص مفرد) carries a grammar note in the gloss.
    Prior notes: Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. Unit lexeme pool measured with the f".a2.unit31." filter (backfill_lexemes_prs_en.py): 24 unit lexemes across 4 lesson(s) with lexemes; 20 of them survive the content-word filter (part_of_speech not in ['particle', 'preposition', 'pronoun', 'proper_noun', 'symbol'], and excluding function/auxiliary tokens whose english_gloss is a parenthetical grammar note rather than a clean translation: ['a', 'an', 'and', 'by', 'did', 'do', 'does', "don't", 'has', 'have', 'if', 'not', 'on', 'or', 'that', 'the', 'this', 'to'] where present) with 20 distinct english_gloss values. No agreement_tags.semantic exist on this direction's lexemes for this unit (all None at classification time), so every slot is intentionally UNTAGGED (agreement_tags omitted) and constrained only by language_code+part_of_speech -- per recipe SS3.1(c) this is a legal constraint, and because generate_checkpoint() restricts _material() to this unit's own lesson ids before any slot filter runs, the untagged pool is unit-scoped at checkpoint time (equivalent to unioning every lesson's tokens) even though it widens to the whole A2 course at Endless-Practice scope. word_order and fill_in_blank were deliberately NOT authored: without a semantic tag there is no way to pin a single-member anchor or to hand-verify (recipe SS1.1/SS9 step 5) that every course-wide candidate of an untagged slot stays grammatical inside a literal sentence frame, and getting that wrong is the recipe's #1 flagged defect class. matching_pairs (no framing-grammaticality requirement, only a >=6-distinct-token floor) was used for the structured tier instead, anchored to the richest lesson(s). Recommend a follow-up backfill pass adding semantic tags to this unit so word_order/fill_in_blank can be added safely. POLISH WAVE 2 (2026-07-24, POS-ONLY-MATCHING flag): re-audited all three match.001 templates for a semantic-union replacement (recipe SS6.3) against the current backfill_lexemes_prs_en.py iter_specs() -- the best coherent union this unit's lexemes offer is travel_noun+transport_noun+vehicle_noun = 3 distinct tokens (train/bus/departure), far below the 6-pair floor, and every other unit lexeme (21 of 24) is untagged. matching_pairs slots stay deliberately POS-only until a backfill pass tags this unit's disruption vocabulary (delay/cancelled/alternative/notice/station...).
    POLISH WAVE 3 (2026-07-26, blocker resolved): commit 05af7ace added generated per-unit/per-lesson semantic tags (prs_en_a2_unit31_words / prs_en_a2_unit31_lessonNN_words, unit-scoped by construction), exactly the backfill pass the wave-2 note above was waiting on. lesson02.match.001 and lesson03.match.001 re-anchored to their OWN lesson tag (each clears the 6-pair floor alone, exactly at 6, and this makes all three pools genuinely distinct instead of drawing the identical whole-unit pool as before): lesson02.match.001 -> prs_en_a2_unit31_lesson02_words (why/train/delayed/another/ way/tonight, 6 distinct glosses); lesson03.match.001 -> prs_en_a2_unit31_lesson03_words (departure/ time/bus/outside/station/instead, 6 distinct glosses). lesson01.match.001's own lesson tag has only 5 members (delay/cancelled/alternative/notice/signal, below the floor), so it stays on the unit-wide prs_en_a2_unit31_words tag instead (20 tokens total across all 4 lessons, all distinct glosses -- delay/delayed and departure/leaves are derivational pairs, not paraphrases, same discrimination class as singular/plural). part_of_speech [adjective, adverb, noun, verb] kept unchanged on all three. The off-theme course-scope pull this pack's original note flagged is resolved for lesson02/03; lesson01 now pulls the unit's own vocabulary instead of the whole A2 course, which is the intended fix even though its pool is unit-wide rather than lesson-local.
