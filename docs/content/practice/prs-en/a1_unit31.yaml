schema_version: "1.0"
pack_key: practice.prs-en.a1.unit31
source_language: prs
target_language: en
unit_content_key: en.a1.unit31.appearance
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-11 by the prs-en depth-extension worker, same pass
    as unit30. Two tags: 3-member 'eye_color' (blue/brown/green --
    "blue" already classified since unit12's clothing_color, reused
    additively), verified all three fit "Her eyes are {item}." -- kept
    at 3 members, below the 4-candidate comfort margin used for
    matching_pairs elsewhere, so matching_pairs is deliberately NOT used
    here (only mc/listen/translation, all safe at the 3-candidate
    floor). 2-member 'height_adj' (tall/short), word_order/translation
    only (below the mc/listen_select 3-candidate floor), verified both
    fit "My brother is {item}." EN_POS/en_agreement_tags for both tags
    added to scripts/_en_target_lexeme_common.py as part of this pass.
    Anchoring check: lesson01/lesson02 both introduce new lexemes,
    safe as anchors. Every slot's real candidate count verified with
    scripts/_practice_slot_check.py. Needs the standard fresh-context
    review before import.

    Fresh-context review, 2026-07-11 (separate worker, zero access to
    the authoring reasoning above): compile_content.py practice-validate
    (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot
    >=1 candidate; every multiple_choice/listen_select/matching_pairs
    slot enough distinct values), and backfill_lexemes_prs_en.py
    --dry-run all clean. Verified every tag member is a real
    introduced_token in this unit's en realization or earlier; every
    lesson_content_key anchor exists and introduces >=1 new lexeme;
    word_order uses render_frame (string answer, grade() canonicalizes
    both shapes); matching_pairs correct_response = {token: gloss}
    across all distinct slots. Dari feedback text spot-checked as
    genuine Afghan register (کنین/شنیدین/می‌ته/کدن, صنف/مضمون/موتر/بس/
    بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted
    (not a defect): scripts/_en_target_lexeme_common.py now carries
    three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers);
    no prs-en generative frame is widened ungrammatically -- the one
    cross-block union effect (celebration_noun gains 'cake' from a
    sibling block) is harmless, since 'cake' is genuinely taught in en
    unit37 and has a Dari gloss, so it is only ever a valid recognition
    candidate. Upgraded to reviewed: genuinely clean.

    POLISH WAVE 2 (2026-07-24, dispatched TIER-SHORT recognition +
    structured + production; these 4 added templates postdate the
    review above and need the standard fresh-context review): the
    lexeme backfill carries a tag this pack never used -- 4-member
    trait_adj (tall/short/blond/curly, all unit31-native, identical
    pool at course scope) -- which unlocks all three thin tiers.
    Recognition 2 -> 3 via lesson01.choose.003 (trait_adj MC, 4
    distinct unit-scoped glosses, clears the 3-option floor the
    eye_color MC/listen can't). Structured 1 -> 3 via (a)
    lesson01.match.004, a semantic-UNION matching_pairs per
    POLISH_TASK_V2 -- trait_adj + eye_color = exactly 6 distinct unit
    tokens / 6 distinct glosses (tall/short/blond/curly/brown/green; 7
    course-wide, adding only unit12's blue -- themed, no POS-only
    level-wide pull; no paraphrase collisions, glosses re-read per
    SS0.1), and (b) lesson03.order.001 ("My coworker is {item}",
    height_adj -- course-wide pool exactly tall/short, both
    grammatical, no frame word a candidate, thematically native to the
    new-coworker dialogue lesson). Production 2 -> 3 via
    lesson04.translate.001 (bare trait_adj translation, distinct pool
    from the existing height_adj/eye_color translations). choose.001/
    listen.002's 2-value FLOOR lines (eye_color collapses to brown/
    green at unit scope; blue is unit12-native) were NOT dispatched to
    this wave and are left as-is -- a later wave could widen both to
    the same trait_adj+eye_color union (6 unit glosses) if desired.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [eye_color, height_adj, trait_adj]
slot_presets:
  eye_color: &eye_color {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: eye_color}}
  height_adj: &height_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: height_adj}}
  trait_adj: &trait_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: trait_adj}}
  appearance_adj: &appearance_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: [trait_adj, eye_color]}}
templates:
  - content_key: practice.prs-en.en.a1.unit31.lesson02.choose.001
    lesson_content_key: en.a1.unit31.lesson02.eyes_and_description
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *eye_color}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson02.listen.002
    lesson_content_key: en.a1.unit31.lesson02.eyes_and_description
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *eye_color}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson02.translate.003
    lesson_content_key: en.a1.unit31.lesson02.eyes_and_description
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *eye_color}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی رنگ چشم {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson01.order.001
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: word_order
    frame: {text: "My brother is {item}", language_code: en, direction: ltr}
    slots: {item: *height_adj}
    answer_derivation: {kind: render_frame, frame: {text: "My brother is {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} قدی است که ذکر شد.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson01.translate.002
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *height_adj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی صفتِ قد {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson01.choose.003
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *trait_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson01.match.004
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *appearance_adj, second: *appearance_adj, third: *appearance_adj, fourth: *appearance_adj, fifth: *appearance_adj, sixth: *appearance_adj}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر صفت را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson03.order.001
    lesson_content_key: en.a1.unit31.lesson03.dialogue_new_coworker
    type: word_order
    frame: {text: "My coworker is {item}", language_code: en, direction: ltr}
    slots: {item: *height_adj}
    answer_derivation: {kind: render_frame, frame: {text: "My coworker is {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} قد همکار نو را بیان می‌کنه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit31.lesson04.translate.001
    lesson_content_key: en.a1.unit31.lesson04.comparing_appearances
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *trait_adj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی صفت {item} است.", language_code: prs, direction: rtl}