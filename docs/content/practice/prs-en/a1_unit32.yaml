schema_version: "1.0"
pack_key: practice.prs-en.a1.unit32
source_language: prs
target_language: en
unit_content_key: en.a1.unit32.animals
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 2 fixes -- verb pool for choose.006/translate.008 narrowed from all verbs (315) to unit tag prs_en_a1_unit32_words (5), tag registered in tag_schema. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: named=نام‌دار؛ به نام (adjectival, odd for a verb); walks=قدم‌ زدن‌ها، (stray space and comma) -> قدم‌زدن‌ها; likes=خوش داره vs loves=خیلی خوش داره are close options in MC. Prior note: Authored 2026-07-11 by the prs-en depth-extension worker, same pass as unit30/31. Single tag: 4-member ''pet_noun'' (dog/cat/fish/bird -- "dog" already classified since unit26''s dogpark_noun, reused additively), verified all four fit "I have a {item}." EN_POS/ en_agreement_tags added to scripts/_en_target_lexeme_common.py as part of this pass. Anchoring check: lesson01 introduces new lexemes, safe as an anchor. Every slot''s real candidate count verified with scripts/_practice_slot_check.py. Needs the standard fresh-context review before import. Fresh-context review, 2026-07-11 (separate worker, zero access to the authoring reasoning above): compile_content.py practice-validate (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot >=1 candidate; every multiple_choice/listen_select/matching_pairs slot enough distinct values), and backfill_lexemes_prs_en.py --dry-run all clean. Verified every tag member is a real introduced_token in this unit''s en realization or earlier; every lesson_content_key anchor exists and introduces >=1 new lexeme; word_order uses render_frame (string answer, grade() canonicalizes both shapes); matching_pairs correct_response = {token: gloss} across all distinct slots. Dari feedback text spot-checked as genuine Afghan register (کنین/شنیدین/می‌ته/کدن, صنف/مضمون/موتر/بس/ بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted (not a defect): scripts/_en_target_lexeme_common.py now carries three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers); no prs-en generative frame is widened ungrammatically -- the one cross-block union effect (celebration_noun gains ''cake'' from a sibling block) is harmless, since ''cake'' is genuinely taught in en unit37 and has a Dari gloss, so it is only ever a valid recognition candidate. Upgraded to reviewed: genuinely clean. TIER-DEPTH POLISH (2026-07-24, polish wave 2, reverting to unreviewed): all three tiers were <3 live templates. Added choose.006 (lesson04, bare unit-verb pool: 5 distinct unit tokens/glosses), order.007 (lesson02, ''My {item} is friendly'' -- pet_noun course-scope pool is exactly the same 4 pets, all grammatical, no self-reference), translate.008 (lesson04, bare-word verb translation) and translate.009 (lesson01, fixed-sentence translation anchored by the single-member volume_nl_en_a1_unit32_item_10_single tag on ''cat'' -- deterministic per recipe SS6.6(b)). Pre-existing 4-pair match.003 floor gap left as-is (out of scope for this pass). Verified with practice-validate, pool_check, self-reference, unit-scope and Dari-register checks.'
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [pet_noun, volume_nl_en_a1_unit32_item_10_single, prs_en_a1_unit32_words]
slot_presets:
  pet_noun: &pet_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: pet_noun}}
  unit_verb: &unit_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: prs_en_a1_unit32_words}}
  cat_single: &cat_single {language_code: en, part_of_speech: noun, agreement_tags: {semantic: volume_nl_en_a1_unit32_item_10_single}}
templates:
  - content_key: practice.prs-en.en.a1.unit32.lesson01.choose.001
    lesson_content_key: en.a1.unit32.lesson01.pet_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson01.listen.002
    lesson_content_key: en.a1.unit32.lesson01.pet_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson01.match.003
    lesson_content_key: en.a1.unit32.lesson01.pet_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *pet_noun, second: *pet_noun, third: *pet_noun, fourth: *pet_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر حیوان خانگی را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson01.translate.004
    lesson_content_key: en.a1.unit32.lesson01.pet_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *pet_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی حیوان خانگی {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson01.order.005
    lesson_content_key: en.a1.unit32.lesson01.pet_vocabulary
    type: word_order
    frame: {text: "I have a {item}", language_code: en, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: render_frame, frame: {text: "I have a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} حیوان خانگی است که ذکر شد.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson04.choose.006
    lesson_content_key: en.a1.unit32.lesson04.two_pet_owners
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson02.order.007
    lesson_content_key: en.a1.unit32.lesson02.describing_pets
    type: word_order
    frame: {text: "My {item} is friendly", language_code: en, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: render_frame, frame: {text: "My {item} is friendly", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} حیوان خانگی خوش‌رفتار در همی جمله است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson04.translate.008
    lesson_content_key: en.a1.unit32.lesson04.two_pet_owners
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی فعل {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit32.lesson01.translate.009
    lesson_content_key: en.a1.unit32.lesson01.pet_vocabulary
    type: translation
    frame: {text: "ما یک پیشک داریم.", language_code: prs, direction: rtl}
    slots: {item: *cat_single}
    answer_derivation: {kind: render_frame, frame: {text: "We have a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "همی جمله می‌گه که ما یک {item} داریم.", language_code: prs, direction: rtl}