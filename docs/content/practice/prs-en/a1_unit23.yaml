schema_version: "1.0"
pack_key: practice.prs-en.a1.unit23
source_language: prs
target_language: en
unit_content_key: en.a1.unit23.work
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending prs-en's practice
    pool to units 21-26. Uses fa-en's a1_unit23.yaml as the structural
    reference: the shared 5-member 'occupation_noun' tag (teacher/nurse/
    engineer/cook/driver) for bare-word recognition, plus the narrower
    4-member 'occupation_a' tag (excludes 'engineer') for the generative
    "I'm a {item}." frame -- real content shows "I'm a nurse." but "I'm
    an engineer." (engineer starts with a vowel sound), so 'engineer'
    must never be offered as a candidate there or the sampler generates
    "I'm a engineer." Both tags already existed in scripts/
    _en_target_lexeme_common.py; only the Dari gloss dict/UNIT_FILES
    needed extending (نرس/آشپز/دریور, cross-checked against
    docs/content/overlays/prs-en/a1_unit23.yaml's own real text).

    REAL ANCHORING BUG AVOIDED (same class as fa-en's own equivalent
    finding, and this direction's a1_unit08.yaml market_dialogue
    incident): verified via a direct iter_specs() dump, grouped by
    lesson_content_key, that en.a1.unit23.lesson02.what_do_you_do
    introduces ZERO new lexemes for this direction either -- every one
    of its introduced_tokens ("What"/"do"/"you"/"I'm"/"a"/"Where"/"work")
    was already taught in an earlier unit (as far back as unit01/unit09).
    A template anchored there would fail practice import with "lesson
    key ... was not found in the course" on a genuinely fresh stack.
    This pack's "I'm a {item}." templates are instead anchored to
    lesson01 (occupation_words), which DOES introduce new lexemes
    (nurse/cook/driver) and is a safe anchor -- same fix fa-en's own
    unit23 pack already applied.

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover prs-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    the matching_pairs template widened from 2 to 5 slots (the full
    course-wide occupation_noun pool: teacher/nurse/engineer/cook/
    driver -- bare-word recognition, so including "engineer" here is
    safe unlike the narrower occupation_a "I'm a {item}." frame), per
    the pre-computed retrofit table.

    UNIT-SCOPE DEAD FIX (2026-07-24, reauth batch): _practice_unit_scope_check.py
    flagged lesson01.match.003 as DEAD -- occupation_noun's course-wide
    5-member pool (teacher/nurse/engineer/cook/driver) collapses to only
    3 UNIT-scoped members (nurse/cook/driver: "teacher"/"engineer" are
    reused from an earlier unit, not native to unit23), below the
    declared 5 slots. generate_checkpoint() only ever sees unit23's own
    lexemes, so this template could never actually generate at
    checkpoint time despite validating green. Re-anchored per recipe
    SS3.1(c)/SS8.1: dropped the occupation_noun semantic constraint and
    widened to a bare `part_of_speech: noun` pool (no semantic tag),
    which pools ALL of unit23's own nouns course-wide-safe since
    matching_pairs carries no frame-grammaticality requirement (SS6.3) --
    verified via iter_specs() filtered to '.a1.unit23.': 10 distinct,
    all-clean unit-native nouns (nurse/cook/driver/patients/reports/
    company/downtown/emails/clients/job), 10 distinct glosses, no
    proper_noun/case-duplicate risk. Widened from 5 to the recipe's
    6-pair standard (SS16). MC (choose.001) and listen_select (listen.002)
    were NOT touched -- both already sit exactly at the 3-distinct floor
    on occupation_noun's real 3 unit-native members, unaffected by this
    defect. Re-verified 0 DEAD for this pack with
    scripts/_practice_unit_scope_check.py.

    POLISH WAVE 2 (2026-07-24, dispatched TIER-SHORT production +
    POS-ONLY-MATCHING match.003): production tier raised 2 -> 3 via
    lesson03.translate.002, a bare-word translation over the same
    untagged unit_noun pool the 2026-07-24 reauth already vetted (10
    distinct unit-scoped nouns / 10 distinct glosses, re-read per
    SS0.1) -- bare "{item}" prompts vary with the answer, so a broad
    untagged pool is exactly the safe case per recipe SS3.1(c)/SS6.6(a),
    and POLISH_TASK_V2 explicitly leaves bare-translation POS-only
    pools alone. This also gives lesson03 (previously MC-only) a
    production anchor. match.003 deliberately STAYS POS-only per
    POLISH_TASK_V2's escape clause: unit23's own lexemes carry semantic
    tags on only nurse/cook/driver (occupation_noun/occupation_a) plus
    sometimes (frequency_adverb), a maximum semantic-union pool of 4 vs
    the 6-token floor -- and that union would be POS-mixed
    (3 nouns + 1 adverb) on top of being short. Real fix remains a
    prs-en semantic-tag backfill, off-limits to this PACK-ONLY wave.

    Polish wave 3 (2026-07-26): the wave-2 blocker above is RESOLVED --
    commit 05af7ace generated a unit-scoped semantic tag,
    prs_en_a1_unit23_words, in backfill_lexemes_prs_en. Re-anchored the
    dispatched lesson01.match.003 from the untagged unit_noun pool to a
    new unit_tag_noun preset (semantic prs_en_a1_unit23_words +
    part_of_speech noun). Unit-scope pool is the identical 10 nouns
    (nurse/cook/driver/patients/reports/company/downtown/emails/
    clients/job -- "sometimes" is correctly excluded by the noun POS
    filter, and "with" carries no semantic tag at all; glosses re-read,
    all distinct), but course scope now equals unit scope, so Endless
    Practice no longer pulls off-theme course-wide nouns into this pair.
    Slot count stays at 6 (already at the floor; the wider 10-token pool
    is left for a future pass, not dispatched here). lesson03.
    translate.002's untagged unit_noun pool (bare-word translation, no
    course-scope risk) is out of this dispatch and unchanged.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [occupation_noun, occupation_a, prs_en_a1_unit23_words]
slot_presets:
  occupation_noun: &occupation_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: occupation_noun}}
  occupation_a: &occupation_a {language_code: en, part_of_speech: noun, agreement_tags: {semantic: occupation_a}}
  unit_noun: &unit_noun {language_code: en, part_of_speech: noun}
  unit_tag_noun: &unit_tag_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: prs_en_a1_unit23_words}}
templates:
  - content_key: practice.prs-en.en.a1.unit23.lesson01.choose.001
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson01.listen.002
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson01.match.003
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *unit_tag_noun, second: *unit_tag_noun, third: *unit_tag_noun, fourth: *unit_tag_noun, fifth: *unit_tag_noun, sixth: *unit_tag_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson01.translate.004
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی وظیفه {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson01.order.005
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: word_order
    frame: {text: "I'm a {item}", language_code: en, direction: ltr}
    slots: {item: *occupation_a}
    answer_derivation: {kind: render_frame, frame: {text: "I'm a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} وظیفه‌ای است که ذکر شد.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson03.choose.001
    lesson_content_key: en.a1.unit23.lesson03.reading_a_work_profile
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson03.translate.002
    lesson_content_key: en.a1.unit23.lesson03.reading_a_work_profile
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی کلمه {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson04.listen.001
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که در همی گفتگو شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson04.order.002
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: word_order
    frame: {text: "I'm a {item}", language_code: en, direction: ltr}
    slots: {item: *occupation_a}
    answer_derivation: {kind: render_frame, frame: {text: "I'm a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} وظیفه‌ای است که ذکر شد.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit23.lesson04.translate.003
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی وظیفه {item} است.", language_code: prs, direction: rtl}
