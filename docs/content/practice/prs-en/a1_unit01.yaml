unit_content_key: en.a1.unit01.greetings
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (prs-en practice pass, rest): 5 fixes -- practice_translate.905 narrowed from the untagged all-POS pool (2919 lexemes, incl. pronoun i''m contraction, particles and the three same-gloss خوب words good/fine/okay) to the greeting/time_period/farewell/wellbeing_question/politeness tags; variety_politeness_pair.902 pool drops wellbeing_answer (fine and okay both gloss خوب = two identical right-hand matching items); politeness_translate feedback no longer claims the item is a thanks word (pool also holds nice); farewell_translate feedback made generic (pool holds see/later); farewell_pair.003 widened 2 -> 4 slots (goodbye/bye/see/later, all unit01 farewell-tagged). Unfixable: wellbeing_translate.004 fine vs okay share the gloss خوب (no tag separates them); variety_wellbeing_order.901 "I''m bad" is awkward English (no lever, tag holds fine/bad/okay); identity i''m / are glosses have contraction ambiguity only in MC (safe). NATIVE FLAGS: evening=شام (Afghan Dari evening greeting word: شام or عصر?); not=نی (Afghan negation word: نی vs نه?); hi/bye glosses with (خودمانی) suffix. BACKFILL GLOSS FLAGS: okay=خوب identical to fine=خوب (suggest distinguishing gloss); i''m=من استم contraction. Prior notes follow. Fresh-context Codex review (2026-07-05, dispatched by Session 3): removed ungrammatical filler frames (e.g. ''How
    are you? bad, thanks.'', ''I am a library/engineer''), fixed an unrelated word-order slot, rebuilt mixed-category matching
    exercises as genuine same-category pairs, replaced unusable multiple_choice pools and tautological feedback, verified
    Dari terminology and Persian-range ک/ی codepoints independently (not derived from Farsi). Independently re-verified by
    Session 3: compiler 0/0, no jargon leaks, no forbidden Arabic-range codepoints. -- Fresh-context review, 2026-07-06 (separate
    session, zero access to the above authoring/verification reasoning): confirmed all 3 lesson_content_key values match real
    en.a1.unit01.greetings lessons; re-scanned this pack, the sibling overlay, and backfill_lexemes_prs_en.py for Pashto-only
    letters (ډ ڼ ږ څ) and Pashto number words -- none found; hand-rendered every possible sentence for every template''s slot
    candidates (greeting/time_period/farewell/wellbeing_answer/politeness pools, all bare-word or 2-slot pair exercises) --
    all grammatical, no self-reference, no agreement errors (e.g. ''Good day''/''Good night'' both idiomatic English). Upgraded
    to reviewed: genuinely clean. -- matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16): lesson01''s greeting_pair
    template widened from 2 to 5 time_period slots (morning/afternoon/evening/day/night -- the full course-wide time_period
    noun pool, verified against scripts/_en_target_lexeme_common.py). lesson05''s farewell_pair template intentionally LEFT
    at 2 slots (farewell_one/farewell_two, farewell_noun preset) -- the real course-wide pool of noun-tagged farewell tokens
    is only {goodbye, bye} (2 distinct), so widening further would require padding with untaught/non-noun words (see/later/then
    are verb/adverb, excluded by this preset''s part_of_speech), which the new rule explicitly forbids.

    Depth pass, 2026-07-07 (templates-per-unit density audit: prs-en unit01 was tied for shallowest in the direction at 8
    templates). Added 9 new templates, all real-vocabulary, zero invented words: lesson01 gained greeting_listen (listen_select
    on the existing greeting tag, previously only tested via multiple_choice/translation) and time_period_gloss (multiple_choice
    on time_period, previously only word_order/ matching_pairs). lesson03 gained wellbeing_translate (translation) on wellbeing_answer
    (previously only listen_select); politeness_gloss (multiple_choice) and politeness_listen (listen_select) on politeness
    (previously only translation); identity_choose (multiple_choice) on the identity preset -- already defined in this pack''s
    own tag_schema/ slot_presets since the 2026-07-06 matching_pairs retrofit but never actually used by any template until
    now (10 real A1 candidates: am/ are/i/i''m/is/my/name/what/what''s/your, pooled course-wide per the existing matching_pairs-widening
    precedent in this same file -- not an A1/A2 boundary crossing, see AUTHORING_GUIDE.md #18); and wellbeing_question_fill
    (fill_in_blank, ''{item} are you?''), the first fill_in_blank in this pack -- the wellbeing_question tag has exactly ONE
    real A1 candidate (''how''), so the blank is unambiguous by construction (verified with scripts/_fill_in_blank_ambiguity_check.py:
    0 AMBIGUOUS flags). lesson05 gained farewell_translate (translation) and farewell_listen (listen_select) on farewell (previously
    only multiple_choice/matching_pairs). Two real bugs caught by scripts/ _practice_slot_check.py during this pass, both
    fixed before landing: (1) a first draft also added wellbeing_choose (multiple_choice, slot_gloss) on wellbeing_answer
    -- REMOVED, since ''fine'' and ''okay'' share the identical Dari gloss خوب, leaving only 2 distinct answer options where
    multiple_choice needs >=3 (this pack''s original wellbeing_listen avoids the same trap by deriving from slot_text, not
    slot_gloss). (2) the politeness preset''s part_of_speech was originally noun-only, which restricts its real candidate
    pool to just ''thanks'' (1 distinct value) -- too narrow for the new politeness_gloss/ politeness_listen multiple_choice/listen_select
    templates. Widened to [noun, adjective, verb, particle] (matching every POS the politeness semantic tag actually spans:
    nice/thank/thanks/welcome/yes/no), giving 6 distinct real candidates/glosses -- this also incidentally improves the pre-existing
    politeness_translate template, which had unknowingly only ever been able to generate ''thanks'' before this fix. No new
    semantic tags needed in scripts/_en_target_lexeme_common.py -- every tag used here already existed; only a new wellbeing_question
    slot_preset was added to this pack''s own tag_schema (the semantic tag itself was already declared in this file''s tag_schema
    list, just never aliased). Verified with scripts/_practice_slot_check.py (all touched slots now have real candidates at
    or above the relevant floor) and compile_content.py practice-validate, 0 errors/0 warnings. Still carries this pack''s
    own fresh-context review status from before this pass -- a fresh re-review of specifically these 9 new templates has not
    happened yet.

    Unit-scope reauth pass (2026-07-24): scripts/_practice_unit_scope_check.py caught that the depth-pass verification above
    was course-scope, not checkpoint-scope (generate_checkpoint() only loads this unit''s own lexemes) -- 13 DEAD template-slots
    and 4 below-floor. Fixes below are all pack-only, no backfill/realization edits. (1) greeting_pair narrowed from 5 to
    4 time_period slots -- night, the 5th course-wide member, is introduced by unit05, not unit01, so the unit-scoped time_period
    pool is only morning/afternoon/evening/day; now below the 6-pair floor but genuinely capped, matching this file''s own
    farewell_pair precedent above. (2) politeness_gloss and politeness_listen re-anchored from the politeness-only preset
    (2 unit-scoped candidates: thanks/nice) to a new politeness_wellbeing_review preset unioning politeness with wellbeing_answer
    (5 unit-scoped candidates: thanks/nice/fine/bad/okay) -- this is exactly the course-vs-unit-scope gap the prior depth-pass
    note above already documents (it verified 6 candidates course-wide; generate_checkpoint() never sees more than 2 at this
    unit). (3) identity_choose re-anchored from identity-only (2: are/i''m) to a new identity_verb_review preset unioning
    identity with farewell, part_of_speech pronoun+verb (3: are/i''m/see) -- same course-vs-unit-scope gap; the prior note''s
    10 real A1 candidates figure was course-wide, unit01 itself only ever introduces 2. (4) variety_politeness_pair (6-slot
    matching_pairs) re-anchored from politeness-only (2 unit-scoped) to a new unit01_vocab_review preset unioning greeting,
    time_period, wellbeing_answer and politeness, part_of_speech noun+adjective (13 unit-scoped distinct tokens, no confusable
    glosses) -- was DEAD, needed 6 had 2. Frame/feedback text changed from a polite-words label to a generic match-these-words
    label since the pool is no longer politeness-only. (5) variety_dialogue_pair (6-slot matching_pairs) re-anchored from
    dialogue_word, which has ZERO unit01 members (it is entirely unit02''s own tag: student/teacher/library/etc, a straight
    cross-unit leak), to a new farewell_identity_review preset unioning farewell with identity, part_of_speech noun+verb+adverb+pronoun
    (exactly 6 unit-scoped distinct: goodbye/bye/see/later/are/i''m, no overlap, no confusable glosses). Frame/feedback text
    likewise genericized. (6) variety_family_pair DROPPED -- extended_family has ZERO unit01 members (it is entirely unit06''s
    own tag: grandmother/grandfather/aunt/uncle/cousin), another straight cross-unit leak, and unlike (4)/(5) there is no
    unit01-native semantic tag left to re-anchor it to that is not already fully used by the other two widened matching_pairs
    templates; a third matching_pairs recycling the identical vocab-review pool would add no real coverage. Unused dialogue_word/extended_family
    entries removed from tag_schema and their now-orphaned dialogue_noun/extended_family slot_presets removed. farewell_pair
    (2 slots) is untouched -- it was already unit-scope-valid, only below the 6-pair floor, and this file''s own prior note
    already justifies that ceiling. Verified: scripts/_practice_unit_scope_check.py now reports 0 DEAD for this pack (residual
    below-floor: greeting_pair 4/6 and farewell_pair 2/6, both honestly-thin course-wide ceilings); compile_content.py practice-validate
    0 errors; scripts/check_dari_register.py no new findings (every new/changed Dari string reuses this file''s own existing
    phrasing, changed only in the topic noun).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - greeting
    - time_period
    - farewell
    - wellbeing_question
    - wellbeing_answer
    - politeness
    - identity
    - person_name
    - volume_prs_en_a1_unit01_time_period_02_single
    - volume_prs_en_a1_unit01_item_04_single
    - volume_prs_en_a1_unit01_item_06_single
    person:
    - first
    - second
    - third
