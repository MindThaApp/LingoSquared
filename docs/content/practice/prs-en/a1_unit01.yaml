schema_version: "1.0"
pack_key: practice.prs-en.a1.unit01
source_language: prs
target_language: en
unit_content_key: en.a1.unit01.greetings
review:
  status: reviewed
  fresh_context: true
  notes: "Fresh-context Codex review (2026-07-05, dispatched by Session 3): removed ungrammatical filler frames (e.g. 'How are you? bad, thanks.', 'I am a library/engineer'), fixed an unrelated word-order slot, rebuilt mixed-category matching exercises as genuine same-category pairs, replaced unusable multiple_choice pools and tautological feedback, verified Dari terminology and Persian-range ک/ی codepoints independently (not derived from Farsi). Independently re-verified by Session 3: compiler 0/0, no jargon leaks, no forbidden Arabic-range codepoints. -- Fresh-context review, 2026-07-06 (separate session, zero access to the above authoring/verification reasoning): confirmed all 3 lesson_content_key values match real en.a1.unit01.greetings lessons; re-scanned this pack, the sibling overlay, and backfill_lexemes_prs_en.py for Pashto-only letters (ډ ڼ ږ څ) and Pashto number words -- none found; hand-rendered every possible sentence for every template's slot candidates (greeting/time_period/farewell/wellbeing_answer/politeness pools, all bare-word or 2-slot pair exercises) -- all grammatical, no self-reference, no agreement errors (e.g. 'Good day'/'Good night' both idiomatic English). Upgraded to reviewed: genuinely clean. -- matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16): lesson01's greeting_pair template widened from 2 to 5 time_period slots (morning/afternoon/evening/day/night -- the full course-wide time_period noun pool, verified against scripts/_en_target_lexeme_common.py). lesson05's farewell_pair template intentionally LEFT at 2 slots (farewell_one/farewell_two, farewell_noun preset) -- the real course-wide pool of noun-tagged farewell tokens is only {goodbye, bye} (2 distinct), so widening further would require padding with untaught/non-noun words (see/later/then are verb/adverb, excluded by this preset's part_of_speech), which the new rule explicitly forbids."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [greeting, time_period, farewell, wellbeing_question, wellbeing_answer, politeness, identity, person_name, dialogue_word]
    person: [first, second, third]
slot_presets:
  greeting: &greeting {language_code: en, part_of_speech: noun, agreement_tags: {semantic: greeting}}
  time_period: &time_period {language_code: en, part_of_speech: noun, agreement_tags: {semantic: time_period}}
  farewell: &farewell {language_code: en, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: farewell}}
  farewell_noun: &farewell_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: farewell}}
  wellbeing_answer: &wellbeing_answer {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: wellbeing_answer}}
  politeness: &politeness {language_code: en, part_of_speech: noun, agreement_tags: {semantic: politeness}}
  identity: &identity {language_code: en, part_of_speech: [pronoun, verb], agreement_tags: {semantic: identity}}
templates:
  # Lesson 1: everyday greetings.
  - content_key: practice.prs-en.en.a1.unit01.lesson01.greeting_meaning.001
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: multiple_choice
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_gloss, slot: greeting}
    feedback_frame: {text: "معنای دری {greeting} را انتخاب کردین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson01.greeting_fill.002
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: fill_in_blank
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "{greeting} به همین شکل نوشته می‌شود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson01.greeting_translate.003
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: translation
    frame: {text: "{greeting}", language_code: prs, direction: rtl, slot_rendering: {greeting: english_gloss}}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "{greeting} معادل انگلیسی عبارت داده‌شده است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson01.time_order.004
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: word_order
    frame: {text: "Good {time_period}", language_code: en, direction: ltr}
    slots: {time_period: *time_period}
    answer_derivation: {kind: render_frame, frame: {text: "Good {time_period}", language_code: en, direction: ltr}}
    feedback_frame: {text: "Good پیش از واژهٔ زمان می‌آید: Good {time_period}.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson01.greeting_pair.005
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {text: "{time_period_one} — {time_period_two}", language_code: en, direction: ltr}
    slots: {time_period_one: *time_period, time_period_two: *time_period, time_period_three: *time_period, time_period_four: *time_period, time_period_five: *time_period}
    slot_relations: [{kind: distinct, slots: [time_period_one, time_period_two, time_period_three, time_period_four, time_period_five]}]
    answer_derivation: {kind: matching_pairs, slots: [time_period_one, time_period_two, time_period_three, time_period_four, time_period_five]}
    feedback_frame: {text: "{time_period_one} و {time_period_two} را به معنای دری آن‌ها وصل کنین.", language_code: prs, direction: rtl}

  # Lesson 3: wellbeing exchange.
  - content_key: practice.prs-en.en.a1.unit01.lesson03.wellbeing_listen.001
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: listen_select
    frame: {text: "{wellbeing_answer}", language_code: en, direction: ltr}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_text, slot: wellbeing_answer}
    feedback_frame: {text: "واژهٔ شنیده‌شده {wellbeing_answer} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson03.wellbeing_fill.002
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: fill_in_blank
    frame: {text: "{wellbeing_answer}", language_code: en, direction: ltr}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_text, slot: wellbeing_answer}
    feedback_frame: {text: "{wellbeing_answer} یکی از واژه‌های درس احوال‌پرسی است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson03.politeness_translate.003
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {text: "{politeness}", language_code: prs, direction: rtl, slot_rendering: {politeness: english_gloss}}
    slots: {politeness: *politeness}
    answer_derivation: {kind: slot_text, slot: politeness}
    feedback_frame: {text: "{politeness} برای تشکر مؤدبانه استفاده می‌شود.", language_code: prs, direction: rtl}

  # Lesson 5: friendly closings.
  - content_key: practice.prs-en.en.a1.unit01.lesson05.farewell_meaning.001
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: multiple_choice
    frame: {text: "{farewell}", language_code: en, direction: ltr}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_gloss, slot: farewell}
    feedback_frame: {text: "معنای دری {farewell} را انتخاب کردین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson05.farewell_fill.002
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: fill_in_blank
    frame: {text: "{farewell}", language_code: en, direction: ltr}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_text, slot: farewell}
    feedback_frame: {text: "{farewell} به همین شکل نوشته می‌شود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit01.lesson05.farewell_pair.003
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: matching_pairs
    frame: {text: "{farewell_one} — {farewell_two}", language_code: en, direction: ltr}
    slots: {farewell_one: *farewell_noun, farewell_two: *farewell_noun}
    slot_relations: [{kind: distinct, slots: [farewell_one, farewell_two]}]
    answer_derivation: {kind: matching_pairs, slots: [farewell_one, farewell_two]}
    feedback_frame: {text: "{farewell_one} و {farewell_two} را به معنای دری آن‌ها وصل کنین.", language_code: prs, direction: rtl}
