schema_version: "1.0"
pack_key: practice.prs-en.a1.unit36
source_language: prs
target_language: en
unit_content_key: en.a1.unit36.education
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11 by the prs-en depth-extension worker, same pass
    as unit30-35. Two tags: 6-member 'education_noun' (class/course/
    student/homework/subject/test -- "class"/"student"/"test" already
    classified since unit13/unit01/unit13 respectively, reused
    additively) for bare-word recognition; narrower 3-member
    'recurring_class_noun' (class/course/test) for the generative "I
    have a {item} every Friday." frame -- "student"/"subject" don't fit
    that frame at all, and "homework" is uncountable ("a homework" is
    ungrammatical), so all three are excluded from the narrower tag.
    EN_POS/en_agreement_tags added to scripts/_en_target_lexeme_common.py
    as part of this pass; matching_pairs uses education_noun's first 4
    (class/course/student/homework). Anchoring check: lesson01
    introduces new lexemes, safe as an anchor. Every slot's real
    candidate count verified with scripts/_practice_slot_check.py.
    Needs the standard fresh-context review before import.

    Fresh-context review, 2026-07-11 (separate worker, zero access to
    the authoring reasoning above): compile_content.py practice-validate
    (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot
    >=1 candidate; every multiple_choice/listen_select/matching_pairs
    slot enough distinct values), and backfill_lexemes_prs_en.py
    --dry-run all clean. Verified every tag member is a real
    introduced_token in this unit's en realization or earlier; every
    lesson_content_key anchor exists and introduces >=1 new lexeme;
    word_order uses render_frame (string answer, grade() canonicalizes
    both shapes); matching_pairs correct_response = {token: gloss}
    across all distinct slots. Dari feedback text spot-checked as
    genuine Afghan register (کنین/شنیدین/می‌ته/کدن, صنف/مضمون/موتر/بس/
    بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted
    (not a defect): scripts/_en_target_lexeme_common.py now carries
    three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers);
    no prs-en generative frame is widened ungrammatically -- the one
    cross-block union effect (celebration_noun gains 'cake' from a
    sibling block) is harmless, since 'cake' is genuinely taught in en
    unit37 and has a Dari gloss, so it is only ever a valid recognition
    candidate. Upgraded to reviewed: genuinely clean.

    UNIT-SCOPE DEAD FIX (2026-07-24, reauth batch, reverting to
    unreviewed): scripts/_practice_unit_scope_check.py flagged lesson01.
    match.003 as DEAD -- education_noun's course-wide 6-member pool
    (class/course/student/homework/subject/test) collapses to just 3
    UNIT-scoped members (course/homework/subject: class/student/test are
    reused additively from earlier units, exactly as this file's own
    authoring note already documents), below the declared 4 slots.
    generate_checkpoint() only ever sees unit36's own lexemes, so this
    template could never actually generate at checkpoint time despite
    validating green and passing the earlier (course-wide) review.
    Fix: dropped the education_noun semantic constraint and widened to a
    bare `part_of_speech: noun` pool (no semantic tag, SS3.1(c)/SS8.1),
    safe for matching_pairs since it carries no frame-grammaticality
    requirement (SS6.3). Verified via iter_specs() filtered to
    '.a1.unit36.': 10 distinct, all-clean unit-native nouns (course/
    community/college/homework/subject/math/photography/nights/skills/
    classes), 10 distinct glosses, no proper_noun/case-duplicate risk.
    Widened from 4 to the recipe's 6-pair standard (SS16). MC
    (choose.001) and listen_select (listen.002) were NOT touched -- both
    already sit exactly at the 3-distinct floor on education_noun's real
    3 unit-native members, unaffected by this defect.
    Also ADDED one new template, translate.006, anchored to lesson04
    (en.a1.unit36.lesson04.learning_something_new, which previously had
    zero templates despite introducing 12 real lexemes) using the same
    widened noun pool, per the recipe's "thin lesson01-only pack"
    guidance (SS0 fix option 2) -- gives real production-tier target
    coverage to nights/skills/classes, not a duplicate of any existing
    template.
    Re-verified with scripts/_practice_unit_scope_check.py (0 DEAD, 0
    below-floor for this pack) and compile_content.py practice-validate.
    Reverted status to unreviewed/fresh_context: false -- needs a fresh
    review pass given the substantive change.

    TIER-DEPTH POLISH (2026-07-24, polish wave 2): all three tiers were
    <3 live. Added choose.007 (lesson02, bare unit-noun pool: 10
    distinct unit tokens/glosses), order.008 (lesson02, 'She is taking a
    {item} at night' -- recurring_class_noun course pool is exactly
    class/course/test, all grammatical, no self-reference) and
    translate.009 (lesson03, bare-word adverb translation:
    how's/sometime/outside/someday; the "how's" apostrophe is covered by
    en distance-1 typo tolerance). match.003 POS-ONLY DISPATCH NOTE:
    left POS-only deliberately -- the unit's lexemes carry semantic tags
    on only 3 unit-native tokens (course/homework/subject via
    education_noun; recurring_class_noun/class_noun are subsets), so no
    semantic union can reach the 6-distinct-token matching floor, and
    tags cannot be added from a pack file. A production verb pool was
    considered and rejected: 'study'/'studying' glosses differ only by
    ZWNJ-vs-space (visually identical prompts, mis-grading trap).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [education_noun, recurring_class_noun]
slot_presets:
  education_noun: &education_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: education_noun}}
  recurring_class_noun: &recurring_class_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: recurring_class_noun}}
  unit_noun: &unit_noun {language_code: en, part_of_speech: noun}
  unit_adv: &unit_adv {language_code: en, part_of_speech: adverb}
templates:
  - content_key: practice.prs-en.en.a1.unit36.lesson01.choose.001
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.listen.002
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.match.003
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *unit_noun, second: *unit_noun, third: *unit_noun, fourth: *unit_noun, fifth: *unit_noun, sixth: *unit_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.translate.004
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی واژهٔ تحصیلی {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.order.005
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: word_order
    frame: {text: "I have a {item} every Friday", language_code: en, direction: ltr}
    slots: {item: *recurring_class_noun}
    answer_derivation: {kind: render_frame, frame: {text: "I have a {item} every Friday", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} چیزی است که هر جمعه دارین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson04.translate.006
    lesson_content_key: en.a1.unit36.lesson04.learning_something_new
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی واژه {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson02.choose.007
    lesson_content_key: en.a1.unit36.lesson02.taking_a_class
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson02.order.008
    lesson_content_key: en.a1.unit36.lesson02.taking_a_class
    type: word_order
    frame: {text: "She is taking a {item} at night", language_code: en, direction: ltr}
    slots: {item: *recurring_class_noun}
    answer_derivation: {kind: render_frame, frame: {text: "She is taking a {item} at night", language_code: en, direction: ltr}}
    feedback_frame: {text: "او شب یک {item} می‌گیره.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson03.translate.009
    lesson_content_key: en.a1.unit36.lesson03.dialogue_photography_class
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_adv}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی قید {item} است.", language_code: prs, direction: rtl}