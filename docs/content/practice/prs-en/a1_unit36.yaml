schema_version: "1.0"
pack_key: practice.prs-en.a1.unit36
source_language: prs
target_language: en
unit_content_key: en.a1.unit36.education
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11 by the prs-en depth-extension worker, same pass
    as unit30-35. Two tags: 6-member 'education_noun' (class/course/
    student/homework/subject/test -- "class"/"student"/"test" already
    classified since unit13/unit01/unit13 respectively, reused
    additively) for bare-word recognition; narrower 3-member
    'recurring_class_noun' (class/course/test) for the generative "I
    have a {item} every Friday." frame -- "student"/"subject" don't fit
    that frame at all, and "homework" is uncountable ("a homework" is
    ungrammatical), so all three are excluded from the narrower tag.
    EN_POS/en_agreement_tags added to scripts/_en_target_lexeme_common.py
    as part of this pass; matching_pairs uses education_noun's first 4
    (class/course/student/homework). Anchoring check: lesson01
    introduces new lexemes, safe as an anchor. Every slot's real
    candidate count verified with scripts/_practice_slot_check.py.
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [education_noun, recurring_class_noun]
slot_presets:
  education_noun: &education_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: education_noun}}
  recurring_class_noun: &recurring_class_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: recurring_class_noun}}
templates:
  - content_key: practice.prs-en.en.a1.unit36.lesson01.choose.001
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.listen.002
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.match.003
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *education_noun, second: *education_noun, third: *education_noun, fourth: *education_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر واژهٔ تحصیلی را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.translate.004
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی واژهٔ تحصیلی {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit36.lesson01.order.005
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: word_order
    frame: {text: "I have a {item} every Friday", language_code: en, direction: ltr}
    slots: {item: *recurring_class_noun}
    answer_derivation: {kind: render_frame, frame: {text: "I have a {item} every Friday", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} چیزی است که هر جمعه دارین.", language_code: prs, direction: rtl}