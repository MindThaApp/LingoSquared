schema_version: "1.0"
pack_key: practice.prs-en.a1.unit17
source_language: prs
target_language: en
unit_content_key: en.a1.unit17.plans
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the prs-en practice-pool-sync lane extending
    coverage to units 15-20, mirroring the sibling fa-en/a1_unit17.yaml
    pack's structure (11 templates). Same deliberate scope decision as
    that pack: lesson01 (proposing an activity: "Do you want to see a
    movie...?"/"Would you like to go for a walk?") gets ZERO generated
    templates -- neither invitation phrase mentions a specific day/time/
    place that could vary, and none of this lesson's other vocabulary
    (want/movie/weekend/would/walk) has a same-lesson synonym group. The
    other three lessons all reuse the already-established 7-member
    weekday tag (from unit04) -- genuinely apt here since this whole
    unit is about scheduling: "I'm busy on {item}." (lesson02), "Do you
    want to have lunch on {item}?" (lesson03), "{item} works for me."
    (lesson04) are all grammatical with any weekday. All POS/semantic-tag
    classification was already present in scripts/
    _en_target_lexeme_common.py before this pass -- only scripts/
    backfill_lexemes_prs_en.py's own Dari gloss dict needed extending
    (want/movie/weekend/would/walk/love/busy/maybe/another/lunch/1pm/
    works), cross-checked against docs/content/overlays/prs-en/
    a1_unit17.yaml's own real Dari phrasing (e.g. have lunch="چاشت
    خوردن", works for me="برایم خوب استه"). Verified with
    scripts/_practice_slot_check.py that every slot has >=1 real
    candidate lexeme and every multiple_choice/listen_select slot has
    >=4 distinct candidate values (weekday has 7). The underlying en
    realization unit17 is UNREVIEWED (Codex was usage-limited at
    authoring time); the prs-en overlay is already reviewed -- the
    realization needs the standard fresh-context review before import.
tag_schema:
  part_of_speech: [noun]
  agreement_tags:
    semantic: [weekday]
slot_presets:
  weekday: &weekday {language_code: en, part_of_speech: noun, agreement_tags: {semantic: weekday}}
templates:
  - content_key: practice.prs-en.en.a1.unit17.lesson02.busy_order.001
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: word_order
    frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} روزی است که مصروف استین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit17.lesson02.busy_fill.002
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: fill_in_blank
    frame: {text: "I'm busy on {item}.", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} روزی است که مصروف استین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit17.lesson02.busy_translate.003
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: translation
    frame: {text: "روز {item} مصروف استم.", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "I'm busy on {item} یعنی روز {item} مصروف استم.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit17.lesson02.weekday_listen.004
