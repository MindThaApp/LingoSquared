  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b1_unit09_words
    - prs_en_b1_unit09_lesson03_words
    - prs_en_b1_unit09_words
