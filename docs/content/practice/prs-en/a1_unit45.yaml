schema_version: '1.0'
pack_key: practice.prs-en.a1.unit45
source_language: prs
target_language: en
unit_content_key: en.a1.unit45.emergencies
review:
  status: reviewed
  fresh_context: 'true'
  notes: Authored 2026-07-12 as an additive Endless Practice coverage backfill for prs-en A1 unit 45. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.
    Polish 2026-07-24 (tier-thinness + POS-only matching wave) -- expanded both matching_pairs templates from 4 to
    6 pairs (defect 1.19 floor) and added one lesson-anchored template per tier (choose/match/translate) with
    content-word part_of_speech pools [noun, verb, adjective] so every tier has >=3 live templates and non-lesson01
    lessons are represented in the checkpoint lesson round-robin. matching_pairs slots left WITHOUT an
    agreement_tags.semantic union deliberately -- backfill_lexemes_prs_en.py carries 0 semantically tagged
    lexeme(s) for this unit, so no unit-native semantic union can cover 6 distinct tokens; adding tags to the
    backfill scripts is out of scope for pack-only edits (recipe SS6.3 honest-thin escape).
    RE-ANCHOR (2026-07-26, polish wave 3) -- commit 05af7ace closed the blocker above -- prs-en now carries a generated
    unit-wide tag (prs_en_a1_unit45_words, first-introduction-only) covering 28 distinct content tokens/glosses at
    unit scope, plus per-lesson tags. Added an agreement_tags.semantic value of prs_en_a1_unit45_words to every slot of
    match.002 and volume_match.004 (lesson01's own tag is only 5 tokens, below floor, so both stay on the unit-wide
    union). lesson04.match.004 got the narrower `prs_en_a1_unit45_lesson04_words` instead -- the lesson tag alone
    already yields 11 distinct tokens/glosses, clearing the floor without borrowing the unit-wide set, so it now
    themes tighter to the emergency_notice lesson than its siblings. POS lists left as-is (the tag only ever lands on
    noun/verb/adjective/adverb/phrase, so it narrows to content words on its own). Course-scope extras now 0 for all
    three. No exact-duplicate glosses in either pool (pool_check.py).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic: [prs_en_a1_unit45_words, prs_en_a1_unit45_lesson04_words]
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
