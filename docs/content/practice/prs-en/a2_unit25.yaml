schema_version: "1.0"
pack_key: practice.prs-en.a2.unit25
source_language: prs
target_language: en
unit_content_key: en.a2.unit25.bureaucracy
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending prs-en's practice
    pool to units 21-26 -- this is the first A2-level unit for this
    direction (registering with local authorities: appointments,
    documents, formal requests). Uses fa-en's a2_unit25.yaml as the
    structural reference: the shared 4-member 'bureaucracy_noun' tag
    (appointment/document/form/confirmation) is used ONLY for bare-word
    recognition, deliberately not attempting a generative frame -- this
    unit's A2-register content is dominated by multi-word formal phrases
    ("I was wondering whether...", "Could you tell me...") that don't
    reduce to a safe single-token slot, same discipline fa-en/nl-en's own
    unit25 packs documented. No new EN_POS/agreement_tags entries were
    needed; only scripts/backfill_lexemes_prs_en.py's Dari gloss dict and
    UNIT_FILES tuple were extended (ملاقات/سند/فورم/نمبر تأیید,
    cross-checked against docs/content/overlays/prs-en/a2_unit25.yaml's
    own real text -- the largest single-unit addition in this batch given
    its A2 formal-register vocabulary).

    Anchoring check (same discipline as every other pack in this batch):
    verified via iter_specs() that every one of this unit's four lessons
    introduces at least one new lexeme, so all four are safe
    lesson_content_key anchors.

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover prs-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    the matching_pairs template widened from 2 to 4 slots (the full
    course-wide bureaucracy_noun pool: appointment/document/form/
    confirmation), per the pre-computed retrofit table.

    Depth pass (2026-07-06, templates-per-unit audit): unit25 was
    flagged as thin (8 templates vs the pack's 10-16 average). Rather
    than force a generative frame onto bureaucracy_noun (still
    deliberately bare-recognition-only, per the reasoning above --
    "appointment"/"document"/"form"/"confirmation" don't collocate
    uniformly), 8 new templates reuse the already-established
    course-wide 'weekday' tag (7 members, defined in unit04, already
    safely reused by unit11/unit17's own practice packs for the same
    reason): unit25's own real content genuinely mentions a specific
    weekday twice -- lesson02's real taught phrase "Would it be
    possible to come this Friday?" and lesson04's real dialogue line
    "Friday at 10am works." Both generalize to any of the 7 weekdays
    with zero grammar loss ("Would it be possible to come this
    Monday?"/"Monday at 10am works." are equally grammatical), so each
    became a 4-template set (word_order, fill_in_blank, translation,
    bare listen_select) anchored to its own real lesson
    (lesson02.making_a_formal_appointment, lesson04.dmv_appointment_
    dialogue respectively) -- no invented English tokens or Dari
    glosses, every gloss/POS/tag already existed in
    scripts/_en_target_lexeme_common.py and backfill_lexemes_prs_en.py
    before this pass, so neither shared file needed a change (both are
    out of scope for this pass anyway -- shared with the parallel nl-en/
    fa-en workers doing the identical task on their own unit25/26
    files). 8 -> 16 templates. Re-verified with
    scripts/_practice_slot_check.py (weekday has 7 distinct course-wide
    candidates, well above the >=3 multiple_choice/listen_select floor)
    and compile_content.py practice-validate, 0 errors/0 warnings.
    Still needs the standard fresh-context review before import.

    A2-scoping correctness fix (2026-07-07): scripts/_practice_slot_check.py
    pools ALL specs from iter_specs() (both A1 and A2) together when
    counting a tag's real distinct-candidate count, but
    backend/app/practice/service.py's _material() actually scopes both
    PracticeTemplate and Lexeme queries by course_id, and 'A1'/'A2' are
    separate Course rows -- a real A2 enrollee only ever sees A2-scoped
    lexemes. A standalone A2-only-scoped check (filtering iter_specs() to
    level=='a2') found the 'weekday' course-wide tag (7 members pooled
    with A1) has only 1 REAL A2-scoped candidate ('friday' -- the only
    weekday ever introduced across all four A2 units 25-28), invalidating
    the "7 distinct course-wide candidates" note above (a pooled-with-A1
    count, not a real A2-only count). Both lesson02.weekday_listen.005
    and lesson04.weekday_listen.006 (listen_select, needs >=3 distinct)
    could never actually generate for a real A2-course user. Fixed by
    converting both to type: translation (bare single-word production,
    slot_text derivation instead of slot_gloss -- no minimum-candidate
    floor, and genuinely distinct from the existing full-sentence
    weekday_translate templates in the same lessons, not a duplicate) --
    renamed weekday_translate_bare.005/.006 respectively. No candidates
    invented, no A1 vocabulary pooled in as if A2-scoped.

    Depth pass (2026-07-07, prs-en/fa-en unit25-26 parity audit): fa-en's
    a2_unit25.yaml sibling (19 templates) has 5 template shapes this pack
    lacked, all reusing the already-anchored bureaucracy_noun tag on
    lessons that already carry at least one bureaucracy_noun template
    here (so no new anchor, no new vocabulary, no new gloss dict entry):
    lesson02.choose/lesson02.translate (lesson02 previously had only
    listen_select for this tag), lesson03.choose/lesson03.translate
    (lesson03 previously had only listen_select), and lesson04.listen
    (lesson04 previously had only choose+translate). Confirmed via a
    direct iter_specs() read of backfill_lexemes_prs_en.py (level=='a2'
    filter) that all four of bureaucracy_noun's members (appointment/
    document/form/confirmation) are real, already-backfilled A2-scoped
    lexemes with 4 distinct Dari glosses -- well above the >=3 floor for
    multiple_choice/listen_select, same count fa-en's identical English
    realization gives that direction. 14 -> 19 templates, matching
    fa-en's depth exactly. Every new frame/feedback_frame reuses this
    pack's own existing bare-recognition boilerplate patterns verbatim
    (not fa-en's Farsi) -- no new Dari text was actually needed since
    these are bare single-token recognition drills identical in shape to
    the pack's own pre-existing bureaucracy_noun templates. Re-verified
    with scripts/_practice_slot_check.py (prs-en: OK) and
    compile_content.py practice-validate, 0 errors/0 warnings. Still
    needs the standard fresh-context review before import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [bureaucracy_noun, weekday]
slot_presets:
  bureaucracy_noun: &bureaucracy_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: bureaucracy_noun}}
  weekday: &weekday {language_code: en, part_of_speech: noun, agreement_tags: {semantic: weekday}}
templates:
  - content_key: practice.prs-en.en.a2.unit25.lesson01.choose.001
    lesson_content_key: en.a2.unit25.lesson01.registration_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit25.lesson01.listen.002
    lesson_content_key: en.a2.unit25.lesson01.registration_vocabulary
