  - content_key: practice.prs-en.en.a2.unit27.lesson01.choose.001
    lesson_content_key: en.a2.unit27.lesson01.banking_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *banking_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a2.unit27.lesson01.listen.002
    lesson_content_key: en.a2.unit27.lesson01.banking_vocabulary
