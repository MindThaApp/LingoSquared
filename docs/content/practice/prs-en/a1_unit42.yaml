review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-11 by the prs-en depth-extension worker, same pass as unit30-41 -- the last unit in this depth-extension
    batch (units 30-42), closing the gap a depth audit found between existing practice-pool coverage (units 1-29) and prs-en''s
    authored content (units 1-69). Single tag: 6-member ''personality_adj'' (friendly/funny/hardworking/shy/calm/talkative
    -- "friendly" already classified since unit32, reused additively), verified all six fit "My neighbor is very {item}."
    EN_POS/en_agreement_tags added to scripts/_en_target_lexeme_common.py as part of this pass; matching_pairs uses the first
    4 (funny/hardworking/shy/calm). Anchoring check: lesson01 introduces new lexemes, safe as an anchor. Every slot''s real
    candidate count verified with scripts/_practice_slot_check.py. Needs the standard fresh-context review before import.

    Fresh-context review, 2026-07-11 (separate worker, zero access to the authoring reasoning above): compile_content.py practice-validate
    (0 errors/0 warnings), scripts/_practice_slot_check.py (every slot >=1 candidate; every multiple_choice/listen_select/matching_pairs
    slot enough distinct values), and backfill_lexemes_prs_en.py --dry-run all clean. Verified every tag member is a real
    introduced_token in this unit''s en realization or earlier; every lesson_content_key anchor exists and introduces >=1
    new lexeme; word_order uses render_frame (string answer, grade() canonicalizes both shapes); matching_pairs correct_response
    = {token: gloss} across all distinct slots. Dari feedback text spot-checked as genuine Afghan register (کنین/شنیدین/می‌ته/کدن,
    صنف/مضمون/موتر/بس/ بایسکل/پیشک/بی‌بی), no Iranian Farsi calques, ZWNJ correct. Noted (not a defect): scripts/_en_target_lexeme_common.py
    now carries three additive unit30-42 tag blocks (prs-en/fa-en/nl-en workers); no prs-en generative frame is widened ungrammatically
    -- the one cross-block union effect (celebration_noun gains ''cake'' from a sibling block) is harmless, since ''cake''
    is genuinely taught in en unit37 and has a Dari gloss, so it is only ever a valid recognition candidate. Upgraded to reviewed:
    genuinely clean.


    POLISH 2026-07-24 (tier-thinness wave 2, reverting to unreviewed): recognition was 2 live and production 1 live. Added
    lesson02.listen.001 (sentence-frame listen_select "My sister is very {item}" over personality_adj -- course pool is
    funny/hardworking/shy/calm/talkative/friendly, all grammatical in the frame, no frame word collides with any candidate,
    options are Dari glosses so defect-1.22-safe), lesson03.translate.001 (Dari sentence prompt renders the gloss, answer
    render_frame "My brother is very {item}" over personality_adj -- deterministic per item since the prompt shows the gloss;
    frame deliberately uses brother, not neighbor, to stay distinct from order.005), and lesson04.translate.001 (bare-word
    Dari-metalanguage variant over personality_adj, differs from translate.004 in frame text). All slots reuse tags already
    declared in tag_schema. Tiers now 3 recognition / 4 structured / 3 production live at unit scope.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - personality_adj
    - volume_prs_en_a1_unit42_item_01_single
slot_presets:
  personality_adj: &id001
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: personality_adj
