schema_version: "1.0"
pack_key: practice.prs-en.a1.unit42
source_language: prs
target_language: en
unit_content_key: en.a1.unit42.personality
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11 by the prs-en depth-extension worker, same pass
    as unit30-41 -- the last unit in this depth-extension batch
    (units 30-42), closing the gap a depth audit found between
    existing practice-pool coverage (units 1-29) and prs-en's authored
    content (units 1-69). Single tag: 6-member 'personality_adj'
    (friendly/funny/hardworking/shy/calm/talkative -- "friendly"
    already classified since unit32, reused additively), verified all
    six fit "My neighbor is very {item}." EN_POS/en_agreement_tags
    added to scripts/_en_target_lexeme_common.py as part of this pass;
    matching_pairs uses the first 4 (funny/hardworking/shy/calm).
    Anchoring check: lesson01 introduces new lexemes, safe as an
    anchor. Every slot's real candidate count verified with
    scripts/_practice_slot_check.py. Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [personality_adj]
slot_presets:
  personality_adj: &personality_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: personality_adj}}
templates:
  - content_key: practice.prs-en.en.a1.unit42.lesson01.choose.001
    lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *personality_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit42.lesson01.listen.002
    lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *personality_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit42.lesson01.match.003
    lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *personality_adj, second: *personality_adj, third: *personality_adj, fourth: *personality_adj}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر صفت شخصیت را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit42.lesson01.translate.004
    lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *personality_adj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی همی صفت شخصیت {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit42.lesson01.order.005
    lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
    type: word_order
    frame: {text: "My neighbor is very {item}", language_code: en, direction: ltr}
    slots: {item: *personality_adj}
    answer_derivation: {kind: render_frame, frame: {text: "My neighbor is very {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} صفتی است که ذکر شد.", language_code: prs, direction: rtl}