schema_version: '1.0'
pack_key: practice.prs-en.a1.unit43
source_language: prs
target_language: en
unit_content_key: en.a1.unit43.colors
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-12 as an additive Endless Practice coverage backfill for prs-en A1 unit 43. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-24 (tier-thinness + POS-only matching_pairs pass): the dispatched POS-only matching_pairs defect
    (match.002, volume_match.006) could NOT be converted to a semantic union -- every one of this unit's 25 lexemes
    carries ZERO semantic tags (verified via backfill_lexemes_prs_en.iter_specs(); the unit43+ coverage-backfill band
    never got tag classification), and packs cannot add lexeme tags. Partial mitigation applied instead: both matching
    templates narrowed from the full 9-POS list to content words [noun, verb, adjective] (22 unit-scope tokens, floor
    safe), which at least keeps function words like our/everything/especially out of the pairs; they remain POS-only at
    course scope -- LOGGED for the coordinator as a tag-backfill follow-up. Tier-thinness: added lesson03.choose.001
    (multiple_choice) and lesson04.translate.001 (bare-word translation), both over a part_of_speech noun pool (8 unit
    tokens, 8 distinct glosses, recipe 3.1c -- bare-word frames, so no course-scope grammaticality exposure), bringing
    recognition and production to 3 live each. The structured tier is left honestly thin at 2 live for the same
    no-tags reason: a third matching_pairs would replicate the POS-only defect, no single-member anchor tag exists for
    fill_in_blank, and no word_order frame can be grammatical over a bare-POS pool at course scope.

    RE-ANCHOR + THIN-TIER FIX (2026-07-26, polish wave 3): commit 05af7ace closed the blocker the note above logged --
    prs-en now carries a generated unit-wide tag (prs_en_a1_unit43_words, 22 distinct content tokens over [noun, verb,
    adjective], first-introduction-only) plus per-lesson tags. match.002 and volume_match.006 re-anchored from bare
    part_of_speech [noun, verb, adjective] (course-scope pool = every content word in the level) to `semantic:
    prs_en_a1_unit43_words` + the same POS filter: unit pool unchanged (still the 22-token union, since the old
    bare-POS pool was already effectively unit-wide), course-scope extras now 0. Both widened from 4 to the recipe's
    6-pair standard (SS16) at the same time -- pool comfortably covers it. Structured-tier thinness resolved with a
    new lesson04.match.004 (three_friends_three_favorite_colors), `semantic: prs_en_a1_unit43_lesson04_words` +
    [noun, verb, adjective]: the lesson tag alone yields exactly 6 distinct tokens/glosses (gardens/beautiful/reminds/
    agree/everyday/conversations, "especially" excluded by the POS filter), clearing the floor without borrowing the
    unit-wide union, distinct pool from its match.002/volume_match.006 siblings, and gives lesson04 its first
    structured-tier template. Structured tier now 3 live. Checked all three pools' glosses via pool_check.py -- 0
    exact-duplicate glosses in any of the three; kept.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic: [prs_en_a1_unit43_words, prs_en_a1_unit43_lesson04_words]
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
