schema_version: "1.0"
pack_key: practice.prs-en.a1.unit22
source_language: prs
target_language: en
unit_content_key: en.a1.unit22.health
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending prs-en's practice
    pool to units 21-26. Uses fa-en's a1_unit22.yaml as the structural
    reference: the shared 4-member 'symptom_noun' tag (headache/
    stomachache/fever/cough, defined in scripts/
    _en_target_lexeme_common.py) is verified safe for a generative
    "I have a {item}." frame -- all four genuinely collocate with that
    exact shape in the real content. "sore throat" (a two-word compound)
    is deliberately excluded from the tag, same as fa-en/nl-en's own
    reasoning. No new EN_POS/agreement_tags entries were needed; only
    scripts/backfill_lexemes_prs_en.py's Dari gloss dict and UNIT_FILES
    tuple were extended (including "drink", introduced in this unit as a
    verb distinct from unit07's food/drink nouns). Dari phrasing
    cross-checked against docs/content/overlays/prs-en/a1_unit22.yaml's
    own real text (سردردی/معده‌درد/تب/سرفه/گلودردی), informal Afghan
    register (کنین/استین/می‌شه), not a find-replace of fa-en's Farsi.

    Anchoring check (same discipline as a1_unit21.yaml): verified via
    iter_specs() that every one of this unit's four lessons introduces
    at least one new lexeme, so all four are safe lesson_content_key
    anchors -- no zero-new-lexeme lesson like unit23's lesson02 exists in
    this unit.

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover prs-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    the matching_pairs template widened from 2 to 4 slots (the full
    course-wide symptom_noun pool: headache/stomachache/fever/cough),
    per the pre-computed retrofit table.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [symptom_noun]
slot_presets:
  symptom_noun: &symptom_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: symptom_noun}}
templates:
  - content_key: practice.prs-en.en.a1.unit22.lesson01.choose.001
    lesson_content_key: en.a1.unit22.lesson01.common_symptoms
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson01.listen.002
    lesson_content_key: en.a1.unit22.lesson01.common_symptoms
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson01.match.003
    lesson_content_key: en.a1.unit22.lesson01.common_symptoms
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *symptom_noun, second: *symptom_noun, third: *symptom_noun, fourth: *symptom_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر علامت را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson01.translate.004
    lesson_content_key: en.a1.unit22.lesson01.common_symptoms
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این علامت {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson02.order.001
    lesson_content_key: en.a1.unit22.lesson02.saying_whats_wrong
    type: word_order
    frame: {text: "I have a {item}", language_code: en, direction: ltr}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: render_frame, frame: {text: "I have a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} علامتی است که ذکر شد.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson02.complete.002
    lesson_content_key: en.a1.unit22.lesson02.saying_whats_wrong
    type: fill_in_blank
    frame:
      text: "I have a {item}."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "جملهٔ انگلیسی را کامل کنین.", language_code: prs, direction: rtl}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} همی جمله را کامل می‌کنه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson02.translate.003
    lesson_content_key: en.a1.unit22.lesson02.saying_whats_wrong
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این علامت {item} است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson03.choose.001
    lesson_content_key: en.a1.unit22.lesson03.reading_health_advice
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson03.order.002
    lesson_content_key: en.a1.unit22.lesson03.reading_health_advice
    type: word_order
    frame: {text: "I have a {item}", language_code: en, direction: ltr}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: render_frame, frame: {text: "I have a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} علامتی است که ذکر شد.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson04.listen.001
    lesson_content_key: en.a1.unit22.lesson04.feeling_sick_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که در همی گفتگو شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit22.lesson04.translate.002
    lesson_content_key: en.a1.unit22.lesson04.feeling_sick_dialogue
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این علامت {item} است.", language_code: prs, direction: rtl}
