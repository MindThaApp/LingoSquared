schema_version: '1.0'
pack_key: practice.prs-en.b1.unit01
source_language: prs
target_language: en
unit_content_key: en.b1.unit01.necessity
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. Unit lexeme pool measured
    with the f".b1.unit01." filter (backfill_lexemes_prs_en.py): 76 unit lexemes across 4 lesson(s) with
    lexemes; 43 of them survive the content-word filter (part_of_speech not in [''particle'', ''preposition'',
    ''pronoun'', ''proper_noun'', ''symbol''], and excluding function/auxiliary tokens whose english_gloss
    is a parenthetical grammar note rather than a clean translation: [''a'', ''an'', ''and'', ''by'',
    ''did'', ''do'', ''does'', "don''t", ''has'', ''have'', ''if'', ''not'', ''on'', ''or'', ''that'',
    ''the'', ''this'', ''to''] where present) with 42 distinct english_gloss values. No agreement_tags.semantic
    exist on this direction''s lexemes for this unit (all None at classification time), so every slot
    is intentionally UNTAGGED (agreement_tags omitted) and constrained only by language_code+part_of_speech
    -- per recipe SS3.1(c) this is a legal constraint, and because generate_checkpoint() restricts _material()
    to this unit''s own lesson ids before any slot filter runs, the untagged pool is unit-scoped at checkpoint
    time (equivalent to unioning every lesson''s tokens) even though it widens to the whole A1 course
    at Endless-Practice scope. word_order and fill_in_blank were deliberately NOT authored: without a
    semantic tag there is no way to pin a single-member anchor or to hand-verify (recipe SS1.1/SS9 step
    5) that every course-wide candidate of an untagged slot stays grammatical inside a literal sentence
    frame, and getting that wrong is the recipe''s #1 flagged defect class. matching_pairs (no framing-grammaticality
    requirement, only a >=6-distinct-token floor) was used for the structured tier instead, anchored to
    the richest lesson(s). Recommend a follow-up backfill pass adding semantic tags to this unit so word_order/fill_in_blank
    can be added safely.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
