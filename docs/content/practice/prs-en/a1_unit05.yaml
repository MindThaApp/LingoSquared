schema_version: "1.0"
pack_key: practice.prs-en.a1.unit05
source_language: prs
target_language: en
unit_content_key: en.a1.unit05.time
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). Mirrors the sibling fa-en/a1_unit05.yaml
    pack's reasoning: clock-time function words (o'clock/half/quarter/
    past/to) are deliberately NOT used as slot values (fixed
    time-telling vocabulary, not an interchangeable pool). Reuses the
    existing day_part (4-member, bare-word recognition) and day_part_in
    (narrower 3-member, safe for an "at nine in the {item}" frame) tags
    from scripts/_en_target_lexeme_common.py -- only Dari glosses were
    needed in scripts/backfill_lexemes_prs_en.py. Verified with
    scripts/_practice_slot_check.py that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct
    candidate values.

    Fresh-context review, 2026-07-06 (separate session, zero access to
    the authoring reasoning above): confirmed both lesson_content_key
    values used (lesson03/lesson04) match real en.a1.unit05.time
    lessons -- lessons 01/02 (o'clock_and_half, quarter_times) are
    intentionally not covered by any template, consistent with this
    pack's own stated reasoning, not a gap. Re-scanned for Pashto-only
    letters/number words -- none found. Hand-rendered every possible
    sentence: day_part_in's 3 members (morning/afternoon/evening,
    "night" correctly excluded since English says "at night" not "in
    the night") all fit "The store opens at nine in the {item}."/"It
    closes at six in the {item}." naturally. No self-reference, no
    agreement errors. Upgraded to reviewed: genuinely clean.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    daypart_pair widened from 2 to 4 slots (the full course-wide day_part
    noun pool), per the pre-computed retrofit table.

    Depth pass, 2026-07-07 (templates-per-unit density audit: prs-en
    unit05 was the single thinnest unit in the whole direction at only 5
    templates -- lessons01/02, o'clock_and_half and quarter_times, had
    ZERO templates at all, deliberately, since this pack's own original
    reasoning treats o'clock/half/quarter/past/to as fixed function words,
    not an interchangeable pool). Added 9 new templates, all real
    vocabulary, none of it invented: the real, already-taught NUMBERS
    inside these clock phrases (three/five in lesson01; four/ten in
    lesson02) are genuinely fillable via the already-established
    hour_number tag in scripts/_en_target_lexeme_common.py (one through
    twelve, POS noun, explicitly documented there as safe for exactly this
    "It's {item} o'clock."/clock-hour use case, first defined for a
    different unit's frame but reused here for its intended purpose, not
    an A1/A2 boundary crossing -- see AUTHORING_GUIDE.md #18). lesson01
    gained hour_gloss (multiple_choice), hour_listen (listen_select),
    hour_translate (translation), hour_order (word_order, "It's {item}
    o'clock" -- verified grammatical for all 12 hour_number members), and
    hour_pair (matching_pairs, all 12 hour_number members, per
    AUTHORING_GUIDE.md #16). lesson02 gained ten_past_order and
    quarter_to_order (word_order, "It's ten past {item}"/"It's a quarter
    to {item}" -- both hand-verified grammatical for all 12 hour_number
    members). Separately, this pack's own tag_schema/slot_presets already
    defined day_part_in (afternoon/evening/morning, deliberately excluding
    night) specifically for the store/library open-close sentences, per
    this pack's own prior review note -- but no template ever actually
    used it until now. lesson03 gained store_open_order (word_order, "The
    store opens at nine in the {item}.") and lesson04 gained
    library_close_order (word_order, "It closes at six in the {item}.")
    -- word_order deliberately chosen over fill_in_blank here, since a
    bare fill_in_blank slot on day_part_in would be genuinely ambiguous
    (afternoon/evening/morning are all grammatically valid in that frame,
    and unlike a true-synonym pair they are NOT interchangeable -- only
    one is the real taught fact, so marking `interchangeable: true` would
    be wrong); word_order has no such floor/ambiguity risk since the
    learner reorders one concretely-generated instance. No new semantic
    tags added to scripts/_en_target_lexeme_common.py -- hour_number and
    day_part_in both already existed; only this pack's own tag_schema/
    slot_presets needed the new hour_number alias. Verified with
    scripts/_practice_slot_check.py (hour_number: 12 distinct A1
    candidates, day_part_in: 3, both well above the relevant floors) and
    compile_content.py practice-validate, 0 errors/0 warnings. No
    fill_in_blank templates added, so scripts/_fill_in_blank_ambiguity_
    check.py has nothing new to flag in this pack. Still carries this
    pack's own fresh-context review status from before this pass -- a
    fresh re-review of specifically these 9 new templates has not
    happened yet.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [day_part, day_part_in, hour_number]
slot_presets:
  day_part: &day_part {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part}}
  day_part_in: &day_part_in {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part_in}}
  hour_number: &hour_number {language_code: en, part_of_speech: noun, agreement_tags: {semantic: hour_number}}
templates:
  - content_key: practice.prs-en.en.a1.unit05.lesson01.hour_gloss.001
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنای دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.hour_listen.002
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "عددی که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.hour_translate.003
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *hour_number}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این عدد است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.hour_order.004
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: word_order
    frame: {text: "It's {item} o'clock", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "It's {item} o'clock", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} عددِ ساعت در همی جمله است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.hour_pair.005
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: matching_pairs
    frame: {text: "{hour_one} — {hour_two}", language_code: en, direction: ltr}
    slots: {hour_one: *hour_number, hour_two: *hour_number, hour_three: *hour_number, hour_four: *hour_number, hour_five: *hour_number, hour_six: *hour_number, hour_seven: *hour_number, hour_eight: *hour_number, hour_nine: *hour_number, hour_ten: *hour_number, hour_eleven: *hour_number, hour_twelve: *hour_number}
    slot_relations: [{kind: distinct, slots: [hour_one, hour_two, hour_three, hour_four, hour_five, hour_six, hour_seven, hour_eight, hour_nine, hour_ten, hour_eleven, hour_twelve]}]
    answer_derivation: {kind: matching_pairs, slots: [hour_one, hour_two, hour_three, hour_four, hour_five, hour_six, hour_seven, hour_eight, hour_nine, hour_ten, hour_eleven, hour_twelve]}
    feedback_frame: {text: "هر عدد را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson02.ten_past_order.001
    lesson_content_key: en.a1.unit05.lesson02.quarter_times
    type: word_order
    frame: {text: "It's ten past {item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "It's ten past {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} عددِ ساعت در همی جمله است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson02.quarter_to_order.002
    lesson_content_key: en.a1.unit05.lesson02.quarter_times
    type: word_order
    frame: {text: "It's a quarter to {item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "It's a quarter to {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} عددِ ساعت در همی جمله است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.daypart_gloss.001
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: multiple_choice
    frame: {text: "{day_part}", language_code: en, direction: ltr}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_gloss, slot: day_part}
    feedback_frame: {text: "معنای دری {day_part} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.daypart_listen.002
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: listen_select
    frame: {text: "{day_part}", language_code: en, direction: ltr}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_gloss, slot: day_part}
    feedback_frame: {text: "بخشی از روز که شنیدین {day_part} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.daypart_pair.003
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: matching_pairs
    frame: {text: "{day_part_one} — {day_part_two}", language_code: en, direction: ltr}
    slots: {day_part_one: *day_part, day_part_two: *day_part, day_part_three: *day_part, day_part_four: *day_part}
    slot_relations: [{kind: distinct, slots: [day_part_one, day_part_two, day_part_three, day_part_four]}]
    answer_derivation: {kind: matching_pairs, slots: [day_part_one, day_part_two, day_part_three, day_part_four]}
    feedback_frame: {text: "هر بخش از روز را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.store_open_order.004
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: word_order
    frame: {text: "The store opens at nine in the {item}.", language_code: en, direction: ltr}
    slots: {item: *day_part_in}
    answer_derivation: {kind: render_frame, frame: {text: "The store opens at nine in the {item}.", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} بخشی از روز در همی جمله است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson04.daypart_listen.001
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: listen_select
    frame: {text: "{day_part}", language_code: en, direction: ltr}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_gloss, slot: day_part}
    feedback_frame: {text: "بخشی از روز که در این گفتگو شنیدین {day_part} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson04.daypart_translate.003
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: translation
    frame: {text: "{day_part}", language_code: prs, direction: rtl, slot_rendering: {day_part: english_gloss}}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_text, slot: day_part}
    feedback_frame: {text: "{day_part} معادل انگلیسی این بخش از روز است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson04.library_close_order.004
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: word_order
    frame: {text: "It closes at six in the {item}.", language_code: en, direction: ltr}
    slots: {item: *day_part_in}
    answer_derivation: {kind: render_frame, frame: {text: "It closes at six in the {item}.", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} بخشی از روز در همی جمله است.", language_code: prs, direction: rtl}
