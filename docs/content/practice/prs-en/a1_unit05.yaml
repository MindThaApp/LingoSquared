schema_version: "1.0"
pack_key: practice.prs-en.a1.unit05
source_language: prs
target_language: en
unit_content_key: en.a1.unit05.time
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). Mirrors the sibling fa-en/a1_unit05.yaml
    pack's reasoning: clock-time function words (o'clock/half/quarter/
    past/to) are deliberately NOT used as slot values (fixed
    time-telling vocabulary, not an interchangeable pool). Reuses the
    existing day_part (4-member, bare-word recognition) and day_part_in
    (narrower 3-member, safe for an "at nine in the {item}" frame) tags
    from scripts/_en_target_lexeme_common.py -- only Dari glosses were
    needed in scripts/backfill_lexemes_prs_en.py. Verified with
    scripts/_practice_slot_check.py that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct
    candidate values.

    Fresh-context review, 2026-07-06 (separate session, zero access to
    the authoring reasoning above): confirmed both lesson_content_key
    values used (lesson03/lesson04) match real en.a1.unit05.time
    lessons -- lessons 01/02 (o'clock_and_half, quarter_times) are
    intentionally not covered by any template, consistent with this
    pack's own stated reasoning, not a gap. Re-scanned for Pashto-only
    letters/number words -- none found. Hand-rendered every possible
    sentence: day_part_in's 3 members (morning/afternoon/evening,
    "night" correctly excluded since English says "at night" not "in
    the night") all fit "The store opens at nine in the {item}."/"It
    closes at six in the {item}." naturally. No self-reference, no
    agreement errors. Upgraded to reviewed: genuinely clean.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    daypart_pair widened from 2 to 4 slots (the full course-wide day_part
    noun pool), per the pre-computed retrofit table.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [day_part, day_part_in]
slot_presets:
  day_part: &day_part {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part}}
  day_part_in: &day_part_in {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part_in}}
templates:
  - content_key: practice.prs-en.en.a1.unit05.lesson03.daypart_gloss.001
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: multiple_choice
    frame: {text: "{day_part}", language_code: en, direction: ltr}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_gloss, slot: day_part}
    feedback_frame: {text: "معنای دری {day_part} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.daypart_listen.002
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: listen_select
    frame: {text: "{day_part}", language_code: en, direction: ltr}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_gloss, slot: day_part}
    feedback_frame: {text: "بخشی از روز که شنیدین {day_part} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.daypart_pair.003
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: matching_pairs
    frame: {text: "{day_part_one} — {day_part_two}", language_code: en, direction: ltr}
    slots: {day_part_one: *day_part, day_part_two: *day_part, day_part_three: *day_part, day_part_four: *day_part}
    slot_relations: [{kind: distinct, slots: [day_part_one, day_part_two, day_part_three, day_part_four]}]
    answer_derivation: {kind: matching_pairs, slots: [day_part_one, day_part_two, day_part_three, day_part_four]}
    feedback_frame: {text: "هر بخش از روز را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson03.open_fill.004
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: fill_in_blank
    frame: {text: "The store opens at nine in the {day_part_in}.", language_code: en, direction: ltr}
    slots: {day_part_in: *day_part_in}
    answer_derivation: {kind: slot_text, slot: day_part_in}
    feedback_frame: {text: "{day_part_in} این جمله را دربارهٔ وخت باز شدن دکان کامل می‌کنه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson04.daypart_listen.001
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: listen_select
    frame: {text: "{day_part}", language_code: en, direction: ltr}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_gloss, slot: day_part}
    feedback_frame: {text: "بخشی از روز که در این گفتگو شنیدین {day_part} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson04.close_fill.002
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: fill_in_blank
    frame: {text: "It closes at six in the {day_part_in}.", language_code: en, direction: ltr}
    slots: {day_part_in: *day_part_in}
    answer_derivation: {kind: slot_text, slot: day_part_in}
    feedback_frame: {text: "{day_part_in} این جمله را دربارهٔ وخت بند شدن کتابخانه کامل می‌کنه.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson04.daypart_translate.003
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: translation
    frame: {text: "{day_part}", language_code: prs, direction: rtl, slot_rendering: {day_part: english_gloss}}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_text, slot: day_part}
    feedback_frame: {text: "{day_part} معادل انگلیسی این بخش از روز است.", language_code: prs, direction: rtl}
