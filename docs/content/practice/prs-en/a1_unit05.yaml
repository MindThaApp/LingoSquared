schema_version: "1.0"
pack_key: practice.prs-en.a1.unit05
source_language: prs
target_language: en
unit_content_key: en.a1.unit05.time
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). Mirrors the sibling fa-en/a1_unit05.yaml
    pack's reasoning: clock-time function words (o'clock/half/quarter/
    past/to) are deliberately NOT used as slot values (fixed
    time-telling vocabulary, not an interchangeable pool). Reuses the
    existing day_part (4-member, bare-word recognition) and day_part_in
    (narrower 3-member, safe for an "at nine in the {item}" frame) tags
    from scripts/_en_target_lexeme_common.py -- only Dari glosses were
    needed in scripts/backfill_lexemes_prs_en.py. Verified with
    scripts/_practice_slot_check.py that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct
    candidate values.

    Fresh-context review, 2026-07-06 (separate session, zero access to
    the authoring reasoning above): confirmed both lesson_content_key
    values used (lesson03/lesson04) match real en.a1.unit05.time
    lessons -- lessons 01/02 (o'clock_and_half, quarter_times) are
    intentionally not covered by any template, consistent with this
    pack's own stated reasoning, not a gap. Re-scanned for Pashto-only
    letters/number words -- none found. Hand-rendered every possible
    sentence: day_part_in's 3 members (morning/afternoon/evening,
    "night" correctly excluded since English says "at night" not "in
    the night") all fit "The store opens at nine in the {item}."/"It
    closes at six in the {item}." naturally. No self-reference, no
    agreement errors. Upgraded to reviewed: genuinely clean.

    matching_pairs widening retrofit (2026-07-06, AUTHORING_GUIDE.md #16):
    daypart_pair widened from 2 to 4 slots (the full course-wide day_part
    noun pool), per the pre-computed retrofit table.

    Depth pass, 2026-07-07 (templates-per-unit density audit: prs-en
    unit05 was the single thinnest unit in the whole direction at only 5
    templates -- lessons01/02, o'clock_and_half and quarter_times, had
    ZERO templates at all, deliberately, since this pack's own original
    reasoning treats o'clock/half/quarter/past/to as fixed function words,
    not an interchangeable pool). Added 9 new templates, all real
    vocabulary, none of it invented: the real, already-taught NUMBERS
    inside these clock phrases (three/five in lesson01; four/ten in
    lesson02) are genuinely fillable via the already-established
    hour_number tag in scripts/_en_target_lexeme_common.py (one through
    twelve, POS noun, explicitly documented there as safe for exactly this
    "It's {item} o'clock."/clock-hour use case, first defined for a
    different unit's frame but reused here for its intended purpose, not
    an A1/A2 boundary crossing -- see AUTHORING_GUIDE.md #18). lesson01
    gained hour_gloss (multiple_choice), hour_listen (listen_select),
    hour_translate (translation), hour_order (word_order, "It's {item}
    o'clock" -- verified grammatical for all 12 hour_number members), and
    hour_pair (matching_pairs, all 12 hour_number members, per
    AUTHORING_GUIDE.md #16). lesson02 gained ten_past_order and
    quarter_to_order (word_order, "It's ten past {item}"/"It's a quarter
    to {item}" -- both hand-verified grammatical for all 12 hour_number
    members). Separately, this pack's own tag_schema/slot_presets already
    defined day_part_in (afternoon/evening/morning, deliberately excluding
    night) specifically for the store/library open-close sentences, per
    this pack's own prior review note -- but no template ever actually
    used it until now. lesson03 gained store_open_order (word_order, "The
    store opens at nine in the {item}.") and lesson04 gained
    library_close_order (word_order, "It closes at six in the {item}.")
    -- word_order deliberately chosen over fill_in_blank here, since a
    bare fill_in_blank slot on day_part_in would be genuinely ambiguous
    (afternoon/evening/morning are all grammatically valid in that frame,
    and unlike a true-synonym pair they are NOT interchangeable -- only
    one is the real taught fact, so marking `interchangeable: true` would
    be wrong); word_order has no such floor/ambiguity risk since the
    learner reorders one concretely-generated instance. No new semantic
    tags added to scripts/_en_target_lexeme_common.py -- hour_number and
    day_part_in both already existed; only this pack's own tag_schema/
    slot_presets needed the new hour_number alias. Verified with scripts/
    _practice_slot_check.py (hour_number: 12 distinct A1
    candidates, day_part_in: 3, both well above the relevant floors) and
    compile_content.py practice-validate, 0 errors/0 warnings. No
    fill_in_blank templates added, so scripts/_fill_in_blank_ambiguity_
    check.py has nothing new to flag in this pack. Still carries this
    pack's own fresh-context review status from before this pass -- a
    fresh re-review of specifically these 9 new templates has not
    happened yet.

    Unit-scope reauth pass (2026-07-24): scripts/_practice_unit_scope_check.py found 21 DEAD template-slots (10 of the
    14 templates above) and 3 more below the recognition floor -- only ONE template (daypart_translate, lesson04) was
    actually alive. Root cause, confirmed against scripts/backfill_lexemes_prs_en.py directly: hour_number is entirely
    unit03's own tag (zero_to_ten/eleven_to_hundred) -- unit05 introduces ZERO number tokens of its own -- and day_part_in
    is entirely unit01's own tag (morning/afternoon/evening, all from lesson01.everyday_greetings) -- unit05 introduces
    ZERO day_part_in tokens either ("night", unit05's only day-part word, was deliberately excluded from day_part_in by
    the very reasoning documented above, "at night" not "in the night"). Both "hour_number: 12 distinct A1 candidates"
    and "day_part_in: 3" in the depth-pass note above were measured course-wide by _practice_slot_check.py;
    generate_checkpoint() only ever sees unit05's own lexemes, which is 0 for both tags. This is the exact cross-unit-leak
    defect this reauth pass exists to catch, and unit05 turns out to be a genuinely thin, mostly-function-word unit (its
    real own vocabulary is exactly 6 nouns across all 4 lessons: time, o'clock, half, quarter, night, store -- everything
    else taught here, "past"/"in"/"closes"/"does"/"close", is an untagged preposition or verb).

    Full redesign, pack-only, no backfill/realization edits, following the recipe's SS8.1 grammar-unit pattern (anchor
    per lesson, pool across the unit): a new untagged unit_noun preset (part_of_speech noun, no semantic tag -- SS3.1c)
    pools all 6 of unit05's own nouns; this is safe for every bare-word ({item}, no literal text) multiple_choice/
    listen_select/translation/matching_pairs template regardless of how large the pool grows at course scope, since
    none of these types has a grammaticality requirement. lesson01 and lesson02 -- whose own tokens (time/o'clock/half/
    past/quarter) carry no semantic tag at all and can host no other template -- each gained a full MC+listen+translate+
    matching_pairs quartet over unit_noun (unit_gloss/unit_listen/unit_translate/vocab_pair), giving every lesson real
    recognition, production, AND structured tier coverage even though two of the four lessons introduce no tagged
    vocabulary of their own. lesson03's daypart_gloss/daypart_listen were re-anchored in place from day_part (0
    unit-scoped candidates) to unit_noun and renamed vocab_gloss/vocab_listen; a new vocab_translate was added for its
    production tier. lesson04's daypart_listen was re-anchored to unit_noun (renamed vocab_listen) and daypart_translate
    was widened from day_part (1 candidate: "night") to unit_noun (6 candidates), renamed vocab_translate. daypart_pair
    (lesson03, matching_pairs over day_part, DEAD -- needed 4 had 1) was dropped as redundant once lesson01/02 each got
    their own unit_noun matching_pairs.

    The three number-dependent word_order frames (hour_order "It's {item} o'clock", ten_past_order "It's ten past
    {item}", quarter_to_order "It's a quarter to {item}") and hour_pair (12-slot matching_pairs) were DROPPED outright --
    unit05 has no numeral vocabulary of its own to re-anchor them to (see root cause above), and inventing a new
    single-member backfill tag is out of this pack-only task's scope. In their place, two NEW word_order templates use
    unit05's own two genuinely tagged nouns: lesson03's store_open_order (day_part_in, DEAD) was repurposed as
    greeting_time_order, frame "Good {item}." over the time_period tag ("night" is unit05's own token here; course-wide
    time_period = morning/afternoon/evening/day/night, hand-checked "Good morning/afternoon/evening/day/night" are all
    standard idiomatic English, the identical safe pattern already shipped in this direction's a1_unit01.yaml
    lesson01.time_order template). lesson04's library_close_order (day_part_in, DEAD) was repurposed as
    place_query_order, frame "Where is the {item}?" over the neighborhood_noun tag ("store" is unit05's own token;
    course-wide neighborhood_noun = store/park/street/neighbor, all four hand-checked grammatical as a definite-reference
    question). Both frames were re-checked for defect 1.14 self-reference: neither "Good"/"Where is the" contains any
    course-wide candidate value of its own slot.

    Net result: 15 templates (up from 14), all four lessons carry real recognition + structured + production coverage
    (lesson04's recognition tier is listen_select-only, no MC, since 6-candidate unit_noun MC already exists at lesson03
    and adding a near-duplicate at lesson04 would add no real value). tag_schema narrowed to [time_period,
    neighborhood_noun] -- hour_number and day_part_in removed (no longer referenced anywhere in this file). Verified:
    scripts/_practice_unit_scope_check.py now reports 0 DEAD and 0 below-floor for this pack; compile_content.py
    practice-validate 0 errors; scripts/check_dari_register.py no new findings (every Dari string reuses this
    direction's own established feedback-text patterns, changed only in the topic noun). Still left unreviewed pending
    a separate fresh-context review pass, per standing project policy -- unchanged from before this pass, but note the
    review above from 2026-07-06 was for the OLD template set and no longer describes what ships here.

    Polish wave 2 (2026-07-24): dispatched for POS-only matching_pairs (vocab_pair.004, lesson01 and lesson02). Left
    POS-only DELIBERATELY per the polish rubric's honest-thin rule: unit05's own lexemes carry exactly TWO semantically
    tagged tokens (night=time_period/day_part, store=neighborhood_noun -- re-confirmed against
    backfill_lexemes_prs_en.iter_specs()), so no union of unit-native semantic tags can reach the 6-distinct-token
    matching floor; adding tags is out of pack-only scope, and a wrong union is worse than the status quo. The untagged
    unit_noun pool (6 unit-scoped nouns, this file's SS3.1c redesign above) stays.

    Polish wave 3 (2026-07-26): the wave-2 blocker above is RESOLVED -- commit 05af7ace generated unit-scoped semantic
    tags in backfill_lexemes_prs_en. Re-anchored both dispatched matchers (lesson01.vocab_pair.004 and
    lesson02.vocab_pair.004) from the untagged unit_noun pool to a new unit_tag_noun preset (semantic:
    prs_en_a1_unit05_words + part_of_speech noun). Unit-scope pool is the identical 6 nouns
    (time/o'clock/half/quarter/night/store, glosses re-read, all distinct), but course scope now equals unit scope, so
    Endless Practice no longer pulls off-theme course-wide nouns into these pairs. POS kept at noun (not the tag's full
    9-token noun+verb pool) to exclude "does" (metalanguage gloss: an auxiliary-verb description, not a matchable
    meaning) and the confusable close/closes gloss pair. Non-dispatched unit_noun templates (bare-word MC/listen/
    translate, no course-scope grammaticality or theming risk) left as-is.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [time_period, neighborhood_noun, prs_en_a1_unit05_words]
slot_presets:
  unit_noun: &unit_noun {language_code: en, part_of_speech: noun, agreement_tags: {}}
  unit_tag_noun: &unit_tag_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: prs_en_a1_unit05_words}}
  time_period: &time_period {language_code: en, part_of_speech: noun, agreement_tags: {semantic: time_period}}
  neighborhood_noun: &neighborhood_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: neighborhood_noun}}
templates:
  - content_key: practice.prs-en.en.a1.unit05.lesson01.unit_gloss.001
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنای دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.unit_listen.002
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدین {item} بود.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.unit_translate.003
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit05.lesson01.vocab_pair.004
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: matching_pairs
    frame: {text: "این واژه‌های انگلیسی را به معنای دری‌شان وصل کنین.", language_code: prs, direction: rtl}
    slots: {word_one: *unit_tag_noun, word_two: *unit_tag_noun, word_three: *unit_tag_noun, word_four: *unit_tag_noun, word_five: *unit_tag_noun, word_six: *unit_tag_noun}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "هر واژه را به معنای دری خودش وصل کنین.", language_code: prs, direction: rtl}
