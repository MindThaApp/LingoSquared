- content_key: practice.prs-en.en.b1.unit15.lesson01.choose.001
  lesson_content_key: en.b1.unit15.lesson01.complaints_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
        - noun
        - verb
        - adjective
        - adverb
        - preposition
        - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.b1.unit15.lesson01.listen.002
