schema_version: '1.0'
pack_key: practice.prs-en.b1.unit15
source_language: prs
target_language: en
unit_content_key: en.b1.unit15.complaints
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Generated for the prs-en X->en direction (Dari L1, tested content is English). Follows the established prs-en Endless-Practice pattern (a1_unit45.yaml): bare-{item} frames with untagged slots (language_code: en + part_of_speech in [noun, verb, adjective, adverb, preposition, phrase], no semantic tag) so every slot draws on the WHOLE unit lexeme pool at both unit and course scope, which is safe per PRACTICE_PACK_RECIPE.md SS3.1(c) because none of these frames carry literal English content text besides the {item} placeholder (or plain separators/dashes for matching_pairs). 4 templates per lesson x 4 lessons = 16 templates: multiple_choice + listen_select (recognition), matching_pairs x6 (structured), translation bare-word (production). listen_select is safe here because target_language=en has TTS configured. Measured capacity: 30 unit lexemes, 28 after excluding proper_noun/pronoun/particle/symbol, 28 distinct glosses -- comfortably clears the >=12 floor in every tier and the >=3 MC / >=6 matching_pairs floors. Excluded proper_noun (self-gloss risk, SS6.1), pronoun/particle (function words with no standalone meaning) from all slots. No word_order/fill_in_blank authored: no unit lexeme carries a semantic tag narrow enough to safely anchor a literal-text frame at COURSE scope (SS1.1), and matching_pairs alone clears the structured-tier floor. Feedback strings reused verbatim from the Dari-register exemplar a1_unit45.yaml.

    WAVE 3 (2026-07-26): generated per-unit/per-lesson semantic tags (backfill commit 05af7ace) now exist for this unit, closing the 'no semantic tag' gap flagged above for the 4 matching_pairs templates (recognition/production templates untouched, still deliberately untagged per the paragraph above). lesson01 -> prs_en_b1_unit15_lesson01_words (6 tok/6 gloss, exactly the floor), lesson02 -> prs_en_b1_unit15_lesson02_words (10/10), lesson03 -> prs_en_b1_unit15_lesson03_words (7/7). lesson04 alone is only 5 tok (below the 6-pair floor), so it unions lesson03+lesson04 tags (12 tok/12 gloss) rather than falling back to the full unit-wide tag: the unit-wide pool pairs lesson01's 'damaged' (gloss: خراب، آسیب‌دیده) with lesson03's 'broken' (gloss: خراب) -- both share the خراب root and are not reliably distinguishable to a learner (recipe SS3.1(b) exclusion technique). Dropped 'preposition' from the part_of_speech filter on all 4 (the generated tag never carries preposition members, so it was dead weight).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b1_unit15_lesson01_words
    - prs_en_b1_unit15_lesson02_words
    - prs_en_b1_unit15_lesson03_words
    - prs_en_b1_unit15_lesson04_words
