schema_version: '1.0'
pack_key: practice.prs-en.b2.unit05
source_language: prs
target_language: en
unit_content_key: en.b2.unit05.register
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 3 fixes -- tagged 12 item slots to the unit tag; translation limited to nouns+adjectives (removes verb writes leak and verb-gloss ambiguity); matching limited to lessons 2-4 (removes register/formal/formality overlap). NATIVE FLAGS: none beyond gloss flags. BACKFILL GLOSS FLAGS: writes gloss contains English; same=همرنگ wrong nuance; scheduling=وقت‌بندی (adj); formal/formality/stiff overlapping glosses; register/institution definition-style glosses. Prior note: Generated for the prs-en X->en direction (Dari L1, tested content is English). Follows the established prs-en Endless-Practice pattern (a1_unit45.yaml): bare-{item} frames with untagged slots (language_code: en + part_of_speech in [noun, verb, adjective, adverb, preposition, phrase], no semantic tag) so every slot draws on the WHOLE unit lexeme pool at both unit and course scope, which is safe per PRACTICE_PACK_RECIPE.md SS3.1(c) because none of these frames carry literal English content text besides the {item} placeholder (or plain separators/dashes for matching_pairs). 4 templates per lesson x 4 lessons = 16 templates: multiple_choice + listen_select (recognition), matching_pairs x6 (structured), translation bare-word (production). listen_select is safe here because target_language=en has TTS configured. Measured capacity: 43 unit lexemes, 37 after excluding proper_noun/pronoun/particle/symbol, 37 distinct glosses -- comfortably clears the >=12 floor in every tier and the >=3 MC / >=6 matching_pairs floors. Excluded proper_noun (self-gloss risk, SS6.1), pronoun/particle (function words with no standalone meaning) from all slots. No word_order/fill_in_blank authored: no unit lexeme carries a semantic tag narrow enough to safely anchor a literal-text frame at COURSE scope (SS1.1), and matching_pairs alone clears the structured-tier floor. Feedback strings reused verbatim from the Dari-register exemplar a1_unit45.yaml. Wave-3 (2026-07-26): commit 05af7ace added generated agreement_tags.semantic to backfill_lexemes_prs_en.py (prs_en_<unit>_words / prs_en_<unit>_lessonNN_words), resolving the blocker above for matching_pairs. Re-anchored all 4 POS-only matching_pairs slot bodies from the bare part_of_speech union to language_code + [noun, verb, adjective, adverb] + agreement_tags.semantic: prs_en_b2_unit05_words (unit-wide tag for all 4 lessons); declared the tag in tag_schema.agreement_tags.semantic. pool_check.py confirms 35 distinct unit tokens/glosses with zero course-scope extras (tags are unit-scoped by construction); manual gloss scan found no exact-duplicate or interchangeable-paraphrase glosses. Slot counts unchanged (all were already 6).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b2_unit05_words
    - prs_en_b2_unit05_lesson02_words
    - prs_en_b2_unit05_lesson03_words
    - prs_en_b2_unit05_lesson04_words
