unit_content_key: en.a1.unit66.pharmacy_symptoms
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-23; extended 2026-07-24 (polish wave 2, tier-thinness). The prs-en lexeme backfill
    now carries far more lexemes for this unit than at first authoring (17 matching the new slots'' content
    POS at unit scope, mostly part_of_speech phrase), so the structured tier is now viable. Added 2 matching_pairs
    (untagged unit-wide content pool, anchored to lesson02 -- previously template-less -- and lesson03)
    and 1 word_order with a bare ''{item}'' frame over the unit''s phrase lexemes (no literal frame text,
    so every course-scope candidate is trivially grammatical in its own frame and self-reference is impossible;
    precedent en-fa a1_unit37 lesson03.order.004), plus a bare translation whose pool adds phrase POS,
    anchored to lesson04 (pharmacy_note, previously template-less). matching/translation POS [adjective, noun, verb, phrase]. HONEST-THIN/POS-ONLY
    NOTE (SUPERSEDED, see POLISH WAVE 3 below): backfill_lexemes_prs_en.py at authoring time carried no usable
    agreement_tags.semantic for this unit''s lexemes, so every slot stayed POS-only (recipe SS3.1(c); direction
    precedent a1_unit48/56/58/61) -- at Endless-Practice COURSE scope the matching_pairs pools therefore drew
    off-theme A1-wide cards. The lesson04 reading-note mega-phrase is in the phrase
    pool, so it can surface as a long matching card, a long word_order bank, or an exact-typing translation
    answer -- accepted, same situation as a1_unit48-61. word_order/fill_in_blank with literal frame text
    remain unauthored (unsafe with untagged slots at course scope); fill_in_blank is impossible without
    a single-member anchor tag.

    POLISH WAVE 3 (2026-07-26): commit 05af7ace added generated per-unit/per-lesson semantic tags
    (prs_en_a1_unit66_words / prs_en_a1_unit66_lessonNN_words, unit-scoped by construction so course-wide
    pool == unit pool). Re-anchored both matching_pairs to their own lesson tag instead of the unit-wide
    tag, since each clears the 6-pair floor alone and this also makes the two pools genuinely distinct
    (previously both were POS-only and drew the identical 17-token unit pool): lesson02.match.001 ->
    prs_en_a1_unit66_lesson02_words (6 phrase tokens, exact floor, all distinct glosses); lesson03.match.001
    -> prs_en_a1_unit66_lesson03_words (8 tokens: worse + 7 phrases, all distinct glosses). The off-theme
    course-scope pull the honest-thin note above described is now resolved. word_order stays bare
    ''{item}''/phrase-POS-only per this wave''s dispatch (no literal frame text, self-reference-safe by
    construction); left untouched.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_a1_unit66_lesson02_words
    - prs_en_a1_unit66_lesson03_words
