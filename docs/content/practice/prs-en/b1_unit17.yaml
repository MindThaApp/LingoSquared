schema_version: '1.0'
pack_key: practice.prs-en.b1.unit17
source_language: prs
target_language: en
unit_content_key: en.b1.unit17.regret
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (prs-en practice pass): 5 fixes -- 4 translation templates narrowed (verbs dropped; pool limited to the unit''s own tagged lexemes lessons 01+02+04) so no gloss containing English leaks the answer and inflected-form/near-synonym glosses cannot make the prompt underdetermined; unit17 tag_schema extended with the lesson01/02/04 tags the translation pools use. Dari frames and feedback strings checked (Afghan Dari, polite -ین, no Iranian forms, no informal): no defects; templates are bare-word so there are no literal English frames. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: back=باز (در come back: باز آمدن) has English (leak) and is lesson03; all=بس is wrong (بس = enough) -> همه؛ looking=در جستجو -> جستجو کردن. Prior note: Generated for the prs-en X->en direction (Dari L1, tested content is English). Follows the established prs-en Endless-Practice pattern (a1_unit45.yaml): bare-{item} frames with untagged slots (language_code: en + part_of_speech in [noun, verb, adjective, adverb, preposition, phrase], no semantic tag) so every slot draws on the WHOLE unit lexeme pool at both unit and course scope, which is safe per PRACTICE_PACK_RECIPE.md SS3.1(c) because none of these frames carry literal English content text besides the {item} placeholder (or plain separators/dashes for matching_pairs). 4 templates per lesson x 4 lessons = 16 templates: multiple_choice + listen_select (recognition), matching_pairs x6 (structured), translation bare-word (production). listen_select is safe here because target_language=en has TTS configured. Measured capacity: 17 unit lexemes, 16 after excluding proper_noun/pronoun/particle/symbol, 16 distinct glosses -- comfortably clears the >=12 floor in every tier and the >=3 MC / >=6 matching_pairs floors. Excluded proper_noun (self-gloss risk, SS6.1), pronoun/particle (function words with no standalone meaning) from all slots. No word_order/fill_in_blank authored: no unit lexeme carries a semantic tag narrow enough to safely anchor a literal-text frame at COURSE scope (SS1.1), and matching_pairs alone clears the structured-tier floor. Feedback strings reused verbatim from the Dari-register exemplar a1_unit45.yaml.

    WAVE 3 (2026-07-26): generated per-unit/per-lesson semantic tags (backfill commit 05af7ace) now exist for this unit, closing the gap flagged above for the 4 matching_pairs templates (recognition/production templates untouched). This is the thinnest unit in the batch (15 tagged content tokens total): every lesson alone is below the 6-pair floor (4/4/4/3), so all 4 match.003 templates share the unit-wide prs_en_b1_unit17_words tag (15 tok/15 gloss), eyeballed across the full pool for confusable glosses -- none found. This mirrors the pre-existing shape (all 4 already pooled the whole unit''s content POS at checkpoint scope) but now bounds Endless-Practice course scope to this unit''s own tokens instead of the whole course''s content words. Dropped ''preposition'' from the part_of_speech filter (the generated tag never carries preposition members).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b1_unit17_words
    - prs_en_b1_unit17_lesson01_words
    - prs_en_b1_unit17_lesson02_words
    - prs_en_b1_unit17_lesson04_words
