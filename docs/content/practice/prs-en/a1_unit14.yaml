schema_version: "1.0"
pack_key: practice.prs-en.a1.unit14
source_language: prs
target_language: en
unit_content_key: en.a1.unit14.communication
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 extending prs-en's Endless Practice pool from
    units 01-08 to also cover units 09-14. Deliberate scope decision,
    same as the reference fa-en/a1_unit14.yaml pack (itself following
    the original nl-en/a1_unit14.yaml pack): lesson02 (asking someone to
    repeat/speak slowly) gets ZERO generated templates. Its vocabulary
    (sorry/repeat/speak/slowly/hear/well) has no multi-member synonym
    group at all -- every word is a single, non-interchangeable concept,
    so any "slot" would necessarily have exactly one candidate, meaning
    the "generated" exercise would be byte-identical every time and add
    no practice value beyond the lesson's own hand-authored exercises.
    The other three lessons DO have genuine swappable content: lesson01
    reuses the 2-member 'person_name' tag (Daniel/Leila, already
    established since unit01/02) for 'Hello, this is {item}.'/'Hi, it's
    {item}.'; lessons 03 and 04 reuse the already-verified 5-member
    'place' tag (unit09) for 'Let's meet at the {item}.'/'How about 6pm
    at the {item}?' -- both grammatical with any of the 5 places. Both
    tags already existed in scripts/_en_target_lexeme_common.py; no
    EN_POS/agreement-tag additions were needed (verified by diffing
    every introduced_token against EN_POS directly against the real en
    realization file). Only Dari glosses for the new tokens were added
    to scripts/backfill_lexemes_prs_en.py, hand-derived from docs/
    content/overlays/prs-en/a1_unit14.yaml's own real Dari phrasing.
    Verified with scripts/_practice_slot_check.py that every slot has
    >=1 real candidate lexeme and every multiple_choice/listen_select
    slot has >=3 distinct candidate values (person_name=2 -- used only
    in word_order/fill_in_blank/translation, never multiple_choice/
    listen_select, so its 2-member count is fine; place=5). Confirmed 0
    errors/0 warnings from compile_content.py practice-validate. Left
    unreviewed pending a separate fresh-context review pass, per
    standing project policy.

    Deepened 2026-07-07 (templates-per-unit audit found this unit the
    shallowest in prs-en at 7). person_name stays at its original 2
    templates -- only 2 real members, already its honest ceiling per
    this file's own original reasoning. Added 3 new templates, all
    reusing the already-verified 5-member 'place' tag with exercise
    TYPES this unit hadn't used yet (word_order/translation/
    listen_select already existed; multiple_choice/matching_pairs did
    not): a lesson03 listen_select (parity with lesson04's), a
    lesson04 multiple_choice (bare-word Dari-gloss recognition), and a
    lesson04 matching_pairs using all 5 place members (AUTHORING_
    GUIDE.md #16 -- 5 is the unit's honest ceiling, not padded). No new
    EN_POS/semantic-tag or Dari-gloss additions needed -- 'place' was
    already fully classified/glossed since unit09/this unit's original
    pass. Considered a fill_in_blank for 'place' (e.g. blanking "Let's
    meet at the {item}") but rejected it: all 5 place members are
    genuinely grammatical in that exact frame with nothing else to
    disambiguate -- scripts/_fill_in_blank_ambiguity_check.py (and
    compile_content.py's hard-fail per AUTHORING_GUIDE.md #17) would
    correctly flag it, so zero new fill_in_blank templates, matching
    this direction's own established "zero is fine when real
    vocabulary can't safely support one" precedent. Re-verified
    scripts/_practice_slot_check.py (place still safely >=3 for the
    new multiple_choice, >=2 for matching_pairs) and
    scripts/_fill_in_blank_ambiguity_check.py (zero new AMBIGUOUS
    flags) before import. New count: 10 templates (7 -> 10).

    REAUTH 2026-07-24 (unit-scope dead-template repair). scripts/
    _practice_unit_scope_check.py found ALL 10 of the templates above
    DEAD at checkpoint scope: `generate_checkpoint()` only loads a
    unit's OWN lexemes, and unit14 introduces zero lexemes carrying
    `person_name` or `place` -- both tags are 100% established in
    earlier units (person_name in unit01/02, place in unit09), which is
    exactly recipe DO-NOT #2. Confirmed via the iter_specs unit-filter:
    every one of unit14's own 16 introduced tokens (free/tonight/sorry/
    repeat/that/speak/more/slowly/hear/well/6pm/message/suggest/
    meeting/place/about) carries an EMPTY agreement_tags dict -- note
    the token literally spelled "place" (lesson03, "a good place to
    meet") is a generic noun with no semantic tag of its own; it is NOT
    a member of the `place` tag (bank/hospital/park/pharmacy/
    restaurant), which is why the old pool was genuinely empty here.

    PACK-ONLY fix: no native semantic tag survives to re-anchor to, so
    every template was rebuilt on unit14's own vocabulary using bare
    part_of_speech-only slots (recipe SS3.1c), dropping person_name/place
    entirely. Course-wide POS class sizes on the whole a1 course rule
    out any literal-text sentence frame built on an untagged POS slot
    (noun=512, verb=317, adjective=149, adverb=61 course-wide) --
    SS1.1's course-scope grammaticality rule would require EVERY
    course-wide member of that class to fit the sentence, which is
    neither testable nor plausible. So word_order and fixed-sentence
    translation (both course-scope-sensitive) were dropped for this
    unit; recognition (multiple_choice/listen_select), matching_pairs
    and BARE-WORD translation are all safe with a broad POS-only pool
    (no literal frame text besides the slot itself, so course-scope
    breadth is a non-issue) and now carry the whole pack.

    New unit-wide pools (SS1.1 UNIT scope: pooled across all 4 lessons,
    each anchored template still points at one lesson_content_key):
    noun_pool = tonight/6pm/message/meeting/place (5, lesson01+03);
    verb_pool = repeat/speak/hear/suggest (4, lesson02+03); desc_pool =
    free/sorry/more/slowly/well (5, adjective+adverb, lesson01+02);
    content_pool = noun_pool union verb_pool (9, matching_pairs only);
    misc_pool = that/about (pronoun+preposition, 2, translation-only --
    both too thin for any floored type, but bare translation has no
    floor). Every gloss in every pool was read (SS0.1) and is distinct
    within its pool -- no homograph/collapse risk, no proper nouns.

    11 new templates (was 10, all previously dead): lesson01 x3
    (word_listen on noun_pool, desc_listen on desc_pool, noun_translate
    bare), lesson02 x3 (verb_choose MC, desc_choose MC, verb_translate
    bare), lesson03 x4 (word_choose MC on noun_pool, verb_listen, a
    content_pool matching_pairs x8, desc_translate bare), lesson04 x1
    (misc_translate bare on that/about -- lesson04's only native token
    is "about", so a bare-word translation is the honest ceiling there;
    no recognition/structured template could be anchored to it without
    pulling in vocabulary from a different lesson). Tiers: recognition
    6 (3 MC + 3 listen_select), structured 1 (matching_pairs -- the
    genuine ceiling, since no native semantic tag survives to anchor a
    second safe structured template and a broad-POS word_order/
    fill_in_blank is unsafe or impossible per the course-scope reasoning
    above), production 4 (bare translation x4). LOG for the coordinator:
    this unit would support a second safe structured type (e.g.
    fill_in_blank) if any of its content words were given even one
    single-member semantic tag in scripts/backfill_lexemes_prs_en.py --
    out of scope here (PACK-ONLY). Verified 0 DEAD via scripts/
    _practice_unit_scope_check.py and 0 errors via compile_content.py
    practice-validate.

    Polish wave 2 (2026-07-24): dispatched for (a) POS-only
    matching_pairs on content_match.003 and (b) structured tier at 1
    live template (<3). On (a): left POS-only DELIBERATELY -- all 16 of
    unit14's own tokens carry an empty agreement_tags dict (re-confirmed
    against backfill_lexemes_prs_en.iter_specs()), so no semantic union
    of unit-native tags exists at all; adding tags is out of pack-only
    scope and a wrong union is worse than the status quo. On (b): the
    only course-scope-safe structured type here remains bare-frame
    matching_pairs (this file's own reasoning above), so added lesson01
    mixed_match.004 (6 slots over a noun+adjective+adverb pool, 10
    distinct unit tokens) and lesson02 action_match.004 (6 slots over a
    verb+adjective+adverb pool, 9 distinct unit tokens) -- pools differ
    from content_match.003's noun+verb and from each other, all glosses
    in both pools read and distinct. These share content_match.003's
    unavoidable POS-only breadth at Endless-Practice course scope.
    Structured now 3 live.

    Polish wave 3 (2026-07-26): the wave-2 blocker above ("no semantic
    union of unit-native tags exists at all") is RESOLVED -- commit
    05af7ace generated unit-scoped semantic tags in
    backfill_lexemes_prs_en. Re-anchored the dispatched
    lesson03.content_match.003 from the untagged content_pool to a new
    unit_content preset (semantic: prs_en_a1_unit14_words +
    part_of_speech [noun, verb]). Unit-scope pool is the identical 8
    tokens (tonight/repeat/speak/hear/message/suggest/meeting/place, =
    the 8 slots; glosses re-read, all distinct), but course scope now
    equals unit scope, so Endless Practice no longer pulls off-theme
    course-wide nouns/verbs into these pairs. POS kept at [noun, verb]:
    widening to the tag's full 13-token pool would admit "well" (gloss
    'khub (dar hear well)' bakes pool-member token "hear" into another
    member's gloss -- rubric gloss guard). Non-dispatched POS-only
    templates (bare-word MC/listen/translate + the two wave-2 matchers,
    not in this dispatch) left as-is.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb, pronoun, preposition]
  agreement_tags:
    semantic: [prs_en_a1_unit14_words]
slot_presets:
  noun_pool: &noun_pool {language_code: en, part_of_speech: noun, agreement_tags: {semantic: prs_en_a1_unit14_words}}
  verb_pool: &verb_pool {language_code: en, part_of_speech: verb, agreement_tags: {semantic: prs_en_a1_unit14_words}}
  desc_pool: &desc_pool {language_code: en, part_of_speech: [adjective, adverb], agreement_tags: {semantic: prs_en_a1_unit14_words}}
  content_pool: &content_pool {language_code: en, part_of_speech: [noun, verb]}
  unit_content: &unit_content {language_code: en, part_of_speech: [noun, verb], agreement_tags: {semantic: prs_en_a1_unit14_words}}
  misc_pool: &misc_pool {language_code: en, part_of_speech: [pronoun, preposition]}
  mixed_pool: &mixed_pool {language_code: en, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: prs_en_a1_unit14_words}}
  action_pool: &action_pool {language_code: en, part_of_speech: [verb, adjective, adverb], agreement_tags: {semantic: prs_en_a1_unit14_words}}
templates:
  - content_key: practice.prs-en.en.a1.unit14.lesson01.word_listen.001
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *noun_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson01.desc_listen.002
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *desc_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson01.noun_translate.003
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *noun_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson01.mixed_match.004
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *mixed_pool, second: *mixed_pool, third: *mixed_pool, fourth: *mixed_pool, fifth: *mixed_pool, sixth: *mixed_pool}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson02.verb_choose.001
    lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *verb_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson02.desc_choose.002
    lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *desc_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی دری {item} را انتخاب کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson02.verb_translate.003
    lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *verb_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson02.action_match.004
    lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *action_pool, second: *action_pool, third: *action_pool, fourth: *action_pool, fifth: *action_pool, sixth: *action_pool}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson03.word_choose.001
    lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *noun_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} یکی از واژه‌های همی پیام است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson03.verb_listen.002
    lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *verb_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson03.content_match.003
    lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *unit_content, second: *unit_content, third: *unit_content, fourth: *unit_content, fifth: *unit_content, sixth: *unit_content, seventh: *unit_content, eighth: *unit_content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}
    feedback_frame: {text: "هر واژه را به معنی دری خودش وصل کنین.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson03.desc_translate.004
    lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *desc_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
  - content_key: practice.prs-en.en.a1.unit14.lesson04.misc_translate.001
    lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
    type: translation
    frame: {text: "{item}", language_code: prs, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *misc_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژهٔ دری است.", language_code: prs, direction: rtl}
