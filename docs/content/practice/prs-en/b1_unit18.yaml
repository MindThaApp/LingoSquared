schema_version: '1.0'
pack_key: practice.prs-en.b1.unit18
source_language: prs
target_language: en
unit_content_key: en.b1.unit18.future_plans
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Generated for the prs-en X->en direction (Dari L1, tested content is English). Follows the established prs-en Endless-Practice pattern (a1_unit45.yaml): bare-{item} frames with untagged slots (language_code: en + part_of_speech in [noun, verb, adjective, adverb, preposition, phrase], no semantic tag) so every slot draws on the WHOLE unit lexeme pool at both unit and course scope, which is safe per PRACTICE_PACK_RECIPE.md SS3.1(c) because none of these frames carry literal English content text besides the {item} placeholder (or plain separators/dashes for matching_pairs). 4 templates per lesson x 4 lessons = 16 templates: multiple_choice + listen_select (recognition), matching_pairs x6 (structured), translation bare-word (production). listen_select is safe here because target_language=en has TTS configured. Measured capacity: 19 unit lexemes, 19 after excluding proper_noun/pronoun/particle/symbol, 19 distinct glosses -- comfortably clears the >=12 floor in every tier and the >=3 MC / >=6 matching_pairs floors. Excluded proper_noun (self-gloss risk, SS6.1), pronoun/particle (function words with no standalone meaning) from all slots. No word_order/fill_in_blank authored: no unit lexeme carries a semantic tag narrow enough to safely anchor a literal-text frame at COURSE scope (SS1.1), and matching_pairs alone clears the structured-tier floor. Feedback strings reused verbatim from the Dari-register exemplar a1_unit45.yaml. Wave-3 (2026-07-26): commit 05af7ace added generated agreement_tags.semantic to backfill_lexemes_prs_en.py (prs_en_<unit>_words / prs_en_<unit>_lessonNN_words), resolving the blocker above for matching_pairs. Re-anchored all 4 POS-only matching_pairs slot bodies from the bare part_of_speech union to language_code + [noun, verb, adjective, adverb] + agreement_tags.semantic: prs_en_b1_unit18_words (unit-wide tag for all 4 lessons; no lesson tag alone cleared the 6-pair floor -- lesson01-04 have 5/3/7/1 tokens respectively); declared the tag in tag_schema.agreement_tags.semantic. pool_check.py confirms 16 distinct unit tokens/glosses with zero course-scope extras (tags are unit-scoped by construction) and no confusable/duplicate glosses. Slot counts unchanged (all were already 6).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_b1_unit18_words
templates:
- content_key: practice.prs-en.en.b1.unit18.lesson01.choose.001
  lesson_content_key: en.b1.unit18.lesson01.future_plans_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
        - noun
        - verb
        - adjective
        - adverb
        - preposition
        - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-en.en.b1.unit18.lesson01.listen.002
