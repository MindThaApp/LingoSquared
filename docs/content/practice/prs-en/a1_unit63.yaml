schema_version: '1.0'
pack_key: practice.prs-en.a1.unit63
source_language: prs
target_language: en
unit_content_key: en.a1.unit63.asking_for_help
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-23; extended 2026-07-24 (polish wave 2, tier-thinness). The prs-en lexeme backfill
    now carries far more lexemes for this unit than at first authoring (18 matching the new slots'' content
    POS at unit scope, mostly part_of_speech phrase), so the structured tier is now viable. Added 2 matching_pairs
    (untagged unit-wide content pool, anchored to the previously template-less phrase/dialogue lessons)
    and 1 word_order with a bare ''{item}'' frame over the unit''s phrase lexemes (no literal frame text,
    so every course-scope candidate is trivially grammatical in its own frame and self-reference is impossible;
    precedent en-fa a1_unit37 lesson03.order.004), plus for units short on production a bare translation
    whose pool adds phrase POS. matching/translation POS [adjective, noun, verb, phrase]. HONEST-THIN/POS-ONLY
    NOTE: backfill_lexemes_prs_en.py still carries no usable agreement_tags.semantic for this unit''s lexemes,
    so every slot stays POS-only (recipe SS3.1(c); direction precedent a1_unit48/56/58/61) -- at Endless-Practice
    COURSE scope the matching_pairs pools therefore draw off-theme A1-wide cards; fixing that needs a semantic-tag
    backfill, which is out of scope for pack polish. The lesson04 reading-note mega-phrase is in the phrase
    pool, so it can surface as a long matching card, a long word_order bank, or an exact-typing translation
    answer -- accepted, same situation as a1_unit48-61. word_order/fill_in_blank with literal frame text
    remain unauthored (unsafe with untagged slots at course scope); fill_in_blank is impossible without
    a single-member anchor tag. POLISH WAVE 3 (2026-07-26): backfill_lexemes_prs_en.py now emits
    generated per-unit/per-lesson semantic tags (commit 05af7ace), resolving the prior POS-only
    blocker for matching_pairs. Re-anchored both matching_pairs slots to their own lesson''s
    generated tag (`prs_en_a1_unit63_lesson02_words` / `..._lesson03_words`) rather than the
    unit-wide tag: each lesson tag alone clears the 6-pair floor (6 and 7 phrase tokens
    respectively), and keeping them lesson-scoped avoids unioning near-duplicate dialogue lines
    across lessons (e.g. lesson02''s "could you open the door" next to lesson03''s "could you open
    the door too" would be a confusable pair under one card). 0 course-scope extras on either pool
    (pool_check.py verified). Recognition/production slots (choose/listen/translate) remain
    POS-only by design, per this task''s scope.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - prs_en_a1_unit63_lesson02_words
    - prs_en_a1_unit63_lesson03_words
