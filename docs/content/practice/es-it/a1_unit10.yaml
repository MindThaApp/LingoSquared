  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vada y giri son órdenes de cortesía, que se usan con desconocidos.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson01.listen.002
