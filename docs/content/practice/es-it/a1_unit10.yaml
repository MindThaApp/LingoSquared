- content_key: practice.es-it.it.a1.unit10.lesson01.translate.005
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: Disculpe, ¿cómo llego al museo? (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, come arrivo al {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi se usa para dirigirse a un desconocido con cortesía.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson01.translate.006
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: Siga todo recto y luego gire a la derecha en el cruce. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a destra {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: All'incrocio significa en el cruce.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.choose.002
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: multiple_choice
