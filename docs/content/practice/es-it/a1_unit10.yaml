  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Continui, vada y giri son todas órdenes de cortesía.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson03.order.002
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: word_order
  frame:
    text: Poi {item} sempre dritto.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Poi {item} sempre dritto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Continui es la orden de cortesía: continúe.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson03.translate.003
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: translation
  frame:
    text: Luego continúe todo recto. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Poi {item} sempre dritto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Continui es la forma de orden con Lei del verbo continuare.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.translate.009
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
