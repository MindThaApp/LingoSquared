      direction: ltr
  feedback_frame:
    text: A destra y a sinistra son las dos direcciones para girar.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson01.fill.004
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
