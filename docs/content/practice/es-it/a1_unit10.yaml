    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: A piedi significa a pie, literalmente a pies.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.listen.003
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Solo significa solamente y va delante de la cantidad: solo cinque minuti.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.fill.004
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: fill_in_blank
  frame:
    text: Sono {item} cinque minuti a piedi. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Solo se coloca delante de cinque minuti para decir solo cinco minutos.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.order.005
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: word_order
  frame:
    text: È {item} da qui?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Lontano da qui significa lejos de aquí.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.translate.006
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: ¿Está lejos de aquí?
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: È lontano da qui? es la forma habitual de preguntar por la distancia.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.translate.007
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: No, son solo cinco minutos a pie.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: No, sono {item} cinque minuti a piedi.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Se dice sono cinque minuti porque minuti es plural.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson02.translate.008
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: Muchas gracias, es usted muy amable. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Grazie mille, {item} gentile.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Molto gentile es una forma cortés de dar las gracias con formalidad.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit10.lesson03.choose.001
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
