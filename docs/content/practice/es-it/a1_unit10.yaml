  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Al museo es a más il: al es la contracción para los lugares masculinos, igual que el al del español.'
    language_code: es
    direction: ltr
