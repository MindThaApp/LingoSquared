    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vorrei significa «quisiera» y es la forma cortés de pedir.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit07.lesson01.fill.004
  lesson_content_key: it.a1.unit07.lesson01.al_bar
