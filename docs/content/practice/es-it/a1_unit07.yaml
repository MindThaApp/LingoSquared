  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per favore significa por favor y va al final de una petición.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: Quisiera un café y un cruasán, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un va con sustantivos masculinos como caffè y cornetto; per favore cierra la petición.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: ¿Qué desea? (formal, Lei)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera es la forma formal de Lei que usa un camarero, no la forma informal de tu.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
