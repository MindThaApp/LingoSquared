  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pago significa «pago» y con significa «con».
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.listen.002
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
