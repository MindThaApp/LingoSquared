  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ecco señala algo: aquí está.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson02.translate.005
  lesson_content_key: it.a1.unit24.lesson02.posso_pagare
  type: translation
  frame:
    text: Disculpe, ¿puedo pagar con tarjeta? (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, {item} pagare con la carta?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi es la forma formal de llamar la atención de alguien.
    language_code: es
    direction: ltr
