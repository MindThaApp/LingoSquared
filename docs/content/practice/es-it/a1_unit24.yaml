  lesson_content_key: it.a1.unit24.lesson02.posso_pagare
  type: word_order
  frame:
    text: Scusi, {item} pagare con la carta?
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, {item} pagare con la carta?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi abre una pregunta cortés; posso significa «puedo».
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson02.fill.003
  lesson_content_key: it.a1.unit24.lesson02.posso_pagare
