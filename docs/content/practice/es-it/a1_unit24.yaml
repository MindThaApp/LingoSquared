    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo scontrino es el tique y la carta es la tarjeta.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.order.003
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
