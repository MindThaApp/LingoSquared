  answer_derivation:
    kind: render_frame
    frame:
      text: Pago con la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Con la carta significa «con tarjeta».
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.order.004
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: word_order
  frame:
    text: Pago in {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Pago in {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: In contanti significa «en efectivo», sin artículo.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.fill.005
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: fill_in_blank
  frame:
    text: Ho i {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Soldi es plural, así que lleva i.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.fill.006
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: fill_in_blank
  frame:
    text: Oggi {item} in contanti. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pago es la forma de «yo» de pagare.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.translate.007
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: translation
  frame:
    text: Pago con tarjeta.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Pago con la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Como en español («con tarjeta»), el italiano usa con para el medio de pago, pero aquí lleva artículo: con la carta.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.translate.008
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: translation
  frame:
    text: Hoy pago en efectivo.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi pago in {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Contanti siempre es plural y va después de in.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit24.lesson01.translate.009
  lesson_content_key: it.a1.unit24.lesson01.soldi_carta_contanti
  type: translation
  frame:
