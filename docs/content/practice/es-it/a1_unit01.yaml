templates:
- content_key: practice.es-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu se usa con amigos, familia e iguales; Lei, con L mayúscula, es la forma de cortesía para desconocidos, personas mayores y entornos profesionales; corresponde al «usted» español.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao sirve tanto para saludar como para despedirse, mientras que buongiorno es un saludo cortés de día.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? pregunta a un amigo cómo está; a un desconocido le dirías Come sta?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Muchos adjetivos italianos en -ale se parecen a los españoles en -al: informale es informal, formale es formal.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso va con el Lei formal: muestra respeto a las personas que no conoces bien.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: Hola, ¿cómo estás? (informal, a un amigo)
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai es la forma de tu; la forma de cortesía con Lei de la misma pregunta es Buongiorno, come sta?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla es la despedida formal; el -la final se refiere a Lei. Con amigos, los italianos dicen ciao.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera es el saludo de la tarde-noche; buonanotte solo se dice cuando alguien se va a dormir.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo significa literalmente «nos vemos»; es la forma cotidiana de decir hasta luego.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani significa hasta mañana; la a forma parte de la expresión fija.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene responde a Come stai? y también puede usarse solo con el sentido de bien.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi es la manera cortés de llamar la atención de un desconocido; es la forma formal (Lei).
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto es masculino; pasa a benvenuta cuando das la bienvenida a una mujer.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo significa literalmente «me llamo»; el nombre va simplemente al final.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti es el «te» informal; con Lei la pregunta pasa a ser Come si chiama?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere es a la vez el sustantivo placer y la respuesta que se da al conocer a alguien: mucho gusto.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille significa mil, así que grazie mille es un cálido muchas gracias.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: Me llamo Elena.
    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: El italiano dice mi chiamo, «me llamo», igual que el español.
    language_code: es
    direction: ltr
