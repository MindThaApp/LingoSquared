    - w_arriva
    - w_arrivano
    - w_arrivare
    - w_compra
    - w_francobollo
    - w_giorni
    - w_impiega
    - w_impiegare
    - w_impiegato
    - w_lettera
    - w_nonni
    - w_pacchi
    - w_pacco
    - w_posta
    - w_scrive
    - w_scrivere
    - w_scrivo
    - w_torniamo
templates:
- content_key: practice.es-it.it.a1.unit51.lesson01.choose.001
  lesson_content_key: it.a1.unit51.lesson01.la_lettera_e_il
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_lettera
        - w_pacco
        - w_francobollo
        - w_scrivere
        - w_scrivo
        - w_arrivare
        - w_arriva
        - w_pacchi
        - w_arrivano
        - w_impiegare
        - w_impiega
        - w_giorni
        - w_impiegato
        - w_compra
        - w_posta
        - w_scrive
        - w_nonni
        - w_torniamo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre la carta y el paquete.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit51.lesson02.listen.001
