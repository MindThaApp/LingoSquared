templates:
- content_key: practice.es-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Las nacionalidades cambian según quien habla: americano para un hombre, americana para una mujer; italiano e italiana funcionan igual.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? pregunta a un amigo de dónde es; a un desconocido le dices Di dov'è, Lei?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Los nombres de ciudades italianas a veces difieren de los españoles: Milano es Milán.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson01.match.004
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'La terminación indica el género: -o para un hombre (americano), -a para una mujer (americana).'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Como en español, el italiano no escribe con mayúscula las nacionalidades ni los idiomas: italiano, inglese.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: ¿De dónde eres? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? es la pregunta con tu; la versión de cortesía con Lei es Di dov'è, Lei?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La terminación del verbo indica quién realiza la acción: parlo es yo hablo, parli es tú hablas (informal), parla es usted habla (formal) o él/ella habla.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Parli y parla suenan parecido: la última vocal te dice si es tu (-i) o Lei (-a).'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Después de parlare el idioma no suele llevar artículo: parlo inglese, parlo italiano; en español pasa igual: «hablo inglés».'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? pregunta cuánto tiempo llevas estudiando; el italiano usa el presente con da, «desde», como el español «estudio desde hace…».
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: ¿Hablas inglés? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Parli es la forma de tu; para un desconocido usarías la forma de Lei, Parla inglese?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai y fa son formas de fare: fai es para tu, fa es para Lei o él/ella.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ingegnere lleva el acento en la penúltima sílaba: in-ge-GNE-re.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? pregunta literalmente qué trabajo haces; la versión de cortesía es Che lavoro fa, Lei?
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai es la forma de tu de fare; con Lei pasa a ser fa.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.match.005
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Che es una palabra flexible: aquí significa qué en Che lavoro fai? y también qué en Che bello!'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.translate.006
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Per significa por o para: per lavoro es por trabajo, per due anni es por dos años.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit02.lesson03.translate.007
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: Estoy aquí por trabajo.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono qui per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'El italiano usa per sin artículo aquí: per lavoro, por trabajo.'
    language_code: es
    direction: ltr
