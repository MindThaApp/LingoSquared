templates:
- content_key: practice.es-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Con un posesivo, los nombres de familia en singular no llevan artículo: mio padre, mia madre; en español pasa igual: «mi padre».'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre y madre terminan ambos en -e pero tienen distinto género, así que aprende cada uno con el suyo; nonno y nonna acaban en -o y -a.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo y mio son masculinos, así que van con un sustantivo masculino: questo è mio padre.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa y mia son femeninos y concuerdan con madre: esta es mi madre.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: Esta es mi madre.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Usa questa y mia con un sustantivo femenino, y questo y mio con uno masculino.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Madre y padre, fratello y sorella, nonno y nonna son parejas de palabras de familia, masculino y femenino.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli es el plural de fratello, y también puede significar hermanos en general.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito y moglie son marido y esposa; moglie acaba en -e pero es femenino.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Un va con un sustantivo masculino y una con uno femenino: un fratello, una sorella.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
    text: Hai fratelli o {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El plural de sorella es sorelle: la terminación -a pasa a -e.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: Tengo un hermano y una hermana.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho significa tengo; usa un ante un sustantivo masculino y una ante uno femenino.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: ¿Tienes hermanos o hermanas? (informal, tu)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai es la forma informal de tu del verbo tener, así que esta pregunta es para un amigo o un compañero.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson03.match.001
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Las palabras de familia vienen en parejas masculino y femenino: marito y moglie, figlio y figlia.'
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson03.choose.002
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli significa hijos en general; figlio y figlia nombran a un hijo o a una hija.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Maschio y femmina se usan para un niño y una niña dentro de una familia.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson03.fill.004
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: fill_in_blank
  frame:
    text: Sì, ho due {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figli es el plural de figlio y abarca a los hijos de ambos sexos.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson03.translate.005
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: ¿Tienes hijos? (informal, tu)
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai figli? es la forma informal de preguntar si alguien tiene hijos.
    language_code: es
    direction: ltr
- content_key: practice.es-it.it.a1.unit06.lesson03.translate.006
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figlio y figlia significan hijo e hija; maschio y femmina describen a un niño y una niña entre tus hijos.
    language_code: es
    direction: ltr
