schema_version: '1.0'
pack_key: practice.nl-fa.a2.unit10
source_language: nl
target_language: fa
unit_content_key: fa.a2.unit10.opinions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fa by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - noun
  - proper_noun
  - phrase
  - adjective
  - verb
  - adverb
  - particle
  agreement_tags:
    semantic:
    - opinion_word
    - family_message_word
    - opinion_phrase
    - en_fa_a2_unit10_lesson01_words
    - en_fa_a2_unit10_lesson04_words
slot_presets:
  opinion_word: &id001
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: opinion_word
  family_message_word: &id005
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: family_message_word
  family_or_opinion_word: &id004
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic:
      - family_message_word
      - opinion_word
  opinion_phrase: &id006
    language_code: fa
    part_of_speech: phrase
    agreement_tags:
      semantic: opinion_phrase
  dialogue_word: &id003
    language_code: fa
    part_of_speech:
    - adjective
    - verb
    - adverb
    - noun
    agreement_tags:
      semantic: en_fa_a2_unit10_lesson04_words
  opinion_or_debate_noun: &id002
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic:
      - en_fa_a2_unit10_lesson01_words
      - en_fa_a2_unit10_lesson04_words
templates:
- content_key: practice.nl-fa.fa.a2.unit10.lesson01.opinion_choice.001
  lesson_content_key: fa.a2.unit10.lesson01.opinions_vocabulary
  type: multiple_choice
  frame:
    text: '{opinion_word}'
    language_code: fa
    direction: rtl
  slots:
    opinion_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: opinion_word
  feedback_frame:
    text: '{opinion_word} is een woord uit de woordenschat van deze unit over meningen geven.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fa.fa.a2.unit10.lesson01.opinion_match.002
  lesson_content_key: fa.a2.unit10.lesson01.opinions_vocabulary
  type: matching_pairs
  frame:
    text: Koppel elk woord aan de betekenis.
    language_code: nl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
