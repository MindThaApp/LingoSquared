    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_scenę
  answer_derivation:
    kind: render_frame
    frame:
      text: Widzę {item} i kurtynę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Veo el escenario y el telón. scenę significa escenario (complemento directo).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson03.order.002
  lesson_content_key: pl.a1.unit57.lesson03.aktorzy_i_kasa
  type: word_order
  frame:
