schema_version: '1.0'
pack_key: practice.es-pl.a1.unit57
source_language: es
target_language: pl
unit_content_key: pl.a1.unit57.teatr
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aktorzy
    - w_byli
    - w_dobrzy
    - w_dwudziesta
    - w_gwiazda
    - w_kurtyna
    - w_miejsca
    - w_otwarta
    - w_podróż
    - w_popularne
    - w_przedstawienie
    - w_przerwą
    - w_scenę
    - w_sztuka
    - w_teatr
    - w_zadowolony
    - w_świetni
templates:
- content_key: practice.es-pl.pl.a1.unit57.lesson01.choose.001
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatr
        - w_przedstawienie
        - w_popularne
        - w_kurtyna
        - w_scenę
        - w_aktorzy
        - w_dobrzy
        - w_otwarta
        - w_gwiazda
        - w_sztuka
        - w_podróż
        - w_dwudziesta
        - w_przerwą
        - w_miejsca
        - w_zadowolony
        - w_byli
        - w_świetni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre ¿vamos al teatro hoy?'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson02.listen.001
  lesson_content_key: pl.a1.unit57.lesson02.scena_i_kurtyna
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre el escenario y el telón.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson03.translate.001
  lesson_content_key: pl.a1.unit57.lesson03.aktorzy_i_kasa
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre los actores y la taquilla.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson04.match.001
  lesson_content_key: pl.a1.unit57.lesson04.program_przedstawienia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra polaca con su significado en español; las palabras provienen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson05.choose.001
  lesson_content_key: pl.a1.unit57.lesson05.przy_kasie_w_teatrze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre en la taquilla del teatro.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson06.translate.001
  lesson_content_key: pl.a1.unit57.lesson06.nina_dowiaduje_sie_o
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección en la que Nina se entera de cómo fue el teatro.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson01.order.002
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: word_order
  frame:
    text: O której zaczyna się {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_przedstawienie
  answer_derivation:
    kind: render_frame
    frame:
      text: O której zaczyna się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿A qué hora empieza la función? przedstawienie significa función, espectáculo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson01.fill.003
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: fill_in_blank
  frame:
    text: Przedstawienie jest {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popularne
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popularne
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La función es popular. popularne significa popular (neutro).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit57.lesson02.order.002
  lesson_content_key: pl.a1.unit57.lesson02.scena_i_kurtyna
