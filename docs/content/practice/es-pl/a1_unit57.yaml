    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_miejsca
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy mamy dobre {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
