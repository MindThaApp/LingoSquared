    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przyjść significa «venir» y va en infinitivo después de mogę o możesz.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson02.order.004
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz {item} w piątek?
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz {item} w piątek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Czy możesz más un infinitivo sirve para preguntar con cortesía a un amigo si puede hacer algo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson02.order.005
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
