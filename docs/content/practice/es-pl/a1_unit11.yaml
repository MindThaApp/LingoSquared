templates:
- content_key: practice.es-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę es la forma de chcieć para «yo» y chcesz es la forma para «tú», que se usa con amigos y familia.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson01.listen.002
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La terminación -sz marca el «tú» informal: chcesz, możesz, masz (jesteś es la excepción y termina en -ś).'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson01.match.003
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Chcieć y móc siguen el mismo patrón: -ę para «yo» y -sz para «tú».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson01.order.004
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: word_order
  frame:
    text: Dziś {item} iść do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Después de chcę o mogę, el segundo verbo se queda en infinitivo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson01.fill.005
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: fill_in_blank
  frame:
    text: Czy {item} iść razem do kina? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Una pregunta a un amigo usa la forma chcesz, de «tú», y czy abre la pregunta.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson01.translate.006
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: Hoy quiero ir al cine.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Después de chcę va un infinitivo, así que iść se queda en su forma del diccionario.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson01.translate.007
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Móc significa «poder» y se usa igual que chcieć.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson02.choose.001
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: multiple_choice
  frame:
