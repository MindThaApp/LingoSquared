    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz przyjść w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Los días masculinos como piątek no cambian después de w, pero los femeninos como sobota pasan a sobotę.
    language_code: es
    direction: ltr
