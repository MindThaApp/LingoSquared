  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chętnie y niestety son adverbios, por eso nunca cambian de forma.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson02.listen.002
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Sobotę es la forma que se usa después de w: los nombres de día femeninos cambian -a por -ę, así que sobota pasa a sobotę.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit11.lesson02.match.003
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: matching_pairs
