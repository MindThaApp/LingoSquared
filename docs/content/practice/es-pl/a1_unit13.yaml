  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: translation
  frame:
    text: 'Yo también: prefiero el té.'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ja też {item} herbatę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ja se añade para dar énfasis; la terminación verbal -ę ya significa «yo».
    language_code: es
    direction: ltr
