    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: En polaco no se repite el sustantivo en las respuestas cortas, pero una frase completa necesita la forma del complemento muzykę.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit13.lesson01.translate.008
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: translation
  frame:
    text: ¿Te gusta la música? (a un amigo, ty; empieza con czy)
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy lubisz {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Czy al principio convierte una afirmación en una pregunta de sí o no.
    language_code: es
    direction: ltr
