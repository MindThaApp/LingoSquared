  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La forma del complemento muzykę y la forma básica muzyka son dos formas del mismo sustantivo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit13.lesson02.choose.001
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
