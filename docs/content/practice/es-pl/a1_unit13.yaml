    kind: render_frame
    frame:
      text: Bardzo lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo va antes del verbo y lo refuerza, como «mucho» en español.
    language_code: es
    direction: ltr
