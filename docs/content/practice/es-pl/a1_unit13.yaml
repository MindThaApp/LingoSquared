    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wolę es la forma de «yo» de woleć, «preferir»; funciona como lubię.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit13.lesson02.listen.002
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wolę termina en -ę como lubię, la terminación de la forma de «yo».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit13.lesson02.order.003
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: word_order
  frame:
    text: Ja też {item} herbatę.
