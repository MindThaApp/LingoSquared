- content_key: practice.es-pl.pl.a1.unit23.lesson04.order.002
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: word_order
  frame:
    text: Oto pana {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_reszta
  answer_derivation:
    kind: render_frame
    frame:
      text: Oto pana {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Aquí tiene su cambio. reszta significa cambio (el dinero que se devuelve).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson04.fill.003
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: fill_in_blank
  frame:
    text: Nie {item} reszty. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_potrzebuję
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_potrzebuję
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'No necesito el cambio. Nie potrzebuję + genitivo: la negación pone el complemento en genitivo, por eso reszty.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson06.order.002
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
