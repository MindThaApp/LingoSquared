schema_version: '1.0'
pack_key: practice.es-pl.a1.unit23
source_language: es
target_language: pl
unit_content_key: pl.a1.unit23.pieniadze
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_dania
    - w_dwie
    - w_dzisiaj
    - w_gotówką
    - w_główne
    - w_kartą
    - w_kawy
    - w_osobno
    - w_podzielimy
    - w_podzielić
    - w_pomogłaś
    - w_pomysł
    - w_poprosimy
    - w_potrzebuję
    - w_płaci
    - w_płacić
    - w_płacę
    - w_reszta
    - w_reszty
    - w_strony
    - w_sumie
    - w_zapłacono
templates:
- content_key: practice.es-pl.pl.a1.unit23.lesson01.choose.001
  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sumie
        - w_płacić
        - w_kartą
        - w_gotówką
        - w_płacę
        - w_podzielimy
        - w_osobno
        - w_podzielić
        - w_reszta
        - w_potrzebuję
        - w_reszty
        - w_dania
        - w_główne
        - w_dwie
        - w_kawy
        - w_zapłacono
        - w_poprosimy
        - w_pomysł
        - w_dzisiaj
        - w_pomogłaś
        - w_strony
        - w_płaci
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Cuánto cuesta en total?».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson02.listen.001
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Tarjeta o efectivo?».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson03.translate.001
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Dividir la cuenta».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson04.match.001
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra polaca con su significado en español; las palabras provienen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson05.choose.001
  lesson_content_key: pl.a1.unit23.lesson05.czytanie_rachunku_z_restauracji
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre cómo leer la cuenta de un restaurante.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson06.translate.001
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección en que Ewa y Marek pagan la cuenta.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson01.order.002
  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: word_order
  frame:
    text: Ile to kosztuje w {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_sumie
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to kosztuje w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Cuánto cuesta en total? W sumie (en total) aclara que quieres el precio de todo junto, no el de un solo artículo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson02.order.002
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: word_order
  frame:
    text: Czy mogę tu zapłacić {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_kartą
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy mogę tu zapłacić {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Puedo pagar aquí con tarjeta? kartą significa con tarjeta.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson02.fill.003
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: fill_in_blank
  frame:
    text: Czy chce pan zapłacić {item}, czy kartą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_gotówką
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_gotówką
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿Quiere pagar en efectivo o con tarjeta? Czy chce pan ...? es la versión formal de Czy chcesz ...?, usada aquí por un cajero desconocido (pan para un hombre, pani para una mujer).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson03.order.002
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: word_order
  frame:
    text: Może {item} rachunek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_podzielimy
  answer_derivation:
    kind: render_frame
    frame:
      text: Może {item} rachunek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Dividimos la cuenta? podzielimy significa dividiremos.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson03.fill.003
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: fill_in_blank
  frame:
    text: Czy mogę zapłacić {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_osobno
    hint:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_osobno
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
