      language_code: pl
      direction: ltr
  feedback_frame:
    text: '¿Pedimos la cuenta? Poprosić o (pedir) va seguido de acusativo: o rachunek. Poprosimy es el futuro perfectivo.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit23.lesson06.fill.003
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: fill_in_blank
  frame:
    text: Marek {item} rachunek. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
