    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po południu indica cuándo, y el verbo se queda en la forma de «yo».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit10.lesson02.translate.006
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
