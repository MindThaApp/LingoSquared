    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'El infinitivo y la forma de «yo» son palabras distintas, así que aprende ambas: jeść y jem.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit10.lesson01.order.004
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: word_order
  frame:
    text: Rano {item} o siódmej.
    language_code: pl
    direction: ltr
  slots:
