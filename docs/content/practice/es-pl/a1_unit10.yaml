      text: Jem {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Śniadanie es neutro, así que su forma de complemento directo es igual que la forma básica.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit10.lesson01.translate.007
  lesson_content_key: pl.a1.unit10.lesson01.rano
