    frame:
      text: Rano {item} o siódmej.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rano va primero para indicar cuándo, y o siódmej da la hora exacta.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit10.lesson01.fill.005
  lesson_content_key: pl.a1.unit10.lesson01.rano
