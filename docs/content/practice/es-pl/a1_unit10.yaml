    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La terminación de genitivo -u aparece de nuevo en domu, como en banku y parku.
    language_code: es
    direction: ltr
