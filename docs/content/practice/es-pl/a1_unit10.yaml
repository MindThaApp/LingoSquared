templates:
- content_key: practice.es-pl.pl.a1.unit10.lesson01.choose.001
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cada verbo de aquí tiene una forma de diccionario (wstawać, jeść, pić) y una forma de «yo» (wstaję, jem, piję).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit10.lesson01.listen.002
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: listen_select
  frame:
