    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jem es una forma irregular de «yo» de jeść y conviene aprenderla de memoria.
    language_code: es
    direction: ltr
