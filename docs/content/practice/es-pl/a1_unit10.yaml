    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La forma de «yo» suele terminar en -ę o -m, como en wstaję, piję y jem.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit10.lesson01.match.003
  lesson_content_key: pl.a1.unit10.lesson01.rano
