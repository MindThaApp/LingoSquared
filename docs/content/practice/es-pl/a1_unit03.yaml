templates:
- content_key: practice.es-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En polaco, los días de la semana y los meses se escriben con inicial minúscula, igual que en español.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Środa, sobota y niedziela terminan en -a, mientras que los otros cuatro días terminan en consonante; esta diferencia final importa en la construcción w + día.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dziś significa «hoy», y tygodnia es una forma modificada de la palabra «semana», como en dzień tygodnia.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Con w («el»), poniedziałek, czwartek y piątek no cambian, pero wtorek pasa a we wtorek para pronunciarse con más facilidad.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina significa «voy al cine», y w + día de la semana indica «el» día en cuestión.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia significa «día de la semana», y la segunda palabra cambia su terminación a tygodnia.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Los nombres de los meses en polaco no llevan mayúscula ni prefijo ni artículo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En una fecha hablada, el día va primero y termina en -ego, seguido del mes en su forma de fecha, que suele acabar en -a (dziesiątego maja), pero lutego para febrero.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Los meses en polaco no se escriben con mayúscula, y urodziny («cumpleaños») es siempre plural.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Algunos meses terminan en -eń (styczeń, kwiecień, sierpień, wrzesień), lo que te ayuda a reconocerlos.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.order.005
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: word_order
  frame:
    text: Spotkanie jest piętnastego {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: En una fecha, el día termina en -ego y el mes lleva -a, excepto lutego para febrero.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.fill.006
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: fill_in_blank
  frame:
    text: Kiedy są twoje {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Urodziny es plural en polaco, así que el verbo es są («son») y no jest.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson02.translate.007
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: ¿Cuándo es la reunión?
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Kiedy jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kiedy significa «cuándo», y un sustantivo singular como spotkanie lleva jest.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson03.choose.001
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Panu y ci significan «a ti/a usted»; panu es formal para un hombre y ci es informal.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson03.translate.002
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Możemy es la forma de «nosotros» del verbo «poder», como en Kiedy możemy się znowu spotkać?
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson03.order.003
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: word_order
  frame:
    text: Czy piątek {item} odpowiada?
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy piątek {item} odpowiada?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Odpowiada lleva en dativo a la persona a quien se pregunta: panu (formal, a un hombre) o ci (informal).'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit03.lesson03.fill.004
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: fill_in_blank
  frame:
    text: Kiedy możemy się znowu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Después de możemy, el segundo verbo se queda en su forma básica, spotkać.
    language_code: es
    direction: ltr
