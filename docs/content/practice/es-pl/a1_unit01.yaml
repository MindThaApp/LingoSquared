templates:
- content_key: practice.es-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'El polaco tiene dos formas de tratamiento: ty con amigos y familia, y pan (a un hombre) o pani (a una mujer) con desconocidos y para mostrar respeto.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Con pan o pani el verbo es ma, como si dijeras «¿cómo está el señor o la señora?»; con ty pasa a masz: Jak się masz?'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pan y pani no son intercambiables: pan se dirige a un hombre y pani a una mujer, mientras que ty es para las personas que conoces bien.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? pregunta cómo está alguien; pan o pani va en medio y el verbo sigue siendo ma.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: ¿Cómo estás? (a un amigo, informal)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Con un amigo la pregunta termina en masz; la versión formal usa ma más pan o pani.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry es el saludo de todo el día hasta la tarde, dobry wieczór se usa por la tarde-noche, y dobranoc solo se dice al despedirse para irse a dormir.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć es la palabra informal tanto para «hola» como para «adiós», así que pertenece a ty, no a pan ni a pani.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia es la despedida estándar; do zobaczenia es el «hasta pronto» más amistoso.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór se usa por la tarde-noche; durante el día se dice dzień dobry.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć sirve tanto de saludo como de despedida, pero solo con personas a las que tratarías de ty.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: ¡Que tengas un buen día!
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia es un deseo, por eso la palabra para «día» cambia su terminación a dnia.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'El polaco suele omitir el pronombre porque la terminación del verbo indica la persona, como en español: jestem significa «soy» o «estoy», jesteś significa «eres» o «estás».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + país dice de dónde eres, y mieszkam w + ciudad dice dónde vives.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Las terminaciones del verbo indican la persona: -m para «yo» (jestem, mieszkam) y -sz o -ś para «tú» informal (masz, jesteś).'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Después de z («de»), el nombre del país cambia de terminación: Kanady.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Una pregunta formal sobre un hombre usa la forma verbal de tercera persona: Czy pan mówi po polsku?'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: ¿De dónde eres? (a un amigo, informal)
    language_code: es
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd pregunta «de dónde»; con un amigo el verbo es jesteś, mientras que la forma formal es Skąd pan jest?
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Mucho gusto.
    language_code: es
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło significa literalmente «muy agradable para mí» y es la respuesta habitual al conocer a alguien.
    language_code: es
    direction: ltr
