templates:
- content_key: practice.es-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Las horas del reloj usan ordinales femeninos (pierwsza, druga, trzecia) porque concuerdan con la palabra sobrentendida godzina.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Para decir la hora, en polaco se dice pierwsza, druga, trzecia, no pierwszy, drugi, trzeci.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Las horas son números ordinales: pierwsza es literalmente «primera», así que la una es la primera hora.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La respuesta a Która jest godzina? es simplemente Jest + la hora, con el ordinal femenino.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? es la forma habitual de preguntar la hora; która es femenino porque godzina lo es.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: Son las tres. (dos palabras)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La hora del reloj es un ordinal femenino, así que «las tres» es trzecia, no trzy.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano es por la mañana, wieczorem por la tarde-noche y w nocy por la noche.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En Ewa wstaje o siódmej rano primero va la hora y después la parte del día.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.translate.003
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje y odjeżdża son formas de tercera persona del singular, que terminan en -e o -a y no en -m.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.match.004
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rano (por la mañana) y wieczorem (por la tarde-noche) no llevan preposición, pero al mediodía y por la noche se dice w południe y w nocy.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.order.005
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Ewa wstaje o siódmej {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wstaje o siódmej {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa wstaje o siódmej rano da primero la hora y después la parte del día.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.order.006
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Pociąg odjeżdża o czwartej po {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu significa por la tarde, mientras que al mediodía es w południe, con otra terminación.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.fill.007
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: fill_in_blank
  frame:
    text: Ewa {item} o siódmej rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje es la forma de tercera persona del singular del verbo, por eso encaja con Ewa.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: ¿A qué hora? (tres palabras)
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie significa «¿a qué hora?», y las dos palabras llevan la terminación que se usa después de o.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: El tren sale a las cuatro de la tarde.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Después de o, la hora cambia de terminación: czwarta pasa a ser o czwartej.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson03.order.001
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: word_order
  frame:
    text: Dobrze, {item} o czwartej po południu?
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może significa «quizá» y suaviza una sugerencia, como en «¿Quizá a las cuatro?»
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit04.lesson03.translate.002
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: translation
  frame:
    text: Vale, ¿quizá a las cuatro de la tarde?
    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może convierte una propuesta en una sugerencia cortés, como en Może o czwartej?
    language_code: es
    direction: ltr
