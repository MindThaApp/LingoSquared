  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mandarynka y pomarańcza son femeninas, mientras que grejpfrut es masculina.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson03.choose.001
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Świeże es la forma plural de «fresco», por eso va con pomidory y banany.
    language_code: es
    direction: ltr
