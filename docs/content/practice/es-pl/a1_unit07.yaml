templates:
- content_key: practice.es-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Con el verbo kosztować el polaco usa adverbios: kosztuje tanio (es barato) y kosztuje drogo (es caro).'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula es femenino porque termina en -a; banan, pomidor, ogórek y ziemniak son masculinos.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje pregunta el precio de una sola cosa, por eso el sustantivo se queda en su forma básica del singular.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El verbo concuerda con el número: kosztuje para una cosa, kosztują para más de una.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: El plátano es barato. (usa el verbo «costar»)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: En polaco se dice que el plátano «cuesta barato», con un adverbio, en lugar de usar un adjetivo con «ser».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować es la forma del diccionario; en las frases se convierte en kosztuje o kosztują.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.choose.001
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pół significa «medio» y va delante de kilo: pół kilo es medio kilo.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.listen.002
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poproszę es una petición educada que se usa al pedir o comprar algo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.match.003
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Después de kilo y pół kilo el sustantivo toma una terminación de plural en -ów: banan pasa a bananów y pomidor pasa a pomidorów.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.order.004
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: word_order
  frame:
    text: Poproszę kilo {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Después de una cantidad como kilo, el sustantivo va en genitivo plural, que en estas palabras termina en -ów.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.fill.005
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: fill_in_blank
  frame:
    text: Poproszę pół {item} bananów. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pół kilo significa medio kilo; kilo en sí no cambia aquí.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.translate.006
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: Quisiera un kilo de tomates.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pomidor cambia a pomidorów después de kilo porque el sustantivo sigue a una cantidad.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit07.lesson02.translate.007
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
