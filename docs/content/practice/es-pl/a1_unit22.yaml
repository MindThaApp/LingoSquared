  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Con quién hablo?».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson03.translate.001
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Puedes repetirlo?».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson04.match.001
  lesson_content_key: pl.a1.unit22.lesson04.wysylanie_sms_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra polaca con su significado en español; las palabras provienen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson05.choose.001
  lesson_content_key: pl.a1.unit22.lesson05.czytanie_rozmowy_sms_owej
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Leer una conversación por mensajes».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson06.translate.001
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Una llamada después del turno».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Con quién hablo? Z kim rozmawiam? (literalmente «¿con quién estoy hablando?») es la frase habitual cuando llama alguien que no conoces; kim es el instrumental después de z.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Puedes repetir eso? Możesz (puedes, de móc) + el infinitivo powtórzyć (repetir) + to (eso).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No hables tan rápido, por favor. Nie mów es el imperativo negativo (no hables); tak szybko significa «tan rápido».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: No te oigo bien.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: No te oigo bien. Nie słyszę cię dobrze expresa un problema para oír; cię es el acusativo de ty y dobrze significa «bien».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Cómo te fue en tu primer turno? Jak ci poszła ...? (literalmente «¿cómo te fue ...?») pregunta por algo que ya ocurrió. Ci es el dativo de ty, y poszła concuerda con el sustantivo femenino zmiana.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Su primer turno fue muy bien. Jego (su, de él) nunca cambia y va antes del sustantivo: jego pierwsza zmiana; el sustantivo femenino no lo afecta.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: Fue muy bien, mejor de lo que pensaba.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Fue muy bien, mejor de lo que pensaba. Poszło es el pasado de iść con la terminación -o («ello»; aquí «salir, resultar»); myślałem es el pasado de myśleć (pensar), con la terminación de hablante masculino.
    language_code: es
    direction: ltr
