    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson01.order.002
  lesson_content_key: pl.a1.unit25.lesson01.wysoki_niski_stary_i
  type: word_order
  frame:
    text: Tomek jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_niski
  answer_derivation:
    kind: render_frame
    frame:
      text: Tomek jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Tomek es bajo. niski significa bajo (masc.).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson01.fill.003
  lesson_content_key: pl.a1.unit25.lesson01.wysoki_niski_stary_i
  type: fill_in_blank
  frame:
    text: Kasia jest {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_wysoka
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_wysoka
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kasia es alta. wysoka significa alta (fem.).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson02.order.002
  lesson_content_key: pl.a1.unit25.lesson02.opisywanie_wlosow
  type: word_order
  frame:
    text: Marek ma krótkie czarne {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_włosy
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek ma krótkie czarne {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek tiene el pelo corto y negro. włosy significa pelo (siempre en plural).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson02.fill.003
  lesson_content_key: pl.a1.unit25.lesson02.opisywanie_wlosow
  type: fill_in_blank
  frame:
    text: Ewa ma {item} włosy. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_blond
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_blond
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ewa tiene el pelo rubio. blond significa rubio.
