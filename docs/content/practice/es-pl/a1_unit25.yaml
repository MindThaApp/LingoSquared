    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson05.order.002
  lesson_content_key: pl.a1.unit25.lesson05.porownanie_tomka_i_kasi
  type: word_order
  frame:
    text: Kasia ma {item} włosy niż Tomek.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_dłuższe
  answer_derivation:
    kind: render_frame
    frame:
      text: Kasia ma {item} włosy niż Tomek.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kasia tiene el pelo más largo que Tomek. Dłuższe (más largo) va en plural para concordar con włosy, y niż (que) introduce la comparación.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson06.order.002
  lesson_content_key: pl.a1.unit25.lesson06.marek_rozpoznaje_nine
  type: word_order
  frame:
    text: Ciebie też miło {item}!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poznać
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciebie też miło {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '¡Encantado de conocerte también! Cierra el diálogo: Marek ha reconocido a Nina gracias a la descripción previa de Ewa.'
    language_code: es
    direction: ltr
