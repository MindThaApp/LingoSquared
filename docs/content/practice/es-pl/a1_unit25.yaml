schema_version: '1.0'
pack_key: practice.es-pl.a1.unit25
source_language: es
target_language: pl
unit_content_key: pl.a1.unit25.wyglad
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_blond
    - w_brązowe
    - w_czarne
    - w_dziewczyna
    - w_długie
    - w_dłuższe
    - w_inaczej
    - w_językowej
    - w_kawiarni
    - w_końcówkę
    - w_liczbie
    - w_mają
    - w_mnogiej
    - w_niebieski
    - w_niski
    - w_nowa
    - w_oczy
    - w_patrz
    - w_podajemy
    - w_poznać
    - w_przychodzi
    - w_przymiotnik
    - w_rozpoznam
    - w_siwe
    - w_stopień
    - w_wiek
    - w_wtedy
    - w_wygląda
    - w_wyglądają
    - w_wyglądasz
    - w_wysoka
    - w_wysoki
    - w_wyższa
    - w_włosy
    - w_zielony
templates:
- content_key: practice.es-pl.pl.a1.unit25.lesson01.choose.001
  lesson_content_key: pl.a1.unit25.lesson01.wysoki_niski_stary_i
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_wysoki
        - w_niski
        - w_wysoka
        - w_wiek
        - w_podajemy
        - w_inaczej
        - w_włosy
        - w_czarne
        - w_blond
        - w_brązowe
        - w_siwe
        - w_długie
        - w_liczbie
        - w_mnogiej
        - w_przymiotnik
        - w_mają
        - w_oczy
        - w_niebieski
        - w_zielony
        - w_końcówkę
        - w_wygląda
        - w_kawiarni
        - w_językowej
        - w_przychodzi
        - w_nowa
        - w_dziewczyna
        - w_wtedy
        - w_rozpoznam
        - w_wyglądają
        - w_wyższa
        - w_wyglądasz
        - w_stopień
        - w_dłuższe
        - w_patrz
        - w_poznać
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre alto, bajo, viejo y joven.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson02.listen.001
  lesson_content_key: pl.a1.unit25.lesson02.opisywanie_wlosow
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre describir el pelo.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson03.translate.001
  lesson_content_key: pl.a1.unit25.lesson03.oczy_i_jak_ktos
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre los ojos y cómo es alguien.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson04.match.001
  lesson_content_key: pl.a1.unit25.lesson04.ewa_opisuje_nine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra polaca con su significado en español; las palabras provienen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson05.choose.001
  lesson_content_key: pl.a1.unit25.lesson05.porownanie_tomka_i_kasi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
