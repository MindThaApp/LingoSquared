    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre comparar a Tomek y Kasia.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson06.translate.001
  lesson_content_key: pl.a1.unit25.lesson06.marek_rozpoznaje_nine
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
