    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson03.order.002
  lesson_content_key: pl.a1.unit25.lesson03.oczy_i_jak_ktos
  type: word_order
  frame:
    text: Marek ma brązowe {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_oczy
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek ma brązowe {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek tiene los ojos marrones. oczy significa ojos.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit25.lesson03.fill.003
  lesson_content_key: pl.a1.unit25.lesson03.oczy_i_jak_ktos
  type: fill_in_blank
  frame:
    text: Jak {item} Ewa? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_wygląda
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_wygląda
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿Cómo es Ewa físicamente? Jak wygląda ...? es la pregunta clave de esta unidad; úsala para preguntar por el aspecto de cualquier persona.
