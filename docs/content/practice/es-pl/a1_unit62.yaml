    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieści
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieści
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Busco una novela con título. powieści significa «de una novela».
    language_code: es
    direction: ltr
