  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Ewa se entera de lo de la librería».'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit62.lesson02.order.002
  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: word_order
  frame:
    text: Ile kosztuje ta {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieść
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje ta {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ¿Cuánto cuesta esta novela? powieść significa «novela».
    language_code: es
    direction: ltr
