    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przepraszam inicia una pregunta educada a un desconocido, por ejemplo para preguntar dónde está un lugar.
    language_code: es
    direction: ltr
