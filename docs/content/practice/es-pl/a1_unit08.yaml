    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: To jest presenta una cosa, y el sustantivo que sigue se queda en su forma básica.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson01.translate.006
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: ¿Dónde está la farmacia?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest más un lugar es la pregunta universal para encontrar algo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson01.translate.007
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
