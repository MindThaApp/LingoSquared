  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przepraszam sirve tanto para «perdón» como para «lo siento», así que el contexto decide el significado.
    language_code: es
    direction: ltr
