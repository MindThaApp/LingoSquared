    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.choose.001
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obok y naprzeciwko van seguidos del genitivo, por eso bank se convierte en banku.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.listen.002
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Los sustantivos masculinos como bank, hotel y park llevan -u después de obok, naprzeciwko y blisko.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.order.003
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Apteka jest obok {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La terminación de genitivo de estos sustantivos masculinos es -u, como en banku, hotelu y parku.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.order.004
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Park jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Park jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Blisko, daleko y niedaleko son adverbios, así que no cambian con ningún sustantivo.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.fill.005
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
