    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Przepraszam se usa tanto para decir «perdón», antes de preguntar algo a un desconocido, como para pedir disculpas.
    language_code: es
    direction: ltr
