    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Naprzeciwko lleva genitivo, por eso hotel se convierte en hotelu.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.translate.006
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: La farmacia está al lado del banco.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Después de obok, el lugar lleva terminación de genitivo, por eso bank se convierte en banku.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit08.lesson02.translate.007
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: '{item}'
    language_code: es
