  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: Me duele la garganta. (empieza por la garganta)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło mnie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gardło es neutro y singular, por eso el verbo es boli.
    language_code: es
    direction: ltr
