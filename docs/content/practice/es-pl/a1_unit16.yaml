- content_key: practice.es-pl.pl.a1.unit16.lesson01.choose.001
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Boli se usa con una sola cosa que duele y bolą con varias, así que zęby lleva bolą.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit16.lesson01.listen.002
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
