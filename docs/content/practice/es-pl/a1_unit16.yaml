    frame:
      text: Gardło {item} boli.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mnie significa «me»; Gardło mnie boli dice literalmente «la garganta me duele».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit16.lesson01.fill.005
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
