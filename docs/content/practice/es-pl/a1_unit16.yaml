    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En polaco se dice literalmente «la cabeza me duele»: la parte del cuerpo es el sujeto y mnie indica quién siente el dolor.'
    language_code: es
    direction: ltr
