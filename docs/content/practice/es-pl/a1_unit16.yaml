      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Boli es la forma de él, ella o ello; la palabra interrogativa Co es lo que duele.
    language_code: es
    direction: ltr
