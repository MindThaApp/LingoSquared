  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_była
    - w_ciepły
    - w_fala
    - w_morze
    - w_morzu
    - w_parasol
    - w_parasole
    - w_parasolem
    - w_piasek
    - w_piasku
    - w_piękne
    - w_plaży
    - w_popływamy
    - w_siedzę
    - w_wydmowa
    - w_zamykają
    - w_zoo
