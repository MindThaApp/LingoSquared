        - w_parasole
        - w_zamykają
        - w_piękne
        - w_popływamy
        - w_piasku
        - w_zoo
        - w_plaży
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Vamos a la playa?».'
    language_code: es
    direction: ltr
