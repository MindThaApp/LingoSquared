  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_była
        - w_morze
        - w_piasek
        - w_ciepły
        - w_fala
        - w_morzu
        - w_parasol
