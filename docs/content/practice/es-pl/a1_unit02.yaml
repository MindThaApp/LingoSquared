templates:
- content_key: practice.es-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En polaco no hay ningún patrón que relacione los números del uno al diez, así que hay que aprender cada palabra por separado.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En polaco, sz suena como una sh (parecida a la ch del francés) y cz como la ch de «chico», así que sześć y cztery empiezan con esos sonidos.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La ć final de pięć, sześć, dziewięć y dziesięć es un sonido suave parecido a una ch; el acento es importante en la ortografía.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć, sześć, dziewięć y dziesięć terminan en la letra ć, mientras que siedem y osiem no, así que hay que cuidar la ortografía de cada una.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + número + lat sirve para decir la edad, como en Mam trzydzieści lat.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile pregunta «cuánto» o «cuántos», y kosztuje es el verbo que lo acompaña al preguntar un precio.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Los números jedenaście, dwanaście y piętnaście terminan en -naście, lo que indica que están entre el 11 y el 19.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile significa «cuánto» para los precios y «cuántos» para las cosas que se cuentan.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Los números como pięć, dwanaście o trzydzieści van seguidos de złotych, mientras que dwa, trzy y cztery llevan złote.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych es la forma de plural que se usa después de pięć, dwadzieścia, pięćdziesiąt y números similares; dwa, trzy y cztery llevan złote.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: ¿Cuánto cuesta esto?
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? es la pregunta habitual para preguntar un precio; aquí to significa «esto» o «eso».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana es el «su» formal para un hombre (pana numer), mientras que twój es el «tu» informal (twój numer).
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu significa literalmente «el número del teléfono», y la segunda palabra es una forma modificada de la palabra para «teléfono».
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój es el «tu» informal y pana el «su» formal para un hombre; cualquiera de los dos encaja delante de numer telefonu.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat va después de números como pięć, dwadzieścia o trzydzieści; lata va después de dwa, trzy, cztery y de los compuestos que terminan en ellos, como en trzydzieści dwa lata.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Tengo treinta y dos años.
    language_code: es
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Como el número termina en dwa, la palabra para «años» es lata y no lat.
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: ¿Cuál es tu número de teléfono? (informal; usa jest)
    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój es el «tu» informal; la versión formal para un hombre es Jaki jest pana numer telefonu?
    language_code: es
    direction: ltr
