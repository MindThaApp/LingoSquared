schema_version: '1.0'
pack_key: practice.es-pl.a1.unit58
source_language: es
target_language: pl
unit_content_key: pl.a1.unit58.targ
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_jabłek
    - w_jabłka
    - w_każdą
    - w_owocami
    - w_piekarni
    - w_podać
    - w_sprzedawca
    - w_sprzedawcę
    - w_stragan
    - w_warzywa
    - w_zatłoczony
templates:
- content_key: practice.es-pl.pl.a1.unit58.lesson01.choose.001
  lesson_content_key: pl.a1.unit58.lesson01.pojdziemy_na_targ
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zatłoczony
        - w_stragan
        - w_warzywa
        - w_jabłka
        - w_sprzedawca
        - w_sprzedawcę
        - w_jabłek
        - w_każdą
        - w_podać
        - w_owocami
        - w_piekarni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre ¿vamos al mercado?'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit58.lesson02.listen.001
