  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre las manzanas y el vendedor.'
    language_code: es
    direction: ltr
- content_key: practice.es-pl.pl.a1.unit58.lesson04.match.001
  lesson_content_key: pl.a1.unit58.lesson04.ceny_na_targu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra polaca con su significado en español; las palabras provienen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
