        - w_pralnia
        - w_pralni
        - w_wyprać
        - w_ubrania
        - w_program
        - w_prania
        - w_wybieram
        - w_jedno
        - w_odbierać
        - w_odbieram
        - w_wybiera
        - w_stopni
        - w_suszarka
        - w_suszarki
        - w_monetami
        - w_kosz
        - w_niosę
        - w_chodźmy
        - w_ciężki
        - w_środy
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Quiero lavar mi ropa».'
    language_code: es
    direction: ltr
