templates:
- content_key: practice.it-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Attraversa la strada. Cruza è l'imperativo di tú di cruzar.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En la esquina significa "all'angolo"; lo spagnolo usa en dove l'italiano usa "a".
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Doblar e girar significano entrambi "girare"; dobla e gira sono i loro imperativi di tú.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: A la izquierda significa "a sinistra" e a la derecha "a destra"; derecho da solo significa "dritto".
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: Vai dritto. (imperativo informale)
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigue viene da seguir, "continuare"; derecho, "dritto", non è derecha, "destra".
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Come arrivo alla biblioteca? Con un luogo maschile, a + el diventa al: ¿Cómo llego al parque?'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fácil ha la stessa forma per i nomi maschili e femminili.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: Non perderti! (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'L''imperativo negativo usa una forma verbale diversa: pierdas, non pierdes.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'In spagnolo le indicazioni stradali si danno di solito con l''imperativo di tú: sigue, dobla, cruza.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desde el mercado significa "dal mercato", il punto di partenza del percorso.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mateo ripete il percorso alla forma yo, sigo e doblo, per controllare di aver capito bene.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: Prego.
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De nada significa letteralmente "di niente"; è la risposta abituale a gracias.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Derecha ("destra") e derecho ("dritto") si distinguono solo per l''ultima vocale: ascolta con attenzione.'
    language_code: it
    direction: ltr
