templates:
- content_key: practice.it-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In spagnolo si usa spesso il singolare el pantalón (anche los pantalones), mentre in italiano di solito si dice "i pantaloni" al plurale.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa e chaqueta sono femminili; pantalón, delantal e zapatos sono maschili.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'I nomi che finiscono in -l aggiungono -es al plurale: delantal, delantales.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Porto la taglia media. Per la taglia che si porta, lo spagnolo usa usar, "usare".
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla è la taglia dei vestiti; per le scarpe si usa invece el número: ¿Qué número tienes?'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: Mi sta male.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Quedar bien o mal indica come ti sta un capo di abbigliamento: me queda bien, mi sta bene.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + infinito esprime un progetto: voy a comprarlo, lo comprerò / ho intenzione di comprarlo. Il pronome lo si attacca alla fine dell''infinito.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso, usas e usan derivano tutti da usar: io indosso, tu indossi, loro indossano.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + aggettivo forma il comparativo: más barato, più economico.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sì, cerchiamo dei grembiuli per il laboratorio. Buscar significa già cercare, quindi buscamos delantales non richiede altre parole.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il commesso offre il suo aiuto con ¿Los ayudo?, posso aiutarvi?
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy viene da ir, andare; è irregolare: voy, vas, va.'
    language_code: it
    direction: ltr
