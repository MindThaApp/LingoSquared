templates:
- content_key: practice.it-es.es.a1.unit06.lesson01.choose.001
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Agua è femminile ma al singolare prende el perché inizia con una a tonica: el agua fría.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson01.listen.002
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Café, menú e sándwich hanno l''accento scritto: l''accento indica la sillaba tonica.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un si usa con i nomi maschili (un café); i nomi femminili vogliono una (una ensalada).
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: 'Vorrei ordinare: {item}, per favore.'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Un altro modo comune di ordinare è para mí + il piatto: para mí, un café.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Querer cambia la radice: quiero, quieres, quiere, ma queremos.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson03.order.001
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: word_order
  frame:
    text: ¿Podemos ver el {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Possiamo vedere il menu? ¿Podemos + infinito? è un modo cortese di chiedere qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: Buon appetito!
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho si dice a chi sta per mangiare, anche agli sconosciuti al tavolo accanto.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson04.fill.001
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: fill_in_blank
  frame:
    text: La {item}, por favor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In Spagna il cameriere di solito aspetta che sia tu a chiedere il conto.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson04.translate.002
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: translation
  frame:
    text: Come dolce, voglio la torta.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: De postre quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De postre significa «come dessert»; qui non serve l'articolo davanti a pastel.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson05.match.001
  lesson_content_key: es.a1.unit06.lesson05.leer_el_menu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Il menú del día spagnolo è un pranzo a prezzo fisso: primo, secondo, postre e di solito pane e bevanda, tutto per un unico prezzo.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson06.translate.001
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comida significa sia «cibo» sia «pranzo», il pasto principale della giornata in Spagna.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson06.choose.002
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il cameriere dice ¿Qué quieren comer? perché quieren si rivolge a voi due.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit06.lesson06.match.003
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Quiero, quieres e quieren sono tutte forme di querer, «volere».
    language_code: it
    direction: ltr
