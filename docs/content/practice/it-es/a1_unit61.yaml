  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_carta
        - w_paquete
        - w_sello
        - w_dirección
        - w_escribir
        - w_llegas
        - w_tardar
        - w_tarda
        - w_empleado
        - w_desea
        - w_compra
        - w_correos
        - w_escribe
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sulla lettera e il pacco.'
    language_code: it
    direction: ltr
