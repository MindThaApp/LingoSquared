schema_version: '1.0'
pack_key: practice.it-es.a1.unit47
source_language: it
target_language: es
unit_content_key: es.a1.unit47.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Italian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_contarte
    - w_devuelvo
    - w_envío
    - w_esperado
    - w_esperar
    - w_hables
    - w_hablo
    - w_llamada
    - w_llamarme
    - w_llamarte
    - w_mensaje
    - w_minutos
    - w_oigo
    - w_oír
    - w_rápido
    - w_significa
    - w_turno
templates:
- content_key: practice.it-es.es.a1.unit47.lesson01.choose.001
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_llamarte
        - w_hablo
        - w_hables
        - w_rápido
        - w_oigo
        - w_mensaje
        - w_envío
        - w_llamarme
        - w_contarte
        - w_devuelvo
        - w_llamada
        - w_minutos
        - w_turno
        - w_esperado
        - w_esperar
        - w_oír
        - w_significa
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su «ti richiamo».'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson02.listen.001
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su «con chi parlo?».'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson03.translate.001
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su «puoi ripetere?».'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson04.match.001
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Abbina ogni parola spagnola al suo significato in italiano; le parole provengono dalle lezioni di questa unità.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson05.choose.001
  lesson_content_key: es.a1.unit47.lesson05.leer_una_conversacion_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su come leggere uno scambio di messaggi.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson06.translate.001
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su una telefonata dopo il turno.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame:
    text: Tengo que {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_llamarte
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo que {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Devo chiamarti. llamarte significa chiamarti.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame:
    text: ¿Con quién {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hablo
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Con quién {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Con chi parlo? ¿Con quién hablo? è la formula standard quando non sai chi sta chiamando.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Non parlare così in fretta, per favore. No hables è l'imperativo negativo informale di hablar; tan rápido (così in fretta) indica il grado.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Non ti sento bene. Oír (sentire) con no ... bien (non bene) indica un problema di udito, diverso da entender (capire); te oigo significa «ti sento».
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Il messaggio è di Elena. mensaje significa messaggio; messaggio di testo.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ti mando un messaggio. Enviar (mandare) va dopo il pronome te (a te): te envío un mensaje.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Com''è andato il tuo primo turno? Ha ido è il passato prossimo di ir (qui «andare», nel senso di svolgersi): ha + il participio ido.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: È andato molto bene, meglio di quanto pensassi. Ha ido muy bien riprende il passato prossimo della domanda; mejor de lo esperado (meglio del previsto) fa il confronto con de lo.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: Grazie, significa molto per me.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Grazie, significa molto per me. Significa è la terza persona di significar (significare); para mí (per me) dice per chi è importante.
    language_code: it
    direction: ltr
