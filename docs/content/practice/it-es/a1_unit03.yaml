templates:
- content_key: practice.it-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le parole della famiglia spesso vanno in coppia per genere: hermano e hermana, hijo e hija.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Il plurale maschile comprende i gruppi misti: padres sono i genitori, hermanos possono essere fratelli e sorelle.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson01.translate.003
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mamá e papá sono le parole di ogni giorno in casa; madre e padre sono neutre.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson02.order.001
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Familia è femminile, quindi «piccola» è pequeña; grande resta uguale per entrambi i generi.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson02.translate.002
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: translation
  frame:
    text: Ho due sorelle.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Per chiedere: ¿Tienes hermanos? usa il plurale maschile, che comprende fratelli e sorelle.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson03.choose.001
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Primo è un cugino e prima una cugina; primos comprende un gruppo misto.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson03.match.002
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Abuelo e abuela al plurale fanno abuelos, i nonni.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson03.order.003
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Vivo con mis {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mis è il plurale di mi: mi abuelo, mis abuelos.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson04.translate.001
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: 'Vivo con: {item}.'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Vivo significa già «vivo», quindi yo non serve.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson04.fill.002
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Somos cinco en {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Somos cinco significa letteralmente «siamo cinque»: in casa siamo in cinque.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson04.order.003
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: ¿Vives cerca de tus {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Vives cerca de tus {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cerca de significa «vicino a»; tus è il plurale di tu, «tuo».
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson05.fill.001
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Mi hermana {item} se llama Sofía. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Menor va dopo il nome e non cambia con il genere: mi hermano menor, mi hermana menor.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson05.choose.002
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vive vuol dire «vive» (lui o lei); viven vuol dire «vivono».
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson06.listen.001
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Qué bonito! è una reazione affettuosa davanti a una foto: che bello!'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson06.translate.002
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: Parliamo al telefono ogni settimana.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hablamos por teléfono cada {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Lo spagnolo dice «al telefono» con por teléfono, e cada non cambia mai: cada día, cada semana.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson06.match.003
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Somos e son vengono entrambi da ser: siamo, sono.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit03.lesson06.translate.004
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le desinenze del verbo spagnolo indicano la persona: vivo, vives, vive, viven.'
    language_code: it
    direction: ltr
