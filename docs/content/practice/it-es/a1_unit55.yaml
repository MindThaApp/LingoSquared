  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bici
        - w_viaja
        - w_coche
        - w_caminar
        - w_conduce
        - w_camina
        - w_viajar
        - w_viajas
        - w_viajo
        - w_transporte
        - w_estación
        - w_compro
        - w_centro
        - w_vas
        - w_normalmente
        - w_prefiere
        - w_conducir
        - w_andando
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul treno, la bici, la macchina e il camminare.'
    language_code: it
    direction: ltr
