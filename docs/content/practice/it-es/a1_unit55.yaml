    - w_compro
    - w_conduce
    - w_conducir
    - w_estación
    - w_normalmente
    - w_prefiere
    - w_transporte
    - w_vas
    - w_viaja
    - w_viajar
    - w_viajas
    - w_viajo
templates:
- content_key: practice.it-es.es.a1.unit55.lesson01.choose.001
