templates:
- content_key: practice.it-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno diventa un davanti a un nome maschile (un huevo) e una davanti a un nome femminile (una taza).
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Seis ha una sola sillaba, siete ne ha due (sie-te): ascolta la t.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Da undici a quindici hanno parole proprie (once, doce, trece, catorce, quince); da sedici in poi si formano a partire da diez: dieciséis.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cien è esattamente cento; oltre il cento lo spagnolo dice ciento: ciento uno.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Lo spagnolo indica l''età con tener, «avere»: come in italiano, si hanno gli anni, non si «è» anni.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Per l''età non usare mai soy: Tengo veinte años, non Soy veinte.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: ¿Cuántos años {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con usted la domanda diventa ¿Cuántos años tiene usted?
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In spagnolo i numeri di telefono si leggono spesso a coppie: 62 41 ... come sesenta y dos, cuarenta y uno.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: word_order
  frame:
    text: ¿Puedes {item}, por favor?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedes {item}, por favor?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Puedes + infinito serve a chiedere qualcosa a un amico; con usted si dice ¿Puede repetir, por favor?
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson04.translate.003
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Por favor, «per favore», e claro, «certo», sono due delle parole più utili in qualsiasi conversazione.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson05.choose.001
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La quantità si collega all''ingrediente con de: dos tazas de harina.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson05.translate.002
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I plurali spagnoli aggiungono -s dopo una vocale (taza, tazas) e -es dopo una consonante.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson05.translate.003
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: Mi servono tre {item}.
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesito tres {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Necesito, «mi serve», viene da necesitar; per chiederlo a un'altra persona si usa ¿Cuántos necesitas?
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson05.fill.004
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: fill_in_blank
  frame:
    text: Media taza de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Taza è femminile, quindi «mezza tazza» è media taza; con un nome maschile si usa medio: medio kilo.'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson06.listen.001
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oye è un modo amichevole per attirare l'attenzione di qualcuno, come «ehi» in italiano.
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson06.translate.002
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: translation
  frame:
    text: Un'altra domanda.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} más.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Más di solito segue il nome: una pregunta más, «un''altra domanda».'
    language_code: it
    direction: ltr
- content_key: practice.it-es.es.a1.unit02.lesson06.match.003
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tengo, tienes e tiene sono tutte forme di tener: ho, hai, ha.'
    language_code: it
    direction: ltr
