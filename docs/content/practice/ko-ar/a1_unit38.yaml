      part_of_speech: adjective
      agreement_tags:
        semantic: w_الوردي
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 분홍색을 원해요. الوردي는 '분홍색인 것'(남성)이라는 뜻이에요.
    language_code: ko
    direction: ltr
