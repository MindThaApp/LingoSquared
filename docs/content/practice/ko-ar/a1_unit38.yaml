- content_key: practice.ko-ar.ar.a1.unit38.lesson03.order.002
  lesson_content_key: ar.a1.unit38.lesson03.wrdy_wbnfsjy
  type: word_order
  frame:
    text: كلمة اللون {item}، فنقول أريد اللون الوردي.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكرة
  answer_derivation:
    kind: render_frame
    frame:
      text: كلمة اللون {item}، فنقول أريد اللون الوردي.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '색을 뜻하는 단어는 남성이라서 그 뒤에 오는 색도 남성형이에요: 분홍색을 원해요. أريد (urīd)는 ''원해요'' 또는 ''~하고 싶어요''라는 뜻이에요. الورود وردية(장미는 분홍색이에요)와 비교해 보세요. 사물의 복수는 여성 단수 형용사를 써요.'
    language_code: ko
    direction: ltr
