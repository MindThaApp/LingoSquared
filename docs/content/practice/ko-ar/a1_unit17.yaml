templates:
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.choose.001
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ألم은 '통증'이에요. الرأس는 '머리', البطن은 '배'이고, 둘 다 ال이 붙어 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.listen.002
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندي ألم في الرأس는 '머리가 아파요'라는 뜻이에요. 신체 부위에는 ال이 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.order.003
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: word_order
  frame:
    text: عندي ألم في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في(~에)는 ال이 붙은 신체 부위와 함께 써요: في الرأس, في البطن.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.fill.004
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: fill_in_blank
  frame:
    text: عندي ألم في {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 머리는 الرأس예요. 이 문장은 '머리가 아파요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم은 '통증'이라는 뜻의 명사예요. 두 신체 부위도 ال이 붙은 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: 머리가 아파요.
    language_code: ko
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي(저에게 ~이 있다)에는 동사가 필요 없어요. عندي ألم은 '통증이 있어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson01.translate.007
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: 배가 아파요.
    language_code: ko
    direction: ltr
  slots:
    a: *id004
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في 뒤에서도 신체 부위는 ال을 그대로 유지해요: في البطن.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.choose.001
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحتاج는 '저는 필요해요', مساعدة는 '도움'이에요. 동사 안에 '저는'이 이미 들어 있어서 따로 대명사를 쓰지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.listen.002
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اشربي는 여성에게 하는 명령형으로, '마시세요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.match.003
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اشربي와 استريحي는 여성에게 하는 명령형이에요. أحتاج는 '저는 필요해요'이고, المشكلة는 ال이 있어서 '그 문제'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.order.004
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: ما {item} يا ليلى؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} يا ليلى؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المشكلة؟는 '무엇이 문제예요?'라는 뜻이고, يا ليلى는 레일라를 부르는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.order.005
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: عندي ألم. أحتاج {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم. أحتاج {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أحتاج 바로 뒤에 필요한 것이 와요: أحتاج مساعدة.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.order.006
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: يا ليلى {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '어미 ـي는 여성에게 하는 명령형을 나타내요: اشربي ماء.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.fill.007
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: اشربي ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و는 다음 단어에 붙여 써요. واستريحي는 '그리고 쉬세요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.fill.008
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: عندي ألم. {item} مساعدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أحتاج는 '저는 필요해요'예요. 앞의 أ가 '저는'을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.translate.009
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اشربي와 استريحي는 여성에게 하는 명령형이고, ـي로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.translate.010
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: 레일라, 물을 마셔요. (여성에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 유수프가 레일라에게 마시라고 말해요. اشربي는 여성형 명령이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit17.lesson02.translate.011
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: 아파요. 도움이 필요해요. ('저는'에 해당하는 별도의 단어가 없어요)
    language_code: ko
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي와 أحتاج는 형태 안에 '저'가 들어 있어서 أنا가 필요 없어요.
    language_code: ko
    direction: ltr
