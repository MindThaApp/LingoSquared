schema_version: '1.0'
pack_key: practice.ko-ar.a1.unit35
source_language: ko
target_language: ar
unit_content_key: ar.a1.unit35.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أيام
    - w_البريد
    - w_الطابع
    - w_الطرد
    - w_تشتري
    - w_تصل
    - w_تكتب
    - w_جدها
    - w_جدي
    - w_طابعا
    - w_طردا
    - w_فنقول
    - w_لجدها
    - w_لجدي
    - w_للرسالة
    - w_مؤنثة
    - w_مذكر
    - w_نمشي
    - w_وأكتب
    - w_والرسالة
    - w_وجدتها
    - w_وجدتي
    - w_وطردا
    - w_يستغرق
    - w_يصل
    - w_يكتب
templates:
- content_key: practice.ko-ar.ar.a1.unit35.lesson01.choose.001
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: &id001
      language_code: ar
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_لجدي
        - w_الطرد
        - w_طردا
        - w_وطردا
        - w_جدي
        - w_وجدتي
        - w_الطابع
        - w_طابعا
        - w_للرسالة
        - w_يكتب
        - w_وأكتب
        - w_يصل
        - w_مذكر
        - w_فنقول
        - w_والرسالة
        - w_مؤنثة
        - w_تصل
        - w_يستغرق
        - w_أيام
        - w_لجدها
        - w_وجدتها
        - w_تشتري
        - w_البريد
        - w_تكتب
        - w_جدها
        - w_نمشي
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 편지와 소포 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson02.listen.001
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 우표와 주소와 쓰기 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson03.translate.001
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 도착하다와 시간이 걸리다 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson05.match.001
  lesson_content_key: ar.a1.unit35.lesson05.lyla_trsl_trda
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 아랍어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단元의 수업에서 나온 것들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson06.choose.001
  lesson_content_key: ar.a1.unit35.lesson06.ila_albyt
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어예요: {item} (''집으로 돌아가요'' 수업에 나왔어요.)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson01.translate.002
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 편지와 소포 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson01.order.003
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: word_order
  frame:
    text: عندي رسالة {item}.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_لجدي
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي رسالة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 할아버지께 드릴 편지가 있어요. لجدي는 '우리 할아버지께'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson01.fill.004
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: fill_in_blank
  frame:
    text: أكتب العنوان على {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الطرد
    hint:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الطرد
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 소포에 주소를 써요. الطرد는 '소포'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson01.translate.005
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: translation
  frame:
    text: 저는 베이루트로 소포를 보내요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_طردا
  answer_derivation:
    kind: render_frame
    frame:
      text: أرسل {item} إلى بيروت.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 베이루트로 소포를 보내요. طردا는 (보내는 대상으로서의) '소포'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson02.order.002
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: word_order
  frame:
    text: أشتري {item} للرسالة.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_طابعا
  answer_derivation:
    kind: render_frame
    frame:
      text: أشتري {item} للرسالة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 편지에 붙일 우표를 사요. طابعا는 (사는 대상으로서의) '우표'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson02.fill.003
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: fill_in_blank
  frame:
    text: أشتري طابعا {item} العنوان على الطرد. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_وأكتب
    hint:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_وأكتب
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 우표를 사고 소포에 주소를 써요. وأكتب는 '그리고 나는 써요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson03.order.002
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: word_order
  frame:
    text: الطرد {item} غدا.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_يصل
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد {item} غدا.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 소포가 내일 도착해요. يصل는 '그가 도착해요, 그것이 도착해요(남성)'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'الطرد는 남성이라서 يصل (yaṣil)이라고 하고, الرسالة는 여성이라서 تصل (taṣil)이라고 해요. 현재형 동사는 주어가 남성이면 ي, 여성이면 ت로 시작해요. 예: الطرد يصل (aṭ-ṭard yaṣil), الرسالة تصل.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson03.translate.004
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: 소포는 내일 도착하고 편지는 3일 걸려요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 소포는 내일 도착하고 편지는 사흘 걸려요. والرسالة는 '그리고 편지'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit35.lesson05.order.002
  lesson_content_key: ar.a1.unit35.lesson05.lyla_trsl_trda
  type: word_order
  frame:
    text: ليلى ترسل طردا إلى جدها {item}.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_وجدتها
  answer_derivation:
    kind: render_frame
    frame:
      text: ليلى ترسل طردا إلى جدها {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 레일라는 할아버지와 할머니께 소포를 보내요. وجدتها는 '그리고 그녀의 할머니'라는 뜻이에요.
    language_code: ko
    direction: ltr
