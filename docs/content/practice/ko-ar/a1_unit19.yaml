    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في بيتي غرفة واحدة은 '우리 집에는 방이 하나 있어요'라는 뜻이고, غرفة이 '방'이에요.
    language_code: ko
    direction: ltr
