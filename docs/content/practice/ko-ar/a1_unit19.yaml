  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item} واحدة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item} واحدة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 숫자 1은 명사 뒤에 오고 명사와 성이 일치해요. غرفة واحدة는 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson01.order.005
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في بيتي는 문장 맨 앞에 와서 '우리 집에'라는 뜻이고, 그 안에 있는 것이 뒤따라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson01.fill.006
  lesson_content_key: ar.a1.unit19.lesson01.rooms
