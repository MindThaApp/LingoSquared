  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: 유수프, 너의 집은 어디야?
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 레일라가 '너의'를 뜻하는 어미 ـك를 써서 유수프에게 물어요.
    language_code: ko
    direction: ltr
