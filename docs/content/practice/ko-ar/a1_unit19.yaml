  feedback_frame:
    text: 집, 방, 부엌, 탁자는 집과 관련된 명사 네 개예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson01.translate.008
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: 우리 집에는 방이 하나 있어요.
    language_code: ko
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في {a} {b} واحدة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어에는 '있다'에 해당하는 동사가 없어요. في بيتي غرفة는 직역하면 '우리 집에 방'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.choose.001
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: طاولة은 탁자예요. الغرفة의 ال은 '그 방'이라는 뜻을 만들어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.listen.002
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندك은 '너는 가지고 있다'라는 뜻이고, عند에 어미 ـك가 붙어 만들어졌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.order.003
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
