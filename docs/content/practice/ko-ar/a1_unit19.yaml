      direction: rtl
  feedback_frame:
    text: في الغرفة은 '방에'라는 뜻이고, 특정한 방을 가리키므로 ال이 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.order.004
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: أين {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 어미 ـك는 '너의'라는 뜻이라서 أين بيتك؟는 '너의 집은 어디예요?'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.order.005
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: هل {item} طاولة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} طاولة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل은 예/아니요로 답하는 의문문을 만들어요. هل عندك طاولة؟는 '탁자가 있어요?'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.fill.006
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: fill_in_blank
  frame:
    text: في بيتي غرفة واحدة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و는 다음 단어에 붙여 써요. ومطبخ는 '그리고 부엌'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.translate.007
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 어미 ـي(나의)와 ـك(너의)는 بيت에 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.translate.008
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: 방에 탁자가 있어요.
    language_code: ko
    direction: ltr
  slots:
    a: *id012
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في الغرفة에서는 في 뒤에도 ال이 그대로 남아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson02.translate.009
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: 탁자가 있어요?
    language_code: ko
    direction: ltr
  slots:
    a: *id009
    b: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل이 질문을 시작하고, 어순은 그대로예요.
    language_code: ko
    direction: ltr
