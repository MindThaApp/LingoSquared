templates:
- content_key: practice.ko-ar.ar.a1.unit19.lesson01.choose.001
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بيت은 집, غرفة은 방, مطبخ는 부엌이에요. 여기서 이 명사들에는 ال이 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit19.lesson01.listen.002
