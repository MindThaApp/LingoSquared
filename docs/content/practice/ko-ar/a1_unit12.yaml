  lesson_content_key: ar.a1.unit12.lesson02.make_a_plan
  type: translation
  frame:
    text: 우리는 내일 카페에 가요.
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: نذهب إلى المقهى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '''우리'' 형태 نذهب는 따로 대명사가 필요 없고 ''우리는 가는 중이다''라는 뜻도 돼요. 시간을 나타내는 말 غدا는 문장 끝에 와요.'
