  frame:
    text: 네, 다섯 시에요. 좋아요. 나중에 봐요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: نعم، في الساعة الخامسة. {item}. إلى اللقاء.
      language_code: ar
      direction: rtl
