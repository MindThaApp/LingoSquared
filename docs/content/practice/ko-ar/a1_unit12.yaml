      - w_غدا
      - w_نذهب
      - w_جيد
  ghadan: &id002
    language_code: ar
    part_of_speech: adverb
    agreement_tags:
      semantic: w_غدا
  nadhhab: &id003
    language_code: ar
    part_of_speech: verb
    agreement_tags:
      semantic: w_نذهب
  jayyid: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_جيد
