templates:
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.choose.001
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ذهبت는 '나는 갔다', اشتريت는 '나는 샀다'라는 뜻이에요. 둘 다 1인칭 과거형 동사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.listen.002
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أمس는 '어제'라는 뜻이에요. 과거형 동사가 이 말과 함께 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.match.003
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 과거형 어미 -ت는 '나'를 나타내요(ذهبت, اشتريت, شربت). فعلت는 이 단원의 질문에서 '너는 했다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.order.004
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: word_order
  frame:
    text: ذهبت إلى السوق {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ذهبت إلى السوق {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أمس(어제)는 보통 문장 끝에 와요: 저는 어제 시장에 갔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.fill.005
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: fill_in_blank
  frame:
    text: ذهبت إلى السوق ثم اشتريت {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفاحا는 산 대상인 '사과'를 나타내서 alif로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.translate.006
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ذهبت은 '제가 갔어요', اشتريت는 '제가 샀어요', تفاحا는 산 대상인 '사과'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.translate.007
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: 저는 어제 시장에 갔어요. ('저는'에 해당하는 별도의 단어는 없어요)
    language_code: ko
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} إلى السوق {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 과거형 어미 -ت가 이미 '저는'을 뜻해서 따로 대명사가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson01.translate.008
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: 저는 사과를 샀어요. ('저는'에 해당하는 별도의 단어는 없어요)
    language_code: ko
    direction: ltr
  slots:
    a: *id006
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '산 대상에는 alif 어미가 붙어요: تفاحا.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.choose.001
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: فعلت은 '당신이 했어요'라는 뜻이에요. ماذا فعلت أمس؟ 어제 뭐 했어요?
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.listen.002
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: شربت은 '제가 마셨어요'예요. 같은 -ت로 끝나는 ذهبت와 비교해 보세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.match.003
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 같은 -ت 어미가 ذهبت, اشتريت, شربت에서 과거를 나타내요. فعلت(당신이 했어요)은 질문 형태에 쓰였어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.order.004
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: word_order
  frame:
    text: ماذا {item} أمس؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} أمس؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ماذا와 과거형 동사를 함께 쓰면 '무엇을 했어요?'라는 뜻이 되고, أمس는 그 시점을 '어제'로 정해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.fill.005
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: fill_in_blank
  frame:
    text: ذهبت إلى السوق. اشتريت تفاحا. {item} قهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شربت은 '제가 마셨어요'예요. 과거형 어미 -ت가 '제가'를 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.fill.006
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: fill_in_blank
  frame:
    text: ماذا {item} أمس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: فعلت은 '하다'의 과거형이에요. 이 질문은 어제 무엇을 했는지 상대에게 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.translate.007
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: فعلت(당신이 했어요)과 شربت(제가 마셨어요)은 -ت 어미가 붙은 과거형 동사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.translate.008
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: '유수프가 레일라에게 물어요: 어제 뭐 했어요?'
    language_code: ko
    direction: ltr
  slots:
    a: *id008
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت은 '당신'을 나타내는 과거형이고, 남자에게든 여자에게든 쓰는 모양이 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit13.lesson02.translate.009
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: 저는 커피를 마셨어요. ('저는'에 해당하는 별도의 단어는 없어요)
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} قهوة'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '과거형은 ''저''를 나타낼 때 -ت 어미를 써요: شربت은 ''제가 마셨어요''예요.'
    language_code: ko
    direction: ltr
