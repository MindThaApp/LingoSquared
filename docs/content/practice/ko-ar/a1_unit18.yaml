- content_key: practice.ko-ar.ar.a1.unit18.lesson01.translate.009
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: 저는 엔지니어예요. (남성이 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 남성은 مهندس라고 말해요. '이다'에 해당하는 동사는 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson01.translate.010
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: 저는 사무실에서 일해요. ('저는'에 해당하는 별도의 단어 없음)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعمل만으로 이미 '저는 일해요'라는 뜻이라서 أنا가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.choose.001
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكتب는 '나는 써요', أقرأ는 '나는 읽어요'예요. 둘 다 1인칭 동사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.listen.002
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: العمل에는 ال이 있어서 '그 일'이에요. في العمل은 '직장에서'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.order.003
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أنا {item} في العمل.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} في العمل.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 이런 동사에는 أنا(나)를 생략해도 돼요. 동사 자체가 이미 '나는 써요', '나는 읽어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.order.004
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أكتب وأقرأ في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب وأقرأ في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في العمل은 '직장에서'라는 뜻이고, ال은 العمل의 일부예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.fill.005
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: fill_in_blank
  frame:
    text: أكتب {item} في العمل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و는 동사에 붙어요. وأقرأ는 '그리고 나는 읽어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.translate.006
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أكتب와 أقرأ는 1인칭 동사이고, العمل은 ال이 붙은 '그 일'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.translate.007
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: 저는 직장에서 써요. ('저는'에 해당하는 별도의 단어 없음)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في에 العمل을 붙이면 '직장에서'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson02.translate.008
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: 저는 직장에서 읽어요. ('저는'에 해당하는 별도의 단어 없음)
    language_code: ko
    direction: ltr
  slots:
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أقرأ في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 동사가 먼저 오고, 그다음에 في와 장소가 와요.
    language_code: ko
    direction: ltr
