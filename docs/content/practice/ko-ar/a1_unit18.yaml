      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어에는 '이다'에 해당하는 단어가 필요 없어요. أنا مهندس는 직역하면 '나 엔지니어'예요.
    language_code: ko
    direction: ltr
