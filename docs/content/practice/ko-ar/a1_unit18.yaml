templates:
- content_key: practice.ko-ar.ar.a1.unit18.lesson01.choose.001
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مهندس는 (남성) 엔지니어예요. 여성형은 ة를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit18.lesson01.listen.002
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
