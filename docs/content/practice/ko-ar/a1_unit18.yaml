    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عمل은 명사 '일'이고, أعمل은 동사 '저는 일해요'예요. أكتب와 أقرأ도 1인칭 동사예요.
    language_code: ko
    direction: ltr
