    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أعمل في مكتب은 '저는 사무실에서 일해요'라는 뜻이에요. أعمل은 1인칭 동사예요.
    language_code: ko
    direction: ltr
