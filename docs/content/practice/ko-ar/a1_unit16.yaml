templates:
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.choose.001
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تذكرة는 표, القطار는 기차, القاهرة는 카이로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.listen.002
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: إلى는 '~로, ~까지'라는 뜻이라서 إلى القاهرة는 '카이로로'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.match.003
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي('어느')는 단수 명사 앞에 오고, الثاني('두 번째')는 꾸미는 명사 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.order.004
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد {item} إلى القاهرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 원하는 것은 أريد 뒤에 오고, إلى('~로')는 목적지를 이끌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.order.005
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد تذكرة إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد تذكرة إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 목적지는 إلى 바로 뒤에 와요. القاهرة의 ال은 도시 이름의 일부예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.fill.006
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: fill_in_blank
  frame:
    text: أريد {item} إلى القاهرة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تذكرة는 표예요. أريد('원해요')에는 '나'를 뜻하는 별도의 단어가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.translate.007
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 일반 명사 두 개와 도시 이름이에요. القاهرة의 ال은 이름 자체에 속해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.translate.008
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: 카이로행 표 한 장 주세요. ('나'를 뜻하는 별도의 단어는 없어요)
    language_code: ko
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 표 요청은 أريد + 표 + إلى + 목적지로 이루어져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson01.translate.009
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: 표를 사고 싶어요. 기차는 5시예요. ('나'를 뜻하는 별도의 단어는 없어요)
    language_code: ko
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '시각은 في الساعة 뒤에 여성형 서수를 붙여 말해요: الساعة الخامسة.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.choose.001
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الرصيف는 승강장이에요. 특정한 승강장이라서 ال이 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.listen.002
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الثاني는 '두 번째'의 남성형이라 남성 명사 الرصيف와 일치해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.order.003
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من أي {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من أي {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أي(''어느'') 뒤의 명사에는 ال이 붙지 않아요: من أي رصيف؟는 ''어느 승강장에서요?''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.order.004
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من الرصيف {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من الرصيف {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '서수는 명사 뒤에 오고 ال도 붙어요: الرصيف الثاني.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.fill.005
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من أي {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'أي 뒤의 명사에는 ال이 없어요: من أي رصيف؟'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.fill.006
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من الرصيف {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '서수에도 명사와 같이 ال이 붙어요: الرصيف الثاني.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.translate.007
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 승강장에 대해 말할 때 쓰는 단어들이에요. أي는 '어느'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.translate.008
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: 어느 승강장에서요?
    language_code: ko
    direction: ltr
  slots:
    a: *id010
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 이 질문은 من + أي + ال이 없는 명사로 이루어져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit16.lesson02.translate.009
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: 2번 승강장에서요.
    language_code: ko
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '명사와 서수 모두 ال이 붙어요: الرصيف الثاني.'
    language_code: ko
    direction: ltr
