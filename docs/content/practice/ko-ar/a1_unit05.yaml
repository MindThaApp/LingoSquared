templates:
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.choose.001
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الساعة는 ال(정관사)와 ساعة(시간)가 합쳐진 말로, 시간과 시각을 모두 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.match.002
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 시각을 나타내는 서수는 الساعة에 맞춰 여성형이에요. الثالثة와 الخامسة처럼 ة로 끝나요. 날짜에 쓰는 남성형 서수와는 달라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.order.003
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '시각은 الساعة 바로 뒤에 오고 성이 일치해서 둘 다 여성형이에요: الساعة الثالثة.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.fill.004
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم الساعة؟는 직역하면 '시간이 얼마예요?'로, 몇 시인지 물을 때 쓰는 일반적인 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.translate.005
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: صباحا는 '아침에', '오전에'라는 뜻으로 시각 뒤에 와요. 저녁에는 이 단원에서 مساء를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.translate.006
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: 3시예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 시각을 나타내는 서수 الثالثة는 الساعة에 맞춰 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.translate.007
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: 새벽 다섯 시예요.
    language_code: ko
    direction: ltr
  slots:
    a: *id006
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '하루 중 시간대는 맨 끝에 와요: الساعة الخامسة صباحا.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.order.008
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة الخامسة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة الخامسة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 시각 뒤에 صباحا(아침)를 붙이고, 오후나 저녁에는 مساء를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson02.listen.001
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: متى는 '언제'라는 의문사로, 시간을 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson02.match.002
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ومتى는 و('그리고')와 متى('언제')가 붙은 말로, '그럼 언제요?'라는 뜻이에요. 두 번째 질문으로 넘어갈 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson02.order.003
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: word_order
  frame:
    text: الدرس في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '숫자 앞의 في الساعة는 일이 일어나는 시각을 나타내요: 세 시에.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson02.fill.004
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: fill_in_blank
  frame:
    text: كم الساعة؟ الساعة الثالثة. {item} الدرس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ومتى의 و는 질문을 방금 한 말과 이어 줘요. 한국어의 '그럼', '그리고'와 비슷해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson02.translate.005
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متى는 '언제'를 묻고, ومتى는 '그럼 언제요?'를 물어요. 앞선 질문에 이어질 때는 두 번째만 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson02.translate.006
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: 수업은 5시예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة 뒤에 시각을 붙이면 그 시각에 라는 뜻이에요: الدرس في الساعة الخامسة.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit05.lesson01.listen.009
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 공통된 어미 ة는 الثالثة와 الخامسة가 여성형 서수임을 나타내요.
    language_code: ko
    direction: ltr
