schema_version: '1.0'
pack_key: practice.ko-ar.a1.unit34
source_language: ko
target_language: ar
unit_content_key: ar.a1.unit34.neighbourhood
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أسكن
    - w_أسلم
    - w_الجار
    - w_الحي
    - w_السوبرماركت
    - w_جار
    - w_جاري
    - w_حيك
    - w_حيي
    - w_وجارتي
    - w_ودود
    - w_ويحب
    - w_ويسلم
    - w_يسكن
    - w_يسلم
    - w_يعجبني
    - w_يعرف
    - w_يعرفان
templates:
- content_key: practice.ko-ar.ar.a1.unit34.lesson01.choose.001
  lesson_content_key: ar.a1.unit34.lesson01.alhy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: &id001
      language_code: ar
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_الحي
        - w_أسكن
        - w_السوبرماركت
        - w_حيي
        - w_الجار
        - w_جاري
        - w_يعرف
        - w_وجارتي
        - w_ودود
        - w_يسلم
        - w_أسلم
        - w_ويحب
        - w_يسكن
        - w_جار
        - w_ويسلم
        - w_يعرفان
        - w_يعجبني
        - w_حيك
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 동네에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit34.lesson02.listen.001
  lesson_content_key: ar.a1.unit34.lesson02.jary_wjarty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 남녀 이웃에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit34.lesson03.translate.001
  lesson_content_key: ar.a1.unit34.lesson03.wdwd_wyslm
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 친절함과 인사에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit34.lesson05.match.001
  lesson_content_key: ar.a1.unit34.lesson05.mn_hw_mn_fy
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 아랍어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단元의 수업에서 나온 것들이에요.
    language_code: ko
    direction: ltr
