templates:
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب는 '좋아해요'라는 동사로, 좋아하는 대상이 바로 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.listen.002
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ولا는 و(그리고)에 لا(아니다)가 붙은 말로, '그리고 ~ 않아요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.match.003
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب는 '좋아해요', أفضل는 '더 좋아해요'예요. ولا(그리고 ~ 않아요)는 부정문을 앞 문장에 이어 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '좋아하는 대상은 أحب 뒤에 오고, 일반적인 종류에는 ال을 붙여요: أحب القهوة는 ''커피를 좋아해요''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: '동사 앞의 لا가 부정을 만들어요: لا أحب는 ''좋아하지 않아요''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا는 부정문을 이어 줘요: 커피는 좋아하고 차는 좋아하지 않아요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا(저)를 강조하려고 덧붙일 수 있지만, أحب만으로도 이미 '좋아해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي는 관사 없는 '차'이고, الماء는 ال이 붙은 '물'이에요. أحب는 '좋아해요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: 물을 좋아해요. ('저는'에 해당하는 별도의 단어는 없어요)
    language_code: ko
    direction: ltr
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어는 أحب 뒤에서 일반적인 것에 ال을 붙여요. 그래서 '물을 좋아해요'는 أحب الماء예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: 이것은 차예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'ال이 없으면 شاي는 그냥 ''차''이고, 아랍어에는 ''~이다''에 해당하는 단어가 필요 없어요: هذا شاي.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل는 '더 좋아해요'이고, 접두사 ت가 붙은 تفضل은 남성에게 하는 '당신' 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.listen.002
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل은 남자에게 하는 ''당신이 더 좋아해요''예요: ماذا تفضل يا يوسف؟'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: ماذا {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 접두사 ت는 '당신'을 나타내요. ماذا تفضل؟는 남자에게 무엇을 더 좋아하는지 묻는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: أفضل {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أفضل {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أفضل 뒤에는 ال이 붙은 선호 대상이 와요: أفضل القهوة.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.fill.005
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: fill_in_blank
  frame:
    text: أنا {item} القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل는 '더 좋아해요'이고, 접두사 أ가 '저'를 나타내요. أحب, أريد도 마찬가지예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.translate.006
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل는 '제가 더 좋아해요', تفضل은 '당신(남성)이 더 좋아해요'예요. 접두사 أ 또는 ت로 누구인지 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit14.lesson02.translate.007
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: 유수프, 뭘 더 좋아해요?
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 유수프는 남자라서 '당신' 형태는 تفضل이에요.
    language_code: ko
    direction: ltr
