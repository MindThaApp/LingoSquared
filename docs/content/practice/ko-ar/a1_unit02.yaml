templates:
- content_key: practice.ko-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 아랍어는 어미로 소유를 나타내요. اسم = 이름, اسمي = 내 이름, اسمك = 당신의 이름이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson01.match.002
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 어미 ـي는 '나의'(اسمي), ـك는 '당신의'(اسمك)를 뜻해요. '당신의'를 나타내는 표기는 남자에게나 여자에게나 똑같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson01.fill.003
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما는 '무엇'이라는 뜻이에요. 그래서 ما اسمك을 직역하면 '무엇 당신의 이름'이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson01.translate.004
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا(나)는 أنا سارة처럼 간단한 문장에서 쓰여요. 아랍어에서는 '이에요'에 해당하는 별도의 단어가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson01.translate.005
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: 제 이름은 {item}인데요.
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 이름은 소리 나는 대로 써요. 아랍어에는 대문자가 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson02.choose.001
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: لبنان, مصر 같은 나라 이름에는 관사가 붙지 않지만, الأردن, المغرب, العراق에는 ال이 이름의 일부로 들어 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson02.match.002
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 관사 ال은 الأردن, المغرب, العراق라는 이름의 일부예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson02.order.003
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: word_order
  frame:
    text: أنا من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من은 '~에서'라는 뜻이에요. 그래서 أنا من 뒤에 장소를 붙이면 어디 출신인지 말할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: fill_in_blank
  frame:
    text: من {item} أنت؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين은 '어디'라는 의문사예요. من أين أنت는 남자에게나 여자에게나 '어디에서 왔어요?'라는 뜻으로 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson02.translate.005
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنت은 '당신'이라는 뜻이에요. 모음 표기 없이 쓰면 남자와 여자가 똑같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: 저는 {item}에서 왔어요.
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어에는 '이에요'에 해당하는 단어가 없어요. أنا من 뒤에 장소를 붙이면 그것만으로 '저는 ~에서 왔어요'라는 뜻이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson03.listen.001
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 예/아니요로 답하는 질문은 هل로 시작하고, 대답은 '네'를 뜻하는 نعم이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson03.order.002
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: word_order
  frame:
    text: سعدت {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: سعدت بلقائك는 헤어질 때 쓰는 공손한 표현이에요. 직역하면 '만남으로 기뻤어요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson03.fill.003
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: fill_in_blank
  frame:
    text: هل أنت من مصر؟ {item}، أنا من مصر. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نعم은 '네'라는 뜻이에요. 대답할 때는 예/아니요 의문사가 따로 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson03.translate.004
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: translation
  frame:
    text: 만나서 반가웠어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بلقائك의 어미 ـك 표기는 남자에게나 여자에게나 똑같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson04.choose.001
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: دائما는 '항상'이라는 뜻이에요. مرحبا بك 뒤에 붙여서 '언제든 환영해요'라고 말할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson04.fill.002
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: fill_in_blank
  frame:
    text: مرحبا بك {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مرحبا بك دائما는 '언제나 환영해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit02.lesson04.translate.003
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سعدت은 '나'를 뜻하는 어미 ـت가 붙은 과거형 동사예요. 그래서 '기뻤어요'라는 뜻이 돼요.
    language_code: ko
    direction: ltr
