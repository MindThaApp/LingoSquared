        - w_الحفل
        - w_الموسيقي
        - w_حفل
        - w_موسيقي
        - w_جميلا
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''박물관에 가고 싶어요'' 수업에 나와요.'
    language_code: ko
    direction: ltr
