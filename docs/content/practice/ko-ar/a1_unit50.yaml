  lesson_content_key: ar.a1.unit50.lesson05.qraaa_lwha_almalwmat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 아랍어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단元의 수업에서 나온 것들이에요.
    language_code: ko
    direction: ltr
