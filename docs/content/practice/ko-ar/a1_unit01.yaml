templates:
- content_key: practice.ko-ar.ar.a1.unit01.lesson01.choose.001
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 아랍어는 오른쪽에서 왼쪽으로 쓰고, ر와 ا는 뒤에 오는 글자와 이어지지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit01.lesson01.match.002
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: matching_pairs
