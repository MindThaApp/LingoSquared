    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_تسكن
  answer_derivation:
    kind: render_frame
    frame:
      text: سارة {item} قريبا وتمشي إلى عملها.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 사라는 가까이 살아서 걸어서 직장에 가요. تسكن는 '그녀가 산다'라는 뜻이에요.
    language_code: ko
    direction: ltr
