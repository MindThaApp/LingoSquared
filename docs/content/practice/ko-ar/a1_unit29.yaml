  lesson_content_key: ar.a1.unit29.lesson03.shraa_tdhkra
  type: fill_in_blank
  frame:
    text: عند شباك التذاكر نقول من فضلك {item} التذكرة بأدب. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_لطلب
    hint:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_لطلب
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '매표소에서는 정중하게 부탁할 때 من فضلك (min faḍlik, 부탁해요)를 써요: تذكرة إلى القاهرة، من فضلك. 남성에게도 여성에게도 똑같이 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit29.lesson05.order.002
  lesson_content_key: ar.a1.unit29.lesson05.kyf_ysafr_kl_wahd
  type: word_order
  frame:
