- content_key: practice.ko-ar.ar.a1.unit29.lesson01.order.002
  lesson_content_key: ar.a1.unit29.lesson01.alqtar_waldraja_walsyara_walmshy
  type: word_order
  frame:
    text: يوسف يركب {item} إلى عمله.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الدراجة
  answer_derivation:
    kind: render_frame
    frame:
      text: يوسف يركب {item} إلى عمله.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 유수프는 자전거를 타고 직장에 가요. الدراجة는 '자전거'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit29.lesson01.fill.003
  lesson_content_key: ar.a1.unit29.lesson01.alqtar_waldraja_walsyara_walmshy
  type: fill_in_blank
  frame:
    text: ليلى {item} بالقطار. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_تسافر
    hint:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_تسافر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 레일라는 기차로 이동해요. تسافر는 '그녀가 이동한다', '너(남성)가 이동한다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit29.lesson01.translate.004
  lesson_content_key: ar.a1.unit29.lesson01.alqtar_waldraja_walsyara_walmshy
  type: translation
  frame:
    text: 유수프는 자주 자전거를 타고 직장에 가요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_يركب
  answer_derivation:
    kind: render_frame
    frame:
      text: يوسف {item} الدراجة إلى عمله كثيرا.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 유수프는 자주 자전거를 타고 직장에 가요. يركب는 '그가 탄다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit29.lesson03.order.002
  lesson_content_key: ar.a1.unit29.lesson03.shraa_tdhkra
  type: word_order
  frame:
