      direction: rtl
  feedback_frame:
    text: 결제 방법은 동사 뒤에 와요. بالبطاقة는 '카드로', نقدا는 '현금으로'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson01.fill.005
  lesson_content_key: ar.a1.unit24.lesson01.pay_method
  type: fill_in_blank
  frame:
    text: سأدفع {item}. ({hint})
    language_code: ar
    direction: rtl
