      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بالبطاقة의 ب는 '~로'라는 뜻이며 명사에 붙여 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson01.fill.006
  lesson_content_key: ar.a1.unit24.lesson01.pay_method
