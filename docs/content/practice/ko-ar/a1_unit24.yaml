    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: سأدفع {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 접두사 س는 동사를 미래로 만들고, بالبطاقة는 '카드로'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson01.translate.009
  lesson_content_key: ar.a1.unit24.lesson01.pay_method
  type: translation
  frame:
    text: 현금으로 내요. ('저는'에 해당하는 별도의 단어는 없어요.)
    language_code: ko
    direction: ltr
  slots:
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أدفع {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 현재형 동사 أدفع에는 이미 '제가'라는 뜻이 들어 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.choose.001
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: المبلغ는 ال가 붙은 '금액'이라는 뜻으로, 판매자가 كم 뒤에 말하는 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.listen.002
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أستطيع는 '(제가) ~할 수 있어요'라는 뜻이고, 뒤에 '결제하기'라는 뜻의 الدفع가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.order.003
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: word_order
  frame:
    text: كم {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: كم المبلغ؟는 '금액이 얼마예요?'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.order.004
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: word_order
  frame:
    text: هل {item} الدفع بالبطاقة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} الدفع بالبطاقة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 의문사 هل이 맨 앞에 오고, 그다음에 '할 수 있다'는 동사가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.order.005
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: word_order
  frame:
    text: هل أستطيع {item} بالبطاقة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: هل أستطيع {item} بالبطاقة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: الدفع는 ال가 붙은 '결제하기'라는 명사예요. أستطيع 뒤에서 할 수 있는 일을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.fill.006
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: fill_in_blank
  frame:
    text: هل {item} الدفع بالبطاقة؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أستطيع는 '(제가) ~할 수 있어요'라는 뜻이라 '제가'에 해당하는 별도의 단어는 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.translate.007
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: المبلغ와 الدفع는 ال가 붙은 명사이고, أستطيع는 '(제가) ~할 수 있어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.translate.008
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: translation
  frame:
    text: 금액이 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어에는 '~이다'에 해당하는 단어가 필요 없어요. كم المبلغ؟는 문자 그대로 '얼마 금액'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson02.translate.009
  lesson_content_key: ar.a1.unit24.lesson02.amount_payment
  type: translation
  frame:
    text: 카드로 결제해도 될까요? ('저는'에 해당하는 별도의 단어는 없어요.)
    language_code: ko
    direction: ltr
  slots:
    a: *id010
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: هل أستطيع {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 이 문형은 هل + '할 수 있어요' + 명사 '결제하기'로 이루어져요.
    language_code: ko
    direction: ltr
