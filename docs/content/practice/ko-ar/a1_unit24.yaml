  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نقدا는 '현금으로'라는 뜻이며 동사 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit24.lesson01.translate.007
  lesson_content_key: ar.a1.unit24.lesson01.pay_method
