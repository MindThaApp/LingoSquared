    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 동사 앞에 접두사 س가 붙으면 미래가 돼요. سأدفع는 '낼 거예요', أدفع는 '내요'예요.
    language_code: ko
    direction: ltr
