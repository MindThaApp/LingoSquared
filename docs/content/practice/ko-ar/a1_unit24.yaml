    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أدفع와 أستطيع는 1인칭 동사예요. المبلغ에는 ال가 붙어 있고 '금액'이라는 뜻이에요.
    language_code: ko
    direction: ltr
