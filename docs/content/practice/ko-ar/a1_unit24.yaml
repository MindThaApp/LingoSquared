templates:
- content_key: practice.ko-ar.ar.a1.unit24.lesson01.choose.001
  lesson_content_key: ar.a1.unit24.lesson01.pay_method
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مال은 '돈', بطاقة는 '카드', نقدا는 '현금'이고, أدفع는 '(제가) 내요'예요.
    language_code: ko
    direction: ltr
