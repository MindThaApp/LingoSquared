schema_version: '1.0'
pack_key: practice.ko-ar.a1.unit15
source_language: ko
target_language: ar
unit_content_key: ar.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أكبر
    - w_أصغر
    - w_أقرب
    - w_أرخص
    - w_والسوق
slot_presets:
  l1: &id001
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
  comp4: &id002
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
      - w_أرخص
  l2: &id005
    language_code: ar
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - w_أرخص
      - w_والسوق
      - w_أكبر
      - w_أقرب
  akbar:
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أكبر
  asghar: &id003
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أصغر
  aqrab: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أقرب
  arkhas: &id006
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أرخص
  walsuq: &id007
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_والسوق
templates:
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر, أصغر, أقرب는 비교급이고, 뒤에 من('~보다')이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 비교급 형용사는 비교할 때 하나의 형태만 쓰고, 뒤에 من이 와요. أقرب من은 '~보다 더 가까운'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 비교급은 비교하는 두 대상 사이에 오고, 두 번째 대상 앞에 من('~보다')을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어에는 '~이다'에 해당하는 단어가 필요 없어요. المقهى أصغر من السوق는 직역하면 '카페 더 작은 시장보다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.fill.005
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: fill_in_blank
  frame:
    text: المقهى {item} من السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أصغر는 '더 작은'이라는 뜻이고, 같은 형태로 '더 큰'이라는 뜻의 أكبر도 만들어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.translate.006
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 비교급은 짧은 아랍어 형용사이고, '더'에 해당하는 별도의 단어가 없어요. 뒤에는 من이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: 카페는 시장보다 작아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 비교급은 한 가지 형태로 쓰고, 뒤에 من('~보다')이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: 카페가 시장보다 더 가까워요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب은 '가까운'에서 나온 '더 가까운'이라는 뜻이고, 뒤에 من이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص는 '더 싼'이라는 뜻이고, 다른 비교급과 같은 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: والسوق는 و('그리고')와 السوق('시장')를 한 단어로 붙여 쓴 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أرخص는 '더 싼'이라는 뜻이에요. الماء أرخص من القهوة는 '물이 커피보다 더 싸요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '''더 싼''도 같은 비교급 형태를 쓰고, 뒤에 من이 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 네 가지는 비교급이에요. 더 큰, 더 작은, 더 가까운, 더 싼.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: 물이 커피보다 더 싸요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 비교급은 두 번째 대상 앞에 من을 써요. '커피보다 더 싼'처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit15.lesson02.translate.007
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: 카페가 시장보다 더 가깝고, 시장은 카페보다 더 커요.
    language_code: ko
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: و('그리고')는 뒤따르는 단어에 붙여 써요. والسوق처럼요.
    language_code: ko
    direction: ltr
