    text: 카림은 일기예보를 찾아봐요. يبحث의 뜻은 '그가 찾는다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit30.lesson03.translate.004
  lesson_content_key: ar.a1.unit30.lesson03.albhth_an_shya
  type: translation
  frame:
    text: 그러고 나서 그는 조깅하러 가요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_للركض
  answer_derivation:
    kind: render_frame
    frame:
      text: ثم يذهب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 그러고 나서 그는 달리기하러 가요. ثم (thumma)는 '그러고 나서'라는 뜻이고, و와 달리 따로 떨어진 단어예요. يذهب للركض (yadhhab li-r-rakḍ)는 '달리기하러 간다'라는 뜻이에요. ل + الركض이 للركض가 돼요.
    language_code: ko
    direction: ltr
