  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الخامس(다섯째) 같은 서수는 ال이 붙고, 남성 명사인 يوم(날)을 가리키므로 여기서는 남성형이에요.
    language_code: ko
    direction: ltr
