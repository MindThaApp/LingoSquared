    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم الخامس من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어 날짜는 일을 먼저 읽고, 그다음에 من(~의)과 월을 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit04.lesson01.fill.004
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: fill_in_blank
  frame:
    text: ما {item} اليوم؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟는 오늘 날짜를 물을 때 가장 흔히 쓰는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit04.lesson01.translate.005
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 월 이름은 한 단어로 써요. مايو는 5월, يونيو는 6월이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit04.lesson01.translate.006
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: 오늘 날짜가 어떻게 돼요?
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 날짜 질문은 ما(무엇), تاريخ(날짜), اليوم(오늘)으로 이루어져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit04.lesson02.listen.001
