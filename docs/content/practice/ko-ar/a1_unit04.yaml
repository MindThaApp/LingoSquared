    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 월 이름 مايو와 يونيو는 국제 달력의 이름인 May(5월), June(6월)을 따른 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit04.lesson01.order.003
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: word_order
  frame:
