templates:
- content_key: practice.ko-ar.ar.a1.unit04.lesson01.choose.001
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اليوم은 직역하면 '그날'이라는 뜻으로, 정관사 ال이 앞에 붙은 형태예요. 아랍어에서는 이렇게 '오늘'을 말해요.
    language_code: ko
    direction: ltr
