templates:
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين은 '오른쪽'이라는 명사이고, اليسار는 '왼쪽'으로 ال이 붙은 형태예요. 관사 ال이 붙어서 '왼쪽'이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.listen.002
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام은 '앞'이라는 뜻이고, إلى الأمام은 '앞으로 쭉'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
    text: امش إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'إلى(''~로'')는 방향 앞에 오고, 방향에는 ال이 붙어요: الأمام, اليمين, اليسار.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.fill.004
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: امش إلى {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: إلى الأمام은 '앞으로 쭉'이라고 말할 때 가장 흔히 쓰는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.translate.005
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يمين은 '오른쪽'이라는 방향이고, يسار의 반대말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.translate.006
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: 앞으로 쭉 가세요. (남성에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: امش는 남성에게 하는 명령형이고, إلى الأمام은 '앞으로'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson01.translate.007
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: 오른쪽으로 가세요. (남성에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: إلى 뒤의 방향에는 ال이 붙어요. اليمين은 '오른쪽'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.choose.001
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: امش는 남성에게 하는 '걸으세요'라는 명령형이고, ثم은 '그다음에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.listen.002
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ثم은 두 단계를 순서대로 이어 줘요. '그다음에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.order.003
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: word_order
  frame:
    text: امش إلى الأمام ثم إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى الأمام ثم إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ثم('그다음에')은 첫 단계와 둘째 단계를 이어 주며, 각 단계에 자기 إلى가 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.fill.004
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
