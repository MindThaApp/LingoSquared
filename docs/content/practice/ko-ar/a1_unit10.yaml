    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ثم은 '그다음에'라는 뜻이고, 두 방향 사이에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.fill.005
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} إلى الأمام. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: امش는 남성 한 명에게 하는 명령형이고, أين المكتبة؟에 대한 대답은 길 안내예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.translate.006
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
