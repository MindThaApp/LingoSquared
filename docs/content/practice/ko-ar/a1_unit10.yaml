  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: 왼쪽으로 가세요. (남성에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اليسار는 '왼쪽'이고, 반대말은 اليمين이에요.
    language_code: ko
    direction: ltr
