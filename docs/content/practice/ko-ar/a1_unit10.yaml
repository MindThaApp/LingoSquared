  feedback_frame:
    text: ثم은 '그다음에', امش는 남성에게 하는 '걸으세요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit10.lesson02.translate.007
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: 앞으로 쭉 가다가 오른쪽으로 가세요. (남성에게)
    language_code: ko
    direction: ltr
  slots:
    a: *id004
    b: *id007
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {a} {b} إلى {c}
