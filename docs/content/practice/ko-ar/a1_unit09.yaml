  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين의 و는 새 질문을 앞선 질문과 이어 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.translate.006
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين은 '그럼 어디'라는 후속 질문이고, قرب는 '근처'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.translate.007
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: 도서관은 시장 근처에 있어요.
    language_code: ko
    direction: ltr
  slots:
    a: *id004
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'قرب 뒤의 장소 명사에는 ال가 그대로 붙어요: قرب السوق는 ''시장 근처''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.translate.008
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: 카페는 도서관 근처에 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 이 단원의 대화에서 وأين المقهى؟에 바로 이 문장으로 대답해요.
    language_code: ko
    direction: ltr
