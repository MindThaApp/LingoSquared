    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب(근처)는 가까운 대상인 장소 앞에 와요. 여기서는 시장이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson01.translate.006
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
