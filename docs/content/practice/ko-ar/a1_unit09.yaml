    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مكتبة(도서관), سوق(시장), مقهى(카페)는 장소예요. مكان은 '장소'를 뜻하는 일반적인 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson01.translate.007
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: 도서관은 어디에 있어요?
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال는 아랍어의 '그'에 해당하며, 명사 앞에 붙여 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson01.translate.008
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: 시장은 어디에 있어요?
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 아랍어에는 '있다'에 해당하는 단어가 필요 없어요. أين السوق؟는 직역하면 '어디 시장'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson01.order.009
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: المكتبة {item} قرب السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هنا(여기)는 قرب 앞에 올 수 있어요: 도서관은 여기, 시장 근처에 있어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.choose.001
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قرب는 '근처'라는 뜻이고, 바로 뒤에 장소 명사가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.listen.002
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: وأين은 و(그리고)와 أين(어디)이 붙은 말로, '그럼 어디'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.order.003
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: المقهى قرب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: قرب 뒤에는 다른 단어가 필요 없어요. المقهى قرب المكتبة는 '카페는 도서관 근처에 있어요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ar.ar.a1.unit09.lesson02.order.004
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: وأين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
