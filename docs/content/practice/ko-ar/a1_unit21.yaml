    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد قميصا أزرق는 '파란 셔츠를 원해요'라는 뜻이에요. 원하는 대상인 셔츠에는 어미 ـا가 붙어요.
    language_code: ko
    direction: ltr
