  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد {item} أزرق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} أزرق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أريد 뒤에서 원하는 대상은 탄윈으로 끝나요: قميصا. 색깔은 명사 뒤에 와요.'
