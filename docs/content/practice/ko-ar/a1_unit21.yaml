templates:
- content_key: practice.ko-ar.ar.a1.unit21.lesson01.choose.001
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ملابس는 '옷', قميص는 '셔츠', أزرق는 '파란색'(남성형)이에요.
    language_code: ko
    direction: ltr
