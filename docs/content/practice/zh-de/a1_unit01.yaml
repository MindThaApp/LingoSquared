templates:
- content_key: practice.zh-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen 用于早晨，Guten Tag 用于白天，Guten Abend 则从傍晚开始使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss 是随意的道别语；Auf Wiedersehen 是对陌生人或在正式场合使用的礼貌说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 德语的“你”有两种说法：Sie 是正式称呼，用于陌生人或公务人员；du 是非正式称呼，用于朋友、家人或儿童。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte 既可以表示“请”，也可以表示“不客气”；Entschuldigung 可以用来引起他人注意或表示歉意。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? 是正式的“您好吗？”；询问朋友时则说 Wie geht's?
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: word_order
  frame:
    text: Bis {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis 表示“直到”，所以 Bis bald 相当于“回头见”，Bis später 则是“待会儿见”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson01.order.002
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: word_order
  frame:
    text: Guten {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: 因为 Morgen、Tag 和 Abend 都是阳性名词，所以 Guten 以 -n 结尾；阴性名词 Nacht 则搭配 Gute Nacht。
    language_code: zh
    direction: ltr
