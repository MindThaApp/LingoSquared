    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Danke 和 bitte 是两个日常礼貌用语；bitte 还可以表示“不客气”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson03.fill.004
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: fill_in_blank
  frame:
    text: Und {item}? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这里的非正式形式是小写的 dir；正式问法是 Und Ihnen?
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson04.fill.003
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: fill_in_blank
  frame:
    text: '{item} geschehen. ({hint})'
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gern geschehen 是回应 danke 的标准说法，字面意思近似于“乐意如此”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson01.translate.003
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 所有德语名词的首字母都要大写，所以 Morgen、Tag、Abend 和 Nacht 都以大写字母开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson03.translate.005
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sie 和 du 是表示“您／你”的主格形式；Ihnen 和 dir 则是表示“给您／给你”的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson04.translate.004
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kein Problem 是回应感谢或轻微道歉的日常说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson01.translate.004
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: '{item}好！'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten Tag 从上午较晚时段开始使用，也可作为通用的“你好”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson02.translate.004
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: translation
  frame:
    text: '{item}见！'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis bald 和 Bis später 都比较随意；Auf Wiedersehen 是正式的道别语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson03.translate.006
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: 您好吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: 在正式称呼中，Sie 和 Ihnen 的首字母要大写，因此 Ihnen 中的大写 I 是其拼写的一部分。
    language_code: zh
    direction: ltr
