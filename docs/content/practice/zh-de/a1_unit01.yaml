  feedback_frame:
    text: Tschüss 用于非正式场合；Auf Wiedersehen 是对不太熟悉的人使用的礼貌道别语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit01.lesson03.match.003
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: matching_pairs
