    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kaffee 是阳性名词，所以点一杯咖啡要说 einen Kaffee。
