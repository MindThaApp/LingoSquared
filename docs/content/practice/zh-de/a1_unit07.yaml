  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Machen 也可以用于报总价：Das macht neun Euro。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit07.lesson01.translate.014
  lesson_content_key: de.a1.unit07.lesson01.essen_und_getraenke_wortschatz
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wasser 和 Brot 是中性名词；Kaffee 和 Tee 是阳性名词；Suppe 是阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit07.lesson03.translate.015
  lesson_content_key: de.a1.unit07.lesson03.eine_einfache_speisekarte_lesen
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Speisekarte 是复合词：Speise（菜肴）加 Karte（卡片）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit07.lesson02.translate.016
  lesson_content_key: de.a1.unit07.lesson02.hoeflich_bestellen
  type: translation
  frame:
    text: 我想要一杯茶，谢谢。
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich {item} einen Tee, bitte.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Ich möchte 是礼貌地索要某物的表达；动词位于第二位。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit07.lesson04.translate.017
  lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
  type: translation
  frame:
    text: 您想要什么？（正式用语）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Was {item} Sie?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Möchten 与正式称呼 Sie 搭配使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit07.lesson04.translate.018
  lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
  type: translation
  frame:
    text: 一共九欧元。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Das {item} neun Euro.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Das macht 是报总价时的常用表达。
    language_code: zh
    direction: ltr
