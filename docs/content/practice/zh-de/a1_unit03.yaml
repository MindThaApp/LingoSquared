    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 零到十的数字是后续所有数字的基础。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit03.lesson02.translate.002
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: translation
  frame:
