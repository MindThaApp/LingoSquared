      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 复合数字连写成一个词，并且个位在十位前。
    language_code: zh
    direction: ltr
