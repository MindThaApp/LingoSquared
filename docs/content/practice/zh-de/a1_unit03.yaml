templates:
- content_key: practice.zh-de.de.a1.unit03.lesson01.choose.001
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eins 放在名词前时变为 ein（ein Jahr），但单独计数时用 eins。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit03.lesson02.listen.001
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 十六和十七会省略个位数词中的部分字母：sechzehn、siebzehn。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit03.lesson03.choose.001
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 二十以上的数字先说个位：einundzwanzig 的字面结构是“一和二十”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit03.lesson05.listen.001
  lesson_content_key: de.a1.unit03.lesson05.im_gespraech_ueber_das_alter
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wenn ich fragen darf 是一种礼貌的缓和说法，字面意思是“如果我可以问的话”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit03.lesson04.order.001
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
    text: Ich bin {age} Jahre alt.
    language_code: de
    direction: ltr
  slots:
    age: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich bin {age} Jahre alt.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 德语用 sein 表达年龄：Ich bin zwanzig Jahre alt，字面意思是“我是二十岁大”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit03.lesson04.order.002
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
    text: Wie alt {item} Sie?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie alt {item} Sie?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Sind 是 sein 与 Sie 搭配时的形式，因此问题是 Wie alt sind Sie?
    language_code: zh
    direction: ltr
