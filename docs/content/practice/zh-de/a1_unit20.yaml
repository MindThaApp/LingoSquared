  lesson_content_key: de.a1.unit20.lesson02.plan_bei_wetter
  type: translation
  frame:
    text: 好主意。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Gute {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 在阴性名词 Idee 前，Gute 带词尾 -e。
    language_code: zh
    direction: ltr
