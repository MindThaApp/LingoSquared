  lesson_content_key: de.a1.unit20.lesson01.wetter_heute
  type: translation
  frame:
    text: 天气晴朗。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Es ist {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Es ist 加形容词可以描述天气。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit20.lesson01.translate.017
  lesson_content_key: de.a1.unit20.lesson01.wetter_heute
  type: translation
  frame:
    text: 天气很冷，而且正在下雨。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Es ist kalt und es {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Regnen 需要与 es 连用：es regnet.
    language_code: zh
    direction: ltr
