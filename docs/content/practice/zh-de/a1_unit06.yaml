templates:
- content_key: practice.zh-de.de.a1.unit06.lesson01.choose.001
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
