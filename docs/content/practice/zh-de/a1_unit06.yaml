    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lehrerin是“教师”的阴性形式；Bruder的复数形式会改变元音：Brüder。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson01.order.005
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: word_order
  frame:
    text: Das ist meine {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist meine {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 物主词要与名词一致：这些名词都是阴性，因此都用meine。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson03.order.006
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: word_order
  frame:
    text: Haben Sie {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Haben Sie使用正式称呼“您”；在一般疑问句中，动词位于句首。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson04.order.007
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: word_order
  frame:
    text: Meine {item} ist Lehrerin.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Meine {item} ist Lehrerin.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 阴性名词用meine：meine Schwester、meine Tante、meine Cousine。
    language_code: zh
    direction: ltr
