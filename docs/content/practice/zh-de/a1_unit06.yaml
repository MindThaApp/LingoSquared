    text: Einzelkind的字面意思是独生子女。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson04.choose.004
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
