    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson03.fill.011
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich bin {item}. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Einzelkind是名词，因此首字母要大写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson04.fill.012
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: fill_in_blank
  frame:
    text: Ist das {item} Familie? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Familie是阴性名词，因此正式称呼中的“您的”用首字母大写的Ihre。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson01.translate.013
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 所有德语名词的首字母都要大写，家庭成员词汇也不例外。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson03.translate.014
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 我有两个姐妹。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich habe zwei {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Schwester的复数形式加-n：zwei Schwestern。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson02.translate.015
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: translation
  frame:
    text: 谁是您的父亲？
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Wer ist {item} Vater?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Vater是阳性名词，因此正式称呼中的“您的”用Ihr，不用Ihre。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson03.translate.016
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 这是我的母亲。
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist {item} Mutter.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Mutter是阴性名词，因此“我的”要用meine。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson04.translate.017
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: translation
  frame:
    text: 您有兄弟吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Brüder是Bruder的复数形式，其中元音带变音符号。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson03.translate.018
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 不，我没有兄弟姐妹。
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Nein, ich habe {item} Geschwister.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Keine用于复数名词和阴性名词前，表示“没有”。
    language_code: zh
    direction: ltr
