  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 德语按性别区分表亲：Cousin指男性，Cousine指女性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson03.choose.003
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
