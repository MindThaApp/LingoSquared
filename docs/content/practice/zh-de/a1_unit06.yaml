  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eltern表示父母，Geschwister表示兄弟姐妹；两者都是复数形式的集合词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit06.lesson02.listen.002
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
