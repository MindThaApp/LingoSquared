      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Reis 是物质名词，所以在 eine Tüte 后不需要冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit08.lesson01.translate.015
  lesson_content_key: de.a1.unit08.lesson01.einkaufsmengen
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 复数形式：Äpfel 添加变音符号，Eier 添加 -er，Tomaten 添加 -n。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit08.lesson03.translate.016
  lesson_content_key: de.a1.unit08.lesson03.preisschilder_lesen
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Markt 是名词，所以首字母大写；natürlich 的首字母小写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit08.lesson02.translate.017
  lesson_content_key: de.a1.unit08.lesson02.nach_preisen_fragen
  type: translation
  frame:
    text: 它新鲜吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Ist es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: 在一般疑问句中，动词位于句首：Ist es frisch?
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit08.lesson02.translate.018
  lesson_content_key: de.a1.unit08.lesson02.nach_preisen_fragen
  type: translation
  frame:
    text: 这些苹果多少钱？
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Was {item} die Äpfel?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Was kosten ...? 是日常询问价格的说法；这里主语是复数 die Äpfel，所以使用复数形式 kosten。
    language_code: zh
    direction: ltr
