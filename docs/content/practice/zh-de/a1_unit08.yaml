    text: Pfund、Dutzend 和 Kilo 用在数词后仍保持单数形式：zwei Pfund、zwei Kilo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit08.lesson01.listen.002
