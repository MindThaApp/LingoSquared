    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: du 对应的词尾 -st 与词干中的 ß 合并：应写作 du heißt，而不是 heißst。
    language_code: zh
    direction: ltr
