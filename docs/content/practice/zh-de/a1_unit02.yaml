templates:
- content_key: practice.zh-de.de.a1.unit02.lesson01.choose.001
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ich 只在句首大写，位于句中时写作小写 ich；汉语的“我”没有大小写变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson02.listen.001
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 动词词尾随人称变化：ich komme，du kommst。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson04.choose.001
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Woher 询问“从哪里来”，回答时使用 aus：Ich komme aus Deutschland。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson01.listen.002
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 初次见面时，Freut mich 和 Ganz meinerseits 是一组礼貌用语，分别表示“很高兴认识你”和“我也一样”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson01.order.003
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: word_order
  frame:
    text: Ich heiße {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich heiße {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Heiße 是 heißen 的第一人称单数形式；主语是 du 时则变为 heißt。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson02.order.002
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
  type: word_order
  frame:
    text: Du bist {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Du bist {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bist 是 sein 的第二人称单数形式；主语是 ich 时使用 bin。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson04.order.002
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
