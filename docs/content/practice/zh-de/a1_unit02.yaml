  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: translation
  frame:
    text: 你来自哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Woher {item} du?
      language_code: de
      direction: ltr
  feedback_frame:
    text: 疑问词 Woher 位于句首，后面依次是动词和 du。
    language_code: zh
    direction: ltr
