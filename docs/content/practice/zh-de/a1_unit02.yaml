    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Komme 和 kommst 是同一个动词分别与 ich 和 du 搭配时的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson01.translate.007
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: translation
  frame:
    text: 我叫{item}。
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich heiße {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Ich heiße 的字面意思是“我被称作”，德语用这种说法介绍姓名。
    language_code: zh
    direction: ltr
- content_key: practice.zh-de.de.a1.unit02.lesson04.translate.006
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: translation
  frame:
    text: 我来自{item}。
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich komme aus {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 动词仍位于第二位：Ich komme aus England。
    language_code: zh
    direction: ltr
