    - es_a1_u07
    - es_a1_u07_l01
    - es_a1_u07_l06
    - w_cuesta
    - w_cuestan
    - w_docena
    - w_necesita
    - w_todo
    - w_ingredientes
slot_presets:
  market: &id001
    language_code: es
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: es_a1_u07_l01
  nouns: &id002
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u07
  content: &id008
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u07
  dialogue: &id010
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u07_l06
  cuesta: &id003
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cuesta
  cuestan: &id004
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cuestan
  docena: &id005
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_docena
  necesita: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_necesita
  todo: &id007
    language_code: es
    part_of_speech: pronoun
    agreement_tags:
      semantic: w_todo
  ingredientes: &id009
    language_code: es
    part_of_speech: noun
