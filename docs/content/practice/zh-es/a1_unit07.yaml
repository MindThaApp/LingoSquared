templates:
- content_key: practice.zh-es.es.a1.unit07.lesson01.choose.001
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 形容词要与名词保持一致：la fruta fresca，los tomates frescos。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson01.listen.002
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Verdura 指一种蔬菜；在市场上通常说 verduras。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson02.order.001
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: word_order
  frame:
    text: ¿Cuánto {item} el kilo de tomates?
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} el kilo de tomates?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 一公斤西红柿多少钱？说一样东西用 cuesta，说好几样东西用 cuestan。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson02.translate.002
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: translation
  frame:
    text: 鸡蛋多少钱？
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} los huevos?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Huevos 是复数，所以动词用 cuestan；说面包时则用 cuesta。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson03.order.001
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: word_order
  frame:
    text: Una {item} de huevos, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} de huevos, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 请给我一打鸡蛋。表示数量时，物品前要加 de：un kilo de tomates。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson03.match.002
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Medio kilo 是半公斤；medio 前面不加 un。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson03.translate.003
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 以 -o 结尾的词通常是阳性（el mercado），以 -a 结尾的通常是阴性（la fruta）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson04.fill.001
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: fill_in_blank
  frame:
    text: ¿{item} algo más? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 市场摊贩对顾客使用 usted 的形式：¿Necesita algo más?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson04.translate.002
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: translation
  frame:
    text: 我们已经都有了。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ya tenemos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ya（已经）在西班牙语中通常放在动词前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson05.choose.001
  lesson_content_key: es.a1.unit07.lesson05.leer_las_etiquetas_de_precio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Todos los días 的意思是“每天”，字面意思是“所有的日子”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson06.order.001
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: word_order
  frame:
    text: Necesitamos {item} para la próxima clase.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesitamos {item} para la próxima clase.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我们需要为下一节课准备食材。Necesitamos 是 necesitar 的“我们”形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson06.translate.002
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¡Qué tomates tan frescos! 是西班牙语表达“多新鲜的西红柿啊！”的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit07.lesson06.listen.003
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vamos 既可以表示“我们走吧”，也可以表示“我们去”；要根据语境来区分。
    language_code: zh
    direction: ltr
