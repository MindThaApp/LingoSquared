templates:
- content_key: practice.zh-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 穿过马路。Cruza 是 cruzar 的 tú 命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En la esquina 的意思是“在街角”；这里西班牙语用 en 表示“在”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Doblar 和 girar 都表示“转弯”；dobla 和 gira 是它们的 tú 命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: A la izquierda 是“向左”，a la derecha 是“向右”；单独的 derecho 表示“直走”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: 一直往前走。（非正式命令）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigue 来自 seguir（继续走）；derecho（直走）不是 derecha（右边）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 去图书馆怎么走？阳性地点前，a + el 会变成 al：¿Cómo llego al parque?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fácil 用于阳性和阴性名词时形式相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: 别迷路！（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 否定命令使用不同的动词形式：pierdas，而不是 pierdes。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 西班牙语指路通常使用 tú 的命令式：sigue、dobla、cruza。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desde el mercado 的意思是“从市场出发”，即路线的起点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mateo 用 yo 的形式 sigo 和 doblo 复述路线，确认自己没有记错。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: 不客气。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De nada 字面意思是“没什么”；它是回应 gracias 的标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Derecha（右边）和 derecho（直走）只有最后一个元音不同，注意听。
    language_code: zh
    direction: ltr
