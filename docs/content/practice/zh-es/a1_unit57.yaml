    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_estudia
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_estudia
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Diego 学习西班牙语。estudia 的意思是“学习”。
    language_code: zh
    direction: ltr
