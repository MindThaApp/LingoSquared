schema_version: '1.0'
pack_key: practice.zh-es.a1.unit57
source_language: zh
target_language: es
unit_content_key: es.a1.unit57.opleiding
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aprende
    - w_aprender
    - w_aprendes
    - w_aprendo
    - w_ciencias
    - w_estudia
    - w_estudiar
    - w_estudias
    - w_estudio
    - w_formación
    - w_gustaría
    - w_nuevas
    - w_practicamos
    - w_próximo
    - w_sabes
    - w_salud
    - w_seguir
    - w_superior
    - w_universidad
templates:
- content_key: practice.zh-es.es.a1.unit57.lesson01.choose.001
  lesson_content_key: es.a1.unit57.lesson01.estudiar_y_una_formacion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_estudiar
        - w_estudia
        - w_formación
        - w_estudias
        - w_estudio
        - w_seguir
        - w_aprender
        - w_nuevas
        - w_aprendo
        - w_universidad
        - w_superior
        - w_aprendes
        - w_aprende
        - w_ciencias
        - w_salud
        - w_gustaría
        - w_sabes
        - w_practicamos
        - w_próximo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自关于学习和培训项目的一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit57.lesson02.listen.001
  lesson_content_key: es.a1.unit57.lesson02.seguir_un_curso_y
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自关于上课程和学习的一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit57.lesson03.translate.001
  lesson_content_key: es.a1.unit57.lesson03.la_universidad_y_la
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自关于大学和高等专科学校的一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit57.lesson04.match.001
  lesson_content_key: es.a1.unit57.lesson04.diego_habla_de_su
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit57.lesson05.choose.001
  lesson_content_key: es.a1.unit57.lesson05.quien_estudia_que
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自关于谁学什么的一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit57.lesson06.translate.001
  lesson_content_key: es.a1.unit57.lesson06.practicar_espanol_en_el
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自关于在语言咖啡馆练习西班牙语的一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit57.lesson01.order.002
  lesson_content_key: es.a1.unit57.lesson01.estudiar_y_una_formacion
  type: word_order
  frame:
    text: A los dos les gusta {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_estudiar
  answer_derivation:
    kind: render_frame
    frame:
      text: A los dos les gusta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 两个人都喜欢学习。estudiar 的意思是“学习”。
    language_code: zh
    direction: ltr
