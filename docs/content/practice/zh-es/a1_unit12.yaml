templates:
- content_key: practice.zh-es.es.a1.unit12.lesson01.choose.001
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 表示感受的形容词，男性以 -o 结尾，女性以 -a 结尾：nervioso、nerviosa。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson01.listen.002
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 最后一个元音可以告诉你说话人是男性(-o)还是女性(-a)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson01.match.003
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Contento 表示对某事感到高兴或满意，与 estar 连用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson01.order.004
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Mateo está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Mateo está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 情绪会变化，所以用 estar:Mateo está nervioso hoy。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson01.order.005
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Elena está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Elena está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 埃琳娜是女性，所以形容词以 -a 结尾：Elena está cansada。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson03.order.001
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: word_order
  frame:
    text: Me {item} un poco nervioso.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Me {item} un poco nervioso.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我觉得有点紧张。Sentirse 要配 me、te、se:me siento、te sientes。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson03.translate.002
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: translation
  frame:
    text: 你感觉怎么样？(非正式)
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo te {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 对 usted 来说，这个问句变成 ¿Cómo se siente?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson04.fill.001
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: fill_in_blank
  frame:
    text: No te {item}, podemos empezar de nuevo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No te preocupes 是对朋友说“别担心”的固定说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson04.translate.002
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: translation
  frame:
    text: 有东西烧焦了！
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Algo se {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 西班牙语用一般现在时表示正在发生的事：algo se quema。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson04.order.003
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: word_order
  frame:
    text: Podemos {item} de nuevo.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Podemos {item} de nuevo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我们可以重新开始。De nuevo 的意思是“再一次”,和 otra vez 一样。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson05.choose.001
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 这篇短文按时间推进：antes(之前)、durante(期间)、al final(最后)、ahora(现在)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson05.translate.002
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 如果一群人中包含男性，形容词用 -os 结尾：nerviosos、contentos。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson06.order.001
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: word_order
  frame:
    text: Lo logramos {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lo logramos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我们一起做到了。Lograr 的意思是“设法做到”或“实现”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson06.listen.002
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Ay, no! 是事情出错时很自然的反应。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit12.lesson05.match.003
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Estaban 和 están 都来自 estar：他们当时在、他们现在在。
    language_code: zh
    direction: ltr
