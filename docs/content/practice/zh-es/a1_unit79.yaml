schema_version: '1.0'
pack_key: practice.zh-es.a1.unit79
source_language: zh
target_language: es
unit_content_key: es.a1.unit79.strand
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arena
    - w_caliente
    - w_mar
    - w_nado
    - w_ola
    - w_sombrilla
    - w_sombrillas
    - w_zoo
templates:
- content_key: practice.zh-es.es.a1.unit79.lesson01.choose.001
  lesson_content_key: es.a1.unit79.lesson01.vamos_a_la_playa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_mar
        - w_arena
        - w_caliente
        - w_ola
        - w_sombrilla
        - w_nado
        - w_sombrillas
        - w_zoo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“我们去海滩好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit79.lesson02.listen.001
