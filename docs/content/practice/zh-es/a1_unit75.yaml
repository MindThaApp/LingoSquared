    text: '{item} 是本单元的词汇之一,来自“马特奥、尼娜和埃琳娜在博物馆”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit75.lesson01.order.002
  lesson_content_key: es.a1.unit75.lesson01.quiero_ir_al_museo
  type: word_order
  frame:
    text: Quiero {item} el museo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_visitar
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} el museo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我想参观博物馆。visitar 的意思是“参观”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit75.lesson02.order.002
  lesson_content_key: es.a1.unit75.lesson02.quiero_comprar_una_entrada
  type: word_order
  frame:
    text: Visito la {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_exposición
  answer_derivation:
    kind: render_frame
    frame:
      text: Visito la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我正在参观展览。exposición 的意思是“展览”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit75.lesson04.order.002
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: word_order
  frame:
    text: Muy bien, ¿y quiere también una {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_guía
  answer_derivation:
    kind: render_frame
    frame:
      text: Muy bien, ¿y quiere también una {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 很好,您还需要导游手册吗?guía 的意思是“导览”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit75.lesson04.fill.003
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: fill_in_blank
  frame:
    text: No, gracias, no hace {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_falta
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_falta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 不用了,谢谢,没有必要。falta 的意思是“缺少”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit75.lesson05.order.002
  lesson_content_key: es.a1.unit75.lesson05.leer_el_panel_de
