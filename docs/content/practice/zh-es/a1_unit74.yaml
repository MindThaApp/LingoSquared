schema_version: '1.0'
pack_key: practice.zh-es.a1.unit74
source_language: zh
target_language: es
unit_content_key: es.a1.unit74.bioscoop
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cartelera
    - w_comprar
    - w_infantil
    - w_museo
    - w_palomitas
    - w_película
    - w_sesión
templates:
- content_key: practice.zh-es.es.a1.unit74.lesson01.choose.001
  lesson_content_key: es.a1.unit74.lesson01.quiero_ver_una_pelicula
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_película
        - w_comprar
        - w_sesión
        - w_cartelera
        - w_palomitas
        - w_infantil
        - w_museo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“我想看电影”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit74.lesson02.listen.001
  lesson_content_key: es.a1.unit74.lesson02.que_pelicula_quiere_ver
  type: listen_select
