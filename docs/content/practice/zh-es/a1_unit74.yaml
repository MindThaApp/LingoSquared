    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“您想看哪部电影？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit74.lesson03.translate.001
  lesson_content_key: es.a1.unit74.lesson03.a_que_hora_empieza
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“这一场几点开始？”这一课。'
    language_code: zh
