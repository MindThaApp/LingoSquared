schema_version: '1.0'
pack_key: practice.zh-es.a1.unit45
source_language: zh
target_language: es
unit_content_key: es.a1.unit45.money
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amable
    - w_cambio
    - w_dividimos
    - w_efectivo
    - w_euros
    - w_paga
    - w_pagar
    - w_pago
    - w_pedimos
    - w_platos
    - w_puedo
    - w_separado
    - w_tarjeta
    - w_total
templates:
- content_key: practice.zh-es.es.a1.unit45.lesson01.choose.001
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_euros
        - w_pagar
        - w_tarjeta
        - w_efectivo
        - w_puedo
        - w_pago
        - w_dividimos
        - w_separado
        - w_cambio
        - w_platos
        - w_pedimos
        - w_amable
        - w_paga
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“总共多少钱？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson02.listen.001
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
