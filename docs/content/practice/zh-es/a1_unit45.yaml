    text: '{item} 是本单元的词汇，来自“刷卡还是付现金？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson03.translate.001
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“分摊账单”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson04.match.001
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson05.choose.001
  lesson_content_key: es.a1.unit45.lesson05.leer_un_ticket_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“看懂餐厅账单”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson06.translate.001
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，来自“Elena 和 Mateo 付账”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson01.order.002
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: word_order
  frame:
    text: ¿Cuánto cuesta en {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto cuesta en {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 总共多少钱？En total 表示你想问的是全部合计的价格，而不是单个物品的价格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson01.fill.003
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: fill_in_blank
  frame:
    text: Cuesta veinticinco {item} en total. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 总共二十五欧元。Cuesta 是 costar（价钱为）的第三人称单数；重音落在词干上时，元音由 o 变为 ue。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson02.order.002
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: word_order
  frame:
    text: ¿Puedo {item} con tarjeta aquí?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_pagar
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo {item} con tarjeta aquí?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我可以在这里刷卡付款吗？pagar 的意思是付款。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson02.fill.003
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: fill_in_blank
  frame:
    text: ¿Quiere pagar en efectivo o con {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 您想付现金还是刷卡？Quiere 是 querer 的敬称 usted 形式，这里是不认识的收银员使用的；对朋友则说 ¿quieres pagar...?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson02.translate.004
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: translation
  frame:
    text: 我付现金。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_efectivo
  answer_derivation:
    kind: render_frame
    frame:
      text: Pago en {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我付现金。efectivo 的意思是现金。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson03.order.002
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: word_order
  frame:
    text: ¿Puedo pagar por {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_separado
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo pagar por {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我可以分开付款吗？Por separado（分开地）说明付款的方式；pagar（付款）是表达这个意思的日常动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson04.order.002
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: word_order
  frame:
    text: Aquí tiene su {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cambio
  answer_derivation:
    kind: render_frame
    frame:
      text: Aquí tiene su {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这是您的找零。cambio 的意思是兑换、找零。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit45.lesson06.order.002
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: word_order
  frame:
    text: Mateo {item} la cuenta.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_paga
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} la cuenta.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mateo 付账。Paga 是 pagar（付款）的第三人称单数：Mateo paga la cuenta.
    language_code: zh
    direction: ltr
