  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_centro
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_centro
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我去市中心应该坐什么交通工具?centro 的意思是市中心。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit55.lesson04.order.002
  lesson_content_key: es.a1.unit55.lesson04.lucia_le_pregunta_a
  type: word_order
  frame:
    text: ¿Cómo {item} al trabajo, Mateo?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
