  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_conducir
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefiero {item} el coche.
      language_code: es
      direction: ltr
