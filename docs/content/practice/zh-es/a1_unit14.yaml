    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Apartamento 在拉丁美洲很常用；在西班牙人们也说 piso。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson02.order.001
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: Quiero {item} un apartamento cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} un apartamento cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我想租一套公园附近的公寓。Querer + 动词原形表示你想做什么。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson02.fill.002
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: fill_in_blank
  frame:
    text: Hay un apartamento {item} en este edificio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desocupado 形容目前没人住的房子；它放在名词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson03.translate.001
  lesson_content_key: es.a1.unit14.lesson03.cuantos_dormitorios_tiene
  type: translation
  frame:
    text: 它有几间卧室？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuántos {item} tiene?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cuántos 与阳性复数名词搭配；与阴性复数名词搭配时用 cuántas。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson05.fill.001
  lesson_content_key: es.a1.unit14.lesson05.leer_el_anuncio
  type: fill_in_blank
  frame:
    text: ¿Hay {item} en casa? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alguien 表示“某人”；它的反义词是 nadie，表示“没有人”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson06.order.001
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: word_order
  frame:
    text: Voy a llamar a la {item} hoy mismo.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Voy a llamar a la {item} hoy mismo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我今天就要给中介打电话。Hoy mismo 强调就在今天。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson06.translate.002
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pequeño 与阴性名词搭配时变成 pequeña：una cocina pequeña。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson06.choose.003
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alquilar 是“租”；每月的租金本身叫 el alquiler。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson02.translate.003
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Edificio 指任何建筑，包括公寓楼；casa 指房子或家。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson02.order.004
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: El {item} está cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这栋楼在公园附近。Cerca de + el 要缩合成 cerca del。
    language_code: zh
    direction: ltr
