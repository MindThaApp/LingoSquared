- content_key: practice.zh-es.es.a1.unit14.lesson01.choose.001
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Baño 既指卫生间，也指浴缸；sala 指客厅。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson01.listen.002
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
