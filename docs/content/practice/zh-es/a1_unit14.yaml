  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dormitorio 来自 dormir（睡觉）：就是睡觉的房间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit14.lesson01.match.003
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
  type: matching_pairs
