schema_version: '1.0'
pack_key: practice.zh-es.a1.unit01
source_language: zh
target_language: es
unit_content_key: es.a1.unit01.greetings
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u01
    - es_a1_u01_l02
    - es_a1_u01_l03
    - w_Lucía
    - w_Diego
    - w_Carlos
    - w_Ana
    - w_México
    - w_Colombia
    - w_España
    - w_Londres
    - w_aprendiendo
    - w_vez
    - w_cocinar
    - w_gusto
    - w_igualmente
    - w_luego
    - w_usted
    - w_tú
slot_presets:
  content: &id001
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    - phrase
    agreement_tags:
      semantic: es_a1_u01
  words: &id003
    language_code: es
    part_of_speech:
    - noun
    - adverb
    - phrase
    - adjective
    agreement_tags:
      semantic: es_a1_u01
  greeting: &id004
    language_code: es
    part_of_speech:
    - noun
    - adjective
    - adverb
    - phrase
    - verb
    agreement_tags:
      semantic: es_a1_u01_l02
  name_m: &id007
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_Carlos
      - w_Diego
  name_f: &id008
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_Ana
      - w_Lucía
  name: &id006
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_Carlos
      - w_Diego
      - w_Ana
      - w_Lucía
  country: &id010
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_México
      - w_Colombia
      - w_España
  aprendiendo: &id011
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_aprendiendo
  vez: &id012
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_vez
  cocinar: &id013
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cocinar
  gusto: &id009
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_gusto
  igualmente:
    language_code: es
    part_of_speech: adverb
    agreement_tags:
      semantic: w_igualmente
  luego: &id005
    language_code: es
    part_of_speech: adverb
    agreement_tags:
      semantic: w_luego
  usted: &id002
    language_code: es
    part_of_speech: pronoun
    agreement_tags:
      semantic: w_usted
templates:
- content_key: practice.zh-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 西班牙语里“你”有两个词：对朋友和家人用 tú，对陌生人或表示尊敬时用 usted。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Está 与 usted 搭配；与 tú 搭配时动词变成 estás：¿Cómo estás?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 西班牙语的问候语和日常用语常带重音符号（cómo、adiós、también）；重音符号标出重读音节。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buenos días 用到午饭前（在西班牙大约到下午2点），buenas tardes 用于下午，buenas noches 用于晚上和夜里。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Día 是阳性名词（buenos días），而 tarde 和 noche 是阴性名词（buenas tardes、buenas noches）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hasta luego 字面意思是“到稍后为止”，是日常说的“回头见”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Me llamo 字面意思是“我称呼自己”，是介绍自己名字的日常说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: 这位是{name}。（介绍男士）
    language_code: zh
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 介绍男士用 este，介绍女士用 esta：Esta es Ana.
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Esta 用来介绍女士；介绍男士要说 este：Este es Carlos.
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mucho gusto 表示“很高兴认识你”；通常的回答是 igualmente，意思是“我也是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + 地点 表示你来自哪里；vivir en + 地点 表示你现在住在哪里。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: 我来自{place}。
    language_code: zh
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 要问同样的问题：¿De dónde eres?（非正式）或 ¿De dónde es usted?（正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy + -ando/-iendo 表示此刻正在进行的事情，比如“我还在学习”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Vez 表示“次、回”：primera vez 是“第一次”；otra vez 是“再一次”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: 你喜欢做饭吗？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 西班牙语用 gustar 表达喜欢什么：是这件事“让你喜欢”，所以用 te gusta + 动词原形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Elena 和 Mateo 互相用 tú，因为他们是同一个工作坊里的同辈。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 当动词词尾已经表明人称时，西班牙语会省略主语代词：vivo 的意思是“我住”。
    language_code: zh
    direction: ltr
