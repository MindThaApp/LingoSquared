templates:
- content_key: practice.zh-es.es.a1.unit05.lesson01.order.001
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: word_order
  frame:
    text: ¿Qué {item} es?
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Qué {item} es?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 现在几点？回答用 son las + 钟点(son las dos),但一点钟要说 es la una。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson01.choose.002
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 钟点用阴性形式，因为它们代表 horas:las dos、las cuatro。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson02.order.001
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: word_order
  frame:
    text: Son las cuatro y {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cuatro y {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 四点一刻。几点半用 y media:son las cuatro y media。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson02.translate.002
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: translation
  frame:
    text: 差一刻五点。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cinco {item} cuarto.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 西班牙语从下一个整点往回数：五点减一刻。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson03.order.001
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: word_order
  frame:
    text: Son las ocho de la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las ocho de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: de la mañana、de la tarde 和 de la noche 的作用类似“上午”“下午”“晚上”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson03.translate.002
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: translation
  frame:
    text: 工作坊下午四点开始。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: El taller empieza a las cuatro de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 表示“在几点”用 a las + 钟点：a las cuatro;一点钟则用 a la una。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson03.match.003
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mañana 既表示早晨(la mañana),也表示明天；通常看冠词来区分。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson04.fill.001
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: fill_in_blank
  frame:
    text: De {item}, a las tres y media. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De acuerdo 是同意计划的标准说法：好的，同意。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson04.translate.002
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Antes de 表示“在……之前”:antes del taller,工作坊之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson05.listen.001
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Almorzar 是“吃午饭”;西班牙人通常在两点到三点之间吃午饭。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson05.fill.002
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: fill_in_blank
  frame:
    text: Al día {item}, Elena y Mateo almuerzan juntos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al día siguiente 表示“第二天”;siguiente 放在名词之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson06.order.001
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: word_order
  frame:
    text: ¡Buena {item}! Comemos mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buena {item}! Comemos mañana.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 好主意！我们明天吃饭。idea 是阴性名词，所以“好”要用 buena。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson06.translate.002
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: translation
  frame:
    text: 这附近有一家餐厅。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay un {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hay 用来引出新事物：hay un restaurante。已知的地点则用 está:el restaurante está cerca。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit05.lesson06.choose.003
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¿Tienes hambre? 西班牙语说“有饿”,而不是“是饿的”。
    language_code: zh
    direction: ltr
