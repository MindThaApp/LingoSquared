- content_key: practice.zh-es.es.a1.unit64.lesson01.order.003
  lesson_content_key: es.a1.unit64.lesson01.rojo_y_amarillo
  type: word_order
  frame:
    text: Los {item} están aquí.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tulipanes
