schema_version: '1.0'
pack_key: practice.zh-es.a1.unit64
source_language: zh
target_language: es
unit_content_key: es.a1.unit64.kleuren
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amarillo
    - w_blanco
    - w_bonitos
    - w_color
    - w_compran
    - w_flores
    - w_morado
    - w_naranja
    - w_rojo
    - w_rosas
    - w_tulipanes
templates:
- content_key: practice.zh-es.es.a1.unit64.lesson01.choose.001
  lesson_content_key: es.a1.unit64.lesson01.rojo_y_amarillo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tulipanes
        - w_rojo
        - w_amarillo
        - w_blanco
        - w_naranja
        - w_color
        - w_rosas
        - w_morado
        - w_flores
        - w_compran
        - w_bonitos
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自红色和黄色那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit64.lesson02.listen.001
  lesson_content_key: es.a1.unit64.lesson02.blanco_y_naranja
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自白色和橙色那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit64.lesson03.translate.001
  lesson_content_key: es.a1.unit64.lesson03.rosa_y_morado
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自粉色和紫色那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit64.lesson05.match.001
  lesson_content_key: es.a1.unit64.lesson05.nina_y_elena_compran
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
