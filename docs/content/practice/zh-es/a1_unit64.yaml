    frame:
      text: Los {item} están aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 郁金香在这里。tulipanes 的意思是“郁金香”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit64.lesson02.order.003
  lesson_content_key: es.a1.unit64.lesson02.blanco_y_naranja
  type: word_order
  frame:
    text: ¿De qué {item} es eso?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_color
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿De qué {item} es eso?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 那是什么颜色？color 的意思是“颜色”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit64.lesson03.order.002
  lesson_content_key: es.a1.unit64.lesson03.rosa_y_morado
  type: word_order
  frame:
    text: Los tulipanes son {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_rosas
  answer_derivation:
    kind: render_frame
    frame:
      text: Los tulipanes son {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这些郁金香是粉色的。rosas 的意思是“粉色的”（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit64.lesson03.fill.003
  lesson_content_key: es.a1.unit64.lesson03.rosa_y_morado
  type: fill_in_blank
  frame:
    text: Ese es rosa y ese es {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_morado
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_morado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 那个是粉色的，那个是紫色的。morado 的意思是“紫色”。
    language_code: zh
    direction: ltr
