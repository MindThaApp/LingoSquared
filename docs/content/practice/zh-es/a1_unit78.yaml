  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_gimnasio
        - w_membresía
        - w_cinta
        - w_pesas
        - w_instructor
        - w_playa
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们去健身房好吗？”一课。'
    language_code: zh
    direction: ltr
