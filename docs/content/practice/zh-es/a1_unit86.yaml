  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_bola
    - w_bolas
    - w_cono
    - w_floristería
    - w_helado
    - w_ricas
    - w_sabor
    - w_sabores
    - w_vaso
    - w_vitrina
templates:
- content_key: practice.zh-es.es.a1.unit86.lesson01.choose.001
  lesson_content_key: es.a1.unit86.lesson01.vamos_a_la_heladeria
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vitrina
        - w_helado
        - w_sabor
        - w_bola
        - w_cono
        - w_sabores
        - w_bolas
        - w_vaso
        - w_ricas
        - w_floristería
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们去冰淇淋店好吗？”一课。'
    language_code: zh
    direction: ltr
