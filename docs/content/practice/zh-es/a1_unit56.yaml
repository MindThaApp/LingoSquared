  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_app
    - w_busca
    - w_buscar
    - w_busco
    - w_enviar
    - w_envía
    - w_internet
    - w_lee
    - w_mañanas
    - w_móvil
    - w_ordenador
    - w_pronóstico
