  lesson_content_key: es.a1.unit61.lesson01.la_carta_y_el
  type: word_order
  frame:
    text: Tengo una {item} para mi abuelo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_carta
