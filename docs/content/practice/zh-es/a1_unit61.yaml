schema_version: '1.0'
pack_key: practice.zh-es.a1.unit61
source_language: zh
target_language: es
unit_content_key: es.a1.unit61.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_carta
    - w_compra
    - w_correos
    - w_desea
    - w_dirección
    - w_empleado
    - w_escribe
    - w_escribir
    - w_llegas
    - w_paquete
    - w_sello
    - w_tarda
    - w_tardar
templates:
- content_key: practice.zh-es.es.a1.unit61.lesson01.choose.001
  lesson_content_key: es.a1.unit61.lesson01.la_carta_y_el
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_carta
        - w_paquete
        - w_sello
        - w_dirección
        - w_escribir
        - w_llegas
        - w_tardar
        - w_tarda
        - w_empleado
        - w_desea
        - w_compra
        - w_correos
        - w_escribe
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于信和包裹的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit61.lesson02.listen.001
  lesson_content_key: es.a1.unit61.lesson02.el_sello_la_direccion
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于邮票、地址和书写的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit61.lesson03.translate.001
  lesson_content_key: es.a1.unit61.lesson03.llegar_y_tardar
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于到达和花费时间的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit61.lesson04.match.001
  lesson_content_key: es.a1.unit61.lesson04.en_correos
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit61.lesson05.choose.001
  lesson_content_key: es.a1.unit61.lesson05.elena_envia_un_paquete
  type: multiple_choice
