templates:
- content_key: practice.zh-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: uno 在阳性名词前变为 un（un huevo），在阴性名词前变为 una（una taza）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: seis 只有一个音节，siete 有两个音节（sie-te）；注意听 t 的发音。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 十一到十五有各自独立的词（once、doce、trece、catorce、quince）；从十六开始由 diez 构成：dieciséis。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: cien 正好是一百；超过一百时西班牙语用 ciento：ciento uno。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 西班牙语用 tener（有）来表达年龄：说“有”多少岁，而不是“是”多少岁。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 我{age}岁。
    language_code: zh
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 表达年龄千万不要用 soy：应说 Tengo veinte años，而不是 Soy veinte。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: ¿Cuántos años {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 对 usted 提问时，问句变为 ¿Cuántos años tiene usted?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 西班牙语中电话号码常两位两位地读：62 41 ... 读作 sesenta y dos, cuarenta y uno。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: word_order
  frame:
    text: ¿Puedes {item}, por favor?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedes {item}, por favor?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Puedes + 动词原形用于向朋友提出请求；对 usted 则说 ¿Puede repetir, por favor?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson04.translate.003
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Por favor（请）和 claro（当然）是任何对话中最实用的两个词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson05.choose.001
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 数量与食材之间用 de 连接：dos tazas de harina。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson05.translate.002
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 西班牙语名词复数在元音后加 -s（taza、tazas），在辅音后加 -es。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson05.translate.003
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: 我需要三个{item}。
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesito tres {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Necesito（我需要）来自 necesitar；询问别人时用 ¿Cuántos necesitas?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson05.fill.004
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: fill_in_blank
  frame:
    text: Media taza de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: taza 是阴性名词，所以半杯是 media taza；阳性名词则用 medio：medio kilo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson06.listen.001
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oye 是引起别人注意的一种友好说法，类似中文的“喂”“嘿”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson06.translate.002
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: translation
  frame:
    text: 再问一个问题。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} más.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Más 通常放在名词之后：una pregunta más，再一个问题。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit02.lesson06.match.003
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tengo、tienes 和 tiene 都是 tener 的变位形式：我有、你有、他或她有。
    language_code: zh
    direction: ltr
