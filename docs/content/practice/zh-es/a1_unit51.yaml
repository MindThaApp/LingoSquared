schema_version: '1.0'
pack_key: practice.zh-es.a1.unit51
source_language: zh
target_language: es
unit_content_key: es.a1.unit51.travel
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ahí
    - w_allá
    - w_andén
    - w_atención
    - w_billete
    - w_cuarenta
    - w_entrada
    - w_espera
    - w_ida
    - w_justo
    - w_llega
    - w_llegada
    - w_lleva
    - w_lugar
    - w_panel
    - w_precio
    - w_problema
    - w_quisiera
    - w_recto
    - w_retraso
    - w_sale
    - w_salida
    - w_suben
    - w_taquilla
    - w_tren
    - w_vuelta
templates:
- content_key: practice.zh-es.es.a1.unit51.lesson01.choose.001
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_billete
        - w_quisiera
        - w_ida
        - w_vuelta
        - w_taquilla
        - w_andén
        - w_sale
        - w_tren
        - w_llega
        - w_retraso
        - w_atención
        - w_lleva
        - w_lugar
        - w_entrada
        - w_salida
        - w_espera
        - w_recto
        - w_llegada
        - w_precio
        - w_cuarenta
        - w_ahí
        - w_panel
        - w_problema
        - w_justo
        - w_suben
        - w_allá
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自买票那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson02.listen.001
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“火车几点出发？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson03.translate.001
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“延误”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson04.match.001
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson05.choose.001
  lesson_content_key: es.a1.unit51.lesson05.leer_un_billete_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“看火车票”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson06.translate.001
  lesson_content_key: es.a1.unit51.lesson06.elena_y_mateo_de
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Elena 和 Mateo 的旅行”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson01.order.002
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: word_order
  frame:
    text: Quisiera un {item} a Toledo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_billete
  answer_derivation:
    kind: render_frame
    frame:
      text: Quisiera un {item} a Toledo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我想要一张去托莱多的票。billete 的意思是“票”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson01.fill.003
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: fill_in_blank
  frame:
    text: ¿Quiere un billete de ida o de ida y {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 您想要单程票还是往返票？Quiere 是 querer 的正式 usted 形式，这里用于不熟悉的车站工作人员。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson01.translate.004
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: translation
  frame:
    text: 在售票窗口，通常使用敬称 usted。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_taquilla
  answer_derivation:
    kind: render_frame
    frame:
      text: En la {item} se suele usar la forma de cortesía usted.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 在柜台，通常使用礼貌形式 usted。对于服务岗位上的陌生人，要用 usted，而不是 tú。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson02.order.002
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: word_order
  frame:
    text: ¿De qué {item} sale el tren a Toledo?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_andén
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿De qué {item} sale el tren a Toledo?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 去托莱多的火车从哪个站台出发？andén 的意思是“站台”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson02.fill.003
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: fill_in_blank
  frame:
    text: El tren {item} a las diez menos cuarto del andén cinco. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 火车九点四十五分从五号站台出发。Las diez menos cuarto 沿用了时间一课中的“减一刻”表达方式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson02.translate.004
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: translation
  frame:
    text: 火车几点到？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tren
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿A qué hora llega el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 火车几点到达？¿A qué hora llega ...? 用来询问到达时间；llegar 是规则动词，时间前要用 a las。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson03.order.002
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: word_order
  frame:
    text: Atención, el tren a Toledo lleva {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_retraso
  answer_derivation:
    kind: render_frame
    frame:
      text: Atención, el tren a Toledo lleva {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 注意：去托莱多的火车晚点了。retraso 的意思是“延误”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson03.fill.003
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: fill_in_blank
  frame:
    text: El tren {item} diez minutos de retraso. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 火车晚点十分钟。Lleva retraso（字面意思是“带着延误”）是表示晚点的自然说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson03.translate.004
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: 火车改从三号站台发车，而不是五号站台。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_lugar
  answer_derivation:
    kind: render_frame
    frame:
      text: El tren sale del andén tres en {item} del andén cinco.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 火车从三号站台出发，而不是五号站台。En lugar de 的意思是“代替”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson04.order.002
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: word_order
  frame:
    text: ¿Dónde está la {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_entrada
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Dónde está la {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 入口在哪里？entrada 的意思是“入口”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson04.fill.003
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: fill_in_blank
  frame:
    text: ¿Dónde está la {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_salida
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_salida
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 出口在哪里？salida 的意思是出口。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson04.translate.004
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: translation
  frame:
    text: 候车室在哪里？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_espera
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Dónde está la sala de {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 候诊室在哪里？espera 的意思是等待。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit51.lesson06.order.002
  lesson_content_key: es.a1.unit51.lesson06.elena_y_mateo_de
  type: word_order
  frame:
    text: No hay {item}, todavía tenemos tiempo para un café.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_problema
  answer_derivation:
    kind: render_frame
    frame:
      text: No hay {item}, todavía tenemos tiempo para un café.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 没问题，我们还有时间喝杯咖啡。No hay problema 是一种常见的、随意的安慰说法。
    language_code: zh
    direction: ltr
