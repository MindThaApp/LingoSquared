  lesson_content_key: es.a1.unit46.lesson01.no_me_siento_bien
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_enfermo
        - w_dolor
        - w_cabeza
        - w_estómago
        - w_garganta
        - w_fiebre
        - w_resfriado
        - w_ayudarle
        - w_pastilla
        - w_toma
        - w_descansa
        - w_bebe
        - w_sentirte
        - w_médico
        - w_descansar
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“我不舒服”这一课。'
    language_code: zh
    direction: ltr
