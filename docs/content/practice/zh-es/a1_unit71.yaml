schema_version: '1.0'
pack_key: practice.zh-es.a1.unit71
source_language: zh
target_language: es
unit_content_key: es.a1.unit71.wasserette
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cesto
    - w_grados
    - w_lavado
    - w_lavandería
    - w_monedas
    - w_programa
    - w_recoger
    - w_recojo
    - w_secadora
    - w_sesenta
templates:
- content_key: practice.zh-es.es.a1.unit71.lesson01.choose.001
  lesson_content_key: es.a1.unit71.lesson01.quiero_lavar_mi_ropa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_lavandería
        - w_programa
        - w_lavado
        - w_recoger
        - w_recojo
        - w_sesenta
        - w_grados
        - w_secadora
        - w_monedas
        - w_cesto
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自“我想洗衣服”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit71.lesson02.listen.001
  lesson_content_key: es.a1.unit71.lesson02.cuanto_cuesta_un_lavado
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自“洗一次衣服多少钱？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit71.lesson03.translate.001
  lesson_content_key: es.a1.unit71.lesson03.cuando_estara_lista_la
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自“衣服什么时候洗好？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit71.lesson04.match.001
  lesson_content_key: es.a1.unit71.lesson04.en_la_lavanderia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit71.lesson05.choose.001
  lesson_content_key: es.a1.unit71.lesson05.leer_la_lista_de
  type: multiple_choice
