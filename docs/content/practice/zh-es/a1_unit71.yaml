    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自“看价目表”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit71.lesson06.translate.001
  lesson_content_key: es.a1.unit71.lesson06.elena_en_la_lavanderia
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
