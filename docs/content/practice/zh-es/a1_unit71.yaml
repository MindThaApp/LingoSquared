- content_key: practice.zh-es.es.a1.unit71.lesson03.order.002
  lesson_content_key: es.a1.unit71.lesson03.cuando_estara_lista_la
  type: word_order
  frame:
    text: Sí, {item} mi ropa.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_recojo
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, {item} mi ropa.
      language_code: es
      direction: ltr
  feedback_frame:
