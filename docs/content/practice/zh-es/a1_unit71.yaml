  lesson_content_key: es.a1.unit71.lesson01.quiero_lavar_mi_ropa
  type: word_order
  frame:
    text: Voy a la {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_lavandería
  answer_derivation:
    kind: render_frame
    frame:
      text: Voy a la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我去自助洗衣店。lavandería 的意思是自助洗衣店。
    language_code: zh
    direction: ltr
