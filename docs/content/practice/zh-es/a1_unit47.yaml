schema_version: '1.0'
pack_key: practice.zh-es.a1.unit47
source_language: zh
target_language: es
unit_content_key: es.a1.unit47.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_contarte
    - w_devuelvo
    - w_envío
    - w_esperado
    - w_esperar
    - w_hables
    - w_hablo
    - w_llamada
    - w_llamarme
    - w_llamarte
    - w_mensaje
    - w_minutos
    - w_oigo
    - w_oír
    - w_rápido
    - w_significa
    - w_turno
templates:
- content_key: practice.zh-es.es.a1.unit47.lesson01.choose.001
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_llamarte
        - w_hablo
        - w_hables
        - w_rápido
        - w_oigo
        - w_mensaje
        - w_envío
        - w_llamarme
        - w_contarte
        - w_devuelvo
        - w_llamada
        - w_minutos
        - w_turno
        - w_esperado
        - w_esperar
        - w_oír
        - w_significa
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“我会给你打电话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson02.listen.001
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“请问您是哪位？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson03.translate.001
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“你能再说一遍吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson04.match.001
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson05.choose.001
  lesson_content_key: es.a1.unit47.lesson05.leer_una_conversacion_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“阅读短信对话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson06.translate.001
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“下班后的一通电话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame:
    text: Tengo que {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_llamarte
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo que {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我得给你打电话。llamarte 的意思是“给你打电话”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame:
    text: ¿Con quién {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hablo
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Con quién {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 请问您是哪位？¿Con quién hablo? 是不知道来电者是谁时的标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 请不要说得这么快。No hables 是 hablar 的否定非正式命令式；tan rápido（这么快）表示程度。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我听不清你说话。Oír（听见）加上 no ... bien（不太好）表示听力上的问题，与 entender（理解）不同；te oigo 的意思是“我听得到你”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这条短信是Elena发来的。mensaje 的意思是“消息”；短信。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我给你发条短信。Enviar（发送）要放在代词 te（给你）之后：te envío un mensaje。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 你的第一个班上得怎么样？Ha ido 是 ir 的现在完成时（这里表示“进展、结果如何”）：ha + 过去分词 ido。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 进行得非常顺利，比我想的还好。Ha ido muy bien 沿用了问句中的现在完成时；mejor de lo esperado（比预期的更好）用 de lo 来做比较。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: 谢谢你，这对我意义重大。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 谢谢你，这对我意义重大。Significa 是 significar（意味着）的第三人称形式；para mí（对我来说）说明这件事对谁重要。
    language_code: zh
    direction: ltr
