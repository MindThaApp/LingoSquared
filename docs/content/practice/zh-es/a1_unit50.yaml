schema_version: '1.0'
pack_key: practice.zh-es.a1.unit50
source_language: zh
target_language: es
unit_content_key: es.a1.unit50.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actividad
    - w_breve
    - w_cine
    - w_cita
    - w_ganas
    - w_idiomas
    - w_invitación
    - w_plan
    - w_proponer
    - w_puede
    - w_quedamos
    - w_quedar
    - w_rechazo
    - w_saludo
    - w_tomamos
    - w_tomar
    - w_viene
templates:
- content_key: practice.zh-es.es.a1.unit50.lesson01.choose.001
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tomamos
        - w_tomar
        - w_cine
        - w_proponer
        - w_actividad
        - w_ganas
        - w_plan
        - w_breve
        - w_rechazo
        - w_quedar
        - w_quedamos
        - w_cita
        - w_viene
        - w_invitación
        - w_idiomas
        - w_saludo
        - w_puede
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自提议活动的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson02.listen.001
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自接受或拒绝计划的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson03.translate.001
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自商定日期和时间的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson04.match.001
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson06.choose.001
  lesson_content_key: es.a1.unit50.lesson06.elena_y_mateo_hacen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自埃琳娜和马特奥制定计划的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson01.translate.002
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自提议活动的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson01.order.003
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: word_order
  frame:
    text: ¿Tienes ganas de ir al {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cine
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tienes ganas de ir al {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 你想去看电影吗？¿Tienes ganas de ...? 用来随意地询问某人是否想做某事；de 后面接动词原形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson02.order.002
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: word_order
  frame:
    text: Es un buen {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_plan
  answer_derivation:
    kind: render_frame
    frame:
      text: Es un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这是个好计划。这是一种稍微完整一点的肯定回答。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson02.fill.003
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: fill_in_blank
  frame:
    text: Lo siento + no puedo + una razón {item} hace amable un rechazo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lo siento + no puedo + 简短的理由，能让拒绝显得友好。对话中理由可有可无，但加上理由会让句子更实用、更礼貌。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson03.order.002
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: word_order
  frame:
    text: Sí, el viernes a las dos y media me {item} bien.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viene
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, el viernes a las dos y media me {item} bien.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 好的，星期五 2:30 可以。Me viene bien（“对我合适”）用来确认提议的时间可行。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson04.order.002
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: word_order
  frame:
    text: Esta es una {item} al café de idiomas.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_invitación
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es una {item} al café de idiomas.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这是一份语言咖啡馆的邀请。invitación 的意思是“邀请”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit50.lesson04.fill.003
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: fill_in_blank
  frame:
    text: Tomamos un café en el café de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我们在语言咖啡馆喝咖啡。idiomas 的意思是“语言”。
    language_code: zh
    direction: ltr
