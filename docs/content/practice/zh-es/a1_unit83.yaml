schema_version: '1.0'
pack_key: practice.zh-es.a1.unit83
source_language: zh
target_language: es
unit_content_key: es.a1.unit83.theater
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actores
    - w_butaca
    - w_butacas
    - w_descanso
    - w_función
    - w_obra
    - w_popular
    - w_satisfecho
    - w_telón
templates:
- content_key: practice.zh-es.es.a1.unit83.lesson01.choose.001
  lesson_content_key: es.a1.unit83.lesson01.vamos_hoy_al_teatro
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_función
        - w_popular
        - w_telón
        - w_actores
        - w_obra
        - w_descanso
        - w_butacas
        - w_butaca
        - w_satisfecho
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“我们今天去剧院好吗?”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson02.listen.001
  lesson_content_key: es.a1.unit83.lesson02.el_escenario_y_el
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“舞台和幕布”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson03.translate.001
  lesson_content_key: es.a1.unit83.lesson03.los_actores_y_la
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“演员和售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson04.match.001
  lesson_content_key: es.a1.unit83.lesson04.el_programa_de_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson05.choose.001
  lesson_content_key: es.a1.unit83.lesson05.en_la_taquilla_del
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“在剧院售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson06.translate.001
  lesson_content_key: es.a1.unit83.lesson06.nina_se_entera_del
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“尼娜听说剧院的事”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson01.order.002
  lesson_content_key: es.a1.unit83.lesson01.vamos_hoy_al_teatro
  type: word_order
  frame:
    text: La {item} es popular.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_función
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} es popular.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 这场演出很受欢迎。función 的意思是演出、场次。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson02.order.002
  lesson_content_key: es.a1.unit83.lesson02.el_escenario_y_el
  type: word_order
  frame:
    text: El {item} es rojo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_telón
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es rojo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 幕布是红色的。telón 的意思是舞台幕布。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson03.order.002
  lesson_content_key: es.a1.unit83.lesson03.los_actores_y_la
  type: word_order
  frame:
    text: Los {item} son buenos.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_actores
  answer_derivation:
    kind: render_frame
    frame:
      text: Los {item} son buenos.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 演员们很出色。actores 的意思是演员们。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson05.order.002
  lesson_content_key: es.a1.unit83.lesson05.en_la_taquilla_del
  type: word_order
  frame:
    text: ¿Tenemos buenas {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_butacas
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tenemos buenas {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 埃琳娜:我们的座位好吗?butacas 的意思是(剧院的)座位。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit83.lesson06.order.002
  lesson_content_key: es.a1.unit83.lesson06.nina_se_entera_del
  type: word_order
  frame:
    text: Mateo está {item}, pero cansado.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_satisfecho
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo está {item}, pero cansado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 马特奥很满意,但是很累。satisfecho 的意思是满意的。
    language_code: zh
    direction: ltr
