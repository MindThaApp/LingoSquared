    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“比较 Diego 和 Lucía”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit52.lesson06.translate.001
  lesson_content_key: es.a1.unit52.lesson06.mateo_reconoce_a_nina
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“Mateo 认出 Nina”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit52.lesson01.order.002
  lesson_content_key: es.a1.unit52.lesson01.alto_bajo_mayor_y
  type: word_order
  frame:
    text: Diego es {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_bajo
  answer_derivation:
    kind: render_frame
    frame:
      text: Diego es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Diego 个子矮。bajo 的意思是“矮（指身高）”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit52.lesson01.fill.003
  lesson_content_key: es.a1.unit52.lesson01.alto_bajo_mayor_y
  type: fill_in_blank
  frame:
    text: El abuelo es {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_mayor
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_mayor
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 爷爷年纪大了。mayor 的意思是“年长的；上了年纪的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit52.lesson01.translate.004
  lesson_content_key: es.a1.unit52.lesson01.alto_bajo_mayor_y
  type: translation
  frame:
    text: Mateo 很年轻。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_joven
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mateo 很年轻。joven 的意思是“年轻的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit52.lesson02.order.002
  lesson_content_key: es.a1.unit52.lesson02.describir_el_pelo
  type: word_order
  frame:
    text: Mateo tiene el {item} corto y negro.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_pelo
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo tiene el {item} corto y negro.
      language_code: es
      direction: ltr
