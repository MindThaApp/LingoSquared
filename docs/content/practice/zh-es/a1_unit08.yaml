templates:
- content_key: practice.zh-es.es.a1.unit08.lesson01.choose.001
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Biblioteca 是图书馆；书店是 librería,这是一对常见的“假朋友”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson01.listen.002
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Banco 还可以指长椅；在本单元里，它指街上的银行。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson01.order.003
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: word_order
  frame:
    text: La {item} está cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} está cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 表示某物在哪里时用 estar:la farmacia está cerca。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson01.translate.004
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: translation
  frame:
    text: '{item}在市场旁边。'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está al lado del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De + el 缩合为 del:al lado del mercado,意思是“在市场旁边”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson02.fill.001
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: fill_in_blank
  frame:
    text: La farmacia está {item} del mercado. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Enfrente de、al lado de、lejos de 和 cerca de 后面接地点之前，都需要 de。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson02.order.002
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: word_order
  frame:
    text: El parque está {item} del mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El parque está {item} del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 公园离市场很远。反义表达是 cerca de,意思是“靠近”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson02.translate.003
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: translation
  frame:
    text: 图书馆在银行和公园之间。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La biblioteca está {item} el banco y el parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Entre 后面接用 y 连接的两个地点，后面不加 de。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson04.fill.001
  lesson_content_key: es.a1.unit08.lesson04.preguntar_si_esta_lejos
  type: fill_in_blank
  frame:
    text: Sí, está {item} lejos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bastante 的意思是“相当”:bastante lejos,相当远；bastante cerca,相当近。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson05.match.001
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: En este barrio hay muchos lugares útiles:hay 用来说明某处有什么。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson05.translate.002
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Útil 以辅音结尾，所以复数是 útiles。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson06.choose.001
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 不带重音的 donde 用来连接两个意思；带重音的 ¿dónde? 用来提问。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit08.lesson06.translate.002
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: translation
  frame:
    text: 它在我们买鸡蛋的那个市场旁边。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Está al lado del mercado donde {item} los huevos.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Compramos 既可以表示“我们买”，也可以表示“我们买了”，时间要看上下文。
    language_code: zh
    direction: ltr
