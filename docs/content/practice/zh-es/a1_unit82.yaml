    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“过山车和排队”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit82.lesson03.translate.001
  lesson_content_key: es.a1.unit82.lesson03.la_noria_y_la
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“摩天轮和售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit82.lesson04.match.001
  lesson_content_key: es.a1.unit82.lesson04.el_cartel_de_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个西班牙语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
