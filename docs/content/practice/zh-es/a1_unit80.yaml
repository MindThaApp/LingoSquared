schema_version: '1.0'
pack_key: practice.zh-es.a1.unit80
source_language: zh
target_language: es
unit_content_key: es.a1.unit80.dierentuin
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_barco
    - w_dieciséis
    - w_elefante
    - w_entradas
    - w_jirafa
    - w_leones
    - w_león
    - w_mono
    - w_pesado
templates:
- content_key: practice.zh-es.es.a1.unit80.lesson02.choose.001
  lesson_content_key: es.a1.unit80.lesson02.el_leon_y_el
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_león
        - w_elefante
        - w_pesado
        - w_mono
        - w_jirafa
        - w_leones
        - w_entradas
        - w_dieciséis
        - w_barco
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于狮子和大象的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit80.lesson03.listen.001
  lesson_content_key: es.a1.unit80.lesson03.el_mono_y_la
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于猴子和长颈鹿的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit80.lesson04.translate.001
  lesson_content_key: es.a1.unit80.lesson04.el_cartel_del_zoo
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于动物园告示牌的课程。'
    language_code: zh
