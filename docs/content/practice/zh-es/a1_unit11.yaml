schema_version: '1.0'
pack_key: practice.zh-es.a1.unit11
source_language: zh
target_language: es
unit_content_key: es.a1.unit11.clothing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u11
    - es_a1_u11_l01
    - w_mediana
    - w_talla
    - w_mal
    - w_comprarlo
    - w_barato
    - w_delantales
slot_presets:
  clothes: &id001
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u11_l01
  nouns: &id002
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u11
  content: &id007
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u11
  verbs: &id010
    language_code: es
    part_of_speech:
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u11
  mediana: &id003
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_mediana
  talla: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_talla
  mal: &id005
    language_code: es
    part_of_speech: adverb
    agreement_tags:
      semantic: w_mal
  comprarlo: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_comprarlo
  barato: &id008
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_barato
  delantales: &id009
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_delantales
templates:
- content_key: practice.zh-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 西班牙语常用单数 el pantalón(也可用 los pantalones)来指裤子。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa 和 chaqueta 是阴性;pantalón、delantal 和 zapatos 是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 以 -l 结尾的名词,复数加 -es:delantal,delantales。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 我穿中码。西班牙语表示所穿的尺码时用 usar(穿、使用)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Talla 是衣服的尺码;鞋码则用 el número:¿Qué número tienes?
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: 我穿着不合身。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Quedar bien 或 mal 表示衣服穿在你身上合不合身:me queda bien,我穿着很合身。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ir a + 动词原形表示计划:voy a comprarlo,我打算买它。代词 lo(它)接在动词原形的末尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Uso、usas 和 usan 都来自 usar:我穿、你穿、他们穿。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Más + 形容词表示比较:más barato,更便宜。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 是的,我们在为工作坊找围裙。Buscar 本身就有“寻找”的意思,所以 buscamos delantales 不需要再加其他词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 店员用 ¿Los ayudo? 来表示提供帮助,意思是“需要我帮您们吗?”
    language_code: zh
    direction: ltr
- content_key: practice.zh-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Voy 来自 ir(去),是不规则变位:voy,vas,va。
    language_code: zh
    direction: ltr
