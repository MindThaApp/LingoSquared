schema_version: '1.0'
pack_key: practice.en-fr.a1.unit65
source_language: en
target_language: fr
unit_content_key: fr.a1.unit65.couleurs
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u65 / w_<token>). 16 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_achètent, w_belles, w_blanc, w_jaune, w_nom, w_orange, w_rendent, w_rose, w_roses, w_rouges, w_trouvent, w_tulipes, w_veut, w_violet, w_vont, w_voudrait]
templates:
- content_key: practice.en-fr.fr.a1.unit65.lesson01.choose.001
  lesson_content_key: fr.a1.unit65.lesson01.rouge_et_jaune
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_tulipes, w_rouges, w_jaune, w_blanc, w_orange, w_rose, w_roses, w_nom, w_violet, w_vont, w_veut, w_voudrait, w_achètent, w_belles, w_trouvent, w_rendent]
