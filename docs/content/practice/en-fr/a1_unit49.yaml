schema_version: '1.0'
pack_key: practice.en-fr.a1.unit49
source_language: en
target_language: fr
unit_content_key: fr.a1.unit49.emotions
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u49 / w_<token>). 18 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_arriver, w_colère, w_content, w_fier, w_honnêtement, w_nerveux, w_nouveau, w_pense, w_pourquoi, w_remplace, w_sent, w_seras, w_service, w_seul, w_sûrement, w_triste, w_vas, w_vraiment]
templates:
- content_key: practice.en-fr.fr.a1.unit49.lesson01.choose.001
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_content, w_triste, w_colère, w_pourquoi, w_nerveux, w_service, w_sent, w_seul, w_nouveau, w_pense, w_honnêtement, w_vas, w_arriver, w_vraiment, w_seras, w_sûrement, w_fier, w_remplace]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on happy, sad, or angry?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson02.listen.001
  lesson_content_key: fr.a1.unit49.lesson02.pourquoi_es_tu_content
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on why are you happy?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson03.translate.001
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nervous about something.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson04.match.001
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson05.choose.001
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a message about feelings.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson06.translate.001
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on camille reassures mathieu.', language_code: en, direction: ltr}
