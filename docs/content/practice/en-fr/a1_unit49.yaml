      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_service}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Hi Mathieu, how are you feeling about your first shift? Avant ton premier service (before your first shift) reuses the avant + noun pattern from lesson 3.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame: {text: 'Comment se {item} Mathieu ?', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_sent}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Comment se {item} Mathieu ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'How does Mathieu feel? Se sentir (to feel, reflexive) is the standard way to ask about or describe an emotional state; it also appears in the health unit.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame: {text: 'Oui, je {item} aussi.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_pense}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Oui, je {item} aussi.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Yes, I think so too. Je pense aussi is the natural way to agree with someone''s opinion.', language_code: en, direction: ltr}
