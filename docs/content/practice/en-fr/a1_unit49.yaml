    kind: render_frame
    frame: {text: 'Je suis {item} avant mon premier service.', language_code: fr, direction: ltr}
  feedback_frame: {text: I am nervous about my first shift. nerveux means nervous (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_service}
