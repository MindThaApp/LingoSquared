    kind: render_frame
    frame: {text: 'Je suis un peu nerveux, {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'I''m a bit nervous, honestly. Honnêtement (honestly) softens the admission.', language_code: en, direction: ltr}
