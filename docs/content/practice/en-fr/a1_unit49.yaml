  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_vas}
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_vas}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Don''t worry, you can do it well! Tu vas y arriver (literally ''you will get there'') is an encouraging fixed expression; aller + infinitive makes the near future.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
