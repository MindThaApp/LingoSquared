schema_version: "1.0"
pack_key: practice.en-fr.a1.unit13
source_language: en
target_language: fr
unit_content_key: fr.a1.unit13.preferences
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-fr job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (per-unit tags fr_a1_u13*, single-member w_<token> anchors, curated w_ lists). Frames follow this unit's straight apostrophes. Sucre/sucree and sale/salee are gender homophones, so no listen pool contains both members of a pair (lesson 03 has only feminine forms, lesson 01 listen has neither). Mieux was re-glossed better (adverb) so it does not clash with meilleur (unit 14). Reviewer: confirm j'aime mieux ... que and the sucre/sale frames.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aimer, w_chocolat, w_dérange, w_déteste, w_détester, w_facile, w_mieux, w_ou, w_plats, w_plutôt, w_pourrait, w_préfères, w_préférer, w_prépare, "w_qu'on", w_quiche, w_salée, w_sucrée, w_tarte, w_trop, w_épices]
slot_presets:
  c1: &c1 {language_code: fr, part_of_speech: [noun, adverb, adjective, verb], agreement_tags: {semantic: [w_tarte, w_chocolat, w_plats, w_épices, w_trop, w_plutôt, w_facile, w_détester, w_aimer, w_préférer]}}
  lis1: &lis1 {language_code: fr, part_of_speech: [noun, adverb, adjective, verb], agreement_tags: {semantic: [w_tarte, w_chocolat, w_plats, w_épices, w_trop, w_plutôt, w_facile, w_détester]}}
  a_mieux_adve: &a_mieux_adve {language_code: fr, part_of_speech: adverb, agreement_tags: {semantic: w_mieux}}
  a_deteste_verb: &a_deteste_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_déteste}}
  a_tarte_noun: &a_tarte_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_tarte}}
  tb1: &tb1 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_tarte, w_chocolat, w_épices, w_plats]}}
  c2: &c2 {language_code: fr, part_of_speech: [noun, particle, verb, adverb], agreement_tags: {semantic: [w_quiche, w_ou, w_dérange, w_pourrait, w_tarte, w_trop]}}
  lis2: &lis2 {language_code: fr, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: [w_quiche, w_dérange, w_pourrait, w_tarte, w_trop, w_plutôt]}}
  a_ou_part: &a_ou_part {language_code: fr, part_of_speech: particle, agreement_tags: {semantic: w_ou}}
  a_derange_verb: &a_derange_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_dérange}}
  a_preferes_verb: &a_preferes_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_préfères}}
  c3: &c3 {language_code: fr, part_of_speech: [pronoun, verb, adjective], agreement_tags: {semantic: ["w_qu'on", w_prépare, w_sucrée, w_salée]}}
  m3: &m3 {language_code: fr, part_of_speech: [pronoun, verb, adjective, noun, adverb, particle], agreement_tags: {semantic: ["w_qu'on", w_prépare, w_sucrée, w_salée, w_tarte, w_quiche, w_plutôt, w_ou]}}
  a_salee_adje: &a_salee_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_salée}}
  a_sucree_adje: &a_sucree_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_sucrée}}
  a_prepare_verb: &a_prepare_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_prépare}}
  a_quiche_noun: &a_quiche_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_quiche}}
templates:
  - content_key: practice.en-fr.fr.a1.unit13.lesson01.choose.001
    lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Préférer, aimer and détester are the main verbs for expressing likes and dislikes.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson01.listen.002
    lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Épices is plural; the final -s is silent, so épice would sound the same.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson01.order.004
    lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
    type: word_order
    frame: {text: "J'aime {item} les plats salés que les plats sucrés.", language_code: fr, direction: ltr}
    slots: {item: *a_mieux_adve}
    answer_derivation: {kind: render_frame, frame: {text: "J'aime {item} les plats salés que les plats sucrés.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Aimer mieux means to prefer; que introduces what is less liked.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson01.fill.006
    lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
    type: fill_in_blank
    frame: {text: "Mathieu {item} les épices trop fortes. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_deteste_verb, hint: *a_deteste_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Déteste is the il form of détester, matching Mathieu.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson01.translate.008
    lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
    type: translation
    frame: {text: "I prefer the chocolate tart.", language_code: en, direction: ltr}
    slots: {item: *a_tarte_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Je préfère la {item} au chocolat.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Au is à plus le; au chocolat describes the flavour of the tart.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson01.translate.009
    lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *tb1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Tarte, chocolat, épices and plats are the foods named in the preferences lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson02.choose.001
    lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ou means or, while où (with an accent) means where; the accent makes the difference.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson02.listen.002
    lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pourrait is the conditional of pouvoir, used to make a polite suggestion: on pourrait.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson02.order.004
    lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
    type: word_order
    frame: {text: "Tu aimes plutôt le sucré {item} le salé ?", language_code: fr, direction: ltr}
    slots: {item: *a_ou_part}
    answer_derivation: {kind: render_frame, frame: {text: "Tu aimes plutôt le sucré {item} le salé ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Ou joins two choices: sucré ou salé means sweet or savoury.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson02.fill.006
    lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
    type: fill_in_blank
    frame: {text: "Ça ne me {item} pas. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_derange_verb, hint: *a_derange_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ça ne me dérange pas means it does not bother me.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson02.translate.007
    lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
    type: translation
    frame: {text: "What do you prefer? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *a_preferes_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Qu'est-ce que tu {item} ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Tu préfères uses the tu form of préférer; vous préférez would be the polite form.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.choose.001
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Sucrée and salée have a final -e because tarte and quiche are feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.listen.002
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Sucrée and salée are the feminine forms; they end in a silent -e.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.match.003
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *m3, second: *m3, third: *m3, fourth: *m3, fifth: *m3, sixth: *m3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Sucrée and salée describe the feminine nouns tarte and quiche.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.order.004
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: word_order
    frame: {text: "Parfait, une tarte sucrée et une quiche {item} pour samedi.", language_code: fr, direction: ltr}
    slots: {item: *a_salee_adje}
    answer_derivation: {kind: render_frame, frame: {text: "Parfait, une tarte sucrée et une quiche {item} pour samedi.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Salée is feminine to agree with quiche.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.fill.005
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: fill_in_blank
    frame: {text: "Je préfère la tarte, plutôt {item}. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_sucree_adje, hint: *a_sucree_adje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sucrée is feminine to agree with tarte.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.translate.006
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: translation
    frame: {text: "What are we making on Saturday?", language_code: en, direction: ltr}
    slots: {item: *a_prepare_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Qu'est-ce qu'on {item} samedi ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "On prépare is the usual spoken way to say we are making.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit13.lesson03.translate.007
    lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
    type: translation
    frame: {text: "I prefer the quiche to the tart.", language_code: en, direction: ltr}
    slots: {item: *a_quiche_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Je préfère la {item} à la tarte.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Préférer A à B means to prefer A to B; à la links the two.", language_code: en, direction: ltr}
