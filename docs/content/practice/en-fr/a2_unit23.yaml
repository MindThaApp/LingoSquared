templates:
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.choose.001
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *week_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cours means class or lesson; courses means shopping or errands.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.listen.002
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *week_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Chargée is feminine because it describes une semaine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.match.003
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *week_match, second: *week_match, third: *week_match, fourth: *week_match, fifth: *week_match, sixth: *week_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words for talking about a busy schedule.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.order.004
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: word_order
    frame: {text: "Le jeudi, je fais les {item}.", language_code: fr, direction: ltr}
    slots: {item: *courses_single}
    answer_derivation: {kind: render_frame, frame: {text: "Le jeudi, je fais les {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Faire les courses means to do the shopping.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.fill.005
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: fill_in_blank
    frame: {text: "Cette semaine est très {item} pour Inès. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *chargee_single, hint: *chargee_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Chargée agrees with the feminine noun semaine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.translate.006
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *week_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cours is spelled the same in the singular and the plural.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson01.translate.007
    lesson_content_key: fr.a2.unit23.lesson01.jours_activites
    type: translation
    frame: {text: "Thursday: shopping after work.", language_code: en, direction: ltr}
    slots: {item: *jeudi_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} : courses après le travail.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "In a planner the weekday comes first, written in lower case.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.choose.001
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *seq_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "D'abord, ensuite and puis put activities in order.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.listen.002
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *seq_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Reposes goes with tu; repose goes with je, il or elle.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.match.003
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *seq_match, second: *seq_match, third: *seq_match, fourth: *seq_match, fifth: *seq_match, sixth: *seq_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Sequencing words and everyday activities.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.order.004
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: word_order
    frame: {text: "Je {item} chez moi après le travail.", language_code: fr, direction: ltr}
    slots: {item: *rentre_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je {item} chez moi après le travail.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Rentrer means to go back home.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.fill.005
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: fill_in_blank
    frame: {text: "Le samedi matin, je vais au {item}. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *marche_single, hint: *marche_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Au marché means at the market; le marché is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.translate.006
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *seq_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Révise and travaille are the je or il forms; the infinitives end in -er.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit23.lesson02.translate.007
    lesson_content_key: fr.a2.unit23.lesson02.enchainer_activites
    type: translation
    frame: {text: "When do you rest? (Informal.)", language_code: en, direction: ltr}
    slots: {item: *reposes_single}
    answer_derivation: {kind: render_frame, frame: {text: "Tu te {item} quand ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Se reposer is reflexive: tu te reposes.", language_code: en, direction: ltr}
