schema_version: '1.0'
pack_key: practice.en-fr.a1.unit64
source_language: en
target_language: fr
unit_content_key: fr.a1.unit64.personnalite
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u64 / w_<token>). 11 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_calme, w_connaissez, w_curieux, w_différent, w_drôle, w_gentille, w_notre, w_parler, w_patient, w_raconte, w_timide]
templates:
- content_key: practice.en-fr.fr.a1.unit64.lesson01.choose.001
  lesson_content_key: fr.a1.unit64.lesson01.gentil_et_drole
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_gentille, w_drôle, w_calme, w_patient, w_curieux, w_parler, w_timide, w_connaissez, w_raconte, w_différent, w_notre]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on kind and funny.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit64.lesson02.listen.001
  lesson_content_key: fr.a1.unit64.lesson02.calme_et_patient
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on calm and patient.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit64.lesson03.translate.001
