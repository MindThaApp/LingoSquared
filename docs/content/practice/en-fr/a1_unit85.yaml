schema_version: '1.0'
pack_key: practice.en-fr.a1.unit85
source_language: en
target_language: fr
unit_content_key: fr.a1.unit85.theatre
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u85 / w_<token>). 9 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acteurs, w_bonnes, w_entracte, w_géniaux, w_pièce, w_places, w_rideau, w_satisfait, w_spectacle]
templates:
- content_key: practice.en-fr.fr.a1.unit85.lesson01.choose.001
  lesson_content_key: fr.a1.unit85.lesson01.on_va_au_theatre
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_spectacle, w_rideau, w_acteurs, w_pièce, w_entracte, w_bonnes, w_places, w_satisfait, w_géniaux]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the theatre today?.', language_code: en, direction: ltr}
