templates:
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.choose.001
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *comp_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Un produit défectueux is a faulty product that can be returned.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.listen.002
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *comp_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Échangés and remboursés are masculine plural, agreeing with les produits.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.match.003
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *comp_match, second: *comp_match, third: *comp_match, fourth: *comp_match, fifth: *comp_match, sixth: *comp_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Shop and complaint vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.order.004
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: word_order
    frame: {text: "Il faut garder le {item} de caisse.", language_code: fr, direction: ltr}
    slots: {item: *ticket_single}
    answer_derivation: {kind: render_frame, frame: {text: "Il faut garder le {item} de caisse.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Le ticket de caisse is the till receipt needed for a return.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.fill.005
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: fill_in_blank
    frame: {text: "Le magasin {item} les produits défectueux. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *reprend_single, hint: *reprend_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Reprendre means to take back.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.translate.006
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *comp_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Réclamation is the word for a formal complaint.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson01.translate.007
    lesson_content_key: fr.a2.unit24.lesson01.expliquer_probleme
    type: translation
    frame: {text: "You have fourteen days.", language_code: en, direction: ltr}
    slots: {item: *quatorze_single}
    answer_derivation: {kind: render_frame, frame: {text: "Vous avez {item} jours.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Quatorze jours is the usual return period quoted in shops.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.choose.001
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *fix_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Un échange is an exchange of goods; un remboursement is a refund.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.listen.002
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *fix_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Propose is the present tense; proposer is the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.match.003
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *fix_match, second: *fix_match, third: *fix_match, fourth: *fix_match, fifth: *fix_match, sixth: *fix_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words for negotiating a solution with the seller.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.order.004
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: word_order
    frame: {text: "Le {item} propose un échange.", language_code: fr, direction: ltr}
    slots: {item: *vendeur_single}
    answer_derivation: {kind: render_frame, frame: {text: "Le {item} propose un échange.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Le vendeur is the salesperson; the feminine is la vendeuse.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.fill.005
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: fill_in_blank
    frame: {text: "Dans ce {item}, je peux vous proposer un échange. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *cas_single, hint: *cas_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dans ce cas means in that case.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.translate.006
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *fix_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Présentation here means showing a document such as a receipt.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit24.lesson02.translate.007
    lesson_content_key: fr.a2.unit24.lesson02.demander_solution
    type: translation
    frame: {text: "Right away.", language_code: en, direction: ltr}
    slots: {item: *suite_single}
    answer_derivation: {kind: render_frame, frame: {text: "Tout de {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Tout de suite is a fixed phrase: the word suite alone does not mean immediately.", language_code: en, direction: ltr}
