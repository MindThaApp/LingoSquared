schema_version: "1.0"
pack_key: practice.en-fr.a1.unit08
source_language: en
target_language: fr
unit_content_key: fr.a1.unit08.dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-fr job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (per-unit tags fr_a1_u08*, single-member w_<token> anchors, curated w_ lists). Frames follow this unit's straight apostrophes. Canon: the workshop takes place on Saturday, so L'atelier a lieu le {item} is anchored to samedi only. Temps is glossed time (to do something), the sense taught; date as calendar date. Reviewer: check the le quinze mars date frames. Opus pass 2026-10-24: English for L'atelier a lieu le samedi now says on Saturdays (le + day is habitual); the c'est le quinze mars prompt now says to start with c'est, since nous sommes le quinze mars is also taught.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_bonne, w_date, w_demain, w_dimanche, w_donc, w_hier, w_idée, w_jour, "w_l'occasion", w_lundi, w_mars, w_premier, w_préparer, w_quand, w_samedi, w_séance, w_temps, w_termine, w_vingt-deux]
slot_presets:
  c1: &c1 {language_code: fr, part_of_speech: [noun, adverb], agreement_tags: {semantic: [w_lundi, w_samedi, w_dimanche, w_demain, w_hier, w_jour]}}
  a_demain_adve: &a_demain_adve {language_code: fr, part_of_speech: adverb, agreement_tags: {semantic: w_demain}}
  a_dimanche_noun: &a_dimanche_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_dimanche}}
  a_samedi_noun: &a_samedi_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_samedi}}
  c2: &c2 {language_code: fr, part_of_speech: [noun, adjective, verb], agreement_tags: {semantic: [w_mars, w_date, w_premier, w_termine, w_vingt-deux]}}
  a_mars_noun: &a_mars_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_mars}}
  a_termine_verb: &a_termine_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_termine}}
  a_date_noun: &a_date_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_date}}
  c3: &c3 {language_code: fr, part_of_speech: [adverb, noun, verb, adjective], agreement_tags: {semantic: [w_quand, w_séance, w_donc, w_temps, w_préparer, w_idée, w_bonne]}}
  lis3: &lis3 {language_code: fr, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: [w_quand, w_séance, w_donc, w_temps, w_préparer, w_idée]}}
  m3: &m3 {language_code: fr, part_of_speech: [adverb, noun, verb, adjective], agreement_tags: {semantic: [w_quand, w_séance, w_donc, w_temps, w_préparer, w_idée, w_bonne, "w_l'occasion"]}}
  a_preparer_verb: &a_preparer_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_préparer}}
  a_quand_adve: &a_quand_adve {language_code: fr, part_of_speech: adverb, agreement_tags: {semantic: w_quand}}
  a_idee_noun: &a_idee_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_idée}}
templates:
  - content_key: practice.en-fr.fr.a1.unit08.lesson01.choose.001
    lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lundi, samedi and dimanche are not capitalised in French, and le before a day means every week: le samedi.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson01.listen.002
    lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Demain and hier are the adverbs for tomorrow and yesterday; neither takes a preposition.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson01.match.003
    lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *c1, second: *c1, third: *c1, fourth: *c1, fifth: *c1, sixth: *c1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "French days of the week are masculine and written with a small letter.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson01.order.004
    lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
    type: word_order
    frame: {text: "La pharmacie ouvre {item}.", language_code: fr, direction: ltr}
    slots: {item: *a_demain_adve}
    answer_derivation: {kind: render_frame, frame: {text: "La pharmacie ouvre {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Demain means tomorrow and is placed after the verb, with no preposition.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson01.fill.005
    lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
    type: fill_in_blank
    frame: {text: "La boulangerie est fermée le {item}. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_dimanche_noun, hint: *a_dimanche_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Le dimanche means on Sundays as a regular habit.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson01.translate.007
    lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
    type: translation
    frame: {text: "The workshop takes place on Saturdays.", language_code: en, direction: ltr}
    slots: {item: *a_samedi_noun}
    answer_derivation: {kind: render_frame, frame: {text: "L'atelier a lieu le {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "L'atelier a lieu le samedi means the workshop is held on Saturdays.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson02.choose.001
    lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Premier is the ordinal for the first day only; other dates use cardinal numbers: le premier mars, le quinze mars.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson02.listen.002
    lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mars is a month; French months, like days, are not capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson02.order.003
    lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
    type: word_order
    frame: {text: "Nous sommes le quinze {item}.", language_code: fr, direction: ltr}
    slots: {item: *a_mars_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Nous sommes le quinze {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Dates follow the pattern le + number + month: le quinze mars.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson02.fill.004
    lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
    type: fill_in_blank
    frame: {text: "L'atelier se {item} le vingt-deux mars. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_termine_verb, hint: *a_termine_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Se termine is the reflexive form meaning ends or finishes.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson02.translate.005
    lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
    type: translation
    frame: {text: "What is the date today?", language_code: en, direction: ltr}
    slots: {item: *a_date_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Quelle est la {item} aujourd'hui ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Quelle est la date aujourd'hui is the standard way to ask for the calendar date.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson02.translate.006
    lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
    type: translation
    frame: {text: "It is the fifteenth of March. (start with c'est)", language_code: en, direction: ltr}
    slots: {item: *a_mars_noun}
    answer_derivation: {kind: render_frame, frame: {text: "C'est le quinze {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "French uses ordinary numbers for dates, so the fifteenth is simply quinze.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson03.choose.001
    lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Quand asks when; donc links a conclusion to what was just said.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson03.listen.002
    lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Séance is the word for a session, such as a workshop session or a film showing.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson03.match.003
    lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *m3, second: *m3, third: *m3, fourth: *m3, fifth: *m3, sixth: *m3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Séance, idée and occasion are feminine nouns; temps is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson03.order.004
    lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
    type: word_order
    frame: {text: "Parfait, j'ai le temps de {item} un dessert pour l'occasion.", language_code: fr, direction: ltr}
    slots: {item: *a_preparer_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Parfait, j'ai le temps de {item} un dessert pour l'occasion.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "After avoir le temps de the verb stays in the infinitive: préparer.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson03.fill.005
    lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
    type: fill_in_blank
    frame: {text: "C'est {item}, la dernière séance de l'atelier ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_quand_adve, hint: *a_quand_adve}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "C'est quand ... ? is a casual way to ask when something happens.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit08.lesson03.translate.006
    lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
    type: translation
    frame: {text: "Good idea!", language_code: en, direction: ltr}
    slots: {item: *a_idee_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Bonne {item} !", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Idée is feminine, so the adjective is bonne, not bon.", language_code: en, direction: ltr}
