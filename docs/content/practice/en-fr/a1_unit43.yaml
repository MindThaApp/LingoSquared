schema_version: '1.0'
pack_key: practice.en-fr.a1.unit43
source_language: en
target_language: fr
unit_content_key: fr.a1.unit43.voyage
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u43 / w_<token>). 23 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_allez, w_arrive, w_attention, w_billet, w_doit, w_déjà, w_départ, w_encore, w_guichet, w_général, w_monte, w_panneau, w_part, w_pile, w_problème, w_quai, w_quarante, w_salle, w_simple, w_sortie, w_train, w_utilise, w_vouvoiement]
templates:
- content_key: practice.en-fr.fr.a1.unit43.lesson01.choose.001
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_billet, w_simple, w_guichet, w_utilise, w_général, w_vouvoiement, w_quai, w_part, w_train, w_arrive, w_attention, w_sortie, w_salle, w_départ, w_quarante, w_doit, w_panneau, w_problème, w_encore, w_déjà, w_pile, w_allez, w_monte]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on buying a ticket.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson02.listen.001
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what time does the train leave?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson03.translate.001
  lesson_content_key: fr.a1.unit43.lesson03.le_retard
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on delay.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson04.match.001
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson05.choose.001
  lesson_content_key: fr.a1.unit43.lesson05.lire_un_billet_de
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a train ticket.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson06.translate.001
  lesson_content_key: fr.a1.unit43.lesson06.camille_et_mathieu_en
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on camille and mathieu travel.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson01.order.002
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: word_order
  frame: {text: 'Je voudrais un {item} pour Lyon.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_billet}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je voudrais un {item} pour Lyon.', language_code: fr, direction: ltr}
  feedback_frame: {text: I would like a ticket to Lyon. billet means ticket., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson01.fill.003
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: fill_in_blank
  frame:
    text: Voulez-vous un aller {item} ou un aller-retour ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_simple}
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_simple}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Would you like a one-way ticket or a return? Voulez-vous is the formal vous form of vouloir, used here for an unfamiliar station employee.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson02.order.002
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: word_order
  frame: {text: 'De quel {item} part le train pour Lyon ?', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_quai}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De quel {item} part le train pour Lyon ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'From which platform does the train to Lyon leave? quai means platform.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson02.fill.003
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: fill_in_blank
  frame:
    text: Le train ne {item} pas à l'heure. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_part}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_part}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The train does not leave on time. part means side; share (as in 'on your side')., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson02.translate.004
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: translation
  frame: {text: 'What time does the train arrive?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_train}
  answer_derivation:
    kind: render_frame
    frame: {text: 'À quelle heure arrive le {item} ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'What time does the train arrive? À quelle heure arrive ... ? asks for the time; arriver is a regular -er verb: le train arrive.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson04.order.002
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: word_order
  frame: {text: 'Où est la {item} ?', language_code: fr, direction: ltr}
  slots:
