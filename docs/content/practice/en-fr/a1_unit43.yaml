    frame: {text: 'Où est la {item} ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Where is the exit? sortie means exit.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit43.lesson04.fill.003
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
