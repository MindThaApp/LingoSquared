schema_version: '1.0'
pack_key: practice.en-fr.c1.unit07
source_language: en
target_language: fr
unit_content_key: fr.c1.unit07.mediation_sources
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_c1_u7 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_affirme, w_affirmer, w_attribuer, w_autrement, w_bloqueront, w_boutiques, w_calendrier, w_commenceront, w_concertation, w_contraire, w_contredire, w_décidée, w_démentir, w_désaccord, w_feraient, w_fuir, w_incertain, w_incertitude, w_information, w_lieu, w_mairie, w_mars, w_mois, w_piétonnisation, w_piétonnisée, w_piétons, w_plusieurs, w_printemps, w_préserver, w_reformuler, w_reste, w_rue, w_réservée, w_résume, w_semble, w_sera, w_simples, w_source, w_sources, w_travaux]
templates:
- content_key: practice.en-fr.fr.c1.unit07.lesson01.choose.001
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson01.attribution
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_source, w_mairie, w_affirmer, w_contraire, w_rue, w_sera, w_piétonnisée, w_mois, w_mars, w_contredire, w_désaccord, w_démentir, w_information, w_concertation, w_affirme, w_lieu, w_reformuler, w_simples, w_autrement, w_réservée, w_piétons, w_piétonnisation, w_préserver, w_attribuer, w_travaux, w_bloqueront, w_boutiques, w_plusieurs, w_feraient, w_fuir, w_semble, w_décidée, w_résume, w_sources, w_commenceront, w_printemps, w_calendrier, w_reste, w_incertain, w_incertitude]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on attributing information.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson02.listen.001
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson02.desaccord
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the point of disagreement.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson03.translate.001
