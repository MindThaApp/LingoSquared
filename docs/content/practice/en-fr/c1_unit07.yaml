    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on writing the briefing.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson01.order.002
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson01.attribution
  type: word_order
  frame: {text: 'Le calendrier reste une {item} d''incertitude.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_source}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le calendrier reste une {item} d''incertitude.', language_code: fr, direction: ltr}
  feedback_frame: {text: The timetable remains a source of uncertainty. source means source., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson01.fill.003
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson01.attribution
  type: fill_in_blank
  frame:
    text: Selon la {item}, la rue sera piétonnisée au mois de mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_mairie}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_mairie}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'According to the town hall, the street will be pedestrianized in March. This sentence attributes the pedestrianization to the town hall — the speaker reports the claim without endorsing it.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson01.translate.004
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson01.attribution
  type: translation
  frame: {text: 'Pedestrianization, that is to say a street reserved for pedestrians.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_rue}
  answer_derivation:
    kind: render_frame
    frame: {text: 'La piétonnisation, c''est-à-dire une {item} réservée aux piétons.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Pedestrianization, that is to say a street reserved for pedestrians. This resolves the jargon: piétonnisation is restated as une rue réservée aux piétons for the non-specialist.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson03.order.002
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson03.reformulation
  type: word_order
  frame: {text: 'La piétonnisation, c''est-à-dire une rue {item} aux piétons.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_réservée}
  answer_derivation:
    kind: render_frame
    frame: {text: 'La piétonnisation, c''est-à-dire une rue {item} aux piétons.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Pedestrianization, that is to say a street reserved for pedestrians. This resolves the jargon: piétonnisation is restated as une rue réservée aux piétons for the non-specialist.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson03.fill.003
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson03.reformulation
  type: fill_in_blank
  frame:
    text: Les travaux feraient fuir la clientèle, mais la {item} semble décidée. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_piétonnisation}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_piétonnisation}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'The works would drive customers away, but the pedestrianization seems decided. Semble décidée (seems decided) and mais (but) keep the tension: the plan looks settled, yet its consequences are contested.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.c1.unit07.lesson04.order.002
  lesson_content_key: fr.c1.unit07.mediation_sources.lesson04.attribution_fidele
  type: word_order
  frame: {text: 'Les {item} feraient fuir la clientèle, mais la piétonnisation semble décidée.', language_code: fr, direction: ltr}
