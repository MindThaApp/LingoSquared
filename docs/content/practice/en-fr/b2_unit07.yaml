- content_key: practice.en-fr.fr.b2.unit07.lesson01.order.002
  lesson_content_key: fr.b2.unit07.lesson01.faire_une_proposition
  type: word_order
  frame: {text: 'Monsieur Lefebvre, je {item} vous proposer quelque chose.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_voudrais}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Monsieur Lefebvre, je {item} vous proposer quelque chose.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Monsieur Lefebvre, I would like to propose something to you. Je voudrais vous proposer... opens a negotiation politely, using vous -- the respectful register Inès uses with her employer throughout this unit.', language_code: en, direction: ltr}
