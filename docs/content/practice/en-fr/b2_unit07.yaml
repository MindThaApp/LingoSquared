- content_key: practice.en-fr.fr.b2.unit07.lesson01.choose.001
  lesson_content_key: fr.b2.unit07.lesson01.faire_une_proposition
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_voudrais, w_proposer, w_quelque, w_chose, w_chocolat, w_perfectionner, w_cours, w_soir, w_suivre, w_jeudi, w_semaines, w_partir, w_tôt, w_jour, w_crains, w_chargé, w_malheureusement, w_accepter, w_compliqué, w_rattraper, w_samedi, w_rattrapez, w_pourrais, w_condition, w_seulement, w_sommes, w_marché, w_conclu, w_confirmer, w_partez, w_avons, w_décidé, w_dernier, w_tombe, w_soldes, w_pourrez, w_reparlerons, w_dimanche, w_écoute, w_cas, w_plaisir]
