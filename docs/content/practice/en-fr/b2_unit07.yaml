  feedback_frame: {text: I work Saturday mornings. samedi means Saturday., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit07.lesson03.translate.004
  lesson_content_key: fr.b2.unit07.lesson03.poser_une_condition
  type: translation
  frame: {text: 'I can accept, but only if you make up the hours.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_rattrapez}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je peux accepter, mais seulement si vous {item} les heures.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'I can accept, but only if you make up the hours. mais seulement si + PRESENT is a simpler, more casual-sounding way to attach the same condition as à condition que -- both are correct and common in vous-register negotiation.', language_code: en, direction: ltr}
