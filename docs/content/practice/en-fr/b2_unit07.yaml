  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_chocolat}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_chocolat}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Chocolate work demands precision. chocolat means chocolate., language_code: en, direction: ltr}
