    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_chargé}
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_chargé}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Friday is a very busy day for us. chargé means busy; full (masc.)., language_code: en, direction: ltr}
