    frame: {text: 'Je voudrais {item} le travail du chocolat.', language_code: fr, direction: ltr}
  feedback_frame: {text: I would like to perfect chocolate work. perfectionner means to improve; perfect., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit07.lesson02.order.002
  lesson_content_key: fr.b2.unit07.lesson02.refuser_poliment
  type: word_order
  frame: {text: 'Je {item} que ce ne soit pas possible.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_crains}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je {item} que ce ne soit pas possible.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'I''m afraid that''s not possible. Je crains que (''I''m afraid that'') is followed by the subjunctive (soit). Here ne ... pas is an ordinary negation: literally ''I fear that it is not possible''. Don''t confuse it with the expletive ne.', language_code: en, direction: ltr}
