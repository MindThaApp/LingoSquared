schema_version: '1.0'
pack_key: practice.en-fr.a1.unit70
source_language: en
target_language: fr
unit_content_key: fr.a1.unit70.hebergement
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u70 / w_<token>). 12 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_avait, w_cet, w_clé, w_compris, w_mot, w_nuit, w_nuits, w_réceptionniste, w_réservation, w_réserver, w_réservé, w_wifi]
templates:
