  lesson_content_key: fr.a1.unit70.lesson01.reserver_une_chambre
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_réserver, w_cet, w_réservé, w_compris, w_clé, w_mot, w_wifi, w_réceptionniste, w_réservation, w_nuits, w_nuit, w_avait]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on booking a room.', language_code: en, direction: ltr}
