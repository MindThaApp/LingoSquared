  lesson_content_key: fr.c1.unit05.contrefactuel.lesson04.regret
  type: word_order
  frame: {text: 'Je n''aurais pas dû {item} le dernier moment pour me décider.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_attendre}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je n''aurais pas dû {item} le dernier moment pour me décider.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'I should not have waited until the last moment to make up my mind. This sentence regrets the delay in deciding — the regret is about the timing, not about the decision itself.', language_code: en, direction: ltr}
