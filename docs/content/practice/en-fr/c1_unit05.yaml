    semantic: [w_accepté, w_attendre, w_aurais, w_choisi, w_contente, w_contrefactuelle, w_davantage, w_demander, w_dernier, w_différent, w_décider, w_ici, w_jamais, w_maintenant, w_monsieur, w_penser, w_recul, w_rencontré, w_restée, w_réfléchi, w_serais, w_serait, w_seulement, w_travaillerais, w_tôt, w_venue]
