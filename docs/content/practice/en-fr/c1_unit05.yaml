  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_recul, w_serais, w_tôt, w_demander, w_davantage, w_aurais, w_penser, w_accepté, w_jamais, w_rencontré, w_monsieur, w_restée, w_venue, w_travaillerais, w_maintenant, w_serait, w_différent, w_attendre, w_dernier, w_décider, w_seulement, w_réfléchi, w_choisi, w_contente, w_ici, w_contrefactuelle]
  answer_derivation: {kind: slot_gloss, slot: item}
