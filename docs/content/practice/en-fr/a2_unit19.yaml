templates:
  - content_key: practice.en-fr.fr.a2.unit19.lesson01.choose.001
    lesson_content_key: fr.a2.unit19.lesson01.vocabulaire_probleme
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *home_nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Le propriétaire owns the flat and le locataire rents it.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson01.listen.002
    lesson_content_key: fr.a2.unit19.lesson01.vocabulaire_probleme
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *home_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Fuir is the infinitive; fuit is the form after a singular subject.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson01.match.003
    lesson_content_key: fr.a2.unit19.lesson01.vocabulaire_probleme
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *home_match, second: *home_match, third: *home_match, fourth: *home_match, fifth: *home_match, sixth: *home_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Household faults and the people involved in fixing them.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson01.fill.004
    lesson_content_key: fr.a2.unit19.lesson01.vocabulaire_probleme
    type: fill_in_blank
    frame: {text: "L'eau {item} sous l'évier. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fuit_single, hint: *fuit_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fuir is irregular: il fuit, ils fuient.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson01.translate.005
    lesson_content_key: fr.a2.unit19.lesson01.vocabulaire_probleme
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *home_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Salle de bain is written as three words.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson01.translate.006
    lesson_content_key: fr.a2.unit19.lesson01.vocabulaire_probleme
    type: translation
    frame: {text: "The heating is out of order.", language_code: en, direction: ltr}
    slots: {item: *panne_single}
    answer_derivation: {kind: render_frame, frame: {text: "Le chauffage est en {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "En panne is the standard way to say a machine is out of order.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson02.choose.001
    lesson_content_key: fr.a2.unit19.lesson02.demande_polie
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *polite_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dès que possible means as soon as possible.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson02.listen.002
    lesson_content_key: fr.a2.unit19.lesson02.demande_polie
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *polite_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Vienne and m'appeliez are subjunctive forms used after il faudrait que.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson02.order.003
    lesson_content_key: fr.a2.unit19.lesson02.demande_polie
    type: word_order
    frame: {text: "Pourriez-vous {item} cette semaine pour réparer le four ?", language_code: fr, direction: ltr}
    slots: {item: *passer_single}
    answer_derivation: {kind: render_frame, frame: {text: "Pourriez-vous {item} cette semaine pour réparer le four ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Passer here means to come by, a visit rather than a pass.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson02.fill.004
    lesson_content_key: fr.a2.unit19.lesson02.demande_polie
    type: fill_in_blank
    frame: {text: "Il faudrait que quelqu'un {item} demain. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *vienne_single, hint: *vienne_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Il faudrait que is followed by the subjunctive of venir: vienne.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson02.match.005
    lesson_content_key: fr.a2.unit19.lesson02.demande_polie
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *polite_match, second: *polite_match, third: *polite_match, fourth: *polite_match, fifth: *polite_match, sixth: *polite_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Vocabulary for politely reporting a problem.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson02.translate.006
    lesson_content_key: fr.a2.unit19.lesson02.demande_polie
    type: translation
    frame: {text: "There is no more hot water.", language_code: en, direction: ltr}
    slots: {item: *ny_single}
    answer_derivation: {kind: render_frame, frame: {text: "Il {item} a plus d'eau chaude.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Il n'y a plus de means there is no more; before a vowel de becomes d'.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson03.choose.001
    lesson_content_key: fr.a2.unit19.lesson03.dialogue_appeler_proprietaire
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *call_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The landlord gives a time window with entre ... et ....", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson03.listen.002
    lesson_content_key: fr.a2.unit19.lesson03.dialogue_appeler_proprietaire
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *call_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Passera is future; devrait is conditional and softens the promise to should.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson03.match.003
    lesson_content_key: fr.a2.unit19.lesson03.dialogue_appeler_proprietaire
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *call_match, second: *call_match, third: *call_match, fourth: *call_match, fifth: *call_match, sixth: *call_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from the phone call with the landlord.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson03.fill.004
    lesson_content_key: fr.a2.unit19.lesson03.dialogue_appeler_proprietaire
    type: fill_in_blank
    frame: {text: "Je serai {item} moi toute la matinée. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *chez_single, hint: *chez_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Chez moi means at my place.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson03.translate.005
    lesson_content_key: fr.a2.unit19.lesson03.dialogue_appeler_proprietaire
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *call_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Matinée stresses the whole length of the morning, matin just the time of day.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit19.lesson03.translate.006
    lesson_content_key: fr.a2.unit19.lesson03.dialogue_appeler_proprietaire
    type: translation
    frame: {text: "A technician will come by tomorrow morning.", language_code: en, direction: ltr}
    slots: {item: *technicien_single}
    answer_derivation: {kind: render_frame, frame: {text: "Un {item} passera demain matin.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Passera is the future of passer.", language_code: en, direction: ltr}
