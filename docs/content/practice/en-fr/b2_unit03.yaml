schema_version: '1.0'
pack_key: practice.en-fr.b2.unit03
source_language: en
target_language: fr
unit_content_key: fr.b2.unit03.nuance
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_b2_u3 / w_<token>). 36 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_absolument, w_alors, w_apparemment, w_assez, w_bon, w_café, w_chaleureuse, w_dirait, w_dommage, w_détail, w_endroit, w_excellent, w_gâteau, w_hier, w_impressionner, w_impressionné, w_lent, w_légèrement, w_mineur, w_nouveau, w_parfait, w_particulièrement, w_peu, w_plaire, w_plu, w_plutôt, w_recommande, w_semble, w_sembler, w_service, w_sucré, w_testé, w_tout, w_trop, w_vraiment, w_était]
templates:
- content_key: practice.en-fr.fr.b2.unit03.lesson01.choose.001
  lesson_content_key: fr.b2.unit03.lesson01.adoucir_une_critique
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_peu, w_plutôt, w_semble, w_vraiment, w_assez, w_gâteau, w_était, w_trop, w_sucré, w_dirait, w_légèrement, w_apparemment, w_sembler, w_service, w_lent, w_absolument, w_tout, w_particulièrement, w_excellent, w_parfait, w_plaire, w_plu, w_impressionner, w_impressionné, w_hier, w_testé, w_nouveau, w_café, w_détail, w_mineur, w_chaleureuse, w_recommande, w_alors, w_dommage, w_bon, w_endroit]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on softening a criticism.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit03.lesson02.listen.001
  lesson_content_key: fr.b2.unit03.lesson02.formuler_avec_prudence
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on formulating cautiously.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit03.lesson03.translate.001
  lesson_content_key: fr.b2.unit03.lesson03.insister_sur_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on emphasizing something.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit03.lesson04.match.001
  lesson_content_key: fr.b2.unit03.lesson04.mettre_en_valeur
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit03.lesson05.choose.001
