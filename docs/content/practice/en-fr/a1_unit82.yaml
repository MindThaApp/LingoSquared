schema_version: '1.0'
pack_key: practice.en-fr.a1.unit82
source_language: en
target_language: fr
unit_content_key: fr.a1.unit82.zoo
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u82 / w_<token>). 10 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_bateau, w_beaux, w_billets, w_girafe, w_lion, w_lions, w_nourrissage, w_savane, w_singe, w_étaient]
templates:
- content_key: practice.en-fr.fr.a1.unit82.lesson02.choose.001
  lesson_content_key: fr.a1.unit82.lesson02.le_lion_et_l
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_lion, w_singe, w_girafe, w_savane, w_nourrissage, w_lions, w_billets, w_bateau, w_étaient, w_beaux]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the lion and the elephant.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit82.lesson03.listen.001
  lesson_content_key: fr.a1.unit82.lesson03.le_singe_et_la
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the monkey and the giraffe.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit82.lesson04.translate.001
