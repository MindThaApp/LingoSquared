review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u54 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_adore, w_aimons, w_ajoute, w_animal, w_animaux, w_aucun, w_brun, w_chat, w_chats, w_chien, w_chiens, w_compagnie, w_deviennent, w_donne, w_donner, w_manger, w_oiseau, w_oiseaux, w_poil, w_poissons, w_promènes, w_seulement, w_tous, w_voyelle]
