  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_animal, w_compagnie, w_chien, w_chat, w_oiseau, w_deviennent, w_voyelle, w_tous, w_promènes, w_donner, w_manger, w_donne, w_ajoute, w_chiens, w_chats, w_animaux, w_adore, w_poissons, w_oiseaux, w_poil, w_brun, w_seulement, w_aucun, w_aimons]
