templates:
  - content_key: practice.en-fr.fr.b1.unit27.lesson01.choose.001
    lesson_content_key: fr.b1.unit27.lesson01.condition_reelle
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *rec1_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These are the words for a possible condition and its result.", language_code: en, direction: ltr}
