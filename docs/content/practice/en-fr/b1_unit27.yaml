    type: word_order
    frame: {text: "Si j'ai le temps, je {item} à la mairie.", language_code: fr, direction: ltr}
    slots: {item: *anc_3}
    answer_derivation: {kind: render_frame, frame: {text: "Si j'ai le temps, je {item} à la mairie.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Si + present, future: a possible condition has the present in the si-clause and the future in the result.", language_code: en, direction: ltr}
