schema_version: "1.0"
pack_key: practice.en-fr.b1.unit32
source_language: en
target_language: fr
unit_content_key: fr.b1.unit32.sequences
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: "Authored 2026-10-25 (session 12, en-fr B1) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (level b1, group en-fr-b1). Grammar-unit layout: recognition and bare-word production pools are curated w_<token> lists from this unit's own first-sight tokens; the structured and sentence-production templates pin one lexeme with a single-member anchor and carry the unit's construction in the frame. Sentence translations list accepted_variants for natural alternatives (word order, dès que/quand, on/nous, est-ce que). Native review: confirm the glosses of conjugated forms (for example j'aurais, aurais, tu/je ambiguity in forms such as préviens, arrive, parle) and the accepted variants."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_au", "w_confirmé", "w_envoies", "w_habituel", "w_l'envoie", "w_l'événement", "w_préparé", "w_prévenu", "w_répondu", "w_réponse", "w_suivant", "w_été"]
slot_presets:
  rec1_1: &rec1_1 {language_code: fr, part_of_speech: [adjective, noun, phrase, verb], agreement_tags: {semantic: ["w_l'envoie", "w_habituel", "w_l'événement", "w_suivant", "w_répondu", "w_préparé", "w_confirmé", "w_envoies", "w_réponse", "w_prévenu"]}}
  anc_2: &anc_2 {language_code: fr, part_of_speech: phrase, agreement_tags: {semantic: "w_l'envoie"}}
  anc_3: &anc_3 {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: "w_habituel"}}
  anc_4: &anc_4 {language_code: fr, part_of_speech: preposition, agreement_tags: {semantic: "w_au"}}
  tr1_5: &tr1_5 {language_code: fr, part_of_speech: [adjective, noun, phrase], agreement_tags: {semantic: ["w_l'envoie", "w_habituel", "w_l'événement", "w_suivant"]}}
  rec2_6: &rec2_6 {language_code: fr, part_of_speech: [noun, verb], agreement_tags: {semantic: ["w_répondu", "w_préparé", "w_confirmé", "w_envoies", "w_réponse", "w_prévenu"]}}
  anc_7: &anc_7 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_répondu"}}
  anc_8: &anc_8 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_été"}}
  anc_9: &anc_9 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_prévenu"}}
  anc_10: &anc_10 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_réponse"}}
  anc_11: &anc_11 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_confirmé"}}
templates:
  - content_key: practice.en-fr.fr.b1.unit32.lesson01.choose.001
    lesson_content_key: fr.b1.unit32.lesson01.quand_futur
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *rec1_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These are the words for describing a routine step by step.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.b1.unit32.lesson01.listen.002
    lesson_content_key: fr.b1.unit32.lesson01.quand_futur
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *rec1_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These are the words for describing a routine step by step.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.b1.unit32.lesson01.match.003
    lesson_content_key: fr.b1.unit32.lesson01.quand_futur
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *rec1_1, second: *rec1_1, third: *rec1_1, fourth: *rec1_1, fifth: *rec1_1, sixth: *rec1_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "These are the words for describing a routine step by step.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.b1.unit32.lesson01.order.004
    lesson_content_key: fr.b1.unit32.lesson01.quand_futur
    type: word_order
    frame: {text: "Quand la liste est prête, je {item} au chef.", language_code: fr, direction: ltr}
    slots: {item: *anc_2}
    answer_derivation: {kind: render_frame, frame: {text: "Quand la liste est prête, je {item} au chef.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Quand + present, present describes a habit: quand la liste est prête, je l'envoie.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.b1.unit32.lesson01.order.005
    lesson_content_key: fr.b1.unit32.lesson01.quand_futur
    type: word_order
    frame: {text: "C'est mon travail {item} chaque matin.", language_code: fr, direction: ltr}
    slots: {item: *anc_3}
    answer_derivation: {kind: render_frame, frame: {text: "C'est mon travail {item} chaque matin.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "L' before the verb stands for the thing you send: je l'envoie.", language_code: en, direction: ltr}
