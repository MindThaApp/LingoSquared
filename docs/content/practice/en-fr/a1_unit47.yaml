schema_version: '1.0'
pack_key: practice.en-fr.a1.unit47
source_language: en
target_language: fr
unit_content_key: fr.a1.unit47.meteo
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u47 / w_<token>). 12 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_chaud, w_ensoleillé, w_faisons, w_film, w_froid, w_journée, w_météo, w_nuageux, w_pleut, w_promenade, w_toute, w_tranquillement]
templates:
