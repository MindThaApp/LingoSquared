    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the weather forecast.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit47.lesson04.match.001
  lesson_content_key: fr.a1.unit47.lesson04.faire_des_projets_selon
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
