  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_ensoleillé, w_pleut, w_nuageux, w_froid, w_chaud, w_météo, w_toute, w_journée, w_promenade, w_faisons, w_tranquillement, w_film]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what''s the weather like?.', language_code: en, direction: ltr}
