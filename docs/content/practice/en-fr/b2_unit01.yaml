  feedback_frame: {text: I work from home because it is quiet. maison means house; home., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson06.order.002
  lesson_content_key: fr.b2.unit01.lesson06.defendre_une_opinion
  type: word_order
  frame: {text: 'Pourquoi tu {item} ça ?', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_penses}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Pourquoi tu {item} ça ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Why do you think that? Pourquoi tu penses ça ? asks a debating partner to support their claim -- the cue to give your reasons and evidence.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson06.fill.003
  lesson_content_key: fr.b2.unit01.lesson06.defendre_une_opinion
  type: fill_in_blank
  frame:
    text: Ça se {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_tient}
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_tient}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'That makes sense. / You have a point. Ça se tient (literally ''that holds together'') concedes that the other person''s argument is reasonable -- a natural, informal way to acknowledge a good point in conversation.', language_code: en, direction: ltr}
