    frame: {text: 'Les {item} pèsent plus lourd.', language_code: fr, direction: ltr}
  feedback_frame: {text: The advantages weigh heavier. avantages means advantages., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson05.order.002
  lesson_content_key: fr.b2.unit01.lesson05.lire_un_texte_argumentatif
  type: word_order
  frame: {text: 'Je travaille à la {item} parce que c''est calme.', language_code: fr, direction: ltr}
