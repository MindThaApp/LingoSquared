      part_of_speech: noun
      agreement_tags: {semantic: w_revanche}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_revanche}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'At the office it is noisy; at home, by contrast, it is quiet. revanche means contrast; return.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson04.translate.004
  lesson_content_key: fr.b2.unit01.lesson04.refuter
  type: translation
  frame: {text: The advantages weigh heavier., language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_avantages}
  answer_derivation:
