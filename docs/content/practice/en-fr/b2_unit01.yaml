  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_soit}
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_soit}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Although it is convenient, I stay flexible. soit means that it be (subjunctive).', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson03.translate.004
  lesson_content_key: fr.b2.unit01.lesson03.lautre_point_de_vue
  type: translation
  frame: {text: 'Mathieu: On the other hand, you miss your colleagues.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_tes}
  answer_derivation:
    kind: render_frame
    frame: {text: 'D''un autre côté, {item} collègues te manquent.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Mathieu: On the other hand, you miss your colleagues. tes means your (informal, plural).', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson04.order.002
  lesson_content_key: fr.b2.unit01.lesson04.refuter
  type: word_order
  frame: {text: 'Il y a du bruit ; {item}, je travaille bien.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags: {semantic: w_pourtant}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Il y a du bruit ; {item}, je travaille bien.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'It is noisy; yet, I work well. pourtant means yet; however.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson04.fill.003
  lesson_content_key: fr.b2.unit01.lesson04.refuter
  type: fill_in_blank
  frame:
