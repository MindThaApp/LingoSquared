schema_version: '1.0'
pack_key: practice.en-fr.b2.unit01
source_language: en
target_language: fr
unit_content_key: fr.b2.unit01.argumentation
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_b2_u1 / w_<token>). 63 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_agréable, w_appeler, w_avantage, w_avantages, w_avoir, w_beaucoup, w_bien, w_bonne, w_bref, w_bureau, w_cependant, w_collègues, w_convaincu, w_deuxièmement, w_disent, w_est, w_exemple, w_faire, w_gens, w_inconvénient, w_inconvénients, w_liberté, w_lourd, w_maison, w_manquent, w_manquer, w_meilleur, w_montre, w_opinion, w_parfois, w_pense, w_pensent, w_penses, w_peser, w_plus, w_pourquoi, w_pourtant, w_premièrement, w_productif, w_puisses, w_pèse, w_pèsent, w_revanche, w_soit, w_sont, w_souvent, w_suis, w_temps, w_tes, w_tient, w_trajet, w_travail, w_travaillent, w_télétravail, w_télétravailleurs, w_visioconférences, w_vrai, w_économise, w_économiser, w_économises, w_étude, w_évidemment, w_évolution]
templates:
- content_key: practice.en-fr.fr.b2.unit01.lesson01.choose.001
  lesson_content_key: fr.b2.unit01.lesson01.prendre_position
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_télétravail, w_travail, w_bureau, w_opinion, w_pense, w_meilleur, w_est, w_suis, w_premièrement, w_deuxièmement, w_plus, w_exemple, w_étude, w_montre, w_temps, w_trajet, w_économiser, w_économise, w_économises, w_beaucoup, w_productif, w_bien, w_soit, w_évidemment, w_vrai, w_pensent, w_tes, w_collègues, w_manquer, w_manquent, w_parfois, w_agréable, w_pourtant, w_revanche, w_cependant, w_bref, w_avantage, w_avantages, w_inconvénient, w_inconvénients, w_peser, w_pèsent, w_pèse, w_lourd, w_liberté, w_avoir, w_maison, w_gens, w_travaillent, w_convaincu, w_bonne, w_évolution, w_télétravailleurs, w_sont, w_souvent, w_disent, w_puisses, w_appeler, w_faire, w_visioconférences, w_pourquoi, w_penses, w_tient]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on taking a position.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson02.listen.001
  lesson_content_key: fr.b2.unit01.lesson02.donner_des_raisons
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on giving reasons.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson03.translate.001
  lesson_content_key: fr.b2.unit01.lesson03.lautre_point_de_vue
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on acknowledging the other side.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson04.match.001
  lesson_content_key: fr.b2.unit01.lesson04.refuter
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson05.choose.001
  lesson_content_key: fr.b2.unit01.lesson05.lire_un_texte_argumentatif
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading an argument.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson06.translate.001
  lesson_content_key: fr.b2.unit01.lesson06.defendre_une_opinion
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on defending a position.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson01.order.002
  lesson_content_key: fr.b2.unit01.lesson01.prendre_position
  type: word_order
  frame: {text: 'Le {item} devient courant.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_télétravail}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le {item} devient courant.', language_code: fr, direction: ltr}
  feedback_frame: {text: Remote work is becoming common. télétravail means remote work., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson01.fill.003
  lesson_content_key: fr.b2.unit01.lesson01.prendre_position
  type: fill_in_blank
  frame:
    text: Au {item}, c'est bruyant ; à la maison, en revanche, c'est calme. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_bureau}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_bureau}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'At the office it is noisy; at home, by contrast, it is quiet. bureau means office; desk.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson01.translate.004
  lesson_content_key: fr.b2.unit01.lesson01.prendre_position
  type: translation
  frame: {text: I have an opinion on this subject., language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_opinion}
  answer_derivation:
    kind: render_frame
    frame: {text: 'J''ai une {item} sur ce sujet.', language_code: fr, direction: ltr}
  feedback_frame: {text: I have an opinion on this subject. opinion means opinion., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson02.order.002
  lesson_content_key: fr.b2.unit01.lesson02.donner_des_raisons
  type: word_order
  frame: {text: 'De {item}, on économise de l''argent.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags: {semantic: w_plus}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De {item}, on économise de l''argent.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'In addition, one saves money. plus means more.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson02.fill.003
  lesson_content_key: fr.b2.unit01.lesson02.donner_des_raisons
  type: fill_in_blank
  frame:
    text: Le télétravail a des avantages, par {item} moins de stress. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_exemple}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_exemple}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Remote work has advantages, for example less stress. exemple means example.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson02.translate.004
  lesson_content_key: fr.b2.unit01.lesson02.donner_des_raisons
  type: translation
  frame: {text: The commute time is long in the morning., language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_temps}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le {item} de trajet est long le matin.', language_code: fr, direction: ltr}
  feedback_frame: {text: The commute time is long in the morning. temps means time (to do something)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit01.lesson03.order.002
  lesson_content_key: fr.b2.unit01.lesson03.lautre_point_de_vue
  type: word_order
  frame: {text: 'Il y a du bruit ; pourtant, je travaille {item}.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags: {semantic: w_bien}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Il y a du bruit ; pourtant, je travaille {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'It is noisy; yet, I work well. bien means well; fine.', language_code: en, direction: ltr}
