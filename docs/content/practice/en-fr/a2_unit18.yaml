    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Body, time and feeling words from the symptoms lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson01.fill.004
    lesson_content_key: fr.a2.unit18.lesson01.symptomes_duree
    type: fill_in_blank
    frame: {text: "J'ai mal à la {item} depuis trois jours. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *gorge_single, hint: *gorge_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After j'ai mal à la, a feminine noun names the part of the body that hurts.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson01.translate.005
    lesson_content_key: fr.a2.unit18.lesson01.symptomes_duree
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *sym_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Enrouée is feminine because la voix is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson01.translate.006
    lesson_content_key: fr.a2.unit18.lesson01.symptomes_duree
    type: translation
    frame: {text: "I am exhausted. (A woman is speaking.)", language_code: en, direction: ltr}
    slots: {item: *epuisee_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je suis {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Épuisé is masculine and épuisée feminine; both sound the same.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson02.choose.001
    lesson_content_key: fr.a2.unit18.lesson02.conseils_medicaux
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *advice_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Une fois means one time; trois fois par jour means three times a day.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson02.listen.002
    lesson_content_key: fr.a2.unit18.lesson02.conseils_medicaux
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *advice_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Preniez, reposiez and reveniez are subjunctive forms after il faut que and je veux que.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson02.order.003
    lesson_content_key: fr.a2.unit18.lesson02.conseils_medicaux
    type: word_order
    frame: {text: "Il faut que vous {item} ce sirop trois fois par jour.", language_code: fr, direction: ltr}
    slots: {item: *preniez_single}
    answer_derivation: {kind: render_frame, frame: {text: "Il faut que vous {item} ce sirop trois fois par jour.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Il faut que is followed by the subjunctive: que vous preniez.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson02.fill.004
    lesson_content_key: fr.a2.unit18.lesson02.conseils_medicaux
    type: fill_in_blank
    frame: {text: "Je vous {item} de boire beaucoup d'eau chaude. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *conseille_single, hint: *conseille_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Je vous conseille de takes an infinitive, with no subjunctive.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson02.match.005
    lesson_content_key: fr.a2.unit18.lesson02.conseils_medicaux
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *advice_match, second: *advice_match, third: *advice_match, fourth: *advice_match, fifth: *advice_match, sixth: *advice_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Vocabulary of medical advice: what to take, drink and do.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson02.translate.006
    lesson_content_key: fr.a2.unit18.lesson02.conseils_medicaux
    type: translation
    frame: {text: "I want you to come back if the pain gets worse.", language_code: en, direction: ltr}
    slots: {item: *veux_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je {item} que vous reveniez si la douleur empire.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Je veux que takes the subjunctive, so the verb is reveniez, not revenez.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson03.choose.001
    lesson_content_key: fr.a2.unit18.lesson03.consultation
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *consult_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the appointment confirmation and the examination.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson03.listen.002
    lesson_content_key: fr.a2.unit18.lesson03.consultation
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *consult_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Un cabinet médical is a doctor's practice; the word also means a small office.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson03.match.003
    lesson_content_key: fr.a2.unit18.lesson03.consultation
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *consult_match, second: *consult_match, third: *consult_match, fourth: *consult_match, fifth: *consult_match, sixth: *consult_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from the consultation: symptoms, the throat and the appointment.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson03.fill.004
    lesson_content_key: fr.a2.unit18.lesson03.consultation
    type: fill_in_blank
    frame: {text: "Vous avez d'autres {item} ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *symptomes_single, hint: *symptomes_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Symptômes is plural after d'autres.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson03.translate.005
    lesson_content_key: fr.a2.unit18.lesson03.consultation
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *consult_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Symptômes and angine carry accents that are easy to drop.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson03.translate.006
    lesson_content_key: fr.a2.unit18.lesson03.consultation
    type: translation
    frame: {text: "Open your mouth. (Formal.)", language_code: en, direction: ltr}
    slots: {item: *ouvrez_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} la bouche.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "The doctor says ouvrez la bouche; French uses the article la, not votre, for body parts.", language_code: en, direction: ltr}
