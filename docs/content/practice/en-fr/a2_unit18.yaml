templates:
  - content_key: practice.en-fr.fr.a2.unit18.lesson01.choose.001
    lesson_content_key: fr.a2.unit18.lesson01.symptomes_duree
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *sym_nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ça fait ... que and depuis que are the two ways this unit says how long a symptom has lasted.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson01.listen.002
    lesson_content_key: fr.a2.unit18.lesson01.symptomes_duree
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *sym_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Empirer is the infinitive; empire is the form after il or elle.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit18.lesson01.match.003
    lesson_content_key: fr.a2.unit18.lesson01.symptomes_duree
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
