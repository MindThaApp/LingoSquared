schema_version: '1.0'
pack_key: practice.en-fr.a1.unit60
source_language: en
target_language: fr
unit_content_key: fr.a1.unit60.menage
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u60 / w_<token>). 12 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aide, w_désordre, w_fini, w_lessive, w_ménage, w_passer, w_range, w_rangeons, w_ranger, w_ranges, w_vaisselle, w_volontiers]
templates:
- content_key: practice.en-fr.fr.a1.unit60.lesson01.choose.001
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_ranger, w_range, w_ranges, w_rangeons, w_désordre, w_passer, w_vaisselle, w_ménage, w_aide, w_lessive, w_fini, w_volontiers]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on tidying up.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson02.listen.001
  lesson_content_key: fr.a1.unit60.lesson02.le_desordre_et_l
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on mess and vacuuming.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson03.translate.001
  lesson_content_key: fr.a1.unit60.lesson03.tu_peux_aider
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on can you help?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson04.match.001
  lesson_content_key: fr.a1.unit60.lesson04.camille_aide_mathieu_dimanche
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson05.choose.001
  lesson_content_key: fr.a1.unit60.lesson05.qui_fait_quoi_a
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who''s doing what around the house?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson06.translate.001
  lesson_content_key: fr.a1.unit60.lesson06.l_appartement_est_fini
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the apartment is done.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson01.order.002
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: word_order
  frame: {text: 'Je {item} l''appartement.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_range}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je {item} l''appartement.', language_code: fr, direction: ltr}
  feedback_frame: {text: I'm tidying up the apartment. range means tidies up., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson01.fill.003
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: fill_in_blank
  frame:
    text: Nous {item} le désordre et Camille passe l'aspirateur dans le salon. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_rangeons}
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_rangeons}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: We're tidying up the mess and Camille is vacuuming the living room. rangeons means we tidy up., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson02.order.002
  lesson_content_key: fr.a1.unit60.lesson02.le_desordre_et_l
  type: word_order
  frame: {text: 'Il y a beaucoup de {item} après la fête.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_désordre}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Il y a beaucoup de {item} après la fête.', language_code: fr, direction: ltr}
  feedback_frame: {text: There's a lot of mess after the party. désordre means mess., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit60.lesson03.order.002
  lesson_content_key: fr.a1.unit60.lesson03.tu_peux_aider
  type: word_order
  frame: {text: 'Tu peux m''aider à faire la {item} ?', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_vaisselle}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tu peux m''aider à faire la {item} ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Can you help me with the dishes? vaisselle means dishes.', language_code: en, direction: ltr}
