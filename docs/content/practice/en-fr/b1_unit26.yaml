    type: word_order
    frame: {text: "Il faut que je {item} la pâtisserie.", language_code: fr, direction: ltr}
    slots: {item: *anc_3}
    answer_derivation: {kind: render_frame, frame: {text: "Il faut que je {item} la pâtisserie.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Il faut que + subject + subjunctive expresses an obligation: il faut que je prévienne.", language_code: en, direction: ltr}
