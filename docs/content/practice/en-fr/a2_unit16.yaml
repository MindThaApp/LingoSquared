templates:
  - content_key: practice.en-fr.fr.a2.unit16.lesson01.choose.001
    lesson_content_key: fr.a2.unit16.lesson01.vocabulaire_opinions
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *job_nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "A boulanger makes bread; a pâtissier makes cakes and pastries.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson01.listen.002
    lesson_content_key: fr.a2.unit16.lesson01.vocabulaire_opinions
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *opinion_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Utile, stable and difficile have no separate feminine form; intéressante and créatif change with the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson01.order.003
    lesson_content_key: fr.a2.unit16.lesson01.vocabulaire_opinions
    type: word_order
    frame: {text: "Je trouve que la pâtisserie est {item}.", language_code: fr, direction: ltr}
    slots: {item: *pat_adj}
    answer_derivation: {kind: render_frame, frame: {text: "Je trouve que la pâtisserie est {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "After je trouve que, the adjective agrees with the noun: la pâtisserie is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson01.fill.004
    lesson_content_key: fr.a2.unit16.lesson01.vocabulaire_opinions
    type: fill_in_blank
    frame: {text: "Les pâtissiers sont très {item} pour les mariages. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *demandes_single, hint: *demandes_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Demandés is masculine plural to agree with les pâtissiers.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson01.translate.005
    lesson_content_key: fr.a2.unit16.lesson01.vocabulaire_opinions
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *job_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pâtisserie takes a circumflex on the â; boulangerie does not.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson01.translate.006
    lesson_content_key: fr.a2.unit16.lesson01.vocabulaire_opinions
    type: translation
    frame: {text: "I do not agree.", language_code: en, direction: ltr}
    slots: {item: *daccord_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je ne suis pas {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Être d'accord means to agree; the negation wraps ne ... pas around suis.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson02.choose.001
    lesson_content_key: fr.a2.unit16.lesson02.registre_du_desaccord
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *grammar_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The unit contrasts the indicative with the subjunctive; même si never takes the subjunctive.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson02.listen.002
    lesson_content_key: fr.a2.unit16.lesson02.registre_du_desaccord
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *subj_verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Choisisses and sois are subjunctive forms: they follow il vaudrait mieux que and il est possible que.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson02.match.003
    lesson_content_key: fr.a2.unit16.lesson02.registre_du_desaccord
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *grammar_match, second: *grammar_match, third: *grammar_match, fourth: *grammar_match, fifth: *grammar_match, sixth: *grammar_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "A mix of grammar terms and the vocabulary of giving an opinion.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson02.fill.004
    lesson_content_key: fr.a2.unit16.lesson02.registre_du_desaccord
    type: fill_in_blank
    frame: {text: "Ça {item} de ce que tu préfères. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *depend_single, hint: *depend_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ça dépend de means it depends on.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson02.translate.005
    lesson_content_key: fr.a2.unit16.lesson02.registre_du_desaccord
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *grammar_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Côté has a circumflex and créative an acute accent; both are easy to drop.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson02.translate.006
    lesson_content_key: fr.a2.unit16.lesson02.registre_du_desaccord
    type: translation
    frame: {text: "To each their own opinion, right?", language_code: en, direction: ltr}
    slots: {item: *chacun_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} son avis, non ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Chacun son avis is a short, familiar way to say everyone is entitled to an opinion.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson03.choose.001
    lesson_content_key: fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *choice_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the dialogue about choosing between pastry and bread.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson03.listen.002
    lesson_content_key: fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *choice_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Listen for the final -té in spécialité and stabilité: it marks feminine nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson03.order.003
    lesson_content_key: fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie
    type: word_order
    frame: {text: "Pas {item}. À mon avis, la pâtisserie est plus intéressante.", language_code: fr, direction: ltr}
    slots: {item: *encore_single}
    answer_derivation: {kind: render_frame, frame: {text: "Pas {item}. À mon avis, la pâtisserie est plus intéressante.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Pas encore means not yet.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson03.fill.004
    lesson_content_key: fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie
    type: fill_in_blank
    frame: {text: "Pour la {item}, il vaudrait mieux choisir le pain. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *stabilite_single, hint: *stabilite_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nouns ending in -té, such as stabilité, are feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson03.translate.005
    lesson_content_key: fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *choice_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "L'année keeps the apostrophe because le contracts before a vowel.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit16.lesson03.translate.006
    lesson_content_key: fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie
    type: translation
    frame: {text: "I understand.", language_code: en, direction: ltr}
    slots: {item: *comprends_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Je comprends is the plain way to say I understand.", language_code: en, direction: ltr}
