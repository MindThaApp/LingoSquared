schema_version: '1.0'
pack_key: practice.en-fr.a1.unit44
source_language: en
target_language: fr
unit_content_key: fr.a1.unit44.sante
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u44 / w_<token>). 23 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aider, w_bois, w_comprimé, w_conseil, w_disent, w_fièvre, w_fois, w_gorge, w_jours, w_maintenant, w_malade, w_médecin, w_prenez, w_pris, w_quelque, w_reposer, w_rhume, w_rétablissement, w_sens, w_toujours, w_tête, w_ventre, w_vouvoie]
templates:
- content_key: practice.en-fr.fr.a1.unit44.lesson01.choose.001
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_sens, w_malade, w_tête, w_ventre, w_gorge, w_fièvre, w_rhume, w_disent, w_aider, w_quelque, w_comprimé, w_prenez, w_fois, w_vouvoie, w_conseil, w_bois, w_toujours, w_jours, w_médecin, w_pris, w_reposer, w_maintenant, w_rétablissement]
  answer_derivation: {kind: slot_gloss, slot: item}
