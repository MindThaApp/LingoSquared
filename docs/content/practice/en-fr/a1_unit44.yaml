    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fever and a cold.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit44.lesson04.match.001
