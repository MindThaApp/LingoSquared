  sol_tr: &sol_tr {language_code: fr, part_of_speech: [adjective, noun, verb, adverb], agreement_tags: {semantic: ["w_autre", "w_option", "w_prévenir", "w_tard", "w_rater", "w_arriver", "w_prévu", "w_annoncé", "w_puis", "w_dix-neuf", "w_soirée", "w_j'arriverai"]}}
  soiree_single: &soiree_single {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_soirée"}}
templates:
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.choose.001
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *rail_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "A station announcement uses annulé for cancelled and retardé for delayed.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.listen.002
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *rail_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Partira is future: the train will leave.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.match.003
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *rail_match, second: *rail_match, third: *rail_match, fourth: *rail_match, fifth: *rail_match, sixth: *rail_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from the station announcement.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.order.004
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: word_order
    frame: {text: "Le train partira de la {item} six.", language_code: fr, direction: ltr}
    slots: {item: *voie_single}
    answer_derivation: {kind: render_frame, frame: {text: "Le train partira de la {item} six.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Voie is the platform or track a train leaves from.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.fill.005
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: fill_in_blank
    frame: {text: "Le train est annulé à cause d'un problème {item}. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *technique_single, hint: *technique_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Technique ends in -que and does not change for masculine or feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.translate.006
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *rail_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Retard and retardé share a root but are a noun and an adjective.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson01.translate.007
    lesson_content_key: fr.a2.unit21.lesson01.comprendre_perturbation
    type: translation
    frame: {text: "The train is delayed by forty minutes.", language_code: en, direction: ltr}
    slots: {item: *quarante_single}
    answer_derivation: {kind: render_frame, frame: {text: "Le train est retardé de {item} minutes.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Retardé de quarante minutes gives the length of the delay.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.choose.001
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *sol_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Rater une correspondance means to miss a connection.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.listen.002
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *sol_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "J'arriverai is the future of arriver; arriver is the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.match.003
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *sol_match, second: *sol_match, third: *sol_match, fourth: *sol_match, fifth: *sol_match, sixth: *sol_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words for explaining a disrupted journey and asking for another option.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.order.004
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: word_order
    frame: {text: "Je vais {item} ma correspondance.", language_code: fr, direction: ltr}
    slots: {item: *rater_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je vais {item} ma correspondance.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Je vais plus an infinitive expresses what is about to happen.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.fill.005
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: fill_in_blank
    frame: {text: "Je dois {item} quelqu'un. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *prevenir_single, hint: *prevenir_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Prévenir quelqu'un means to let someone know.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.translate.006
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *sol_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Prévu means planned or expected, as in l'heure prévue.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit21.lesson02.translate.007
    lesson_content_key: fr.a2.unit21.lesson02.demander_solution
    type: translation
    frame: {text: "Have a good evening, madam.", language_code: en, direction: ltr}
    slots: {item: *soiree_single}
    answer_derivation: {kind: render_frame, frame: {text: "Bonne {item}, madame.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Bonne soirée is said when parting in the evening.", language_code: en, direction: ltr}
