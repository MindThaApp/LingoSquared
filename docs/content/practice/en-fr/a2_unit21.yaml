  rail_audio: &rail_audio {language_code: fr, part_of_speech: [noun, adjective, verb], agreement_tags: {semantic: ["w_retard", "w_annulé", "w_voie", "w_partira", "w_correspondance", "w_billet", "w_voyageurs", "w_peuvent"]}}
  rail_match: &rail_match {language_code: fr, part_of_speech: [noun, adjective], agreement_tags: {semantic: ["w_retard", "w_train", "w_annulé", "w_technique", "w_voie", "w_numéro", "w_correspondance", "w_billet", "w_valable", "w_voyageurs", "w_retardé", "w_quarante"]}}
  voie_single: &voie_single {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_voie"}}
  technique_single: &technique_single {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: "w_technique"}}
  rail_tr: &rail_tr {language_code: fr, part_of_speech: [noun, adjective, verb], agreement_tags: {semantic: ["w_retard", "w_train", "w_annulé", "w_technique", "w_voie", "w_numéro", "w_correspondance", "w_billet", "w_valable", "w_voyageurs", "w_retardé", "w_quarante", "w_partira"]}}
  quarante_single: &quarante_single {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_quarante"}}
  sol_words: &sol_words {language_code: fr, part_of_speech: [adjective, noun, verb, adverb], agreement_tags: {semantic: ["w_autre", "w_option", "w_prévenir", "w_tard", "w_rater", "w_arriver", "w_prévu", "w_annoncé", "w_puis", "w_dix-neuf", "w_soirée"]}}
  sol_audio: &sol_audio {language_code: fr, part_of_speech: [verb, adjective, noun, phrase], agreement_tags: {semantic: ["w_prévenir", "w_j'arriverai", "w_rater", "w_raté", "w_arriver", "w_annoncé", "w_soirée", "w_excusez-moi"]}}
  sol_match: &sol_match {language_code: fr, part_of_speech: [adjective, noun, verb, adverb], agreement_tags: {semantic: ["w_autre", "w_option", "w_prévenir", "w_tard", "w_rater", "w_arriver", "w_prévu", "w_annoncé", "w_puis", "w_dix-neuf", "w_soirée", "w_j'arriverai"]}}
