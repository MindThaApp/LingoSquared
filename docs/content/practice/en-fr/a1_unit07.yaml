schema_version: "1.0"
pack_key: practice.en-fr.a1.unit07
source_language: en
target_language: fr
unit_content_key: fr.a1.unit07.places
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-fr job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (per-unit tags fr_a1_u07*, single-member w_<token> anchors, curated w_ lists). Frames follow this unit's straight apostrophes. Place nouns that take La (gare, pharmacie, banque, poste) share the order frame; l'ecole is kept out of La frames because it needs l'. Glosses for face, cote and prie were corrected in the backfill script (opposite; side / next to; you are welcome sense). Reviewer: confirm the Excusez-moi / s'il vous plait frames use vous with a stranger as taught. Opus pass 2026-10-24: replaced a content-free matching feedback line.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [fr_a1_u07_l01, w_banque, w_côté, "w_d'ici", w_excusez-moi, w_face, w_gare, w_loin, w_minutes, w_où, w_pharmacie, w_pied, w_poste, w_prie]
slot_presets:
  n_l01: &n_l01 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: fr_a1_u07_l01}}
  la: &la {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_gare, w_pharmacie, w_banque, w_poste]}}
  a_banque_noun: &a_banque_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_banque}}
  a_gare_noun: &a_gare_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_gare}}
  c2: &c2 {language_code: fr, part_of_speech: [adverb, preposition, particle], agreement_tags: {semantic: [w_où, w_face, w_côté, w_loin, "w_d'ici"]}}
  a_cote_prep: &a_cote_prep {language_code: fr, part_of_speech: preposition, agreement_tags: {semantic: w_côté}}
  a_face_prep: &a_face_prep {language_code: fr, part_of_speech: preposition, agreement_tags: {semantic: w_face}}
  a_loin_adve: &a_loin_adve {language_code: fr, part_of_speech: adverb, agreement_tags: {semantic: w_loin}}
  c3: &c3 {language_code: fr, part_of_speech: [phrase, noun, verb, adverb], agreement_tags: {semantic: [w_excusez-moi, w_minutes, w_pied, w_prie, w_loin]}}
  lis3: &lis3 {language_code: fr, part_of_speech: [phrase, noun, adverb], agreement_tags: {semantic: [w_excusez-moi, w_minutes, w_pied, w_loin]}}
  m3: &m3 {language_code: fr, part_of_speech: [noun, adverb, phrase, preposition], agreement_tags: {semantic: [w_gare, w_pharmacie, w_banque, w_poste, w_loin, w_excusez-moi]}}
  a_minutes_noun: &a_minutes_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_minutes}}
  a_pied_noun: &a_pied_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_pied}}
templates:
  - content_key: practice.en-fr.fr.a1.unit07.lesson01.choose.001
    lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *n_l01}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "La gare, la pharmacie, la banque and la poste are all feminine, so they take la; l'école uses l' before the vowel.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson01.listen.002
    lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *n_l01}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "La poste is the post office; like gare, pharmacie and banque it is a feminine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson01.order.003
    lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
    type: word_order
    frame: {text: "La {item} est grande.", language_code: fr, direction: ltr}
    slots: {item: *la}
    answer_derivation: {kind: render_frame, frame: {text: "La {item} est grande.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "These nouns are feminine, so the article is la and the adjective grande has the feminine -e.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson01.fill.004
    lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
    type: fill_in_blank
    frame: {text: "La {item} est fermée le dimanche. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_banque_noun, hint: *a_banque_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fermée ends in -e because banque is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson01.translate.005
    lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
    type: translation
    frame: {text: "The train station is big.", language_code: en, direction: ltr}
    slots: {item: *a_gare_noun}
    answer_derivation: {kind: render_frame, frame: {text: "La {item} est grande.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "La gare est grande: gare is feminine, so both la and grande agree.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson02.choose.001
    lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Où asks where; en face de and à côté de are place phrases that need de before the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson02.listen.002
    lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Loin d'ici means far from here; près d'ici is the opposite.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson02.order.003
    lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
    type: word_order
    frame: {text: "La pharmacie est à {item} de la banque.", language_code: fr, direction: ltr}
    slots: {item: *a_cote_prep}
    answer_derivation: {kind: render_frame, frame: {text: "La pharmacie est à {item} de la banque.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "À côté de means next to; de links it to the noun that follows.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson02.fill.004
    lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
    type: fill_in_blank
    frame: {text: "La banque est en {item} de la gare. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_face_prep, hint: *a_face_prep}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "En face de means opposite and takes de before the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson02.translate.005
    lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
    type: translation
    frame: {text: "The post office is far from here.", language_code: en, direction: ltr}
    slots: {item: *a_loin_adve}
    answer_derivation: {kind: render_frame, frame: {text: "La poste est {item} d'ici.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Loin d'ici means far from here.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson03.choose.001
    lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Excusez-moi is the polite way to get a stranger's attention before asking a question.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson03.listen.002
    lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Excusez-moi is a vous form of the verb excuser, so it is used with strangers.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson03.match.003
    lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *m3, second: *m3, third: *m3, fourth: *m3, fifth: *m3, sixth: *m3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "La gare, la pharmacie, la banque and la poste are feminine; excusez-moi opens any question to a stranger.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson03.fill.004
    lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
    type: fill_in_blank
    frame: {text: "Cinq {item} à pied. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_minutes_noun, hint: *a_minutes_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cinq minutes à pied means five minutes on foot; minutes is plural after cinq.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit07.lesson03.translate.005
    lesson_content_key: fr.a1.unit07.lesson03.dialogue_chercher_pharmacie
    type: translation
    frame: {text: "Five minutes on foot.", language_code: en, direction: ltr}
    slots: {item: *a_pied_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Cinq minutes à {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "À pied means on foot, so five minutes on foot is a five-minute walk.", language_code: en, direction: ltr}
