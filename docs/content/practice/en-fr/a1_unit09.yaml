schema_version: "1.0"
pack_key: practice.en-fr.a1.unit09
source_language: en
target_language: fr
unit_content_key: fr.a1.unit09.directions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-fr job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (per-unit tags fr_a1_u09*, single-member w_<token> anchors, curated w_ lists). Frames follow this unit's straight apostrophes. Lesson 02 uses the vous imperative (Tournez, Continuez) and lesson 03 the tu present (tu tournes, tu traverses), as in the unit; English prompts say which. Droite (right) and juste (just; right) are never in the same pool. Reviewer: confirm tout droit / jusqu'au frames.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aller, w_boutique, w_carrefour, w_coin, w_connais, w_continues, w_continuez, w_droit, w_droite, w_ensuite, w_exactement, w_gauche, "w_jusqu'au", w_juste, w_tournes, w_tournez, w_traverser, w_traverses, w_ustensiles, w_y]
slot_presets:
  c1: &c1 {language_code: fr, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_gauche, w_droite, w_coin, w_boutique, w_carrefour, w_traverser]}}
  lis1: &lis1 {language_code: fr, part_of_speech: [noun], agreement_tags: {semantic: [w_gauche, w_droite, w_coin, w_boutique, w_carrefour]}}
  m1: &m1 {language_code: fr, part_of_speech: [noun, adjective, verb], agreement_tags: {semantic: [w_gauche, w_droite, w_droit, w_coin, w_boutique, w_carrefour, w_traverser]}}
  gd: &gd {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_gauche, w_droite]}}
  a_carrefour_noun: &a_carrefour_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_carrefour}}
  a_coin_noun: &a_coin_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_coin}}
  c2: &c2 {language_code: fr, part_of_speech: [verb, preposition], agreement_tags: {semantic: [w_aller, w_tournez, w_continuez, "w_jusqu'au"]}}
  a_jusqu_au_prep: &a_jusqu_au_prep {language_code: fr, part_of_speech: preposition, agreement_tags: {semantic: "w_jusqu'au"}}
  a_aller_verb: &a_aller_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_aller}}
  tb2: &tb2 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: [w_aller, w_tournez, w_continuez]}}
  c3: &c3 {language_code: fr, part_of_speech: [verb, noun, pronoun, adverb], agreement_tags: {semantic: [w_connais, w_ustensiles, w_y, w_ensuite, w_exactement, w_juste]}}
  lis3: &lis3 {language_code: fr, part_of_speech: [verb, noun, adverb], agreement_tags: {semantic: [w_connais, w_ustensiles, w_ensuite, w_exactement, w_tournes, w_traverses]}}
  m3: &m3 {language_code: fr, part_of_speech: [verb, noun, adverb], agreement_tags: {semantic: [w_connais, w_ustensiles, w_ensuite, w_exactement, w_tournes, w_continues, w_traverses]}}
  a_traverses_verb: &a_traverses_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_traverses}}
  a_exactement_adve: &a_exactement_adve {language_code: fr, part_of_speech: adverb, agreement_tags: {semantic: w_exactement}}
  a_connais_verb: &a_connais_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_connais}}
  a_tournes_verb: &a_tournes_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_tournes}}
templates:
  - content_key: practice.en-fr.fr.a1.unit09.lesson01.choose.001
    lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "À gauche and à droite mean on or to the left and right; the nouns gauche and droite are feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson01.listen.002
    lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Au carrefour combines à and le into au: at the intersection.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson01.match.003
    lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *m1, second: *m1, third: *m1, fourth: *m1, fifth: *m1, sixth: *m1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Droit means straight in tout droit, and gauche and droite are the left and right.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson01.order.004
    lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
    type: word_order
    frame: {text: "Tournez à {item} après la boulangerie.", language_code: fr, direction: ltr}
    slots: {item: *gd}
    answer_derivation: {kind: render_frame, frame: {text: "Tournez à {item} après la boulangerie.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "À gauche and à droite use à, not en, for turning left or right.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson01.fill.005
    lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
    type: fill_in_blank
    frame: {text: "Tournez à gauche au {item}. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_carrefour_noun, hint: *a_carrefour_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Au is the contraction of à and le, so au carrefour means at the intersection.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson01.translate.006
    lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
    type: translation
    frame: {text: "The shop is on the corner of the street, on the right.", language_code: en, direction: ltr}
    slots: {item: *a_coin_noun}
    answer_derivation: {kind: render_frame, frame: {text: "La boutique est au {item} de la rue, à droite.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Au coin de la rue means at the corner of the street.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson02.choose.001
    lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Tournez and continuez are vous commands, used with strangers or several people.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson02.listen.002
    lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Jusqu'au means as far as the (masculine), as in jusqu'au carrefour.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson02.order.003
    lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
    type: word_order
    frame: {text: "Continuez tout droit {item} carrefour.", language_code: fr, direction: ltr}
    slots: {item: *a_jusqu_au_prep}
    answer_derivation: {kind: render_frame, frame: {text: "Continuez tout droit {item} carrefour.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Jusqu'au is jusqu'à plus le, used before a masculine place.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson02.fill.004
    lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
    type: fill_in_blank
    frame: {text: "Excusez-moi, pour {item} à la boutique, s'il vous plaît ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_aller_verb, hint: *a_aller_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pour aller à is the standard way to ask how to get to a place; s'il vous plaît is polite.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson02.translate.005
    lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *tb2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Tournez and continuez are vous commands, used with strangers or several people.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.choose.001
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Exactement asks for precision: elle est où exactement means where exactly is it.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.listen.002
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ensuite means then or next, linking steps in a set of directions.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.match.003
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *m3, second: *m3, third: *m3, fourth: *m3, fifth: *m3, sixth: *m3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The tu forms tournes, continues and traverses end in -es, one for each step of the route.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.order.004
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: word_order
    frame: {text: "Ensuite, tu continues tout droit et tu {item} la rue.", language_code: fr, direction: ltr}
    slots: {item: *a_traverses_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Ensuite, tu continues tout droit et tu {item} la rue.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Tu traverses uses the -es ending that goes with tu.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.fill.005
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: fill_in_blank
    frame: {text: "Elle est où {item} ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_exactement_adve, hint: *a_exactement_adve}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Exactement adds precision to a where question.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.fill.006
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: fill_in_blank
    frame: {text: "Tu {item} une boutique pour acheter des ustensiles de cuisine ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_connais_verb, hint: *a_connais_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Connais is the tu form of connaître, used for knowing a place or a person.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit09.lesson03.translate.007
    lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
    type: translation
    frame: {text: "You turn left at the intersection. (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *a_tournes_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Tu {item} à gauche au carrefour.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Tu tournes uses the -es ending that goes with tu.", language_code: en, direction: ltr}
