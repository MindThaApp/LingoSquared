schema_version: "1.0"
pack_key: practice.en-fr.a1.unit03
source_language: en
target_language: fr
unit_content_key: fr.a1.unit03.family
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-fr job A) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (per-unit tags fr_a1_u03*, single-member w_<token> anchors). Possessive frames are split by gender/number so every pool member agrees: Ma {feminine singular noun} (no vowel-initial nouns, so ma never needs to become mon), Mon {masculine singular noun}, mes {plural noun}. Listen pools exclude homophone pairs (frère/frères, sœur/sœurs, cousin/cousins). Reviewer: check that Mon fils habite à Paris and Ma fille est petite read naturally.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [fr_a1_u03_l01, fr_a1_u03_l03, w_a, w_adorable, w_avec, w_beaucoup, w_chaque, w_comprends, w_cousin, w_cousine, w_cousins, w_elle, w_famille, w_fille, w_fils, w_frère, w_frères, w_grand-mère, w_grand-père, w_grands-parents, w_habite, w_habitent, w_habites, w_ici, w_ma, w_mais, w_maison, w_mes, w_mon, w_mère, w_oncle, w_parents, w_parle, w_petite, w_plus, w_près, w_père, w_regarde, w_semaine, w_sont, w_sœur, w_sœurs, w_s’appelle, w_ta, w_tante, w_tes]
slot_presets:
  fam1: &fam1 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: fr_a1_u03_l01}}
  fam3: &fam3 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: fr_a1_u03_l03}}
  famlisten: &famlisten {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_mère, w_père, w_frère, w_sœur, w_fils, w_fille, "w_grand-père", "w_grand-mère", w_oncle, w_tante, w_cousin, w_cousine]}}
  poss: &poss {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: [w_ma, w_mon, w_mes, w_ta, w_tes]}}
  wordsl: &wordsl {language_code: fr, part_of_speech: [adverb, noun, preposition, adjective, particle], agreement_tags: {semantic: [w_maison, w_beaucoup, w_près, w_avec, w_mais, w_plus, w_ici, w_chaque, w_semaine, w_adorable]}}
  wordsl_l: &wordsl_l {language_code: fr, part_of_speech: [adverb, noun, preposition, adjective, particle], agreement_tags: {semantic: [w_maison, w_beaucoup, w_près, w_avec, w_mais, w_ici, w_chaque, w_semaine]}}
  verbs: &verbs {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: [w_habites, w_habitent, w_habite, w_regarde, w_sont, w_parle, w_comprends, w_a]}}
  matchfam: &matchfam {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [fr_a1_u03_l01, fr_a1_u03_l03]}}
  matchw: &matchw {language_code: fr, part_of_speech: [adverb, noun, preposition, adjective, particle], agreement_tags: {semantic: [w_maison, w_beaucoup, w_près, w_avec, w_mais, w_plus, w_ici, w_chaque, w_semaine, w_adorable]}}
  fem: &fem {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_mère, w_sœur, w_famille, "w_grand-mère", w_tante, w_cousine, w_fille]}}
  masc: &masc {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_père, w_frère, "w_grand-père", w_oncle, w_cousin, w_fils]}}
  plur: &plur {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [w_parents, "w_grands-parents", w_frères, w_sœurs, w_cousins]}}
  ma: &ma {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_ma}}
  pres: &pres {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_petite}}
  prochedev: &prochedev {language_code: fr, part_of_speech: preposition, agreement_tags: {semantic: w_près}}
  sapp: &sapp {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_s’appelle"}}
  bare1: &bare1 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: [fr_a1_u03_l01, fr_a1_u03_l03]}}
  bare2: &bare2 {language_code: fr, part_of_speech: [adverb, noun, preposition, adjective, particle, verb], agreement_tags: {semantic: [w_maison, w_beaucoup, w_près, w_avec, w_mais, w_plus, w_ici, w_chaque, w_semaine, w_adorable, w_habites, w_comprends, w_habitent, w_habite, w_elle, w_a]}}
  petite: &petite {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_petite}}
  gp: &gp {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_grands-parents"}}
  par: &par {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_parents}}
  cous: &cous {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_cousins}}
templates:
  - content_key: practice.en-fr.fr.a1.unit03.lesson01.choose.001
    lesson_content_key: fr.a1.unit03.lesson01.immediate_family
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *fam1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Frères et sœurs together means siblings: French has no single everyday word for brothers and sisters.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson01.listen.002
    lesson_content_key: fr.a1.unit03.lesson01.immediate_family
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *famlisten}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Frère and frères sound the same, as do sœur and sœurs, so only the article or the context shows singular or plural.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson01.match.003
    lesson_content_key: fr.a1.unit03.lesson01.immediate_family
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *matchfam, second: *matchfam, third: *matchfam, fourth: *matchfam, fifth: *matchfam, sixth: *matchfam}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "French family words are easy to pair once you know the gender: mère and père, tante and oncle, cousine and cousin.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson01.translate.004
    lesson_content_key: fr.a1.unit03.lesson01.immediate_family
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Frère and sœur take a plural -s (frères, sœurs), so a plural in English needs the plural in French.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson02.choose.001
    lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *poss}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ma goes with feminine nouns (ma mère), mon with masculine ones (mon père), and mes with all plurals (mes parents).", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson02.order.002
    lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
    type: word_order
    frame: {text: "Ma {item} est petite.", language_code: fr, direction: ltr}
    slots: {item: *fem}
    answer_derivation: {kind: render_frame, frame: {text: "Ma {item} est petite.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Ma goes with a feminine singular noun; the adjective petite also takes the feminine -e.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson02.fill.003
    lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
    type: fill_in_blank
    frame: {text: "{item} famille est grande. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *ma, hint: *ma}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Famille is feminine, so it takes ma; a masculine noun would take mon.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson02.translate.004
    lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
    type: translation
    frame: {text: "My family is small.", language_code: en, direction: ltr}
    slots: {item: *petite}
    answer_derivation: {kind: render_frame, frame: {text: "Ma famille est {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Petite is feminine because famille is feminine; a masculine noun would take petit.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson03.choose.001
    lesson_content_key: fr.a1.unit03.lesson03.extended_family
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *fam3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cousin is masculine and cousine is feminine: the -e marks a female cousin, though the two sound different.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson03.order.002
    lesson_content_key: fr.a1.unit03.lesson03.extended_family
    type: word_order
    frame: {text: "Mon {item} habite à Paris.", language_code: fr, direction: ltr}
    slots: {item: *masc}
    answer_derivation: {kind: render_frame, frame: {text: "Mon {item} habite à Paris.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Mon is used before masculine singular nouns: mon père, mon oncle.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson04.choose.001
    lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "French present-tense endings sound the same for habite/habites/habitent, so the pronoun tells you who is meant.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson04.order.002
    lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
    type: word_order
    frame: {text: "J’habite avec mes {item}.", language_code: fr, direction: ltr}
    slots: {item: *plur}
    answer_derivation: {kind: render_frame, frame: {text: "J’habite avec mes {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Mes is the plural my, for masculine and feminine nouns alike.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson04.fill.003
    lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
    type: fill_in_blank
    frame: {text: "Tu habites {item} de tes parents ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *prochedev, hint: *prochedev}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Près de means near and is followed by the possessive: près de tes parents.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson04.translate.004
    lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The verb ending follows the subject: habite for il/elle, habitent for ils/elles, habites for tu.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson04.translate.005
    lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
    type: translation
    frame: {text: "I live with my grandparents.", language_code: en, direction: ltr}
    slots: {item: *gp}
    answer_derivation: {kind: render_frame, frame: {text: "J’habite avec mes {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Mes is the plural my, so mes grands-parents is my grandparents.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson05.fill.001
    lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
    type: fill_in_blank
    frame: {text: "Ma petite sœur {item} Camille. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *sapp, hint: *sapp}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "S’appelle is the il/elle form of s’appeler: ma sœur s’appelle..., je m’appelle...", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson06.listen.001
    lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *wordsl_l}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Plus means more, and ici means here: ici gives the place and plus the comparison in the same sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit03.lesson06.match.002
    lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *matchw, second: *matchw, third: *matchw, fourth: *matchw, fifth: *matchw, sixth: *matchw}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Mais is the contrast word (but) and plus makes a comparison, as in Ma famille est plus petite.", language_code: en, direction: ltr}
