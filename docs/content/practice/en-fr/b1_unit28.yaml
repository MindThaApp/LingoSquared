    lesson_content_key: fr.b1.unit28.lesson01.accord_raison
    type: word_order
    frame: {text: "Je pense que le service du matin est trop {item}.", language_code: fr, direction: ltr}
    slots: {item: *anc_3}
    answer_derivation: {kind: render_frame, frame: {text: "Je pense que le service du matin est trop {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Je pense que + clause gives an opinion; je suis d'accord avec X quand il dit que + clause agrees with someone.", language_code: en, direction: ltr}
