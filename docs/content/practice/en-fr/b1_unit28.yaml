  anc_4: &anc_4 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_l'équipe"}}
  anc_5: &anc_5 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_avis"}}
  rec2_6: &rec2_6 {language_code: fr, part_of_speech: [adjective, adverb, noun, verb], agreement_tags: {semantic: ["w_commande", "w_beaucoup", "w_commandes", "w_pause", "w_longue", "w_aiderait", "w_dis", "w_déjà", "w_crois", "w_garder", "w_refuses", "w_l'idée", "w_long", "w_proposes", "w_solution", "w_vraie"]}}
