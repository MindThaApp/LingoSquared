schema_version: '1.0'
pack_key: practice.en-fr.a1.unit50
source_language: en
target_language: fr
unit_content_key: fr.a1.unit50.communication
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u50 / w_<token>). 16 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_appeler, w_appelles, w_composé, w_compte, w_dire, w_dois, w_entendre, w_fière, w_parlez, w_pensais, w_pensé, w_rappelle, w_sms, w_truc, w_vite, w_évidemment]
templates:
- content_key: practice.en-fr.fr.a1.unit50.lesson01.choose.001
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_appeler, w_dois, w_parlez, w_vite, w_sms, w_rappelle, w_dire, w_truc, w_évidemment, w_appelles, w_pensais, w_composé, w_pensé, w_entendre, w_fière, w_compte]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i''ll call you.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson02.listen.001
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who am i speaking with?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson03.translate.001
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on can you repeat that?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson04.match.001
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson05.choose.001
  lesson_content_key: fr.a1.unit50.lesson05.lire_une_conversation_par
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a text exchange.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson06.translate.001
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a phone call after the shift.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson01.order.002
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: word_order
  frame: {text: 'Je {item} t''appeler.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_dois}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je {item} t''appeler.', language_code: fr, direction: ltr}
  feedback_frame: {text: I have to call you. dois means I must; you must (informal)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson02.order.002
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: word_order
  frame: {text: 'Vous {item} avec Camille.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_parlez}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Vous {item} avec Camille.', language_code: fr, direction: ltr}
  feedback_frame: {text: You're speaking with Camille. Vous parlez avec + name is the formal counterpart to c'est + name., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson03.order.002
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: word_order
  frame: {text: 'Ne parle pas si {item}, s''il te plaît.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags: {semantic: w_vite}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ne parle pas si {item}, s''il te plaît.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Don''t speak so fast, please. Ne parle pas si vite negates the verb: ne ... pas wraps around parle, and si means ''so''.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson04.order.002
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: word_order
  frame: {text: 'Je te {item} plus tard.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_rappelle}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je te {item} plus tard.', language_code: fr, direction: ltr}
  feedback_frame: {text: I'll call you back later. Rappeler (to call back) already carries the idea of 'back' in re-; plus tard means 'later'., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson06.order.002
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: word_order
  frame: {text: 'Ça s''est très bien passé, mieux que je {item}.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_pensais}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ça s''est très bien passé, mieux que je {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'It went really well, better than I thought. Ça s''est très bien passé and je pensais are fixed phrases here; je pensais is the imperfect of penser (to think).', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit50.lesson06.fill.003
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: fill_in_blank
  frame:
    text: Merci beaucoup, ça {item} beaucoup pour moi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_compte}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_compte}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Thank you, that means a lot to me. Compter means ''to matter'' here: ça compte pour moi (it matters to me); pour moi says who it matters to.', language_code: en, direction: ltr}
