  type: word_order
  frame: {text: 'Peux-tu vraiment {item} indifférent au gaspillage ?', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_rester}
