  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_peux, w_rester, w_indifférent, w_gaspillage, w_question, w_rhétorique, w_jour, w_jetons, w_bonnes, w_soir, w_familles, w_ont, w_faim, w_parallélisme, w_pouvons, w_agir, w_faut, w_mise, w_relief, w_logique, w_valeurs, w_métier, w_aider, w_suffit, w_parler, w_moduler, w_alors, w_rejoins, w_lançons, w_ensemble, w_vente, w_solidaire, w_persuader]
