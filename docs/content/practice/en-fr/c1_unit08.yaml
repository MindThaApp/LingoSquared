    semantic: [w_agir, w_aider, w_alors, w_bonnes, w_ensemble, w_faim, w_familles, w_faut, w_gaspillage, w_indifférent, w_jetons, w_jour, w_lançons, w_logique, w_mise, w_moduler, w_métier, w_ont, w_parallélisme, w_parler, w_persuader, w_peux, w_pouvons, w_question, w_rejoins, w_relief, w_rester, w_rhétorique, w_soir, w_solidaire, w_suffit, w_valeurs, w_vente]
