schema_version: '1.0'
pack_key: practice.en-fr.b2.unit04
source_language: en
target_language: fr
unit_content_key: fr.b2.unit04.recit
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_b2_u4 / w_<token>). 30 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_arrivé, w_avais, w_avait, w_beau, w_boutique, w_calme, w_casser, w_cassé, w_client, w_croissants, w_déjà, w_ensuite, w_entrer, w_entré, w_faisait, w_grave, w_heures, w_heureusement, w_huit, w_occupé, w_préparais, w_préparer, w_préparé, w_puis, w_pâte, w_quand, w_sonner, w_sonné, w_soudain, w_tasse]
templates:
- content_key: practice.en-fr.fr.b2.unit04.lesson01.choose.001
  lesson_content_key: fr.b2.unit04.lesson01.larriere_plan
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_huit, w_heures, w_faisait, w_beau, w_avait, w_boutique, w_calme, w_occupé, w_soudain, w_client, w_entrer, w_entré, w_casser, w_cassé, w_tasse, w_puis, w_ensuite, w_préparais, w_croissants, w_sonner, w_sonné, w_quand, w_avais, w_arrivé, w_déjà, w_préparer, w_préparé, w_pâte, w_heureusement, w_grave]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the background: how it was.', language_code: en, direction: ltr}
