templates:
  - content_key: practice.en-fr.fr.a2.unit17.lesson01.choose.001
    lesson_content_key: fr.a2.unit17.lesson01.vocabulaire_bancaire
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *bank_nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Une fiche de paie is a payslip, and un virement is a bank transfer.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson01.listen.002
    lesson_content_key: fr.a2.unit17.lesson01.vocabulaire_bancaire
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *bank_verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ouvrir, payer and retirer are the infinitives you use with a bank card or account.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson01.match.003
    lesson_content_key: fr.a2.unit17.lesson01.vocabulaire_bancaire
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *bank_match, second: *bank_match, third: *bank_match, fourth: *bank_match, fifth: *bank_match, sixth: *bank_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Nouns, verbs and one adjective from the vocabulary of opening an account.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson01.fill.004
    lesson_content_key: fr.a2.unit17.lesson01.vocabulaire_bancaire
    type: fill_in_blank
    frame: {text: "Je voudrais {item} un compte courant. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *ouvrir_single, hint: *ouvrir_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ouvrir un compte means to open an account; un compte courant is a checking account.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson01.translate.005
    lesson_content_key: fr.a2.unit17.lesson01.vocabulaire_bancaire
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bank_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Conseiller is masculine and conseillère is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson01.translate.006
    lesson_content_key: fr.a2.unit17.lesson01.vocabulaire_bancaire
    type: translation
    frame: {text: "The branch is in the town centre.", language_code: en, direction: ltr}
    slots: {item: *agence_single}
    answer_derivation: {kind: render_frame, frame: {text: "L'{item} est au centre-ville.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Une agence is a branch of a bank; l' replaces la before a vowel.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson02.choose.001
    lesson_content_key: fr.a2.unit17.lesson02.registre_formel
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *fees_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Gratuit is masculine; the feminine form adds an -e.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson02.listen.002
    lesson_content_key: fr.a2.unit17.lesson02.registre_formel
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *fees_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pourriez and faut-il are the polite and the inverted question forms used with vous.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson02.order.003
    lesson_content_key: fr.a2.unit17.lesson02.registre_formel
    type: word_order
    frame: {text: "Pourriez-vous m'expliquer les {item} du compte ?", language_code: fr, direction: ltr}
    slots: {item: *frais_single}
    answer_derivation: {kind: render_frame, frame: {text: "Pourriez-vous m'expliquer les {item} du compte ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Les frais is always plural, like the English fees.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson02.fill.004
    lesson_content_key: fr.a2.unit17.lesson02.registre_formel
    type: fill_in_blank
    frame: {text: "La carte est {item} la première année. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *gratuite_single, hint: *gratuite_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Carte is feminine, so gratuit takes an -e.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson02.translate.005
    lesson_content_key: fr.a2.unit17.lesson02.registre_formel
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *fees_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Combien is the question word for how much and how many.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson02.translate.006
    lesson_content_key: fr.a2.unit17.lesson02.registre_formel
    type: translation
    frame: {text: "How many accounts do you have? (Formal.)", language_code: en, direction: ltr}
    slots: {item: *combien_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} de comptes avez-vous ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Combien de is followed by a plural noun without an article.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson03.choose.001
    lesson_content_key: fr.a2.unit17.lesson03.dialogue_ouverture_compte
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *talk_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Élevés is masculine plural, agreeing with les frais.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson03.listen.002
    lesson_content_key: fr.a2.unit17.lesson03.dialogue_ouverture_compte
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *talk_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Sera and aurez are future forms: the account will be active, you will have a card.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson03.match.003
    lesson_content_key: fr.a2.unit17.lesson03.dialogue_ouverture_compte
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *talk_match, second: *talk_match, third: *talk_match, fourth: *talk_match, fifth: *talk_match, sixth: *talk_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from the dialogue at the bank counter.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson03.fill.004
    lesson_content_key: fr.a2.unit17.lesson03.dialogue_ouverture_compte
    type: fill_in_blank
    frame: {text: "Le compte {item} actif avant que vous ne receviez votre carte. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *sera_single, hint: *sera_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sera is the future of être; the clause after avant que takes the subjunctive.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson03.translate.005
    lesson_content_key: fr.a2.unit17.lesson03.dialogue_ouverture_compte
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *talk_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Félicitations is always plural in French.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit17.lesson03.translate.006
    lesson_content_key: fr.a2.unit17.lesson03.dialogue_ouverture_compte
    type: translation
    frame: {text: "Congratulations on your apprenticeship.", language_code: en, direction: ltr}
    slots: {item: *felic_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} pour votre apprentissage.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Félicitations pour followed by a noun congratulates someone on it.", language_code: en, direction: ltr}
