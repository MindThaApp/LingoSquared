  interview_match: &interview_match {language_code: fr, part_of_speech: [noun, adjective, verb], agreement_tags: {semantic: ["w_expérience", "w_début", "w_professionnelle", "w_viennoiseries", "w_libre", "w_dimanche", "w_famille", "w_aucun", "w_fermés", "w_plupart", "w_l'ouverture", "w_préparer"]}}
