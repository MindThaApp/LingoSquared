  polite_audio: &polite_audio {language_code: fr, part_of_speech: [verb, adjective, adverb, noun], agreement_tags: {semantic: ["w_utilise", "w_pourrais", "w_poser", "w_travaillerais", "w_former", "w_intéressée", "w_récemment", "w_formateur"]}}
