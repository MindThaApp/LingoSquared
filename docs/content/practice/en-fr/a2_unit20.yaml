templates:
  - content_key: practice.en-fr.fr.a2.unit20.lesson01.choose.001
    lesson_content_key: fr.a2.unit20.lesson01.parler_experience
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *job_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "A stage is a short work placement; une candidature is a job application.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson01.listen.002
    lesson_content_key: fr.a2.unit20.lesson01.parler_experience
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *job_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Postuler is the infinitive; postulé is the past participle used after j'ai.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson01.match.003
    lesson_content_key: fr.a2.unit20.lesson01.parler_experience
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *job_match, second: *job_match, third: *job_match, fourth: *job_match, fifth: *job_match, sixth: *job_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from the job advertisement and the first interview questions.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson01.fill.004
    lesson_content_key: fr.a2.unit20.lesson01.parler_experience
    type: fill_in_blank
    frame: {text: "J'ai {item} à ce poste parce que je suis passionnée. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *postule_single, hint: *postule_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Postuler à means to apply for; the past participle is postulé.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson01.translate.005
    lesson_content_key: fr.a2.unit20.lesson01.parler_experience
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *job_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Vendredi and samedi are written in lower case in French.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson01.translate.006
    lesson_content_key: fr.a2.unit20.lesson01.parler_experience
    type: translation
    frame: {text: "I am available on Saturdays.", language_code: en, direction: ltr}
    slots: {item: *dispo_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je suis {item} le samedi.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Le samedi, with the article, means every Saturday.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson02.choose.001
    lesson_content_key: fr.a2.unit20.lesson02.repondre_avec_politesse
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *polite_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The polite interview register uses the conditional: je pourrais, je travaillerais.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson02.listen.002
    lesson_content_key: fr.a2.unit20.lesson02.repondre_avec_politesse
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *polite_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pourrais and travaillerais are conditional forms, softer than the present.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson02.order.003
    lesson_content_key: fr.a2.unit20.lesson02.repondre_avec_politesse
    type: word_order
    frame: {text: "Est-ce que je pourrais vous {item} une question ?", language_code: fr, direction: ltr}
    slots: {item: *poser_single}
    answer_derivation: {kind: render_frame, frame: {text: "Est-ce que je pourrais vous {item} une question ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Poser une question is the usual way to say to ask a question.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson02.fill.004
    lesson_content_key: fr.a2.unit20.lesson02.repondre_avec_politesse
    type: fill_in_blank
    frame: {text: "Je {item} tous les matins avant l'ouverture. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *travaillerais_single, hint: *travaillerais_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The conditional of travailler is formed from the infinitive plus -ais.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson02.match.005
    lesson_content_key: fr.a2.unit20.lesson02.repondre_avec_politesse
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *polite_match, second: *polite_match, third: *polite_match, fourth: *polite_match, fifth: *polite_match, sixth: *polite_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Vocabulary for answering politely in an interview.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson02.translate.006
    lesson_content_key: fr.a2.unit20.lesson02.repondre_avec_politesse
    type: translation
    frame: {text: "He is a pastry chef.", language_code: en, direction: ltr}
    slots: {item: *patissier_single}
    answer_derivation: {kind: render_frame, frame: {text: "Il est {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "A profession after être takes no article: il est pâtissier.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson03.choose.001
    lesson_content_key: fr.a2.unit20.lesson03.dialogue_entretien_lefebvre
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *interview_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "M. Lefebvre's bakery is closed on Sundays, which is why libre le dimanche comes up.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson03.listen.002
    lesson_content_key: fr.a2.unit20.lesson03.dialogue_entretien_lefebvre
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *interview_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Seriez-vous and travailleriez are conditional forms in the vous questions.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson03.match.003
    lesson_content_key: fr.a2.unit20.lesson03.dialogue_entretien_lefebvre
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *interview_match, second: *interview_match, third: *interview_match, fourth: *interview_match, fifth: *interview_match, sixth: *interview_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from the interview with M. Lefebvre.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson03.fill.004
    lesson_content_key: fr.a2.unit20.lesson03.dialogue_entretien_lefebvre
    type: fill_in_blank
    frame: {text: "Nous sommes {item} le dimanche. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fermes_single, hint: *fermes_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fermés is masculine plural, agreeing with nous.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson03.translate.005
    lesson_content_key: fr.a2.unit20.lesson03.dialogue_entretien_lefebvre
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *interview_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Aucun is used with a singular noun even though it means none.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit20.lesson03.translate.006
    lesson_content_key: fr.a2.unit20.lesson03.dialogue_entretien_lefebvre
    type: translation
    frame: {text: "Tell me a little about your experience. (Formal.)", language_code: en, direction: ltr}
    slots: {item: *parlez_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} un peu de votre expérience.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Parlez-moi is the formal command with a pronoun attached by a hyphen.", language_code: en, direction: ltr}
