schema_version: '1.0'
pack_key: practice.en-fr.b2.unit05
source_language: en
target_language: fr
unit_content_key: fr.b2.unit05.registre
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_b2_u5 / w_<token>). 35 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_agréer, w_autrement, w_avez, w_bientôt, w_bises, w_convenir, w_conviendrait, w_cordialement, w_disponible, w_distinguées, w_dois, w_déplacer, w_libre, w_madame, w_mairie, w_mardi, w_mes, w_message, w_monsieur, w_notre, w_peux, w_plaît, w_poliment, w_possible, w_pourriez, w_problème, w_prochaine, w_salutations, w_semaine, w_serait, w_sûr, w_ton, w_veuillez, w_écrire, w_écrit]
templates:
- content_key: practice.en-fr.fr.b2.unit05.lesson01.choose.001
  lesson_content_key: fr.b2.unit05.lesson01.tu_ou_vous
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_écrit, w_écrire, w_message, w_ton, w_avez, w_peux, w_bises, w_bientôt, w_madame, w_monsieur, w_veuillez, w_agréer, w_mes, w_salutations, w_distinguées, w_cordialement, w_plaît, w_pourriez, w_possible, w_serait, w_déplacer, w_notre, w_libre, w_disponible, w_mardi, w_semaine, w_prochaine, w_convenir, w_conviendrait, w_problème, w_dois, w_mairie, w_poliment, w_autrement, w_sûr]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on tu or vous?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson02.listen.001
  lesson_content_key: fr.b2.unit05.lesson02.formules_de_politesse
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on openings and closings.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson03.translate.001
  lesson_content_key: fr.b2.unit05.lesson03.direct_ou_poli
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on direct or polite?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson04.match.001
  lesson_content_key: fr.b2.unit05.lesson04.le_rendez_vous
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson05.choose.001
  lesson_content_key: fr.b2.unit05.lesson05.deux_messages
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two messages, two readers.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson06.translate.001
  lesson_content_key: fr.b2.unit05.lesson06.choisir_le_registre
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on choosing the right register.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson01.order.002
  lesson_content_key: fr.b2.unit05.lesson01.tu_ou_vous
  type: word_order
  frame: {text: 'Inès {item} un message.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_écrit}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Inès {item} un message.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Inès is writing a message. The situation this whole unit works with: Inès has to send the same request to two very different readers. Un message = ''a message''.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson01.fill.003
  lesson_content_key: fr.b2.unit05.lesson01.tu_ou_vous
  type: fill_in_blank
  frame:
    text: Je dois {item} un message. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_écrire}
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_écrire}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I have to write a message. écrire means to write., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson01.translate.004
  lesson_content_key: fr.b2.unit05.lesson01.tu_ou_vous
  type: translation
  frame: {text: 'Can you help me?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_peux}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tu {item} m''aider ?', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Can you help me? Informal. Tu peux m''aider ? -- direct, no inversion, perfectly polite between friends. M''aider = me + aider, elided before a vowel.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson02.order.002
  lesson_content_key: fr.b2.unit05.lesson02.formules_de_politesse
  type: word_order
  frame: {text: 'Veuillez {item}, Madame, Monsieur, l''expression de mes salutations distinguées.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_agréer}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Veuillez {item}, Madame, Monsieur, l''expression de mes salutations distinguées.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Please accept, Sir or Madam, the expression of my highest regards. (standard formal closing) Veuillez agréer, Madame, Monsieur, l''expression de mes salutations distinguées. is the classic, most formal French closing -- long and.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson03.order.002
  lesson_content_key: fr.b2.unit05.lesson03.direct_ou_poli
  type: word_order
  frame: {text: 'Aide-moi, s''il te {item}.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_plaît}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Aide-moi, s''il te {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Help me, please. plaît means pleases.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson03.fill.003
  lesson_content_key: fr.b2.unit05.lesson03.direct_ou_poli
  type: fill_in_blank
  frame:
    text: Serait-il {item} de venir ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_possible}
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_possible}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Would it be possible to come? possible means possible.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson04.order.002
  lesson_content_key: fr.b2.unit05.lesson04.le_rendez_vous
  type: word_order
  frame: {text: 'Je veux {item} le rendez-vous.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_déplacer}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je veux {item} le rendez-vous.', language_code: fr, direction: ltr}
  feedback_frame: {text: I want to reschedule the appointment. déplacer means to move (an appointment)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson04.fill.003
  lesson_content_key: fr.b2.unit05.lesson04.le_rendez_vous
  type: fill_in_blank
  frame:
    text: C'est {item} rendez-vous. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_notre}
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_notre}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It's our appointment. notre means our., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson04.translate.004
  lesson_content_key: fr.b2.unit05.lesson04.le_rendez_vous
  type: translation
  frame: {text: I'm not free on Tuesday., language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_libre}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je ne suis pas {item} mardi.', language_code: fr, direction: ltr}
  feedback_frame: {text: I'm not free on Tuesday. libre means free., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson06.order.002
  lesson_content_key: fr.b2.unit05.lesson06.choisir_le_registre
  type: word_order
  frame: {text: 'Pas de {item}.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_problème}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Pas de {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'No problem. Pas de problème = ''no problem'' -- a relaxed, informal reply.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson06.fill.003
  lesson_content_key: fr.b2.unit05.lesson06.choisir_le_registre
  type: fill_in_blank
  frame:
    text: Je {item} écrire un message. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_dois}
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_dois}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I have to write a message. dois means I must; you must (informal)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit05.lesson06.translate.004
  lesson_content_key: fr.b2.unit05.lesson06.choisir_le_registre
  type: translation
  frame: {text: I have to write to the town hall., language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_mairie}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Je dois écrire à la {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: I have to write to the town hall. mairie means town hall., language_code: en, direction: ltr}
