    lesson_content_key: fr.a2.unit15.lesson01.vocabulaire_mairie
    type: fill_in_blank
    frame: {text: "Pour un changement d'adresse, vous {item} présenter une pièce d'identité. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *devez_single, hint: *devez_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Devoir is irregular: je dois, vous devez.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson01.translate.005
    lesson_content_key: fr.a2.unit15.lesson01.vocabulaire_mairie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *mairie_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Délai and démarche both carry an acute accent on the é.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson01.translate.006
    lesson_content_key: fr.a2.unit15.lesson01.vocabulaire_mairie
    type: translation
    frame: {text: "The deadline is thirty days.", language_code: en, direction: ltr}
    slots: {item: *delai_single}
    answer_derivation: {kind: render_frame, frame: {text: "Le {item} est de trente jours.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Le délai is the time you are given to complete a procedure.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson02.choose.001
    lesson_content_key: fr.a2.unit15.lesson02.registre_formel
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *formal_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "In formal writing the town hall addresses you with vous, never tu.", language_code: en, direction: ltr}
