    lesson_content_key: fr.a2.unit15.lesson02.registre_formel
    type: fill_in_blank
    frame: {text: "Il {item} que vous apportiez votre dossier. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *faudrait_single, hint: *faudrait_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Il faudrait que is followed by the subjunctive, here apportiez.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson02.translate.005
    lesson_content_key: fr.a2.unit15.lesson02.registre_formel
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *formal_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The formal register favours full words such as adresse and dossier.", language_code: en, direction: ltr}
