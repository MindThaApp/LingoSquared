templates:
  - content_key: practice.en-fr.fr.a2.unit15.lesson01.choose.001
    lesson_content_key: fr.a2.unit15.lesson01.vocabulaire_mairie
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *mairie_nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Most of these words come up when you tell the town hall about a move; une démarche is any step you have to take with an office.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson01.listen.002
    lesson_content_key: fr.a2.unit15.lesson01.vocabulaire_mairie
