    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "You heard an infinitive, the form a dictionary lists.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson01.match.003
    lesson_content_key: fr.a2.unit15.lesson01.vocabulaire_mairie
