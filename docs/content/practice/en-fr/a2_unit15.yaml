    frame: {text: "Could you confirm your new address?", language_code: en, direction: ltr}
    slots: {item: *pourriez_single}
    answer_derivation: {kind: render_frame, frame: {text: "{item} confirmer votre nouvelle adresse ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Pourriez-vous is the conditional of pouvoir with vous: a polite request.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson03.choose.001
    lesson_content_key: fr.a2.unit15.lesson03.dialogue_rendez_vous_mairie
