    slots: {item: *formal_verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Faudrait, apportiez and pourriez-vous belong to the polite register this lesson teaches.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit15.lesson02.match.003
    lesson_content_key: fr.a2.unit15.lesson02.registre_formel
