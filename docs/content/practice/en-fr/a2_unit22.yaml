templates:
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.choose.001
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *net_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Réseaux sociaux is the French for social networks.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.listen.002
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *net_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Consulter and limiter are -er verbs; the je form drops the -er and adds -e.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.match.003
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *net_match, second: *net_match, third: *net_match, fourth: *net_match, fifth: *net_match, sixth: *net_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Everyday words about phones, apps and social networks.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.order.004
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: word_order
    frame: {text: "Je consulte mes {item} tous les jours.", language_code: fr, direction: ltr}
    slots: {item: *msg_item}
    answer_derivation: {kind: render_frame, frame: {text: "Je consulte mes {item} tous les jours.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Mes is the plural of mon and ma.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.fill.005
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: fill_in_blank
    frame: {text: "{item} une appli de recettes presque tous les jours. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *utilise_single, hint: *utilise_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "J'utilise is je plus utiliser, with the e dropped before the vowel.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.translate.006
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *net_tr}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Message and messages differ only by the final -s.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson01.translate.007
    lesson_content_key: fr.a2.unit22.lesson01.habitudes_en_ligne
    type: translation
    frame: {text: "It is practical.", language_code: en, direction: ltr}
    slots: {item: *pratique_single}
    answer_derivation: {kind: render_frame, frame: {text: "C'est {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Pratique stays the same for masculine and feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.choose.001
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *opinion_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ton is the informal your before a masculine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.listen.002
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *opinion_audio}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Utilises and réponds are tu and je forms of present-tense verbs.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.match.003
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: fr, direction: ltr}
    slots: {first: *opinion_words, second: *opinion_words, third: *opinion_words, fourth: *opinion_words, fifth: *opinion_words, sixth: *opinion_words}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words used to talk about your own habits online.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.order.004
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: word_order
    frame: {text: "Depuis mon {item}, je consulte mes messages tous les matins.", language_code: fr, direction: ltr}
    slots: {item: *demenagement_single}
    answer_derivation: {kind: render_frame, frame: {text: "Depuis mon {item}, je consulte mes messages tous les matins.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Depuis plus a noun says since when something has been true.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.fill.005
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: fill_in_blank
    frame: {text: "Tu {item} souvent ton téléphone depuis ton déménagement ? ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *utilises_single, hint: *utilises_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "With tu, the present of utiliser ends in -es.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.translate.006
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *opinion_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Internet is written in lower case in French.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a2.unit22.lesson02.translate.007
    lesson_content_key: fr.a2.unit22.lesson02.donner_avis_numerique
    type: translation
    frame: {text: "I answer my family in the evening.", language_code: en, direction: ltr}
    slots: {item: *reponds_single}
    answer_derivation: {kind: render_frame, frame: {text: "Je {item} à ma famille le soir.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Répondre à takes à before the person you answer.", language_code: en, direction: ltr}
