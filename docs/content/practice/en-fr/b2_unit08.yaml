schema_version: '1.0'
pack_key: practice.en-fr.b2.unit08
source_language: en
target_language: fr
unit_content_key: fr.b2.unit08.synthese
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_b2_u8 / w_<token>). 41 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_accord, w_affirme, w_affirmer, w_attendre, w_attends, w_avis, w_cher, w_choix, w_cinquante, w_comparé, w_contrairement, w_convaincant, w_coûter, w_croissant, w_deux, w_deuxième, w_dire, w_dit, w_donc, w_donne, w_délicieux, w_ensemble, w_euros, w_exact, w_façon, w_ligne, w_même, w_négatif, w_positif, w_premier, w_prix, w_précis, w_raisonnable, w_revenir, w_reviendrai, w_souligne, w_soulignent, w_souligner, w_trois, w_vantent, w_vanter]
templates:
- content_key: practice.en-fr.fr.b2.unit08.lesson01.choose.001
  lesson_content_key: fr.b2.unit08.lesson01.qui_dit_quoi
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_deux, w_avis, w_ligne, w_premier, w_deuxième, w_prix, w_délicieux, w_raisonnable, w_cher, w_dit, w_dire, w_affirme, w_affirmer, w_comparé, w_contrairement, w_vantent, w_vanter, w_même, w_façon, w_positif, w_négatif, w_accord, w_souligne, w_soulignent, w_souligner, w_coûter, w_croissant, w_trois, w_euros, w_cinquante, w_exact, w_donne, w_reviendrai, w_revenir, w_attends, w_attendre, w_choix, w_précis, w_donc, w_convaincant, w_ensemble]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who says what?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson02.listen.001
  lesson_content_key: fr.b2.unit08.lesson02.comparer_les_avis
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on comparing the two reviews.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson03.translate.001
  lesson_content_key: fr.b2.unit08.lesson03.ou_sont_ils_daccord
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on where do they agree?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson04.match.001
  lesson_content_key: fr.b2.unit08.lesson04.ou_sont_ils_en_desaccord
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson05.choose.001
  lesson_content_key: fr.b2.unit08.lesson05.les_deux_avis_cote_a_cote
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the two reviews side by side.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson06.translate.001
  lesson_content_key: fr.b2.unit08.lesson06.la_synthese_complete
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the full synthesis.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson01.order.002
  lesson_content_key: fr.b2.unit08.lesson01.qui_dit_quoi
  type: word_order
  frame: {text: 'Il y a {item} avis en ligne sur la boutique.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_deux}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Il y a {item} avis en ligne sur la boutique.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'There are two reviews online about the shop. The situation the whole unit synthesizes: two anonymous customers have reviewed the shop where Inès works, and you have to weigh what they say. Il y a = ''there is/are''; en ligne =.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson01.fill.003
  lesson_content_key: fr.b2.unit08.lesson01.qui_dit_quoi
  type: fill_in_blank
  frame:
    text: Le premier {item} parle des croissants. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_avis}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_avis}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The first review talks about the croissants. avis means opinion; notice., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson01.translate.004
  lesson_content_key: fr.b2.unit08.lesson01.qui_dit_quoi
  type: translation
  frame: {text: The first review says that the croissants are delicious., language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_premier}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le {item} avis dit que les croissants sont délicieux.', language_code: fr, direction: ltr}
  feedback_frame: {text: The first review says that the croissants are delicious. premier means first (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson02.order.002
  lesson_content_key: fr.b2.unit08.lesson02.comparer_les_avis
  type: word_order
  frame: {text: 'Les deux avis {item} les croissants.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_vantent}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Les deux avis {item} les croissants.', language_code: fr, direction: ltr}
  feedback_frame: {text: Both reviews praise the croissants. vantent means they praise; promote., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson02.fill.003
  lesson_content_key: fr.b2.unit08.lesson02.comparer_les_avis
  type: fill_in_blank
  frame:
    text: De la {item} façon, les deux avis vantent les croissants. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags: {semantic: w_même}
    hint:
      language_code: fr
      part_of_speech: adverb
      agreement_tags: {semantic: w_même}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'In the same way, the two reviews praise the croissants. même means even; same.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson02.translate.004
  lesson_content_key: fr.b2.unit08.lesson02.comparer_les_avis
  type: translation
  frame: {text: 'The first review is positive, whereas the second is negative.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags: {semantic: w_positif}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le premier avis est {item}, tandis que le deuxième est négatif.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'The first review is positive, whereas the second is negative. positif means positive (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson03.order.002
  lesson_content_key: fr.b2.unit08.lesson03.ou_sont_ils_daccord
  type: word_order
  frame: {text: 'Les deux avis {item} que les croissants sont délicieux.', language_code: fr, direction: ltr}
