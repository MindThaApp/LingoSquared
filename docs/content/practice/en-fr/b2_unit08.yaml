    frame: {text: 'Les deux avis {item} que les croissants sont délicieux.', language_code: fr, direction: ltr}
  feedback_frame: {text: The two reviews underline that the croissants are delicious. soulignent means they underline; emphasize., language_code: en, direction: ltr}
