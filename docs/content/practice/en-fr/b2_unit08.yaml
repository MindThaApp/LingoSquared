  feedback_frame: {text: The second review is more precise. précis means precise; exact (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.b2.unit08.lesson06.order.002
  lesson_content_key: fr.b2.unit08.lesson06.la_synthese_complete
