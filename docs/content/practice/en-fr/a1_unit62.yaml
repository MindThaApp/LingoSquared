schema_version: '1.0'
pack_key: practice.en-fr.a1.unit62
source_language: en
target_language: fr
unit_content_key: fr.a1.unit62.poste
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u62 / w_<token>). 10 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_achète, w_arrivent, w_colis, w_désirez, w_employé, w_lettre, w_met, w_mettre, w_timbre, w_écrire]
templates:
- content_key: practice.en-fr.fr.a1.unit62.lesson01.choose.001
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_lettre, w_colis, w_timbre, w_écrire, w_arrivent, w_mettre, w_met, w_employé, w_désirez, w_achète]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the letter and the package.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit62.lesson02.listen.001
  lesson_content_key: fr.a1.unit62.lesson02.le_timbre_l_adresse
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the stamp, the address, and writing.', language_code: en, direction: ltr}
