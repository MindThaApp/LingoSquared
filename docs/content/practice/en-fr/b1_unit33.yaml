    lesson_content_key: fr.b1.unit33.lesson01.discours_present
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *rec1_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These are the words for reporting what someone says right now.", language_code: en, direction: ltr}
