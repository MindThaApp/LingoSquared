    answer_derivation: {kind: render_frame, frame: {text: "Le chef demande si la {item} est prête.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Dire que + present reports a statement; demander si + present reports a yes-or-no question.", language_code: en, direction: ltr}
