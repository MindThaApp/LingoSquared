schema_version: "1.0"
pack_key: practice.en-fr.b1.unit33
source_language: en
target_language: fr
unit_content_key: fr.b1.unit33.discours_indirect
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: "Authored 2026-10-25 (session 12, en-fr B1) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (level b1, group en-fr-b1). Grammar-unit layout: recognition and bare-word production pools are curated w_<token> lists from this unit's own first-sight tokens; the structured and sentence-production templates pin one lexeme with a single-member anchor and carry the unit's construction in the frame. Sentence translations list accepted_variants for natural alternatives (word order, dès que/quand, on/nous, est-ce que). Native review: confirm the glosses of conjugated forms (for example j'aurais, aurais, tu/je ambiguity in forms such as préviens, arrive, parle) and the accepted variants."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_concordance", "w_demander", "w_demandé", "w_indicatif", "w_maintenant", "w_rapporter", "w_rien", "w_salle", "w_verbe"]
slot_presets:
  rec1_1: &rec1_1 {language_code: fr, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: ["w_salle", "w_demander", "w_indicatif", "w_rapporter", "w_demandé", "w_concordance", "w_verbe", "w_maintenant"]}}
  anc_2: &anc_2 {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: "w_salle"}}
  anc_3: &anc_3 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_rapporter"}}
  tr1_4: &tr1_4 {language_code: fr, part_of_speech: [noun, verb], agreement_tags: {semantic: ["w_salle", "w_demander", "w_indicatif", "w_rapporter"]}}
  anc_5: &anc_5 {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: "w_demandé"}}
  anc_6: &anc_6 {language_code: fr, part_of_speech: pronoun, agreement_tags: {semantic: "w_rien"}}
  anc_7: &anc_7 {language_code: fr, part_of_speech: adverb, agreement_tags: {semantic: "w_maintenant"}}
  tr2_8: &tr2_8 {language_code: fr, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: ["w_demandé", "w_concordance", "w_verbe", "w_maintenant"]}}
templates:
