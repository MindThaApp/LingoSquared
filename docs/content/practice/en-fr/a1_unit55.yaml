    frame: {text: 'Léa adore {item}.', language_code: fr, direction: ltr}
  feedback_frame: {text: Léa loves swimming. nager means to swim., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson04.order.002
  lesson_content_key: fr.a1.unit55.lesson04.mathieu_pose_des_questions
  type: word_order
  frame: {text: 'Dans le {item}, près de chez moi.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_parc}
