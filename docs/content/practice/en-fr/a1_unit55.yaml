      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_course}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Thomas fait de la {item} à pied.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Thomas goes running. course means running, race.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson03.order.002
