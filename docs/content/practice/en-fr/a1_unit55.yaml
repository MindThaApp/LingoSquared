  feedback_frame: {text: And I like running. courir means to run., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson05.order.002
  lesson_content_key: fr.a1.unit55.lesson05.camille_et_lea_parlent
  type: word_order
  frame: {text: 'Léa {item} souvent, presque chaque semaine.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags: {semantic: w_nage}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Léa {item} souvent, presque chaque semaine.', language_code: fr, direction: ltr}
  feedback_frame: {text: 'Léa swims often, almost every week. nage means swims.', language_code: en, direction: ltr}
