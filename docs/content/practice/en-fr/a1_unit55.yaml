    language_code: fr
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_yoga}
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_yoga}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Yoga is also a sport. yoga means yoga., language_code: en, direction: ltr}
