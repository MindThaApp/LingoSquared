schema_version: '1.0'
pack_key: practice.en-fr.a1.unit55
source_language: en
target_language: fr
unit_content_key: fr.a1.unit55.sport
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fr backfill lexemes (tags fr_a1_u55 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_adorer, w_bouger, w_corrects, w_courir, w_course, w_court, w_doucement, w_façon, w_football, w_français, w_fréquence, w_grâce, w_leçon, w_nage, w_nager, w_natation, w_nomme, w_parc, w_pratiques, w_presque, w_proposer, w_précise, w_précédente, w_yoga]
templates:
- content_key: practice.en-fr.fr.a1.unit55.lesson01.choose.001
  lesson_content_key: fr.a1.unit55.lesson01.football_yoga_course_a
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: &id001
      language_code: fr
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_football, w_yoga, w_course, w_natation, w_pratiques, w_façon, w_précise, w_fréquence, w_grâce, w_leçon, w_nomme, w_corrects, w_français, w_adorer, w_nager, w_parc, w_courir, w_court, w_bouger, w_doucement, w_nage, w_presque, w_précédente, w_proposer]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on football, yoga, running, and swimming.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson02.listen.001
  lesson_content_key: fr.a1.unit55.lesson02.a_quelle_frequence_tu
  type: listen_select
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how often do you exercise?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson03.translate.001
  lesson_content_key: fr.a1.unit55.lesson03.faire_du_sport_et
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on exercising and loving a sport.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson04.match.001
  lesson_content_key: fr.a1.unit55.lesson04.mathieu_pose_des_questions
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: fr, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each French word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson05.choose.001
  lesson_content_key: fr.a1.unit55.lesson05.camille_et_lea_parlent
  type: multiple_choice
  frame: {text: '{item}', language_code: fr, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on camille and léa on sport.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson06.translate.001
  lesson_content_key: fr.a1.unit55.lesson06.on_fait_du_sport
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we exercise together?.', language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson01.order.002
  lesson_content_key: fr.a1.unit55.lesson01.football_yoga_course_a
  type: word_order
  frame: {text: 'Le {item} est un sport.', language_code: fr, direction: ltr}
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags: {semantic: w_football}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le {item} est un sport.', language_code: fr, direction: ltr}
  feedback_frame: {text: Football is a sport. football means football., language_code: en, direction: ltr}
- content_key: practice.en-fr.fr.a1.unit55.lesson01.fill.003
  lesson_content_key: fr.a1.unit55.lesson01.football_yoga_course_a
  type: fill_in_blank
