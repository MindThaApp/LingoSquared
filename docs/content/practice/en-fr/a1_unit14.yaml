schema_version: "1.0"
pack_key: practice.en-fr.a1.unit14
source_language: en
target_language: fr
unit_content_key: fr.a1.unit14.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-fr job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_fr.py (per-unit tags fr_a1_u14*, single-member w_<token> anchors, curated w_ lists). Frames follow this unit's straight apostrophes. Meilleur/meilleure are homophones, so neither enters a listen pool together (lesson 03 listen has neither). Bon stays masculine in the aussi...que frame (Ce gateau). L'air was re-glossed the look; the appearance. Reviewer: confirm the plus/moins/aussi comparatives and the le plus / la moins superlatives.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_adjectif, w_bon, w_celui-ci, w_celui-là, w_chère, w_comparons, "w_d'acheter", w_difficile, w_irrégulier, "w_l'autre", w_lequel, w_meilleur, w_option, w_prend, w_reste, w_sortes, w_vrai]
slot_presets:
  c1: &c1 {language_code: fr, part_of_speech: [adjective], agreement_tags: {semantic: ["w_l'autre", w_difficile, w_meilleur, w_bon, w_chère, w_irrégulier, w_vrai]}}
  lis1: &lis1 {language_code: fr, part_of_speech: [adjective], agreement_tags: {semantic: ["w_l'autre", w_difficile, w_meilleur, w_bon, w_vrai]}}
  a_l_autre_adje: &a_l_autre_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: "w_l'autre"}}
  a_difficile_adje: &a_difficile_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_difficile}}
  a_meilleur_adje: &a_meilleur_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_meilleur}}
  c2: &c2 {language_code: fr, part_of_speech: [adjective, noun, verb, phrase], agreement_tags: {semantic: [w_chère, w_adjectif, w_irrégulier, w_comparons, "w_d'acheter"]}}
  a_d_acheter_phra: &a_d_acheter_phra {language_code: fr, part_of_speech: phrase, agreement_tags: {semantic: "w_d'acheter"}}
  a_irregulier_adje: &a_irregulier_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_irrégulier}}
  a_chere_adje: &a_chere_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_chère}}
  c3: &c3 {language_code: fr, part_of_speech: [noun, pronoun, adjective, verb], agreement_tags: {semantic: [w_sortes, w_lequel, w_celui-ci, w_celui-là, w_vrai, w_option, w_prend, w_reste]}}
  lis3: &lis3 {language_code: fr, part_of_speech: [noun, pronoun, adjective, verb], agreement_tags: {semantic: [w_sortes, w_lequel, w_celui-ci, w_celui-là, w_vrai, w_option]}}
  a_prend_verb: &a_prend_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_prend}}
  a_vrai_adje: &a_vrai_adje {language_code: fr, part_of_speech: adjective, agreement_tags: {semantic: w_vrai}}
  a_sortes_noun: &a_sortes_noun {language_code: fr, part_of_speech: noun, agreement_tags: {semantic: w_sortes}}
  a_reste_verb: &a_reste_verb {language_code: fr, part_of_speech: verb, agreement_tags: {semantic: w_reste}}
  a_celui_la_pron: &a_celui_la_pron {language_code: fr, part_of_speech: pronoun, agreement_tags: {semantic: w_celui-là}}
templates:
  - content_key: practice.en-fr.fr.a1.unit14.lesson01.choose.001
    lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Meilleur is the irregular comparative of bon: you say meilleur, never plus bon.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson01.listen.002
    lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Difficile and facile have the same form for masculine and feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson01.order.004
    lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
    type: word_order
    frame: {text: "Moi, je trouve {item} aussi bon.", language_code: fr, direction: ltr}
    slots: {item: *a_l_autre_adje}
    answer_derivation: {kind: render_frame, frame: {text: "Moi, je trouve {item} aussi bon.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "L'autre means the other one; aussi bon means just as good.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson01.fill.006
    lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
    type: fill_in_blank
    frame: {text: "Cette recette est moins {item} que l'autre. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_difficile_adje, hint: *a_difficile_adje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Difficile does not change in the feminine, so it fits recette.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson01.fill.007
    lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
    type: fill_in_blank
    frame: {text: "Ce gâteau est {item} que le premier. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_meilleur_adje, hint: *a_meilleur_adje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Meilleur que means better than; it replaces plus bon.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson01.translate.008
    lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
    type: translation
    frame: {text: "This cheese is more expensive than the other one.", language_code: en, direction: ltr}
    slots: {item: *a_l_autre_adje}
    answer_derivation: {kind: render_frame, frame: {text: "Ce fromage est plus cher que {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Que introduces the second term of a comparison; l'autre stands for the other cheese.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson02.choose.001
    lesson_content_key: fr.a1.unit14.lesson02.superlatifs
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Irrégulier means the form does not follow the normal pattern, as with meilleur.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson02.listen.002
    lesson_content_key: fr.a1.unit14.lesson02.superlatifs
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Adjectif and irrégulier are close to their English cousins adjective and irregular.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson02.order.003
    lesson_content_key: fr.a1.unit14.lesson02.superlatifs
    type: word_order
    frame: {text: "Comparons les prix avant {item}.", language_code: fr, direction: ltr}
    slots: {item: *a_d_acheter_phra}
    answer_derivation: {kind: render_frame, frame: {text: "Comparons les prix avant {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Avant de plus an infinitive means before doing something.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson02.fill.004
    lesson_content_key: fr.a1.unit14.lesson02.superlatifs
    type: fill_in_blank
    frame: {text: "Meilleur est un adjectif {item}. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_irregulier_adje, hint: *a_irregulier_adje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Irrégulier describes meilleur because it does not follow the regular plus bon pattern.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson02.translate.005
    lesson_content_key: fr.a1.unit14.lesson02.superlatifs
    type: translation
    frame: {text: "It is the least expensive recipe.", language_code: en, direction: ltr}
    slots: {item: *a_chere_adje}
    answer_derivation: {kind: render_frame, frame: {text: "C'est la recette la moins {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "La moins chère uses la moins plus a feminine adjective.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.choose.001
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: multiple_choice
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *c3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Celui-ci means this one and celui-là means that one, both masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.listen.002
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: listen_select
    frame: {text: "{item}", language_code: fr, direction: ltr}
    slots: {item: *lis3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Celui-ci and celui-là differ only in -ci and -là, here and there.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.order.004
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: word_order
    frame: {text: "Lequel on {item} ?", language_code: fr, direction: ltr}
    slots: {item: *a_prend_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Lequel on {item} ?", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Lequel on prend? is casual: lequel asks which one and on means we.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.fill.006
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: fill_in_blank
    frame: {text: "Il y a deux {item} de fromage. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_sortes_noun, hint: *a_sortes_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sortes is plural after deux and is followed by de.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.fill.007
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: fill_in_blank
    frame: {text: "Il nous {item} plus d'argent pour le dessert. ({hint})", language_code: fr, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *a_reste_verb, hint: *a_reste_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Il nous reste means we have left; reste is impersonal here.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.translate.008
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: translation
    frame: {text: "So we are taking that one; it is the best option for the workshop.", language_code: en, direction: ltr}
    slots: {item: *a_celui_la_pron}
    answer_derivation: {kind: render_frame, frame: {text: "Alors on prend {item}, c'est la meilleure option pour l'atelier.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "Celui-là means that one; meilleure is feminine because option is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-fr.fr.a1.unit14.lesson03.translate.009
    lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
    type: translation
    frame: {text: "That is true.", language_code: en, direction: ltr}
    slots: {item: *a_vrai_adje}
    answer_derivation: {kind: render_frame, frame: {text: "C'est {item}.", language_code: fr, direction: ltr}}
    feedback_frame: {text: "C'est vrai is a common way to agree.", language_code: en, direction: ltr}
