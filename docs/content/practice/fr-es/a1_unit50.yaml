schema_version: '1.0'
pack_key: practice.fr-es.a1.unit50
source_language: fr
target_language: es
unit_content_key: es.a1.unit50.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actividad
    - w_breve
    - w_cine
    - w_cita
    - w_ganas
    - w_idiomas
    - w_invitación
    - w_plan
    - w_proponer
    - w_puede
    - w_quedamos
    - w_quedar
    - w_rechazo
    - w_saludo
    - w_tomamos
    - w_tomar
    - w_viene
templates:
- content_key: practice.fr-es.es.a1.unit50.lesson01.choose.001
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tomamos
        - w_tomar
        - w_cine
        - w_proponer
        - w_actividad
        - w_ganas
        - w_plan
        - w_breve
        - w_rechazo
        - w_quedar
        - w_quedamos
        - w_cita
        - w_viene
        - w_invitación
        - w_idiomas
        - w_saludo
        - w_puede
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie du vocabulaire de cette unité, dans la leçon sur la proposition d’une activité.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson02.listen.001
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie du vocabulaire de cette unité, dans la leçon sur l’acceptation ou le refus d’un programme.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson03.translate.001
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie du vocabulaire de cette unité, dans la leçon sur le choix d’un jour et d’une heure.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson04.match.001
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot en espagnol à sa signification en français ; ces mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson06.choose.001
  lesson_content_key: es.a1.unit50.lesson06.elena_y_mateo_hacen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie du vocabulaire de cette unité, dans la leçon où Elena et Mateo organisent une sortie.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson01.translate.002
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie du vocabulaire de cette unité, dans la leçon sur la proposition d’une activité.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson01.order.003
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: word_order
  frame:
    text: ¿Tienes ganas de ir al {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cine
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tienes ganas de ir al {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ça te dit d’aller voir un film ? ¿Tienes ganas de ...? sert à demander de façon informelle si quelqu’un a envie de faire quelque chose ; un infinitif suit de.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson02.order.002
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: word_order
  frame:
    text: Es un buen {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_plan
  answer_derivation:
    kind: render_frame
    frame:
      text: Es un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: C’est un bon plan. Il s’agit d’une réponse positive un peu plus développée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson02.fill.003
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: fill_in_blank
  frame:
    text: Lo siento + no puedo + una razón {item} hace amable un rechazo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lo siento + no puedo + une raison courte permet de refuser aimablement. Donner une raison est facultatif dans une conversation, mais cela rend la réponse plus utile et plus polie.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson03.order.002
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: word_order
  frame:
    text: Sí, el viernes a las dos y media me {item} bien.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viene
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, el viernes a las dos y media me {item} bien.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Oui, vendredi à 2 h 30 me convient. Me viene bien (« cela me convient ») confirme que l’heure proposée convient.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson04.order.002
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: word_order
  frame:
    text: Esta es una {item} al café de idiomas.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_invitación
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es una {item} al café de idiomas.
      language_code: es
      direction: ltr
  feedback_frame:
    text: C’est une invitation au café des langues. invitación signifie invitation.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit50.lesson04.fill.003
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: fill_in_blank
  frame:
    text: Tomamos un café en el café de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nous prenons un café au café des langues. idiomas signifie langues.
    language_code: fr
    direction: ltr
