templates:
- content_key: practice.fr-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En espagnol, il existe deux façons de dire « tu » ou « vous » : tú s’emploie avec les amis et la famille, tandis que usted s’emploie avec les inconnus et en signe de respect.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Está s’emploie avec usted ; avec tú, le verbe devient estás : ¿Cómo estás?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En espagnol, les salutations et les mots employés dans les conversations courantes portent souvent un accent (cómo, adiós, también) ; celui-ci indique la syllabe accentuée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buenos días s’emploie jusqu’à l’heure du déjeuner (vers 14 h en Espagne), buenas tardes l’après-midi et buenas noches le soir et la nuit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Día est masculin (buenos días), tandis que tarde et noche sont féminins (buenas tardes, buenas noches).
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hasta luego signifie littéralement « jusqu’à plus tard » ; c’est la façon courante de dire « à plus tard ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Me llamo signifie littéralement « je m’appelle » ; c’est la façon courante de donner son nom.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: Voici {name}. (pour présenter un homme)
    language_code: fr
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Emploie este pour présenter un homme et esta pour présenter une femme : Esta es Ana.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Esta sert à présenter une femme ; pour un homme, on dit este : Este es Carlos.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mucho gusto signifie « enchanté » ; la réponse habituelle est igualmente, « de même ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + lieu indique d’où tu viens ; vivir en + lieu indique où tu habites actuellement.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: Mon lieu d’origine est {place}.
    language_code: fr
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Pour poser la même question : ¿De dónde eres? (registre familier) ou ¿De dónde es usted? (registre formel).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy + -ando/-iendo décrit une action en cours au moment présent, comme « je suis encore en train d’apprendre ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Vez désigne une « fois » au sens d’une occasion : primera vez, « première fois » ; otra vez, « encore ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: Est-ce que tu aimes cuisiner ? (registre familier)
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'En espagnol, on exprime ce que l’on aime avec gustar : l’activité te plaît, d’où te gusta + infinitif.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Elena et Mateo se tutoient avec tú parce qu’ils participent au même atelier sur un pied d’égalité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'En espagnol, on omet les pronoms sujets lorsque la terminaison du verbe indique déjà la personne : vivo signifie « j’habite ».'
    language_code: fr
    direction: ltr
