schema_version: '1.0'
pack_key: practice.fr-es.a1.unit71
source_language: fr
target_language: es
unit_content_key: es.a1.unit71.wasserette
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cesto
    - w_grados
    - w_lavado
    - w_lavandería
    - w_monedas
    - w_programa
    - w_recoger
    - w_recojo
    - w_secadora
    - w_sesenta
templates:
- content_key: practice.fr-es.es.a1.unit71.lesson01.choose.001
  lesson_content_key: es.a1.unit71.lesson01.quiero_lavar_mi_ropa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_lavandería
        - w_programa
        - w_lavado
        - w_recoger
        - w_recojo
        - w_sesenta
        - w_grados
        - w_secadora
        - w_monedas
        - w_cesto
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur le fait de vouloir laver ses vêtements.'
    language_code: fr
    direction: ltr
