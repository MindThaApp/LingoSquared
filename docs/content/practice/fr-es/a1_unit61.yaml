  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_carta
    - w_compra
    - w_correos
    - w_desea
    - w_dirección
    - w_empleado
    - w_escribe
    - w_escribir
    - w_llegas
    - w_paquete
    - w_sello
    - w_tarda
    - w_tardar
templates:
- content_key: practice.fr-es.es.a1.unit61.lesson01.choose.001
  lesson_content_key: es.a1.unit61.lesson01.la_carta_y_el
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_carta
        - w_paquete
        - w_sello
        - w_dirección
        - w_escribir
        - w_llegas
        - w_tardar
        - w_tarda
        - w_empleado
        - w_desea
        - w_compra
        - w_correos
        - w_escribe
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la lettre et le colis.'
    language_code: fr
    direction: ltr
