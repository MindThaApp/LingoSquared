templates:
- content_key: practice.fr-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les mots de la famille vont souvent par paire selon le genre : hermano et hermana, hijo et hija.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le masculin pluriel désigne aussi les groupes mixtes : padres signifie « parents » et hermanos peut signifier « frères et sœurs ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson01.translate.003
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mamá et papá sont les mots courants employés en famille ; madre et padre sont neutres.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson02.order.001
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Familia est féminin : on dit donc pequeña pour « petite » ; grande reste identique aux deux genres.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson02.translate.002
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: translation
  frame:
    text: J’ai deux sœurs.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Pour poser la question « As-tu des frères et sœurs ? », on dit ¿Tienes hermanos? Le masculin pluriel désigne ici aussi bien les frères que les sœurs.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson03.choose.001
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Primo désigne un cousin et prima une cousine ; primos désigne un groupe mixte.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson03.match.002
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Au pluriel, abuelo et abuela donnent abuelos, qui signifie « grands-parents ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson03.order.003
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Vivo con mis {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mis est le pluriel de mi : mi abuelo, mis abuelos.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson04.translate.001
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: Je vis avec {item}.
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Vivo signifie déjà « je vis » : yo n’est donc pas nécessaire.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson04.fill.002
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Somos cinco en {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Somos cinco signifie littéralement « nous sommes cinq », c’est-à-dire « nous sommes cinq personnes ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson04.order.003
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: ¿Vives cerca de tus {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Vives cerca de tus {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cerca de signifie « près de » ; tus est le pluriel de tu, « ton » ou « ta ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson05.fill.001
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Mi hermana {item} se llama Sofía. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Menor se place après le nom et ne change pas selon le genre : mi hermano menor, mi hermana menor.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson05.choose.002
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vive signifie « il vit » ou « elle vit » ; viven signifie « ils vivent » ou « elles vivent ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson06.listen.001
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Qué bonito! est une réaction chaleureuse devant une photo : « Comme c’est joli ! »'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson06.translate.002
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: Nous nous parlons au téléphone toutes les semaines.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hablamos por teléfono cada {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'En espagnol, on dit littéralement « par téléphone », por teléfono, et cada reste toujours invariable : cada día, cada semana.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson06.match.003
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Somos et son sont deux formes du verbe ser : « nous sommes » et « ils sont ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit03.lesson06.translate.004
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'En espagnol, la terminaison du verbe indique la personne : vivo, vives, vive, viven.'
    language_code: fr
    direction: ltr
