- content_key: practice.fr-es.es.a1.unit75.lesson04.order.002
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: word_order
  frame:
    text: Muy bien, ¿y quiere también una {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_guía
  answer_derivation:
    kind: render_frame
    frame:
      text: Muy bien, ¿y quiere también una {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Très bien, et souhaitez-vous aussi un guide ? guía signifie guide.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson04.fill.003
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: fill_in_blank
  frame:
    text: No, gracias, no hace {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_falta
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_falta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Non merci, ce n’est pas nécessaire. falta signifie manque.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson05.order.002
