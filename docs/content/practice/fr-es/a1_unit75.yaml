schema_version: '1.0'
pack_key: practice.fr-es.a1.unit75
source_language: fr
target_language: es
unit_content_key: es.a1.unit75.museum
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cerrar
    - w_concierto
    - w_cuadro
    - w_cuadros
    - w_exposición
    - w_falta
    - w_guía
    - w_visitar
    - w_visito
templates:
- content_key: practice.fr-es.es.a1.unit75.lesson01.choose.001
  lesson_content_key: es.a1.unit75.lesson01.quiero_ir_al_museo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_visitar
        - w_exposición
        - w_visito
        - w_cerrar
        - w_guía
        - w_falta
        - w_cuadro
        - w_cuadros
        - w_concierto
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon « Je veux aller au musée ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson02.listen.001
  lesson_content_key: es.a1.unit75.lesson02.quiero_comprar_una_entrada
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon sur l’achat d’un billet.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson03.translate.001
  lesson_content_key: es.a1.unit75.lesson03.a_que_hora_cierra
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon « À quelle heure ferme le musée ? ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson04.match.001
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot en espagnol à sa signification en français ; ces mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson05.choose.001
  lesson_content_key: es.a1.unit75.lesson05.leer_el_panel_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la lecture du panneau d’information.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson06.translate.001
  lesson_content_key: es.a1.unit75.lesson06.mateo_nina_y_elena
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur Mateo, Nina et Elena au musée.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson01.order.002
  lesson_content_key: es.a1.unit75.lesson01.quiero_ir_al_museo
  type: word_order
  frame:
    text: Quiero {item} el museo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_visitar
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} el museo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Je veux visiter le musée. visitar signifie visiter.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit75.lesson02.order.002
  lesson_content_key: es.a1.unit75.lesson02.quiero_comprar_una_entrada
  type: word_order
  frame:
    text: Visito la {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_exposición
  answer_derivation:
    kind: render_frame
    frame:
      text: Visito la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Je visite l’exposition. exposición signifie exposition.
    language_code: fr
