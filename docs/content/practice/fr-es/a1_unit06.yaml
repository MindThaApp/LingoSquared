    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Une autre façon courante de commander consiste à employer para mí suivi du plat : para mí, un café.'
    language_code: fr
    direction: ltr
