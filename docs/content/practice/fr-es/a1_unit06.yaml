    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un accompagne les noms masculins (un café) ; les noms féminins prennent una (una ensalada).
    language_code: fr
    direction: ltr
