schema_version: '1.0'
pack_key: practice.fr-es.a1.unit04
source_language: fr
target_language: es
unit_content_key: es.a1.unit04.dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u04
    - es_a1_u04_l01
    - es_a1_u04_l02
    - w_enero
    - w_febrero
    - w_marzo
    - w_abril
    - w_mayo
    - w_junio
    - w_julio
    - w_agosto
    - w_septiembre
    - w_octubre
    - w_noviembre
    - w_diciembre
    - w_fecha
    - w_veintidós
    - w_veintinueve
    - w_tuyo
slot_presets:
  weekday: &id001
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u04_l01
  month: &id002
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_enero
      - w_febrero
      - w_marzo
      - w_abril
      - w_mayo
      - w_junio
      - w_julio
      - w_agosto
      - w_septiembre
      - w_octubre
      - w_noviembre
      - w_diciembre
  month_words: &id003
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u04_l02
  content: &id006
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adverb
    - phrase
    - adjective
    agreement_tags:
      semantic: es_a1_u04
  words: &id008
    language_code: es
    part_of_speech:
    - noun
    - adverb
    - phrase
    agreement_tags:
      semantic: es_a1_u04
  fecha: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_fecha
  veintidos: &id005
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_veintidós
  veintinueve: &id007
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_veintinueve
  tuyo: &id009
    language_code: es
    part_of_speech: pronoun
    agreement_tags:
      semantic: w_tuyo
templates:
- content_key: practice.fr-es.es.a1.unit04.lesson01.choose.001
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En espagnol, les jours de la semaine s’écrivent avec une minuscule et sont masculins : el lunes, los martes.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson01.listen.002
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De lunes à viernes, les jours se terminent par -s et gardent la même forme au pluriel ; sábado et domingo prennent un -s : los sábados.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson01.order.003
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: word_order
  frame:
    text: Hoy es {day}.
    language_code: es
    direction: ltr
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Après hoy es, le jour s’emploie sans article ; pour dire « le mardi » au sens de « tous les mardis », on emploie los : los martes.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson01.translate.004
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: translation
  frame:
    text: Aujourd’hui, c’est {day}.
    language_code: fr
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'N’oublie pas la minuscule : hoy es lunes, jamais Lunes.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson02.match.001
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En espagnol, les mois s’écrivent eux aussi avec une minuscule : enero, julio, diciembre.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson02.translate.002
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De nombreux noms de mois ressemblent au français : marzo, abril, septiembre, octubre.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson02.order.003
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: word_order
  frame:
    text: Mi cumpleaños es en {month}.
    language_code: es
    direction: ltr
  slots:
    month: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi cumpleaños es en {month}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Emploie en avec un mois (en marzo), mais el avec une date complète (el diez de marzo).
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson03.fill.001
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: fill_in_blank
  frame:
    text: ¿Qué {item} es hoy? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'En espagnol, une date se construit ainsi : jour, de, mois, comme dans el veintidós de julio.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson03.translate.002
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: translation
  frame:
    text: Aujourd’hui, nous sommes le vingt-deux juillet.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es el {item} de julio.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Comme en français, l’espagnol emploie les nombres cardinaux dans les dates : el veintidós, le vingt-deux.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson05.choose.001
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hay signifie aussi bien « il y a » au singulier qu’au pluriel : hay una clase, hay dos clases.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson05.fill.002
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: fill_in_blank
  frame:
    text: Después hay una clase el {item} de julio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les nombres de vingt et un à vingt-neuf s’écrivent en un seul mot : veintiuno, veintidós, veintinueve.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson06.listen.001
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Por cierto, « au fait », est une expression pratique pour changer de sujet.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson06.translate.002
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cumpleaños s’écrit en un seul mot et garde la même forme au singulier et au pluriel : el cumpleaños, los cumpleaños.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson06.translate.003
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: Et le tien ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Y el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: El tuyo remplace tu cumpleaños, qui est masculin ; pour un nom féminin, on emploie la tuya.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit04.lesson06.match.004
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ¿Cuándo es...? sert à demander quand quelque chose a lieu ; la réponse commence par es el + une date ou es en + un mois.
    language_code: fr
    direction: ltr
