      part_of_speech: noun
      agreement_tags:
        semantic: w_taquilla
  answer_derivation:
    kind: render_frame
    frame:
      text: En la {item} se suele usar la forma de cortesía usted.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Au guichet, on emploie généralement la forme de politesse usted. On s’adresse aux personnes que l’on ne connaît pas dans un contexte de service avec usted, et non tú.
    language_code: fr
    direction: ltr
