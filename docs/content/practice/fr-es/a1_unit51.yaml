  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Voulez-vous un aller simple ou un aller-retour ? Quiere est la forme de querer correspondant au vouvoiement avec usted, employée ici pour s’adresser à un membre du personnel de la gare que l’on ne connaît pas.
    language_code: fr
    direction: ltr
