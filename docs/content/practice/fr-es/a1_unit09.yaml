templates:
- content_key: practice.fr-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Traverse la rue. Cruza est l’impératif à la deuxième personne du singulier de cruzar.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En la esquina signifie au coin de la rue ; l’espagnol emploie en là où le français emploie à.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Doblar et girar signifient tous deux tourner ; dobla et gira sont leurs formes impératives à la deuxième personne du singulier.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: A la izquierda signifie à gauche et a la derecha, à droite ; derecho employé seul signifie tout droit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: Va tout droit. (ordre informel)
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigue vient de seguir, continuer d’avancer ; derecho signifie tout droit et non derecha, à droite.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Comment aller à la bibliothèque ? Devant un lieu masculin, a + el devient al : ¿Cómo llego al parque?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fácil a la même forme avec les noms masculins et féminins.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: Ne te perds pas !
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'L’impératif négatif emploie une autre forme verbale : pierdas, et non pierdes.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En espagnol, on indique généralement le chemin à l’impératif avec tú : sigue, dobla, cruza.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desde el mercado signifie « depuis le marché », le point de départ de l’itinéraire.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mateo répète l’itinéraire à la première personne avec sigo et doblo pour vérifier qu’il a bien compris.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: De rien.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De nada signifie littéralement « de rien » ; c’est la réponse habituelle à gracias.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Derecha (à droite) et derecho (tout droit) ne diffèrent que par leur dernière voyelle : écoute-la bien.'
    language_code: fr
    direction: ltr
