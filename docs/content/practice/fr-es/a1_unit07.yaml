templates:
- content_key: practice.fr-es.es.a1.unit07.lesson01.choose.001
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les adjectifs s’accordent avec le nom : la fruta fresca, los tomates frescos.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson01.listen.002
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Verdura désigne un seul légume ; au marché, on demande généralement des verduras.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson02.order.001
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: word_order
  frame:
    text: ¿Cuánto {item} el kilo de tomates?
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} el kilo de tomates?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Combien coûte le kilo de tomates ? Cuesta s’emploie avec une seule chose, cuestan avec plusieurs.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson02.translate.002
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: translation
  frame:
    text: Combien coûtent les œufs ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} los huevos?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Huevos est au pluriel, le verbe est donc cuestan ; avec le pain, ce serait cuesta.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson03.order.001
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: word_order
  frame:
    text: Una {item} de huevos, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} de huevos, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Une douzaine d’œufs, s’il vous plaît. Les quantités sont suivies de de avant l’aliment : un kilo de tomates.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson03.match.002
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Medio kilo signifie un demi-kilo ; medio n’est pas précédé de un.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson03.translate.003
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Les mots qui se terminent par -o sont généralement masculins (el mercado), et ceux en -a féminins (la fruta).
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson04.fill.001
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: fill_in_blank
  frame:
    text: ¿{item} algo más? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les vendeurs des marchés emploient les formes de usted avec les clients : ¿Necesita algo más?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson04.translate.002
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: translation
  frame:
    text: Nous avons déjà tout.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ya tenemos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ya, « déjà », se place normalement avant le verbe en espagnol.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson05.choose.001
  lesson_content_key: es.a1.unit07.lesson05.leer_las_etiquetas_de_precio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Todos los días signifie « tous les jours », littéralement « tous les jours ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson06.order.001
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: word_order
  frame:
    text: Necesitamos {item} para la próxima clase.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesitamos {item} para la próxima clase.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Nous avons besoin d’ingrédients pour le prochain cours. Necesitamos est la forme de necesitar avec « nous ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson06.translate.002
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¡Qué tomates tan frescos! est la manière de dire « quelles tomates bien fraîches ! » en espagnol.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit07.lesson06.listen.003
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vamos peut signifier « allons-y » ou « nous allons » ; le contexte permet de les distinguer.
    language_code: fr
    direction: ltr
