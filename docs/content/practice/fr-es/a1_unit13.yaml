templates:
- content_key: practice.fr-es.es.a1.unit13.lesson01.choose.001
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trabajo peut être le nom « travail » ou la forme verbale « je travaille ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson01.listen.002
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Escritorio désigne un bureau comme meuble ; un bureau comme lieu de travail se dit una oficina.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson02.translate.001
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: translation
  frame:
    text: Je suis comptable. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'En espagnol, on omet l’article devant un métier après ser : soy contador, et non soy un contador ; une femme dit soy contadora.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson02.order.002
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: word_order
  frame:
    text: Yo soy {item}. Enseño en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Yo soy {item}. Enseño en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Je suis professeure. J’enseigne dans une école. Un professeur se dit un profesor.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson03.fill.001
  lesson_content_key: es.a1.unit13.lesson03.en_que_trabajas
  type: fill_in_blank
  frame:
    text: ¿En qué {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿En qué trabajas? signifie littéralement « dans quoi travailles-tu ? », autrement dit « quel métier exerces-tu ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson04.translate.001
  lesson_content_key: es.a1.unit13.lesson04.prefiero_cocinar
  type: translation
  frame:
    text: Nous préférons tous les deux ceci.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Los dos preferimos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ici, Los dos signifie « tous les deux » ; esto renvoie à une idée ou à une chose sans la nommer.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson05.order.001
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Mateo {item} en una oficina en Londres.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} en una oficina en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mateo travaille dans un bureau à Londres. Trabajar en + lieu indique où quelqu’un travaille.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson05.order.002
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Elena {item} en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Elena enseigne dans une école. Enseñar signifie « enseigner » ; aprender signifie « apprendre ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson05.match.003
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'A los dos les gusta su trabajo : les indique à qui le travail plaît, c’est-à-dire à eux.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson06.translate.001
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Certains mots liés au travail ressemblent au français : estudiantes, interesante.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson06.fill.002
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: fill_in_blank
  frame:
    text: Prefiero cocinar {item} los martes. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con + ti ne forme qu’un seul mot, contigo ; « avec moi » se dit conmigo.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit13.lesson06.choose.003
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferir transforme e en ie à la plupart des personnes (prefiero, prefieren), mais pas dans preferimos.
    language_code: fr
    direction: ltr
