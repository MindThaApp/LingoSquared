- content_key: practice.fr-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame:
    text: Tengo que {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_llamarte
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo que {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Je dois t’appeler. llamarte signifie appeler quelqu’un que l’on tutoie.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame:
    text: ¿Con quién {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hablo
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Con quién {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Avec qui suis-je en ligne ? ¿Con quién hablo? est la formule habituelle lorsqu’on ne sait pas qui appelle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ne parle pas si vite, s’il te plaît. No hables est l’impératif négatif informel de hablar ; tan rápido (si vite) indique le degré.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je ne t’entends pas bien. Oír (entendre), dans la structure no ... bien (ne pas bien), indique un problème d’audition, contrairement à entender (comprendre) ; te oigo signifie « je t’entends ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Le message vient d’Elena. mensaje signifie message, notamment un message écrit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Je t’enverrai un message. Enviar (envoyer) vient après le pronom te (à toi) : te envío un mensaje.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Comment s’est passé ton premier service ? Ha ido est le passé composé de ir (ici, « se passer ») : ha + le participe passé ido.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cela s’est très bien passé, mieux que je ne le pensais. Ha ido muy bien reprend le passé composé de la question ; mejor de lo esperado (mieux que prévu) emploie de lo pour introduire la comparaison.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: Merci, cela compte beaucoup pour moi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Merci, cela compte beaucoup pour moi. Significa est la troisième personne de significar (signifier) ; para mí (pour moi) indique pour qui cela compte.
    language_code: fr
    direction: ltr
