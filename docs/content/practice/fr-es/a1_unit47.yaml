    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit47.lesson06.translate.001
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: '{item}'
    language_code: fr
