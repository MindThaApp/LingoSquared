schema_version: '1.0'
pack_key: practice.fr-es.a1.unit55
source_language: fr
target_language: es
unit_content_key: es.a1.unit55.vervoer
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_andando
    - w_bici
    - w_camina
    - w_caminar
    - w_centro
    - w_coche
    - w_compro
    - w_conduce
    - w_conducir
    - w_estación
    - w_normalmente
    - w_prefiere
    - w_transporte
    - w_vas
    - w_viaja
    - w_viajar
    - w_viajas
    - w_viajo
templates:
- content_key: practice.fr-es.es.a1.unit55.lesson01.choose.001
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bici
        - w_viaja
        - w_coche
        - w_caminar
        - w_conduce
        - w_camina
        - w_viajar
        - w_viajas
        - w_viajo
        - w_transporte
        - w_estación
        - w_compro
        - w_centro
        - w_vas
        - w_normalmente
        - w_prefiere
        - w_conducir
        - w_andando
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon sur le train, le vélo, la voiture et la marche.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit55.lesson02.listen.001
  lesson_content_key: es.a1.unit55.lesson02.cada_persona_viaja_de
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon où chacun se déplace différemment.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit55.lesson03.translate.001
  lesson_content_key: es.a1.unit55.lesson03.comprar_un_billete
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon sur l’achat d’un billet.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit55.lesson04.match.001
  lesson_content_key: es.a1.unit55.lesson04.lucia_le_pregunta_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot en espagnol à sa signification en français ; ces mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-es.es.a1.unit55.lesson05.choose.001
