    slot: item
  feedback_frame:
    text: 'Taza اسم مؤنث، لذا نصف كوب هو media taza؛ ومع اسم مذكر تصبح medio: medio kilo.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson06.listen.001
