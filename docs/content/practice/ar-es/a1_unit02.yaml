    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مع usted يصبح السؤال ¿Cuántos años tiene usted?
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
