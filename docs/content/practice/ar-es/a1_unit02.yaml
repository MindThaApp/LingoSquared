  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cien تعني مئة بالضبط؛ وما زاد عليها تقول فيه الإسبانية ciento: ciento uno.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعبّر الإسبانية عن العمر بالفعل tener، أي «يملك»: فأنت «تملك» سنوات بدلًا من أن «تكون» هي.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: عمري {age} سنة.
    language_code: ar
    direction: rtl
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'لا تستخدم soy للتعبير عن العمر: Tengo veinte años، وليس Soy veinte.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
