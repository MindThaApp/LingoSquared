    slot: item
  feedback_frame:
    text: 'غالبًا ما تُقرأ أرقام الهاتف في الإسبانية مثنى مثنى: 62 41 ... تُقرأ sesenta y dos, cuarenta y uno.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
