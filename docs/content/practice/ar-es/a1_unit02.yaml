    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'للأعداد من أحد عشر إلى خمسة عشر كلمات خاصة بها (once, doce, trece, catorce, quince)؛ ومن ستة عشر فما فوق تُبنى انطلاقًا من diez: dieciséis.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
