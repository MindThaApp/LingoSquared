templates:
- content_key: practice.ar-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يُختصر Uno إلى un قبل الاسم المذكر (un huevo)، ويصبح una قبل الاسم المؤنث (una taza).
    language_code: ar
    direction: rtl
