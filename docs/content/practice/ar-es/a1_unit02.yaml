    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Seis من مقطع واحد، أما siete فمن مقطعين (sie-te)؛ أنصت إلى حرف t.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
