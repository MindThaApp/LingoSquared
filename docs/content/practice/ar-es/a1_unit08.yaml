- content_key: practice.ar-es.es.a1.unit08.lesson01.choose.001
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Biblioteca تعني مكتبة للاستعارة والقراءة؛ أما مكتبة بيع الكتب فهي librería، وهي من الأصدقاء الكاذبين الشائعين.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson01.listen.002
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تعني Banco أيضًا مقعدًا؛ وفي هذه الوحدة هي البنك في الشارع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson01.order.003
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: word_order
  frame:
    text: La {item} está cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} está cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'نستعمل estar للسؤال عن مكان الشيء: la farmacia está cerca.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson01.translate.004
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: translation
  frame:
    text: '{item} بجانب السوق.'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está al lado del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تندمج de + el في del: al lado del mercado، أي بجانب السوق.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson02.fill.001
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: fill_in_blank
  frame:
    text: La farmacia está {item} del mercado. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تحتاج Enfrente de وal lado de وlejos de وcerca de جميعها إلى de قبل المكان.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson02.order.002
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: word_order
  frame:
    text: El parque está {item} del mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El parque está {item} del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: الحديقة بعيدة عن السوق. وعكسها cerca de أي قريب من.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson02.translate.003
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: translation
  frame:
    text: المكتبة بين البنك والحديقة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La biblioteca está {item} el banco y el parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: تأتي Entre مع مكانين يربط بينهما y، ولا تلحقها de.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson04.fill.001
  lesson_content_key: es.a1.unit08.lesson04.preguntar_si_esta_lejos
  type: fill_in_blank
  frame:
    text: Sí, está {item} lejos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تعني Bastante إلى حد كبير: bastante lejos أي بعيد إلى حد كبير، وbastante cerca أي قريب إلى حد كبير.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit08.lesson05.match.001
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
