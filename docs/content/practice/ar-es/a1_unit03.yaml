templates:
- content_key: practice.ar-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'غالبًا ما تأتي كلمات العائلة في أزواج بحسب الجنس: hermano وhermana، hijo وhija.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يشمل جمع المذكر المجموعات المختلطة: padres تعني الوالدين، وhermanos قد تعني الإخوة والأخوات.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson01.translate.003
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمتا mamá وpapá هما المستخدمتان يوميًا في البيت، أما madre وpadre فمحايدتان.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson02.order.001
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: كلمة familia مؤنثة، لذلك تصبح «صغيرة» pequeña، أما grande فلا تتغير مع الجنسين.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson02.translate.002
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: translation
  frame:
    text: لدي أختان.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'للسؤال: ¿Tienes hermanos? تستعمل جمع المذكر الذي يشمل الإخوة والأخوات.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson03.choose.001
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Primo هو ابن العم أو الخال وprima هي ابنة العم أو الخال، وprimos تشمل مجموعة مختلطة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson03.match.002
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: من abuelo وabuela يتكوّن الجمع abuelos، أي الجدّان.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson03.order.003
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Vivo con mis {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mis هي جمع mi: mi abuelo، mis abuelos.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson04.translate.001
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: أعيش مع {item}.
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: كلمة Vivo تعني بالفعل «أعيش»، لذلك لا حاجة إلى yo.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson04.fill.002
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Somos cinco en {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'عبارة Somos cinco تقول حرفيًا «نحن خمسة»: أي أننا خمسة أشخاص.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson04.order.003
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: ¿Vives cerca de tus {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Vives cerca de tus {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cerca de تعني «قرب»، وtus هي جمع tu أي «لك/ـك».
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson05.fill.001
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Mi hermana {item} se llama Sofía. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تأتي menor بعد الاسم ولا تتغير بحسب الجنس: mi hermano menor، mi hermana menor.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson05.choose.002
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vive تعني «يعيش» أو «تعيش»، وviven تعني «يعيشون».
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit03.lesson06.listen.001
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Qué bonito! ردّ فعل ودود على صورة: ما أجمل هذا!'
    language_code: ar
    direction: rtl
