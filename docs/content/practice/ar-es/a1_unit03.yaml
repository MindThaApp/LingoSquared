    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'كل من Somos وson يأتي من ser: نحن، هم.'
    language_code: ar
    direction: rtl
