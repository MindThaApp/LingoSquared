templates:
- content_key: practice.ar-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: الشقة الجديدة أكبر من القديمة. النمط Más + صفة + que يقارن بين شيئين.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تقارن الإسبانية بـ más ... que (أكثر من) وmenos ... que (أقل من) وtan ... como (بقدر ... مثل).
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: نحن فريق جيد.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تتحول Bueno إلى buen قبل الاسم المذكر المفرد: un buen equipo.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تعني Tan bien como «بالجودة نفسها التي»: cocinas tan bien como yo.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تعني Más قبل الاسم كمية أكبر منه: más espacio، أي مساحة أكبر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: تعني Mudarse الانتقال إلى مسكن آخر؛ ويقول Mateo عبارة quiero mudarme لأنه هو من سينتقل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: القديمة أصغر. لهذا أريد الانتقال. تعني Por eso «لهذا السبب».
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Viejo «قديم» للأشياء و«مسنّ» للأشخاص؛ وnuevo عكسها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يقارن النمط Tan + ظرف + como بين شخصين يفعلان الشيء نفسه بالجودة نفسها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: هذا منطقي جدًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تقول الإسبانية حرفيًا إن للأمر معنًى كثيرًا: tiene mucho sentido.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Exacto! طريقة سريعة للموافقة، أي: تمامًا.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Espacio مساحة أو مكانًا؛ más espacio para cocinar أي مساحة أكبر للطهي.
    language_code: ar
    direction: rtl
