  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: طابق كل كلمة إسبانية بمعناها بالعربية؛ الكلمات مأخوذة من دروس هذه الوحدة.
    language_code: ar
    direction: rtl
