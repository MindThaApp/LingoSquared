templates:
- content_key: practice.ar-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في الإسبانية كلمتان للمخاطب: tú مع الأصدقاء والعائلة، وusted مع الغرباء ولإظهار الاحترام.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تأتي Está مع usted؛ أما مع tú فيصبح الفعل estás: ¿Cómo estás?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كثيرًا ما تحمل كلمات التحية والحديث القصير علامات إملائية (cómo, adiós, también)؛ وتدل العلامة على المقطع المنبور.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تُستخدم Buenos días حتى وقت الغداء (نحو الساعة 2 ظهرًا في إسبانيا)، وbuenas tardes بعد الظهر، وbuenas noches في المساء وفي الليل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: كلمة Día مذكّرة (buenos días)، بينما tarde وnoche مؤنثتان (buenas tardes, buenas noches).
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعني Hasta luego حرفيًا: إلى وقت لاحق؛ وهي عبارة «أراك لاحقًا» اليومية.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعني Me llamo حرفيًا: أسمّي نفسي؛ وهي الطريقة اليومية لذكر اسمك.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: هذا {name}. (تقديم رجل)
    language_code: ar
    direction: rtl
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'استخدم este لتقديم رجل وesta لتقديم امرأة: Esta es Ana.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تُستخدم Esta لتقديم امرأة؛ أما للرجل فتقول este: Este es Carlos.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تعني Mucho gusto: تشرفت بمعرفتك؛ والردّ المعتاد igualmente، أي وأنا كذلك.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + مكان تبيّن من أين أنت؛ وvivir en + مكان تبيّن أين تسكن الآن.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: أنا من {place}.
    language_code: ar
    direction: rtl
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'لطرح السؤال نفسه: ¿De dónde eres? (غير رسمي) أو ¿De dónde es usted? (رسمي).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تصف Estoy + -ando/-iendo شيئًا يجري الآن، مثل: ما زلت أتعلّم.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعني Vez «مرة» بمعنى مناسبة: primera vez أي المرة الأولى؛ otra vez أي مرة أخرى.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: هل تحب الطبخ؟ (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعبّر الإسبانية عمّا تحبه بالفعل gustar: النشاط هو الذي يعجبك، ولذلك نقول te gusta + فعل في صيغة المصدر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تستخدم إيلينا وماتيو tú فيما بينهما لأنهما زميلان في الورشة نفسها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تحذف الإسبانية ضمائر الفاعل حين تدل نهاية الفعل على الشخص: تعني vivo أنني أسكن.'
    language_code: ar
    direction: rtl
