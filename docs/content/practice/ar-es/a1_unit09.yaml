templates:
- content_key: practice.ar-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: اعبر الشارع. Cruza هي صيغة الأمر للمخاطب (tú) من الفعل cruzar.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني En la esquina «عند الناصية»؛ وتستخدم الإسبانية حرف en في هذا الموضع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يعني الفعلان Doblar وgirar «انعطف»؛ وdobla وgira صيغتا الأمر للمخاطب (tú) منهما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: تعني A la izquierda «إلى اليسار» وa la derecha «إلى اليمين»؛ أما derecho وحدها فتعني «مباشرة إلى الأمام».
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: سر مباشرة إلى الأمام. (أمر غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigue من الفعل seguir أي «واصل السير»؛ وderecho بمعنى «مباشرة إلى الأمام» ليست derecha بمعنى «يمين».
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'كيف أصل إلى المكتبة؟ مع مكان مذكر يصبح a + el هو al: ¿Cómo llego al parque?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لكلمة Fácil الصيغة نفسها مع الأسماء المذكرة والمؤنثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: لا تضِع! (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'يستخدم الأمر المنفي صيغة فعل مختلفة: pierdas وليس pierdes.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تُعطى الاتجاهات بالإسبانية عادةً بصيغة الأمر للمخاطب (tú): sigue وdobla وcruza.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Desde el mercado «من السوق»، أي نقطة بداية الطريق.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يكرر ماتيو الطريق بصيغة المتكلم (yo)، sigo وdoblo، ليتأكد أنه فهمه جيدًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: عفوًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: تعني De nada حرفيًا «من لا شيء»؛ وهي الرد المعتاد على gracias.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تختلف Derecha (يمين) وderecho (مباشرة إلى الأمام) في الحرف المتحرك الأخير فقط؛ فأصغِ إليه جيدًا.
    language_code: ar
    direction: rtl
