  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cartelera
    - w_comprar
    - w_infantil
    - w_museo
    - w_palomitas
    - w_película
    - w_sesión
templates:
- content_key: practice.ar-es.es.a1.unit74.lesson01.choose.001
  lesson_content_key: es.a1.unit74.lesson01.quiero_ver_una_pelicula
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_película
        - w_comprar
        - w_sesión
        - w_cartelera
        - w_palomitas
        - w_infantil
        - w_museo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس «أريد مشاهدة فيلم».'
    language_code: ar
    direction: rtl
