    text: '{item} من كلمات هذه الوحدة، من درس اقتراح نشاط.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit50.lesson01.order.003
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: word_order
  frame:
    text: ¿Tienes ganas de ir al {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cine
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tienes ganas de ir al {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: هل ترغب في الذهاب إلى فيلم؟ تسأل ¿Tienes ganas de ...? بشكل غير رسمي إن كان أحدهم يرغب في فعل شيء؛ ويأتي بعد de فعل في المصدر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit50.lesson02.order.002
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: word_order
  frame:
    text: Es un buen {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_plan
  answer_derivation:
    kind: render_frame
    frame:
      text: Es un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: هذه خطة جيدة. وهذا ردّ إيجابي أكثر اكتمالاً.
    language_code: ar
    direction: rtl
