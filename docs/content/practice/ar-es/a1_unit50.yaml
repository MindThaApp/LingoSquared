    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viene
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, el viernes a las dos y media me {item} bien.
      language_code: es
      direction: ltr
  feedback_frame:
    text: نعم، يوم الجمعة في الثانية والنصف مناسب. تؤكد me viene bien ("يناسبني") أن الوقت المقترح مناسب.
    language_code: ar
    direction: rtl
