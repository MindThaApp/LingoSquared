templates:
- content_key: practice.ar-es.es.a1.unit05.lesson01.order.001
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: word_order
  frame:
    text: ¿Qué {item} es?
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Qué {item} es?
      language_code: es
      direction: ltr
  feedback_frame:
    text: كم الساعة؟ أجب بـ son las + الساعة (son las dos)، لكن للساعة الواحدة نقول es la una.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson01.choose.002
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'الساعات مؤنثة لأنها تشير إلى horas: las dos, las cuatro.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson02.order.001
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: word_order
  frame:
    text: Son las cuatro y {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cuatro y {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'الساعة الرابعة والربع. أما النصف فيُقال y media: son las cuatro y media.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson02.translate.002
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: translation
  frame:
    text: الساعة الخامسة إلا ربعًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cinco {item} cuarto.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعدّ الإسبانية انطلاقًا من الساعة التالية: خمسة ناقص ربع.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson03.order.001
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: word_order
  frame:
    text: Son las ocho de la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las ocho de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: تؤدي de la mañana وde la tarde وde la noche وظيفة «صباحًا» و«مساءً».
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson03.translate.002
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: translation
  frame:
    text: تبدأ الورشة في الرابعة بعد الظهر.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: El taller empieza a las cuatro de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'للدلالة على وقت معيّن نستخدم a las + الساعة: a las cuatro؛ وللساعة الواحدة نقول a la una.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson03.match.003
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: تعني Mañana الصباح (la mañana) وتعني أيضًا غدًا؛ وعادةً يميّز أداة التعريف بينهما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson04.fill.001
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: fill_in_blank
  frame:
    text: De {item}, a las tres y media. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De acuerdo هي العبارة المعتادة للموافقة على خطة: حسنًا، اتفقنا.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson04.translate.002
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تعني Antes de «قبل»: antes del taller، أي قبل الورشة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson05.listen.001
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Almorzar تعني تناول الغداء؛ وعادةً يتناول الإسبان الغداء بين الثانية والثالثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson05.fill.002
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: fill_in_blank
  frame:
    text: Al día {item}, Elena y Mateo almuerzan juntos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Al día siguiente «في اليوم التالي»؛ وتأتي siguiente بعد الاسم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson06.order.001
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: word_order
  frame:
    text: ¡Buena {item}! Comemos mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buena {item}! Comemos mañana.
      language_code: es
      direction: ltr
  feedback_frame:
    text: فكرة جيدة! سنتغدى غدًا. كلمة idea مؤنثة، لذلك نقول buena.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson06.translate.002
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: translation
  frame:
    text: يوجد مطعم قريب من هنا.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay un {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تُستخدم Hay لتقديم شيء جديد: hay un restaurante. أما للمكان المعروف فنستخدم está: el restaurante está cerca.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit05.lesson06.choose.003
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¿Tienes hambre؟ في الإسبانية نقول «لديك جوع» بدل «أنت جائع».
    language_code: ar
    direction: rtl
