templates:
- content_key: practice.ar-es.es.a1.unit12.lesson01.choose.001
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تنتهي الصفات التي تصف المشاعر بـ -o للمذكر وبـ -a للمؤنث: nervioso، nerviosa.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson01.listen.002
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يدلّك حرف العلة الأخير على أن المتكلم رجل (-o) أو امرأة (-a).
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson01.match.003
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: تعني contento «سعيد» أو «راضٍ» عن شيء ما، وتُستخدم مع estar.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson01.order.004
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Mateo está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Mateo está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تُستخدم estar مع المشاعر لأنها قابلة للتغير: Mateo está nervioso hoy.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson01.order.005
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Elena está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Elena está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'إيلينا امرأة، لذا تنتهي الصفة بـ -a: Elena está cansada.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson03.order.001
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: word_order
  frame:
    text: Me {item} un poco nervioso.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Me {item} un poco nervioso.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'أشعر ببعض التوتر. يأخذ الفعل sentirse الضمائر me وte وse: me siento، te sientes.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson03.translate.002
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: translation
  frame:
    text: كيف تشعر؟ (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo te {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: مع usted يصبح السؤال ¿Cómo se siente?
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson04.fill.001
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: fill_in_blank
  frame:
    text: No te {item}, podemos empezar de nuevo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No te preocupes هي العبارة الثابتة لقول «لا تقلق» لصديق.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson04.translate.002
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: translation
  frame:
    text: شيء ما يحترق!
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Algo se {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تستخدم الإسبانية المضارع البسيط لما يحدث الآن: algo se quema.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson04.order.003
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: word_order
  frame:
    text: Podemos {item} de nuevo.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Podemos {item} de nuevo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: يمكننا أن نبدأ من جديد. تعني de nuevo «مرة أخرى» مثل otra vez.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson05.choose.001
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تتحرك القراءة عبر الزمن: antes (قبل)، durante (أثناء)، al final (في النهاية)، ahora (الآن).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson05.translate.002
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'إذا ضمّت المجموعة رجلًا، أخذت الصفة -os: nerviosos، contentos.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson06.order.001
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: word_order
  frame:
    text: Lo logramos {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lo logramos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: أنجزناه معًا. تعني lograr «نجح في» أو «أنجز» شيئًا ما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson06.listen.002
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Ay, no! هي ردّ الفعل الطبيعي عندما يسير شيء على نحو خاطئ.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit12.lesson05.match.003
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'كلٌّ من estaban وestán صيغة من الفعل estar: «كانوا» و«هم الآن».'
    language_code: ar
    direction: rtl
