templates:
- content_key: practice.ar-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يستعمل الإسبانية غالبًا المفرد el pantalón (وكذلك los pantalones) للدلالة على البنطال، بينما تستعمل العربية كلمة «بنطال» بالمفرد أيضًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa وchaqueta مؤنثتان؛ أما pantalón وdelantal وzapatos فمذكّرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'الأسماء المنتهية بـ -l تضيف -es في الجمع: delantal، delantales.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: أنا ألبس المقاس المتوسط. تستعمل الإسبانية الفعل usar (يستعمل) للتعبير عن المقاس الذي تلبسه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla هي مقاس الملابس؛ أما مقاس الحذاء فيُقال له el número: ¿Qué número tienes?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: لا يناسبني.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تدلّ Quedar bien أو mal على مدى ملاءمة الملابس لك: me queda bien تعني أنها تناسبني جيدًا.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'تعبّر Ir a + المصدر عن خطة: voy a comprarlo تعني سأشتريه. يلتصق lo (الضمير الذي يعني «ه») بآخر المصدر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'الأفعال uso وusas وusan كلها من usar: أرتدي، ترتدي، يرتدون.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تصنع Más + الصفة مقارنة: más barato تعني أرخص.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: نعم، نبحث عن مآزر للورشة. الفعل Buscar يعني أصلًا «بحث عن»، لذا لا تحتاج buscamos delantales إلى كلمة إضافية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يعرض البائع المساعدة بعبارة ¿Los ayudo? أي: هل أساعدكم؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'الفعل Voy من ir أي «ذهب»؛ وهو فعل شاذ: voy, vas, va.'
    language_code: ar
    direction: rtl
