  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_paseo
        - w_árbol
        - w_hierba
        - w_pato
        - w_patos
        - w_nadan
        - w_cartel
        - w_correa
        - w_picnic
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس: هل نذهب إلى الحديقة؟'
    language_code: ar
    direction: rtl
