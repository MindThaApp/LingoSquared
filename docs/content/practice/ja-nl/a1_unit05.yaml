schema_version: '1.0'
pack_key: practice.ja-nl.a1.unit05
source_language: ja
target_language: nl
unit_content_key: nl.a1.unit05.family
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-nl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - family_member
    - family_singular
    - sibling
    - extended_only
    - extended_family_member
    - possessive_pronoun
    - possessive_flexible
    - family_profile
    - family_dialogue
    - person_name
    - place_name
    - city_name
    - country
    register:
    - informal
    - polite
slot_presets:
  family_singular: &id001
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: family_singular
  sibling: &id002
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: sibling
  extended_only: &id003
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: extended_only
  possessive_flexible: &id004
    language_code: nl
    part_of_speech: pronoun
    agreement_tags:
      semantic: possessive_flexible
  person_name: &id005
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  place_name: &id006
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: place_name
  city_name: &id007
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
templates:
- content_key: practice.ja-nl.nl.a1.unit05.lesson01.choose.001
  lesson_content_key: nl.a1.unit05.lesson01.direct_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    text_blocks:
    - text: 日本語の意味を選んでください。
      language_code: ja
      direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットで学ぶ家族の言葉です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-nl.nl.a1.unit05.lesson01.order.002
  lesson_content_key: nl.a1.unit05.lesson01.direct_family
  type: word_order
  frame:
    text: Ik heb een {item}.
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ik heb een {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: '{item}を入れると、このきょうだいについて「…がいます」と言う文が完成します。'
    language_code: ja
    direction: ltr
