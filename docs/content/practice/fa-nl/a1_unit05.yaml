schema_version: '1.0'
pack_key: practice.fa-nl.a1.unit05
source_language: fa
target_language: nl
unit_content_key: nl.a1.unit05.family
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-nl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Farsi (Iran)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - family_member
    - family_singular
    - sibling
    - extended_only
    - extended_family_member
    - possessive_pronoun
    - possessive_flexible
    - family_profile
    - family_dialogue
    - person_name
    - place_name
    - city_name
    - country
    register:
    - informal
    - polite
slot_presets:
  family_singular: &id001
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: family_singular
  sibling: &id002
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: sibling
  extended_only: &id003
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: extended_only
  possessive_flexible: &id004
    language_code: nl
    part_of_speech: pronoun
    agreement_tags:
      semantic: possessive_flexible
  person_name: &id005
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  place_name: &id006
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: place_name
  city_name: &id007
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
