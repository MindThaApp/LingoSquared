- content_key: practice.fa-nl.nl.a1.unit05.lesson01.choose.001
  lesson_content_key: nl.a1.unit05.lesson01.direct_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    text_blocks:
    - text: معنی درست را انتخاب کنید.
      language_code: fa
      direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های خانواده در این درس است.'
    language_code: fa
    direction: rtl
