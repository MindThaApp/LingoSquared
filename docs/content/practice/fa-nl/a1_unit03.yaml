    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: weekday_pure
  month: &id002
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: month
  ordinal_number: &id003
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: ordinal_number
  time_of_day:
    language_code: nl
