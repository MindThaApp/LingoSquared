    - noun
    - adverb
    agreement_tags:
      semantic: time_of_day
templates:
- content_key: practice.fa-nl.nl.a1.unit03.lesson01.match.001
  lesson_content_key: nl.a1.unit03.lesson01.weekdagen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}'
    language_code: nl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
    seventh: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  feedback_frame:
    text: هر روز هفتهٔ هلندی را با نام فارسی‌اش جفت کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-nl.nl.a1.unit03.lesson01.translate.003
  lesson_content_key: nl.a1.unit03.lesson01.weekdagen
  type: translation
  frame:
    text: امروز {item} است. (با Vandaag شروع کنید.)
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
    text_blocks:
    - text: Translate into Dutch.
      language_code: en
      direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Vandaag is het {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
