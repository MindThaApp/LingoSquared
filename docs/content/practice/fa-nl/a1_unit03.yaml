  informal_address:
    language_code: nl
    part_of_speech: pronoun
    agreement_tags:
      semantic: informal_address
  greeting:
    language_code: nl
    part_of_speech: phrase
    agreement_tags:
      semantic: greeting
  person_name:
    language_code: nl
    part_of_speech: proper_noun
