    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 話し手が女性なので、Рада は -а で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson01.fill.003
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: fill_in_blank
  frame:
    text: Мне {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мне грустно は、мне(私にとって)を使い、主語を置きません。「私には悲しく感じられる」に近い言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson01.translate.004
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: うれしいです。(男性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 男性は語尾なしで рад と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson01.translate.005
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
