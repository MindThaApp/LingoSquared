  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 女性は -а をつけて рада と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson01.translate.006
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
