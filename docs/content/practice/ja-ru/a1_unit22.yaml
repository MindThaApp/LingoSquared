templates:
- content_key: practice.ja-ru.ru.a1.unit22.lesson01.choose.001
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Рад は男性、рада は女性が言います。грустно は人を主語にしない形で、мне といっしょに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson01.order.002
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: word_order
  frame:
