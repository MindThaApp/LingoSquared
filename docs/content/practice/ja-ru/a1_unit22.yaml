  feedback_frame:
    text: 男性は語尾なしで устал と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson02.translate.004
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: translation
  frame:
    text: 疲れました。(男性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Устал は устать の男性形の過去形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson02.translate.005
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: translation
  frame:
    text: 仕事がたくさんあるので疲れています。(女性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    a: *id006
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {a}, потому что много {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Много のあとには работы の形がきて、「たくさんの仕事」となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.choose.001
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как ты себя чувствуешь? は調子を尋ねる文です。себя は「自分自身」を表す再帰代名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.order.002
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: word_order
  frame:
    text: Как ты {item} чувствуешь?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {item} чувствуешь?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Себя は再帰代名詞で、どの人称でも形が変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.fill.003
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: fill_in_blank
  frame:
    text: Как ты себя {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Чувствуешь は чувствовать のくだけた ты の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.fill.004
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: fill_in_blank
  frame:
    text: Я рад, потому что завтра {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Выходной は「休みの日」です。завтра(明日)はその前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.translate.005
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
    text: 調子はどう？(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как ты себя чувствуешь? は、相手の調子をくだけた言い方で尋ねる文です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.translate.006
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
    text: 明日は休みです。
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Завтра {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 「です」にあたる語は不要で、Завтра выходной と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson03.match.007
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
