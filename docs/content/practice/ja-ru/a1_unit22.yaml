    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}, потому что много работы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 女性が言う Устала は -а で終わります。потому что は理由を導きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson02.fill.003
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
