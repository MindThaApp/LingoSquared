- content_key: practice.ja-ru.ru.a1.unit22.lesson02.choose.001
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Устал は男性、устала は女性が言います。потому что は「なぜなら」「〜から」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit22.lesson02.order.002
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: word_order
