      part_of_speech: noun
      agreement_tags:
        semantic: w_испанский
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 私は毎週スペイン語を勉強しています。Каждую неделю(毎週)は каждый день と同じ形の表現です。Неделя は女性名詞なので、対格は неделю になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit31.lesson01.translate.004
  lesson_content_key: ru.a1.unit31.lesson01.uchitsya_i_programma_obucheniya
  type: translation
  frame:
    text: イーゴリは成人教育センターで学んでいます。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_обучения
  answer_derivation:
    kind: render_frame
    frame:
      text: Игорь учится в центре {item} для взрослых.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: イーゴリは成人教育センターで学んでいます。обучения は「学習、教育」という意味です(生格。「学習プログラム」のような表現で使われます)。
    language_code: ja
    direction: ltr
