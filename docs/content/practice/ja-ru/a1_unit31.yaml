      agreement_tags:
        semantic: w_изучает
  answer_derivation:
    kind: render_frame
    frame:
      text: Игорь {item} испанский.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: イーゴリはスペイン語を勉強しています。изучает は「(彼・彼女が)勉強する」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit31.lesson01.fill.003
  lesson_content_key: ru.a1.unit31.lesson01.uchitsya_i_programma_obucheniya
