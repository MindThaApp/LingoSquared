templates:
- content_key: practice.ja-ru.ru.a1.unit13.lesson01.choose.001
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ロシア語の過去形は性によって変わります。男性または男性名詞が主語なら был、女性または女性名詞が主語なら была です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson01.order.002
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: word_order
  frame:
    text: Вчера она {item} дома.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Она は女性なので、過去形の動詞は была です。男性が я で話すときは был になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson01.fill.003
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 男性は я был、女性は я была と言います。動詞は話し手の性に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson01.fill.004
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера она была {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Дома は「家に」という意味で、形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson01.translate.005
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: 昨日、私は家にいました。(男性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ロシア語の過去形には「私」専用の形がなく、動詞が話し手の性を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson01.translate.006
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: 昨日、彼女は家にいました。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Была は быть(「いる、ある」)の女性形の過去形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson02.choose.001
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 過去形の動詞は、男性が主語なら -л、女性が主語なら -ла で終わります:ходил、ходила。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson02.match.002
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ходил、смотрел、был はすべて -л で終わります。女性形は -ла で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson02.order.003
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: word_order
  frame:
    text: Вчера я {item} в кино.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил は男性形の過去形なので、この文は男性が言っています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson02.fill.004
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: fill_in_blank
  frame:
    text: Она {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Она は女性なので、過去形の動詞は -ла で終わります:смотрела。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson02.translate.005
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: 昨日、私は映画に行きました。(男性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил は ходить の男性形の過去形です。女性は ходила と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson02.translate.006
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: 私は映画を見ました。(女性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} фильм.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Смотрела は女性形の過去形です。фильм は無生物の男性名詞なので、形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson03.choose.001
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: делать の過去形は、男性なら делал、女性なら делала です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson03.order.002
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: word_order
  frame:
    text: Что ты {item} вчера?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал? は ты で男性に話しかける文です。女性に尋ねるなら делала になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson03.fill.003
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я смотрел {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хороший は фильм に合わせた男性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson03.fill.004
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отдыхала は отдыхать(「休む」)の女性形の過去形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson03.translate.005
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: 昨日は何をしたの?(親しい間柄、男性に対して)
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал вчера? は ты を使うので、友達に対する言い方です。相手が男性なので動詞は男性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit13.lesson03.translate.006
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: 私は休みました。(女性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 話し手が女性なので、Отдыхала は -ла で終わります。
    language_code: ja
    direction: ltr
