templates:
- content_key: practice.ja-ru.ru.a1.unit14.lesson01.choose.001
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Нравится は「好き」を表す動詞です。Мне нравится кофе は、直訳すると「私にとってコーヒーは気に入るものだ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне нравится кофе では、好きなもの(кофе)が文法上の主語で、мне が好きな人を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится は「私に」を表す мне と一緒に使って、何かが好きだと言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: コーヒーが好きです。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ロシア語では「私はコーヒーが好きだ」とは言わず、「私にとってコーヒーは気に入るものだ」という言い方をします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: 私はお茶が好きではありません。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 好きではないと言うときは、нравится の前に не を置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу は「ほしくない」という意味です。не は動詞のすぐ前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу は я хочу(私はほしい)を否定する形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson02.order.003
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сок は男性名詞で、хочу のあとでも形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson02.fill.004
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хочу のあとには、ほしいものがそのまま続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson02.translate.005
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: 私はジュースがほしいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу に名詞を続けると、率直でストレートな頼み方になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson02.translate.006
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: 私はコーヒーがほしくありません。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не は хочу の前に置いて否定します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson03.choose.001
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе は「あなたに」を表すくだけた ты の形です。丁寧な вы の形は вам です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson03.order.002
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе? は、くだけた ты を使って同じ質問を相手に返す言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson03.fill.003
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: fill_in_blank
  frame:
    text: А {item} нравится кофе? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тебе は「あなたに」を表すくだけた形で、友達に対して使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: はい、コーヒーが好きです。あなたは？(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тебе は「あなたに」を表すくだけた形です。初対面の人などには вам を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit14.lesson03.translate.005
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これらは好みや希望を言うための基本パーツです：нравится、не хочу、сок、тебе。
    language_code: ja
    direction: ltr
