templates:
- content_key: practice.ja-ru.ru.a1.unit23.lesson01.choose.001
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Алло は、ロシア語で電話に出るときや話し始めるときの言葉です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson01.order.002
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: word_order
  frame:
    text: Пожалуйста, {item} медленно.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Пожалуйста, {item} медленно.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Говори は親しい相手への命令形で、丁寧な形は говорите です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson01.fill.003
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: fill_in_blank
  frame:
    text: Говори {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Медленно は副詞で、形が変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson01.translate.005
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: translation
  frame:
    text: ゆっくり話してください。(親しい相手に)
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Говори {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Медленно は「ゆっくり」という意味で、形は一つだけです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson01.translate.006
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Говори は親しい相手への命令形なので、友達に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.choose.001
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
