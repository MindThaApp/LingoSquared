  feedback_frame:
    text: Повтори と напиши は親しい相手への命令形で、丁寧な形は語尾が -те になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.order.002
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: word_order
  frame:
