    frame:
      text: Пожалуйста, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Повтори は「繰り返して」という親しい相手への命令形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.fill.003
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
