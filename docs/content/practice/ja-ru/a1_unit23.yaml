    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.fill.004
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: fill_in_blank
  frame:
    text: Пожалуйста, {item} мне. ({hint})
