    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Напиши は友達に使う親しい相手への命令形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.translate.005
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: translation
  frame:
    text: それをもう一度言ってください。(親しい相手に)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}, пожалуйста.'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Повтори は ты に対する命令形で、вы に対しては повторите になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.translate.006
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: translation
  frame:
    text: 私にメッセージを送ってね。(親しい相手に)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Напиши мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне は「私に」という意味なので、この文は「私に書いて」と言っています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit23.lesson02.translate.007
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
