  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、言語カフェのチューリップのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson01.translate.002
  lesson_content_key: ru.a1.unit38.lesson01.krasnyy_i_zhyoltyy
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
