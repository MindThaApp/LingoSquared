- content_key: practice.ja-ru.ru.a1.unit38.lesson01.order.003
  lesson_content_key: ru.a1.unit38.lesson01.krasnyy_i_zhyoltyy
  type: word_order
  frame:
    text: Эти {item} красные, а те жёлтые.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_тюльпаны
  answer_derivation:
    kind: render_frame
    frame:
      text: Эти {item} красные, а те жёлтые.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: こちらのチューリップは赤で、あちらのチューリップは黄色です。тюльпаны は「チューリップ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson02.order.002
  lesson_content_key: ru.a1.unit38.lesson02.belyy_i_oranzhevyy
  type: word_order
  frame:
    text: Какой это {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_цвет
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: それは何色ですか。цвет は「色」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson03.order.002
  lesson_content_key: ru.a1.unit38.lesson03.rozovyy_i_fioletovyy
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_розовый
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ピンクがほしいです。розовый は「ピンクの」(男性形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson03.fill.003
  lesson_content_key: ru.a1.unit38.lesson03.rozovyy_i_fioletovyy
  type: fill_in_blank
  frame:
    text: Это розовый, а это {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_фиолетовый
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_фиолетовый
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これはピンクで、これは紫です。фиолетовый は「紫の」(男性形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson05.order.002
  lesson_content_key: ru.a1.unit38.lesson05.nina_i_nastya_pokupayut
  type: word_order
  frame:
    text: Нине и Насте нравится {item} рынок.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_цветочный
  answer_derivation:
    kind: render_frame
    frame:
      text: Нине и Насте нравится {item} рынок.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ニーナとナースチャは花市場を楽しいと思っています。цветочный は「花の」(形容詞)という意味で、「花屋」を表す言い方の中で使われます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson06.order.002
  lesson_content_key: ru.a1.unit38.lesson06.tyulpany_dlya_yazykovogo_kafe
  type: word_order
  frame:
    text: Тюльпаны {item} языковое кафе красивым!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_делают
  answer_derivation:
    kind: render_frame
    frame:
      text: Тюльпаны {item} языковое кафе красивым!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: チューリップが言語カフェを素敵にしてくれます!делают は「(彼らが)する、つくる」という意味です。
    language_code: ja
    direction: ltr
