schema_version: '1.0'
pack_key: practice.ja-ru.a1.unit38
source_language: ja
target_language: ru
unit_content_key: ru.a1.unit38.colours
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_белый
    - w_делают
    - w_жёлтый
    - w_здесь
    - w_красиво
    - w_красивые
    - w_красивым
    - w_красный
    - w_оранжевый
    - w_покупают
    - w_розовый
    - w_рынок
    - w_тюльпаны
    - w_фиолетовый
    - w_хотеть
    - w_хочет
    - w_цвет
    - w_цветочный
    - w_языкового
templates:
- content_key: practice.ja-ru.ru.a1.unit38.lesson01.choose.001
  lesson_content_key: ru.a1.unit38.lesson01.krasnyy_i_zhyoltyy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_тюльпаны
        - w_здесь
        - w_красный
        - w_жёлтый
        - w_белый
        - w_оранжевый
        - w_цвет
        - w_розовый
        - w_хотеть
        - w_хочет
        - w_фиолетовый
        - w_цветочный
        - w_рынок
        - w_покупают
        - w_красивые
        - w_языкового
        - w_красиво
        - w_делают
        - w_красивым
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、赤と黄色のレッスンに出てきたこの単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson02.listen.001
  lesson_content_key: ru.a1.unit38.lesson02.belyy_i_oranzhevyy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、白とオレンジのレッスンに出てきたこの単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson03.translate.001
  lesson_content_key: ru.a1.unit38.lesson03.rozovyy_i_fioletovyy
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、ピンクと紫のレッスンに出てきたこの単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson05.match.001
  lesson_content_key: ru.a1.unit38.lesson05.nina_i_nastya_pokupayut
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: ロシア語の各単語と、その日本語の意味を組み合わせてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit38.lesson06.choose.001
  lesson_content_key: ru.a1.unit38.lesson06.tyulpany_dlya_yazykovogo_kafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
