schema_version: '1.0'
pack_key: practice.ja-ru.a1.unit35
source_language: ja
target_language: ru
unit_content_key: ru.a1.unit35.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_адрес
    - w_бабушке
    - w_дедушке
    - w_домой
    - w_идти
    - w_марка
    - w_отправляю
    - w_писать
    - w_письмо
    - w_пишет
    - w_пишу
    - w_покупает
    - w_посылка
    - w_почте
    - w_прийти
    - w_сотрудник
templates:
- content_key: practice.ja-ru.ru.a1.unit35.lesson01.choose.001
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_письмо
        - w_посылка
        - w_отправляю
        - w_дедушке
        - w_бабушке
        - w_марка
        - w_адрес
        - w_писать
        - w_пишу
        - w_прийти
        - w_идти
        - w_сотрудник
        - w_покупает
        - w_почте
        - w_пишет
        - w_домой
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、手紙と小包のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson02.listen.001
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、切手・住所・書くことのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson03.translate.001
  lesson_content_key: ru.a1.unit35.lesson03.priyti_i_idti
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、着くことと時間がかかることのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson04.match.001
  lesson_content_key: ru.a1.unit35.lesson04.na_pochte
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: ロシア語の各単語と、その日本語の意味を組み合わせてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson05.choose.001
  lesson_content_key: ru.a1.unit35.lesson05.nastya_otpravlyaet_posylku
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「ナスチャが荷物を送る」のレッスンで学ぶ、このユニットの単語の一つです。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson06.translate.001
  lesson_content_key: ru.a1.unit35.lesson06.domoy
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、「家に帰る」のレッスンに出てきたこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson01.order.002
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: word_order
  frame:
    text: У меня есть {item} для дедушки.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_письмо
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня есть {item} для дедушки.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 私はおじいちゃんに送る手紙があります。письмо は「手紙、メール」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson01.fill.003
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: fill_in_blank
  frame:
    text: Я {item} посылку в Самару. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отправляю
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отправляю
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 私はサマーラに荷物を送ります。отправляю は「私は送る」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson01.translate.004
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: translation
  frame:
    text: 私はサマーラのおじいちゃんとおばあちゃんに手紙と荷物を送ります。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_дедушке
  answer_derivation:
    kind: render_frame
    frame:
      text: Я отправляю письмо и посылку в Самару, {item} и бабушке.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 私はサマーラのおじいちゃんとおばあちゃんに手紙と荷物を送ります。дедушке は「おじいちゃん」(与格、「おじいちゃんに」の形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit35.lesson02.order.002
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: word_order
  frame:
    text: Я пишу {item} на посылке.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_адрес
  answer_derivation:
    kind: render_frame
    frame:
      text: Я пишу {item} на посылке.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 私は荷物に住所を書きます。адрес は「住所」という意味です。
    language_code: ja
    direction: ltr
