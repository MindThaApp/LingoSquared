templates:
- content_key: practice.ja-ru.ru.a1.unit09.lesson01.choose.001
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Где は「どこ」をたずね、находится は「ある(位置する)」を加えます。合わせて場所をたずねる表現になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson01.order.002
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: word_order
  frame:
    text: Где {item} магазин?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Где {item} магазин?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Находится は主語が「彼・彼女・それ」にあたる形の動詞なので、магазин のような単数の名詞と一致します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson01.fill.003
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: fill_in_blank
  frame:
    text: Магазин на Тверской {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 「〜に」を表す на の後では、улица は場所を示すために улице という形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson01.translate.004
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: 薬局はどこにありますか。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Где находится ...? は、場所がどこにあるかをたずねる基本の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson01.translate.005
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Где は「どこ」、улица は「通り」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson02.choose.001
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Банк、вокзал、ресторан は男性名詞で、аптека、гостиница、библиотека は女性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson02.listen.002
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: これらの場所の名前は名詞で、Где находится банк? のように、特別な語を付けなくてもそのまま使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson02.match.003
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Банк と ресторан は「バンク」「レストラン」と似た形で、аптека は「アポセカリー(薬屋)」と同じ語源につながっています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson02.order.004
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: word_order
  frame:
    text: Где находится {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Где находится ...? は、単数の場所を表すどんな名詞にも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson02.fill.005
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: fill_in_blank
  frame:
    text: Банк на улице {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 人の名前が付いた通りでは、名前が生格になります。улица Пушкина は「プーシキン通り」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson02.translate.006
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: translation
  frame:
    text: ホテルはどこにありますか。
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиница は「ホテル」を意味する女性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.choose.001
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Вашей と моей は、ваш と мой の女性形で、на の後で使います:на вашей улице、на моей улице。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.order.002
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: word_order
  frame:
    text: Что есть на {item} улице?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вашей は女性名詞の улице に合わせた形です。これは вы を使った丁寧な質問です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.fill.003
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: На {item} улице есть банк. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: улица は女性名詞で前置格になるため、моя は на の後で Моей という形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.fill.004
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: Спасибо {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо большое は、「どうもありがとうございます」と気持ちを込めて言う表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.translate.005
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: あなたの通りには何がありますか。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что есть на вашей улице? は、通りに何があるかをたずねる文です。вы の形 вашей を使うので丁寧になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: どうもありがとうございます。
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Большое は中性名詞の спасибо に合わせるので、語尾が -ое になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit09.lesson03.translate.007
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 私の通りには銀行があります。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть は「持っている」ときの言い方です。通りにあるものを言うときは На моей улице есть を使います。
    language_code: ja
    direction: ltr
