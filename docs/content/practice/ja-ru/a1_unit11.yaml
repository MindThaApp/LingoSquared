templates:
- content_key: practice.ja-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: -ю で終わる動詞は я と使います(я встаю「私は起きます」)。-ете で終わる動詞は вы と使います(вы встаёте)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 主語が я なので、どの動詞も -ю で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Завтракаю は「朝食を食べる」という動詞の я の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Встаёте は -ёте で終わる вы の形です。я の形は встаю です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: 私は7時に起きます。
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ロシア語では時刻を言うとき、в と数字を使います：в семь часов(7時に)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これらの動詞は я の形なので、どれも「私は~します」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ложусь спать は直訳すると「眠るために横になる」で、「寝る」を表す一般的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Спать は「眠る」という意味の不定形で、ложусь は別の動詞の я の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ложусь спать は決まった組み合わせで、動詞 ложусь に不定形 спать が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: fill_in_blank
  frame:
    text: Я работаю с девяти до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: С と до のあとは生格になるので、девять と пять は девяти と пяти に変わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: 私は9時から5時まで働きます。
    language_code: ja
    direction: ltr
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С ... до ... は「…から…まで」という意味で、両方の数字が生格になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: 私は11時に寝ます。
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 数字 одиннадцать のあとでは、名詞は複数生格の часов になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Делаете と работаете は -ете で終わる вы の形なので、вы と組み合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson03.order.002
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете? は「何をしていますか」という質問で、утром は「朝に」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А は前の質問とつなぐ働きをし、работаете は вы の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
    text: Что вы {item} вечером? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Делаете は делать「する」の вы の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: 朝は何をしていますか。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете утром? は、疑問詞、вы に対応する動詞の形、時を表す語を組み合わせた文です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Понятно は直訳すると「明らかだ」で、「なるほど」「わかりました」と言うときによく使います。
    language_code: ja
    direction: ltr
