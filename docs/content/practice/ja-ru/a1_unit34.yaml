    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 私はカザンの良い地区に住んでいます。хорошем は「良い」という意味です(男性形、「〜で」を表す語の後の形)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit34.lesson02.order.002
