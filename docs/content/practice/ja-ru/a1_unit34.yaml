schema_version: '1.0'
pack_key: practice.ja-ru.a1.unit34
source_language: ja
target_language: ru
unit_content_key: ru.a1.unit34.neighbourhood
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_давно
    - w_дружелюбный
    - w_здоровается
    - w_здороваться
    - w_здороваюсь
    - w_знает
    - w_знать
    - w_район
    - w_сосед
    - w_соседа
    - w_супермаркет
    - w_хорошем
templates:
- content_key: practice.ja-ru.ru.a1.unit34.lesson01.choose.001
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_район
        - w_хорошем
        - w_супермаркет
        - w_сосед
        - w_соседа
        - w_знать
        - w_дружелюбный
        - w_здороваться
        - w_здороваюсь
        - w_давно
        - w_здоровается
        - w_знает
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、この単元の単語で、近所についてのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit34.lesson02.listen.001
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、この単元の単語で、男女の隣人についてのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit34.lesson03.translate.001
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、この単元の単語で、親切さとあいさつについてのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit34.lesson04.match.001
  lesson_content_key: ru.a1.unit34.lesson04.nastya_znakomitsya_s_pavlom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: ロシア語の各単語と、その日本語の意味を組み合わせてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit34.lesson05.choose.001
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
