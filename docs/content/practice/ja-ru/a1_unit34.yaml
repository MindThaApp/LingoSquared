  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_район
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой {item} рядом с супермаркетом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 私の地区はスーパーの近くです。район は「地区」という意味です。
    language_code: ja
    direction: ltr
