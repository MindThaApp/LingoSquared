  frame:
    text: Павел {item} Димы.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_сосед
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел {item} Димы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: パーヴェルはディマの(男性の)隣人です。сосед は「隣人」(男性)という意味です。
    language_code: ja
    direction: ltr
