    text: '{item} はこのユニットの単語で、パーティーの準備で誰が何をするかのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit32.lesson06.translate.001
  lesson_content_key: ru.a1.unit32.lesson06.vecherinka_v_yazykovom_kafe
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、言語カフェでのパーティーのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 私の誕生日は4月18日です。рождения は「誕生」という意味です(生格で、「誕生日」の中で使われています)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit32.lesson01.fill.003
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: fill_in_blank
  frame:
    text: День рождения Лены в субботу, {item} апреля. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: レーナの誕生日は4月18日の土曜日です。Лены は Лена の生格で所有を表します：день рождения Лены。「の」にあたる語は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit32.lesson02.order.002
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: word_order
  frame:
    text: Мы {item} день рождения Лены.
    language_code: ru
    direction: ltr
