    frame:
      text: Мы {item} день рождения Лены.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 私たちはレーナの誕生日をお祝いしています。отмечаем は「私たちは祝う」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit32.lesson03.order.002
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: word_order
  frame:
    text: Я {item} тебя.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашаю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} тебя.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: あなたを招待します。приглашаю は「私は招待する」という意味です。
    language_code: ja
    direction: ltr
