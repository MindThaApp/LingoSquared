    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「舞台と幕」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit58.lesson03.translate.001
