- content_key: practice.ja-ru.ru.a1.unit58.lesson01.order.002
  lesson_content_key: ru.a1.unit58.lesson01.davay_segodnya_poydyom_v
  type: word_order
  frame:
    text: Во сколько начинается {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спектакль
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько начинается {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 公演は何時に始まりますか？спектакль は「公演、舞台」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit58.lesson02.order.002
  lesson_content_key: ru.a1.unit58.lesson02.stsena_i_zanaves
  type: word_order
  frame:
    text: Я вижу сцену и {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_занавес
  answer_derivation:
    kind: render_frame
    frame:
      text: Я вижу сцену и {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 舞台と幕が見えます。занавес は「幕」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit58.lesson03.order.002
  lesson_content_key: ru.a1.unit58.lesson03.aktyory_i_kassa
  type: word_order
  frame:
    text: Я вижу {item} и кассу.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_актёров
  answer_derivation:
    kind: render_frame
    frame:
      text: Я вижу {item} и кассу.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俳優たちと切符売り場が見えます。актёров は「俳優たちを」(目的語の形)という意味です。
