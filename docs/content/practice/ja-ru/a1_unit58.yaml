schema_version: '1.0'
pack_key: practice.ja-ru.a1.unit58
source_language: ja
target_language: ru
unit_content_key: ru.a1.unit58.theatre
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_актёров
    - w_актёры
    - w_антрактом
    - w_занавес
    - w_звезда
    - w_места
    - w_открыта
    - w_популярный
    - w_потрясающими
    - w_путешествие
    - w_пьеса
    - w_спектакль
    - w_сцену
templates:
- content_key: practice.ja-ru.ru.a1.unit58.lesson01.choose.001
  lesson_content_key: ru.a1.unit58.lesson01.davay_segodnya_poydyom_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спектакль
        - w_популярный
        - w_занавес
        - w_сцену
        - w_актёры
        - w_открыта
        - w_актёров
        - w_звезда
        - w_пьеса
        - w_путешествие
        - w_антрактом
        - w_места
        - w_потрясающими
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「今日は劇場に行きましょうか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit58.lesson02.listen.001
  lesson_content_key: ru.a1.unit58.lesson02.stsena_i_zanaves
  type: listen_select
  frame:
