templates:
- content_key: practice.ja-ru.ru.a1.unit17.lesson01.choose.001
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: врач や инженер のようなロシア語の職業名は、「ひとつの」にあたる語を必要としません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit17.lesson01.match.002
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: matching_pairs
