schema_version: '1.0'
pack_key: practice.ja-ru.a1.unit43
source_language: ja
target_language: ru
unit_content_key: ru.a1.unit43.accommodation
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_администратор
    - w_бронь
    - w_были
    - w_включён
    - w_вкусный
    - w_выезд
    - w_двенадцать
    - w_забронирован
    - w_забронировать
    - w_завтрак
    - w_заселиться
    - w_заселяемся
    - w_карточке
    - w_ключ
    - w_красивый
    - w_начинается
    - w_ночей
    - w_ночь
    - w_одна
    - w_одну
    - w_пароль
    - w_прекрасные
    - w_прошли
    - w_следующий
    - w_цену
