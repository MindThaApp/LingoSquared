templates:
- content_key: practice.ja-ru.ru.a1.unit07.lesson01.choose.001
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Официант は男性のウェイター、официантка は女性のウェイトレスです。女性形は -ка がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson01.order.002
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: word_order
  frame:
    text: Этот {item} свободен?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Этот {item} свободен?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Этот は男性形の「この」で、столик や стол のような男性名詞につきます。свободен も男性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson01.fill.003
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: fill_in_blank
  frame:
    text: Да, {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Садитесь は -тесь で終わる、вы に対する丁寧な命令形で、店員が客に話すときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson01.match.004
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Свободен は столик に合わせた男性形の形容詞です。Этот столик свободен? は「この席は空いていますか」という質問です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson01.translate.005
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: こちらがメニューです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вот {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меню は語尾が変わらず、Вот は「ここに~があります」の意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson01.translate.006
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: 何をご注文されますか。(丁寧)
    language_code: ja
    direction: ltr
  slots:
    aux: *id005
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Что {aux} {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете заказывать? は、вы の形 будете と不定詞を使って、客に何を注文するか尋ねる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson02.choose.001
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Я хочу のあとに名詞を置くと「~がほしいです」の意味になります。ロシア語には冠詞はありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson02.order.002
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу は「私は~がほしい」の意味で、чай、кофе、борщ、салат はそのあとでも形が変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson02.fill.003
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: fill_in_blank
  frame:
    text: Я хочу борщ и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: и は注文で2つの品をつなぎます:борщ и салат。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson02.match.004
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id010
    second: *id010
    third: *id010
    fourth: *id010
    fifth: *id010
    sixth: *id010
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Кофе は男性名詞で、語尾が変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson02.translate.005
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: お茶が欲しいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу は直接的な言い方なので、レストランでは пожалуйста を加えてやわらげます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: ボルシチとサラダが欲しいです。
    language_code: ja
    direction: ltr
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат は会話に出てきた注文です。ロシア語には冠詞はありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мороженое は、сладкое と同じく形容詞から作られた中性名詞なので -ое で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson03.order.002
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: На сладкое принесите {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое принесите {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое は「デザートに」、принесите は「持ってきてください」を意味する、вы に対する丁寧な命令形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson03.order.003
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: Что будете {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Что будете {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете пить? はウェイターの質問で、будете と不定詞を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson03.fill.004
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: fill_in_blank
  frame:
    text: На сладкое {item} мороженое, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Принесите は「持ってきてください」の、вы に対する丁寧な命令形です。ты なら принеси になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson03.translate.005
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: デザートにアイスクリームを持ってきてください。(丁寧)
    language_code: ja
    direction: ltr
  slots:
    a: *id016
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое {a} {b}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое принесите мороженое は、ウェイターにデザートを注文する自然な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ru.ru.a1.unit07.lesson03.translate.006
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сладкое は、名詞として「デザート」の意味で使われる形容詞です。
    language_code: ja
    direction: ltr
