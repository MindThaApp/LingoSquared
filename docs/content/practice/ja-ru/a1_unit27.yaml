    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: ロシア語の各単語と、その日本語の意味を組み合わせてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
