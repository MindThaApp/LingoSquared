      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Chère krijgt de vrouwelijke -e als het bij quiche hoort; bij een mannelijk woord is het cher: le fromage est moins cher.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit14.lesson02.translate.005
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
