    slot: item
  feedback_frame:
    text: Irrégulier betekent dat de vorm niet het gewone patroon volgt, zoals bij meilleur.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit14.lesson02.listen.002
