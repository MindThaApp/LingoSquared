    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce fromage est plus cher que {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Que leidt het tweede deel van een vergelijking in; l'autre staat voor de andere kaas.
    language_code: nl
    direction: ltr
