  frame:
    text: Dus we nemen die; het is de beste optie voor de workshop. (gebruik on)
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Alors on prend {item}, c'est la meilleure option pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Celui-là betekent die; meilleure is vrouwelijk omdat option vrouwelijk is.
    language_code: nl
    direction: ltr
