- content_key: practice.nl-fr.fr.a1.unit49.lesson03.order.002
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: word_order
  frame:
    text: Je suis {item} avant mon premier service.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nerveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} avant mon premier service.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ik ben nerveus voor mijn eerste dienst. nerveux betekent nerveus (mannelijk).
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hoi Mathieu, hoe voel je je over je eerste dienst? Avant ton premier service (voor je eerste dienst) gebruikt opnieuw het patroon avant + zelfstandig naamwoord uit les 3.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Hoe voelt Mathieu zich? Se sentir (zich voelen, wederkerend) is de standaardmanier om naar een gemoedstoestand te vragen of die te beschrijven; het komt ook voor in de gezondheidsunit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ja, dat denk ik ook. Je pense aussi is de natuurlijke manier om het met de mening van iemand eens te zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ik ben eerlijk gezegd een beetje nerveus. Honnêtement (eerlijk gezegd) maakt de bekentenis zachter.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Maak je geen zorgen, je gaat het goed doen! Tu vas y arriver (letterlijk 'je gaat er komen') is een bemoedigende vaste uitdrukking; aller + infinitief vormt de nabije toekomst.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: Bedankt, dat helpt echt.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Bedankt, dat helpt echt. Aide is de il/elle-vorm van aider (helpen); m' staat voor me.
    language_code: nl
    direction: ltr
