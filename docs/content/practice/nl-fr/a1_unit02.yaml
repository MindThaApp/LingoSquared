  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Quel âge avez-vous? gebruikt vous: voor vreemden en in beleefde situaties.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
