  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît is het informele alsjeblieft en s'il vous plaît het formele; het patroon komt overeen met tu en vous.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit02.lesson04.fill.002
