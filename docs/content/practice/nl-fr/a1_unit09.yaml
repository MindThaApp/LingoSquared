templates:
- content_key: practice.nl-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche en à droite betekenen links en rechts (op of naar); de zelfstandige naamwoorden gauche en droite zijn vrouwelijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Au carrefour: à en le worden samengetrokken tot au, "bij het kruispunt".'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson01.match.003
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Droit betekent "recht" in tout droit; gauche en droite zijn links en rechts.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson01.order.004
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Bij links- of rechtsaf gebruik je à gauche en à droite, met à en niet met en.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: fill_in_blank
  frame:
    text: Tournez à gauche au {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au is de samentrekking van à en le, dus au carrefour betekent "bij het kruispunt".
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson01.translate.006
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: translation
  frame:
    text: De winkel is op de hoek van de straat, aan de rechterkant.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La boutique est au {item} de la rue, à droite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au coin de la rue betekent "op de hoek van de straat".
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson02.choose.001
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tournez en continuez zijn bevelsvormen met vous, gebruikt tegen vreemden of tegen meerdere mensen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson02.listen.002
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jusqu'au betekent "tot aan het" (mannelijk), zoals in jusqu'au carrefour.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson02.order.003
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: word_order
  frame:
