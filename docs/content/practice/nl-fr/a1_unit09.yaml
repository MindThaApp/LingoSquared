    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Continuez tout droit {item} carrefour.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Jusqu'au is jusqu'à plus le, gebruikt voor een mannelijke plaats.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson02.fill.004
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: fill_in_blank
  frame:
    text: Excusez-moi, pour {item} à la boutique, s'il vous plaît ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pour aller à is de standaardmanier om te vragen hoe je ergens komt; s'il vous plaît is beleefd.
    language_code: nl
    direction: ltr
