    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: De tu-vormen tournes, continues en traverses eindigen op -es, één voor elke stap van de route.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson03.order.004
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: word_order
  frame:
    text: Ensuite, tu continues tout droit et tu {item} la rue.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, tu continues tout droit et tu {item} la rue.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu traverses heeft de uitgang -es die bij tu hoort.
    language_code: nl
    direction: ltr
