  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: translation
  frame:
    text: Je gaat bij het kruispunt linksaf. (informeel, tu)
    language_code: nl
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à gauche au carrefour.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu tournes heeft de uitgang -es die bij tu hoort.
    language_code: nl
    direction: ltr
