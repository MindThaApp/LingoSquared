    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson03.choose.001
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Exactement vraagt om precisie: elle est où exactement betekent "waar is het precies?"'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson03.listen.002
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ensuite betekent "daarna" of "vervolgens" en verbindt de stappen van een routebeschrijving.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson03.match.003
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
