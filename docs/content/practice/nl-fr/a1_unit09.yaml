    text: Elle est où {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Exactement maakt een vraag met "waar" preciezer.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit09.lesson03.fill.006
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: fill_in_blank
  frame:
    text: Tu {item} une boutique pour acheter des ustensiles de cuisine ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Connais is de tu-vorm van connaître, dat je gebruikt voor het kennen van een plek of een persoon.
    language_code: nl
    direction: ltr
