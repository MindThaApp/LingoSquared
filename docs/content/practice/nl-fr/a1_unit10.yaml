templates:
- content_key: practice.nl-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant betekent 'voor' of 'vóór'; d'abord betekent 'eerst', aan het begin van een reeks.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'S''habiller is wederkerend: je m''habille, tu t''habilles; bij je wordt s'' tot m''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Verschillende werkwoorden uit de routine zijn wederkerend (se réveiller, s'habiller); andere, zoals prendre en quitter, niet.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison betekent het huis verlaten; bij je is het werkwoord quitte.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche is de gebruikelijke manier om 'douchen' te zeggen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: Ik kleed me aan voor het ontbijt.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Bij je m'habille wordt het wederkerende voornaamwoord m' voor een klinkerklank gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard betekent 'laat'; puis betekent 'daarna' en verbindt stappen in een routine.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois is 23; in het Frans kun je de 24-uursklok gebruiken, dus vingt-trois heures is 23.00 uur.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer, dîner en coucher zijn de infinitieven; bij je en nous veranderen de uitgangen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre is de je-vorm; rentrer betekent naar huis terugkeren.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: Op zaterdagavond dineren we samen. (gebruik nous)
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons is de nous-vorm; ensemble betekent samen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: Ik ga rond 23.00 uur naar bed.
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers geeft een ongeveer tijdstip aan; vingt-trois heures gebruikt de 24-uursklok.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ? is de informele manier om te vragen wat je aan het doen bent; quoi vervangt que achter het werkwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose betekent ik rust uit; repose is de je-vorm van se reposer.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais is de je-vorm van aller; au is à plus le.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer is wederkerend, dus bij je hoort me.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'Wat doe je op zaterdag vóór de workshop? (informeel: begin met Tu fais)'
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ? is de informele manier om te vragen wat iemand doet.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'Hoe laat kom je thuis? (informeel: begin met Tu)'
    language_code: nl
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres is de tu-vorm; à quelle heure vraagt naar het tijdstip.
    language_code: nl
    direction: ltr
