templates:
- content_key: practice.nl-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frères et sœurs betekent samen "broers en zussen": het Frans heeft geen enkel alledaags woord voor broers en zussen samen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Frère en frères klinken hetzelfde, net als sœur en sœurs; alleen het lidwoord of de context laat zien of het enkelvoud of meervoud is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Franse familiewoorden koppel je makkelijk als je het geslacht kent: mère en père, tante en oncle, cousine en cousin.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frère en sœur krijgen in het meervoud een -s (frères, sœurs), dus een Nederlands meervoud vraagt ook om een Frans meervoud.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ma staat bij vrouwelijke woorden (ma mère), mon bij mannelijke (mon père) en mes bij alle meervouden (mes parents).
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ma staat bij een vrouwelijk enkelvoudig woord; het bijvoeglijk naamwoord petite krijgt ook de vrouwelijke -e.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Famille is vrouwelijk, dus je gebruikt ma; bij een mannelijk woord staat mon.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: Mijn familie is klein.
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Petite is vrouwelijk omdat famille vrouwelijk is; bij een mannelijk woord staat petit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cousin is mannelijk en cousine is vrouwelijk: de -e geeft een vrouwelijke neef (nicht) aan en zorgt dat de n aan het eind te horen is.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Mon gebruik je voor mannelijke enkelvoudige woorden: mon père, mon oncle.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: De Franse uitgangen in de tegenwoordige tijd klinken hetzelfde bij habite/habites/habitent, dus het voornaamwoord laat zien wie er bedoeld wordt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: J’habite avec mes {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes is het meervoud van "mijn", voor mannelijke en vrouwelijke woorden.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson04.fill.003
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Tu habites {item} de tes parents ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Près de betekent dicht bij: près de tes parents, près d’ici.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson04.translate.004
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De werkwoordsuitgang volgt het onderwerp: habite bij il/elle, habitent bij ils/elles, habites bij tu.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson04.translate.005
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: Ik woon bij mijn grootouders.
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes is het meervoud van "mijn", dus mes grands-parents betekent "mijn grootouders".
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson05.fill.001
  lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Ma petite sœur {item} Camille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'S’appelle is de il/elle-vorm van s’appeler: ma sœur s’appelle..., je m’appelle...'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson06.listen.001
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque semaine betekent elke week: chaque verandert nooit en wordt gevolgd door een enkelvoudig zelfstandig naamwoord.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit03.lesson06.match.002
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id018
    second: *id018
    third: *id018
    fourth: *id018
    fifth: *id018
    sixth: *id018
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mais is het woord voor tegenstelling (maar) en plus drukt een vergelijking uit, zoals in Ma famille est plus petite.
    language_code: nl
    direction: ltr
