templates:
- content_key: practice.nl-fr.fr.a1.unit06.lesson01.choose.001
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le matin, l'après-midi en le soir zijn dagdelen; midi en minuit zijn twaalf uur 's middags en middernacht en krijgen geen lidwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson01.listen.002
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''heure is een verkorting van la heure: heure begint met een stomme h, dus la wordt l'' ervoor.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson01.match.003
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
