    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Matin, après-midi en soir staan meestal met le of l' als je 's ochtends, 's middags, 's avonds zegt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson01.order.004
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: word_order
  frame:
    text: Le marché est ouvert le {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Le marché est ouvert le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le matin en le soir betekenen 's ochtends en 's avonds, zonder los woord voor 'in'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson01.fill.005
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: fill_in_blank
  frame:
    text: Nous mangeons à {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: À midi betekent om twaalf uur 's middags; midi is ook het gewone woord voor lunchtijd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson01.translate.006
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: translation
  frame:
    text: De workshop begint 's avonds, niet 's ochtends.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence le {item}, pas le matin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le soir betekent 's avonds; pas ontkent de tegenstelling met le matin.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson02.choose.001
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Demie is hier de vrouwelijke vorm omdat heure vrouwelijk is: dix heures et demie.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson02.listen.002
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Et quart en moins le quart zijn de twee kwartuurzinnen: kwart over en kwart voor.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson02.order.003
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: word_order
  frame:
    text: L'atelier commence à {item} heure ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence à {item} heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle heure ? vraagt hoe laat het is; quelle is vrouwelijk, passend bij heure.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson02.fill.004
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: fill_in_blank
  frame:
    text: Il est onze heures {item} le quart. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Moins le quart trekt een kwartier af van het volgende uur, dus onze heures moins le quart is 10:45.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson02.translate.005
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: translation
  frame:
    text: Het is kwart over tien.
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Il est dix heures et {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Et quart voegt een kwartier toe; in het Frans zeg je letterlijk tien uur en kwart.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.choose.001
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alors, vers en après zijn kleine verbindingswoorden die in de dialoog tijd of volgorde aangeven.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.listen.002
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vers betekent rond, zoals in vers vingt heures quinze, en geeft een ongeveer tijdstip.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.match.003
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Après le travail betekent na het werk; vers en d'habitude geven een ongeveer en een gewoon tijdstip aan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.order.004
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: word_order
  frame:
    text: C'est plus {item} après le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est plus {item} après le travail.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Plus pratique betekent handiger; pratique heeft dezelfde vorm voor mannelijk en vrouwelijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.fill.005
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Et il {item} à quelle heure ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Finit is de il-vorm van finir, dus hij past bij il in de vraag.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.fill.006
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Vers vingt heures quinze, comme {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comme d'habitude betekent zoals gewoonlijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit06.lesson03.translate.007
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: translation
  frame:
    text: Hij (de workshop) begint om half zeven 's avonds, denk ik. (schrijf de tijd in woorden)
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Il commence à dix-huit heures trente, je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Je crois is de je-vorm van croire en maakt een uitspraak zachter: ik denk het wel.'
    language_code: nl
    direction: ltr
