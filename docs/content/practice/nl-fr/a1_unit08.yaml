  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier is het rangtelwoord voor alleen de eerste dag; andere data gebruiken hoofdtelwoorden: le premier mars, le quinze mars.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit08.lesson02.listen.002
