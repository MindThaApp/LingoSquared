templates:
- content_key: practice.nl-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lundi, samedi en dimanche schrijf je in het Frans met een kleine letter, en le voor een dag betekent elke week: le samedi.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit08.lesson01.listen.002
