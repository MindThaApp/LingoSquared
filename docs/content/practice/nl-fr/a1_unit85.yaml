- content_key: practice.nl-fr.fr.a1.unit85.lesson04.match.001
  lesson_content_key: fr.a1.unit85.lesson04.le_programme_du_spectacle
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Koppel elk Frans woord aan de juiste Nederlandse betekenis; de woorden komen uit de lessen van deze unit.
    language_code: nl
    direction: ltr
