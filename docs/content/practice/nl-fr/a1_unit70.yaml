  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_réserver
        - w_cet
        - w_réservé
        - w_compris
        - w_clé
        - w_mot
        - w_wifi
        - w_réceptionniste
        - w_réservation
        - w_nuits
        - w_nuit
        - w_avait
  answer_derivation:
    kind: slot_gloss
    slot: item
