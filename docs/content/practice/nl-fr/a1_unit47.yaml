    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Het is zonnig. Le temps est + bijvoeglijk naamwoord is een vast patroon; het bijvoeglijk naamwoord staat bij het mannelijke woord temps.
