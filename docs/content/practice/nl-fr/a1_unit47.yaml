    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Als het regent, blijven we binnen. S''il pleut (als het regent): si + il wordt s''il; daarna zegt on reste à l''intérieur wat je doet.'
    language_code: nl
    direction: ltr
