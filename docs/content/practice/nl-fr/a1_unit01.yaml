templates:
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.choose.001
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frans heeft twee woorden voor ''jij/u'': tu bij vrienden, familie en gelijken, en vous bij onbekenden, in formele situaties en voor meer dan één persoon.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.listen.002
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bonjour kun je op elk moment van de dag tegen iedereen zeggen; salut is alleen voor mensen die je met tu aanspreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.match.003
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tu en vous betekenen allebei ''jij/u'': tu is voor één vriend, familielid of gelijke; vous is voor een onbekende, een formele situatie of meer dan één persoon.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.order.004
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: word_order
  frame:
    text: Comment {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Beide zijn manieren om te vragen hoe het gaat: allez-vous is formeel, vas-tu is informeel.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.translate.005
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bonjour, merci, oui en non veranderen nooit van vorm, maar bijvoeglijke naamwoorden wel: fatigué voor een man, fatiguée voor een vrouw.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.translate.006
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Hoe gaat het met u? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Allez-vous is de formele vraag; met een vriend vraag je comment vas-tu?
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson01.translate.007
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Hoe gaat het? (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vas-tu is de informele vraag, voor vrienden en familie; bij een onbekende vraag je comment allez-vous?
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson02.choose.001
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Enchanté zegt een man en enchantée een vrouw; moi c’est + naam is een informele manier om jezelf voor te stellen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson02.order.002
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Bonjour, je m’appelle {name}.
    language_code: fr
    direction: ltr
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonjour, je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle betekent letterlijk 'ik noem mezelf'; het is de gewone manier om je naam te zeggen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson02.translate.003
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: Mijn naam is {name}.
    language_code: nl
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle gebruik je voor jezelf; om het aan iemand anders te vragen zeg je tu t’appelles comment? of comment vous appelez-vous?
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson03.choose.001
  lesson_content_key: fr.a1.unit01.lesson03.reading_aloud
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je wordt j’ voor een klinker (j’habite), en êtes is de vous-vorm van être, 'zijn'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson04.choose.001
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Op Ça va? antwoord je met très bien of pas mal; met un peu maak je een toestand milder, zoals in un peu fatigué.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson04.match.002
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Fatigué is mannelijk en fatiguée is vrouwelijk: het bijvoeglijk naamwoord past zich aan de persoon aan die het beschrijft.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson04.fill.003
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: fill_in_blank
  frame:
    text: Je suis un peu {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Een man zegt fatigué en een vrouw fatiguée; ze worden verschillend geschreven, maar klinken hetzelfde.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson05.listen.001
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Een quartier is een hele wijk en een rue is één straat; een atelier is een workshop.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson05.order.002
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: Je suis de {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis de {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Être de + plaats zegt waar je vandaan komt; habiter à + plaats zegt waar je woont.
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson05.order.003
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: J’habite à {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite à {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Gebruik à voor de naam van een stad: j’habite à Montreuil, j’habite à Saint-Ouen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-fr.fr.a1.unit01.lesson05.fill.004
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: fill_in_blank
  frame:
    text: Vous {item} dans le quartier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bij vous eindigt het werkwoord op -ez: vous habitez; bij tu is het tu habites.'
    language_code: nl
    direction: ltr
