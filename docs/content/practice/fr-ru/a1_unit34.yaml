schema_version: '1.0'
pack_key: practice.fr-ru.a1.unit34
source_language: fr
target_language: ru
unit_content_key: ru.a1.unit34.neighbourhood
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_давно
    - w_дружелюбный
    - w_здоровается
    - w_здороваться
    - w_здороваюсь
    - w_знает
    - w_знать
    - w_знают
    - w_район
    - w_сосед
    - w_соседа
    - w_супермаркет
    - w_хорошем
templates:
- content_key: practice.fr-ru.ru.a1.unit34.lesson01.choose.001
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_район
        - w_хорошем
        - w_супермаркет
        - w_сосед
        - w_соседа
        - w_знать
        - w_дружелюбный
        - w_здороваться
        - w_здороваюсь
        - w_давно
        - w_здоровается
        - w_знает
        - w_знают
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur le quartier.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson02.listen.001
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur le voisin et la voisine.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson03.translate.001
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur la gentillesse et les salutations.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson04.match.001
  lesson_content_key: ru.a1.unit34.lesson04.nastya_znakomitsya_s_pavlom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot russe à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson05.choose.001
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tirés de la leçon sur qui est qui dans le quartier.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson01.translate.002
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur le quartier.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson01.order.003
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: word_order
  frame:
    text: Мой {item} рядом с супермаркетом.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_район
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой {item} рядом с супермаркетом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Mon quartier est près du supermarché. район signifie « quartier ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson01.fill.004
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: fill_in_blank
  frame:
    text: Я живу в {item} районе в Казани. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: J’habite dans un beau quartier de Kazan. хорошем signifie « bon, beau » (masc., après le mot pour « dans »).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson02.order.002
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: word_order
  frame:
    text: Павел {item} Димы.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_сосед
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел {item} Димы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Pavel est le voisin de Dima. сосед signifie « voisin » (masc.).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson02.fill.003
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: fill_in_blank
  frame:
    text: Моего {item} зовут Павел. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_соседа
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_соседа
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mon voisin s’appelle Pavel. соседа signifie « voisin » (masc., accusatif), comme dans « mon voisin s’appelle ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson03.order.002
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: word_order
  frame:
    text: Павел очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_дружелюбный
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Pavel est très sympathique. дружелюбный signifie « sympathique, amical » (masc.).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson03.fill.003
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: fill_in_blank
  frame:
    text: Павел дружелюбный, и он любит со мной {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_здороваться
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_здороваться
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pavel est sympathique et il aime me dire bonjour. здороваться signifie « dire bonjour, saluer ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson03.translate.004
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: Je dis bonjour à Pavel tous les jours.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_здороваюсь
  answer_derivation:
    kind: render_frame
    frame:
      text: Я каждый день {item} с Павлом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Je dis bonjour à Pavel tous les jours. здороваюсь signifie « je dis bonjour ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit34.lesson05.order.002
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: word_order
  frame:
    text: Павел и Анна хорошо {item} Диму.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_знают
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел и Анна хорошо {item} Диму.
      language_code: ru
      direction: ltr
  feedback_frame:
