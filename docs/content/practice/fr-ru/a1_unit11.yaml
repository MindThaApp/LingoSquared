templates:
- content_key: practice.fr-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les verbes en -ю vont avec я (je me lève : я встаю), tandis que -ете va avec вы (вы встаёте).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Chaque verbe se termine par -ю, car le sujet est я.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Завтракаю est la forme en я du verbe qui signifie prendre le petit-déjeuner.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Встаёте se termine par -ёте, la forme en вы ; la forme en я est встаю.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: Je me lève à sept heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Pour donner une heure, le russe emploie в plus le nombre : в семь часов, à sept heures.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ces verbes sont des formes en я : chacun signifie donc que je fais quelque chose.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ложусь спать signifie littéralement « je m’allonge pour dormir » et c’est la façon habituelle de dire « je me couche ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Спать est l’infinitif « dormir », et ложусь est la forme en я d’un autre verbe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Ложусь спать est un couple figé : le verbe ложусь plus l’infinitif спать.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: fill_in_blank
  frame:
    text: Я работаю с девяти до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'С et до sont suivis du génitif : девять et пять deviennent donc девяти et пяти.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: Je travaille de neuf heures à cinq heures.
    language_code: fr
    direction: ltr
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С ... до ... signifie « de ... à ... » et met les deux nombres au génitif.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: Je me couche à onze heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Après le nombre одиннадцать, le nom est au génitif pluriel : часов.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Делаете et работаете se terminent par -ете, les formes en вы : ils vont donc avec вы.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson03.order.002
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете? demande ce que vous faites ; утром signifie « le matin ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А relie la question à la précédente, et работаете est la forme en вы.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
    text: Что вы {item} вечером? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Делаете est la forme en вы de делать, « faire ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: Que faites-vous le matin ? (forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете утром? associe un mot interrogatif, la forme verbale en вы et un mot de temps.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Понятно signifie littéralement « c’est clair » et c’est la façon habituelle de dire « je vois » ou « compris ».
    language_code: fr
    direction: ltr
