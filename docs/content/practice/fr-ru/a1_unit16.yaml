templates:
- content_key: practice.fr-ru.ru.a1.unit16.lesson01.choose.001
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У меня болит suivi d’une partie du corps indique que cette partie fait mal ; ce qui fait mal est le sujet de болит.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson01.order.002
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: word_order
  frame:
    text: У меня болит {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Болит ne change pas, que la partie du corps soit féminine, masculine ou neutre.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson01.fill.003
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: fill_in_blank
  frame:
    text: У меня болит {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le russe dit littéralement « chez moi fait mal la tête » plutôt que « j’ai mal à la tête ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson01.translate.004
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: J’ai mal au ventre.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот est masculin, mais болит ne change pas.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: J’ai mal à la gorge.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня suivi de болит est la façon courante de décrire un symptôme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.choose.001
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мне плохо signifie de façon générale « je me sens mal », avec мне au sens de « à moi ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.order.002
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: word_order
  frame:
    text: Мне {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо dit comment tu te sens, avec « à moi » au lieu de « je ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.fill.003
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: fill_in_blank
  frame:
    text: У меня {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня suivi de температура signifie « j’ai de la fièvre ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.translate.004
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: Je suis enrhumé(e).
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня suivi d’un nom fonctionne aussi pour les maladies, comme dans У меня простуда.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.translate.005
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: Je me sens mal. (deux mots)
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо décrit comment tu te sens, et non une douleur précise.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.translate.006
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Температура peut signifier « température » ou « fièvre », selon le contexte.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson02.match.007
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Болит est un verbe qui signifie « fait mal » ; les parties du corps голова, живот et горло sont ce qui fait mal.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson03.choose.001
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Много воды utilise воды, une forme de вода après много, au sens de « beaucoup d’eau ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson03.order.002
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: word_order
  frame:
    text: Вам нужно {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам нужно suivi d’un infinitif signifie « vous devez faire quelque chose » ; вам est le « vous » de politesse.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson03.fill.003
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Да, и {item} температура. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ещё ajoute quelque chose de supplémentaire à ce qui a été dit avant.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson03.fill.004
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Вам {item} отдыхать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вам нужно suivi d’un infinitif, « vous devez », est un conseil poli de la part d’un médecin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson03.translate.005
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: Vous devez vous reposer. (vouvoiement)
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам {item} отдыхать.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам est le « vous » de politesse, employé par un médecin avec un patient.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit16.lesson03.translate.006
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: Vous devez boire beaucoup d’eau. (vouvoiement)
    language_code: fr
    direction: ltr
  slots:
    a: *id016
    b: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно пить {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Après много, le nom prend la forme воды : beaucoup d’eau.'
    language_code: fr
    direction: ltr
