templates:
- content_key: practice.fr-ru.ru.a1.unit13.lesson01.choose.001
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le passé change selon le genre : был pour un homme ou un sujet masculin, была pour une femme ou un sujet féminin.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson01.order.002
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: word_order
  frame:
    text: Вчера она {item} дома.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Она est féminin, donc le verbe au passé est была ; avec я dit par un homme, c'est был.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson01.fill.003
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un homme dit я был, une femme dit я была ; le verbe s'accorde avec la personne qui parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson01.fill.004
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера она была {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Дома signifie « à la maison » et ne change pas.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson01.translate.005
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: Hier, j'étais à la maison. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Au passé, le russe n'a pas de forme propre à « je » ; le verbe indique le genre de la personne qui parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson01.translate.006
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: Hier, elle était à la maison.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Была est le passé féminin de быть, « être ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson02.choose.001
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les verbes au passé se terminent en -л pour un sujet masculin et en -ла pour un sujet féminin : ходил, ходила.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson02.match.002
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ходил, смотрел et был se terminent tous en -л ; les formes féminines se terminent en -ла.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson02.order.003
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: word_order
  frame:
    text: Вчера я {item} в кино.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил est le passé masculin, donc cette phrase est dite par un homme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson02.fill.004
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: fill_in_blank
  frame:
    text: Она {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Она est féminin, donc le verbe au passé se termine en -ла : смотрела.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson02.translate.005
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: Hier, je suis allé au cinéma. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил est le passé masculin de ходить ; une femme dit ходила.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson02.translate.006
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: J'ai regardé un film. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} фильм.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Смотрела est le passé féminin ; фильм ne change pas, car c'est un nom masculin inanimé.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson03.choose.001
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le passé de делать est делал pour un homme et делала pour une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson03.order.002
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: word_order
  frame:
    text: Что ты {item} вчера?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал? s'adresse à un homme avec ты ; à une femme, on dirait делала.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson03.fill.003
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я смотрел {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хороший est au masculin pour s'accorder avec фильм.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson03.fill.004
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отдыхала est le passé féminin de отдыхать, « se reposer ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson03.translate.005
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: Qu'est-ce que tu as fait hier ? (familier, à un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал вчера? emploie ты, donc on s'adresse à un ami ; le verbe est au masculin pour un homme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit13.lesson03.translate.006
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: Je me suis reposée. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отдыхала se termine en -ла parce que la personne qui parle est une femme.
    language_code: fr
    direction: ltr
