  answer_derivation:
    kind: render_frame
    frame:
      text: Пожалуйста, {item} медленно.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Говори est l’impératif familier ; la forme de politesse serait говорите.
    language_code: fr
    direction: ltr
