    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Говори {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Медленно signifie « lentement » et garde une seule forme.
    language_code: fr
    direction: ltr
