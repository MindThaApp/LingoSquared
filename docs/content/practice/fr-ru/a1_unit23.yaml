    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Алло est ce que les Russes disent pour répondre au téléphone ou commencer un appel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit23.lesson01.order.002
