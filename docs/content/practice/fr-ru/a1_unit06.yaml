templates:
- content_key: practice.fr-ru.ru.a1.unit06.lesson01.choose.001
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Мой s’emploie avec les noms masculins (мой отец) et моя avec les noms féminins (моя мать) : le possessif change selon le mot de famille.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson01.match.002
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: У меня есть dit littéralement « chez moi il y a », ce qui est la façon de dire « j’ai » en russe ; мой et моя signifient tous deux « mon/ma ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мать est féminin, donc il prend моя ; le masculin отец prend мой.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня есть + un nom est la façon standard de dire que l’on possède quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: C’est mon père.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отец est masculin, donc le possessif est мой ; avec le féminin мать, ce serait моя.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les noms de famille russes ont un genre grammatical : мать et сестра sont féminins, отец est masculin.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Дедушка a l’air féminin à cause de la terminaison -а, mais il est masculin et prend мой : мой дедушка.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это моя {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Бабушка, жена et дочь sont tous féminins, donc chacun prend моя.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson02.order.003
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это мой {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это мой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дедушка, муж et сын sont tous masculins, donc chacun prend мой, même si дедушка se termine par -а.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: fill_in_blank
  frame:
    text: У меня есть сын и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La conjonction и relie deux noms, comme dans сын и дочь : le fils et la fille.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson02.translate.005
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: Avez-vous des enfants ? (forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дети est toujours au pluriel ; У вас есть ...? est la façon polie de demander si quelqu’un possède quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le russe a un mot distinct pour chaque membre de la famille, et n’a pas d’articles.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Эта est le féminin de « ce/cette » ; il va avec девочка ; la forme masculine est этот.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Эта s’accorde avec le nom féminin девочка, alors que Кто это? utilise le это neutre.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
    text: Кто это на {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Фото ne change jamais de terminaison : il reste фото dans На фото.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Qui est-ce sur la photo ?
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кто это? demande qui est quelqu’un ; На фото signifie « sur la photo ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Et qui est cette fille ?
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А au début d’une question la relie à ce qui vient d’être dit, comme « et » en français.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Je m’appelle Olga.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут + un prénom est la façon dont les Russes se présentent.
    language_code: fr
    direction: ltr
