  frame:
    text: Я {item} выставку.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_осматриваю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} выставку.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Je visite l’exposition. осматриваю signifie « je visite, je regarde (un lieu à voir) ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit50.lesson04.order.002
  lesson_content_key: ru.a1.unit50.lesson04.v_muzee
  type: word_order
  frame:
