  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur Dima, Nina et Nastya au musée.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit50.lesson01.order.002
  lesson_content_key: ru.a1.unit50.lesson01.ya_khochu_poyti_v
  type: word_order
  frame:
    text: Я хочу {item} музей.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_посетить
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item} музей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Je veux visiter le musée. посетить signifie « visiter ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit50.lesson02.order.002
