schema_version: '1.0'
pack_key: practice.fr-ru.a1.unit32
source_language: fr
target_language: ru
unit_content_key: ru.a1.unit32.birthday
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вечеринка
    - w_восемнадцатого
    - w_мило
    - w_начнём
    - w_отметим
    - w_отмечаем
    - w_отмечать
    - w_подарок
    - w_поздравляю
    - w_пригласишь
    - w_приглашает
    - w_приглашать
    - w_приглашаю
    - w_приглашают
    - w_приглашу
    - w_придёшь
    - w_рады
    - w_рождения
    - w_удовольствием
    - w_устраиваем
templates:
- content_key: practice.fr-ru.ru.a1.unit32.lesson01.choose.001
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_рождения
        - w_восемнадцатого
        - w_отмечать
        - w_отмечаем
        - w_вечеринка
        - w_приглашать
        - w_приглашаю
        - w_приглашают
        - w_придёшь
        - w_удовольствием
        - w_отметим
        - w_устраиваем
        - w_пригласишь
        - w_приглашу
        - w_приглашает
        - w_рады
        - w_поздравляю
        - w_подарок
        - w_мило
        - w_начнём
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur l’anniversaire.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson02.listen.001
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la fête et la manière de célébrer.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson03.translate.001
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur l’invitation à la fête.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson04.match.001
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot russe à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson05.choose.001
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la répartition des tâches pour la fête.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson06.translate.001
  lesson_content_key: ru.a1.unit32.lesson06.vecherinka_v_yazykovom_kafe
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la fête au café des langues.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Mon anniversaire est le dix-huit avril. рождения signifie « naissance » (au génitif, dans « anniversaire »).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson01.fill.003
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: fill_in_blank
  frame:
    text: День рождения Лены в субботу, {item} апреля. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'L’anniversaire de Lena est le samedi 18 avril. Лены est le génitif de Лена et marque la possession : день рождения Лены, sans mot pour « de ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson02.order.002
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: word_order
  frame:
    text: Мы {item} день рождения Лены.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отмечаем
  answer_derivation:
    kind: render_frame
    frame:
      text: Мы {item} день рождения Лены.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nous fêtons l’anniversaire de Lena. отмечаем signifie « nous fêtons ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson03.order.002
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: word_order
  frame:
