      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашаю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} тебя.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Je t’invite. приглашаю signifie « j’invite ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit32.lesson03.fill.003
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
