schema_version: '1.0'
pack_key: practice.fr-ru.a1.unit43
source_language: fr
target_language: ru
unit_content_key: ru.a1.unit43.accommodation
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
