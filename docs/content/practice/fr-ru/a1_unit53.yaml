- content_key: practice.fr-ru.ru.a1.unit53.lesson01.order.002
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: word_order
  frame:
    text: Рынок был хороший, а теперь я хочу пойти в {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортзал
  answer_derivation:
    kind: render_frame
    frame:
      text: Рынок был хороший, а теперь я хочу пойти в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Le marché était sympa, et maintenant je veux aller à la salle de sport. спортзал signifie « salle de sport ».
    language_code: fr
    direction: ltr
