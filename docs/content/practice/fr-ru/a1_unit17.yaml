    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Офис prend la terminaison du prépositif -е après в : в офисе.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.translate.006
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
