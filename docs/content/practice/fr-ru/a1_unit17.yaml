  answer_derivation:
    kind: render_frame
    frame:
      text: Он {item} в офисе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Работает est la forme « il » ou « elle » de работать, « travailler ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.fill.004
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: fill_in_blank
  frame:
    text: Я работаю в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Après в, qui signifie « dans » ou « à », le nom prend la terminaison du prépositif -е : больница devient больнице.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.fill.005
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
