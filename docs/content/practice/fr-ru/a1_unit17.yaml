    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ресторан prend la terminaison du prépositif -е après в : в ресторане.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.translate.005
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: Quel est ton métier ? (familier)
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Кем ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кем interroge sur le métier de quelqu’un, et ты indique une question familière.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.translate.006
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: Je travaille dans un magasin.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Магазин devient магазине après в : dans un magasin.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.translate.007
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: Elle est cuisinière. Elle travaille dans un restaurant.
    language_code: fr
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Она {a}. Она работает в {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Повар reste masculin dans sa forme, même quand il désigne une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.listen.010
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
