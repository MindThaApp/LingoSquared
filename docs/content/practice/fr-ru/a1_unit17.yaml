  frame:
    text: Je suis médecin.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Aucun article n’est nécessaire devant un nom de métier.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.translate.007
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: Il travaille au bureau.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Он работает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: В suivi de la terminaison du prépositif -е répond à la question « où ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.translate.008
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: Elle est enseignante. Elle travaille à l’école.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Она учитель. Она работает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Школа devient школе après в : à l’école.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson01.translate.009
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
