    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les noms de métiers comme врач et инженер gardent la même forme pour les hommes et les femmes : Она врач.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.choose.001
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Кем ты работаешь ? demande littéralement « en tant que qui travailles-tu ? », c’est ainsi que les Russes demandent quel est ton métier.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.order.002
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: word_order
  frame:
    text: Кем ты {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Кем ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Работаешь est la forme familière en ты de работать.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.fill.003
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: fill_in_blank
  frame:
    text: Кем ты {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La terminaison -ешь de la forme en ты indique que c’est toi qui travailles, de façon familière.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit17.lesson02.fill.004
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
