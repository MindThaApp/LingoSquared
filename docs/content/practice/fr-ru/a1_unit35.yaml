schema_version: '1.0'
pack_key: practice.fr-ru.a1.unit35
source_language: fr
target_language: ru
unit_content_key: ru.a1.unit35.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_адрес
    - w_бабушке
    - w_дедушке
    - w_домой
    - w_идти
    - w_марка
    - w_отправляю
    - w_писать
    - w_письмо
    - w_пишет
    - w_пишу
    - w_покупает
    - w_посылка
    - w_почте
    - w_прийти
    - w_сотрудник
templates:
- content_key: practice.fr-ru.ru.a1.unit35.lesson01.choose.001
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_письмо
        - w_посылка
        - w_отправляю
        - w_дедушке
        - w_бабушке
        - w_марка
        - w_адрес
        - w_писать
        - w_пишу
        - w_прийти
        - w_идти
        - w_сотрудник
        - w_покупает
        - w_почте
        - w_пишет
        - w_домой
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la lettre et le colis.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit35.lesson02.listen.001
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
