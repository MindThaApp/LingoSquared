templates:
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En russe, le nom change après un nombre : один рубль, два рубля, пять рублей.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Après 2, 3 et 4, le nom prend une forme particulière (два брата, три рубля) ; à partir de 5, il se met au génitif pluriel (пять рублей).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Avec les nombres 2 à 4, le nom change d’une façon (брат devient брата) ; à partir de 5, d’une autre (книга devient книг).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Два, три et четыре demandent tous la même forme du nom, брата : n’importe lequel convient ici.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Après пять et tous les nombres supérieurs, le nom est au génitif pluriel : рублей, et non рубль.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: J’ai deux frères.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата dit littéralement « chez moi (il y a) deux frères » ; брата est la forme utilisée après 2, 3 et 4.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Apprends d’abord les formes de comptage (один, два, три, четыре, пять) ; le nom qui suit change ensuite, comme dans один рубль, два рубля, пять рублей.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les nombres de 5 à 10 demandent tous le nom au génitif pluriel : пять книг, девять книг, десять книг.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Après les nombres de 5 à 10, le nom est au génitif pluriel : книга devient книг.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Les Russes disent leur âge avec мне, littéralement « à moi », et à partir de 5, le nom est лет.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Après les nombres à partir de cinq, l’âge s’exprime avec лет, au génitif pluriel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: J’ai dix ans.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: L’âge s’exprime avec мне, « à moi », puis le nombre et лет ; il n’y a pas de verbe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Quel âge avez-vous ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? utilise вам, la forme de politesse, littéralement « à vous » ; la question signifie « combien d’années à vous ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le russe dit Сколько стоит? pour un seul article et Сколько стоят? pour plusieurs : le verbe s’accorde avec ce qu’on achète.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? est la question universelle pour demander un prix ; стоит est la forme employée pour une seule chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки est au pluriel, donc le verbe est стоят ; pour un seul article (хлеб), ce serait стоит.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Combien coûte le pain ?
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб est un seul article, donc le verbe est стоит ; avec яблоки au pluriel, ce serait стоят.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Trois roubles.
    language_code: fr
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Après три, le nom prend sa forme рубля (2 à 4), différente de рублей à partir de 5.
    language_code: fr
    direction: ltr
