    frame:
      text: Я вижу {item} горки и очередь.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Je vois les montagnes russes et la file d’attente. американские signifie « américaines » (pluriel, comme dans le nom russe des montagnes russes).
    language_code: fr
    direction: ltr
