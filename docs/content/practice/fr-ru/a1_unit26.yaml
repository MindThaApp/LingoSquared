  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: word_order
  frame:
    text: У Лены волосы {item}, чем у Игоря.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_длиннее
  answer_derivation:
    kind: render_frame
    frame:
      text: У Лены волосы {item}, чем у Игоря.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Lena a les cheveux plus longs qu’Igor. У Лены волосы длиннее, чем у Игоря : длиннее ne change jamais, et чем (que) introduit la seconde partie.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit26.lesson06.order.002
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
