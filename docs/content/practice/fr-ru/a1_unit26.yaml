    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot russe à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
