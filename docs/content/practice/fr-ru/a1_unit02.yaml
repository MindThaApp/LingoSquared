templates:
- content_key: practice.fr-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le russe a deux mots pour « tu/vous » : ты pour les amis, la famille, les enfants et les personnes de même âge ou statut, et вы pour les inconnus, les personnes que l’on respecte, ou plusieurs personnes.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как вас зовут? est la formule de politesse pour « Comment vous appelez-vous ? » ; littéralement, elle demande comment on vous appelle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут signifie littéralement « on m’appelle » ; le prénom qui suit reste donc à sa forme de base.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Зовут apparaît dans la question comme dans la réponse : Как вас зовут? et Меня зовут Виктор.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: Je m’appelle {name}.
    language_code: fr
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Les Russes se présentent avec Меня зовут suivi d’un prénom ; ajouter le patronyme, comme dans Ирина Петровна, est plus formel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: Comment vous appelez-vous ? (forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вас est la forme de вы employée dans cette question ; avec un ami, on demande Как тебя зовут?
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Откуда вы? demande d’où l’on vient, et la réponse reprend из suivi du lieu : Я из Канады, Я из Москвы.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Можно на ты? demande poliment de passer de вы à ты ; par convention, c’est la personne la plus âgée ou la plus haut placée qui le propose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Ты s’emploie avec les personnes que l’on connaît bien et вы dans les contacts formels : choisir entre les deux fait partie de chaque conversation.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Из est suivi du génitif : Канада devient Канады et Москва devient Москвы.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давайте перейдём на ты propose d’abandonner le ton formel ; la proposition elle-même reste polie grâce à давайте.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меня est la forme complément de я, d’où Меня зовут dans la réponse, littéralement « on m’appelle ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: D’où venez-vous ? (forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Откуда signifie « d’où » ; la question de politesse emploie вы et la réponse emploie из suivi du lieu.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Очень приятно signifie littéralement « très agréable » et c’est la réponse habituelle après avoir entendu le nom de quelqu’un.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давайте suivi d’un verbe à la forme « nous » forme une suggestion polie : Давайте познакомимся signifie « Faisons connaissance ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давайте познакомимся est une façon polie de commencer une présentation avec quelqu’un que l’on vouvoie (вы).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: Enchanté.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Очень приятно s’emploie aussi bien avec ты qu’avec вы, car la formule ne s’adresse pas directement à la personne.
    language_code: fr
    direction: ltr
