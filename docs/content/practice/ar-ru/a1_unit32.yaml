- content_key: practice.ar-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: عيد ميلادي في الثامن عشر من نيسان (أبريل). рождения تعني «ميلاد» (في حالة الجر، في عبارة «عيد ميلاد»).
    language_code: ar
    direction: rtl
