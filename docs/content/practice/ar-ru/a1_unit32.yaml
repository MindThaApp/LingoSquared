    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'عيد ميلاد لينا يوم السبت، الثامن عشر من نيسان (أبريل). Лены هي حالة الجر من Лена وتدل على الملكية: день рождения Лены، دون كلمة تقابل «ـ» الإضافة.'
    language_code: ar
    direction: rtl
