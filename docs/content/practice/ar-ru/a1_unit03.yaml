  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يتغير الاسم الروسي بعد الأعداد: один рубль، два рубля، пять рублей.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
