    slot: item
  feedback_frame:
    text: 'الأعداد من 5 إلى 10 كلها تأخذ اسماً بصيغة الجمع المجرور: пять книг، девять книг، десять книг.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
