  feedback_frame:
    text: بعد الأعداد 5–10 يأتي الاسم بصيغة الجمع المجرور، فتصبح книга ← книг.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: يعبّر الروس عن العمر بكلمة мне، وتعني حرفياً «لي»، وبعد 5 فما فوق تكون كلمة السنوات лет.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد الأعداد من خمسة فما فوق يُعبَّر عن العمر بكلمة лет بصيغة الجمع المجرور.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: عمري عشر سنوات.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: يُعبَّر عن العمر بكلمة мне (أي «لي») ثم العدد ثم лет؛ ولا يوجد فعل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: كم عمرك؟ (رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'تستخدم Сколько вам лет؟ كلمة вам الدالة على الاحترام، وتعني حرفياً «لكم»؛ والسؤال: كم سنة لكم؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تقول الروسية Сколько стоит؟ عن سلعة واحدة وСколько стоят؟ عن عدة سلع، فيتفق الفعل مع ما يُشترى.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит؟ هو سؤال «بكم؟» العام؛ وstоит هي الصيغة المستعملة لشيء واحد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمة Яблоки جمع، لذا يكون الفعل стоят؛ أما لسلعة واحدة (хлеб) فيكون стоит.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: بكم الخبز؟
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: كلمة Хлеб سلعة واحدة، لذا يكون الفعل стоит؛ ومع الجمع яблоки يكون стоят.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: ثلاثة روبلات.
    language_code: ar
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد три يأخذ الاسم صيغة 2–4 وهي рубля، وتختلف عن рублей بعد 5 فما فوق.
    language_code: ar
    direction: rtl
