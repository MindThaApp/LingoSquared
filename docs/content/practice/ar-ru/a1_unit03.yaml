    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بعد 2 و3 و4 يأخذ الاسم صيغة خاصة (два брата، три рубля)، ومن 5 فما فوق يأتي بصيغة الجمع المجرور (пять рублей).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
