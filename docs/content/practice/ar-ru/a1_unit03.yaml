    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: مع الأعداد 2–4 يتغير الاسم بطريقة (брат ← брата)، ومع الأعداد من 5 فما فوق بطريقة أخرى (книга ← книг).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: الأعداد Два وthree وчетыре كلها تأخذ صيغة الاسم نفسها، брата، فأي منها يناسب هنا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد пять وكل عدد أكبر منه يأتي الاسم بصيغة الجمع المجرور: рублей وليس рубль.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: عندي أخوان.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تعني У меня два брата حرفياً «عندي (يوجد لديّ) أخوان»؛ وصيغة брата هي المستعملة بعد 2 و3 و4.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعلّم أولاً صيغ العدّ (один، два، три، четыре، пять)؛ ثم يتغير الاسم بعدها، كما في один рубль، два рубля، пять рублей.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
