    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تضع الجملة Встреча во вторник, девятого января اليوم أولًا والتاريخ ثانيًا، مع الشهر في حالة الجر.
    language_code: ar
    direction: rtl
