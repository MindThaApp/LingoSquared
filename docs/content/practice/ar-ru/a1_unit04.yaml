  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يتكوّن التاريخ من عدد ترتيبي محايد + الشهر في حالة الجر: десятое апреля تعني «العاشر من أبريل».'
    language_code: ar
    direction: rtl
