  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تنتهي الأعداد الترتيبية في التواريخ بـ -ое أو -ье لأنها تتوافق مع число المحايد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: ما تاريخ اليوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Какое сегодня число? يعني حرفيًا: أي عدد هو اليوم؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: اليوم هو الثالث من يناير.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'يُقال «الثالث من يناير» في الروسية: третье января، ويأتي الشهر في حالة الجر.'
    language_code: ar
    direction: rtl
