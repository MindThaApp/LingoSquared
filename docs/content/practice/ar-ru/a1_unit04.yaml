      language_code: ru
      direction: ltr
  feedback_frame:
    text: تحذف الروسية فعل الكينونة في الحاضر، فجملة Сегодня суббота تتألف ببساطة من «اليوم» + اسم اليوم.
    language_code: ar
    direction: rtl
