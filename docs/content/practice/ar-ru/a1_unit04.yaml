  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تُكتب أسماء أيام الأسبوع في الروسية بحرف صغير، ولا يلزم فعل في الزمن الحاضر: Сегодня суббота تعني «اليوم هو السبت».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit04.lesson01.listen.002
