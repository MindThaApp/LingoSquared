    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник تعني «يوم الثلاثاء»؛ وво هي الصيغة الموسَّعة من в المستخدمة هنا.
