    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قبل вторник يصبح حرف الجر во (во вторник)، أما قبل معظم الأيام الأخرى فيبقى в ببساطة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
