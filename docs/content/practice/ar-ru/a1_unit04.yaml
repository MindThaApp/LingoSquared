  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? يسأل عن يوم الأسبوع؛ أما للسؤال عن التاريخ فتقول Какое сегодня число?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
