  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: هل لديكم أطفال؟ (بصيغة رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: كلمة Дети جمع دائمًا؛ وУ вас есть ...? هي الصيغة الرسمية للسؤال عمّا إذا كان لدى أحد شيء ما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: في الروسية كلمة مستقلة لكل قريب، ولا توجد أداة تعريف ولا تنكير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Эта هي صيغة المؤنث لـ«هذا»، لذلك تناسب девочка؛ وصيغة المذكّر هي этот.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تتوافق Эта مع الاسم المؤنث девочка، بينما تستخدم Кто это? الصيغة المحايدة это.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
