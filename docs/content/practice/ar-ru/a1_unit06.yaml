  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تبدو كلمة Дедушка مؤنثة بسبب النهاية -а، لكنها مذكّرة وتأخذ мой: мой дедушка.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
