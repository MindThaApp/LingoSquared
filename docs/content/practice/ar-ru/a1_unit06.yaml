    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمة Фото لا تتغير نهايتها أبدًا، لذلك تبقى фото في На фото.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: من هذا في الصورة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кто это? تسأل عن هوية شخص ما؛ وНа фото تعني «في الصورة».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: ومن هذه الفتاة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: الحرف А في بداية السؤال يربطه بما قيل قبله، مثل «و» في العربية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: اسمي أولغا.
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут مع اسم علم هي طريقة تعريف الروس بأنفسهم.
    language_code: ar
    direction: rtl
