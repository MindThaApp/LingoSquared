  feedback_frame:
    text: الكلمات дедушка وмуж وсын كلها مذكّرة، لذا تأخذ كل واحدة منها мой، مع أن дедушка تنتهي بـ -а.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
