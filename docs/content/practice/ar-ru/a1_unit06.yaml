    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: У меня есть تعني حرفيًا "عندي يوجد"، وهكذا يعبّر الروسية عن "لديّ"؛ وكلٌّ من мой وмоя تعني "my".
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمة мать مؤنثة، لذلك تأتي معها моя؛ أما отец المذكّرة فتأتي معها мой.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: التركيب У меня есть مع اسم هو الطريقة المعتادة للتعبير عن امتلاك شيء ما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: هذا أبي.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: كلمة отец مذكّرة، لذلك يكون ضمير الملكية мой؛ أما مع мать المؤنثة فيكون моя.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'لأسماء الأسرة في الروسية جنس نحوي: мать وсестра مؤنثتان، وотец مذكّر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
