templates:
- content_key: practice.ar-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите أمر مهذّب بصيغة «вы» ومعناه «اذهب/اذهبوا»؛ أما مع «ты» فيُقال иди.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تُربط الاتجاهات بكلمة потом أي «ثم»: Идите прямо, потом направо.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تعني До «إلى/حتى» وتأتي بعدها حالة المضاف إليه (الجر)، لذا يصبح музей ← музея.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Прямо «إلى الأمام مباشرة» ولا تتغير نهايتها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: كيف أصل إلى المتحف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? سؤال عن كيفية الوصول إلى مكان سيرًا على الأقدام؛ ويأتي المكان بعد до في حالة الجر (الإضافة).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: سِر إلى الأمام ثم يمينًا. (بصيغة المخاطب المهذّب)
    language_code: ar
    direction: rtl
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо هي الصيغة المعتادة لإرشادات قصيرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните أمر مهذّب بصيغة «вы» ومعناه «انعطف»؛ وتحدد налево وнаправо الاتجاه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تصلح налево وнаправо كلتاهما بعد поверните.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تأتي За هنا مع حالة الأداة، لذا يصبح угол ← углом؛ وза углом تعني «عند الزاوية / خلف الزاوية».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد 2 و3 و4 يأخذ الاسم صيغة خاصة: два квартала، لكن пять кварталов.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: هل هو بعيد من هنا؟
    language_code: ar
    direction: rtl
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко تعني «بعيد»، وотсюда تعني «من هنا»؛ وЭто далеко отсюда? سؤال شائع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал هو المجمّع السكني (الحيّ بين شارعين)، وдалеко تعني «بعيد».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите طريقة مهذّبة بصيغة «вы» للفت انتباه شخص غريب، مثل «عفوًا».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто تعني «هذا سهل جدًا»؛ ولا حاجة إلى فعل «يكون».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد пять يأتي الاسم في الجمع بحالة الجر: пять минут.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: هذا سهل جدًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد это تعمل просто خبرًا بمعنى «سهل»، فلا حاجة إلى فعل «يكون».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: خمس دقائق سيرًا على الأقدام.
    language_code: ar
    direction: rtl
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком تعني «سيرًا على الأقدام»، وминут تأتي بعد пять في الجمع بحالة الجر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий اسم مذكر أصله صفة، ومعناه «المارّ».
    language_code: ar
    direction: rtl
