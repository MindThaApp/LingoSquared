        - w_табличка
        - w_солнечный
        - w_собаки
        - w_поводке
        - w_устроим
        - w_пикник
        - w_фрукты
        - w_сядем
        - w_скамейка
        - w_рынке
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس: هل نذهب إلى الحديقة؟'
    language_code: ar
    direction: rtl
