  lesson_content_key: ru.a1.unit52.lesson01.poydyom_v_park
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_прогулка
        - w_дерево
        - w_трава
        - w_зелёная
        - w_утка
        - w_воде
        - w_холодная
        - w_утки
