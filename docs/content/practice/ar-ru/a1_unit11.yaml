templates:
- content_key: practice.ar-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'الأفعال المنتهية بـ -ю تأتي مع я (أستيقظ: я встаю)، أما النهاية -ете فتأتي مع вы (вы встаёте).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ينتهي كل فعل بـ -ю لأن الفاعل هو я.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Завтракаю» هي صيغة я من الفعل الذي يعني «تناول الفطور».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تنتهي «Встаёте» بـ -ёте، وهي صيغة вы؛ أما صيغة я فهي встаю.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: أستيقظ في الساعة السابعة.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'عند ذكر الساعة تستخدم الروسية в مع العدد: в семь часов، أي «في الساعة السابعة».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هذه الأفعال بصيغة я، ولذلك يدل كل منها على أنني أقوم بفعل ما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تعني «Ложусь спать» حرفيًا «أستلقي لأنام»، وهي الطريقة المعتادة للتعبير عن «أذهب إلى النوم».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: «Спать» مصدر بمعنى «ينام»، أما «ложусь» فهي صيغة я من فعل آخر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«Ложусь спать» تركيب ثابت: الفعل ложусь مع المصدر спать.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: fill_in_blank
  frame:
    text: Я работаю с девяти до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد С وдо يأتي المضاف إليه (الجرّ بصيغة الجنيتيف)، فتصبح девять وпять: девяти وпяти.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: أعمل من التاسعة إلى الخامسة.
    language_code: ar
    direction: rtl
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «С ... до ...» تعني «من ... إلى ...»، ويأتي العددان معها بصيغة الجنيتيف.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: أنام في الساعة الحادية عشرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'بعد العدد одиннадцать يأتي الاسم بصيغة الجمع في الجنيتيف: часов.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تنتهي «Делаете» و«работаете» بـ -ете، وهي صيغ вы، ولذلك تأتي مع вы.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson03.order.002
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«Что вы делаете?» تسأل «ماذا تفعل؟»، وتعني «утром»: «في الصباح».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تربط «А» السؤال بالسؤال السابق، و«работаете» هي صيغة вы.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
    text: Что вы {item} вечером? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Делаете» هي صيغة вы من الفعل делать بمعنى «يفعل».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: ماذا تفعل في الصباح؟ (بصيغة رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تجمع «Что вы делаете утром?» بين أداة استفهام وفعل بصيغة вы وكلمة تدل على الوقت.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تعني «Понятно» حرفيًا «واضح»، وهي الطريقة المعتادة للقول: «فهمت».'
    language_code: ar
    direction: rtl
