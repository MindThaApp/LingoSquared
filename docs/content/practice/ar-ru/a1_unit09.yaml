  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: يوجد بنك في شارعي.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть تُستعمل للتعبير عن الملكية؛ أما لما يوجد في شارع فتقول الروسية На моей улице есть.
    language_code: ar
    direction: rtl
