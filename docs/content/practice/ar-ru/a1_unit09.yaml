  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: ماذا يوجد في شارعكم؟ (بصيغة الاحترام)
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: يسأل Что есть на вашей улице? عمّا يوجد في الشارع؛ وصيغة вы في вашей تجعل السؤال مهذبًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: شكرًا جزيلًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تتطابق Большое مع спасибо الذي يُعامل معاملة المحايد، ولذلك تنتهي بـ -ое.
    language_code: ar
    direction: rtl
