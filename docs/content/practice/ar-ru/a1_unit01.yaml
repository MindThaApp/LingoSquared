templates:
- content_key: practice.ar-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'كثير من الحروف السيريلية تشبه حروفًا لاتينية لكنها تُنطق بشكل مختلف: р هو الراء، و в هو الفاء المجهورة (V)، و у هو الواو الممدودة كما في «نور»، و й هو ياء قصيرة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'بعض الحروف السيريلية مخادعة: р تشبه P لكنها راء، و е تشبه E لكنها تُنطق «يە» (ye) في أول الكلمة؛ وكلمة здравствуйте تحتوي على الحرفين.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تُكتب الروسية بالحروف السيريلية؛ وأول كلمة تتعلمها، здравствуйте، تضم الحروف з وд وр وа وв وс وт وу وй وе.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: مرحبًا! (رسمي، كلمة واحدة)
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Здравствуйте» هي تحية رسمية للغرباء ولعدة أشخاص معًا؛ وحرف в الأول صامت، فتُنطق «زدراستفويتيه» تقريبًا (zdrAstvuyte).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تتبع التحيات الروسية وقت اليوم: доброе утро (الصباح)، добрый день (النهار)، добрый вечер (المساء). كلمة утро محايدة، أما день وвечер فمذكّرتان، لذلك تتغير نهاية الصفة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Привет» هي تحية عفوية للأصدقاء والعائلة؛ ومع الغرباء استخدم здравствуйте أو تحية بحسب وقت اليوم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تأتي «Добрый» مع الأسماء المذكّرة مثل день وвечер، أما كلمة утро المحايدة فتأخذ «доброе».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
    text: Доброе {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمة утро اسم محايد، لذلك تستخدم التحية доброе وليس добрый.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لا توجد في الروسية أداة تعريف ولا تنكير، فالجواب بكلمة واحدة هو الكلمة مجردة، مثل утро أو завтра.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: «Привет» تحية عفوية، أما «здравствуйте» فهي التحية الرسمية التي تستخدمها مع الغرباء.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Как дела?» هو السؤال اليومي المعتاد بين الأصدقاء (ты)، أما «Как поживаете?» فتنتهي بصيغة вы وتبدو أكثر رسمية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Пока» وداع عفوي، أما «до свидания» فهي وداع محايد أو رسمي.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«Как дела?» يعني حرفيًا: كيف تجري الأمور؟ وبعد «Привет» هو السؤال العفوي بين الأصدقاء.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تنتهي «Поживаете» بـ -ете، أي صيغة вы، لذلك تتناسب مع «здравствуйте» الرسمية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.fill.005
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: Хорошо, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Хорошо, спасибо» هو الرد المعتاد على «Как дела?» ومعناه أن الأمور بخير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «До» تعني «حتى»، لذا «До завтра!» هي العبارة اليومية لقول «أراك غدًا».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.translate.007
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: بخير، شكرًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Хорошо, спасибо» هو الرد المهذب المعتاد على «Как дела?» ويصلح مع ты ومع вы.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit01.lesson03.translate.008
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: أراك غدًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: До {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «До завтра!» تستخدم до بمعنى «حتى» مع завтра بمعنى «غدًا».
    language_code: ar
    direction: rtl
