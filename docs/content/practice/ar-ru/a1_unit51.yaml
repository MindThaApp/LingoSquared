    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit51.lesson01.order.002
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: word_order
  frame:
    text: Я хочу пойти на концерт {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группы
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу пойти на концерт {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: أودّ الذهاب إلى حفل الفرقة، من فضلك. تعني группы «الفرقة» (في حالة الإضافة).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit51.lesson02.order.002
  lesson_content_key: ru.a1.unit51.lesson02.ya_khochu_kupit_bilet
  type: word_order
  frame:
    text: У меня хорошее {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_место
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня хорошее {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: لديّ مكان جيد. تعني место «مكان، مقعد».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit51.lesson03.order.002
  lesson_content_key: ru.a1.unit51.lesson03.vo_skolko_nachinaetsya_kontsert
  type: word_order
  frame:
    text: Концерт {item} два часа.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_длится
  answer_derivation:
    kind: render_frame
    frame:
      text: Концерт {item} два часа.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: يستمر الحفل ساعتين. تعني длится «يستمر».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit51.lesson04.order.002
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: word_order
  frame:
    text: Да, мне нужен билет на {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группу
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нужен билет на {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: نعم، أريد تذكرة للفرقة، من فضلك. تعني группу «الفرقة» (في حالة المفعول به، بعد حرف «для»).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit51.lesson06.order.002
  lesson_content_key: ru.a1.unit51.lesson06.dima_nina_i_nastya
  type: word_order
  frame:
    text: Концерт был {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_потрясающий
  answer_derivation:
    kind: render_frame
    frame:
      text: Концерт был {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: كان الحفل رائعًا. تعني потрясающий «رائع، مذهل» (مذكر).
    language_code: ar
    direction: rtl
