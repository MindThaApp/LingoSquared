  type: word_order
  frame:
    text: У Лены волосы {item}, чем у Игоря.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_длиннее
  answer_derivation:
    kind: render_frame
    frame:
      text: У Лены волосы {item}, чем у Игоря.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'شعر لينا أطول من شعر إيغور. У Лены волосы длиннее, чем у Игоря: لا تتغير длиннее أبدًا، وتبدأ чем («من») الجزء الثاني.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit26.lesson06.order.002
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
