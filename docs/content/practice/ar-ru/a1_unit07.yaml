  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: من فضلك، أحضروا مثلجات للحلوى. (بصيغة المخاطبة المهذبة)
    language_code: ar
    direction: rtl
  slots:
    a: *id016
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое {a} {b}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое принесите мороженое طريقة طبيعية لطلب الحلوى من النادل.
    language_code: ar
    direction: rtl
