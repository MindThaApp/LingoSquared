    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تنتهي Мороженое بـ -ое لأنها اسم محايد مشتق من صفة، مثل сладкое.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson03.order.002
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: На сладкое принесите {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое принесите {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое تعني «للحلوى»، وпринесите هي صيغة الأمر المهذبة مع вы بمعنى «أحضروا».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson03.order.003
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: Что будете {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Что будете {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Что будете пить? سؤال النادل: будете مع المصدر.'
    language_code: ar
    direction: rtl
