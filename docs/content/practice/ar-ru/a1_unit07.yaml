    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: أريد حساء البورش وسلطة.
    language_code: ar
    direction: rtl
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат هو الطلب الوارد في الحوار؛ ولا تستخدم الروسية أداة تعريف أو تنكير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
