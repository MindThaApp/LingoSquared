templates:
- content_key: practice.ar-ru.ru.a1.unit07.lesson01.choose.001
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Официант هو النادل، وофициантка هي النادلة؛ يُشكَّل المؤنث بإضافة -ка.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson01.order.002
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: word_order
  frame:
    text: Этот {item} свободен?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Этот {item} свободен?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Этот هو اسم الإشارة «هذا» للمذكر، لذلك يأتي مع الأسماء المذكرة مثل столик وстол؛ وكلمة свободен أيضًا مذكرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson01.fill.003
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: fill_in_blank
  frame:
    text: Да, {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تنتهي Садитесь بـ -тесь، وهي صيغة الأمر المهذبة مع вы، يستخدمها العاملون عند مخاطبة الضيوف.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson01.match.004
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Свободен صفة مذكرة تتفق مع столик؛ والسؤال Этот столик свободен? يعني: هل هذه الطاولة شاغرة؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson01.translate.005
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: تفضّل القائمة.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вот {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: كلمة Меню لا تتغير نهايتها أبدًا، وكلمة Вот تعني «تفضّل/ها هو».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson01.translate.006
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: ماذا ستطلبون؟ (بصيغة المخاطبة المهذبة)
    language_code: ar
    direction: rtl
  slots:
    aux: *id005
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Что {aux} {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تستخدم Что будете заказывать? صيغة вы будете مع المصدر لسؤال الضيف عمّا سيطلبه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit07.lesson02.choose.001
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
