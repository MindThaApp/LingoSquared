  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Принесите صيغة الأمر المهذبة مع вы بمعنى «أحضروا»؛ ومع ты تصبح принеси.
    language_code: ar
    direction: rtl
