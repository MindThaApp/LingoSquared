templates:
- content_key: practice.ar-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? تعني حرفيًّا «أي ساعة؟»، وСейчас تعني «الآن»؛ وهما معًا السؤال والجواب المعتادان للوقت.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يتوقف شكل الاسم بعد العدد على العدد نفسه: час بعد 1، وчаса بعد 2–4، وчасов بعد 5 فأكثر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد 2 و3 و4 يأتي الاسم بصيغة часа، كما في два часа وтри часа.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ابتداءً من خمسة فأكثر يأتي الاسم بصيغة الجمع المجرور часов: пять часов، десять часов.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: كم الساعة الآن؟
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? تعني حرفيًّا «أي ساعة؟»، وهي الطريقة المعتادة لسؤال الوقت.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تبني الروسية السؤال غالبًا بأداة الاستفهام أولًا ثم الفعل: Когда отходит поезд?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром وднём وвечером وночью ظروف تنتهي بـ -ом أو -ём أو -ью، وتُستخدم دون حرف جر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'أوقات اليوم في الروسية ظروف: утром، днём، вечером، ночью.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد الساعة، تعني дня «بعد الظهر»، كما تعني утра «صباحًا» وвечера «مساءً».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? هو سؤال عن وقت حدوث أمر ما، لا عن الساعة الحالية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تأتي كلمات الوقت الروسية مثل утром وвечером وحدها دون حرف جر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: في الساعة السابعة مساءً.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'بعد الساعة يأتي وقت اليوم بصيغة المجرور: семь часов вечера.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عبارة Скажите, пожалуйста طريقة مهذبة لبدء سؤال شخص غريب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите أمر مهذب بصيغة вы يعني «قل لي»، وпожалуйста تلطّف الطلب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит صيغة الغائب المفرد من الفعل، لذلك تتفق مع поезд المفرد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد الساعة تعني утра «صباحًا»، فـ восемь часов утра تعني الثامنة صباحًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: متى يغادر القطار؟
    language_code: ar
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تسأل Когда عن الوقت، ويتفق الفعل отходит مع الاسم المفرد поезд.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: في الساعة الثانية بعد الظهر.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: تُستعمل дня مع ساعات ما بعد الظهر، بينما تُستعمل утра للصباح وвечера للمساء.
    language_code: ar
    direction: rtl
