    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'In rumeno il possessivo segue il nome: mama mea, non mea mama.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit05.lesson02.choose.001
