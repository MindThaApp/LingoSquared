    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați? è la domanda rivolta a un amico; con dumneavoastră diventa Aveți frați?
    language_code: it
    direction: ltr
