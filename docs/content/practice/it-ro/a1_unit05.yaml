    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un si usa con i nomi maschili (un frate) e o con quelli femminili (o soră).
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit05.lesson02.translate.007
