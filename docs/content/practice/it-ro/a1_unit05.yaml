templates:
- content_key: practice.it-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meu e mea significano entrambi «mio/mia»: meu si usa con i nomi maschili e neutri (tatăl meu), mea con quelli femminili (mama mea).'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit05.lesson01.listen.002
