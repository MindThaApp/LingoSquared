    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică è femminile, quindi vuole o; «un figlio» si dice un fiu.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: Quanti figli hai? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți è la forma maschile plurale di «quanti» e va con copii, il plurale di copil.
    language_code: it
    direction: ltr
