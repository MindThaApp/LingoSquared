    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți è la forma di cortesia di «avere»; con un amico si chiederebbe Ai frați?
    language_code: it
    direction: ltr
