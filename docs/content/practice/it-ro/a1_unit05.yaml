  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate è maschile e o soră è femminile; la frase risponde a Aveți frați?
    language_code: it
    direction: ltr
