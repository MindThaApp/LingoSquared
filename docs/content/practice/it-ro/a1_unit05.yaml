    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți significa «genitori» ed è un plurale; i due genitori sono mamă e tată.
    language_code: it
    direction: ltr
