    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Le decine si formano con l''unità più -zeci: trei diventa treizeci, patru diventa patruzeci.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson02.translate.004
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sută significa cento; cento si dice o sută, con il femminile o.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Da due a diciannove non c''è de: am nouăsprezece ani. Da venti in su compare: am treizeci de ani.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: Ho trent'anni.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Da venti in su il numero è seguito da de davanti al sostantivo: treizeci de ani.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai è la forma di tu del verbo avere e aveți è la forma di dumneavoastră: Câți ani ai? oppure Câți ani aveți?'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De compare dopo i numeri da venti in su: treizeci de ani, ma nouăsprezece ani.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Quanti anni hai? (informale, a un amico)
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Câți ani ai? chiede alla lettera quanti anni hai: come in italiano, il rumeno usa avere e non essere per l''età.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Quanti anni ha? (formale, a una persona a cui dai del dumneavoastră)
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți è la forma di cortesia di avere, usata con dumneavoastră.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul è neutro e un sostantivo neutro singolare prende la forma maschile tău; la versione di cortesia è Care este numărul dumneavoastră de telefon?
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il rumeno dice ho trent''anni: am treizeci de ani, non sono.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson03.match.008
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ani è il plurale di an; la domanda Câți ani ai? chiede il numero di anni.
    language_code: it
    direction: ltr
