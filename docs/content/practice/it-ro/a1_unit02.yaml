templates:
- content_key: practice.it-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Il due ha due forme: doi con i sostantivi maschili e două con i sostantivi femminili e neutri.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson01.listen.002
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Da zero a dieci sono i mattoni di base: i numeri da undici a diciannove aggiungono -sprezece (unsprezece, doisprezece) e le decine aggiungono -zeci.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson01.match.003
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi è la forma maschile di due e două quella femminile e neutra; gli altri numeri non cambiano.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Davanti a un sostantivo, uno e due cambiano secondo il genere (un o o, doi o două); quando conti e basta si dice unu, doi.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson02.choose.001
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'I numeri da undici a diciannove si formano con l''unità più -sprezece: doisprezece è due più dieci.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson02.listen.002
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le decine terminano in -zeci: douăzeci, treizeci, patruzeci e così via fino a nouăzeci.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit02.lesson02.match.003
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
