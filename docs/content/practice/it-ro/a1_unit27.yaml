  feedback_frame:
    text: Ciao Mihai, come ti senti per il tuo primo turno? Cum te simți usa il riflessivo te ("ti"); in prima ta tură l'aggettivo possessivo ta concorda con il femminile tură.
    language_code: it
    direction: ltr
