  frame:
    text: Salut, Mihai, cum te simți înainte de {item} ta tură? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
