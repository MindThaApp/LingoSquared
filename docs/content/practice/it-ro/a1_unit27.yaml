  frame:
    text: Non ti preoccupare.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_face
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-ți {item} griji.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Non ti preoccupare. Nu-ți face griji (letteralmente "non farti preoccupazioni") è la formula fissa abituale per rassicurare. A uno sconosciuto o in modo formale: Nu vă faceți griji.'
    language_code: it
    direction: ltr
