templates:
- content_key: practice.it-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Il rumeno ha due modi per rivolgersi a qualcuno: tu con amici e familiari, dumneavoastră con gli sconosciuti e per mostrare rispetto.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți va con dumneavoastră e faci va con tu, quindi la desinenza del verbo mostra già il registro.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Bună ziua si abbina a dumneavoastră e salut a tu: il saluto che scegli stabilisce il registro di tutta la conversazione.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc è il «grazie» di tutti i giorni e vale sia con tu sia con dumneavoastră.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua è il saluto cortese per le ore del giorno con gli sconosciuti; con gli amici si dice salut.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: fill_in_blank
  frame:
    text: Bine, mulțumesc. Și {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? restituisce la domanda in modo cortese; con un amico si dice Și tu?
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.translate.007
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: Come stai? (informale, a un amico)
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? si usa con un amico (tu); con uno sconosciuto si dice Ce mai faceți?
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: Come sta? (formale, a una persona a cui dai del dumneavoastră)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faceți? è la domanda di cortesia; la risposta cortese è Bine, mulțumesc. Și dumneavoastră?
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.order.001
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Mă numesc {name}.
    language_code: ro
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă numesc {name}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă numesc significa letteralmente «mi nomino»; Mă cheamă significa «mi chiama», cioè «mi chiamo».
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.fill.002
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: fill_in_blank
  frame:
    text: Îmi {item} bine! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Îmi pare bine significa letteralmente «mi sembra bene»; la risposta è Și mie îmi pare bine.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.translate.003
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: Come ti chiami? (informale, a un amico)
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum te {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum te cheamă? usa te per un amico; a uno sconosciuto si dice Cum vă numiți?
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.choose.004
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum vă numiți? è la domanda di cortesia sul nome e usa vă; con un amico diventa Cum te cheamă?
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.listen.005
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numesc è la forma di «io» (mă numesc) e numiți è la forma di dumneavoastră (cum vă numiți).
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.translate.006
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și significa «e» e introduce anche la domanda di rimando: Și dumneavoastră? oppure Și tu?'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson02.match.007
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'In queste espressioni per il nome il rumeno mette il pronome prima del verbo: mă numesc, vă numiți, te cheamă.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson03.translate.001
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: translation
  frame:
    text: Bene, grazie.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Bine, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Dopo Bine, mulțumesc si restituisce la domanda: Și dumneavoastră? (formale) oppure Și tu? (informale).'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit01.lesson03.order.002
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: word_order
  frame:
    text: Și {item} îmi pare bine!
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Și {item} îmi pare bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și mie îmi pare bine significa «piacere anche a me»; mie sottolinea «a me» e risponde all'altra persona.
    language_code: it
    direction: ltr
