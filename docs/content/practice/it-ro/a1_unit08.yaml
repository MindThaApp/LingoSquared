templates:
- content_key: practice.it-ro.ro.a1.unit08.lesson01.choose.001
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Gară è la stazione ferroviaria, magazin un negozio e bancă una banca; aproape e departe indicano la distanza.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson01.listen.002
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aproape significa vicino e departe significa lontano; entrambe descrivono dove si trova qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.match.009
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Bancă, poștă e bibliotecă terminano in -ă e sono femminili; magazin, spital e autobuz non hanno questa desinenza.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson01.translate.004
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gară, magazin e bancă sono i nomi senza articolo; con l'articolo diventano gara, magazinul e banca.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson01.order.005
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: word_order
  frame:
    text: Da, magazinul este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aproape significa vicino; Este aproape? chiede se qualcosa è vicino.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson01.fill.006
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: fill_in_blank
  frame:
    text: Unde este {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'L''articolo si mette alla fine: bancă diventa banca, quindi Unde este banca? significa «Dov''è la banca?»'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson01.translate.007
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: Dov'è la stazione?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Gară diventa gara con l'articolo aggiunto alla fine.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson01.translate.008
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: Il negozio è vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Magazinul è magazin più l'articolo -ul; aproape è un avverbio e non cambia mai.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.choose.001
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lângă, vizavi e între vanno prima del luogo a cui si riferiscono: lângă bibliotecă, vizavi de magazin.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.listen.002
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poștă è l'ufficio postale e bibliotecă è una biblioteca; stație è una fermata e autobuz un autobus.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.translate.003
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spital e bibliotecă sono nomi; lângă, vizavi e între indicano la posizione e non hanno desinenze.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.order.004
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Spitalul este {item} de magazin.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Vizavi è sempre seguito da de: vizavi de magazin significa «di fronte al negozio».'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.order.005
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Stația de autobuz este {item} bibliotecă.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Stația de autobuz este {item} bibliotecă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lângă significa accanto a e vuole il nome subito dopo: lângă bibliotecă.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.fill.006
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: fill_in_blank
  frame:
    text: Stația de {item} este lângă bibliotecă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Stația de autobuz è la fermata dell''autobus: l''articolo si attacca a stație, non a autobuz.'
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.translate.007
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: L'ospedale è di fronte al negozio.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Spital più -ul dà spitalul; vizavi richiede de prima del secondo luogo.
    language_code: it
    direction: ltr
- content_key: practice.it-ro.ro.a1.unit08.lesson02.translate.008
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: Dov'è l'ufficio postale?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Poștă diventa poșta con l'articolo; la parola interrogativa unde non cambia.
    language_code: it
    direction: ltr
