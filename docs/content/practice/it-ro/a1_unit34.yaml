        - w_bicicleta
        - w_călătorește
        - w_mașina
        - w_jos
        - w_conduce
        - w_călători
        - w_serviciul
        - w_călătoresc
        - w_călătorești
        - w_învățat
        - w_transport
        - w_ghișeu
        - w_necunoscut
        - w_forma
        - w_politețe
        - w_mijloc
        - w_iau
        - w_centru
        - w_ajungi
        - w_obicei
        - w_mergi
        - w_preferă
        - w_locuiește
        - w_conduc
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul treno, la bici, la macchina e il camminare.'
    language_code: it
    direction: ltr
