    - register_language
    - wellbeing
    - name_exchange
    - origin_language
    - cafe_small_talk
    - first_meeting_dialogue
    - number
    - contact_number
    - age_quantity
    - price
    - library_registration
    - weekday
    - weekday_pure
    - month
    - ordinal_number
    - date_expression
    - library_date
    - cafe_appointment
    - clock_time
    - quarter_hour
    - time_question
    - time_of_day
    - schedule
    - cafe_meetup_time
    - informal_address
    - polite_address
    - greeting
    - wellbeing_answer
    - person_name
    - place_name
    - country
    - language_or_nationality
    register:
    - informal
    - polite
slot_presets:
  informal_address:
    language_code: nl
    part_of_speech: pronoun
    agreement_tags:
      semantic: informal_address
  greeting:
    language_code: nl
    part_of_speech: phrase
    agreement_tags:
      semantic: greeting
  person_name:
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  country:
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: country
  number:
    language_code: nl
    part_of_speech:
    - symbol
    - noun
    agreement_tags:
      semantic: number
  weekday:
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: weekday
  weekday_pure: &id001
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: weekday_pure
  month: &id002
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: month
  ordinal_number: &id003
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: ordinal_number
  time_of_day:
    language_code: nl
    part_of_speech:
    - noun
    - adverb
    agreement_tags:
      semantic: time_of_day
templates:
- content_key: practice.ko-nl.nl.a1.unit03.lesson01.match.001
  lesson_content_key: nl.a1.unit03.lesson01.weekdagen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}'
    language_code: nl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
    seventh: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  feedback_frame:
    text: 네덜란드어 요일을 한국어 이름과 짝지으세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-nl.nl.a1.unit03.lesson01.translate.003
  lesson_content_key: nl.a1.unit03.lesson01.weekdagen
  type: translation
  frame:
    text: 오늘은 {item}(이)에요. (Vandaag로 시작하세요.)
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
    text_blocks:
    - text: Translate into Dutch.
      language_code: en
      direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Vandaag is het {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: 오늘은 {item}이에요.
    language_code: ko
    direction: ltr
