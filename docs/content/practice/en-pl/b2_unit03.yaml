  type: word_order
  frame: {text: 'Ten {item} jest trochę powolny.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_film}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ten {item} jest trochę powolny.', language_code: pl, direction: ltr}
  feedback_frame: {text: This film is a bit slow. film means movie; film., language_code: en, direction: ltr}
