schema_version: '1.0'
pack_key: practice.en-pl.b2.unit03
source_language: en
target_language: pl
unit_content_key: pl.b2.unit03.niuanse
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_b2_u3 / w_<token>). 38 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_absolutnie, w_bardzo, w_dobre, w_dość, w_długi, w_fabuła, w_film, w_filmie, w_komedia, w_muzyka, w_najbardziej, w_naprawdę, w_niesamowicie, w_nowy, w_obejrzenia, w_odniósł, w_pewnym, w_piękna, w_początek, w_powiedziałbym, w_powolny, w_problem, w_przewidywalny, w_raczej, w_ratuje, w_sensie, w_sprawia, w_sukces, w_sądzisz, w_trochę, w_wart, w_wciągający, w_wydaje, w_właściwie, w_właśnie, w_zakończenie, w_zbyt, w_zdecydowanie]
templates:
- content_key: practice.en-pl.pl.b2.unit03.lesson01.choose.001
  lesson_content_key: pl.b2.unit03.lesson01.lagodzenie_opinii
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_film, w_właściwie, w_dość, w_trochę, w_powolny, w_raczej, w_pewnym, w_sensie, w_komedia, w_wydaje, w_odniósł, w_sukces, w_powiedziałbym, w_zbyt, w_długi, w_naprawdę, w_bardzo, w_niesamowicie, w_wciągający, w_absolutnie, w_wart, w_obejrzenia, w_zdecydowanie, w_właśnie, w_muzyka, w_sprawia, w_dobre, w_problem, w_najbardziej, w_nowy, w_przewidywalny, w_początek, w_piękna, w_ratuje, w_sądzisz, w_filmie, w_fabuła, w_zakończenie]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on softening an opinion.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit03.lesson02.listen.001
  lesson_content_key: pl.b2.unit03.lesson02.ostrozne_sformulowania
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on tentative framing.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit03.lesson03.translate.001
  lesson_content_key: pl.b2.unit03.lesson03.podkreslanie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on emphasis.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit03.lesson04.match.001
  lesson_content_key: pl.b2.unit03.lesson04.podkreslanie_waznej_rzeczy
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit03.lesson05.choose.001
  lesson_content_key: pl.b2.unit03.lesson05.recenzja
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
