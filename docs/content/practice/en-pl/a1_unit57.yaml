schema_version: '1.0'
pack_key: practice.en-pl.a1.unit57
source_language: en
target_language: pl
unit_content_key: pl.a1.unit57.teatr
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u57 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aktorzy, w_byli, w_dobrzy, w_dwudziesta, w_gwiazda, w_kurtyna, w_miejsca, w_otwarta, w_podróż, w_popularne, w_przedstawienie, w_przerwą, w_scenę, w_sztuka, w_teatr, w_zadowolony, w_świetni]
templates:
- content_key: practice.en-pl.pl.a1.unit57.lesson01.choose.001
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_teatr, w_przedstawienie, w_popularne, w_kurtyna, w_scenę, w_aktorzy, w_dobrzy, w_otwarta, w_gwiazda, w_sztuka, w_podróż, w_dwudziesta, w_przerwą, w_miejsca, w_zadowolony, w_byli, w_świetni]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the theatre today?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit57.lesson02.listen.001
  lesson_content_key: pl.a1.unit57.lesson02.scena_i_kurtyna
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the stage and the curtain.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit57.lesson03.translate.001
  lesson_content_key: pl.a1.unit57.lesson03.aktorzy_i_kasa
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the actors and the ticket counter.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit57.lesson04.match.001
  lesson_content_key: pl.a1.unit57.lesson04.program_przedstawienia
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit57.lesson05.choose.001
  lesson_content_key: pl.a1.unit57.lesson05.przy_kasie_w_teatrze
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on at the theatre ticket counter.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit57.lesson06.translate.001
  lesson_content_key: pl.a1.unit57.lesson06.nina_dowiaduje_sie_o
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on Nina hears about the theatre.', language_code: en, direction: ltr}
