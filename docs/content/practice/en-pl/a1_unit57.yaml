  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: word_order
  frame: {text: 'O której zaczyna się {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_przedstawienie}
  answer_derivation:
    kind: render_frame
    frame: {text: 'O której zaczyna się {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'What time does the performance start? przedstawienie means show, performance.', language_code: en, direction: ltr}
