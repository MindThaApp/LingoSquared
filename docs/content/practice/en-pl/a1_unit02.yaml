schema_version: "1.0"
pack_key: practice.en-pl.a1.unit02
source_language: en
target_language: pl
unit_content_key: pl.a1.unit02.numbers
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job A) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u02*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani where it matters.
    Reviewer: lat/lata glosses spell out the number rule; check they read naturally.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_zero, w_jeden, w_dwa, w_trzy, w_cztery, w_pięć, w_sześć, w_siedem, w_osiem, w_dziewięć, w_dziesięć, w_jedenaście, w_dwanaście, w_piętnaście, w_dwadzieścia, w_trzydzieści, w_pięćdziesiąt, w_sto, w_ile, w_kosztuje, w_złotych, w_jaki, w_pana, w_numer, w_telefonu, w_twój, w_lat, w_lata, w_było, w_porozmawiać]
slot_presets:
  u02_l1: &u02_l1 {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: [w_zero, w_jeden, w_dwa, w_trzy, w_cztery, w_pięć, w_sześć, w_siedem, w_osiem, w_dziewięć, w_dziesięć]}}
  u02_l1t: &u02_l1t {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: [w_zero, w_jeden, w_dwa, w_trzy, w_cztery, w_pięć, w_sześć, w_siedem, w_osiem, w_dziewięć, w_dziesięć]}}
  u02_l1m: &u02_l1m {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: [w_zero, w_jeden, w_dwa, w_trzy, w_cztery, w_pięć, w_sześć, w_siedem, w_osiem, w_dziewięć, w_dziesięć]}}
  age_big: &age_big {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: [w_pięć, w_sześć, w_siedem, w_osiem, w_dziewięć, w_dziesięć, w_jedenaście, w_dwanaście, w_piętnaście, w_dwadzieścia, w_trzydzieści, w_pięćdziesiąt]}}
  u02_l2: &u02_l2 {language_code: pl, part_of_speech: [particle, adjective, verb, noun], agreement_tags: {semantic: [w_jedenaście, w_dwanaście, w_piętnaście, w_dwadzieścia, w_trzydzieści, w_pięćdziesiąt, w_sto, w_ile, w_kosztuje, w_złotych]}}
  u02_l2t: &u02_l2t {language_code: pl, part_of_speech: [particle, adjective, verb], agreement_tags: {semantic: [w_jedenaście, w_dwanaście, w_piętnaście, w_dwadzieścia, w_trzydzieści, w_pięćdziesiąt, w_sto, w_ile, w_kosztuje]}}
  price_nums: &price_nums {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: [w_pięć, w_sześć, w_siedem, w_osiem, w_dziewięć, w_dziesięć, w_jedenaście, w_dwanaście, w_piętnaście, w_dwadzieścia, w_trzydzieści, w_pięćdziesiąt, w_sto]}}
  s_zlotych: &s_zlotych {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_złotych}}
  s_kosztuje: &s_kosztuje {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_kosztuje}}
  u02_l3: &u02_l3 {language_code: pl, part_of_speech: [pronoun, verb, noun], agreement_tags: {semantic: [w_jaki, w_pana, w_numer, w_telefonu, w_twój, w_lat, w_lata, w_było, w_porozmawiać]}}
  u02_l3t: &u02_l3t {language_code: pl, part_of_speech: [pronoun, verb, noun], agreement_tags: {semantic: [w_jaki, w_pana, w_numer, w_telefonu, w_twój, w_było, w_porozmawiać]}}
  your_pn: &your_pn {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: [w_twój, w_pana]}}
  s_lat: &s_lat {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_lat}}
  s_lata: &s_lata {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_lata}}
  s_numer: &s_numer {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_numer}}
templates:
  - content_key: practice.en-pl.pl.a1.unit02.lesson01.choose.001
    lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u02_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish has no pattern linking the numbers one to ten, so each word has to be learned separately.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson01.listen.002
    lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u02_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish sz sounds like English sh and cz like ch in church, so sześć and cztery begin with those sounds.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson01.translate.003
    lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u02_l1t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The final ć in pięć, sześć, dziewięć and dziesięć is a soft ch-like sound; the accent mark matters in spelling.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson01.match.004
    lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u02_l1m, second: *u02_l1m, third: *u02_l1m, fourth: *u02_l1m, fifth: *u02_l1m, sixth: *u02_l1m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Pięć, sześć, dziewięć and dziesięć end in the letter ć, while siedem and osiem do not, so each spelling needs care.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson01.order.005
    lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
    type: word_order
    frame: {text: "Mam {item} lat.", language_code: pl, direction: ltr}
    slots: {item: *age_big}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} lat.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mam + number + lat says how old you are, as in Mam trzydzieści lat.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson02.listen.001
    lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u02_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ile asks how much or how many, and kosztuje is the verb it pairs with when asking a price.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson02.choose.002
    lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u02_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The teens jedenaście, dwanaście and piętnaście end in -naście, which marks them as teens.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson02.translate.003
    lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u02_l2t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ile means how much for prices and how many for counted things.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson02.order.004
    lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
    type: word_order
    frame: {text: "To kosztuje {item} złotych.", language_code: pl, direction: ltr}
    slots: {item: *price_nums}
    answer_derivation: {kind: render_frame, frame: {text: "To kosztuje {item} złotych.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "From five upward the number is followed by the form złotych for the currency.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson02.fill.005
    lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
    type: fill_in_blank
    frame: {text: "To kosztuje dwadzieścia {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_zlotych, hint: *s_zlotych}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Numbers from five upward are followed by the plural form with the ending -ych, as in pięćdziesiąt złotych.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson02.translate.006
    lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
    type: translation
    frame: {text: "How much does this cost?", language_code: en, direction: ltr}
    slots: {item: *s_kosztuje}
    answer_derivation: {kind: render_frame, frame: {text: "Ile to {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Ile to kosztuje? is the standard price question, where to means this or it.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson03.choose.001
    lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u02_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pana is the formal your for a man (pana numer), while twój is the informal your (twój numer).", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson03.translate.002
    lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u02_l3t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Numer telefonu literally means the number of the phone, and the second word is a changed form of the word for phone.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson03.order.003
    lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
    type: word_order
    frame: {text: "Jaki jest {item} numer telefonu?", language_code: pl, direction: ltr}
    slots: {item: *your_pn}
    answer_derivation: {kind: render_frame, frame: {text: "Jaki jest {item} numer telefonu?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Twój is the informal your and pana the formal your for a man; either one fits before numer telefonu.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson03.fill.004
    lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
    type: fill_in_blank
    frame: {text: "Ile masz {item}? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_lat, hint: *s_lat}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After five or more the word for years is lat; after two to four it is lata, as in trzydzieści dwa lata.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson03.translate.005
    lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
    type: translation
    frame: {text: "I am thirty-two years old.", language_code: en, direction: ltr}
    slots: {item: *s_lata}
    answer_derivation: {kind: render_frame, frame: {text: "Mam trzydzieści dwa {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Because the number ends in dwa, the word for years is lata rather than lat.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit02.lesson03.translate.006
    lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
    type: translation
    frame: {text: "What is your phone number? (informal)", language_code: en, direction: ltr}
    slots: {item: *s_numer}
    answer_derivation: {kind: render_frame, frame: {text: "Jaki jest twój {item} telefonu?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Twój is the informal your; the formal version for a man is Jaki jest pana numer telefonu?", language_code: en, direction: ltr}
