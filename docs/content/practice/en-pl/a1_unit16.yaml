schema_version: "1.0"
pack_key: practice.en-pl.a1.unit16
source_language: en
target_language: pl
unit_content_key: pl.a1.unit16.zdrowie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job C) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u16*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors so every
    frame is grammatical (gender, case, number). Fixed English prompts name
    ty vs pan/pani and speaker gender where it matters, and are worded so only
    one natural Polish word order fits. Register follows the unit's
    realization (ty between friends, pan/pani when formal).
    Reviewer: odpocząć is the only first-sight lexeme of lesson 3, so lesson 3 pools borrow other unit tokens; cię/mnie are object pronouns glossed in English.
    Feedback lines carry a usage or grammar point, never the task or the answer.
    Opus pass (2026-10-24): 'My throat hurts.' now asks to start with the body part (Boli mnie gardło was an equally natural ungraded answer).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_boli, w_bolą, w_mnie, w_głowa, w_gardło, w_brzuch, w_zęby, w_cię, w_czuć, w_czuję, w_czujesz, w_źle, w_gorączka, w_chory, w_chora, w_gorączkę, w_odpocząć, w_boleć]
slot_presets:
  u16_l1: &u16_l1 {language_code: pl, part_of_speech: [pronoun, verb, noun], agreement_tags: {semantic: [w_boli, w_bolą, w_mnie, w_głowa, w_gardło, w_brzuch, w_zęby, w_cię]}}
  u16_mp1: &u16_mp1 {language_code: pl, part_of_speech: [pronoun, noun], agreement_tags: {semantic: [w_głowa, w_gardło, w_brzuch, w_zęby, w_mnie, w_cię]}}
  s_mnie: &s_mnie {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_mnie}}
  s_boli: &s_boli {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_boli}}
  s_cie: &s_cie {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_cię}}
  u16_l2: &u16_l2 {language_code: pl, part_of_speech: [adjective, adverb, verb, noun], agreement_tags: {semantic: [w_czuć, w_czuję, w_czujesz, w_źle, w_gorączka, w_chory, w_chora]}}
  s_goraczke: &s_goraczke {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_gorączkę}}
  s_chora: &s_chora {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_chora}}
  s_chory: &s_chory {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_chory}}
  u16_l3: &u16_l3 {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_odpocząć, w_czuć, w_boleć, w_gorączka]}}
  s_odpoczac: &s_odpoczac {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_odpocząć}}
templates:
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.choose.001
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u16_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Boli is used with one aching thing and bolą with several, so zęby takes bolą.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.listen.002
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u16_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish says the head hurts me: the body part is the subject and mnie marks who feels the pain.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.match.003
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u16_mp1, second: *u16_mp1, third: *u16_mp1, fourth: *u16_mp1, fifth: *u16_mp1, sixth: *u16_mp1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Mnie and cię are object forms of ja and ty: hurts me, hurts you.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.order.004
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: word_order
    frame: {text: "Gardło {item} boli.", language_code: pl, direction: ltr}
    slots: {item: *s_mnie}
    answer_derivation: {kind: render_frame, frame: {text: "Gardło {item} boli.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mnie means me; Gardło mnie boli literally says the throat hurts me.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.fill.005
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: fill_in_blank
    frame: {text: "Co cię {item}? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_boli, hint: *s_boli}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Boli is the he, she or it form; the question word Co is the thing that hurts.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.translate.006
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: translation
    frame: {text: "My throat hurts. (start with the throat)", language_code: en, direction: ltr}
    slots: {item: *s_boli}
    answer_derivation: {kind: render_frame, frame: {text: "Gardło mnie {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Gardło is neuter and singular, so the verb is boli.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson01.translate.007
    lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
    type: translation
    frame: {text: "What hurts you? (to a friend, ty)", language_code: en, direction: ltr}
    slots: {item: *s_cie}
    answer_derivation: {kind: render_frame, frame: {text: "Co {item} boli?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Cię is the short object form of ty.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.choose.001
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u16_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Czuję is the I form of czuć się and czujesz is the ty form; both are used with się.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.listen.002
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u16_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Chory is masculine and chora is feminine, so the form shows who is sick.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.match.003
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u16_l2, second: *u16_l2, third: *u16_l2, fourth: *u16_l2, fifth: *u16_l2, sixth: *u16_l2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Źle is an adverb meaning badly and never changes; chory and chora change with gender.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.order.004
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: word_order
    frame: {text: "Mam {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_goraczke}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The object form of gorączka ends in -ę, like kawa to kawę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.order.005
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: word_order
    frame: {text: "Ewa jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_chora}
    answer_derivation: {kind: render_frame, frame: {text: "Ewa jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Ewa is a woman, so the adjective takes the feminine ending -a.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.fill.006
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: fill_in_blank
    frame: {text: "Mam {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_goraczke, hint: *s_goraczke}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mam plus the object form says what you have.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.translate.007
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: translation
    frame: {text: "I have a fever.", language_code: en, direction: ltr}
    slots: {item: *s_goraczke}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The thing you have goes into the object form: gorączka becomes gorączkę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson02.translate.008
    lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
    type: translation
    frame: {text: "Marek is sick.", language_code: en, direction: ltr}
    slots: {item: *s_chory}
    answer_derivation: {kind: render_frame, frame: {text: "Marek jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Marek is a man, so the adjective is chory.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson03.choose.001
    lesson_content_key: pl.a1.unit16.lesson03.rozmowa_o_zdrowiu
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u16_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Odpocząć is the dictionary form; it follows proszę in a polite request.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson03.fill.002
    lesson_content_key: pl.a1.unit16.lesson03.rozmowa_o_zdrowiu
    type: fill_in_blank
    frame: {text: "Proszę {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_odpoczac, hint: *s_odpoczac}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Proszę is followed by a verb in its dictionary form to give a polite instruction.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit16.lesson03.translate.003
    lesson_content_key: pl.a1.unit16.lesson03.rozmowa_o_zdrowiu
    type: translation
    frame: {text: "Please rest. (formal)", language_code: en, direction: ltr}
    slots: {item: *s_odpoczac}
    answer_derivation: {kind: render_frame, frame: {text: "Proszę {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After proszę the verb stays in its dictionary form.", language_code: en, direction: ltr}
