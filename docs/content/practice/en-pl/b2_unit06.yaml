schema_version: '1.0'
pack_key: practice.en-pl.b2.unit06
source_language: en
target_language: pl
unit_content_key: pl.b2.unit06.abstrakcja
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_b2_u6 / w_<token>). 36 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_bezpieczeństwa, w_bezpieczeństwo, w_bezpieczniejsze, w_biorąc, w_chce, w_lepsze, w_liczy, w_myślę, w_niekoniecznie, w_odpowiedzialność, w_ogromna, w_ogólnie, w_pewnego, w_potrzebujemy, w_przekonana, w_przypadkach, w_punkt, w_rozumiem, w_rzecz, w_sens, w_społeczeństwa, w_społeczeństwo, w_stopnia, w_traci, w_walczyć, w_warto, w_ważne, w_ważniejsza, w_wielu, w_wystarczy, w_zaletę, w_zależy, w_zasad, w_złe, w_łatwe, w_życie]
templates:
- content_key: practice.en-pl.pl.b2.unit06.lesson01.choose.001
  lesson_content_key: pl.b2.unit06.lesson01.co_myslisz
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_bezpieczeństwo, w_ważne, w_bezpieczeństwa, w_ważniejsza, w_przekonana, w_pewnego, w_stopnia, w_ogólnie, w_rzecz, w_biorąc, w_wielu, w_przypadkach, w_niekoniecznie, w_złe, w_zależy, w_odpowiedzialność, w_wystarczy, w_rozumiem, w_punkt, w_myślę, w_społeczeństwo, w_społeczeństwa, w_ogromna, w_zaletę, w_bezpieczniejsze, w_liczy, w_życie, w_traci, w_sens, w_potrzebujemy, w_zasad, w_łatwe, w_warto, w_walczyć, w_lepsze, w_chce]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what do you think?.', language_code: en, direction: ltr}
