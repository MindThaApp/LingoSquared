schema_version: '1.0'
pack_key: practice.en-pl.b2.unit05
source_language: en
target_language: pl
unit_content_key: pl.b2.unit05.rejestr
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_b2_u5 / w_<token>). 35 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_byłoby, w_chcę, w_inaczej, w_mają, w_mam, w_masz, w_mogliby, w_mogą, w_mogę, w_możemy, w_możesz, w_możliwe, w_muszę, w_napisać, w_pasować, w_pasowałby, w_pisze, w_piszesz, w_piszę, w_pomóc, w_poniedziałek, w_poważaniem, w_pozdrawiam, w_proszę, w_przełożyć, w_przyszły, w_przyszłym, w_szacunku, w_szanowni, w_tygodniu, w_urząd, w_urzędu, w_wiadomość, w_wyrazy, w_łączę]
templates:
- content_key: practice.en-pl.pl.b2.unit05.lesson01.choose.001
  lesson_content_key: pl.b2.unit05.lesson01.ty_czy_panstwo
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_pisze, w_wiadomość, w_piszę, w_masz, w_mają, w_możesz, w_pomóc, w_mogą, w_pozdrawiam, w_szanowni, w_poważaniem, w_łączę, w_wyrazy, w_szacunku, w_proszę, w_mogliby, w_byłoby, w_możliwe, w_mam, w_przełożyć, w_chcę, w_poniedziałek, w_mogę, w_przyszłym, w_tygodniu, w_możemy, w_pasować, w_pasowałby, w_przyszły, w_urząd, w_urzędu, w_napisać, w_piszesz, w_inaczej, w_muszę]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on you or you (formal)?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson02.listen.001
  lesson_content_key: pl.b2.unit05.lesson02.powitanie_pozegnanie
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on greeting and closing.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson03.translate.001
  lesson_content_key: pl.b2.unit05.lesson03.bezposrednio_czy_uprzejmie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on direct or polite?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson04.match.001
  lesson_content_key: pl.b2.unit05.lesson04.przelozenie_spotkania
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson05.choose.001
  lesson_content_key: pl.b2.unit05.lesson05.dwie_wiadomosci
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two messages, two readers.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson06.translate.001
  lesson_content_key: pl.b2.unit05.lesson06.wybor_rejestru
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on choosing the right register.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson01.order.002
  lesson_content_key: pl.b2.unit05.lesson01.ty_czy_panstwo
  type: word_order
  frame: {text: 'Marek {item} wiadomość.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_pisze}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Marek {item} wiadomość.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Marek is writing a message. The situation this whole unit works with: Marek has to send the same request to two very different readers. Wiadomość = ''a message''.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson01.fill.003
  lesson_content_key: pl.b2.unit05.lesson01.ty_czy_panstwo
  type: fill_in_blank
  frame:
    text: Cześć, jak się {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_masz}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_masz}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Hi, how are you? masz means you have (informal).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson01.translate.004
  lesson_content_key: pl.b2.unit05.lesson01.ty_czy_panstwo
  type: translation
  frame: {text: 'Do you have time?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_mają}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czy {item} Państwo czas?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Do you have time? Formal. Czy is the yes/no question particle (used in both registers, but it makes a question sound more careful, so formal questions almost always have it); mają Państwo uses the 3rd-plural form of mieć, not the.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson03.order.002
  lesson_content_key: pl.b2.unit05.lesson03.bezposrednio_czy_uprzejmie
  type: word_order
  frame: {text: 'Czy możesz to zrobić, {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_proszę}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czy możesz to zrobić, {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Can you do this, please? proszę means please; I ask for.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson03.fill.003
  lesson_content_key: pl.b2.unit05.lesson03.bezposrednio_czy_uprzejmie
  type: fill_in_blank
  frame:
    text: Czy {item} Państwo to zrobić? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_mogliby}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_mogliby}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Could you do this? Formal and indirect. Mogliby is the conditional 3rd-plural of móc (''can''), agreeing with Państwo -- softer and more polite than a plain mogą.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson03.translate.004
  lesson_content_key: pl.b2.unit05.lesson03.bezposrednio_czy_uprzejmie
  type: translation
  frame: {text: 'Would it be possible to help?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_byłoby}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czy {item} możliwe, żeby pomóc?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Would it be possible to help? byłoby means it would be.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson04.order.002
  lesson_content_key: pl.b2.unit05.lesson04.przelozenie_spotkania
  type: word_order
  frame: {text: 'Chcę {item} spotkanie.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_przełożyć}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Chcę {item} spotkanie.', language_code: pl, direction: ltr}
  feedback_frame: {text: I want to reschedule the appointment. przełożyć means to move (an appointment)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson04.fill.003
  lesson_content_key: pl.b2.unit05.lesson04.przelozenie_spotkania
  type: fill_in_blank
  frame:
    text: Nie mogę w {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_poniedziałek}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_poniedziałek}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I can't on Monday. poniedziałek means Monday., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson04.translate.004
  lesson_content_key: pl.b2.unit05.lesson04.przelozenie_spotkania
  type: translation
  frame: {text: 'Can we do it next week?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_przyszłym}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czy możemy w {item} tygodniu?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Can we do it next week? przyszłym means next (form after ''in'').', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson05.order.002
  lesson_content_key: pl.b2.unit05.lesson05.dwie_wiadomosci
  type: word_order
  frame: {text: 'Czy {item} przyszły tydzień?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_pasowałby}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czy {item} przyszły tydzień?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Would next week suit? pasowałby means would suit; would work (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson06.order.002
  lesson_content_key: pl.b2.unit05.lesson06.wybor_rejestru
  type: word_order
  frame: {text: 'Piszę do {item}.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_urzędu}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Piszę do {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: I'm writing to the office. urzędu means government office (after 'to')., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson06.fill.003
  lesson_content_key: pl.b2.unit05.lesson06.wybor_rejestru
  type: fill_in_blank
  frame:
    text: Do urzędu {item} inaczej. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_piszesz}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_piszesz}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: You write to the office differently. piszesz means you write; are writing (informal)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit05.lesson06.translate.004
  lesson_content_key: pl.b2.unit05.lesson06.wybor_rejestru
  type: translation
  frame: {text: 'Ewa: Yeah, to the office you obviously write differently.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_inaczej}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tak, do urzędu piszesz oczywiście {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Ewa: Yeah, to the office you obviously write differently. inaczej means differently.', language_code: en, direction: ltr}
