schema_version: '1.0'
pack_key: practice.en-pl.a1.unit49
source_language: en
target_language: pl
unit_content_key: pl.a1.unit49.muzeum
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u49 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_duża, w_koncert, w_obraz, w_obrazy, w_otwarte, w_piątej, w_przewodnika, w_sala, w_trzeba, w_wstępu, w_wystawa, w_zamykać, w_zwiedzam, w_zwiedzić]
templates:
- content_key: practice.en-pl.pl.a1.unit49.lesson01.choose.001
  lesson_content_key: pl.a1.unit49.lesson01.chce_isc_do_muzeum
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_zwiedzić, w_wystawa, w_zwiedzam, w_zamykać, w_piątej, w_otwarte, w_przewodnika, w_trzeba, w_sala, w_duża, w_obraz, w_obrazy, w_wstępu, w_koncert]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to go to the museum.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit49.lesson02.listen.001
  lesson_content_key: pl.a1.unit49.lesson02.chce_kupic_bilet
