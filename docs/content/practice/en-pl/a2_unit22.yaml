schema_version: "1.0"
pack_key: practice.en-pl.a2.unit22
source_language: en
target_language: pl
unit_content_key: pl.a2.unit22.opinie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-pl A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_pl.py (a2 course, tags pl_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and ty/pan/pani where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the case-ending notes in feedback (genitive after potrzebować/szukać/od, object forms)
    and the polite conditional forms (chciałabym/chciałbym, mógłby).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_restauracja, w_opinia, w_opinię, w_jedzenie, w_smaczne, w_rację, w_lubię, w_myślę, w_zdaniem, w_dobra, w_droga, w_za, w_zgadzam, w_jeść, w_spróbuję, w_moim, w_może, w_tam, w_jeszcze, w_raz, w_dobrze]
slot_presets:
  pool1: &pool1 {language_code: pl, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_restauracja, w_opinia, w_opinię, w_jedzenie, w_smaczne, w_rację, w_lubię]}}
  pool2: &pool2 {language_code: pl, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_restauracja, w_opinia, w_opinię, w_jedzenie, w_smaczne, w_rację, w_lubię, w_myślę]}}
  s_racje: &s_racje {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_rację}}
  s_smaczne: &s_smaczne {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_smaczne}}
  s_opinie: &s_opinie {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_opinię}}
  pool3: &pool3 {language_code: pl, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_restauracja, w_opinia, w_jedzenie, w_smaczne, w_lubię, w_myślę]}}
  pool4: &pool4 {language_code: pl, part_of_speech: [noun, verb, adjective, preposition], agreement_tags: {semantic: [w_zdaniem, w_dobra, w_droga, w_za, w_zgadzam]}}
  pool5: &pool5 {language_code: pl, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_restauracja, w_opinia, w_jedzenie, w_droga, w_zgadzam, w_jeść, w_spróbuję, w_dobra]}}
  s_za: &s_za {language_code: pl, part_of_speech: preposition, agreement_tags: {semantic: w_za}}
  s_zgadzam: &s_zgadzam {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_zgadzam}}
  s_droga: &s_droga {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_droga}}
  pool6: &pool6 {language_code: pl, part_of_speech: [noun, pronoun, verb, adjective, preposition], agreement_tags: {semantic: [w_zdaniem, w_moim, w_dobra, w_droga, w_za, w_zgadzam]}}
  pool7: &pool7 {language_code: pl, part_of_speech: [noun, verb, adverb, particle], agreement_tags: {semantic: [w_może, w_tam, w_jeść, w_spróbuję, w_jeszcze, w_raz, w_dobrze]}}
  s_raz: &s_raz {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_raz}}
  s_jesc: &s_jesc {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_jeść}}
templates:
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.choose.001
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Opinia is the basic form; mam opinię uses the object form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.listen.002
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Opinia is the basic form; mam opinię uses the object form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.match.003
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool2, second: *pool2, third: *pool2, fourth: *pool2, fifth: *pool2, sixth: *pool2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Mieć rację means to be right, literally to have reason.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.order.004
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: word_order
    frame: {text: "Myślę, że masz {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_racje}
    answer_derivation: {kind: render_frame, frame: {text: "Myślę, że masz {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Masz rację is the usual way to say you are right.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.fill.005
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: fill_in_blank
    frame: {text: "To jest bardzo {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_smaczne, hint: *s_smaczne}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Smaczne is neuter, matching to and jedzenie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.translate.006
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: translation
    frame: {text: "I have an opinion.", language_code: en, direction: ltr}
    slots: {item: *s_opinie}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mam takes the object form opinię.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.translate.007
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: translation
    frame: {text: "The food is tasty.", language_code: en, direction: ltr}
    slots: {item: *s_smaczne}
    answer_derivation: {kind: render_frame, frame: {text: "Jedzenie jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jedzenie is neuter, so the adjective ends in -e.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson01.translate.008
    lesson_content_key: pl.a2.unit22.lesson01.slownictwo_opinii
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Myślę, że is followed by a full clause; the comma before że is required.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.choose.001
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Za before an adjective means too: za droga is too expensive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.listen.002
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Za before an adjective means too: za droga is too expensive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.match.003
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool5, second: *pool5, third: *pool5, fourth: *pool5, fifth: *pool5, sixth: *pool5}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Moim zdaniem is a fixed opening: moim zdaniem restauracja jest dobra.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.order.004
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: word_order
    frame: {text: "Restauracja jest {item} droga.", language_code: pl, direction: ltr}
    slots: {item: *s_za}
    answer_derivation: {kind: render_frame, frame: {text: "Restauracja jest {item} droga.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Za placed before an adjective adds the idea of too much.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.order.005
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: word_order
    frame: {text: "Tak, {item} się z tobą.", language_code: pl, direction: ltr}
    slots: {item: *s_zgadzam}
    answer_derivation: {kind: render_frame, frame: {text: "Tak, {item} się z tobą.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Zgadzać się z kimś means to agree with someone and always takes się.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.fill.006
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: fill_in_blank
    frame: {text: "Restauracja jest {item} droga. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_za, hint: *s_za}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Za droga means too expensive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.translate.007
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: translation
    frame: {text: "The restaurant is too expensive.", language_code: en, direction: ltr}
    slots: {item: *s_droga}
    answer_derivation: {kind: render_frame, frame: {text: "Restauracja jest za {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Droga is feminine, matching restauracja.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.translate.008
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: translation
    frame: {text: "Yes, I agree with you.", language_code: en, direction: ltr}
    slots: {item: *s_zgadzam}
    answer_derivation: {kind: render_frame, frame: {text: "Tak, {item} się z tobą.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Zgadzam się z tobą is the standard way to agree.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson02.translate.009
    lesson_content_key: pl.a2.unit22.lesson02.moim_zdaniem
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dobra and droga are feminine and describe feminine nouns such as restauracja.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.choose.001
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Spróbuję is a perfective future form: it means a single attempt, I will try.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.listen.002
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Spróbuję is a perfective future form: it means a single attempt, I will try.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.order.003
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: word_order
    frame: {text: "Spróbuję jeszcze {item} jutro.", language_code: pl, direction: ltr}
    slots: {item: *s_raz}
    answer_derivation: {kind: render_frame, frame: {text: "Spróbuję jeszcze {item} jutro.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jeszcze raz means once more.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.fill.004
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: fill_in_blank
    frame: {text: "Możemy tam {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_jesc, hint: *s_jesc}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After możemy the verb stays in the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.translate.005
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: translation
    frame: {text: "I will try once more.", language_code: en, direction: ltr}
    slots: {item: *s_raz}
    answer_derivation: {kind: render_frame, frame: {text: "Spróbuję jeszcze {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Raz means one time; jeszcze raz is once more.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.translate.006
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: translation
    frame: {text: "I can eat there.", language_code: en, direction: ltr}
    slots: {item: *s_jesc}
    answer_derivation: {kind: render_frame, frame: {text: "Mogę tam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mogę is followed by an infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit22.lesson03.translate.007
    lesson_content_key: pl.a2.unit22.lesson03.rozmowa_o_restauracji
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Może here means maybe; it is also the form of móc used for he or she.", language_code: en, direction: ltr}
