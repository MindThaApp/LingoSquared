schema_version: '1.0'
pack_key: practice.en-pl.b2.unit07
source_language: en
target_language: pl
unit_content_key: pl.b2.unit07.negocjacje
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_b2_u7 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_całkowicie, w_deser, w_dogadujemy, w_dzielimy, w_gotowanie, w_gotować, w_jutro, w_kolację, w_lubię, w_naczynia, w_niestety, w_pomysł, w_porozmawiamy, w_posprzątać, w_połowę, w_proponuję, w_płacisz, w_płacić, w_rachunek, w_razem, w_robimy, w_robię, w_uda, w_ugotujesz, w_ugotuję, w_umowa, w_warunkiem, w_wolałbym, w_wolisz, w_wspólne, w_wyjść, w_zakupy, w_zakupów, w_zgodzić, w_zmyjesz, w_zmywam, w_zmywać, w_zrobimy, w_zrobisz, w_zrobię]
templates:
- content_key: practice.en-pl.pl.b2.unit07.lesson01.choose.001
  lesson_content_key: pl.b2.unit07.lesson01.propozycja
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_robimy, w_razem, w_kolację, w_gotować, w_lubię, w_zakupy, w_robię, w_proponuję, w_ugotuję, w_zrobimy, w_pomysł, w_wspólne, w_gotowanie, w_niestety, w_uda, w_zgodzić, w_wolałbym, w_posprzątać, w_zmywać, w_naczynia, w_zmywam, w_zmyjesz, w_warunkiem, w_zrobię, w_ugotujesz, w_wolisz, w_zrobisz, w_umowa, w_całkowicie, w_rachunek, w_dzielimy, w_płacić, w_płacisz, w_połowę, w_dogadujemy, w_wyjść, w_deser, w_porozmawiamy, w_jutro, w_zakupów]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on making a proposal.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson02.listen.001
  lesson_content_key: pl.b2.unit07.lesson02.grzeczna_odmowa
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a polite refusal.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson03.translate.001
  lesson_content_key: pl.b2.unit07.lesson03.warunek
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on setting a condition.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson04.match.001
  lesson_content_key: pl.b2.unit07.lesson04.dochodzenie_do_porozumienia
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson05.choose.001
  lesson_content_key: pl.b2.unit07.lesson05.co_zostalo_ustalone
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what was settled?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson06.translate.001
  lesson_content_key: pl.b2.unit07.lesson06.negocjacje_w_rozmowie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on negotiating in conversation.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson01.order.002
  lesson_content_key: pl.b2.unit07.lesson01.propozycja
  type: word_order
  frame: {text: 'Robimy dziś {item} kolację.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_razem}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Robimy dziś {item} kolację.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'We''re making dinner together today. Kolację is the accusative of kolacja (''dinner''), the object of robimy (''we''re making'').', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson01.fill.003
  lesson_content_key: pl.b2.unit07.lesson01.propozycja
  type: fill_in_blank
  frame:
    text: Robimy dziś razem {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_kolację}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_kolację}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Marek: Shall we make dinner together today? kolację means dinner (object form).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson01.translate.004
  lesson_content_key: pl.b2.unit07.lesson01.propozycja
  type: translation
  frame: {text: 'I can cook, but only if you do the dishes.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_gotować}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mogę {item}, ale tylko jeśli ty zmyjesz.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'I can cook, but only if you do the dishes. gotować means to cook.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson02.order.002
  lesson_content_key: pl.b2.unit07.lesson02.grzeczna_odmowa
  type: word_order
  frame: {text: 'To się nie {item}.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_uda}
  answer_derivation:
    kind: render_frame
    frame: {text: 'To się nie {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: That won't work. uda means will succeed; work out (with reflexive word)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson02.fill.003
  lesson_content_key: pl.b2.unit07.lesson02.grzeczna_odmowa
  type: fill_in_blank
  frame:
    text: Nie mogę się na to {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_zgodzić}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_zgodzić}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I can''t agree to that. Zgodzić się na coś (''to agree to something'') governs na + accusative: na to (''to that'').', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson03.order.002
  lesson_content_key: pl.b2.unit07.lesson03.warunek
  type: word_order
  frame: {text: 'Jeśli ty {item}, to ja ugotuję.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_zmyjesz}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Jeśli ty {item}, to ja ugotuję.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'If you do the dishes, then I''ll cook. Jeśli...to... -- the basic if-then frame. Zmyjesz is the perfective future (''you will [have] wash[ed]''), not marked for gender.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson03.fill.003
  lesson_content_key: pl.b2.unit07.lesson03.warunek
  type: fill_in_blank
  frame:
    text: Zrobię zakupy, pod {item} że ty ugotujesz. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_warunkiem}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_warunkiem}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I''ll do the shopping, on condition that you cook. warunkiem means condition (instrumental).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson03.translate.004
  lesson_content_key: pl.b2.unit07.lesson03.warunek
  type: translation
  frame: {text: 'I''ll do it, unless you prefer otherwise.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_wolisz}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Zrobię to, chyba że {item} inaczej.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'I''ll do it, unless you prefer otherwise. wolisz means you prefer (informal).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit07.lesson04.order.002
  lesson_content_key: pl.b2.unit07.lesson04.dochodzenie_do_porozumienia
  type: word_order
  frame: {text: 'Ty {item} połowę.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_płacisz}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ty {item} połowę.', language_code: pl, direction: ltr}
  feedback_frame: {text: You pay half. płacisz means you pay (informal)., language_code: en, direction: ltr}
