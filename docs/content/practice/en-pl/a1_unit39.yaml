    semantic: [w_alarmowy, w_bibliotece, w_chodź, w_dzieje, w_dzwonię, w_ewakuacyjne, w_idźcie, w_karetka, w_policja, w_pomoc, w_pomocy, w_potrzebny, w_potrzebuje, w_pożar, w_spokojnie, w_straż, w_uwaga, w_wyjścia, w_wyjście, w_zadzwoń, w_zewnątrz]
