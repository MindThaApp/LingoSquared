  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_pomoc, w_pomocy, w_pożar, w_potrzebny, w_alarmowy, w_zadzwoń, w_wyjście, w_ewakuacyjne, w_dzwonię, w_policja, w_karetka, w_straż, w_uwaga, w_idźcie, w_wyjścia, w_spokojnie, w_chodź, w_bibliotece, w_potrzebuje, w_zewnątrz, w_dzieje]
  answer_derivation: {kind: slot_gloss, slot: item}
