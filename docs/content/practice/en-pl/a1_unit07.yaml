schema_version: "1.0"
pack_key: practice.en-pl.a1.unit07
source_language: en
target_language: pl
unit_content_key: pl.a1.unit07.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job B) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u07*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani and speaker gender where it matters. Register
    follows the unit's realization (formal pan/pani to strangers, ty between friends).
    Reviewer: pół is glossed as an adjective; the word razem is covered only in recognition and bare-word tiers (a sentence slot would be sentence-initial).
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_banan, w_pomidor, w_ogórek, w_ziemniak, w_cebula, w_tanio, w_drogo, w_kosztować, w_kosztują, w_grejpfrut, w_mandarynka, w_pomarańcza, w_kilo, w_pół, w_poproszę, w_bananów, w_pomidorów, w_ziemniaków, w_dla, w_świeże, w_razem, w_pomidory, w_banany]
slot_presets:
  u07_l1: &u07_l1 {language_code: pl, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_banan, w_pomidor, w_ogórek, w_ziemniak, w_cebula, w_tanio, w_drogo, w_kosztować]}}
  u07_one: &u07_one {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_banan, w_pomidor, w_ogórek, w_ziemniak]}}
  s_kosztuja: &s_kosztuja {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_kosztują}}
  s_tanio: &s_tanio {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_tanio}}
  u07_l2: &u07_l2 {language_code: pl, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_grejpfrut, w_mandarynka, w_pomarańcza, w_kilo, w_pół, w_poproszę]}}
  u07_l2m: &u07_l2m {language_code: pl, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_grejpfrut, w_mandarynka, w_pomarańcza, w_kilo, w_pół, w_poproszę, w_bananów, w_pomidorów, w_ziemniaków]}}
  u07_gen: &u07_gen {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_bananów, w_pomidorów, w_ziemniaków]}}
  s_kilo: &s_kilo {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_kilo}}
  s_pomidorow: &s_pomidorow {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pomidorów}}
  u07_l3: &u07_l3 {language_code: pl, part_of_speech: [preposition, adjective, adverb, noun], agreement_tags: {semantic: [w_dla, w_świeże, w_razem, w_pomidory, w_banany, w_tanio, w_drogo]}}
  u07_l3m: &u07_l3m {language_code: pl, part_of_speech: [preposition, adjective, adverb, noun], agreement_tags: {semantic: [w_dla, w_świeże, w_razem, w_pomidory, w_banany, w_tanio, w_drogo, w_pół, w_kilo]}}
  s_swieze: &s_swieze {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_świeże}}
  s_dla: &s_dla {language_code: pl, part_of_speech: preposition, agreement_tags: {semantic: w_dla}}
templates:
  - content_key: practice.en-pl.pl.a1.unit07.lesson01.choose.001
    lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u07_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish prices use adverbs: tanio is cheap and drogo is expensive, and both describe how much something costs.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson01.listen.002
    lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u07_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cebula is feminine because it ends in -a; banan, pomidor, ogórek and ziemniak are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson01.order.003
    lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
    type: word_order
    frame: {text: "Ile kosztuje {item}?", language_code: pl, direction: ltr}
    slots: {item: *u07_one}
    answer_derivation: {kind: render_frame, frame: {text: "Ile kosztuje {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Ile kosztuje asks the price of one thing, so the noun stays in its basic singular form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson01.fill.004
    lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
    type: fill_in_blank
    frame: {text: "Banany {item} tanio. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_kosztuja, hint: *s_kosztuja}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The verb agrees with the number: kosztuje for one thing, kosztują for more than one.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson01.translate.005
    lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
    type: translation
    frame: {text: "A banana is cheap. (use the verb for to cost)", language_code: en, direction: ltr}
    slots: {item: *s_tanio}
    answer_derivation: {kind: render_frame, frame: {text: "Banan kosztuje {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Polish says a banana costs cheaply instead of using a separate adjective.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson01.translate.006
    lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u07_l1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Kosztować is the dictionary form; in sentences it becomes kosztuje or kosztują.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.choose.001
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u07_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pół means half and goes before kilo: pół kilo is half a kilo.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.listen.002
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u07_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Poproszę is a polite request used when ordering or buying something.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.match.003
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u07_l2m, second: *u07_l2m, third: *u07_l2m, fourth: *u07_l2m, fifth: *u07_l2m, sixth: *u07_l2m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "After kilo and pół kilo the noun takes a plural ending in -ów: banan becomes bananów and pomidor becomes pomidorów.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.order.004
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: word_order
    frame: {text: "Poproszę kilo {item}.", language_code: pl, direction: ltr}
    slots: {item: *u07_gen}
    answer_derivation: {kind: render_frame, frame: {text: "Poproszę kilo {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After a quantity such as kilo the noun goes into the genitive plural, which for these words ends in -ów.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.fill.005
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: fill_in_blank
    frame: {text: "Poproszę pół {item} bananów. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_kilo, hint: *s_kilo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pół kilo means half a kilo; kilo itself does not change here.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.translate.006
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: translation
    frame: {text: "I would like a kilo of tomatoes.", language_code: en, direction: ltr}
    slots: {item: *s_pomidorow}
    answer_derivation: {kind: render_frame, frame: {text: "Poproszę kilo {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Pomidor changes to pomidorów after kilo because the noun follows a quantity.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson02.translate.007
    lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u07_l2m}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mandarynka and pomarańcza are feminine, while grejpfrut is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson03.choose.001
    lesson_content_key: pl.a1.unit07.lesson03.na_targu
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u07_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Świeże is the plural form of fresh, so it fits pomidory and banany.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson03.match.002
    lesson_content_key: pl.a1.unit07.lesson03.na_targu
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u07_l3m, second: *u07_l3m, third: *u07_l3m, fourth: *u07_l3m, fifth: *u07_l3m, sixth: *u07_l3m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Pomidory is the plural of pomidor, which is why the adjective is świeże.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson03.fill.003
    lesson_content_key: pl.a1.unit07.lesson03.na_targu
    type: fill_in_blank
    frame: {text: "Pomidory są {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_swieze, hint: *s_swieze}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Plural nouns like pomidory need a plural adjective, so fresh becomes świeże.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson03.fill.004
    lesson_content_key: pl.a1.unit07.lesson03.na_targu
    type: fill_in_blank
    frame: {text: "To {item} pani. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_dla, hint: *s_dla}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dla means for and is followed by the person who gets something, here pani.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit07.lesson03.translate.005
    lesson_content_key: pl.a1.unit07.lesson03.na_targu
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u07_l3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Razem is used when adding up a price, as in the total at the market.", language_code: en, direction: ltr}
