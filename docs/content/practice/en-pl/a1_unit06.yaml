schema_version: "1.0"
pack_key: practice.en-pl.a1.unit06
source_language: en
target_language: pl
unit_content_key: pl.a1.unit06.food
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job B) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u06*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani and speaker gender where it matters. Register
    follows the unit's realization (formal pan/pani to strangers, ty between friends).
    Reviewer: zupę is excluded from bare-word pools (soup vs soup, object form); the restaurant lines use formal pan.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_chleb, w_masło, w_ser, w_woda, w_mleko, w_kawa, w_herbata, w_kawę, w_herbatę, w_wodę, w_zupa, w_sok, w_cukier, w_rachunek, w_lubić, w_lubię, w_lubi, w_zupę, w_danie, w_polecać, w_polecam, w_poleca, w_co, w_już, w_podaję]
slot_presets:
  u06_l1: &u06_l1 {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_chleb, w_masło, w_ser, w_woda, w_mleko, w_kawa, w_herbata]}}
  u06_ask: &u06_ask {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_kawę, w_herbatę, w_wodę, w_chleb, w_ser, w_mleko, w_masło]}}
  s_herbate: &s_herbate {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_herbatę}}
  s_wode: &s_wode {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_wodę}}
  u06_l2: &u06_l2 {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_zupa, w_sok, w_cukier, w_rachunek, w_lubić, w_lubię, w_lubi]}}
  u06_like: &u06_like {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_zupę, w_kawę, w_herbatę, w_wodę, w_chleb, w_ser, w_sok]}}
  s_lubi: &s_lubi {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_lubi}}
  s_zupe: &s_zupe {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_zupę}}
  u06_l3: &u06_l3 {language_code: pl, part_of_speech: [pronoun, particle, verb, noun], agreement_tags: {semantic: [w_danie, w_polecać, w_polecam, w_poleca, w_co, w_już, w_podaję]}}
  s_podaje: &s_podaje {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_podaję}}
  s_poleca: &s_poleca {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_poleca}}
templates:
  - content_key: practice.en-pl.pl.a1.unit06.lesson01.choose.001
    lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u06_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Every Polish noun has a gender: chleb and ser are masculine, kawa, herbata and woda are feminine, and masło and mleko are neuter.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson01.listen.002
    lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u06_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish has no words for a or the, so chleb can mean bread or the bread.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson01.order.003
    lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
    type: word_order
    frame: {text: "Proszę o {item}.", language_code: pl, direction: ltr}
    slots: {item: *u06_ask}
    answer_derivation: {kind: render_frame, frame: {text: "Proszę o {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After proszę o, feminine nouns in -a change to -ę (kawa, kawę), while masculine and neuter nouns like chleb and mleko stay the same.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson01.fill.004
    lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
    type: fill_in_blank
    frame: {text: "Proszę o {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_herbate, hint: *s_herbate}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Proszę o plus the object form is the polite way to ask for something.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson01.translate.005
    lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
    type: translation
    frame: {text: "Please give me water.", language_code: en, direction: ltr}
    slots: {item: *s_wode}
    answer_derivation: {kind: render_frame, frame: {text: "Proszę o {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The noun after proszę o is in its object form: woda becomes wodę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson01.translate.006
    lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u06_l1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Masło and mleko end in -o, a typical neuter ending, while chleb and ser end in a consonant and are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson02.choose.001
    lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u06_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lubić is the dictionary form; lubię is what you say about yourself and lubi is what you say about someone else.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson02.match.002
    lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u06_l2, second: *u06_l2, third: *u06_l2, fourth: *u06_l2, fifth: *u06_l2, sixth: *u06_l2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Verb endings carry the person: -ę for I (lubię) and -i for he or she (lubi).", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson02.order.003
    lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
    type: word_order
    frame: {text: "Lubię {item}.", language_code: pl, direction: ltr}
    slots: {item: *u06_like}
    answer_derivation: {kind: render_frame, frame: {text: "Lubię {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After lubię the thing you like takes the object form: zupa becomes zupę, while sok, chleb and ser stay unchanged.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson02.fill.004
    lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
    type: fill_in_blank
    frame: {text: "On {item} zupę. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_lubi, hint: *s_lubi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Lubi is the he or she form, so the pronoun on can go with it.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson02.translate.005
    lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
    type: translation
    frame: {text: "I like soup.", language_code: en, direction: ltr}
    slots: {item: *s_zupe}
    answer_derivation: {kind: render_frame, frame: {text: "Lubię {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Feminine nouns in -a take -ę when they are the object, so zupa becomes zupę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson02.translate.006
    lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u06_l2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The pair lubię and lubi shows the pattern: a different ending for each person.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson03.listen.001
    lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u06_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polecać works like lubić: polecam is I recommend and poleca is he, she or, with pan or pani, you recommend.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson03.match.002
    lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u06_l3, second: *u06_l3, third: *u06_l3, fourth: *u06_l3, fifth: *u06_l3, sixth: *u06_l3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Co pan poleca? uses the he or she form poleca, because pan and pani take third-person verbs.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson03.order.003
    lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
    type: word_order
    frame: {text: "Polecam {item}.", language_code: pl, direction: ltr}
    slots: {item: *u06_like}
    answer_derivation: {kind: render_frame, frame: {text: "Polecam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Polecam also takes the object form of the noun, just like lubię.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson03.fill.004
    lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
    type: fill_in_blank
    frame: {text: "Już {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_podaje, hint: *s_podaje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The waiter speaks in the I form, podaję, because he is the one serving.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson03.translate.005
    lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
    type: translation
    frame: {text: "What do you recommend? (to a man, formal)", language_code: en, direction: ltr}
    slots: {item: *s_poleca}
    answer_derivation: {kind: render_frame, frame: {text: "Co pan {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "With pan or pani the verb is poleca, the same form as for he or she.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit06.lesson03.translate.006
    lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u06_l3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Już can mean already or, as in Już podaję, right away.", language_code: en, direction: ltr}
