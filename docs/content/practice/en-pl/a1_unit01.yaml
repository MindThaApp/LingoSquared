schema_version: "1.0"
pack_key: practice.en-pl.a1.unit01
source_language: en
target_language: pl
unit_content_key: pl.a1.unit01.greetings
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job A) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u01*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani where it matters.
    Reviewer: check the bare-word pools (pan/pani glosses) and the cześć gloss.
    Feedback lines carry a usage or grammar point, never the task or the answer.
    Opus pass (2026-10-24): fixed a false ending claim in a feedback line (jesteś ends in -ś, not -sz); polsku and nazywam glosses no longer invite the wrong bare-word answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_pan, w_pani, w_ty, w_dobrze, w_jak, w_masz, w_ma, w_a, w_dziękuję, w_cześć, w_dobranoc, w_dzień, w_wieczór, w_dobry, w_bardzo, w_miło, w_skąd, w_jesteś, w_jestem, w_mieszkam, w_polsku, w_trochę, w_widzenia, w_zobaczenia, w_dnia, w_ale, w_imię, w_mówi, w_tak, w_uczę, w_jeszcze, w_czy, w_nazywa, w_nazywam, w_Kanady]
slot_presets:
  u01_l1: &u01_l1 {language_code: pl, part_of_speech: [pronoun, particle, adverb, verb], agreement_tags: {semantic: [w_pan, w_pani, w_ty, w_dobrze, w_jak, w_masz, w_ma, w_a, w_dziękuję]}}
  s_pan: &s_pan {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_pan}}
  u01_l1t: &u01_l1t {language_code: pl, part_of_speech: [pronoun, particle, adverb, verb], agreement_tags: {semantic: [w_pan, w_pani, w_ty, w_dobrze, w_jak, w_masz, w_ma]}}
  pan_pani: &pan_pani {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: [w_pan, w_pani]}}
  s_masz: &s_masz {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_masz}}
  u01_l2: &u01_l2 {language_code: pl, part_of_speech: [adjective, phrase, noun], agreement_tags: {semantic: [w_cześć, w_dobranoc, w_dzień, w_wieczór, w_dobry]}}
  u01_m: &u01_m {language_code: pl, part_of_speech: [pronoun, particle, adjective, adverb, verb, phrase, noun], agreement_tags: {semantic: [w_pan, w_pani, w_ty, w_cześć, w_dobranoc, w_dzień, w_wieczór, w_dobrze, w_jak, w_masz, w_ma, w_dobry, w_bardzo, w_miło, w_skąd, w_jesteś, w_jestem, w_mieszkam, w_polsku, w_trochę]}}
  widz_zob: &widz_zob {language_code: pl, part_of_speech: phrase, agreement_tags: {semantic: [w_widzenia, w_zobaczenia]}}
  s_wieczor: &s_wieczor {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_wieczór}}
  u01_l2t: &u01_l2t {language_code: pl, part_of_speech: [adjective, phrase, noun], agreement_tags: {semantic: [w_cześć, w_dobranoc, w_dzień, w_wieczór, w_dobry]}}
  s_dnia: &s_dnia {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_dnia}}
  u01_l3: &u01_l3 {language_code: pl, part_of_speech: [particle, adverb, verb, noun], agreement_tags: {semantic: [w_skąd, w_jesteś, w_jestem, w_mieszkam, w_polsku, w_trochę, w_ale, w_imię, w_mówi, w_tak, w_uczę, w_jeszcze, w_bardzo, w_miło, w_czy, w_nazywa, w_nazywam]}}
  u01_l3t: &u01_l3t {language_code: pl, part_of_speech: [particle, adverb, verb, noun], agreement_tags: {semantic: [w_skąd, w_jesteś, w_jestem, w_mieszkam, w_polsku, w_trochę, w_imię, w_mówi, w_uczę, w_jeszcze, w_bardzo, w_nazywam]}}
  Kanady: &Kanady {language_code: pl, part_of_speech: proper_noun, agreement_tags: {semantic: w_Kanady}}
  s_mowi: &s_mowi {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_mówi}}
  s_jestes: &s_jestes {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_jesteś}}
  s_milo: &s_milo {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_miło}}
templates:
  - content_key: practice.en-pl.pl.a1.unit01.lesson01.choose.001
    lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u01_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish has two kinds of you: ty with friends and family, pan (to a man) or pani (to a woman) with strangers and to show respect.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson01.fill.002
    lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
    type: fill_in_blank
    frame: {text: "Jak się {item} ma? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pan, hint: *s_pan}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "With pan or pani the verb is ma, as if you were saying how is the gentleman or lady doing; with ty it becomes masz: Jak się masz?", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson01.translate.003
    lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u01_l1t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pan and pani are not interchangeable: pan addresses a man and pani a woman, while ty is for people you know well.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson01.order.004
    lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
    type: word_order
    frame: {text: "Jak się {item} ma?", language_code: pl, direction: ltr}
    slots: {item: *pan_pani}
    answer_derivation: {kind: render_frame, frame: {text: "Jak się {item} ma?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jak się ma? asks how someone is doing; pan or pani goes in the middle, and the verb stays ma.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson01.translate.005
    lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
    type: translation
    frame: {text: "How are you? (to a friend, informal)", language_code: en, direction: ltr}
    slots: {item: *s_masz}
    answer_derivation: {kind: render_frame, frame: {text: "Jak się {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "With a friend the question ends in masz; the formal version uses ma plus pan or pani.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson02.listen.001
    lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u01_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dzień dobry is the all-day greeting until evening, dobry wieczór comes in the evening, and dobranoc is only said when parting for the night.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson02.match.002
    lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u01_m, second: *u01_m, third: *u01_m, fourth: *u01_m, fifth: *u01_m, sixth: *u01_m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Cześć is the informal word for both hello and goodbye, so it belongs with ty, not with pan or pani.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson02.order.003
    lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
    type: word_order
    frame: {text: "Do {item}!", language_code: pl, direction: ltr}
    slots: {item: *widz_zob}
    answer_derivation: {kind: render_frame, frame: {text: "Do {item}!", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Do widzenia is the standard goodbye; do zobaczenia is the friendlier see you.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson02.fill.004
    lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
    type: fill_in_blank
    frame: {text: "Dobry {item}! ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_wieczor, hint: *s_wieczor}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dobry wieczór is used in the evening; in the daytime you say dzień dobry.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson02.translate.005
    lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u01_l2t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cześć works both as hello and as goodbye, but only with people you would address as ty.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson02.translate.006
    lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
    type: translation
    frame: {text: "Have a nice day!", language_code: en, direction: ltr}
    slots: {item: *s_dnia}
    answer_derivation: {kind: render_frame, frame: {text: "Miłego {item}!", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Miłego dnia is a wish, so the word for day changes its ending to dnia.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.choose.001
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u01_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish usually drops the pronoun because the verb ending shows the person: jestem means I am, jesteś means you are.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.listen.002
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u01_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Jestem z + country says where you are from, and mieszkam w + city says where you live.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.translate.003
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u01_l3t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Verb endings carry the person: -m for I (jestem, mieszkam) and -sz or -ś for informal you (masz, jesteś).", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.order.004
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: word_order
    frame: {text: "Jestem z {item}, ale mieszkam w Warszawie.", language_code: pl, direction: ltr}
    slots: {item: *Kanady}
    answer_derivation: {kind: render_frame, frame: {text: "Jestem z {item}, ale mieszkam w Warszawie.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After z (from), the country name takes a different ending: Kanady.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.fill.005
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: fill_in_blank
    frame: {text: "Czy pan {item} po polsku? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_mowi, hint: *s_mowi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A formal question about a man uses the he/she verb form: Czy pan mówi po polsku?", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.translate.006
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: translation
    frame: {text: "Where are you from? (to a friend, informal)", language_code: en, direction: ltr}
    slots: {item: *s_jestes}
    answer_derivation: {kind: render_frame, frame: {text: "Skąd {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Skąd asks where from; with a friend the verb is jesteś, while the formal form is Skąd pan jest?", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit01.lesson03.translate.007
    lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
    type: translation
    frame: {text: "Very nice to meet you.", language_code: en, direction: ltr}
    slots: {item: *s_milo}
    answer_derivation: {kind: render_frame, frame: {text: "Bardzo mi {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Bardzo mi miło literally says very pleasant to me and is the usual reply when meeting someone.", language_code: en, direction: ltr}
