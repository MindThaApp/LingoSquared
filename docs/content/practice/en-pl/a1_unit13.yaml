schema_version: "1.0"
pack_key: practice.en-pl.a1.unit13
source_language: en
target_language: pl
unit_content_key: pl.a1.unit13.lubie_i_wole
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job C) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u13*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors so every
    frame is grammatical (gender, case, number). Fixed English prompts name
    ty vs pan/pani and speaker gender where it matters, and are worded so only
    one natural Polish word order fits. Register follows the unit's
    realization (ty between friends, pan/pani when formal).
    Reviewer: unit has only 4 first-sight lexemes (muzyka, muzykę, lubisz, wolę), so no matching_pairs (needs 6) and 15 templates; lesson 3 has no first-sight lexemes. Pronoun ja is literal frame text (earlier unit).
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_muzyka, w_muzykę, w_lubisz, w_wolę]
slot_presets:
  u13_all: &u13_all {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_muzyka, w_muzykę, w_lubisz, w_wolę]}}
  s_muzyke: &s_muzyke {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_muzykę}}
  s_lubisz: &s_lubisz {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_lubisz}}
  s_wole: &s_wole {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_wolę}}
templates:
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.choose.001
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u13_all}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Muzyka is the basic form of the noun; after lubię or lubisz it changes to muzykę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.listen.002
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u13_all}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lubisz is the ty form of lubić, used with a friend; lubię is the I form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.order.003
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: word_order
    frame: {text: "Czy lubisz {item}?", language_code: pl, direction: ltr}
    slots: {item: *s_muzyke}
    answer_derivation: {kind: render_frame, frame: {text: "Czy lubisz {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Feminine nouns in -a take -ę after lubić, the same change as kawa to kawę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.order.004
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: word_order
    frame: {text: "Bardzo lubię {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_muzyke}
    answer_derivation: {kind: render_frame, frame: {text: "Bardzo lubię {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Bardzo goes before the verb and makes it stronger, like very much in English.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.fill.005
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: fill_in_blank
    frame: {text: "Czy {item} muzykę? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_lubisz, hint: *s_lubisz}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Adding -sz to the stem addresses a friend: lubię (I) becomes lubisz (you).", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.fill.006
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: fill_in_blank
    frame: {text: "Lubię {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_muzyke, hint: *s_muzyke}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After lubię the thing you like goes into the object form, so muzyka becomes muzykę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.translate.007
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: translation
    frame: {text: "I really like music.", language_code: en, direction: ltr}
    slots: {item: *s_muzyke}
    answer_derivation: {kind: render_frame, frame: {text: "Bardzo lubię {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Polish does not repeat the noun in short answers, but a full sentence needs the object form muzykę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.translate.008
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: translation
    frame: {text: "Do you like music? (to a friend, ty; start with czy)", language_code: en, direction: ltr}
    slots: {item: *s_muzyke}
    answer_derivation: {kind: render_frame, frame: {text: "Czy lubisz {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Czy at the start turns a statement into a yes or no question.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson01.translate.009
    lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u13_all}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The object form muzykę and the basic form muzyka are two forms of one noun.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson02.choose.001
    lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u13_all}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wolę is the I form of woleć, to prefer; it works like lubię.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson02.listen.002
    lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u13_all}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wolę ends in -ę like lubię, which marks the I form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson02.order.003
    lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
    type: word_order
    frame: {text: "Ja też {item} herbatę.", language_code: pl, direction: ltr}
    slots: {item: *s_wole}
    answer_derivation: {kind: render_frame, frame: {text: "Ja też {item} herbatę.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Ja też means me too and is followed by the same verb as in the first speaker's sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson02.fill.004
    lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
    type: fill_in_blank
    frame: {text: "Ja {item} herbatę. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_wole, hint: *s_wole}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Wolę takes the object form, so herbata becomes herbatę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson02.translate.005
    lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
    type: translation
    frame: {text: "Me too: I prefer tea.", language_code: en, direction: ltr}
    slots: {item: *s_wole}
    answer_derivation: {kind: render_frame, frame: {text: "Ja też {item} herbatę.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Ja is added for emphasis; the verb ending -ę already means I.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit13.lesson02.translate.006
    lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u13_all}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Wolę is I prefer; unlike lubię it chooses one thing over another.", language_code: en, direction: ltr}
