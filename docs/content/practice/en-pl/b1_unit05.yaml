    lesson_content_key: pl.b1.unit05.lesson01.powiedzial_ze
    type: translation
    frame: {text: "Marek said that he is tired.", language_code: en, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "Marek {item}, że jest zmęczony.", language_code: pl, direction: ltr}, accepted_variants: ["Marek {item}, że on jest zmęczony."]}
    feedback_frame: {text: "Polish keeps the present tense after powiedział, że.", language_code: en, direction: ltr}
