schema_version: "1.0"
pack_key: practice.en-pl.b1.unit05
source_language: en
target_language: pl
unit_content_key: pl.b1.unit05.mowa_zalezna
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-pl B1 set) from scripts/backfill_lexemes_en_pl.py (en-pl-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Reported speech: Polish keeps the tense of the original (powiedział, że jest...), reports yes/no questions with czy and other questions with the question word. Gendered past forms (powiedział, powiedziała, zapytał, zapytała) are the anchors. Variants accept an added subject pronoun and the reflexive się placed before the verb. NATIVE FLAG: none beyond the unit.
tag_schema:
