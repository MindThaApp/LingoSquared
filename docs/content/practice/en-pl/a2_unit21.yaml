schema_version: "1.0"
pack_key: practice.en-pl.a2.unit21
source_language: en
target_language: pl
unit_content_key: pl.a2.unit21.sprawy_urzedowe
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-pl A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_pl.py (a2 course, tags pl_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and ty/pan/pani where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the case-ending notes in feedback (genitive after potrzebować/szukać/od, object forms)
    and the polite conditional forms (chciałabym/chciałbym, mógłby).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_urząd, w_adres, w_dokumenty, w_dowód, w_mieszkanie, w_nowy, w_zameldować, w_osobisty, w_urzędzie, w_chciałabym, w_czym, w_pomóc, w_ponieważ, w_przeprowadziłam, w_muszę, w_kiedy, w_mogę, w_umowa, w_dni, w_ulica, w_wszystko, w_gotowe, w_przeprowadzki, w_najmu, w_umowę]
slot_presets:
  pool1: &pool1 {language_code: pl, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_urząd, w_adres, w_dokumenty, w_dowód, w_mieszkanie, w_nowy]}}
  pool2: &pool2 {language_code: pl, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_urząd, w_adres, w_dokumenty, w_dowód, w_mieszkanie, w_zameldować]}}
  pool3: &pool3 {language_code: pl, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_urząd, w_adres, w_dokumenty, w_dowód, w_mieszkanie, w_zameldować, w_nowy, w_osobisty]}}
  s_nowy: &s_nowy {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_nowy}}
  s_urzedzie: &s_urzedzie {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_urzędzie}}
  s_dowod: &s_dowod {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_dowód}}
  pool4: &pool4 {language_code: pl, part_of_speech: [pronoun, verb, particle], agreement_tags: {semantic: [w_chciałabym, w_czym, w_pomóc, w_ponieważ, w_przeprowadziłam, w_muszę]}}
  pool5: &pool5 {language_code: pl, part_of_speech: [pronoun, verb, particle], agreement_tags: {semantic: [w_chciałabym, w_czym, w_pomóc, w_ponieważ, w_przeprowadziłam, w_muszę, w_kiedy, w_mogę]}}
  s_moge: &s_moge {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_mogę}}
  s_kiedy: &s_kiedy {language_code: pl, part_of_speech: particle, agreement_tags: {semantic: w_kiedy}}
  s_przeprowadzilam: &s_przeprowadzilam {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_przeprowadziłam}}
  s_musze: &s_musze {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_muszę}}
  pool6: &pool6 {language_code: pl, part_of_speech: [pronoun, verb, particle], agreement_tags: {semantic: [w_chciałabym, w_czym, w_pomóc, w_ponieważ, w_przeprowadziłam, w_muszę, w_kiedy]}}
  pool7: &pool7 {language_code: pl, part_of_speech: [noun, pronoun, adjective], agreement_tags: {semantic: [w_umowa, w_dni, w_ulica, w_wszystko, w_gotowe, w_przeprowadzki, w_najmu]}}
  pool8: &pool8 {language_code: pl, part_of_speech: [noun, pronoun, adjective], agreement_tags: {semantic: [w_umowa, w_najmu, w_dni, w_ulica, w_umowę, w_przeprowadzki, w_wszystko, w_gotowe]}}
  s_umowe: &s_umowe {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_umowę}}
  s_przeprowadzki: &s_przeprowadzki {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_przeprowadzki}}
  s_dni: &s_dni {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_dni}}
  s_gotowe: &s_gotowe {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_gotowe}}
templates:
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.choose.001
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Urząd is the office where you handle official matters; dokumenty is always plural.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.listen.002
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dowód osobisty is the ID card; the two words stay together.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.match.003
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool3, second: *pool3, third: *pool3, fourth: *pool3, fifth: *pool3, sixth: *pool3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Zameldować się means to register your address with the authorities; the verb is always used with się.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.order.004
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: word_order
    frame: {text: "Mam {item} adres.", language_code: pl, direction: ltr}
    slots: {item: *s_nowy}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} adres.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Nowy is masculine, so it matches the masculine noun adres.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.order.005
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: word_order
    frame: {text: "Chcę zameldować się w {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_urzedzie}
    answer_derivation: {kind: render_frame, frame: {text: "Chcę zameldować się w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After w the noun changes its ending: urząd becomes urzędzie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.fill.006
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: fill_in_blank
    frame: {text: "To jest mój {item} osobisty. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_dowod, hint: *s_dowod}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dowód osobisty is the full name of the ID card; osobisty describes it.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.translate.007
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: translation
    frame: {text: "I have a new address.", language_code: en, direction: ltr}
    slots: {item: *s_nowy}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} adres.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Adjectives agree with the noun: nowy goes with the masculine adres.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson01.translate.008
    lesson_content_key: pl.a2.unit21.lesson01.slownictwo_urzedowe
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Polish nouns for papers such as dokumenty are plural: one asks for dokumenty, not a single dokument.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.choose.001
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Chciałabym is the polite form of chcę; the -abym ending is used by a woman, a man says chciałbym.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.listen.002
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Chciałabym is the polite form of chcę; the -abym ending is used by a woman, a man says chciałbym.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.match.003
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool5, second: *pool5, third: *pool5, fourth: *pool5, fifth: *pool5, sixth: *pool5}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The past tense shows the speaker's gender: przeprowadziłam is said by a woman, przeprowadziłem by a man.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.order.004
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: word_order
    frame: {text: "Czym {item} pani pomóc?", language_code: pl, direction: ltr}
    slots: {item: *s_moge}
    answer_derivation: {kind: render_frame, frame: {text: "Czym {item} pani pomóc?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Czym mogę pani pomóc? is the standard polite offer of help from a clerk.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.order.005
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: word_order
    frame: {text: "Do {item} muszę się zameldować?", language_code: pl, direction: ltr}
    slots: {item: *s_kiedy}
    answer_derivation: {kind: render_frame, frame: {text: "Do {item} muszę się zameldować?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Do kiedy asks for a deadline, literally until when.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.fill.006
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: fill_in_blank
    frame: {text: "{item} się w zeszłym tygodniu. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_przeprowadzilam, hint: *s_przeprowadzilam}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The ending -łam marks a woman speaking about herself in the past tense.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.translate.007
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: translation
    frame: {text: "I must register. (Use the verb with się after it.)", language_code: en, direction: ltr}
    slots: {item: *s_musze}
    answer_derivation: {kind: render_frame, frame: {text: "{item} się zameldować.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Muszę is followed by an infinitive: muszę się zameldować.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson02.translate.008
    lesson_content_key: pl.a2.unit21.lesson02.chcialabym_sie_zameldowac
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ponieważ introduces a reason and is followed by a full clause.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.choose.001
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Umowa najmu is a rental agreement; najmu is a form of najem that always follows umowa.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.listen.002
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Umowa najmu is a rental agreement; najmu is a form of najem that always follows umowa.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.match.003
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool8, second: *pool8, third: *pool8, fourth: *pool8, fifth: *pool8, sixth: *pool8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "After a number like trzydzieści, the noun dzień takes the plural form dni.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.order.004
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: word_order
    frame: {text: "Mam {item} najmu.", language_code: pl, direction: ltr}
    slots: {item: *s_umowe}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} najmu.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mam takes the object form umowę, not the basic form umowa.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.order.005
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: word_order
    frame: {text: "Ma pani trzydzieści dni od {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_przeprowadzki}
    answer_derivation: {kind: render_frame, frame: {text: "Ma pani trzydzieści dni od {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Od is followed by the genitive: przeprowadzka becomes przeprowadzki.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.fill.006
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: fill_in_blank
    frame: {text: "Mam trzydzieści {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_dni, hint: *s_dni}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After trzydzieści the noun appears in the form dni.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.translate.007
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: translation
    frame: {text: "Everything is ready.", language_code: en, direction: ltr}
    slots: {item: *s_gotowe}
    answer_derivation: {kind: render_frame, frame: {text: "Wszystko jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Gotowe is neuter, matching wszystko.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit21.lesson03.translate.008
    lesson_content_key: pl.a2.unit21.lesson03.w_urzedzie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Umowa is the basic form; umowę is the form used as the object of mam.", language_code: en, direction: ltr}
