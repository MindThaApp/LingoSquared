schema_version: "1.0"
pack_key: practice.en-pl.a2.unit23
source_language: en
target_language: pl
unit_content_key: pl.a2.unit23.w_banku
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-pl A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_pl.py (a2 course, tags pl_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and ty/pan/pani where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the case-ending notes in feedback (genitive after potrzebować/szukać/od, object forms)
    and the polite conditional forms (chciałabym/chciałbym, mógłby).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_numer, w_bank, w_banku, w_konto, w_pieniądze, w_pesel, w_otworzyć, w_wpłacić, w_pieniędzy, w_chciałbym, w_bankowe, w_potrzebuję, w_dowodu, w_osobistego, w_żeby, w_sto, w_złotych, w_ile, w_świetnie, w_oczywiście]
slot_presets:
  pool1: &pool1 {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_numer, w_bank, w_banku, w_konto, w_pieniądze, w_pesel]}}
  pool2: &pool2 {language_code: pl, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_numer, w_bank, w_banku, w_konto, w_pieniądze, w_pesel, w_otworzyć, w_wpłacić]}}
  s_konto: &s_konto {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_konto}}
  s_pieniedzy: &s_pieniedzy {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pieniędzy}}
  s_pesel: &s_pesel {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pesel}}
  pool3: &pool3 {language_code: pl, part_of_speech: [noun, verb, adjective, particle], agreement_tags: {semantic: [w_chciałbym, w_otworzyć, w_bankowe, w_potrzebuję, w_dowodu, w_osobistego, w_żeby]}}
  s_otworzyc: &s_otworzyc {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_otworzyć}}
  s_potrzebuje: &s_potrzebuje {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_potrzebuję}}
  s_bankowe: &s_bankowe {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_bankowe}}
  s_dowodu: &s_dowodu {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_dowodu}}
  pool4: &pool4 {language_code: pl, part_of_speech: [noun, verb, adjective, adverb, particle], agreement_tags: {semantic: [w_sto, w_złotych, w_wpłacić, w_ile, w_świetnie, w_oczywiście]}}
  s_sto: &s_sto {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_sto}}
  s_wplacic: &s_wplacic {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_wpłacić}}
templates:
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.choose.001
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pesel is the national identification number; Polish forms ask for numer PESEL.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.listen.002
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pesel is the national identification number; Polish forms ask for numer PESEL.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.match.003
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool2, second: *pool2, third: *pool2, fourth: *pool2, fifth: *pool2, sixth: *pool2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Pieniądze is always plural in Polish, although money is uncountable in English.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.order.004
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: word_order
    frame: {text: "Mam {item} w banku.", language_code: pl, direction: ltr}
    slots: {item: *s_konto}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} w banku.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "W banku uses the locative: bank becomes banku after w.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.order.005
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: word_order
    frame: {text: "Mam dużo {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_pieniedzy}
    answer_derivation: {kind: render_frame, frame: {text: "Mam dużo {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After dużo the word for money takes the genitive: pieniędzy.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.fill.006
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: fill_in_blank
    frame: {text: "Mam numer {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pesel, hint: *s_pesel}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Numer PESEL is the eleven-digit identification number.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.translate.007
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: translation
    frame: {text: "I have an account at the bank.", language_code: en, direction: ltr}
    slots: {item: *s_konto}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} w banku.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Konto is neuter; the word for the bank after w becomes banku.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson01.translate.008
    lesson_content_key: pl.a2.unit23.lesson01.slownictwo_bankowe
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Banku is the form of bank used after w and in the genitive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.choose.001
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Chciałbym is the polite form of chcę used by a man; a woman says chciałabym.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.listen.002
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Chciałbym is the polite form of chcę used by a man; a woman says chciałabym.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.order.003
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: word_order
    frame: {text: "Chciałbym {item} konto bankowe.", language_code: pl, direction: ltr}
    slots: {item: *s_otworzyc}
    answer_derivation: {kind: render_frame, frame: {text: "Chciałbym {item} konto bankowe.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Chciałbym is followed by an infinitive: otworzyć.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.fill.004
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: fill_in_blank
    frame: {text: "Do tego {item} dowodu osobistego. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_potrzebuje, hint: *s_potrzebuje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Potrzebować takes the genitive, so dowód osobisty becomes dowodu osobistego.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.translate.005
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: translation
    frame: {text: "I would like to open a bank account. (spoken by a man)", language_code: en, direction: ltr}
    slots: {item: *s_bankowe}
    answer_derivation: {kind: render_frame, frame: {text: "Chciałbym otworzyć konto {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Bankowe is neuter, matching konto.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.translate.006
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: translation
    frame: {text: "I need an ID card.", language_code: en, direction: ltr}
    slots: {item: *s_dowodu}
    answer_derivation: {kind: render_frame, frame: {text: "Potrzebuję {item} osobistego.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Potrzebuję is followed by the genitive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson02.translate.007
    lesson_content_key: pl.a2.unit23.lesson02.chcialbym_otworzyc_konto
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Żeby plus an infinitive means in order to.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.choose.001
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Złotych is the plural form used after numbers from five up, such as sto.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.listen.002
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Złotych is the plural form used after numbers from five up, such as sto.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.order.003
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: word_order
    frame: {text: "Chcę wpłacić {item} złotych.", language_code: pl, direction: ltr}
    slots: {item: *s_sto}
    answer_derivation: {kind: render_frame, frame: {text: "Chcę wpłacić {item} złotych.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Sto is followed by the genitive plural: sto złotych.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.order.004
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: word_order
    frame: {text: "Oczywiście, chcę {item} pieniądze.", language_code: pl, direction: ltr}
    slots: {item: *s_wplacic}
    answer_derivation: {kind: render_frame, frame: {text: "Oczywiście, chcę {item} pieniądze.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Wpłacić means to pay money into an account.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.fill.005
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: fill_in_blank
    frame: {text: "Chcę wpłacić {item} złotych. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_sto, hint: *s_sto}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sto is invariable and is followed by złotych.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.translate.006
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: translation
    frame: {text: "I want to deposit money.", language_code: en, direction: ltr}
    slots: {item: *s_wplacic}
    answer_derivation: {kind: render_frame, frame: {text: "Chcę {item} pieniądze.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Wpłacić is the perfective verb for a single deposit.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit23.lesson03.translate.007
    lesson_content_key: pl.a2.unit23.lesson03.otwieramy_konto
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Oczywiście is a handy reply when someone asks if you have something.", language_code: en, direction: ltr}
