  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_fajny, w_obejrzeć, w_seans, w_zacząć, w_zaraz, w_zacznie, w_zobaczyć, w_nowy, w_godzinę, w_ósmą, w_repertuar, w_popcorn, w_dzieci, w_muzeum, w_emocjonujący, w_był]
