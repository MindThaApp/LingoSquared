    semantic: [w_był, w_dzieci, w_emocjonujący, w_fajny, w_godzinę, w_muzeum, w_nowy, w_obejrzeć, w_popcorn, w_repertuar, w_seans, w_zacznie, w_zacząć, w_zaraz, w_zobaczyć, w_ósmą]
