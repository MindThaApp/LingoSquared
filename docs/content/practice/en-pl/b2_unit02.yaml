schema_version: '1.0'
pack_key: practice.en-pl.b2.unit02
source_language: en
target_language: pl
unit_content_key: pl.b2.unit02.spekulacja
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_b2_u2 / w_<token>). 45 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_auto, w_być, w_chory, w_dnia, w_drodze, w_dziś, w_jedno, w_korek, w_miał, w_może, w_musi, w_musiał, w_musiało, w_musieć, w_mógł, w_mógłby, w_niemożliwe, w_pewne, w_pewno, w_pociąg, w_prawdopodobnie, w_przegapić, w_przegapił, w_przyjść, w_rano, w_spotkanie, w_spotkaniu, w_spóźnia, w_stać, w_stoi, w_szczyt, w_telefon, w_widziałem, w_wieczorem, w_wiem, w_wyłączony, w_wątpienia, w_zajęty, w_zapomniał, w_zapomnieć, w_zaspać, w_zaspał, w_zgaduję, w_zgadywać, w_zniknęło]
templates:
- content_key: practice.en-pl.pl.b2.unit02.lesson01.choose.001
  lesson_content_key: pl.b2.unit02.lesson01.jak_bardzo_jestes_pewien
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_spóźnia, w_drodze, w_może, w_prawdopodobnie, w_pewno, w_wątpienia, w_zajęty, w_musieć, w_musi, w_korek, w_stoi, w_stać, w_chory, w_być, w_niemożliwe, w_auto, w_zniknęło, w_widziałem, w_dziś, w_rano, w_mógłby, w_zgadywać, w_zgaduję, w_wiem, w_przegapić, w_przegapił, w_pociąg, w_musiał, w_musiało, w_zaspać, w_zaspał, w_dnia, w_zapomnieć, w_zapomniał, w_spotkaniu, w_spotkanie, w_mógł, w_miał, w_przyjść, w_wieczorem, w_telefon, w_wyłączony, w_szczyt, w_jedno, w_pewne]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how certain are you?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson02.listen.001
  lesson_content_key: pl.b2.unit02.lesson02.dedukcja
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on deduction: it must be so.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson03.translate.001
  lesson_content_key: pl.b2.unit02.lesson03.domysl_czy_dedukcja
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a guess or a deduction?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson04.match.001
  lesson_content_key: pl.b2.unit02.lesson04.spekulowanie_o_przeszlosci
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson05.choose.001
  lesson_content_key: pl.b2.unit02.lesson05.fakt_czy_spekulacja
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fact or speculation?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson01.translate.002
  lesson_content_key: pl.b2.unit02.lesson01.jak_bardzo_jestes_pewien
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how certain are you?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson01.order.003
  lesson_content_key: pl.b2.unit02.lesson01.jak_bardzo_jestes_pewien
  type: word_order
  frame: {text: 'Dlaczego się {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_spóźnia}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Dlaczego się {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Why is he late? Spóźniać się (''to be running late'') is reflexive; spóźnia is its 3rd-person singular present form.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson01.fill.004
  lesson_content_key: pl.b2.unit02.lesson01.jak_bardzo_jestes_pewien
  type: fill_in_blank
  frame:
    text: Jest w {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_drodze}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_drodze}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: He is on the way. drodze means way; road (after 'on')., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson01.translate.005
  lesson_content_key: pl.b2.unit02.lesson01.jak_bardzo_jestes_pewien
  type: translation
  frame: {text: He cannot be sick., language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_może}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nie {item} być chory.', language_code: pl, direction: ltr}
  feedback_frame: {text: He cannot be sick. może means maybe; perhaps., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson02.order.002
  lesson_content_key: pl.b2.unit02.lesson02.dedukcja
  type: word_order
  frame: {text: 'On {item} być w korku.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_musi}
  answer_derivation:
    kind: render_frame
    frame: {text: 'On {item} być w korku.', language_code: pl, direction: ltr}
  feedback_frame: {text: He must be stuck in traffic. musi means must (formal)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson02.fill.003
  lesson_content_key: pl.b2.unit02.lesson02.dedukcja
  type: fill_in_blank
  frame:
    text: Musi {item} w korku. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_stać}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_stać}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: He must be stuck in traffic. stać means to stand; be stuck., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson02.translate.004
  lesson_content_key: pl.b2.unit02.lesson02.dedukcja
  type: translation
  frame: {text: He cannot be sick., language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_chory}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nie może być {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: He cannot be sick. chory means sick (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson04.order.002
  lesson_content_key: pl.b2.unit02.lesson04.spekulowanie_o_przeszlosci
  type: word_order
  frame: {text: 'Musiał {item} pociąg.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_przegapić}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Musiał {item} pociąg.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'He must have missed the train. Musiał (past of musieć) + the PERFECTIVE infinitive przegapić is how Polish expresses past epistemic necessity -- there is no separate ''have''-auxiliary construction to learn, unlike English''s ''must.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson04.fill.003
  lesson_content_key: pl.b2.unit02.lesson04.spekulowanie_o_przeszlosci
  type: fill_in_blank
  frame:
    text: Czekam na {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_pociąg}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_pociąg}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I'm waiting for the train. pociąg means train., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit02.lesson04.translate.004
  lesson_content_key: pl.b2.unit02.lesson04.spekulowanie_o_przeszlosci
  type: translation
  frame: {text: 'Marek: Then he must have missed the train.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_musiał}
  answer_derivation:
    kind: render_frame
    frame: {text: 'To {item} przegapić pociąg.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Marek: Then he must have missed the train. musiał means he had to; must have.', language_code: en, direction: ltr}
