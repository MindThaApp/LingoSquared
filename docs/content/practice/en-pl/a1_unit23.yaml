  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_sumie, w_płacić, w_kartą, w_gotówką, w_płacę, w_podzielimy, w_osobno, w_podzielić, w_reszta, w_potrzebuję, w_reszty, w_dania, w_główne, w_dwie, w_kawy, w_zapłacono, w_poprosimy, w_pomysł, w_dzisiaj, w_pomogłaś, w_strony, w_płaci]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how much does it cost in total?.', language_code: en, direction: ltr}
