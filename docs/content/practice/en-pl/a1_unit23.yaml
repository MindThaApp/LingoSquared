review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u23 / w_<token>). 22 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_dania, w_dwie, w_dzisiaj, w_gotówką, w_główne, w_kartą, w_kawy, w_osobno, w_podzielimy, w_podzielić, w_pomogłaś, w_pomysł, w_poprosimy, w_potrzebuję, w_płaci, w_płacić, w_płacę, w_reszta, w_reszty, w_strony, w_sumie, w_zapłacono]
