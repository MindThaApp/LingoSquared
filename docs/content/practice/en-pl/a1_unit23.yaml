  feedback_frame: {text: 'Shall we split the bill? podzielimy means we will divide.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit23.lesson03.fill.003
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: fill_in_blank
  frame:
