  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: word_order
  frame: {text: 'Ile to kosztuje w {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_sumie}
