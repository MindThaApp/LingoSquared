  feedback_frame: {text: 'Can I pay by card here? kartą means card (by card).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit23.lesson02.fill.003
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: fill_in_blank
  frame:
    text: Czy chce pan zapłacić {item}, czy kartą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_gotówką}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_gotówką}
