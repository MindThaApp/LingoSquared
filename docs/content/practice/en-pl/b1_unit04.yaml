  notes: >-
    Authored 2026-10-25 (session 12, en-pl B1 set) from scripts/backfill_lexemes_en_pl.py (en-pl-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Relative clauses with który in different cases: nominative (który), object (którą), genitive after a negated verb (którego), dative after pomagać (której), instrumental after z (którym). The relative word is the anchor in most sentences so the case is the learning point. Variants accept an added subject pronoun and oto for to jest. NATIVE FLAG: confirm the genitive of the object after nie znam (którego) and that mieszkam od pięciu lat uses lat after pięciu.
