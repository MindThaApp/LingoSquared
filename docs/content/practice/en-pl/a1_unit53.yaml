schema_version: '1.0'
pack_key: practice.en-pl.a1.unit53
source_language: en
target_language: pl
unit_content_key: pl.a1.unit53.plaza
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u53 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_była, w_ciepły, w_fala, w_morze, w_morzu, w_parasol, w_parasole, w_parasolem, w_piasek, w_piasku, w_piękne, w_plaży, w_popływamy, w_siedzę, w_wydmowa, w_zamykają, w_zoo]
templates:
- content_key: practice.en-pl.pl.a1.unit53.lesson01.choose.001
  lesson_content_key: pl.a1.unit53.lesson01.pojdziemy_na_plaze
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_była, w_morze, w_piasek, w_ciepły, w_fala, w_morzu, w_parasol, w_siedzę, w_parasolem, w_wydmowa, w_parasole, w_zamykają, w_piękne, w_popływamy, w_piasku, w_zoo, w_plaży]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the beach?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit53.lesson02.listen.001
  lesson_content_key: pl.a1.unit53.lesson02.piasek_i_fale
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
