schema_version: '1.0'
pack_key: practice.en-pl.a1.unit22
source_language: en
target_language: pl
unit_content_key: pl.a1.unit22.komunikacja
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u22 / w_<token>). 31 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_być, w_czas, w_dumna, w_dużo, w_dzwoni, w_dzwonisz, w_dzwonić, w_fajnie, w_lepiej, w_minut, w_muszę, w_myślałem, w_myśleć, w_mów, w_oczywiście, w_oddzwonię, w_poszła, w_powiedzieć, w_powtórzyć, w_przeszły, w_później, w_rozmawia, w_rozmawiam, w_sms, w_szybko, w_słyszeć, w_słyszę, w_wyślę, w_zadzwonię, w_zmiana, w_znaczy]
templates:
- content_key: practice.en-pl.pl.a1.unit22.lesson01.choose.001
  lesson_content_key: pl.a1.unit22.lesson01.zadzwonie_do_ciebie
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_dzwonić, w_muszę, w_zadzwonię, w_rozmawiam, w_rozmawia, w_powtórzyć, w_mów, w_szybko, w_słyszę, w_sms, w_wyślę, w_oddzwonię, w_później, w_powiedzieć, w_oczywiście, w_minut, w_fajnie, w_dzwonisz, w_poszła, w_zmiana, w_lepiej, w_myślałem, w_czas, w_przeszły, w_być, w_myśleć, w_słyszeć, w_dumna, w_dużo, w_znaczy, w_dzwoni]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i''ll call you.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson02.listen.001
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who am i speaking with?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson03.translate.001
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on can you repeat that?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson04.match.001
  lesson_content_key: pl.a1.unit22.lesson04.wysylanie_sms_a
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson05.choose.001
  lesson_content_key: pl.a1.unit22.lesson05.czytanie_rozmowy_sms_owej
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a text exchange.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson06.translate.001
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a phone call after the shift.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame: {text: 'Z kim {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_rozmawiam}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Z kim {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Who am I speaking with? Z kim rozmawiam? (literally ''with whom am I talking?'') is the standard phrase for an unfamiliar caller; kim is the instrumental after z.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame: {text: 'Możesz to {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_powtórzyć}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Możesz to {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Can you repeat that? Możesz (can you, from móc) + the infinitive powtórzyć (to repeat) + to (that).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_mów}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_mów}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Don''t speak so fast, please. Nie mów is the negative imperative (don''t speak); tak szybko means ''so fast''.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame: {text: I can't hear you well., language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_słyszę}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nie {item} cię dobrze.', language_code: pl, direction: ltr}
  feedback_frame: {text: I can't hear you well. Nie słyszę cię dobrze states a hearing problem; cię is the accusative of ty and dobrze means 'well'., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame: {text: 'Jak ci {item} pierwsza zmiana?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_poszła}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Jak ci {item} pierwsza zmiana?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'How was your first shift? Jak ci poszła ...? (literally ''how did ... go for you?'') asks about something that already happened. Ci is the dative of ty, and poszła agrees with the feminine noun zmiana.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_zmiana}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_zmiana}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'His first shift went really well. Jego (his) never changes and goes before the noun: jego pierwsza zmiana; the feminine noun does not affect it.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame: {text: 'It went really well, better than I thought.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_lepiej}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Poszło bardzo dobrze, {item}, niż myślałem.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'It went really well, better than I thought. Poszło is the past of iść with the ending -o (''it''; here ''to turn out''); myślałem is the past of myśleć (to think), with the ending for a male speaker.', language_code: en, direction: ltr}
