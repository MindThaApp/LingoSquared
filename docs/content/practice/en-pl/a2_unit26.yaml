schema_version: "1.0"
pack_key: practice.en-pl.a2.unit26
source_language: en
target_language: pl
unit_content_key: pl.a2.unit26.rozmowa_kwalifikacyjna
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-pl A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_pl.py (a2 course, tags pl_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and ty/pan/pani where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the case-ending notes in feedback (genitive after potrzebować/szukać/od, object forms)
    and the polite conditional forms (chciałabym/chciałbym, mógłby).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_inżynier, w_praca, w_rozmowa, w_doświadczenie, w_pytania, w_pracować, w_pracy, w_rozmowę, w_kwalifikacyjną, w_pracowałem, w_jako, w_lata, w_dostępny, w_razu, w_godziny, w_elastyczne, w_doskonale, w_jakie]
slot_presets:
  pool1: &pool1 {language_code: pl, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_inżynier, w_praca, w_rozmowa, w_doświadczenie, w_pytania, w_pracować, w_pracy]}}
  pool2: &pool2 {language_code: pl, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_inżynier, w_praca, w_rozmowa, w_doświadczenie, w_pytania, w_pracować, w_pracy, w_rozmowę]}}
  s_rozmowe: &s_rozmowe {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_rozmowę}}
  s_pracy: &s_pracy {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pracy}}
  s_pytania: &s_pytania {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pytania}}
  s_kwalifikacyjna: &s_kwalifikacyjna {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_kwalifikacyjną}}
  pool3: &pool3 {language_code: pl, part_of_speech: [noun, verb, adjective, preposition], agreement_tags: {semantic: [w_pracowałem, w_jako, w_lata, w_dostępny, w_razu, w_inżynier, w_doświadczenie]}}
  s_jako: &s_jako {language_code: pl, part_of_speech: preposition, agreement_tags: {semantic: w_jako}}
  s_razu: &s_razu {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_razu}}
  s_dostepny: &s_dostepny {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_dostępny}}
  s_pracowalem: &s_pracowalem {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_pracowałem}}
  pool4: &pool4 {language_code: pl, part_of_speech: [noun, verb, adjective, preposition], agreement_tags: {semantic: [w_pracowałem, w_jako, w_lata, w_dostępny, w_razu]}}
  pool5: &pool5 {language_code: pl, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: [w_godziny, w_elastyczne, w_doskonale, w_pytania, w_dostępny, w_praca]}}
  s_elastyczne: &s_elastyczne {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_elastyczne}}
  s_doswiadczenie: &s_doswiadczenie {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_doświadczenie}}
  pool6: &pool6 {language_code: pl, part_of_speech: [noun, pronoun, adjective, adverb], agreement_tags: {semantic: [w_godziny, w_elastyczne, w_jakie, w_doskonale]}}
templates:
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.choose.001
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pytania is the plural of pytanie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.listen.002
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pytania is the plural of pytanie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.match.003
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool2, second: *pool2, third: *pool2, fourth: *pool2, fifth: *pool2, sixth: *pool2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Rozmowa kwalifikacyjna is the fixed phrase for a job interview.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.order.004
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: word_order
    frame: {text: "Mam {item} kwalifikacyjną.", language_code: pl, direction: ltr}
    slots: {item: *s_rozmowe}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item} kwalifikacyjną.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Both words change to the object form: rozmowę kwalifikacyjną.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.fill.005
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: fill_in_blank
    frame: {text: "Szukam {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pracy, hint: *s_pracy}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Szukać takes the genitive, so praca becomes pracy.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.translate.006
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: translation
    frame: {text: "I have questions.", language_code: en, direction: ltr}
    slots: {item: *s_pytania}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Pytania is the plural form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.translate.007
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: translation
    frame: {text: "I have a job interview.", language_code: en, direction: ltr}
    slots: {item: *s_kwalifikacyjna}
    answer_derivation: {kind: render_frame, frame: {text: "Mam rozmowę {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Kwalifikacyjną is feminine and in the object form, matching rozmowę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson01.translate.008
    lesson_content_key: pl.a2.unit26.lesson01.slownictwo_rozmowy_kwalifikacyjnej
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Doświadczenie is neuter; its form after nie or brak is doświadczenia.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.choose.001
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pracowałem is the past tense said by a man; a woman says pracowałam.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.listen.002
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pracowałem is the past tense said by a man; a woman says pracowałam.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.order.003
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: word_order
    frame: {text: "Pracowałem {item} inżynier.", language_code: pl, direction: ltr}
    slots: {item: *s_jako}
    answer_derivation: {kind: render_frame, frame: {text: "Pracowałem {item} inżynier.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jako means as and is followed by the profession.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.fill.004
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: fill_in_blank
    frame: {text: "Mogę zacząć od {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_razu, hint: *s_razu}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Od razu means immediately.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.translate.005
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: translation
    frame: {text: "I am available. (spoken by a man)", language_code: en, direction: ltr}
    slots: {item: *s_dostepny}
    answer_derivation: {kind: render_frame, frame: {text: "Jestem {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Dostępny is masculine; a woman says dostępna.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.translate.006
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: translation
    frame: {text: "Yes, I worked as an engineer. (spoken by a man)", language_code: en, direction: ltr}
    slots: {item: *s_pracowalem}
    answer_derivation: {kind: render_frame, frame: {text: "Tak, {item} jako inżynier.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The past tense ending -łem marks a man speaking.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson02.translate.007
    lesson_content_key: pl.a2.unit26.lesson02.pracowalem_jako_inzynier
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Lata is the plural of rok when it follows numbers like dwa, trzy or cztery.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson03.choose.001
    lesson_content_key: pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Godziny is plural, so the adjective elastyczne has a plural ending.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson03.listen.002
    lesson_content_key: pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Godziny is plural, so the adjective elastyczne has a plural ending.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson03.order.003
    lesson_content_key: pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej
    type: word_order
    frame: {text: "Czy ma pan {item}?", language_code: pl, direction: ltr}
    slots: {item: *s_pytania}
    answer_derivation: {kind: render_frame, frame: {text: "Czy ma pan {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Czy turns a statement into a yes or no question.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson03.fill.004
    lesson_content_key: pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej
    type: fill_in_blank
    frame: {text: "Godziny pracy są {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_elastyczne, hint: *s_elastyczne}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Elastyczne agrees with the plural godziny.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson03.translate.005
    lesson_content_key: pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej
    type: translation
    frame: {text: "What experience do you have? (formal, to a man)", language_code: en, direction: ltr}
    slots: {item: *s_doswiadczenie}
    answer_derivation: {kind: render_frame, frame: {text: "Jakie ma pan {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jakie is neuter, matching doświadczenie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit26.lesson03.translate.006
    lesson_content_key: pl.a2.unit26.lesson03.na_rozmowie_kwalifikacyjnej
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Doskonale can stand alone as a reply meaning excellent.", language_code: en, direction: ltr}
