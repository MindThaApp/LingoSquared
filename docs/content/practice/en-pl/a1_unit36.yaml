    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_miły, w_zabawny, w_cierpliwy, w_ciekawski, w_uważam, w_osoba, w_cecha, w_myślisz, w_nieśmiały, w_znacie, w_długo, w_pielęgniarka, w_pyta, w_inni, w_opowiada, w_fajne]
