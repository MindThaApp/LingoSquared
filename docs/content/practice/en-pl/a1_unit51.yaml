    semantic: [w_drzewo, w_duże, w_kaczka, w_kaczki, w_owoce, w_piknik, w_pysznie, w_pływają, w_smyczy, w_słoneczny, w_tablica, w_trawa, w_usiądziemy, w_wodzie, w_zielona, w_zimna, w_ławka]
