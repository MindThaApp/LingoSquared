  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_drzewo, w_duże, w_trawa, w_zielona, w_kaczka, w_wodzie, w_zimna, w_kaczki, w_pływają, w_tablica, w_słoneczny, w_smyczy, w_piknik, w_owoce, w_pysznie, w_usiądziemy, w_ławka]
