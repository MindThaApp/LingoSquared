schema_version: '1.0'
pack_key: practice.en-pl.a2.unit70
source_language: en
target_language: pl
unit_content_key: pl.a2.unit70.zmiana_terminu
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a2_u70 / w_<token>). 33 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_chory, w_czynny, w_dniu, w_dziesiątej, w_dziewiątej, w_fryzjerski, w_godzinie, w_kłopot, w_mówi, w_niestety, w_nową, w_odpowiada, w_odwołać, w_problemu, w_przepraszam, w_przełożona, w_przełożyć, w_razie, w_salon, w_spóźniam, w_szanowny, w_szóstej, w_takim, w_termin, w_umówimy, w_umówić, w_umówię, w_wcześniej, w_widzimy, w_wizyta, w_wizytę, w_zadzwonić, w_została]
templates:
- content_key: practice.en-pl.pl.a2.unit70.lesson01.choose.001
  lesson_content_key: pl.a2.unit70.lesson01.nie_moge_przyjsc
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_przełożyć, w_odwołać, w_wizytę, w_niestety, w_przepraszam, w_spóźniam, w_salon, w_fryzjerski, w_czynny, w_dziewiątej, w_szóstej, w_dniu, w_odpowiada, w_chory, w_kłopot, w_umówić, w_wcześniej, w_umówimy, w_zadzwonić, w_dziesiątej, w_takim, w_razie, w_widzimy, w_umówię, w_nową, w_szanowny, w_wizyta, w_została, w_przełożona, w_godzinie, w_termin, w_mówi, w_problemu]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on saying you cannot come.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit70.lesson02.listen.001
  lesson_content_key: pl.a2.unit70.lesson02.inny_dzien
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on another day.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit70.lesson03.translate.001
  lesson_content_key: pl.a2.unit70.lesson03.podanie_powodu
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on giving a reason.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit70.lesson04.match.001
  lesson_content_key: pl.a2.unit70.lesson04.ustalenie_nowego_terminu
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
