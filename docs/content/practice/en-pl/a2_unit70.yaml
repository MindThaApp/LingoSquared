    frame: {text: 'Czy mogę przełożyć {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Can I move my appointment? A yes/no question can start with czy: Czy mogę ...? The infinitive przełożyć follows mogę.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit70.lesson02.order.002
  lesson_content_key: pl.a2.unit70.lesson02.inny_dzien
  type: word_order
  frame: {text: 'Czy może być w innym {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_dniu}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czy może być w innym {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Can it also be on another day? dniu means day (locative).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit70.lesson02.fill.003
  lesson_content_key: pl.a2.unit70.lesson02.inny_dzien
  type: fill_in_blank
  frame:
    text: Czy piątek panu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_odpowiada}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_odpowiada}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Does Friday suit you? (formal) Odpowiadać (''to suit'') takes the person in the dative: panu = ''suits you''. The thing that suits is the subject: piątek odpowiada. Pan is the polite ''you'' for a man (pani for a woman).', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit70.lesson03.order.002
