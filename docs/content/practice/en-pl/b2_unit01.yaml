    frame: {text: 'Oszczędzasz {item} czasu.', language_code: pl, direction: ltr}
  feedback_frame: {text: You save a lot of time. dużo means a lot; much., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson03.order.002
  lesson_content_key: pl.b2.unit01.lesson03.druga_strona
  type: word_order
  frame: {text: 'Z drugiej {item} tęsknisz za kolegami z pracy.', language_code: pl, direction: ltr}
