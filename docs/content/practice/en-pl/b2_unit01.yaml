  lesson_content_key: pl.b2.unit01.lesson01.zajecie_stanowiska
  type: word_order
  frame: {text: 'Praca zdalna jest lepsza niż {item} w biurze.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_praca}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Praca zdalna jest lepsza niż {item} w biurze.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Remote work is better than office work. The model claim for this unit -- notice lepsza agrees with feminine praca, and niż introduces the comparison.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson01.fill.003
  lesson_content_key: pl.b2.unit01.lesson01.zajecie_stanowiska
  type: fill_in_blank
  frame:
    text: Praca {item} oszczędza czas. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_zdalna}
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_zdalna}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Remote work saves time. zdalna means remote (fem.)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson01.translate.004
  lesson_content_key: pl.b2.unit01.lesson01.zajecie_stanowiska
  type: translation
  frame: {text: Sometimes I work at the office., language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_biurze}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Czasami pracuję w {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: Sometimes I work at the office. biurze means office (after 'at')., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson02.order.002
