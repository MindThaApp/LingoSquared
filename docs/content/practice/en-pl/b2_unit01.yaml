  lesson_content_key: pl.b2.unit01.lesson01.zajecie_stanowiska
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_praca, w_zdalna, w_biurze, w_stanowisko, w_uważam, w_zdaniem, w_lepsza, w_jest, w_zgadzam, w_pierwsze, w_drugie, w_przykład, w_badań, w_wynika, w_czas, w_dojazdu, w_oszczędzać, w_oszczędzasz, w_dużo, w_wydajniej, w_pracuje, w_domu, w_jednej, w_strony, w_oczywiście, w_prawda, w_uważają, w_koledzy, w_tęsknić, w_tęsknię, w_tęsknisz, w_kolegami, w_czasami, w_przyjemna, w_zmienia, w_faktu, w_podsumowując, w_zalety, w_zalet, w_wady, w_przeważać, w_przeważają, w_przeważa, w_wolność, w_wolności, w_coraz, w_więcej, w_osób, w_zdalnie, w_jestem, w_przekonany, w_dobry, w_kierunek, w_osoby, w_pracujące, w_zwykle, w_wydajne, w_mówią, w_brakuje, w_kontaktu, w_nadal, w_można, w_zadzwonić, w_zrobić, w_wideorozmowę, w_uważasz]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on taking a position.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson02.listen.001
  lesson_content_key: pl.b2.unit01.lesson02.argumenty_i_dowody
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on giving reasons and evidence.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson03.translate.001
  lesson_content_key: pl.b2.unit01.lesson03.druga_strona
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on acknowledging the other side.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson04.match.001
  lesson_content_key: pl.b2.unit01.lesson04.kontrargument
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson05.choose.001
  lesson_content_key: pl.b2.unit01.lesson05.czytanie_argumentu
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading an argument.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit01.lesson06.translate.001
  lesson_content_key: pl.b2.unit01.lesson06.obrona_stanowiska
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on defending a position.', language_code: en, direction: ltr}
