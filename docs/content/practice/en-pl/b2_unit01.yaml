    semantic: [w_badań, w_biurze, w_brakuje, w_coraz, w_czas, w_czasami, w_dobry, w_dojazdu, w_domu, w_drugie, w_dużo, w_faktu, w_jednej, w_jest, w_jestem, w_kierunek, w_koledzy, w_kolegami, w_kontaktu, w_lepsza, w_można, w_mówią, w_nadal, w_oczywiście, w_osoby, w_oszczędzasz, w_oszczędzać, w_osób, w_pierwsze, w_podsumowując, w_praca, w_pracuje, w_pracujące, w_prawda, w_przekonany, w_przeważa, w_przeważają, w_przeważać, w_przyjemna, w_przykład, w_stanowisko, w_strony, w_tęsknisz, w_tęsknić, w_tęsknię, w_uważają, w_uważam, w_uważasz, w_wady, w_wideorozmowę, w_więcej, w_wolności, w_wolność, w_wydajne, w_wydajniej, w_wynika, w_zadzwonić, w_zalet, w_zalety, w_zdalna, w_zdalnie, w_zdaniem, w_zgadzam, w_zmienia, w_zrobić, w_zwykle]
templates:
