      agreement_tags: {semantic: w_czas}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Oszczędzasz {item} dojazdu.', language_code: pl, direction: ltr}
  feedback_frame: {text: You save commute time. czas means time., language_code: en, direction: ltr}
