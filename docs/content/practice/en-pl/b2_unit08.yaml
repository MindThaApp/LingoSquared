schema_version: '1.0'
pack_key: practice.en-pl.b2.unit08
source_language: en
target_language: pl
unit_content_key: pl.b2.unit08.synteza
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_b2_u8 / w_<token>). 44 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_cena, w_ceny, w_chwalą, w_drogie, w_jedzenia, w_jedzenie, w_kosztuje, w_lipą, w_mówi, w_mówić, w_negatywny, w_nowa, w_oba, w_oczekuję, w_opinia, w_osiemnaście, w_pizza, w_pozytywna, w_przeciwieństwie, w_przekonujący, w_recenzja, w_restauracja, w_różnica, w_różnimy, w_różnią, w_samo, w_smaczne, w_sprzeczni, w_tam, w_tanio, w_twierdzi, w_twierdzić, w_utrzymuje, w_utrzymywać, w_uważa, w_wrócę, w_wysoka, w_zgadza, w_zgadzają, w_zgadzamy, w_złotych, w_świetna, w_źródła, w_źródło]
templates:
- content_key: practice.en-pl.pl.b2.unit08.lesson01.choose.001
  lesson_content_key: pl.b2.unit08.lesson01.kto_co_mowi
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_lipą, w_nowa, w_restauracja, w_recenzja, w_źródło, w_jedzenie, w_jedzenia, w_smaczne, w_uważa, w_cena, w_wysoka, w_ceny, w_pizza, w_twierdzić, w_twierdzi, w_drogie, w_utrzymywać, w_utrzymuje, w_oba, w_źródła, w_chwalą, w_tanio, w_pozytywna, w_negatywny, w_przeciwieństwie, w_zgadzają, w_opinia, w_mówić, w_samo, w_różnią, w_różnica, w_sprzeczni, w_zgadza, w_świetna, w_tam, w_wrócę, w_kosztuje, w_osiemnaście, w_złotych, w_oczekuję, w_mówi, w_zgadzamy, w_przekonujący, w_różnimy]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who says what?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit08.lesson02.listen.001
  lesson_content_key: pl.b2.unit08.lesson02.dwa_zrodla_obok_siebie
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two sources side by side.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit08.lesson03.translate.001
  lesson_content_key: pl.b2.unit08.lesson03.w_czym_sie_zgadzaja
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on where do they agree?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit08.lesson04.match.001
  lesson_content_key: pl.b2.unit08.lesson04.w_czym_sie_roznia
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.b2.unit08.lesson05.choose.001
