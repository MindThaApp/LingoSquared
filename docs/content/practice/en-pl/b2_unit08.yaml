  answer_derivation:
    kind: render_frame
    frame: {text: 'Pod Lipą to {item} restauracja.', language_code: pl, direction: ltr}
  feedback_frame: {text: '''Pod Lipą'' (Under the Linden Tree) is a new restaurant. The situation this whole unit works with: two written reviews of the same new restaurant, one by Zosia and one by Bartek.', language_code: en, direction: ltr}
