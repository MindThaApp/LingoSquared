schema_version: "1.0"
pack_key: practice.en-pl.a1.unit18
source_language: en
target_language: pl
unit_content_key: pl.a1.unit18.dom
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job C) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u18*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors so every
    frame is grammatical (gender, case, number). Fixed English prompts name
    ty vs pan/pani and speaker gender where it matters, and are worded so only
    one natural Polish word order fits. Register follows the unit's
    realization (ty between friends, pan/pani when formal).
    Reviewer: duży is masculine and mała feminine in the glosses, and frames pair each with one noun; lesson 3 pools reuse lesson 2 rooms alongside the two appliances.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_mieszkanie, w_duży, w_pokój, w_pokoi, w_pokoje, w_kuchnia, w_mała, w_sypialnia, w_łazienka, w_pokoju, w_kuchni, w_sypialni, w_łazience, w_lodówka, w_piekarnik]
slot_presets:
  u18_l1: &u18_l1 {language_code: pl, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_mieszkanie, w_duży, w_pokój, w_pokoi, w_pokoje]}}
  u18_mp1: &u18_mp1 {language_code: pl, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_mieszkanie, w_duży, w_pokój, w_pokoi, w_pokoje, w_kuchnia]}}
  s_duzy: &s_duzy {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_duży}}
  s_pokoi: &s_pokoi {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pokoi}}
  s_pokoje: &s_pokoje {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pokoje}}
  u18_l2: &u18_l2 {language_code: pl, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_kuchnia, w_mała, w_sypialnia, w_łazienka]}}
  u18_l2m: &u18_l2m {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_kuchnia, w_sypialnia, w_łazienka, w_pokoju, w_kuchni, w_sypialni, w_łazience]}}
  s_mala: &s_mala {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_mała}}
  s_sypialni: &s_sypialni {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_sypialni}}
  s_lazience: &s_lazience {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_łazience}}
  u18_l3: &u18_l3 {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_lodówka, w_piekarnik, w_kuchnia, w_sypialnia]}}
  s_lodowka: &s_lodowka {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_lodówka}}
  s_piekarnik: &s_piekarnik {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_piekarnik}}
templates:
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.choose.001
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u18_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Duży is a masculine adjective, so it describes nouns like dom and pokój.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.listen.002
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u18_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pokój is the singular, pokoje is the plural, and pokoi is the form used after ile.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.match.003
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u18_mp1, second: *u18_mp1, third: *u18_mp1, fourth: *u18_mp1, fifth: *u18_mp1, sixth: *u18_mp1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Pokój changes in number: one pokój, two pokoje, but ile pokoi.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.order.004
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: word_order
    frame: {text: "Dom jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_duzy}
    answer_derivation: {kind: render_frame, frame: {text: "Dom jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Duży is masculine, so it goes with the masculine noun dom.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.fill.005
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: fill_in_blank
    frame: {text: "Ile {item} masz? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pokoi, hint: *s_pokoi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ile is followed by the form pokoi, not the basic pokój.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.translate.006
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: translation
    frame: {text: "The house is big.", language_code: en, direction: ltr}
    slots: {item: *s_duzy}
    answer_derivation: {kind: render_frame, frame: {text: "Dom jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Duży matches dom, which is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson01.translate.007
    lesson_content_key: pl.a1.unit18.lesson01.moj_dom
    type: translation
    frame: {text: "I have two rooms.", language_code: en, direction: ltr}
    slots: {item: *s_pokoje}
    answer_derivation: {kind: render_frame, frame: {text: "Mam dwa {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The plural pokoje follows the number dwa.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.choose.001
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u18_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mała is small in the feminine, matching kuchnia, sypialnia and łazienka.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.listen.002
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u18_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Kuchnia, sypialnia and łazienka all end in -a, so they are feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.match.003
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u18_l2m, second: *u18_l2m, third: *u18_l2m, fourth: *u18_l2m, fifth: *u18_l2m, sixth: *u18_l2m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "After w the nouns change: kuchnia becomes kuchni, sypialnia becomes sypialni, łazienka becomes łazience.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.order.004
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: word_order
    frame: {text: "Kuchnia jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_mala}
    answer_derivation: {kind: render_frame, frame: {text: "Kuchnia jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mała is the feminine form, matching kuchnia.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.fill.005
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: fill_in_blank
    frame: {text: "Jestem w {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_sypialni, hint: *s_sypialni}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The form after w says where you are.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.translate.006
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: translation
    frame: {text: "The kitchen is small.", language_code: en, direction: ltr}
    slots: {item: *s_mala}
    answer_derivation: {kind: render_frame, frame: {text: "Kuchnia jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mała matches the feminine noun kuchnia.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson02.translate.007
    lesson_content_key: pl.a1.unit18.lesson02.pokoje_w_domu
    type: translation
    frame: {text: "I am in the bathroom.", language_code: en, direction: ltr}
    slots: {item: *s_lazience}
    answer_derivation: {kind: render_frame, frame: {text: "Jestem w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Łazienka becomes łazience after w.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson03.choose.001
    lesson_content_key: pl.a1.unit18.lesson03.rozmowa_o_mieszkaniu
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u18_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lodówka and piekarnik are kitchen appliances; lodówka is feminine and piekarnik is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson03.order.002
    lesson_content_key: pl.a1.unit18.lesson03.rozmowa_o_mieszkaniu
    type: word_order
    frame: {text: "W kuchni jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_lodowka}
    answer_derivation: {kind: render_frame, frame: {text: "W kuchni jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "With jest the thing in the room is the subject, so it keeps its basic form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson03.fill.003
    lesson_content_key: pl.a1.unit18.lesson03.rozmowa_o_mieszkaniu
    type: fill_in_blank
    frame: {text: "W kuchni jest {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_piekarnik, hint: *s_piekarnik}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Piekarnik is masculine and stays unchanged after jest.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit18.lesson03.translate.004
    lesson_content_key: pl.a1.unit18.lesson03.rozmowa_o_mieszkaniu
    type: translation
    frame: {text: "There is a refrigerator in the kitchen.", language_code: en, direction: ltr}
    slots: {item: *s_lodowka}
    answer_derivation: {kind: render_frame, frame: {text: "W kuchni jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Polish uses jest and no word for there or a.", language_code: en, direction: ltr}
