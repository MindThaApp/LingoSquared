schema_version: '1.0'
pack_key: practice.en-pl.a1.unit40
source_language: en
target_language: pl
unit_content_key: pl.a1.unit40.zguba
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u40 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_dosyć, w_emocji, w_idziemy, w_informacja, w_informacji, w_kurtki, w_plecak, w_portfel, w_szuka, w_zajrzyj, w_zgubiony, w_zgubił, w_znaleziony, w_został]
templates:
- content_key: practice.en-pl.pl.a1.unit40.lesson01.choose.001
  lesson_content_key: pl.a1.unit40.lesson01.zgubione_i_znalezione
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_zgubiony, w_zgubił, w_znaleziony, w_został, w_plecak, w_informacji, w_portfel, w_informacja, w_idziemy, w_szuka, w_zajrzyj, w_kurtki, w_dosyć, w_emocji]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on missing and found.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit40.lesson02.listen.001
  lesson_content_key: pl.a1.unit40.lesson02.telefon_plecak_i_portfel
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on phone, backpack, and wallet.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit40.lesson03.translate.001
  lesson_content_key: pl.a1.unit40.lesson03.przy_informacji
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on at the desk.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit40.lesson04.match.001
  lesson_content_key: pl.a1.unit40.lesson04.nina_pyta_przy_informacji
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit40.lesson05.choose.001
  lesson_content_key: pl.a1.unit40.lesson05.wiadomosc_o_znalezionym_telefonie
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a message about a found phone.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit40.lesson06.translate.001
  lesson_content_key: pl.a1.unit40.lesson06.tomek_sprawdza_portfel
  type: translation
