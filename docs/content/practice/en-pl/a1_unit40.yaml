    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on Tomek checks his wallet.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit40.lesson01.order.002
  lesson_content_key: pl.a1.unit40.lesson01.zgubione_i_znalezione
  type: word_order
  frame: {text: 'Telefon nie jest już {item}.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_zgubiony}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Telefon nie jest już {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'The phone is no longer missing. zgubiony means lost, missing.', language_code: en, direction: ltr}
