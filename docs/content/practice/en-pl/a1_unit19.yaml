schema_version: "1.0"
pack_key: practice.en-pl.a1.unit19
source_language: en
target_language: pl
unit_content_key: pl.a1.unit19.pogoda
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job C) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u19*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors so every
    frame is grammatical (gender, case, number). Fixed English prompts name
    ty vs pan/pani and speaker gender where it matters, and are worded so only
    one natural Polish word order fits. Register follows the unit's
    realization (ty between friends, pan/pani when formal).
    Reviewer: weather words zimno/gorąco are adverbs used with jest, so their prompts carry no gender; 'It is cold.' is the English prompt rather than 'Today it is cold.' to avoid a second natural word order.
    Feedback lines carry a usage or grammar point, never the task or the answer.
    Opus pass (2026-10-24): foggy prompt now mirrors Jest mgła (It is foggy invited Jest mglisto).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_pogoda, w_zimno, w_gorąco, w_pada, w_mgła, w_śnieg, w_dobra, w_straszna, w_bo]
slot_presets:
  u19_l1a: &u19_l1a {language_code: pl, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_pogoda, w_zimno, w_gorąco, w_pada]}}
  u19_l1: &u19_l1 {language_code: pl, part_of_speech: [adverb, noun], agreement_tags: {semantic: [w_pogoda, w_zimno, w_gorąco, w_mgła]}}
  s_pogoda: &s_pogoda {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_pogoda}}
  s_zimno: &s_zimno {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_zimno}}
  s_goraco: &s_goraco {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_gorąco}}
  u19_l2: &u19_l2 {language_code: pl, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_pada, w_śnieg, w_mgła, w_dobra, w_straszna]}}
  u19_mp: &u19_mp {language_code: pl, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_pogoda, w_zimno, w_gorąco, w_pada, w_śnieg, w_mgła]}}
  s_straszna: &s_straszna {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_straszna}}
  s_pada: &s_pada {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_pada}}
  s_mgla: &s_mgla {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_mgła}}
  u19_l3: &u19_l3 {language_code: pl, part_of_speech: [particle, adverb, verb], agreement_tags: {semantic: [w_bo, w_pada, w_zimno, w_gorąco]}}
  s_bo: &s_bo {language_code: pl, part_of_speech: particle, agreement_tags: {semantic: w_bo}}
templates:
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.choose.001
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u19_l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Zimno and gorąco are weather words that follow jest and never change.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.listen.002
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u19_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pogoda is the noun for weather; zimno and gorąco describe the temperature.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.order.003
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: word_order
    frame: {text: "Jaka jest {item}?", language_code: pl, direction: ltr}
    slots: {item: *s_pogoda}
    answer_derivation: {kind: render_frame, frame: {text: "Jaka jest {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jaka is feminine, matching pogoda.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.order.004
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: word_order
    frame: {text: "Dziś jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_zimno}
    answer_derivation: {kind: render_frame, frame: {text: "Dziś jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Weather words follow jest and have no gender.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.fill.005
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: fill_in_blank
    frame: {text: "Dziś jest {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_goraco, hint: *s_goraco}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Jest plus a weather word describes the day, without gender.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.translate.006
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: translation
    frame: {text: "It is cold.", language_code: en, direction: ltr}
    slots: {item: *s_zimno}
    answer_derivation: {kind: render_frame, frame: {text: "Jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Polish uses jest and a weather word, with no it.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.translate.007
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: translation
    frame: {text: "It is hot.", language_code: en, direction: ltr}
    slots: {item: *s_goraco}
    answer_derivation: {kind: render_frame, frame: {text: "Jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Gorąco never changes, because it does not describe a noun.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson01.translate.008
    lesson_content_key: pl.a1.unit19.lesson01.jaka_pogoda
    type: translation
    frame: {text: "What is the weather like?", language_code: en, direction: ltr}
    slots: {item: *s_pogoda}
    answer_derivation: {kind: render_frame, frame: {text: "Jaka jest {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jaka is feminine, matching the noun pogoda.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.choose.001
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u19_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pada means it rains; with śnieg it says it snows.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.listen.002
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u19_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dobra and straszna are feminine and agree with the feminine noun pogoda.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.match.003
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u19_mp, second: *u19_mp, third: *u19_mp, fourth: *u19_mp, fifth: *u19_mp, sixth: *u19_mp}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Śnieg and mgła name weather; pada is a verb in the he, she or it form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.order.004
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: word_order
    frame: {text: "Jaka {item} pogoda!", language_code: pl, direction: ltr}
    slots: {item: *s_straszna}
    answer_derivation: {kind: render_frame, frame: {text: "Jaka {item} pogoda!", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Straszna is feminine, matching pogoda.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.fill.005
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: fill_in_blank
    frame: {text: "Dziś {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pada, hint: *s_pada}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pada is the weather verb for it rains.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.translate.006
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: translation
    frame: {text: "There is fog.", language_code: en, direction: ltr}
    slots: {item: *s_mgla}
    answer_derivation: {kind: render_frame, frame: {text: "Jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mgła is a noun, and jest alone says there is, with no word for there.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson02.translate.007
    lesson_content_key: pl.a1.unit19.lesson02.pada_snieg
    type: translation
    frame: {text: "What terrible weather!", language_code: en, direction: ltr}
    slots: {item: *s_straszna}
    answer_derivation: {kind: render_frame, frame: {text: "Jaka {item} pogoda!", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Straszna matches the feminine noun pogoda.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson03.choose.001
    lesson_content_key: pl.a1.unit19.lesson03.rozmowa_o_pogodzie
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u19_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Bo means because and joins a reason to the main statement.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson03.fill.002
    lesson_content_key: pl.a1.unit19.lesson03.rozmowa_o_pogodzie
    type: fill_in_blank
    frame: {text: "Nie idę do parku, {item} pada. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_bo, hint: *s_bo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A comma goes before bo, as before because.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit19.lesson03.translate.003
    lesson_content_key: pl.a1.unit19.lesson03.rozmowa_o_pogodzie
    type: translation
    frame: {text: "I am not going to the park because it is raining.", language_code: en, direction: ltr}
    slots: {item: *s_bo}
    answer_derivation: {kind: render_frame, frame: {text: "Nie idę do parku, {item} pada.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The reason comes second, after bo.", language_code: en, direction: ltr}
