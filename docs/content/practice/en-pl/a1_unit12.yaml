schema_version: "1.0"
pack_key: practice.en-pl.a1.unit12
source_language: en
target_language: pl
unit_content_key: pl.a1.unit12.wczoraj
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job B) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u12*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani and speaker gender where it matters. Register
    follows the unit's realization (formal pan/pani to strangers, ty between friends).
    Reviewer: unit_content_key is pl.a1.unit12.wczoraj (verbatim from the realization). Gendered past forms are always flagged in English prompts; lesson 3 has no first-sight lexemes.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_wczoraj, w_byłem, w_byłam, w_kinie, w_film, w_pyszny, w_zobaczyłem, w_zobaczyłam, w_zrobiłem, w_zrobiłam]
slot_presets:
  u12_l1: &u12_l1 {language_code: pl, part_of_speech: [adjective, adverb, verb, noun], agreement_tags: {semantic: [w_wczoraj, w_byłem, w_byłam, w_kinie, w_film, w_pyszny]}}
  u12_l1m: &u12_l1m {language_code: pl, part_of_speech: [adjective, adverb, verb, noun], agreement_tags: {semantic: [w_wczoraj, w_byłem, w_byłam, w_kinie, w_film, w_pyszny, w_zobaczyłem]}}
  u12_was: &u12_was {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: [w_byłem, w_byłam]}}
  s_wczoraj: &s_wczoraj {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_wczoraj}}
  s_kinie: &s_kinie {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_kinie}}
  u12_l1t: &u12_l1t {language_code: pl, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_wczoraj, w_byłem, w_byłam, w_kinie]}}
  u12_l2: &u12_l2 {language_code: pl, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_film, w_zobaczyłem, w_zobaczyłam, w_zrobiłem, w_zrobiłam, w_pyszny]}}
  u12_saw: &u12_saw {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: [w_zobaczyłem, w_zobaczyłam]}}
  u12_made: &u12_made {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: [w_zrobiłem, w_zrobiłam]}}
  s_film: &s_film {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_film}}
  s_pyszny: &s_pyszny {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_pyszny}}
  u12_l2t: &u12_l2t {language_code: pl, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_film, w_zobaczyłem, w_zobaczyłam, w_zrobiłem, w_zrobiłam, w_pyszny]}}
templates:
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.choose.001
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u12_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "In the past tense Polish verbs mark the speaker's gender: byłem for a man and byłam for a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.listen.002
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u12_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The past-tense endings -em and -am show whether the speaker is male or female.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.match.003
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u12_l1m, second: *u12_l1m, third: *u12_l1m, fourth: *u12_l1m, fifth: *u12_l1m, sixth: *u12_l1m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Byłem and byłam are two forms of the same verb, chosen by who is speaking.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.order.004
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: word_order
    frame: {text: "Wczoraj {item} w kinie.", language_code: pl, direction: ltr}
    slots: {item: *u12_was}
    answer_derivation: {kind: render_frame, frame: {text: "Wczoraj {item} w kinie.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The past tense depends on the speaker: byłem if a man says it, byłam if a woman does.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.fill.005
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: fill_in_blank
    frame: {text: "Byłam {item} w kinie. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_wczoraj, hint: *s_wczoraj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Wczoraj means yesterday and is an adverb, so it does not change.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.translate.006
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: translation
    frame: {text: "I was at the cinema yesterday. (said by a woman)", language_code: en, direction: ltr}
    slots: {item: *s_kinie}
    answer_derivation: {kind: render_frame, frame: {text: "Byłam wczoraj w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After w the noun kino changes to kinie when it tells where something happened.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson01.translate.007
    lesson_content_key: pl.a1.unit12.lesson01.co_bylo_wczoraj
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u12_l1t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Kinie is the locative form of kino and is used after w for where.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.choose.001
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u12_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Past forms keep the gender pair: zobaczyłem is a man's, zobaczyłam is a woman's.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.listen.002
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u12_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Zrobiłem and zobaczyłem share the ending -łem; the stem differs, not the person.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.match.003
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u12_l2, second: *u12_l2, third: *u12_l2, fourth: *u12_l2, fifth: *u12_l2, sixth: *u12_l2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Every past-tense verb has a masculine form in -em and a feminine form in -am, not just być.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.order.004
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: word_order
    frame: {text: "Wczoraj {item} dobry film.", language_code: pl, direction: ltr}
    slots: {item: *u12_saw}
    answer_derivation: {kind: render_frame, frame: {text: "Wczoraj {item} dobry film.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The past tense of zobaczyć shows the speaker's gender, like byłem and byłam.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.order.005
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: word_order
    frame: {text: "Wczoraj {item} obiad.", language_code: pl, direction: ltr}
    slots: {item: *u12_made}
    answer_derivation: {kind: render_frame, frame: {text: "Wczoraj {item} obiad.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Zrobić can mean to make or to do, and here it means prepare a meal.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.fill.006
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: fill_in_blank
    frame: {text: "Zobaczyłam dobry {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_film, hint: *s_film}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Film is masculine, so the adjective dobry keeps its basic form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.fill.007
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: fill_in_blank
    frame: {text: "To jest {item} obiad. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pyszny, hint: *s_pyszny}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pyszny has a masculine ending because obiad is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.translate.008
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: translation
    frame: {text: "I saw a good movie. (said by a woman)", language_code: en, direction: ltr}
    slots: {item: *s_film}
    answer_derivation: {kind: render_frame, frame: {text: "Zobaczyłam dobry {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Dobry is the masculine adjective, matching the masculine noun film.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.translate.009
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: translation
    frame: {text: "This is a delicious lunch.", language_code: en, direction: ltr}
    slots: {item: *s_pyszny}
    answer_derivation: {kind: render_frame, frame: {text: "To jest {item} obiad.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The adjective agrees with the noun it describes: pyszny goes with masculine obiad.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit12.lesson02.translate.010
    lesson_content_key: pl.a1.unit12.lesson02.dobry_film
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u12_l2t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Zrobiłem and zrobiłam both mean I made or I did; the ending only tells you the speaker's gender.", language_code: en, direction: ltr}
