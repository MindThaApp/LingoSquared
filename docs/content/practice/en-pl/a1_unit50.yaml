schema_version: '1.0'
pack_key: practice.en-pl.a1.unit50
source_language: en
target_language: pl
unit_content_key: pl.a1.unit50.koncert
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u50 / w_<token>). 11 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_miejsce, w_początek, w_publiczność, w_scena, w_trwa, w_trwać, w_wspaniały, w_wędrowcy, w_zadowolona, w_zespołu, w_zespół]
templates:
- content_key: practice.en-pl.pl.a1.unit50.lesson01.choose.001
  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_zespół, w_zespołu, w_miejsce, w_trwać, w_trwa, w_scena, w_publiczność, w_zadowolona, w_wędrowcy, w_początek, w_wspaniały]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to go to the concert.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit50.lesson02.listen.001
  lesson_content_key: pl.a1.unit50.lesson02.chce_kupic_bilet
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to buy a ticket.', language_code: en, direction: ltr}
