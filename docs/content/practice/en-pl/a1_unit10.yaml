schema_version: "1.0"
pack_key: practice.en-pl.a1.unit10
source_language: en
target_language: pl
unit_content_key: pl.a1.unit10.routines
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job B) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u10*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani and speaker gender where it matters. Register
    follows the unit's realization (formal pan/pani to strangers, ty between friends).
    Reviewer: all verbs are I forms only, as in the realization; domu is excluded from bare-word pools.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_wstawać, w_wstaję, w_jeść, w_jem, w_śniadanie, w_pić, w_piję, w_obiad, w_pracować, w_pracuję, w_dom, w_wracać, w_wracam, w_domu, w_spać, w_śpię, w_też, w_wcześnie]
slot_presets:
  u10_l1: &u10_l1 {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_wstawać, w_wstaję, w_jeść, w_jem, w_śniadanie, w_pić, w_piję]}}
  u10_up: &u10_up {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_wstaję}}
  s_jem: &s_jem {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_jem}}
  s_sniadanie: &s_sniadanie {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_śniadanie}}
  u10_l2: &u10_l2 {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_obiad, w_pracować, w_pracuję, w_dom, w_wracać, w_wracam]}}
  u10_home: &u10_home {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_domu}}
  s_pracuje: &s_pracuje {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_pracuję}}
  s_domu: &s_domu {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_domu}}
  u10_l3: &u10_l3 {language_code: pl, part_of_speech: [particle, adverb, verb], agreement_tags: {semantic: [w_spać, w_śpię, w_też, w_wcześnie]}}
  u10_early: &u10_early {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_wcześnie}}
  s_tez: &s_tez {language_code: pl, part_of_speech: particle, agreement_tags: {semantic: w_też}}
templates:
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.choose.001
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u10_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Each verb here has a dictionary form (wstawać, jeść, pić) and an I form (wstaję, jem, piję).", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.listen.002
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u10_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The I form usually ends in -ę or -m, as in wstaję, piję and jem.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.match.003
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u10_l1, second: *u10_l1, third: *u10_l1, fourth: *u10_l1, fifth: *u10_l1, sixth: *u10_l1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The infinitive and the I form are different words, so learn both: jeść and jem.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.order.004
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: word_order
    frame: {text: "Rano {item} o siódmej.", language_code: pl, direction: ltr}
    slots: {item: *u10_up}
    answer_derivation: {kind: render_frame, frame: {text: "Rano {item} o siódmej.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Rano goes first to say when, and o siódmej gives the exact time.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.fill.005
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: fill_in_blank
    frame: {text: "Rano {item} śniadanie. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_jem, hint: *s_jem}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Jem is an irregular I form of jeść and is worth learning by heart.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.translate.006
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: translation
    frame: {text: "I eat breakfast.", language_code: en, direction: ltr}
    slots: {item: *s_sniadanie}
    answer_derivation: {kind: render_frame, frame: {text: "Jem {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Śniadanie is neuter, so it looks the same as the object of the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson01.translate.007
    lesson_content_key: pl.a1.unit10.lesson01.rano
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u10_l1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Piję and wstaję both end in -ę, the typical I ending for verbs like these.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.choose.001
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u10_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pracować means to work and wracać means to return; their I forms are pracuję and wracam.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.listen.002
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u10_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Obiad is the main meal of the day, eaten around midday, so it can be lunch or dinner.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.match.003
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u10_l2, second: *u10_l2, third: *u10_l2, fourth: *u10_l2, fifth: *u10_l2, sixth: *u10_l2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Wracam and pracuję are different verbs with similar sounds, so check the vowels.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.order.004
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: word_order
    frame: {text: "Wracam do {item} wieczorem.", language_code: pl, direction: ltr}
    slots: {item: *u10_home}
    answer_derivation: {kind: render_frame, frame: {text: "Wracam do {item} wieczorem.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After do the noun takes the genitive, and dom becomes domu just like bank becomes banku.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.fill.005
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: fill_in_blank
    frame: {text: "Po południu {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_pracuje, hint: *s_pracuje}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Po południu says when, and the verb stays in the I form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.translate.006
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: translation
    frame: {text: "I return home in the evening.", language_code: en, direction: ltr}
    slots: {item: *s_domu}
    answer_derivation: {kind: render_frame, frame: {text: "Wracam do {item} wieczorem.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The genitive ending -u appears again in domu, as in banku and parku.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson02.translate.007
    lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u10_l2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dom means home or house, depending on the context.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson03.choose.001
    lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u10_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Też means too or also and usually follows the word it refers to.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson03.order.002
    lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
    type: word_order
    frame: {text: "Śpię {item}, o dziesiątej wieczorem.", language_code: pl, direction: ltr}
    slots: {item: *u10_early}
    answer_derivation: {kind: render_frame, frame: {text: "Śpię {item}, o dziesiątej wieczorem.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Wcześnie means early and is an adverb, so it never changes.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson03.fill.003
    lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
    type: fill_in_blank
    frame: {text: "Ja {item} jem śniadanie rano. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_tez, hint: *s_tez}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ja też means me too; też usually comes right after the pronoun it refers to.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit10.lesson03.translate.004
    lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u10_l3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Śpię is the I form of spać and has a different vowel from the infinitive.", language_code: en, direction: ltr}
