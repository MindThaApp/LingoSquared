- content_key: practice.en-pl.pl.a1.unit34.lesson01.choose.001
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_list, w_dziadka, w_paczka, w_babci, w_znaczek, w_listu, w_adres, w_pisać, w_piszę, w_paczce, w_dotrzeć, w_dotrze, w_czasownikiem, w_dokonanym, w_oznacza, w_przyszłość, w_dostawy, w_dni, w_pracownik, w_kupuje, w_poczcie, w_pisze]
