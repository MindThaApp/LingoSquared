schema_version: '1.0'
pack_key: practice.en-pl.a1.unit34
source_language: en
target_language: pl
unit_content_key: pl.a1.unit34.poczta
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u34 / w_<token>). 22 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_adres, w_babci, w_czasownikiem, w_dni, w_dokonanym, w_dostawy, w_dotrze, w_dotrzeć, w_dziadka, w_kupuje, w_list, w_listu, w_oznacza, w_paczce, w_paczka, w_pisać, w_pisze, w_piszę, w_poczcie, w_pracownik, w_przyszłość, w_znaczek]
