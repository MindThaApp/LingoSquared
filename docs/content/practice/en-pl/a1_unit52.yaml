      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_siłownię, w_karnet, w_bieżnia, w_bieżni, w_ciężary, w_podnoszę, w_ciężarów, w_zajęcia, w_zaczynają, w_instruktor, w_instruktorem, w_grafik, w_dzienny, w_chciałybyśmy, w_plaża, w_siłowni, w_zmęczona]
