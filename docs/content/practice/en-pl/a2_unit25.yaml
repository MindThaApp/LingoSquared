schema_version: "1.0"
pack_key: practice.en-pl.a2.unit25
source_language: en
target_language: pl
unit_content_key: pl.a2.unit25.naprawa_w_mieszkaniu
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-pl A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_pl.py (a2 course, tags pl_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and ty/pan/pani where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the case-ending notes in feedback (genitive after potrzebować/szukać/od, object forms)
    and the polite conditional forms (chciałabym/chciałbym, mógłby).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_mieszkaniu, w_ogrzewanie, w_działa, w_zepsute, w_naprawić, w_wczoraj, w_jutro, w_mój, w_mógłby, w_przyjść, w_najszybciej, w_rano, w_zobaczenia]
slot_presets:
  pool1: &pool1 {language_code: pl, part_of_speech: [noun, pronoun, verb, adjective, adverb], agreement_tags: {semantic: [w_mieszkaniu, w_ogrzewanie, w_działa, w_zepsute, w_naprawić, w_wczoraj, w_jutro, w_mój]}}
  s_mieszkaniu: &s_mieszkaniu {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_mieszkaniu}}
  s_zepsute: &s_zepsute {language_code: pl, part_of_speech: adjective, agreement_tags: {semantic: w_zepsute}}
  s_naprawic: &s_naprawic {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_naprawić}}
  s_dziala: &s_dziala {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_działa}}
  pool2: &pool2 {language_code: pl, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_mieszkaniu, w_ogrzewanie, w_działa, w_zepsute, w_naprawić, w_wczoraj, w_jutro]}}
  pool3: &pool3 {language_code: pl, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_mógłby, w_przyjść, w_najszybciej, w_ogrzewanie, w_naprawić, w_zepsute]}}
  s_moglby: &s_moglby {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_mógłby}}
  s_najszybciej: &s_najszybciej {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_najszybciej}}
  pool4: &pool4 {language_code: pl, part_of_speech: [verb, adverb], agreement_tags: {semantic: [w_mógłby, w_przyjść, w_najszybciej]}}
  pool5: &pool5 {language_code: pl, part_of_speech: [verb, adjective, adverb, phrase], agreement_tags: {semantic: [w_rano, w_zobaczenia, w_wczoraj, w_jutro, w_naprawić, w_zepsute]}}
  s_rano: &s_rano {language_code: pl, part_of_speech: adverb, agreement_tags: {semantic: w_rano}}
  s_zobaczenia: &s_zobaczenia {language_code: pl, part_of_speech: phrase, agreement_tags: {semantic: w_zobaczenia}}
  pool6: &pool6 {language_code: pl, part_of_speech: [adverb, phrase], agreement_tags: {semantic: [w_rano, w_zobaczenia, w_wczoraj, w_jutro]}}
templates:
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.choose.001
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Zepsute is neuter, matching ogrzewanie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.listen.002
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Zepsute is neuter, matching ogrzewanie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.match.003
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool1, second: *pool1, third: *pool1, fourth: *pool1, fifth: *pool1, sixth: *pool1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Działa is the he, she or it form of działać, to work.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.order.004
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: word_order
    frame: {text: "Ogrzewanie w {item} nie działa.", language_code: pl, direction: ltr}
    slots: {item: *s_mieszkaniu}
    answer_derivation: {kind: render_frame, frame: {text: "Ogrzewanie w {item} nie działa.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After w the noun mieszkanie changes to mieszkaniu.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.fill.005
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: fill_in_blank
    frame: {text: "Ogrzewanie jest {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_zepsute, hint: *s_zepsute}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Zepsute agrees with the neuter noun ogrzewanie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.translate.006
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: translation
    frame: {text: "I have to fix it.", language_code: en, direction: ltr}
    slots: {item: *s_naprawic}
    answer_derivation: {kind: render_frame, frame: {text: "Muszę to {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Naprawić is the infinitive that follows muszę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.translate.007
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: translation
    frame: {text: "The heating is not working.", language_code: en, direction: ltr}
    slots: {item: *s_dziala}
    answer_derivation: {kind: render_frame, frame: {text: "Ogrzewanie nie {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Nie goes directly before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson01.translate.008
    lesson_content_key: pl.a2.unit25.lesson01.slownictwo_naprawy
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Wczoraj and jutro are time words that stay unchanged.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.choose.001
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Czy mógłby pan is a polite way to ask a man to do something.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.listen.002
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Czy mógłby pan is a polite way to ask a man to do something.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.order.003
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: word_order
    frame: {text: "Czy {item} pan przyjść jutro?", language_code: pl, direction: ltr}
    slots: {item: *s_moglby}
    answer_derivation: {kind: render_frame, frame: {text: "Czy {item} pan przyjść jutro?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mógłby is the conditional form used for polite requests to a man.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.order.004
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: word_order
    frame: {text: "Proszę przyjść jak {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_najszybciej}
    answer_derivation: {kind: render_frame, frame: {text: "Proszę przyjść jak {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jak najszybciej means as soon as possible.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.fill.005
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: fill_in_blank
    frame: {text: "Proszę przyjść jak {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_najszybciej, hint: *s_najszybciej}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Jak plus najszybciej gives the sense of as soon as possible.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.translate.006
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: translation
    frame: {text: "Could you come tomorrow? (to a man, polite)", language_code: en, direction: ltr}
    slots: {item: *s_moglby}
    answer_derivation: {kind: render_frame, frame: {text: "Czy {item} pan przyjść jutro?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mógłby changes to mogłaby when speaking to a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson02.translate.007
    lesson_content_key: pl.a2.unit25.lesson02.czy_moglby_pan_przyjsc
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Najszybciej comes from szybko, quickly.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson03.choose.001
    lesson_content_key: pl.a2.unit25.lesson03.rozmowa_z_administratorem
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Rano means in the morning and has no ending.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson03.listen.002
    lesson_content_key: pl.a2.unit25.lesson03.rozmowa_z_administratorem
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Rano means in the morning and has no ending.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson03.order.003
    lesson_content_key: pl.a2.unit25.lesson03.rozmowa_z_administratorem
    type: word_order
    frame: {text: "Proszę przyjść jutro {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_rano}
    answer_derivation: {kind: render_frame, frame: {text: "Proszę przyjść jutro {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Jutro rano means tomorrow morning.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson03.fill.004
    lesson_content_key: pl.a2.unit25.lesson03.rozmowa_z_administratorem
    type: fill_in_blank
    frame: {text: "Do {item} jutro. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_zobaczenia, hint: *s_zobaczenia}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Do zobaczenia is the usual way to say see you.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson03.translate.005
    lesson_content_key: pl.a2.unit25.lesson03.rozmowa_z_administratorem
    type: translation
    frame: {text: "See you tomorrow.", language_code: en, direction: ltr}
    slots: {item: *s_zobaczenia}
    answer_derivation: {kind: render_frame, frame: {text: "Do {item} jutro.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Do zobaczenia literally means until seeing.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit25.lesson03.translate.006
    lesson_content_key: pl.a2.unit25.lesson03.rozmowa_z_administratorem
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Time words such as rano and jutro stay unchanged.", language_code: en, direction: ltr}
