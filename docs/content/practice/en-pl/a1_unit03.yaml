schema_version: "1.0"
pack_key: practice.en-pl.a1.unit03
source_language: en
target_language: pl
unit_content_key: pl.a1.unit03.dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job A) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u03*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani where it matters.
    Reviewer: weekday pool for the w-frame is limited to poniedziałek, czwartek, piątek (wtorek takes we; feminine days change ending).
    Feedback lines carry a usage or grammar point, never the task or the answer.
    Opus pass (2026-10-24): converted the 'What day of the week is it today?' translation to word_order (Jaki jest dziś dzień tygodnia? was an equally natural answer the grader would reject); corrected the month-ending claim in a feedback line (lutego).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_poniedziałek, w_wtorek, w_środa, w_czwartek, w_piątek, w_sobota, w_niedziela, w_dziś, w_tygodnia, w_styczeń, w_luty, w_marzec, w_kwiecień, w_maj, w_czerwiec, w_lipiec, w_sierpień, w_wrzesień, w_październik, w_listopad, w_grudzień, w_urodziny, w_kiedy, w_spotkanie, w_maja, w_lutego, w_możemy, w_znowu, w_spotkać, w_panu, w_odpowiada, w_ci, w_data, w_jaka, w_będzie, w_świetnie]
slot_presets:
  u03_wd: &u03_wd {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_poniedziałek, w_wtorek, w_środa, w_czwartek, w_piątek, w_sobota, w_niedziela]}}
  u03_wdt: &u03_wdt {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_poniedziałek, w_wtorek, w_środa, w_czwartek, w_piątek, w_sobota, w_niedziela]}}
  u03_wdm: &u03_wdm {language_code: pl, part_of_speech: [adverb, noun], agreement_tags: {semantic: [w_poniedziałek, w_wtorek, w_środa, w_czwartek, w_piątek, w_sobota, w_niedziela, w_dziś, w_tygodnia]}}
  wd_masc: &wd_masc {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_poniedziałek, w_czwartek, w_piątek]}}
  s_piatek: &s_piatek {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_piątek}}
  s_tygodnia: &s_tygodnia {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_tygodnia}}
  u03_l2: &u03_l2 {language_code: pl, part_of_speech: [particle, noun], agreement_tags: {semantic: [w_styczeń, w_luty, w_marzec, w_kwiecień, w_maj, w_czerwiec, w_lipiec, w_sierpień, w_wrzesień, w_październik, w_listopad, w_grudzień, w_urodziny, w_kiedy, w_spotkanie]}}
  u03_l2t: &u03_l2t {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_styczeń, w_luty, w_marzec, w_kwiecień, w_maj, w_czerwiec, w_lipiec, w_sierpień, w_wrzesień, w_październik, w_listopad, w_grudzień, w_urodziny, w_spotkanie]}}
  u03_l2m: &u03_l2m {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_styczeń, w_luty, w_marzec, w_kwiecień, w_maj, w_czerwiec, w_lipiec, w_sierpień, w_wrzesień, w_październik, w_listopad, w_grudzień]}}
  maja_lut: &maja_lut {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_maja, w_lutego]}}
  s_urodziny: &s_urodziny {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_urodziny}}
  s_spotkanie: &s_spotkanie {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_spotkanie}}
  u03_l3: &u03_l3 {language_code: pl, part_of_speech: [pronoun, adverb, verb, noun], agreement_tags: {semantic: [w_możemy, w_znowu, w_spotkać, w_panu, w_odpowiada, w_ci, w_data, w_jaka, w_będzie, w_świetnie]}}
  u03_l3t: &u03_l3t {language_code: pl, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_możemy, w_znowu, w_spotkać, w_data, w_świetnie, w_będzie]}}
  panu_ci: &panu_ci {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: [w_panu, w_ci]}}
  s_spotkac: &s_spotkac {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_spotkać}}
templates:
  - content_key: practice.en-pl.pl.a1.unit03.lesson01.choose.001
    lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u03_wd}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish weekdays and months are written with a small first letter, unlike English Monday or May.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson01.translate.002
    lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u03_wdt}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Środa, sobota and niedziela end in -a, while the other four weekdays end in a consonant; this ending difference matters in the phrase w + day.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson01.match.003
    lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u03_wdm, second: *u03_wdm, third: *u03_wdm, fourth: *u03_wdm, fifth: *u03_wdm, sixth: *u03_wdm}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Dziś means today, and tygodnia is a changed form of the word for week, as in dzień tygodnia.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson01.order.004
    lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
    type: word_order
    frame: {text: "W {item} idę do kina.", language_code: pl, direction: ltr}
    slots: {item: *wd_masc}
    answer_derivation: {kind: render_frame, frame: {text: "W {item} idę do kina.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "With w (on), poniedziałek, czwartek and piątek keep their form, but wtorek becomes we wtorek to be easier to pronounce.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson01.fill.005
    lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
    type: fill_in_blank
    frame: {text: "W {item} idę do kina. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_piatek, hint: *s_piatek}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Idę do kina is I am going to the movies, and w + weekday says on that day.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson01.order.006
    lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
    type: word_order
    frame: {text: "Jaki dziś jest dzień {item}?", language_code: pl, direction: ltr}
    slots: {item: *s_tygodnia}
    answer_derivation: {kind: render_frame, frame: {text: "Jaki dziś jest dzień {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Dzień tygodnia means day of the week, and the second word changes its ending to tygodnia.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.choose.001
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u03_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish month names do not need a capital letter and have no prefix or article.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.listen.002
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u03_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "In a spoken date the day comes first and ends in -ego, followed by the month in its date form, usually ending in -a (dziesiątego maja) but lutego for February.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.translate.003
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u03_l2t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Polish months are not capitalised, and urodziny (birthday) is always plural.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.match.004
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u03_l2m, second: *u03_l2m, third: *u03_l2m, fourth: *u03_l2m, fifth: *u03_l2m, sixth: *u03_l2m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Some months end in -eń (styczeń, kwiecień, sierpień, wrzesień), which helps you spot them.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.order.005
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: word_order
    frame: {text: "Spotkanie jest piętnastego {item}.", language_code: pl, direction: ltr}
    slots: {item: *maja_lut}
    answer_derivation: {kind: render_frame, frame: {text: "Spotkanie jest piętnastego {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "In a date the day ends in -ego and the month takes -a, except lutego for February.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.fill.006
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: fill_in_blank
    frame: {text: "Kiedy są twoje {item}? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_urodziny, hint: *s_urodziny}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Urodziny is plural in Polish, so the verb is są (are) rather than jest.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson02.translate.007
    lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
    type: translation
    frame: {text: "When is the meeting?", language_code: en, direction: ltr}
    slots: {item: *s_spotkanie}
    answer_derivation: {kind: render_frame, frame: {text: "Kiedy jest {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Kiedy asks when, and a singular noun like spotkanie takes jest.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson03.choose.001
    lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u03_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Panu and ci both mean to you; panu is formal for a man and ci is informal.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson03.translate.002
    lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u03_l3t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Możemy is the we form of the verb can, as in Kiedy możemy się znowu spotkać?", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson03.order.003
    lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
    type: word_order
    frame: {text: "Czy piątek {item} odpowiada?", language_code: pl, direction: ltr}
    slots: {item: *panu_ci}
    answer_derivation: {kind: render_frame, frame: {text: "Czy piątek {item} odpowiada?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Odpowiada takes the person who is asked in the dative: panu (formal, to a man) or ci (informal).", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit03.lesson03.fill.004
    lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
    type: fill_in_blank
    frame: {text: "Kiedy możemy się znowu {item}? ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_spotkac, hint: *s_spotkac}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After możemy the second verb stays in its basic form, spotkać.", language_code: en, direction: ltr}
