schema_version: "1.0"
pack_key: practice.en-pl.a2.unit24
source_language: en
target_language: pl
unit_content_key: pl.a2.unit24.u_lekarza
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-pl A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_pl.py (a2 course, tags pl_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and ty/pan/pani where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the case-ending notes in feedback (genitive after potrzebować/szukać/od, object forms)
    and the polite conditional forms (chciałabym/chciałbym, mógłby).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_gardło, w_boli, w_mnie, w_gorączka, w_gorączkę, w_trzy, w_dwa, w_trzech, w_powinna, w_powinnam, w_lekarstwo, w_brać, w_razy, w_dziennie, w_wrócić, w_tydzień]
slot_presets:
  pool1: &pool1 {language_code: pl, part_of_speech: [noun, pronoun, verb, adjective], agreement_tags: {semantic: [w_gardło, w_boli, w_mnie, w_gorączka, w_gorączkę, w_trzy, w_dwa]}}
  pool2: &pool2 {language_code: pl, part_of_speech: [noun, pronoun, verb, adjective], agreement_tags: {semantic: [w_gardło, w_boli, w_mnie, w_gorączka, w_gorączkę, w_trzy, w_dwa, w_trzech]}}
  s_mnie: &s_mnie {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_mnie}}
  s_goraczke: &s_goraczke {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_gorączkę}}
  s_gardlo: &s_gardlo {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_gardło}}
  pool3: &pool3 {language_code: pl, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_gardło, w_boli, w_gorączka, w_gorączkę, w_dwa, w_trzy, w_trzech]}}
  pool4: &pool4 {language_code: pl, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: [w_powinna, w_powinnam, w_lekarstwo, w_brać, w_razy, w_dziennie]}}
  pool5: &pool5 {language_code: pl, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: [w_gardło, w_boli, w_gorączka, w_lekarstwo, w_brać, w_razy, w_dziennie, w_powinnam]}}
  s_brac: &s_brac {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_brać}}
  s_razy: &s_razy {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_razy}}
  s_lekarstwo: &s_lekarstwo {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_lekarstwo}}
  s_powinnam: &s_powinnam {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_powinnam}}
  pool6: &pool6 {language_code: pl, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_wrócić, w_tydzień, w_gorączka, w_lekarstwo, w_brać, w_razy]}}
  s_tydzien: &s_tydzien {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_tydzień}}
  s_wrocic: &s_wrocic {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_wrócić}}
templates:
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.choose.001
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Boli mnie gardło literally says it hurts me, the throat.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.listen.002
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Boli mnie gardło literally says it hurts me, the throat.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.match.003
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool2, second: *pool2, third: *pool2, fourth: *pool2, fifth: *pool2, sixth: *pool2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Gorączka is the basic form; mam gorączkę uses the object form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.order.004
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: word_order
    frame: {text: "Boli {item} gardło.", language_code: pl, direction: ltr}
    slots: {item: *s_mnie}
    answer_derivation: {kind: render_frame, frame: {text: "Boli {item} gardło.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Pain is expressed with the verb boli plus mnie for the person.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.fill.005
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: fill_in_blank
    frame: {text: "Mam {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_goraczke, hint: *s_goraczke}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mam is followed by the object form gorączkę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.translate.006
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: translation
    frame: {text: "My throat hurts. (Begin with the verb.)", language_code: en, direction: ltr}
    slots: {item: *s_gardlo}
    answer_derivation: {kind: render_frame, frame: {text: "Boli mnie {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Boli mnie plus the sore body part is the usual pattern.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.translate.007
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: translation
    frame: {text: "I have a fever.", language_code: en, direction: ltr}
    slots: {item: *s_goraczke}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Gorączka changes to gorączkę as the object.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson01.translate.008
    lesson_content_key: pl.a2.unit24.lesson01.slownictwo_medyczne
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Od trzech dni means for three days; the genitive trzech follows od.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.choose.001
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Powinnam is said by a woman about herself; powinna is used about her or to her with pani.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.listen.002
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Powinnam is said by a woman about herself; powinna is used about her or to her with pani.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.match.003
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *pool5, second: *pool5, third: *pool5, fourth: *pool5, fifth: *pool5, sixth: *pool5}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Dwa razy dziennie means twice a day.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.order.004
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: word_order
    frame: {text: "Muszę {item} lekarstwo.", language_code: pl, direction: ltr}
    slots: {item: *s_brac}
    answer_derivation: {kind: render_frame, frame: {text: "Muszę {item} lekarstwo.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Brać lekarstwo is the usual phrase for taking medicine regularly.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.fill.005
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: fill_in_blank
    frame: {text: "Biorę lekarstwo dwa {item} dziennie. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_razy, hint: *s_razy}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After dwa the noun raz takes the plural razy.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.translate.006
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: translation
    frame: {text: "I have to take medicine.", language_code: en, direction: ltr}
    slots: {item: *s_lekarstwo}
    answer_derivation: {kind: render_frame, frame: {text: "Muszę brać {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Muszę is followed by an infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.translate.007
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: translation
    frame: {text: "I should take the medicine. (spoken by a woman)", language_code: en, direction: ltr}
    slots: {item: *s_powinnam}
    answer_derivation: {kind: render_frame, frame: {text: "{item} brać lekarstwo.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Powinnam is followed by an infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson02.translate.008
    lesson_content_key: pl.a2.unit24.lesson02.jak_dlugo_i_jak_bardzo
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dziennie means per day and is placed after the frequency.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson03.choose.001
    lesson_content_key: pl.a2.unit24.lesson03.wizyta_u_lekarza
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Za tydzień means in a week, counted from now.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson03.listen.002
    lesson_content_key: pl.a2.unit24.lesson03.wizyta_u_lekarza
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Za tydzień means in a week, counted from now.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson03.order.003
    lesson_content_key: pl.a2.unit24.lesson03.wizyta_u_lekarza
    type: word_order
    frame: {text: "Wracam za {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_tydzien}
    answer_derivation: {kind: render_frame, frame: {text: "Wracam za {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Za plus a time word means after that much time from now.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson03.fill.004
    lesson_content_key: pl.a2.unit24.lesson03.wizyta_u_lekarza
    type: fill_in_blank
    frame: {text: "Chcę {item} do domu. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_wrocic, hint: *s_wrocic}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Chcę is followed by an infinitive: wrócić.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson03.translate.005
    lesson_content_key: pl.a2.unit24.lesson03.wizyta_u_lekarza
    type: translation
    frame: {text: "I want to return home.", language_code: en, direction: ltr}
    slots: {item: *s_wrocic}
    answer_derivation: {kind: render_frame, frame: {text: "Chcę {item} do domu.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Wrócić is the perfective verb for coming back once.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a2.unit24.lesson03.translate.006
    lesson_content_key: pl.a2.unit24.lesson03.wizyta_u_lekarza
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Tydzień is masculine and means a period of seven days.", language_code: en, direction: ltr}
