    frame: {text: 'W tym tygodniu mam pełny {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: My schedule is completely full this week. kalendarz means calendar; planner., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson04.fill.003
