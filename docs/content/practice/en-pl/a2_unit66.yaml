    kind: render_frame
    frame: {text: 'W {item} tygodniu mam więcej czasu.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Next week I''ll have more time. W przyszłym tygodniu (next week) contrasts with w tym tygodniu (this week), used earlier in this lesson. Both use w + locative.', language_code: en, direction: ltr}
