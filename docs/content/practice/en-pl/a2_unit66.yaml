  feedback_frame: {text: 'First I work, then I go exercise. Najpierw (first) and potem (then, after that) are the two most common sequencing words in Polish. They can be joined with a: Najpierw pracuję, a potem idę ćwiczyć.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson02.translate.004
  lesson_content_key: pl.a2.unit66.lesson02.najpierw_praca_potem_sport
  type: translation
  frame: {text: Finally I cook something for dinner., language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_końcu}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Na {item} gotuję coś na kolację.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Finally I cook something for dinner. Na końcu (finally, at the end) closes a sequence started with najpierw and continued with potem.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson03.order.002
  lesson_content_key: pl.a2.unit66.lesson03.tydzien_roboczy_i_weekend
  type: word_order
  frame: {text: 'W dzień {item} wstaję wcześnie.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_powszedni}
  answer_derivation:
    kind: render_frame
    frame: {text: 'W dzień {item} wstaję wcześnie.', language_code: pl, direction: ltr}
  feedback_frame: {text: On a weekday I get up early. powszedni means ordinary; everyday (of a weekday)., language_code: en, direction: ltr}
