  feedback_frame: {text: 'I have no free evening this week. After a negated verb the object is in the genitive: nie mam wolnego wieczoru. Wolny (free) agrees with the masculine wieczór.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson04.translate.004
