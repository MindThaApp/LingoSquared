    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_dnia}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Kolejność mojego {item} jest zawsze taka sama.', language_code: pl, direction: ltr}
  feedback_frame: {text: The order of my day is always the same. dnia means of the day., language_code: en, direction: ltr}
