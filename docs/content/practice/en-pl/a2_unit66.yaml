  lesson_content_key: pl.a2.unit66.lesson03.tydzien_roboczy_i_weekend
  type: fill_in_blank
  frame:
    text: W tygodniu {item} wcześnie, ale w weekend śpię długo. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_wstaję}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_wstaję}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'During the week I get up early, but on the weekend I sleep in. Spać długo (literally "to sleep long") is the Polish way to say you sleep in. Wstawać (to get up) is imperfective, because it is a daily habit: wstaję.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson03.translate.004
  lesson_content_key: pl.a2.unit66.lesson03.tydzien_roboczy_i_weekend
  type: translation
  frame: {text: 'Ewa: And on the weekend?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_weekend}
  answer_derivation:
    kind: render_frame
    frame: {text: 'A w {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Ewa: And on the weekend? weekend means weekend.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson04.order.002
  lesson_content_key: pl.a2.unit66.lesson04.pelny_kalendarz
