    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_potem}
    hint:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_potem}
