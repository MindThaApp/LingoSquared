    frame: {text: 'Co tydzień sprawdzam swój {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: I check my schedule every week. grafik means schedule., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson01.fill.003
  lesson_content_key: pl.a2.unit66.lesson01.w_poniedzialek_i_w
  type: fill_in_blank
  frame:
    text: W {item} pracuję, a w środę mam kurs. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_poniedziałek}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_poniedziałek}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'On Monday I work, and on Wednesday I have a course. W + accusative gives the day: w poniedziałek (on Monday), w środę (on Wednesday). Before a word that starts with w, w becomes we: we wtorek.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson01.translate.004
  lesson_content_key: pl.a2.unit66.lesson01.w_poniedzialek_i_w
  type: translation
  frame: {text: 'What do you usually do during the week?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_zwykle}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Co {item} robisz w tygodniu?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'What do you usually do during the week? W tygodniu (during the week, literally "in the week") refers to the weekdays as a group, in contrast to w weekend.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a2.unit66.lesson02.order.002
  lesson_content_key: pl.a2.unit66.lesson02.najpierw_praca_potem_sport
  type: word_order
  frame: {text: 'Kolejność mojego {item} jest zawsze taka sama.', language_code: pl, direction: ltr}
