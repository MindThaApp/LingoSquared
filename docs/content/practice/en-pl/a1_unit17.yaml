schema_version: "1.0"
pack_key: practice.en-pl.a1.unit17
source_language: en
target_language: pl
unit_content_key: pl.a1.unit17.praca
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job C) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u17*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors so every
    frame is grammatical (gender, case, number). Fixed English prompts name
    ty vs pan/pani and speaker gender where it matters, and are worded so only
    one natural Polish word order fits. Register follows the unit's
    realization (ty between friends, pan/pani when formal).
    Reviewer: profession forms after jest/jestem are glossed with the sex of the speaker in English prompts; lesson 3 has no first-sight lexemes.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_inżynier, w_nauczyciel, w_nauczycielka, w_inżynierem, w_nauczycielką, w_nauczycielem, w_pracujesz, w_szkoła, w_biuro, w_szkole, w_biurze]
slot_presets:
  u17_l1: &u17_l1 {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_inżynier, w_nauczyciel, w_nauczycielka, w_inżynierem, w_nauczycielką, w_nauczycielem]}}
  s_inzynierem: &s_inzynierem {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_inżynierem}}
  s_nauczycielka_ins: &s_nauczycielka_ins {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_nauczycielką}}
  s_nauczycielka: &s_nauczycielka {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_nauczycielką}}
  s_nauczycielem: &s_nauczycielem {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_nauczycielem}}
  u17_l2: &u17_l2 {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_pracujesz, w_szkoła, w_biuro, w_szkole, w_biurze]}}
  u17_l2m: &u17_l2m {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_pracujesz, w_szkoła, w_biuro, w_szkole, w_biurze, w_inżynier]}}
  s_szkole: &s_szkole {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_szkole}}
  s_biurze: &s_biurze {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_biurze}}
  s_pracujesz: &s_pracujesz {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_pracujesz}}
templates:
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.choose.001
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u17_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Nauczyciel is a male teacher and nauczycielka is a female teacher; the ending shows the person's sex.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.listen.002
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u17_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "After jest or jestem, a profession takes the ending -em or -ą: inżynier becomes inżynierem.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.match.003
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u17_l1, second: *u17_l1, third: *u17_l1, fourth: *u17_l1, fifth: *u17_l1, sixth: *u17_l1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The profession changes its ending after jestem or jest: nauczyciel to nauczycielem, nauczycielka to nauczycielką.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.order.004
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: word_order
    frame: {text: "Marek jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_inzynierem}
    answer_derivation: {kind: render_frame, frame: {text: "Marek jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After jest a profession takes the ending -em: inżynier becomes inżynierem.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.order.005
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: word_order
    frame: {text: "Ewa jest {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_nauczycielka_ins}
    answer_derivation: {kind: render_frame, frame: {text: "Ewa jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "A feminine profession ends in -ą after jest: nauczycielka becomes nauczycielką.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.fill.006
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: fill_in_blank
    frame: {text: "Ewa jest {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_nauczycielka, hint: *s_nauczycielka}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The feminine ending -ą matches Ewa.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.fill.007
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: fill_in_blank
    frame: {text: "Marek jest {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_inzynierem, hint: *s_inzynierem}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The profession after jest ends in -em.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.translate.008
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: translation
    frame: {text: "Marek is an engineer.", language_code: en, direction: ltr}
    slots: {item: *s_inzynierem}
    answer_derivation: {kind: render_frame, frame: {text: "Marek jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Polish uses no word for an, and the profession changes its ending instead.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.translate.009
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: translation
    frame: {text: "Ewa is a teacher.", language_code: en, direction: ltr}
    slots: {item: *s_nauczycielka}
    answer_derivation: {kind: render_frame, frame: {text: "Ewa jest {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Ewa is a woman, so the profession ends in -ą.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson01.translate.010
    lesson_content_key: pl.a1.unit17.lesson01.jestem_inzynierem
    type: translation
    frame: {text: "I am a teacher. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *s_nauczycielem}
    answer_derivation: {kind: render_frame, frame: {text: "Jestem {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "A man says nauczycielem; a woman says nauczycielką.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.choose.001
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u17_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pracujesz is the ty form of pracować, used with a friend.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.listen.002
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u17_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "After w the places change: szkoła becomes szkole and biuro becomes biurze.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.match.003
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u17_l2m, second: *u17_l2m, third: *u17_l2m, fourth: *u17_l2m, fifth: *u17_l2m, sixth: *u17_l2m}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Szkole and biurze are the forms used after w to say where.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.order.004
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: word_order
    frame: {text: "Pracuję w {item}.", language_code: pl, direction: ltr}
    slots: {item: *s_szkole}
    answer_derivation: {kind: render_frame, frame: {text: "Pracuję w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After w a feminine noun in -a ends in -e: szkoła becomes szkole.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.fill.005
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: fill_in_blank
    frame: {text: "Pracuję w {item}. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_biurze, hint: *s_biurze}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "W plus a place needs a special form of the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.translate.006
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: translation
    frame: {text: "Where do you work? (to a friend, ty)", language_code: en, direction: ltr}
    slots: {item: *s_pracujesz}
    answer_derivation: {kind: render_frame, frame: {text: "Gdzie {item}?", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Pracujesz is the ty form of pracować.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.translate.007
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: translation
    frame: {text: "I work at a school.", language_code: en, direction: ltr}
    slots: {item: *s_szkole}
    answer_derivation: {kind: render_frame, frame: {text: "Pracuję w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Szkoła is feminine, and after w it becomes szkole.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit17.lesson02.translate.008
    lesson_content_key: pl.a1.unit17.lesson02.gdzie_pracujesz
    type: translation
    frame: {text: "I work in an office.", language_code: en, direction: ltr}
    slots: {item: *s_biurze}
    answer_derivation: {kind: render_frame, frame: {text: "Pracuję w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Biuro becomes biurze after w.", language_code: en, direction: ltr}
