schema_version: "1.0"
pack_key: practice.en-pl.a1.unit05
source_language: en
target_language: pl
unit_content_key: pl.a1.unit05.family
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-pl wave, job A) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_pl.py
    (tags pl_a1_u05*, w_<token> anchors). Recognition and bare-word
    production pools are curated w_ lists of this unit's own tokens with
    pairwise distinct glosses; sentence frames use single anchors or short
    unions in which every member is grammatical in the frame. Fixed English
    prompts name ty vs pan/pani where it matters.
    Reviewer: tylko/lub glosses; family nouns with mój/moja frames use curated agreement-safe lists.
    Feedback lines carry a usage or grammar point, never the task or the answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_rodzina, w_matka, w_ojciec, w_brat, w_siostra, w_rodzice, w_dziadek, w_babcia, w_wujek, w_ciotka, w_syn, w_córka, w_mój, w_moja, w_moi, w_mieć, w_i, w_brata, w_siostrę, w_syna, w_córkę, w_lub, w_tylko, w_gdzie, w_on, w_ona, w_mieszka, w_ja, w_fajna, w_Gdańsku, w_Krakowie]
slot_presets:
  u05_l1: &u05_l1 {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_rodzina, w_matka, w_ojciec, w_brat, w_siostra, w_rodzice]}}
  u05_fam: &u05_fam {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_rodzina, w_matka, w_ojciec, w_brat, w_siostra, w_rodzice, w_dziadek, w_babcia, w_wujek, w_ciotka, w_syn, w_córka]}}
  masc_fam: &masc_fam {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_ojciec, w_brat, w_dziadek, w_wujek, w_syn]}}
  fem_fam: &fem_fam {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_rodzina, w_matka, w_siostra, w_babcia, w_ciotka, w_córka]}}
  s_moj: &s_moj {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_mój}}
  s_moja: &s_moja {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_moja}}
  s_moi: &s_moi {language_code: pl, part_of_speech: pronoun, agreement_tags: {semantic: w_moi}}
  u05_l2: &u05_l2 {language_code: pl, part_of_speech: [particle, verb, noun], agreement_tags: {semantic: [w_dziadek, w_babcia, w_wujek, w_ciotka, w_syn, w_córka, w_mieć, w_i]}}
  u05_l2t: &u05_l2t {language_code: pl, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_dziadek, w_babcia, w_wujek, w_ciotka, w_syn, w_córka, w_mieć]}}
  have_obj: &have_obj {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: [w_brata, w_siostrę, w_syna, w_córkę]}}
  s_i: &s_i {language_code: pl, part_of_speech: particle, agreement_tags: {semantic: w_i}}
  s_corke: &s_corke {language_code: pl, part_of_speech: noun, agreement_tags: {semantic: w_córkę}}
  u05_l3: &u05_l3 {language_code: pl, part_of_speech: [pronoun, particle, adjective, verb], agreement_tags: {semantic: [w_lub, w_tylko, w_gdzie, w_on, w_ona, w_mieszka, w_ja, w_fajna]}}
  u05_l3t: &u05_l3t {language_code: pl, part_of_speech: [pronoun, particle, verb], agreement_tags: {semantic: [w_lub, w_tylko, w_gdzie, w_on, w_ona, w_ja, w_mieszka]}}
  gdk: &gdk {language_code: pl, part_of_speech: proper_noun, agreement_tags: {semantic: [w_Gdańsku, w_Krakowie]}}
  s_mieszka: &s_mieszka {language_code: pl, part_of_speech: verb, agreement_tags: {semantic: w_mieszka}}
  s_Gdansku: &s_Gdansku {language_code: pl, part_of_speech: proper_noun, agreement_tags: {semantic: w_Gdańsku}}
templates:
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.choose.001
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u05_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish family words come in masculine and feminine pairs such as ojciec and matka or brat and siostra.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.listen.002
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: listen_select
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u05_l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Rodzice (parents) is always plural, so it takes moi rather than mój or moja.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.match.003
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: pl, direction: ltr}
    slots: {first: *u05_fam, second: *u05_fam, third: *u05_fam, fourth: *u05_fam, fifth: *u05_fam, sixth: *u05_fam}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Family words pair up by gender: dziadek and babcia, wujek and ciotka, syn and córka.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.order.004
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: word_order
    frame: {text: "To jest mój {item}.", language_code: pl, direction: ltr}
    slots: {item: *masc_fam}
    answer_derivation: {kind: render_frame, frame: {text: "To jest mój {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Mój goes with masculine nouns such as ojciec, brat and dziadek.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.order.005
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: word_order
    frame: {text: "To jest moja {item}.", language_code: pl, direction: ltr}
    slots: {item: *fem_fam}
    answer_derivation: {kind: render_frame, frame: {text: "To jest moja {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Moja goes with feminine nouns, most of which end in -a.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.fill.006
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: fill_in_blank
    frame: {text: "To jest {item} ojciec. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_moj, hint: *s_moj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The possessive agrees with the noun: mój ojciec, but moja matka.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.translate.007
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: translation
    frame: {text: "This is my mother.", language_code: en, direction: ltr}
    slots: {item: *s_moja}
    answer_derivation: {kind: render_frame, frame: {text: "To jest {item} matka.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Moja is the feminine my; the masculine my is mój.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson01.translate.008
    lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
    type: translation
    frame: {text: "These are my parents.", language_code: en, direction: ltr}
    slots: {item: *s_moi}
    answer_derivation: {kind: render_frame, frame: {text: "To są {item} rodzice.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Rodzice is plural and refers to people, so the possessive is moi; the verb is są instead of jest.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson02.choose.001
    lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u05_l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mieć means to have, and the person doing the having sets the verb form: mam, masz, ma.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson02.translate.002
    lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u05_l2t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mieć (to have) is the dictionary form; in sentences it appears as mam, masz or ma.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson02.order.003
    lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
    type: word_order
    frame: {text: "Mam {item}.", language_code: pl, direction: ltr}
    slots: {item: *have_obj}
    answer_derivation: {kind: render_frame, frame: {text: "Mam {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After mam the thing you have takes the object form: brat becomes brata and siostra becomes siostrę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson02.fill.004
    lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
    type: fill_in_blank
    frame: {text: "Tak, mam brata {item} siostrę. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_i, hint: *s_i}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "I links two things, as in brata i siostrę; it always stays short and unchanged.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson02.translate.005
    lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
    type: translation
    frame: {text: "I have a son and a daughter.", language_code: en, direction: ltr}
    slots: {item: *s_corke}
    answer_derivation: {kind: render_frame, frame: {text: "Mam syna i {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "Feminine nouns ending in -a change to -ę as objects: córka becomes córkę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson03.choose.001
    lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
    type: multiple_choice
    frame: {text: "{item}", language_code: pl, direction: ltr}
    slots: {item: *u05_l3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Polish uses on for he and ona for she, and the verb mieszka fits both.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson03.translate.002
    lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u05_l3t}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Tylko means only, while lub is an alternative-or, as in brata lub siostrę.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson03.order.003
    lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
    type: word_order
    frame: {text: "Mój brat mieszka w {item}.", language_code: pl, direction: ltr}
    slots: {item: *gdk}
    answer_derivation: {kind: render_frame, frame: {text: "Mój brat mieszka w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "After w, city names take a special ending, as in w Gdańsku and w Krakowie.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson03.fill.004
    lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
    type: fill_in_blank
    frame: {text: "Ona {item} w Krakowie. ({hint})", language_code: pl, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_mieszka, hint: *s_mieszka}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mieszka is the he/she form of the verb, and mieszkam from the first unit is the I form.", language_code: en, direction: ltr}
  - content_key: practice.en-pl.pl.a1.unit05.lesson03.translate.005
    lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
    type: translation
    frame: {text: "He lives in Gdańsk.", language_code: en, direction: ltr}
    slots: {item: *s_Gdansku}
    answer_derivation: {kind: render_frame, frame: {text: "On mieszka w {item}.", language_code: pl, direction: ltr}}
    feedback_frame: {text: "The ending -u after w marks where someone lives: w Gdańsku.", language_code: en, direction: ltr}
