  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_księgarnia, w_książka, w_powieść, w_szukam, w_powieści, w_tytuł, w_tytułem, w_autor, w_znany, w_książeczka, w_książki, w_popularna, w_książeczki, w_zakładka, w_zakładką, w_interesująca, w_sklepu, w_zoologicznego]
