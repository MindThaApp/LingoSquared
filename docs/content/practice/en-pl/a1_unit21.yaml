schema_version: '1.0'
pack_key: practice.en-pl.a1.unit21
source_language: en
target_language: pl
unit_content_key: pl.a1.unit21.emocje
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-pl backfill lexemes (tags pl_a1_u21 / w_<token>). 20 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_będziesz, w_czuje, w_deszcz, w_dumny, w_martw, w_myślę, w_mówiąc, w_naprawdę, w_nowe, w_pewno, w_pierwszą, w_pomaga, w_poradzisz, w_pracę, w_samodzielną, w_smutny, w_szczerze, w_szczęśliwy, w_zdenerwowany, w_zmianą]
templates:
- content_key: practice.en-pl.pl.a1.unit21.lesson01.choose.001
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_szczęśliwy, w_smutny, w_nowe, w_deszcz, w_zdenerwowany, w_pierwszą, w_zmianą, w_martw, w_czuje, w_samodzielną, w_pracę, w_myślę, w_szczerze, w_mówiąc, w_poradzisz, w_naprawdę, w_pomaga, w_pewno, w_będziesz, w_dumny]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on happy, sad, or angry?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson02.listen.001
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: listen_select
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on why are you happy?.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson03.translate.001
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nervous about something.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson04.match.001
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: pl, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Polish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson05.choose.001
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: multiple_choice
  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a message about feelings.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson06.translate.001
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on ewa reassures marek.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame: {text: 'Dlaczego jesteś {item}?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_szczęśliwy}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Dlaczego jesteś {item}?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Why are you happy? Dlaczego (why) is the standard question word for a reason.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_smutny}
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_smutny}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I am not angry, I am sad. Nie goes right before the verb: Nie jestem zły. The second clause then states the actual feeling.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame: {text: 'Jestem szczęśliwy, bo mam {item} mieszkanie.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_nowe}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Jestem szczęśliwy, bo mam {item} mieszkanie.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'I am happy because I have a new apartment. Bo (because) introduces the reason; after mam (I have) the noun is in the accusative: nowe mieszkanie.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_deszcz}
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags: {semantic: w_deszcz}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I am sad because it is raining. Pada deszcz (it is raining, literally ''rain falls'') is the usual weather phrase, here used as the reason.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame: {text: 'Jestem {item} przed pierwszą zmianą.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_zdenerwowany}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Jestem {item} przed pierwszą zmianą.', language_code: pl, direction: ltr}
  feedback_frame: {text: I am nervous about my first shift. zdenerwowany means nervous (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_pierwszą}
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags: {semantic: w_pierwszą}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Hi Marek, how are you feeling about your first shift? Przed pierwszą zmianą (about your first shift) reuses the przed + instrumental pattern from lesson 3. Czujesz się is the ty form.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame: {text: Don't worry., language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_martw}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nie {item} się.', language_code: pl, direction: ltr}
  feedback_frame: {text: Don't worry. Nie martw się (literally 'don't worry yourself') is the standard reassurance phrase; się is the reflexive pronoun., language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame: {text: 'Jak {item} się Marek?', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_czuje}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Jak {item} się Marek?', language_code: pl, direction: ltr}
  feedback_frame: {text: 'How does Marek feel? Czuć się (to feel, reflexive) is the standard way to ask about or describe an emotional state: Jak czuje się Marek?', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame: {text: 'Tak, ja też tak {item}.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_myślę}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tak, ja też tak {item}.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Yes, I think so too. Ja też tak myślę (literally ''I too think so'') is the natural way to agree; ja is added here for contrast.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame: {text: 'Szczerze {item}, jestem trochę zdenerwowany.', language_code: pl, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_mówiąc}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Szczerze {item}, jestem trochę zdenerwowany.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'I''m a bit nervous, honestly. Szczerze mówiąc (honestly, literally ''speaking sincerely'') softens the admission.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_poradzisz}
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags: {semantic: w_poradzisz}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Don''t worry, you can do it well! Dobrze sobie poradzisz (literally ''you will cope well'') is an encouraging fixed expression; poradzisz is the ty future of poradzić sobie.', language_code: en, direction: ltr}
- content_key: practice.en-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame: {text: 'Thanks, that really helps.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags: {semantic: w_naprawdę}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Dzięki, to {item} pomaga.', language_code: pl, direction: ltr}
  feedback_frame: {text: 'Thanks, that really helps. Pomaga is the on/ona/ono form of pomagać (to help); dzięki is informal ''thanks''.', language_code: en, direction: ltr}
