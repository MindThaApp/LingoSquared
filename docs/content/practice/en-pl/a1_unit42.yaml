  frame: {text: '{item}', language_code: pl, direction: ltr}
  slots:
    item: &id001
      language_code: pl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_zarezerwować, w_zameldować, w_zameldujemy, w_zarezerwowany, w_zaczyna, w_ósmej, w_wliczone, w_klucz, w_hasło, w_wifi, w_karcie, w_recepcjonista, w_rezerwację, w_noc, w_wymeldowanie, w_jedenastej, w_wymeldować, w_minął, w_mieliśmy, w_ładny]
