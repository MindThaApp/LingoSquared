templates:
- content_key: practice.ja-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 数字の単語は右から左へ読みます。ثلاثة は ث で始まり、この音は英語の think の th に近い音です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ثلاثة(3)と ثمانية(8)はどちらも ث(th の音)で始まります。残りの部分で見分けましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 「3」を表す ثلاثة は ة で終わります。この語尾は、ほかの多くのアラビア語の名詞にも見られます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: アラビア語には、2つのものを表す特別な双数の語尾 ـان があります。اثنان は「2」を表す単語そのものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 3から10までの数字は、数えるときに ة で終わります。ثلاثة や خمسة がその例です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: سبعة(7)と تسعة(9)は同じ عة で終わるので、最初の音(s と t)を聞き分けましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: word_order
  frame:
    text: رقمي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: رقمي は「私の番号」という意味です。رقم が「番号」で、語尾の ـي が「私の」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: fill_in_blank
  frame:
    text: ثمانية، تسعة، {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عشرة は「10」です。3から10までのほかの数字と同じように ة で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson02.translate.004
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ستة(6)と سبعة(7)はどちらも س で始まります。語尾の文字を読んで見分けましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson03.choose.001
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كم は「いくら」「いくつ」を尋ねる語で、هذا は近くにあるものを指します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson03.match.002
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بخمسة と بعشرة は ب で始まります。ここでの ب は「〜で」「〜の値段で」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson03.fill.003
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم هذا は1つのものの値段を尋ねます。هذا(これ)は男性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson03.translate.004
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وهذا は و(と、そして)と هذا(これ)が続けて書かれたもので、「そしてこれは」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson03.translate.005
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: これはいくらですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: アラビア語のこの質問には「です」にあたる語がありません。كم هذا は直訳すると「いくら これ」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit03.lesson03.translate.006
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: これは5です。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 前置詞 ب は数字にくっつけて書きます。ب + خمسة で بخمسة になります。
    language_code: ja
    direction: ltr
