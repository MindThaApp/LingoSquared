templates:
- content_key: practice.ja-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: アラビア語では語尾で持ち主を表します。اسم は「名前」、اسمي は「私の名前」、اسمك は「あなたの名前」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson01.match.002
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 語尾の ـي は「私の」(اسمي)、ـك は「あなたの」(اسمك)を表します。「あなたの」の書き方は、男性に対しても女性に対しても同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson01.fill.003
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما は「何」という意味なので、ما اسمك は直訳すると「何 あなたの名前」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson01.translate.004
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا(私)は、أنا سارة のような簡単な文で使います。日本語の「です」にあたる語は、アラビア語では不要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson01.translate.005
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: 私の名前は{item}です。
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 名前は音のとおりに書きます。アラビア語には大文字がありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson02.choose.001
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: لبنان や مصر のような国名には冠詞がつきませんが、الأردن、المغرب、العراق は ال が名前の一部になっています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson02.match.002
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 冠詞 ال は、الأردن、المغرب、العراق という名前の一部です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson02.order.003
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: word_order
  frame:
    text: أنا من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من は「~から」という意味なので、أنا من にその場所を続けると、出身地を言う文になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: fill_in_blank
  frame:
    text: من {item} أنت؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين は「どこ」という疑問詞です。من أين أنت は、男性にも女性にも「どちらの出身ですか」とたずねる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson02.translate.005
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنت は「あなた」という意味です。母音を書かない表記では、男性も女性も同じ形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: 私は{item}の出身です。
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: アラビア語には「です」にあたる語がありません。أنا من に場所を続けるだけで「私は~の出身です」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson03.listen.001
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: はい・いいえで答える質問は هل で始まり、「はい」の答えは نعم です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson03.order.002
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: word_order
  frame:
    text: سعدت {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: سعدت بلقائك は丁寧な別れ際のあいさつで、直訳すると「あなたに会えたことで私はうれしかった」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson03.fill.003
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: fill_in_blank
  frame:
    text: هل أنت من مصر؟ {item}، أنا من مصر. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نعم は「はい」という意味です。答えるときに、はい・いいえの疑問詞は必要ありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson03.translate.004
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: translation
  frame:
    text: お会いできてうれしいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بلقائك の語尾の ـك は、書くと男性も女性も同じ形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson04.choose.001
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: دائما は「いつも」という意味で、مرحبا بك のあとに続けると「いつでも歓迎します」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson04.fill.002
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: fill_in_blank
  frame:
    text: مرحبا بك {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مرحبا بك دائما は「いつでも歓迎します」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit02.lesson04.translate.003
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سعدت は過去形の動詞で、語尾の ـت が「私は」を表します。そのため「私はうれしかった」という意味になります。
    language_code: ja
    direction: ltr
