templates:
- content_key: practice.ja-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين は名詞の「右」で、اليسار は「左」に ال が付いた形です。冠詞 ال が付いて「左」になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit10.lesson01.listen.002
