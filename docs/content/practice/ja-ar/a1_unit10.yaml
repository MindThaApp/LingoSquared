  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام は「前」という意味で、إلى الأمام は「まっすぐ」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
