    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 動詞と女性形の時刻の序数です。動詞はすべて一人称です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.translate.009
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: 私は7時に起きます。(「私」にあたる単語は別にありません)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: الساعة が女性名詞なので、時刻は女性形の序数になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.translate.010
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: 私は9時に勉強します。(「私」にあたる単語は別にありません)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 一人称の動詞には代名詞が要りません。أدرس だけで「私は勉強します」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.translate.011
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: 私は10時に寝ます。(「私」にあたる単語は別にありません)
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: أنام في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: العاشرة は「10番目」で、ほかの女性形の時刻と同じく ة で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson02.listen.001
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماذا は「何」という疑問詞です。ماذا تفعل؟ は「何をしますか」とたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson02.choose.002
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفعل は「する」の男性に対する「あなた」の形です。ماذا تفعل كل يوم؟ は男性に毎日何をするかをたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson02.order.003
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: word_order
  frame:
    text: ماذا {item} كل يوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} كل يوم؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 動詞は ماذا のすぐ後に来ます。ماذا تفعل؟ は「何をしますか」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson02.fill.004
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: fill_in_blank
  frame:
    text: ماذا تفعل كل {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كل يوم は「毎日」で、كل(すべての)の後に يوم(日)が来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson02.translate.005
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفعل は男性に対する「あなた」の形で、「あなたはする」です。ماذا は「何」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson02.translate.006
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: 毎日何をしますか?(男性に対して)
    language_code: ja
    direction: ltr
  slots:
    a: *id013
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b} كل يوم'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 疑問詞が先、その後に動詞が来ます:ماذا تفعل。
    language_code: ja
    direction: ltr
