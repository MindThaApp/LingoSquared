templates:
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.choose.001
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أستيقظ、أدرس、أنام はどれも一人称の現在形の動詞で、「私は起きる」「私は勉強する」「私は寝る」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.listen.002
