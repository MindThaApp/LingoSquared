    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.order.005
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أنا {item} كل يوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} كل يوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: この課の動詞は一人称です:أستيقظ、أدرس、أنام。أنا(私)は省略できます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.order.006
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أستيقظ في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 時刻は الساعة の後に置かれ、女性形になります:الساعة السابعة。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.fill.007
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: fill_in_blank
  frame:
