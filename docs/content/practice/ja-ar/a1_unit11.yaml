  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كل يوم は「毎日」です。كل(すべての)+ يوم(日)でできています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.match.003
