    - sixth
  feedback_frame:
    text: كل يوم は「毎日」、ماذا は「何」という疑問詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit11.lesson01.match.004
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: matching_pairs
