  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {item} من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 序数には ال がつきます。الخامس は「5番目」、السادس は「6番目」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson02.fill.004
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: fill_in_blank
  frame:
