  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 月は من の後ろに来るので、اليوم الخامس من يونيو は「今日は6月5日です」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson02.order.005
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: الدرس {item} الخامس من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {item} الخامس من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 日付の前の في は「その日に」という意味です:في الخامس من مايو。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson02.translate.006
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
