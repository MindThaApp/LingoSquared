    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟ は、今日の日付をたずねるときの一般的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson01.translate.005
  lesson_content_key: ar.a1.unit04.lesson01.date_words
