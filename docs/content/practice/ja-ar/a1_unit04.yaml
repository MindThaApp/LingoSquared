    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: في は「〜に・〜で」という意味で、独立した1語として書きます。次の語にくっつく ب とは違います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson02.order.003
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
