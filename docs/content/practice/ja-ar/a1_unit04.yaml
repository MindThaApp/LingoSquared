      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 月の名前は1語で書きます。مايو は5月、يونيو は6月です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson01.translate.006
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: 今日は何日ですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 日付の質問は、ما(何)と تاريخ(日付)と اليوم(今日)でできています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الخامس(5番目)のような序数には ال がつきます。ここでは男性名詞 يوم(日)を指すので男性形です。
    language_code: ja
    direction: ltr
