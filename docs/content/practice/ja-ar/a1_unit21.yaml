templates:
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.choose.001
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ملابس は「服」、قميص は「シャツ」、أزرق は「青い」(男性形)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.listen.002
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد قميصا أزرق は「青いシャツがほしいです」の意味です。ほしい物であるシャツには、語尾 ـا がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.order.003
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد {item} أزرق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} أزرق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد の後のほしい物は、タンウィーンで終わります:قميصا。色は名詞の後ろに続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.order.004
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد قميصا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد قميصا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 形容詞は名詞の後ろに来て、名詞に一致します:قميصا أزرق。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.fill.005
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: fill_in_blank
  frame:
    text: أريد {item} أزرق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قميصا は、أريد の後でほしい物を表すときの形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.translate.006
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ملابس は「服」を表す複数名詞です。قميص は1枚のシャツ、أزرق は色を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.translate.007
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: 服がほしいです。(「私」にあたる単語はありません)
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد だけで「私はほしい」の意味なので、أنا は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson01.translate.008
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: 青いシャツがほしいです。(「私」にあたる単語はありません)
    language_code: ja
    direction: ltr
  slots:
    a: *id002
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 名詞には目的語の語尾 ـا がつき、色はその後ろに続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.choose.001
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: المقاس は ال がついた「サイズ」です。店員は ما المقاس؟ とたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.listen.002
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مقاس متوسط は「中サイズ」の意味で、متوسط は「中くらいの」の意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.order.003
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: ما {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المقاس؟ は「サイズは何ですか」の意味です。特定のサイズなので ال がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.order.004
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: مقاس {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: مقاس {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 形容詞は名詞の後ろに来ます:مقاس متوسط は「中サイズ」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.order.005
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: تفضلي. {item} بعشرة دراهم.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: تفضلي. {item} بعشرة دراهم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 店員は女性に تفضلي と言い、そのあと ال をつけてシャツを指します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.fill.006
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: fill_in_blank
