      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ال がつくと「そのサイズ」の意味になります:ما المقاس؟
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.fill.007
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: fill_in_blank
  frame:
    text: مقاس {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متوسط は「中くらいの」の意味で、名詞 مقاس の後ろに来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.translate.008
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 買い物でよく使う単語です:サイズ、中くらいの、服、青い、シャツ。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.translate.009
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: サイズは何ですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: アラビア語には「です」にあたる語は要りません:ما المقاس؟ は直訳すると「何 サイズ」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit21.lesson02.translate.010
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: 青いシャツがほしいです。中サイズです。(「私」にあたる単語はありません)
    language_code: ja
    direction: ltr
  slots:
    a: *id002
    b: *id003
    c: *id010
    d: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} {b}. {c} {d}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مقاس متوسط だけで、店員の質問 ما المقاس؟ への短い答えになります。
    language_code: ja
    direction: ltr
