  feedback_frame:
    text: العمل には ال が付いているので「その仕事」です。في العمل は「職場で」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit18.lesson02.order.003
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
