templates:
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.choose.001
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تذكرة は切符、القطار は列車、القاهرة はカイロです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.listen.002
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: إلى は「~へ」という意味なので、إلى القاهرة は「カイロへ」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.match.003
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي(どの)は単数名詞の前に置き、الثاني(2番目の)は説明する名詞の後ろに置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.order.004
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد {item} إلى القاهرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ほしいものは أريد の後ろに続き、إلى(~へ)が目的地を導きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.order.005
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد تذكرة إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد تذكرة إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 目的地は إلى の直後に置きます。القاهرة の ال は、都市名の一部です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.fill.006
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: fill_in_blank
  frame:
    text: أريد {item} إلى القاهرة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تذكرة は切符です。أريد(私は~がほしい)には、「私」を表す別の語は不要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.translate.007
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これらは一般的な名詞2語と都市名です。القاهرة の ال は、名前そのものの一部です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.translate.008
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: カイロ行きの切符をお願いします。(「私」を表す別の語はありません)
    language_code: ja
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 切符を頼む文は、أريد+切符+إلى+目的地という形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson01.translate.009
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: 切符がほしいです。列車は5時です。(「私」を表す別の語はありません)
    language_code: ja
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 時刻は、في الساعة+女性形の序数で表します：الساعة الخامسة。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.choose.001
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الرصيف は「ホーム」です。特定のホームなので ال が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.listen.002
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الثاني は男性形の「2番目の」で、男性名詞の الرصيف に合わせた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.order.003
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من أي {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من أي {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أي(どの)の後ろの名詞には ال が付きません：من أي رصيف؟ は「どのホームから？」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.order.004
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من الرصيف {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من الرصيف {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 序数は名詞の後ろに置き、ال も付きます：الرصيف الثاني。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.fill.005
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من أي {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أي の後ろの名詞には ال が付きません：من أي رصيف؟
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.fill.006
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من الرصيف {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 序数には名詞と同じく ال が付きます：الرصيف الثاني。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.translate.007
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これらの語はホームについて話すときに使います。أي は「どの」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.translate.008
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: どのホームからですか？
    language_code: ja
    direction: ltr
  slots:
    a: *id010
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 質問の形は、من+أي+ال の付かない名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit16.lesson02.translate.009
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: 2番目のホームからです。
    language_code: ja
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 名詞にも序数にも ال が付きます：الرصيف الثاني。
    language_code: ja
    direction: ltr
