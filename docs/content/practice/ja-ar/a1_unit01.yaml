    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عفوا は شكرا に対する標準的な返事で、مع السلامة は日常的な「さようなら」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson02.order.003
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: word_order
  frame:
    text: شكرا، مع {item}!
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}!
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مع السلامة は直訳すると「無事とともに」です。ال は「その」にあたる語で、名詞にくっつけて書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson02.translate.004
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: translation
  frame:
    text: ありがとう、さようなら。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 定冠詞 ال は名詞の前にくっつけます。سلامة(無事)は السلامة(その無事)になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson03.choose.001
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: あいさつの多くは、あいさつとその決まった返事がペアになっています。たとえば صباح الخير と صباح النور です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson03.order.002
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: word_order
  frame:
    text: أهلا وسهلا! أهلا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أهلا وسهلا! أهلا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بك は「あなたに」という意味で、書いた形は男性でも女性でも同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson03.fill.003
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: fill_in_blank
  frame:
    text: تصبح على {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تصبح على خير は、直訳すると「良いことの中で朝を迎えますように」という願いで、夜に別れるときに言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson03.translate.004
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: النور や اللقاء の ال は、アラビア語の「その」にあたる語で、名詞にくっつけて書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson03.translate.005
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: おやすみなさい!(男性に)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: تصبح على {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 女性に言うときは、動詞の語尾が ـين になります:تصبحين على خير。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson04.choose.001
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ممتاز は男性形です。女性は ممتازة と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson04.match.002
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الحمد لله は直訳すると「神に称賛あれ」で、「お元気ですか」への非常によくある答えです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson04.order.003
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: word_order
  frame:
    text: بخير، {item} لله.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: بخير، {item} لله.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: الحمد の後ろには لله が来ます。これは ل(〜のために)と الله(神)がつながった形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson04.fill.004
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: fill_in_blank
  frame:
    text: كيف {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: حال は「状態」「調子」という意味で、語尾の ـك は「あなたの」という意味です。つまりこの質問は直訳すると「あなたの調子はどうですか」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson04.translate.005
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأنت は و(そして)が أنت(あなた)にくっついた形で、「そしてあなたは」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson04.translate.006
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: お元気ですか?(男性に)
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: كيف {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 書かれた حالك は男性にも女性にも同じ形です。話すときだけ、語末の短母音が異なります。
    language_code: ja
    direction: ltr
