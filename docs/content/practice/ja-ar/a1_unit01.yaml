    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson01.translate.003
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: アラビア語の綴りでは、短母音はふつう書きません。読み手が単語から補って読みます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson02.listen.001
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: アラビア語のあいさつは時間帯で変わります。午前は صباح الخير、午後からは مساء الخير です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit01.lesson02.match.002
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
