- content_key: practice.ja-ar.ar.a1.unit01.lesson01.choose.001
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: アラビア語は右から左へ書きます。また、ر と ا は後ろの文字とつながりません。
    language_code: ja
    direction: ltr
