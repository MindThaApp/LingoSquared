      text: التفاح بعشرة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 数字の前の ب は値段を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit08.lesson02.listen.001
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفاحتين は تفاحة(りんご1個)に双数の語尾 ـين がついた形です。ة は ت に変わり、ちょうど2つのりんごを表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit08.lesson02.order.002
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: word_order
  frame:
    text: أريد {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: アラビア語には特別な双数形があります。تفاحتين は「りんご2つ」を表し、「2」を表す別の単語は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit08.lesson02.fill.003
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: fill_in_blank
  frame:
    text: أريد {item} من فضلك. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 双数の語尾 ـين は「2つの〜」を表します。この語尾の前では、تفاحة の ة が ت と書かれ、تفاحتين となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit08.lesson02.translate.004
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
