    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.translate.007
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: パンはいかがですか？（女性に対して）
    language_code: ja
    direction: ltr
  slots:
    a: *id011
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 語尾の ـين は女性に対する「あなた」の形を表し、ほしいものとしてのパンは خبزا と書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.translate.008
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: パン一切れ
    language_code: ja
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} خبز {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة は قطعة の後に来て、その女性という性に合わせます。
    language_code: ja
    direction: ltr
