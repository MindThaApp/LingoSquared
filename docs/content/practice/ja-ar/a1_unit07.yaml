  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قطعة は「切れ・かたまり」という意味で、قطعة خبز は「パン一切れ」です。次の واحدة（一つ）はそれに合わせた形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.order.003
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: هل تريدين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل تريدين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل は文を「はい・いいえ」で答える疑問文にします。خبزا は「ほしいもの」としてのパンです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.order.004
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: نعم، أريد قطعة خبز {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: نعم، أريد قطعة خبز {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة は女性形の「一つ」で、女性名詞の قطعة に合わせています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.fill.005
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: fill_in_blank
  frame:
    text: هل {item} خبزا؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تريدين は「あなた（女性）がほしい」なので、هل تريدين خبزا؟ は女性に「パンはいかがですか？」と尋ねる文です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.translate.006
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: ja
