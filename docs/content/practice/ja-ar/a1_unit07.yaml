  feedback_frame:
    text: تريدين は「ほしい」の女性に対する形です。男性に話しかけるときは別の語尾になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit07.lesson02.choose.002
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: multiple_choice
  frame:
