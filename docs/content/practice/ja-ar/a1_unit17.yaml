templates:
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.choose.001
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ألم は「痛み」です。الرأس は「頭」、البطن は「お腹」で、どちらも ال が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.listen.002
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندي ألم في الرأس は「頭が痛いです」という意味です。体の部位には ال が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.order.003
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: word_order
  frame:
    text: عندي ألم في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في(〜に、〜で)の後には、ال の付いた体の部位が来ます:في الرأس、في البطن。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.fill.004
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: fill_in_blank
  frame:
    text: عندي ألم في {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 頭は الرأس です。この文は「頭が痛いです」と言っています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم は「痛み」という意味の名詞です。2つの体の部位も ال の付いた名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: 頭が痛いです。
    language_code: ja
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي(私は〜を持っている)には動詞が要りません:عندي ألم で「痛みがあります」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson01.translate.007
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: お腹が痛いです。
    language_code: ja
    direction: ltr
  slots:
    a: *id004
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في の後でも、体の部位には ال が付いたままです:في البطن。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.choose.001
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحتاج は「私は必要とする」、مساعدة は「助け」です。動詞に「私」を表す別の語は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.listen.002
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اشربي は女性に言う命令形で、「飲んで」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.match.003
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اشربي と استريحي は女性への命令形です。أحتاج は「私は必要とする」です。المشكلة には ال が付いていて、「その問題」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.order.004
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: ما {item} يا ليلى؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} يا ليلى؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المشكلة؟ は「問題は何ですか」という意味です。يا ليلى は呼びかけです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.order.005
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: عندي ألم. أحتاج {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم. أحتاج {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أحتاج の直後に、必要なものが来ます:أحتاج مساعدة。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.order.006
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: يا ليلى {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 語末の ـي は、女性への命令を表します:اشربي ماء。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.fill.007
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: اشربي ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و は次の語にくっつけて書きます:واستريحي は「そして休んで」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.fill.008
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: عندي ألم. {item} مساعدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أحتاج は「私は必要とする」です。語頭の أ が「私」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.translate.009
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اشربي と استريحي は女性への命令形で、語末が ـي になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.translate.010
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: ライラ、水を飲んでください。(女性に対して)
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ユースフはライラに飲むように言います。اشربي は女性への命令形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit17.lesson02.translate.011
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: 痛みがあります。助けが必要です。(「私」を表す別の語は不要)
    language_code: ja
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي も أحتاج も形の中に「私」が含まれているので、أنا は要りません。
    language_code: ja
    direction: ltr
