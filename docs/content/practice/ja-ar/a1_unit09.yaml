  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب(近く)は、基準になる場所の前に置きます。ここでは「市場」です。
    language_code: ja
    direction: ltr
