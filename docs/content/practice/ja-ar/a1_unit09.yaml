  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أين は「どこ」とたずねる語です。場所を表す名詞には ال がつきます：図書館、市場、カフェなど。
    language_code: ja
    direction: ltr
