  feedback_frame:
    text: قرب のほかに余計な語は要りません。المقهى قرب المكتبة は「カフェは図書館の近くです」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit09.lesson02.order.004
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: وأين {item}؟
    language_code: ar
    direction: rtl
