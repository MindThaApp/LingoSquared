  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: 市場はどこですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: アラビア語には「です」にあたる語は要りません。أين السوق؟ は直訳すると「どこ、市場」です。
