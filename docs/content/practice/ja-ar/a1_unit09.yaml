  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هنا(ここ)は قرب の前に置けます：図書館はここ、市場の近くです。
    language_code: ja
    direction: ltr
