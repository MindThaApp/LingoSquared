    a: *id006
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 買ったものにはアリフの語尾が付きます：تفاحا。
    language_code: ja
    direction: ltr
