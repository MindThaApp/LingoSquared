  feedback_frame:
    text: ذهبت は「私は行きました」、اشتريت は「私は買いました」、تفاحا は「買ったもの」としてのりんごです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit13.lesson01.translate.007
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: 昨日、市場に行きました。(「私」にあたる単語はありません)
    language_code: ja
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} إلى السوق {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 過去形の語尾 -ت がすでに「私は」を表すので、代名詞は不要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit13.lesson01.translate.008
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
