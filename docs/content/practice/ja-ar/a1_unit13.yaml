- content_key: practice.ja-ar.ar.a1.unit13.lesson02.translate.007
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
