  feedback_frame:
    text: شربت は「私は飲みました」という意味です。同じ -ت で終わる ذهبت と比べてみましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit13.lesson02.match.003
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
