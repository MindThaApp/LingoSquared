  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: فعلت(あなたはしました)と شربت(私は飲みました)は、どちらも -ت の語尾が付いた過去形の動詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit13.lesson02.translate.008
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: ユースフがライラにたずねます。「昨日、何をしましたか？」
    language_code: ja
    direction: ltr
  slots:
    a: *id008
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت は過去形の「あなたは」の形で、男性に対しても女性に対しても書き方は同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit13.lesson02.translate.009
