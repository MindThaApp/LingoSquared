- content_key: practice.ja-ar.ar.a1.unit13.lesson02.fill.006
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: fill_in_blank
  frame:
    text: ماذا {item} أمس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
