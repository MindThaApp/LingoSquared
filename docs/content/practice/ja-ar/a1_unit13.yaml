    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} قهوة'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 過去形では「私は」を -ت の語尾で表します。شربت は「私は飲みました」です。
    language_code: ja
    direction: ltr
