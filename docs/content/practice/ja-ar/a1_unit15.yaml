templates:
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر、أصغر、أقرب は比較の語で、どれも後ろに من(〜より)が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 比較の形容詞は比較用の形が1つあり、後ろに من が続きます。أقرب من は「〜より近い」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 比較の語は比べる2つのものの間に置き、2つ目の前に من(〜より)を置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: アラビア語には「です」にあたる語は不要です。المقهى أصغر من السوق は、直訳すると「カフェ 小さい 市場より」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.fill.005
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: fill_in_blank
  frame:
    text: المقهى {item} من السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أصغر は「より小さい」です。同じパターンから أكبر(より大きい)もできます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.translate.006
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 比較の語はアラビア語の短い形容詞で、「もっと」にあたる別の語は不要です。後ろに من が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: カフェは市場より小さいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 比較の語は形が1つに決まっていて、後ろに من(〜より)が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: カフェは市場より近いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب は「近い」という考えから来た「より近い」で、後ろに من が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص は「より安い」です。ほかの比較の語と同じパターンです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: والسوق は、و(そして)と السوق(市場)が1語として書かれたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أرخص は「より安い」です。الماء أرخص من القهوة は「水はコーヒーより安いです」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 「より安い」も同じ比較のパターンで、後ろに من が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これらは4つの比較の語です：より大きい、より小さい、より近い、より安い。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: 水はコーヒーより安いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 比較の語は、2つ目のものの前に من を取ります。「コーヒーより安い」のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ar.ar.a1.unit15.lesson02.translate.007
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: カフェは市場より近く、市場はカフェより大きいです。
    language_code: ja
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: و(そして)は次の語の一部として書きます：والسوق。
    language_code: ja
    direction: ltr
