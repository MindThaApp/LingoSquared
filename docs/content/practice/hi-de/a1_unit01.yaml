  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'जर्मन में "आप/तुम" के लिए दो शब्द हैं: Sie औपचारिक है (अजनबी, अधिकारी), du अनौपचारिक है (दोस्त, परिवार, बच्चे)।'
    language_code: hi
    direction: ltr
