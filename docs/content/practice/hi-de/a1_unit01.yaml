  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss अनौपचारिक अलविदा है; Auf Wiedersehen अजनबियों और औपचारिक मौकों के लिए शिष्ट अलविदा है।
    language_code: hi
    direction: ltr
