    slot: item
  feedback_frame:
    text: Bitte का अर्थ "कृपया" भी है और "आपका स्वागत है" भी, और Entschuldigung किसी का ध्यान खींचने या माफ़ी माँगने के लिए कहा जाता है।
    language_code: hi
    direction: ltr
