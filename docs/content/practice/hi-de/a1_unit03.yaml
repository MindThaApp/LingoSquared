templates:
- content_key: practice.hi-de.de.a1.unit03.lesson01.choose.001
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eins संज्ञा से पहले ein बन जाता है (ein Jahr), लेकिन गिनती बोलते समय रूप eins ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-de.de.a1.unit03.lesson02.listen.001
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सोलह और सत्रह में मूल संख्याओं के कुछ अक्षर हट जाते हैं: sechzehn, siebzehn।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-de.de.a1.unit03.lesson03.choose.001
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'बीस से ऊपर की संख्याओं में इकाई पहले आती है: einundzwanzig का शाब्दिक अर्थ है "एक और बीस"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-de.de.a1.unit03.lesson05.listen.001
  lesson_content_key: de.a1.unit03.lesson05.im_gespraech_ueber_das_alter
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wenn ich fragen darf विनम्रता बढ़ाने वाला वाक्यांश है; इसका शाब्दिक अर्थ है "अगर मैं पूछ सकूँ"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-de.de.a1.unit03.lesson04.order.001
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
