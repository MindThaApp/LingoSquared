      language_code: de
      direction: ltr
  feedback_frame:
    text: 'जर्मन में उम्र बताने के लिए sein का प्रयोग होता है: Ich bin zwanzig Jahre alt, शाब्दिक अर्थ "मैं बीस साल का हूँ"।'
    language_code: hi
    direction: ltr
